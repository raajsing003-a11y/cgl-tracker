name: Update latest jobs
on:
  schedule:
    - cron: "30 */3 * * *"      # har 3 ghante (UTC)
  workflow_dispatch: {}          # manual "Run workflow" button
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Scrape + build Latest Job page
        run: python tracker.py --no-open --out tools/latestjob.html
      - name: Commit
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add data/jobs.json tools/latestjob.html
          git diff --cached --quiet || git commit -m "latest jobs update $(date -u +%F\ %H:%M)"
          git push
