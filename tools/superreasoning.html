<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Reasoning</title>
<style>
:root{--bg:#08070a;--cd:#161b22;--bd:#333038;--tx:#c6c3cb;--mu:#aaa5ad;--ac:#fbbf24;--gr:#4ade80;--rd:#f87171;--bt:#1a181d;--gl:#fbbf2414;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',Helvetica,Arial,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px 12px 64px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,var(--gl),transparent);min-height:64px}
.hd .tt{flex:1;min-width:0}
.hd b{display:block;font-size:20px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small{color:var(--ac);font-weight:700;font-size:11px;letter-spacing:1.4px}
.hbtn{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:6px 12px;font-size:13px}
.main{max-width:760px;margin:0 auto;padding:16px 14px 120px}
.sum{display:flex;gap:8px;margin-bottom:14px}
.sum div{flex:1;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:20px;color:var(--ac)}.sum span{font-size:11px;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row:active{border-color:var(--ac)}
.row .ic{font-size:24px;width:34px;text-align:center}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;line-height:1.3}
.row .tx small{color:var(--mu);font-size:12px}
.row .ar{color:var(--mu);font-size:22px}
.bar{height:5px;border-radius:3px;background:#26232b;margin-top:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .g{background:var(--gr)}.bar .r{background:var(--rd)}
.chips{display:flex;gap:8px;margin:2px 0 12px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--cd);border-radius:999px;padding:7px 14px;font-size:13px}
.chip.on{border-color:var(--rd);color:var(--rd);background:#f8717114}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.set{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:left}
.set b{display:block;font-size:15px}.set small{font-size:12px;color:var(--mu)}
.set.done{border-color:#4ade8055}
.qh{display:flex;align-items:center;justify-content:space-between;color:var(--mu);font-size:13px;margin-bottom:8px}
.qprog{height:4px;background:#26232b;border-radius:2px;margin-bottom:14px;overflow:hidden}.qprog i{display:block;height:100%;background:var(--ac)}
.q{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;white-space:pre-wrap;word-wrap:break-word;line-height:1.65;font-size:16px}
.q.long{font-size:15px;max-height:46vh;overflow:auto}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--bt);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:9px;line-height:1.5}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mu)}
.opt.ok{border-color:var(--gr);background:#4ade8018}.opt.ok .l{background:var(--gr);color:#08070a;border-color:var(--gr)}
.opt.bad{border-color:var(--rd);background:#f8717118}.opt.bad .l{background:var(--rd);color:#08070a;border-color:var(--rd)}
.opt:disabled{opacity:1;cursor:default}
.ex{background:#0d1117;border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:10px;padding:12px;margin:12px 0;font-size:14px;white-space:pre-wrap;line-height:1.65}
.hi{display:block;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);color:#e6e2ea}
.opt .oh{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.ex h4{margin:0 0 6px;font-size:12px;color:var(--ac);letter-spacing:1px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 30%);}
.nav button{flex:1;border:1px solid var(--bd);background:var(--cd);border-radius:12px;padding:13px;font-weight:600}
.nav button.p{background:var(--ac);color:#08070a;border-color:var(--ac)}
.nav button:disabled{opacity:.35}
.res{text-align:center;padding:24px 8px}
.res .big{font-size:48px;font-weight:800;color:var(--ac)}
.res .sub{color:var(--mu);margin-bottom:18px}
.res button{display:block;width:100%;margin-bottom:10px;border:1px solid var(--bd);background:var(--cd);border-radius:12px;padding:13px;font-weight:600}
.res button.p{background:var(--ac);color:#08070a;border-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.warn{color:var(--rd)}
</style>
</head>
<body>
<div class="hd"><div class="tt"><small>🏆 SUPER REASONING</small><b id="ttl">Saare chapters</b></div><button class="hbtn" id="hb" style="display:none"></button></div>
<div class="main" id="app"><div class="empty">Loading…</div></div>
<script>
(function(){
'use strict';
var BASE='../data/reasoning/', SZ=10, KEY='superreasoning_v1';
var $=function(i){return document.getElementById(i)}, app=$('app'), ttl=$('ttl'), hb=$('hb');
var IDX=null, CACHE={}, ST={}, view={}, cur=null;

/* ---------- storage: localStorage + IndexedDB mirror ---------- */
function load(){try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ST={}}if(!ST.q)ST.q={};if(!ST.pos)ST.pos={};}
var tm=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}clearTimeout(tm);tm=setTimeout(mirror,800)}
function idb(cb){try{var r=indexedDB.open('superreasoning_safe',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb(null)}}catch(e){cb(null)}}
function mirror(){idb(function(d){if(!d)return;try{d.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(ST),'st')}catch(e){}})}
function restore(done){if(Object.keys(ST.q).length){done();return}
  idb(function(d){if(!d){done();return}try{var g=d.transaction('kv').objectStore('kv').get('st');g.onsuccess=function(){if(g.result){try{ST=JSON.parse(g.result);if(!ST.q)ST.q={};if(!ST.pos)ST.pos={}}catch(e){}}done()};g.onerror=done}catch(e){done()}})}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(s){return esc(s).replace(/&lt;(\/?)(b|u|i|sup|sub)&gt;/g,'<$1$2>').replace(/&lt;img src="(https:\/\/[^"\s<>]+)"&gt;/g,'<img src="$1" style="max-width:100%;height:auto;vertical-align:middle">')}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function fetchJ(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function chData(k){return CACHE[k]?Promise.resolve(CACHE[k]):fetchJ(BASE+k+'.json').then(function(d){CACHE[k]=d;return d})}
function stat(list){var a=0,c=0;list.forEach(function(q){var s=ST.q[q.i];if(s){a++;if(s.ok)c++}});return{a:a,c:c,w:a-c,n:list.length}}
function barH(s){var n=s.n||1;return '<div class="bar"><i class="g" style="width:'+(s.c/n*100)+'%"></i><i class="r" style="width:'+(s.w/n*100)+'%"></i></div>'}
function head(t,btn){ttl.textContent=t;if(btn){hb.style.display='';hb.textContent=btn.t;hb.onclick=btn.f}else hb.style.display='none'}
function nav(h){var o=document.querySelector('.nav');if(o)o.remove();if(h){var n=el(h);document.body.appendChild(n)}}
window.scrollTo(0,0);

/* ---------- home ---------- */
function home(){
  view={s:'home'};nav();head('Saare chapters');
  var tA=0,tC=0,tN=IDX.total;
  var cnt=0;Object.keys(ST.q).forEach(function(k){cnt++;if(ST.q[k].ok)tC++});tA=cnt;
  var h='<div class="sum"><div><b>'+tN+'</b><span>Total</span></div><div><b>'+tA+'</b><span>Attempted</span></div><div><b style="color:var(--gr)">'+tC+'</b><span>Sahi</span></div><div><b style="color:var(--rd)">'+(tA-tC)+'</b><span>Galat</span></div></div>';
  IDX.chapters.forEach(function(c){
    var m=ST.chs&&ST.chs[c.key]||{a:0,c:0};
    h+='<button class="row" data-k="'+c.key+'"><span class="ic">'+c.icon+'</span><span class="tx"><b>'+esc(c.label)+'</b><small>'+c.n+' Q · '+Math.ceil(c.n/SZ)+' sets'+(m.a?' · '+m.a+' done, '+(m.a-m.c)+' galat':'')+'</small>'+barH({n:c.n,c:m.c,w:m.a-m.c})+'</span><span class="ar">&#8250;</span></button>';
  });
  app.innerHTML=h;
  app.querySelectorAll('.row').forEach(function(b){b.onclick=function(){openCh(b.dataset.k)}});
  window.scrollTo(0,0);
}
function refreshChMeta(k,list){ST.chs=ST.chs||{};var s=stat(list);ST.chs[k]={a:s.a,c:s.c}}
function bootMeta(){ /* lazily filled when a chapter is opened; recompute from ids not possible without data, so keep chs cache */ }

/* ---------- chapter: set list ---------- */
function openCh(k){
  app.innerHTML='<div class="empty">Loading…</div>';
  chData(k).then(function(list){view={s:'ch',k:k,list:list};refreshChMeta(k,list);save();renderCh()})
  .catch(function(){app.innerHTML='<div class="empty warn">Chapter load nahi hua. Internet / file check karo.<br><br><button class="hbtn" id="rt">Retry</button></div>';$('rt').onclick=function(){openCh(k)}});
}
function pool(){var l=view.list;return view.wrong?l.filter(function(q){var s=ST.q[q.i];return s&&!s.ok}):l}
function renderCh(){
  nav();var c=IDX.chapters.filter(function(x){return x.key===view.k})[0];
  head(c.icon+' '+c.label,{t:'⟵ Home',f:home});
  var all=view.list,s=stat(all),P=pool();
  var h='<div class="sum"><div><b>'+s.n+'</b><span>Total</span></div><div><b>'+s.a+'</b><span>Attempted</span></div><div><b style="color:var(--gr)">'+s.c+'</b><span>Sahi</span></div><div><b style="color:var(--rd)">'+s.w+'</b><span>Galat</span></div></div>';
  h+='<div class="chips"><button class="chip'+(view.wrong?' on':'')+'" id="fw">❌ Sirf galat wale ('+s.w+')</button><button class="chip" id="rs">↺ Chapter reset</button></div>';
  if(!P.length){h+='<div class="empty">'+(view.wrong?'Koi galat question nahi 🎉':'Is chapter mein question nahi')+'</div>'}
  else{h+='<div class="grid">';
    for(var i=0;i<P.length;i+=SZ){var part=P.slice(i,i+SZ),st=stat(part),no=i/SZ+1;
      h+='<button class="set'+(st.a===part.length?' done':'')+'" data-i="'+i+'"><b>Set '+no+'</b><small>'+part.length+' Q'+(st.a?' · '+st.c+'/'+st.a+' sahi':'')+'</small>'+barH({n:part.length,c:st.c,w:st.w})+'</button>'}
    h+='</div>'}
  app.innerHTML=h;
  $('fw').onclick=function(){view.wrong=!view.wrong;renderCh()};
  $('rs').onclick=function(){if(confirm('Is chapter ki saari progress reset karni hai?')){all.forEach(function(q){delete ST.q[q.i]});refreshChMeta(view.k,all);save();renderCh()}};
  app.querySelectorAll('.set').forEach(function(b){b.onclick=function(){var i=+b.dataset.i;startSet(P.slice(i,i+SZ),i/SZ+1)}});
  window.scrollTo(0,0);
}

/* ---------- practice ---------- */
function startSet(qs,no){
  var pk=view.k+(view.wrong?':w':'')+':'+no;var p=ST.pos[pk]||0;
  var first=0;for(var i=0;i<qs.length;i++){if(!ST.q[qs[i].i]){first=i;break}first=i}
  cur={qs:qs,no:no,i:(p&&p<qs.length&&!ST.q[qs[p].i])?p:first,pk:pk};
  if(stat(qs).a===qs.length)cur.i=0;
  view.s='play';showQ();
}
function showQ(){
  var q=cur.qs[cur.i],st=ST.q[q.i],n=cur.qs.length;
  head('Set '+cur.no+(view.wrong?' · galat':''),{t:'✕ Band',f:function(){leave()}});
  ST.pos[cur.pk]=cur.i;
  var long=q.t.length>420;
  var h='<div class="qh"><span>Q '+(cur.i+1)+' / '+n+'</span><span>'+stat(cur.qs).c+' sahi · '+stat(cur.qs).w+' galat</span></div><div class="qprog"><i style="width:'+((cur.i+1)/n*100)+'%"></i></div>';
  h+='<div class="q'+(long?' long':'')+'">'+fmt(q.t)+(q.h?'<span class="hi">'+fmt(q.h)+'</span>':'')+'</div>';
  q.o.forEach(function(o,j){
    var c='opt';if(st){if(j===q.a)c+=' ok';else if(j===st.a)c+=' bad'}
    h+='<button class="'+c+'" data-j="'+j+'"'+(st?' disabled':'')+'><span class="l">'+'ABCDEFGH'[j]+'</span><span>'+fmt(o)+(q.oh&&q.oh[j]?'<span class="oh">'+fmt(q.oh[j])+'</span>':'')+'</span></button>'});
  if(st){h+='<div class="ex"><h4>'+(st.ok?'✅ SAHI':'❌ GALAT — sahi answer: '+'ABCDEFGH'[q.a])+'</h4>'+(q.e||q.eh?(q.e?fmt(q.e):'')+(q.eh?'<span class="hi">'+fmt(q.eh)+'</span>':''):'Explanation available nahi.')+'</div>'}
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){pick(+b.dataset.j)}});
  var last=cur.i===n-1;
  nav('<div class="nav"><button id="pv"'+(cur.i?'':' disabled')+'>‹ Peeche</button><button id="nx" class="p">'+(last?'Result ›':(st?'Aage ›':'Skip ›'))+'</button></div>');
  $('pv').onclick=function(){cur.i--;showQ()};
  $('nx').onclick=function(){if(last)result();else{cur.i++;showQ()}};
  window.scrollTo(0,0);save();
}
function pick(j){
  var q=cur.qs[cur.i];if(ST.q[q.i])return;
  ST.q[q.i]={a:j,ok:j===q.a?1:0,t:Date.now()};
  refreshChMeta(view.k,view.list);showQ();
}
function leave(){view.s='ch';cur=null;renderCh()}
function result(){
  var s=stat(cur.qs);nav();head('Set '+cur.no+' result',{t:'✕ Band',f:leave});
  var pct=s.a?Math.round(s.c/s.n*100):0,left=s.n-s.a;
  var h='<div class="res"><div class="big">'+s.c+' / '+s.n+'</div><div class="sub">'+pct+'% sahi · '+s.w+' galat'+(left?' · '+left+' chhode':'')+'</div>';
  if(left)h+='<button class="p" id="b1">Chhode hue questions karo ('+left+')</button>';
  if(s.w)h+='<button id="b2">❌ Sirf galat wale dekho ('+s.w+')</button>';
  h+='<button id="b3">↺ Is set ko dobara karo</button><button id="b4">Sets list</button></div>';
  app.innerHTML=h;
  if(left)$('b1').onclick=function(){for(var i=0;i<cur.qs.length;i++)if(!ST.q[cur.qs[i].i]){cur.i=i;break}view.s='play';showQ()};
  if(s.w)$('b2').onclick=function(){view.wrong=true;leave()};
  $('b3').onclick=function(){cur.qs.forEach(function(q){delete ST.q[q.i]});refreshChMeta(view.k,view.list);cur.i=0;ST.pos[cur.pk]=0;view.s='play';showQ()};
  $('b4').onclick=leave;window.scrollTo(0,0);save();
}

/* ---------- boot ---------- */
load();
restore(function(){
  fetchJ(BASE+'index.json').then(function(d){IDX=d;
    if(!ST.chs||Object.keys(ST.chs).length<1||ST.chsV!==d.v){ST.chsV=d.v;ST.chs=ST.chs||{}}
    home();
  }).catch(function(){app.innerHTML='<div class="empty warn">Data load nahi hua (data/reasoning/index.json). App update/online check karo.</div>'});
});
window.addEventListener('pagehide',function(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}mirror()});
})();
</script>
</body>
</html>
