<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab SRS — Yuvraj's Spaced Repetition Tool</title>
<style>
:root{
  --bg:#0a0e18; --panel:#121b2e; --panel2:#0d1524; --line:#233252;
  --gold:#f2b544; --gold2:#ffd27a; --gold-dim:#4a3616;
  --green:#3ecf8e; --red:#ef5865; --blue:#4f9be0; --purple:#8b7ae8;
  --text:#dbe0e8; --dim:#8ea0bd;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; padding:0; overscroll-behavior:none;}
body{
  position:relative; overflow:hidden;
  background:
    radial-gradient(700px 400px at 15% -5%, #24365f 0%, transparent 62%),
    radial-gradient(650px 420px at 105% 5%, #3a2470 0%, transparent 58%),
    radial-gradient(750px 460px at 50% 105%, #103a4a 0%, transparent 62%),
    radial-gradient(500px 350px at 85% 60%, #1e4a3a 0%, transparent 60%),
    linear-gradient(160deg, #0a0e1c, #0a0e18 40%, #0c1120 100%);
  background-size:220% 220%, 220% 220%, 220% 220%, 220% 220%, 100% 100%;
  animation:bgDrift 18s ease-in-out infinite;
  color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center;
  padding:10px 10px;
}
@keyframes bgDrift{
  0%{background-position:0% 0%, 100% 0%, 50% 100%, 90% 60%, 0 0;}
  50%{background-position:20% 30%, 80% 20%, 55% 85%, 75% 45%, 0 0;}
  100%{background-position:0% 0%, 100% 0%, 50% 100%, 90% 60%, 0 0;}
}
.bgOrbs{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.bgOrbs span{position:absolute; border-radius:50%; filter:blur(50px); opacity:.30; animation:orbDrift ease-in-out infinite;}
.bgOrbs span:nth-child(1){width:220px; height:220px; left:-50px; top:5%; background:radial-gradient(circle,#5b4bc4,transparent 70%); animation-duration:19s;}
.bgOrbs span:nth-child(2){width:190px; height:190px; right:-40px; top:35%; background:radial-gradient(circle,#f2b544,transparent 70%); animation-duration:24s; animation-delay:-6s;}
.bgOrbs span:nth-child(3){width:240px; height:240px; left:15%; bottom:-70px; background:radial-gradient(circle,#3ecf8e,transparent 70%); animation-duration:27s; animation-delay:-12s;}
@keyframes orbDrift{
  0%{transform:translate(0,0) scale(1);}
  33%{transform:translate(25px,-30px) scale(1.12);}
  66%{transform:translate(-20px,20px) scale(.92);}
  100%{transform:translate(0,0) scale(1);}
}
.num{font-family:'Consolas','SF Mono','Roboto Mono',monospace; font-variant-numeric:tabular-nums;}

.wrap{width:100%; max-width:640px; height:100%; max-height:100vh; display:flex; flex-direction:column; position:relative; z-index:2;}
@media (min-width:900px){ .wrap{max-width:1200px; padding-left:24px; padding-right:24px; box-sizing:border-box;} }

.topbar{
  flex-shrink:0; background:linear-gradient(160deg,#16233f,#101a30);
  border:1px solid var(--line); border-radius:14px; padding:9px 10px;
  box-shadow:0 8px 24px -12px rgba(0,0,0,.6); position:relative; overflow:hidden;
  margin-bottom:8px;
}
.topbar::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), var(--green), transparent);
  background-size:200% 100%; animation:topGlow 4s linear infinite; opacity:.7;
}
@keyframes topGlow{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}
h1{font-size:16px; margin:0 0 2px; display:flex; align-items:center; gap:6px;}
.sub{color:var(--dim); font-size:10.5px; margin-bottom:8px;}

.stats-row{display:flex; justify-content:center; gap:0; border-top:1px solid var(--line); padding-top:7px;}
.stat{flex:1; text-align:center; padding:2px 4px; border-right:1px solid var(--line);}
.stat:last-child{border-right:none;}
.stat .n{font-size:17px; font-weight:800;}
.stat .l{font-size:8px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-top:1px;}
.stat.due .n{color:var(--red);}
.stat.new .n{color:var(--blue);}
.stat.total .n{color:var(--green);}

.tabs{display:flex; gap:5px; flex-shrink:0; margin-bottom:8px;}
.tab{
  flex:1; text-align:center; padding:9px 2px; border-radius:10px;
  background:#182948; border:1px solid var(--line); cursor:pointer;
  font-weight:800; font-size:11.5px; color:var(--dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tab.active{background:linear-gradient(135deg,var(--gold),#d99626); color:#1a1204; border-color:transparent; box-shadow:0 4px 14px -4px rgba(242,181,68,.55);}

.panel{display:none; flex:1; min-height:0; flex-direction:column;}
.panel.active{display:flex;}

.limit-row{
  display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-shrink:0;
  background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px;
}
.limit-row label{font-size:10.5px; color:var(--dim); font-weight:700; flex:1;}
.limit-row input{
  width:64px; padding:6px; border:1px solid var(--line); border-radius:6px;
  font-size:14px; background:var(--panel2); color:var(--text); text-align:center;
}

#reviewArea{flex:1; min-height:0; display:flex; flex-direction:column;}

.card-box{
  flex:1; min-height:0; width:100%; max-width:1100px; margin:0 auto;
  background:linear-gradient(160deg,#141f38,#0d1526 65%);
  border:1px solid var(--line); border-radius:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:clamp(16px,4vh,48px) clamp(14px,5vw,64px);
  cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  box-shadow:0 10px 30px -14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
  position:relative; overflow:hidden; box-sizing:border-box;
}
.card-box::before{
  content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px;
  background:linear-gradient(180deg,var(--gold),var(--green));
}
.card-box:active{box-shadow:0 0 0 1px rgba(242,181,68,.4), 0 10px 30px -14px rgba(0,0,0,.55);}
.card-box .word{
  font-size:clamp(32px, 9vw, 72px); font-weight:800; line-height:1.08; margin-bottom:clamp(10px,1.6vh,18px);
  word-break:break-word; color:var(--text); max-width:100%;
}
.card-box .hindi{font-size:clamp(18px, 5vw, 32px); color:var(--gold2); font-weight:700; margin-bottom:clamp(10px,1.6vh,16px); max-width:100%;}
.card-box .def{
  font-size:clamp(20px, 5vw, 40px); color:var(--text); font-weight:800; line-height:1.35;
  max-width:min(90%, 900px); word-break:break-word;
}
.card-box .cat{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-top:16px; opacity:.7;}
.card-box .hint{font-size:12px; color:var(--gold2); margin-top:14px; letter-spacing:1px; text-transform:uppercase; font-weight:700;}
.card-box .tapicon{font-size:min(8vw,36px); margin-bottom:4px; opacity:.75;}
.card-box .nexthint{font-size:10.5px; color:var(--dim); margin-top:10px;}

@media (min-width:900px){
  #reviewArea{ height:100%; }
  .card-box{ padding:56px 72px; }
}

.rate-row{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; flex-shrink:0;}
@media (max-width:360px){ .rate-row{grid-template-columns:1fr 1fr;} }
.rate-btn{
  padding:13px 2px; border:none; border-radius:10px; color:#fff;
  font-weight:800; font-size:12.5px; cursor:pointer; min-width:0;
}
.rate-btn:active{transform:scale(.96);}
.r0{background:linear-gradient(135deg,#ef5865,#c23744);}
.r1{background:linear-gradient(135deg,var(--gold),#c9820f); color:#1a1204;}
.r2{background:linear-gradient(135deg,var(--blue),#2a6fb0);}
.r3{background:linear-gradient(135deg,var(--green),#1f9a68); color:#04231a;}
.rate-btn .sec{display:block; font-weight:600; font-size:9.5px; opacity:.9; margin-top:2px;}

.done-msg{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--dim);}
.done-msg .big{font-size:48px; margin-bottom:10px;}
.done-msg .txt{font-size:14px;}

.form-box{
  background:linear-gradient(160deg,#141f38,#0d1526 65%);
  border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; flex-shrink:0;
  box-shadow:0 10px 30px -14px rgba(0,0,0,.55);
}
.form-box label{font-size:11px; font-weight:700; color:var(--gold2); display:block; margin:8px 0 4px; text-transform:uppercase; letter-spacing:.05em;}
.form-box input, .form-box textarea{
  width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:14px;
  font-family:inherit; background:var(--panel2); color:var(--text);
}
.form-box input:focus, .form-box textarea:focus{outline:none; border-color:var(--gold);}
.form-box textarea{resize:vertical; min-height:50px;}
.add-btn, .bulk-btn{
  margin-top:12px; width:100%; padding:13px; border:none; border-radius:10px;
  font-weight:800; font-size:14px; cursor:pointer;
  background:linear-gradient(135deg,var(--green),#1f9a68); color:#04231a;
  box-shadow:0 4px 14px -4px rgba(62,207,142,.55);
}
.bulk-btn{background:linear-gradient(135deg,var(--gold),#d99626); color:#1a1204; box-shadow:0 4px 14px -4px rgba(242,181,68,.55);}

#panel-add{overflow-y:auto;}

.word-list{flex:1; min-height:0; overflow-y:auto;}
.word-row{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:9px 12px; margin-bottom:7px; display:flex; justify-content:space-between; align-items:center;
}
.word-row .info b{font-size:14px; color:var(--text);}
.word-row .info span{display:block; font-size:11px; color:var(--dim); margin-top:1px;}
.word-row .del{background:none; border:none; color:var(--red); font-size:19px; cursor:pointer; padding:4px 8px;}
.word-row .badge{font-size:9.5px; padding:2px 6px; border-radius:10px; margin-left:6px; font-weight:700;}
.badge.due{background:var(--red); color:#fff;}
.badge.future{background:var(--line); color:var(--dim);}

.small-note{font-size:11px; color:var(--dim); margin-top:6px;}

/* ===== GAMIFICATION: streak badge, coins, combo, confetti ===== */
.daily-streak-badge{
  position:fixed; top:10px; left:10px; z-index:41; display:none;
  background:linear-gradient(160deg,#2a1e08,#1a1204); border:1px solid var(--gold-dim);
  color:var(--gold2); font-size:11px; font-weight:800; padding:5px 9px; border-radius:9px;
  align-items:center; gap:3px; box-shadow:0 4px 12px -6px rgba(0,0,0,.6);
}
.coin-badge{
  position:fixed; top:10px; right:10px; z-index:41;
  background:linear-gradient(160deg,#2a1e08,#1a1204); border:1px solid var(--gold-dim);
  color:var(--gold2); font-size:11px; font-weight:800; padding:5px 9px; border-radius:9px;
  display:flex; align-items:center; gap:3px; box-shadow:0 4px 12px -6px rgba(0,0,0,.6);
}
.stat .v.streak, .stat.streakstat .n{color:#ff9d3b;}
.stat.streak-hot{animation:streakGlow 1s ease infinite;}
@keyframes streakGlow{
  0%,100%{background:transparent;}
  50%{background:rgba(255,157,59,.16);}
}
.comboToast{
  position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-10px) scale(.8);
  z-index:90; background:linear-gradient(135deg,#ff9d3b,#ef5865); color:#fff;
  font-weight:900; font-size:15px; padding:9px 20px; border-radius:30px;
  box-shadow:0 10px 30px -8px rgba(239,88,101,.7); opacity:0; pointer-events:none;
  white-space:nowrap;
}
.comboToast.show{animation:comboPop 1.1s cubic-bezier(.2,.9,.3,1.2) forwards;}
@keyframes comboPop{
  0%{opacity:0; transform:translateX(-50%) translateY(-10px) scale(.7);}
  15%{opacity:1; transform:translateX(-50%) translateY(0) scale(1.08);}
  25%{transform:translateX(-50%) translateY(0) scale(1);}
  80%{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}
  100%{opacity:0; transform:translateX(-50%) translateY(-14px) scale(.92);}
}
.coinPop{
  position:fixed; z-index:96; font-size:18px; pointer-events:none;
  animation:coinFly .8s ease-out forwards;
}
@keyframes coinFly{
  0%{transform:translateY(0) scale(1); opacity:1;}
  60%{transform:translateY(-46px) scale(1.25) rotate(180deg); opacity:1;}
  100%{transform:translateY(-64px) scale(.8) rotate(360deg); opacity:0;}
}
.confettiLayer{position:fixed; inset:0; z-index:95; pointer-events:none; overflow:hidden;}
.confetti-piece{
  position:absolute; top:-20px; border-radius:2px; opacity:.95;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:1;}
  100%{transform:translateY(110vh) translateX(var(--drift,0px)) rotate(600deg); opacity:.2;}
}
</style>
</head>
<body>
<div class="bgOrbs"><span></span><span></span><span></span></div>
<div class="daily-streak-badge" id="dailyStreakBadge"></div>
<div class="coin-badge">🪙 <span id="coinTotal">0</span></div>
<div class="comboToast" id="comboToast"></div>
<div class="confettiLayer" id="confettiLayer"></div>

<div class="wrap">
  <div class="topbar">
    <h1>📚 Vocab SRS</h1>
    <div class="sub">Jo naya seekha, wahi baar baar poochega jab tak pakka na ho.</div>
    <div class="stats-row">
      <div class="stat due"><div class="n" id="statDue">0</div><div class="l">Due Now</div></div>
      <div class="stat new"><div class="n" id="statNew">0</div><div class="l">New Today</div></div>
      <div class="stat total"><div class="n" id="statTotal">0</div><div class="l">Total Words</div></div>
      <div class="stat streakstat" id="streakStatBox"><div class="n" id="statStreak">0🔥</div><div class="l">Combo</div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="review">🎯 Review</div>
    <div class="tab" data-tab="add">➕ Add Word</div>
    <div class="tab" data-tab="manage">📋 All Words</div>
  </div>

  <!-- REVIEW PANEL -->
  <div class="panel active" id="panel-review">
    <div id="reviewArea"></div>
  </div>

  <!-- ADD PANEL -->
  <div class="panel" id="panel-add">
    <div class="form-box">
      <label>Word (English)</label>
      <input type="text" id="fWord" placeholder="e.g. Redoubtable">
      <label>Hindi Meaning</label>
      <input type="text" id="fHindi" placeholder="e.g. भयानक / सम्मानजनक">
      <label>Definition (English)</label>
      <textarea id="fDef" placeholder="e.g. Formidable, inspiring respect or fear through strength"></textarea>
      <button class="add-btn" onclick="addWord()">+ Add Word</button>
    </div>

    <div class="form-box">
      <label>Bulk Import (one per line: Word | Hindi | Definition)</label>
      <textarea id="fBulk" placeholder="Redoubtable | भयानक/सम्मानजनक | Formidable, inspiring respect or fear&#10;Sangfroid | धैर्य | Calmness and composure"></textarea>
      <button class="bulk-btn" onclick="bulkImport()">⬆ Bulk Import</button>
      <div class="small-note">Apni photo wali list se seedha copy-paste kar sakta hai, bas format match karle: <b>Word | Hindi | Definition</b></div>
    </div>
  </div>

  <!-- MANAGE PANEL -->
  <div class="panel" id="panel-manage">
    <div class="form-box" style="padding:10px 14px; flex-shrink:0;">
      <input type="text" id="searchBox" placeholder="🔍 Search word or Hindi meaning..." oninput="renderManage()">
    </div>
    <div class="word-list" id="wordList"></div>
  </div>
</div>

function getDailyState(){
  let d = JSON.parse(localStorage.getItem(DAILY_KEY) || 'null');
  if(!d || d.date !== todayStr()){
    d = { date: todayStr(), newShown: 0 };
    localStorage.setItem(DAILY_KEY, JSON.stringify(d));

// ---------- SM-2 algorithm ----------
// rating: 0=Again, 1=Hard, 2=Good, 3=Easy
function schedule(card, rating){
  const now = Date.now();
  if(card.ef === undefined) card.ef = 2.5;
  if(card.reps === undefined) card.reps = 0;
  if(card.interval === undefined) card.interval = 0;

  if(rating === 0){
    card.reps = 0;
    card.interval = 1/1440 * 10; // 10 minutes, back into queue soon
  } else {
    card.ef = Math.max(1.3, card.ef + (0.1 - (3-rating)*(0.08 + (3-rating)*0.02)));
    card.reps += 1;
    if(card.reps === 1) card.interval = rating === 1 ? 1 : (rating === 2 ? 1 : 2);
    else if(card.reps === 2) card.interval = rating === 1 ? 2 : (rating === 2 ? 3 : 5);
    else card.interval = Math.round(card.interval * card.ef);
  }
  card.due = now + card.interval * 86400000;
  card.lastReview = now;
}

// ---------- Rendering ----------
function refreshStats(){
  const now = Date.now();
  const reviewDue = cards.filter(c => c.reps > 0 && (c.due||0) <= now).length;
  const newAvailableToday = cards.filter(c => !c.reps || c.reps === 0).length;

  document.getElementById('statDue').textContent = reviewDue;
  document.getElementById('statNew').textContent = newAvailableToday;
  document.getElementById('statTotal').textContent = cards.length;
}

function buildQueue(){
  const now = Date.now();
  const reviewDue = cards.filter(c => c.reps > 0 && (c.due||0) <= now)
                          .sort((a,b)=> (a.due||0)-(b.due||0));
  const freshNew = cards.filter(c => !c.reps || c.reps === 0);

  queue = reviewDue.concat(freshNew);
}

function renderReview(){
  refreshStats();
  buildQueue();
  const area = document.getElementById('reviewArea');
  if(queue.length === 0){
    area.innerHTML = '<div class="done-msg"><div class="big">✅</div><div class="txt">Abhi koi card due nahi hai.<br>Naya word add kar ya baad mein aa.</div></div>';
    notifyExamTrackerIfSessionComplete();
    return;
  }
  current = queue[0];
  revealed = false;
  renderCard();
}

// ---------- Exam Tracker integration: auto-tick "Vocab" task ----------
// Jab is tool mein saare due cards review ho jaate hain (queue khaali), aur
// is session mein kam se kam ek card rate hui thi, ek baar exam-tracker app
// (parent tab/window jisne isse iframe/tab mein khola) ko batao — wahan
// "Vocab" task apne-aap tick ho jaata hai (Calculation task ke calcQuiz
// pattern jaisa hi). `sentThisEmpty` guard se same completion baar-baar
// notify nahi hoti jab tak naye cards due na ho jayein.
let vocabSessionRated = 0;
let vocabSessionGood = 0;
let sentThisEmpty = false;
function notifyExamTrackerIfSessionComplete(){
  if(vocabSessionRated === 0 || sentThisEmpty) return;
  sentThisEmpty = true;
  const payload = {
    type: 'examTrackerVocabComplete',
    label: 'Vocab Review',
    correct: vocabSessionGood,
    total: vocabSessionRated
  };
  try{ if(window.parent && window.parent !== window) window.parent.postMessage(payload, '*'); }catch(e){}
  try{ if(window.opener && !window.opener.closed) window.opener.postMessage(payload, '*'); }catch(e){}
}

function renderCard(){
  const area = document.getElementById('reviewArea');
  if(!revealed){
    area.innerHTML = `
      <div class="card-box" onclick="doReveal()">
        <div class="tapicon">👆</div>
        <div class="word">${escapeHtml(current.word)}</div>
        <div class="hint">TAP TO REVEAL</div>
        ${current.cat ? `<div class="cat">${escapeHtml(current.cat)}</div>` : ''}
      </div>
    `;
  } else {
    area.innerHTML = `
      <div class="card-box" onclick="rate(2)">
        <div class="word">${escapeHtml(current.word)}</div>
        <div class="hindi">${escapeHtml(current.hindi||'')}</div>
        <div class="def">${escapeHtml(current.def||'')}</div>
        <div class="nexthint">Tap card → Next word (marks as Good)</div>
      </div>
      <div class="rate-row">
        <button class="rate-btn r0" onclick="event.stopPropagation(); rate(0)">Again<span class="sec">10 min</span></button>
        <button class="rate-btn r1" onclick="event.stopPropagation(); rate(1)">Hard<span class="sec">1-2 din</span></button>
        <button class="rate-btn r2" onclick="event.stopPropagation(); rate(2)">Good<span class="sec">3+ din</span></button>
        <button class="rate-btn r3" onclick="event.stopPropagation(); rate(3)">Easy<span class="sec">5+ din</span></button>
      </div>
    `;
  }
}

function doReveal(){ if(!revealed){ revealed = true; renderCard(); } }

  coin.className = 'coinPop';
  coin.textContent = '🪙';
  coin.style.left = (r.left + r.width/2 - 9) + 'px';

  setTimeout(()=> coin.remove(), 850);

function fireConfetti(count){
  const layer = document.getElementById('confettiLayer');
  const colors = ['#f2b544','#3ecf8e','#8b7ae8','#ef5865','#ffd27a'];
  for (let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const size = 6 + Math.random()*6;
    p.style.width = size + 'px';
    p.style.height = (size*0.4 + Math.random()*6) + 'px';
    p.style.left = (Math.random()*100) + 'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.setProperty('--drift', (Math.random()*160-80) + 'px');
    const dur = 2.2 + Math.random()*1.6;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = (Math.random()*0.4) + 's';
    layer.appendChild(p);
    setTimeout(()=> p.remove(), (dur+0.5)*1000);
  }
}
function updateDailyStreak(){
  const today = new Date().toISOString().slice(0,10);
  const lastDay = localStorage.getItem('vocab_srs_last_play_day');
  let streakDays = parseInt(localStorage.getItem('vocab_srs_daily_streak') || '0', 10) || 0;
  if (lastDay !== today){
    const yest = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    streakDays = (lastDay === yest) ? streakDays + 1 : 1;
    localStorage.setItem('vocab_srs_daily_streak', streakDays);
    localStorage.setItem('vocab_srs_last_play_day', today);
  }
  const badge = document.getElementById('dailyStreakBadge');
  if (streakDays > 1){
    badge.style.display = 'flex';
    badge.textContent = `🔥 ${streakDays} din se streak`;
  } else {
    badge.style.display = 'none';
  }
}

function rate(r){
  const wasNew = !current.reps || current.reps === 0;
  schedule(current, r);
  save();
  if(wasNew) bumpDailyNew();

  vocabSessionRated += 1;
  if(r >= 1) vocabSessionGood += 1; // Hard/Good/Easy count as "correct"; Again does not
  sentThisEmpty = false; // fresh due card just showed up, allow a future notify once it empties again

  const cardEl = document.querySelector('.card-box');
  if(r >= 2){ // Good or Easy — streak continues
    sessionStreak += 1;
    addCoins(r === 3 ? 2 : 1);
    if(cardEl) popCoinFrom(cardEl);
    if(sessionStreak > 0 && sessionStreak % 10 === 0){
      showCombo(`🔥 ${sessionStreak} COMBO!`);
      fireConfetti(40);
    } else if(sessionStreak > 0 && sessionStreak % 5 === 0){
      showCombo(`⚡ ${sessionStreak} streak!`);
    }
  } else if(r === 1){ // Hard — small reward, streak unaffected
    addCoins(1);
    if(cardEl) popCoinFrom(cardEl);
  } else { // Again — streak resets, no coin
    sessionStreak = 0;
  }
  updateStreakDisplay();
  renderReview();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Add ----------
function addWord(){
  const word = document.getElementById('fWord').value.trim();
  const hindi = document.getElementById('fHindi').value.trim();
  const def = document.getElementById('fDef').value.trim();
  if(!word){ alert('Word toh daal pehle.'); return; }
  cards.push({ word, hindi, def, due: Date.now(), reps: 0, ef: 2.5, interval: 0 });
  save();
  document.getElementById('fWord').value='';
  document.getElementById('fHindi').value='';
  document.getElementById('fDef').value='';
  refreshStats();
  renderManage();
  alert('Added: ' + word);
}

function bulkImport(){
  const raw = document.getElementById('fBulk').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let count = 0;
  lines.forEach(line=>{
    const parts = line.split('|').map(p=>p.trim());
    if(parts[0]){
      cards.push({
        word: parts[0], hindi: parts[1]||'', def: parts[2]||'',
        due: Date.now(), reps: 0, ef: 2.5, interval: 0
      });
      count++;
    }
  });
  save();
  document.getElementById('fBulk').value='';
  refreshStats();
  renderManage();
  alert(count + ' words imported.');
}

// ---------- Manage ----------
function renderManage(){
  const list = document.getElementById('wordList');
  if(cards.length === 0){
    list.innerHTML = '<div class="small-note">Koi word add nahi hua abhi.</div>';
    return;
  }
  const term = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  const now = Date.now();
  const indexed = cards.map((c,i)=>({c,i}));
  const filtered = term
    ? indexed.filter(({c}) => (c.word||'').toLowerCase().includes(term) || (c.hindi||'').includes(term))
    : indexed;

  if(filtered.length === 0){
    list.innerHTML = '<div class="small-note">Koi match nahi mila.</div>';
    return;
  }

  list.innerHTML = filtered.map(({c, i}) => {
    const isDue = (c.due||0) <= now;
    const dueStr = c.reps === 0 ? 'New' : new Date(c.due).toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
    return `
      <div class="word-row">
        <div class="info">
          <b>${escapeHtml(c.word)}</b>
          <span class="badge ${isDue ? 'due':'future'}">${c.reps ? dueStr : 'New'}</span>
          <span>${escapeHtml(c.hindi||'')}${c.cat ? ' · ' + escapeHtml(c.cat) : ''}</span>
        </div>
        <button class="del" onclick="delWord(${i})">✕</button>
      </div>
    `;
  }).join('');
}

function delWord(i){
  if(confirm('Delete "' + cards[i].word + '"?')){
    cards.splice(i,1);
    save();
    refreshStats();
    renderManage();
  }
}

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-'+t.dataset.tab).classList.add('active');
    if(t.dataset.tab === 'review') renderReview();
    if(t.dataset.tab === 'manage') renderManage();
  });
});

// ---------- Init ----------
refreshStats();
renderReview();
renderManage();
document.getElementById('coinTotal').textContent = getCoins();
updateStreakDisplay();
updateDailyStreak();
</script>
</body>
</html>
