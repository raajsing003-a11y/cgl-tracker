} fishing net from the house and covered the mouth of the pot with it. “There,” he said, “now let’s see how the flies get at it.”","hi":"फिर वह घर से अपना सबसे बढ़िया मछली पकड़ने का जाल लाया और उससे मटके का मुँह ढक दिया। “लो,” उसने कहा, “अब देखता हूँ मक्खियाँ कैसे पहुँचती हैं।”"},{"en":"All this thought put such a strain on Rambharosey that he forgot to shut the window of the barn. That night, {{maddened|पागल हुआ}} by the smell of honey, a bear came to the barn and tried to break down the door.","hi":"इस सारी सोच से रामभरोसे पर इतना ज़ोर पड़ा कि वह खलिहान की खिड़की बंद करना भूल गया। उस रात शहद की महक से पागल हुआ एक भालू खलिहान में आया और दरवाज़ा तोड़ने की कोशिश करने लगा।"}],[{"en":"The next morning, when Rambharosey saw the scratched and {{battered|टूटा-फूटा}} door, he sent for the village {{carpenter|बढ़ई}} and {{locksmith|ताला-मिस्त्री}} who built him a new door and fixed a shiny new lock on it. That night, a {{band|टोली}} of thieves passing by saw the shiny new lock and thought, “Rambharosey must be rich.","hi":"अगली सुबह जब रामभरोसे ने खरोंचा हुआ और टूटा-फूटा दरवाज़ा देखा, तो उसने गाँव के बढ़ई और ताला-मिस्त्री को बुलवाया, जिन्होंने उसके लिए नया दरवाज़ा बनाया और उस पर चमचमाता नया ताला लगा दिया। उस रात वहाँ से गुज़रती चोरों की एक टोली ने चमचमाता नया ताला देखा और सोचा, “रामभरोसे ज़रूर अमीर होगा।"},{"en":"He keeps his money in the barn.” So they broke open the lock and entered the barn.","hi":"वह अपना पैसा खलिहान में रखता है।” इसलिए उन्होंने ताला तोड़कर खलिहान में घुस गए।"},{"en":"Finding nothing, they went away, disappointed. The next day, Rambharosey saw the broken lock and said to himself, “This won’t do.”","hi":"कुछ न मिलने पर वे निराश होकर चले गए। अगले दिन रामभरोसे ने टूटा ताला देखा और ख़ुद से कहा, “यह तो नहीं चलेगा।”"}],[{"en":"So after getting the lock fixed, he {{posted|तैनात किया}} a lathi-{{wielding|लिए हुए (हथियार)}} {{guard|पहरेदार}} in front of his barn door. The people went and told the King, “Rambharosey has {{hired|काम पर रखा}} a guard to look after his barn.”","hi":"इसलिए ताला ठीक करवाने के बाद उसने खलिहान के दरवाज़े के सामने लाठी लिए एक पहरेदार तैनात कर दिया। लोगों ने जाकर राजा को बताया, “रामभरोसे ने अपने खलिहान की रखवाली के लिए पहरेदार रखा है।”"},{"en":"“Hmmmm,” said the King, “Rambharosey must be rich.” And he increased the {{tax|कर}} Rambharosey had to pay.","hi":"“हूँ,” राजा ने कहा, “रामभरोसे ज़रूर अमीर होगा।” और उसने रामभरोसे पर लगने वाला कर बढ़ा दिया।"},{"en":"“Rambharosey is rich,” everybody said. “Do you know how much tax he pays to the King?”","hi":"“रामभरोसे अमीर है,” सब कहने लगे। “क्या आपको पता है वह राजा को कितना कर देता है?”"}],[{"en":"The richest {{merchant|व्यापारी}} in town heard this and he was so {{impressed|प्रभावित}} that he quickly went and got Rambharosey married to his daughter. But the barn door is locked, and the guard is still guarding the door, and Rambharosey {{refuses|मना करता है}} to open the door until his mother gets back.","hi":"शहर के सबसे अमीर व्यापारी ने यह सुना तो वह इतना प्रभावित हुआ कि जल्दी से जाकर रामभरोसे की शादी अपनी बेटी से करवा दी। पर खलिहान का दरवाज़ा अब भी बंद है, पहरेदार अब भी दरवाज़े की रखवाली कर रहा है, और रामभरोसे दरवाज़ा तब तक खोलने से मना करता है जब तक उसकी माँ लौट न आए।"}]],"vocab":[["barn","noun","खलिहान","granary, shed","—","a large farm building for storing grain or hay"],["hay","noun","सूखा चारा","fodder, straw","—","dried grass used as animal feed"],["crack","verb","चटकना, दरार पड़ना","split, break","mend","to break without separating completely"],["shallow","adj","उथला","not deep, superficial","deep","having little depth"],["moat","noun","खाई","ditch, trench","—","a deep water-filled ditch around a castle or place"],["strain","noun","ज़ोर, तनाव","pressure, stress","relaxation","a force or mental pressure that tires someone"],["fine","adj","बढ़िया, उत्तम","excellent, superior","poor","of very high quality"],["madden","verb","पागल या आगबबूला करना","enrage, infuriate","calm","to drive someone crazy or very angry"],["battered","adj","टूटा-फूटा, पिटा हुआ","damaged, worn","intact","damaged by repeated blows or hard use"],["carpenter","noun","बढ़ई","woodworker, joiner","—","a person who makes things out of wood"],["locksmith","noun","ताला-मिस्त्री","lock-maker","—","a person who makes or repairs locks"],["band","noun","टोली, दल","group, gang","individual","a group of people acting together"],["post","verb","तैनात करना","station, place","withdraw","to put someone at a place for a duty"],["wield","verb","हथियार लेकर चलना","brandish, hold","drop","to hold and use a weapon or tool"],["guard","noun","पहरेदार","sentry, watchman","intruder","a person who protects a place"],["hire","verb","काम पर रखना","employ, engage","fire","to pay someone to do a job"],["tax","noun","कर","levy, duty","refund","money paid compulsorily to the government"],["merchant","noun","व्यापारी","trader, dealer","customer","a person who buys and sells goods"],["impressed","adj","प्रभावित","struck, awed","unimpressed","feeling admiration for something"],["refuse","verb","मना करना","decline, reject","accept","to say no to a request"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["think hard","गहराई से सोचना","He stood still and thought hard.","to think very carefully"],["send for","बुलवा भेजना","He sent for the village carpenter.","to ask someone to come"],["look after","देखभाल करना","The guard looks after the barn.","to take care of"]],"fq":[]},{"id":"ev-ed345","title":"The Picture","src":"Evergreen library · Topic: Economy","c":"Economy","todo":"","ed":[[{"en":"A wealthy but {{miserly|कंजूस}} old man once {{commissioned|(काम) बनवाया}} a famous artist to paint a picture for him. He wanted the scene of Hanuman the monkey-god flying over the ocean, with the city of Lanka in flames in the background.","hi":"एक धनी पर कंजूस बूढ़े आदमी ने एक बार एक मशहूर चित्रकार से अपने लिए तस्वीर बनवाई। वह चाहता था कि हनुमान जी समुद्र के ऊपर उड़ते दिखें और पीछे लंका जलती हुई हो।"},{"en":"“The {{charge|क़ीमत, शुल्क}} will be 10,000 rupees,” said the artist. The old man rolled his eyes in horror.","hi":"“इसकी क़ीमत 10,000 रुपये होगी,” चित्रकार ने कहा। बूढ़े ने डर से आँखें फैला लीं।"},{"en":"“Ten thousand!” he {{exclaimed|चिल्ला उठा}}. “That is too much for such a simple painting!”","hi":"“दस हज़ार!” वह चिल्ला उठा। “इतनी सीधी-सादी तस्वीर के लिए यह बहुत ज़्यादा है!”"}],[{"en":"“Well, I can’t charge less than 8000 rupees then,” replied the painter, a {{trifle|थोड़ा-सा}} {{irritated|खीझा हुआ}}. “No,” {{insisted|अड़ा रहा}} the old man.","hi":"“तो मैं 8000 रुपये से कम नहीं ले सकता,” चित्रकार ने थोड़ा खीझकर कहा। “नहीं,” बूढ़ा अड़ गया।"},{"en":"“Even that is way above the market rate.” “My last price is Rs. 7000, and not a paisa less,” said the artist {{curtly|रूखेपन से}}, a look of {{disgust|घिन, नफ़रत}} in his eyes.","hi":"“यह भी बाज़ार भाव से कहीं ऊपर है।” “मेरा आख़िरी दाम 7000 रुपये है, एक पैसा कम नहीं,” चित्रकार ने रूखेपन से कहा, उसकी आँखों में घिन थी।"},{"en":"“I will not pay you more than Rs. 5000,” said the {{miser|कंजूस आदमी}} in an {{obstinate|ज़िद्दी}} tone. Finally the painter agreed, sickened by the {{haggling|मोलभाव}}.","hi":"“मैं आपको 5000 रुपये से ज़्यादा नहीं दूँगा,” कंजूस ने ज़िद्दी लहजे में कहा। आख़िरकार मोलभाव से तंग आकर चित्रकार मान गया।"}],[{"en":"The {{codger|खूसट बूढ़ा}} made his way out of the studio, still {{grumbling|बड़बड़ाना}} about the large sum of money he had to part with. Two days later, the old man was taken aback to be told that the painting was ready.","hi":"वह खूसट इतनी बड़ी रक़म देनी पड़ने पर बड़बड़ाता हुआ स्टूडियो से निकल गया। दो दिन बाद बूढ़े को जब बताया गया कि तस्वीर तैयार है, तो वह हक्का-बक्का रह गया।"},{"en":"When he {{shuffled|घिसटते क़दमों से चला}} into the studio, the artist removed the cloth covering the canvas with a {{flourish|अंदाज़ से घुमाना}}. “{{Behold|देखो}}!” he cried.","hi":"जब वह घिसटते क़दमों से स्टूडियो में पहुँचा, तो चित्रकार ने बड़े अंदाज़ से कैनवास पर पड़ा कपड़ा हटाया। “देखिए!” वह बोला।"},{"en":"But strain as he might, the miser could see {{nought|कुछ नहीं}} but a canvas painted bright blue all over. “What is this?” he exclaimed.","hi":"लेकिन कितनी भी कोशिश करने पर कंजूस को पूरे कैनवास पर गहरे नीले रंग के सिवा कुछ नहीं दिखा। “यह क्या है?” वह चीख़ा।"}],[{"en":"“I ordered a painting of Hanuman leaping over the ocean!” “You are at this very moment looking at the ocean,” replied the artist.","hi":"“मैंने तो हनुमान जी के समुद्र लाँघने की तस्वीर माँगी थी!” “आप इसी वक़्त समुद्र को ही देख रहे हैं,” चित्रकार ने जवाब दिया।"},{"en":"“But where is Hanuman?” {{enquired|पूछा}} the old man. “He has already leapt over the ocean to the other side,” came the answer.","hi":"“पर हनुमान जी कहाँ हैं?” बूढ़े ने पूछा। “वे समुद्र लाँघकर उस पार जा चुके,” जवाब आया।"},{"en":"“And Lanka? I can’t see any city in flames,” the miser complained {{petulantly|चिड़चिड़ाकर}}.","hi":"“और लंका? मुझे कोई जलता शहर नहीं दिख रहा,” कंजूस ने चिड़चिड़ाकर शिकायत की।"}],[{"en":"“Well,” the artist continued. “It has burned down completely!”","hi":"“अच्छा,” चित्रकार ने आगे कहा। “वह पूरी तरह जलकर राख हो गई!”"}]],"vocab":[["miserly","adj","कंजूस","stingy, tight-fisted","generous","unwilling to spend money"],["commission","verb","(काम) बनवाना, सौंपना","order, engage","cancel","to officially ask someone to do or make something"],["charge","noun","क़ीमत, शुल्क","fee, price","refund","the price asked for a service"],["exclaim","verb","चिल्ला उठना","cry out, shout","murmur","to cry out suddenly from surprise or anger"],["trifle","noun","छोटी-सी बात; थोड़ा-सा","bit, little","lot","a small amount or unimportant thing"],["irritated","adj","खीझा हुआ","annoyed, vexed","pleased","slightly angry or annoyed"],["insist","verb","अड़ना, ज़ोर देना","demand, persist","yield","to demand firmly"],["curtly","adv","रूखेपन से","abruptly, brusquely","politely","in a short and rude manner"],["disgust","noun","घिन, नफ़रत","revulsion, loathing","admiration","strong dislike or disapproval"],["obstinate","adj","ज़िद्दी","stubborn, headstrong","flexible","refusing to change one’s mind"],["miser","noun","कंजूस आदमी","skinflint, penny-pincher","spendthrift","a person who hates spending money"],["haggle","verb","मोलभाव करना","bargain, barter","—","to argue about a price"],["codger","noun","खूसट बूढ़ा","old fellow, geezer","—","an old and eccentric man"],["grumble","verb","बड़बड़ाना","complain, mutter","praise","to complain in a low, bad-tempered voice"],["shuffle","verb","घिसटकर चलना","shamble, drag","stride","to walk slowly without lifting the feet"],["flourish","noun","दिखावटी अंदाज़","gesture, swirl","—","a bold sweeping movement made to attract attention"],["behold","verb","देखना (पुराना प्रयोग)","look, see","ignore","to see or observe, often used to draw attention"],["nought","noun","कुछ नहीं","nothing, zero","everything","nothing"],["enquire","verb","पूछताछ करना","ask, inquire","answer","to ask for information"],["petulantly","adv","चिड़चिड़ाकर","peevishly, sulkily","cheerfully","in a childishly bad-tempered way"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["roll one’s eyes","आँखें घुमाना (असंतोष में)","She rolled her eyes at his excuse.","to show disbelief or annoyance"],["part with (money)","(पैसा) छोड़ना, ख़र्च करना","He hated parting with his money.","to give up something reluctantly"],["taken aback","हक्का-बक्का","I was taken aback by her reply.","shocked or surprised"]],"fq":[]},{"id":"ev-ed347","title":"The Silver Mouse","src":"Evergreen library · Topic: Science & Tech","c":"Science & Tech","todo":"","ed":[[{"en":"(Mandarins were high Chinese {{officials|अधिकारी}} a long time ago. They were held in great respect and fear by the common people.","hi":"(मंदारिन बहुत पहले चीन के ऊँचे अधिकारी होते थे। आम लोग उनका बहुत आदर भी करते थे और उनसे डरते भी थे।"},{"en":"The Chinese also have a {{custom|रिवाज}} of naming each year after a particular animal. The following story {{relates|से जुड़ी है}} to this.) A highly {{revered|सम्मानित}} {{mandarin|मंदारिन (चीनी अधिकारी)}} of Shenzen was about to {{retire|रिटायर होना}}.","hi":"चीनी लोगों में हर साल का नाम किसी ख़ास जानवर के नाम पर रखने का रिवाज भी है। नीचे की कहानी इसी से जुड़ी है।) शेनज़ेन का एक बेहद सम्मानित मंदारिन रिटायर होने वाला था।"},{"en":"He was considered highly because he had never been seen taking a {{bribe|रिश्वत}} throughout his career as a mandarin, as other mandarins did. The {{grateful|आभारी}} people of Shenzen decided to present him a {{farewell|विदाई}} gift.","hi":"उसे बहुत ऊँचा माना जाता था क्योंकि अपने पूरे करियर में उसे कभी रिश्वत लेते नहीं देखा गया था, जैसा दूसरे मंदारिन करते थे। शेनज़ेन के आभारी लोगों ने उसे विदाई का तोहफ़ा देने का फ़ैसला किया।"}],[{"en":"But they were afraid to {{approach|पास जाना}} him directly. Instead, they went to his wife and asked her what she thought would please her husband.","hi":"लेकिन वे सीधे उसके पास जाने से डरते थे। इसलिए वे उसकी पत्नी के पास गए और पूछा कि उनके विचार से पति को क्या पसंद आएगा।"},{"en":"“Since you are so {{eager|उत्सुक}} to give him a gift, any {{curio|दुर्लभ कलाकृति}} would {{delight|ख़ुश करना}} him,” she replied. “Ah, that is a wonderful idea, Madam!” {{exclaimed|चहक उठे}} the men.","hi":"“चूँकि आप सब उसे तोहफ़ा देने को इतने उत्सुक हैं, इसलिए कोई भी दुर्लभ कलाकृति उसे ख़ुश कर देगी,” उसने जवाब दिया। “वाह, यह तो बहुत अच्छा विचार है, मैडम!” आदमी चहक उठे।"},{"en":"“In what year was the great mandarin born, if we may {{respectfully|आदरपूर्वक}} ask you?” “In the year of the Mouse.","hi":"“आदरपूर्वक पूछने की इजाज़त हो तो बताइए, महान मंदारिन किस साल पैदा हुए थे?” “चूहे के साल में।"}],[{"en":"Why?” she said. “We shall offer him a large {{replica|प्रतिरूप}} of a mouse in silver,” the men replied.","hi":"क्यों?” उसने कहा। “हम उन्हें चाँदी का एक बड़ा चूहे का प्रतिरूप भेंट करेंगे,” आदमियों ने जवाब दिया।"},{"en":"The mandarin’s wife accepted the silver mouse without {{daring|हिम्मत करना}} to let her husband know. A few years later, the wife was {{obliged|मजबूर}} to break up the silver mouse and sell the pieces one by one because they had fallen on hard times.","hi":"मंदारिन की पत्नी ने पति को बताने की हिम्मत किए बिना चाँदी का चूहा ले लिया। कुछ साल बाद बुरे दिन आने पर पत्नी को मजबूर होकर चाँदी के चूहे को तोड़कर उसके टुकड़े एक-एक करके बेचने पड़े।"},{"en":"The mandarin came to know of it and asked her where she’d got the mouse. When the wife {{fearfully|डरते-डरते}} told him the whole story, he {{sighed|आह भरी}}, instead of getting angry.","hi":"मंदारिन को इसका पता चल गया और उसने पत्नी से पूछा कि चूहा कहाँ से मिला। जब पत्नी ने डरते-डरते पूरी कहानी सुनाई, तो वह ग़ुस्सा होने के बजाय आह भरकर रह गया।"}],[{"en":"“My poor woman! You should have told them I was born in the year of the Buffalo!”","hi":"“बेचारी औरत! तुम्हें उन्हें बता देना चाहिए था कि मैं भैंसे के साल में पैदा हुआ था!”"}]],"vocab":[["official","noun","अधिकारी","officer, administrator","civilian","a person holding a public office"],["custom","noun","रिवाज","tradition, practice","novelty","a traditional way of behaving"],["relate","verb","जुड़ा होना; सुनाना","connect, narrate","separate","to be connected with, or to tell a story"],["revered","adj","सम्मानित","respected, venerated","despised","deeply respected"],["mandarin","noun","मंदारिन (पुराना चीनी अधिकारी)","official, bureaucrat","—","a high official in imperial China"],["retire","verb","रिटायर होना","step down, resign","join","to leave one’s job at the end of working life"],["bribe","noun","रिश्वत","payoff, kickback","—","money given to get an unfair favour"],["grateful","adj","आभारी","thankful, obliged","ungrateful","feeling thanks for kindness"],["farewell","noun","विदाई","goodbye, send-off","welcome","an act of saying goodbye"],["approach","verb","पास जाना","come near, accost","retreat","to come near to someone or something"],["eager","adj","उत्सुक","keen, enthusiastic","reluctant","wanting very much to do something"],["curio","noun","दुर्लभ कलाकृति","antique, trinket","—","a rare or unusual small object"],["delight","verb","ख़ुश करना","please, charm","displease","to give great pleasure to"],["exclaim","verb","चहक उठना","cry out, declare","mutter","to say something suddenly in excitement"],["respectfully","adv","आदरपूर्वक","politely, courteously","rudely","in a way that shows respect"],["replica","noun","प्रतिरूप","copy, model","original","an exact copy of something"],["dare","verb","हिम्मत करना","venture, risk","fear","to have the courage to do something"],["obliged","adj","मजबूर","compelled, forced","free","forced by duty or necessity"],["fearfully","adv","डरते-डरते","timidly, nervously","boldly","in a frightened manner"],["sigh","verb","आह भरना","breathe out, groan","—","to breathe out heavily in sadness or relief"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["hard times","बुरे दिन","The family fell on hard times.","a period of difficulty or poverty"],["come to know","पता चलना","The mandarin came to know of the sale.","to learn or find out"],["one by one","एक-एक करके","She sold the pieces one by one.","separately, in order"]],"fq":[]},{"id":"ev-ed348","title":"The Tricky Tailor","src":"Evergreen library · Topic: Global Issues","c":"Global Issues","todo":"","ed":[[{"en":"One day a prince was riding home after having been away for many, many years. He met another rider and the two of them struck up a conversation.","hi":"एक दिन एक राजकुमार बहुत सालों बाद घर लौटते हुए घोड़े पर जा रहा था। उसे एक और सवार मिला और दोनों में बातचीत शुरू हो गई।"},{"en":"On learning about the prince’s homeward trip, the {{newcomer|नया आदमी}} who said he was a tailor, asked him how his parents, the King and Queen would recognize him. The prince held out a gold ring with the royal {{seal|मुहर}} on it.","hi":"राजकुमार की घर-वापसी की बात सुनकर नए आदमी ने, जिसने ख़ुद को दर्ज़ी बताया, पूछा कि उसके माता-पिता, राजा और रानी, उसे कैसे पहचानेंगे। राजकुमार ने शाही मुहर वाली सोने की अँगूठी दिखाई।"},{"en":"“They’ll recognize me when I show them this,” he said. The tailor {{grinned|मुस्कराया}} {{slyly|चालाकी से}} to himself as he {{hatched|बनाई (योजना)}} a plan to {{con|ठगना}} the prince.","hi":"“जब मैं उन्हें यह दिखाऊँगा तो वे मुझे पहचान लेंगे,” उसने कहा। दर्ज़ी मन-ही-मन चालाकी से मुस्कराया और राजकुमार को ठगने की योजना बनाने लगा।"}],[{"en":"They camped for the night in a {{grove|झुरमुट}} of trees and the tailor offered the prince a glass of sherbet {{laced|मिलाया हुआ}} with a powerful sleeping drug. The prince swallowed the drink and dropped down in a {{stupor|बेहोशी}}.","hi":"उन्होंने रात पेड़ों के एक झुरमुट में डेरा डाला और दर्ज़ी ने राजकुमार को नींद की तेज़ दवा मिला शर्बत का गिलास दिया। राजकुमार ने पेय पी लिया और बेहोशी में लुढ़क गया।"},{"en":"The tailor quickly {{filched|चुरा ली}} the ring, {{mounted|सवार हुआ}} his horse and rode away. At the royal palace, the tailor showed the ring to the King and Queen and was welcomed as the long- absent prince.","hi":"दर्ज़ी ने जल्दी से अँगूठी चुरा ली, घोड़े पर सवार होकर निकल गया। शाही महल में दर्ज़ी ने राजा-रानी को अँगूठी दिखाई और लंबे समय से ग़ैरहाज़िर राजकुमार के रूप में उसका स्वागत हुआ।"},{"en":"Several hours later there was a terrific {{commotion|शोर-शराबा}} and an angry young man was led before the king and queen. The young man accused the tailor of being an {{impostor|धोखेबाज़}} who had stolen his ring and {{assumed|अपना लिया}} his {{identity|पहचान}}.","hi":"कई घंटे बाद ज़बरदस्त शोर-शराबा हुआ और एक ग़ुस्साए नौजवान को राजा-रानी के सामने लाया गया। नौजवान ने दर्ज़ी पर आरोप लगाया कि वह धोखेबाज़ है जिसने उसकी अँगूठी चुराकर उसकी पहचान अपना ली है।"}],[{"en":"The tailor hotly {{denied|इनकार किया}} it and declared that he was the true prince. The king was doubtful but the queen recognized the newcomer as her son.","hi":"दर्ज़ी ने ज़ोर से इनकार किया और कहा कि वही असली राजकुमार है। राजा को शक था, पर रानी ने नए आदमी को अपना बेटा पहचान लिया।"},{"en":"Since no positive proof was required she announced a test of skill with the winner being declared the true prince. Cloth and tailoring materials were given to the two men and they were ordered to make a shirt each.","hi":"चूँकि कोई पक्का सबूत नहीं था, उसने हुनर की परीक्षा का एलान किया, जिसमें जो जीते उसे असली राजकुमार घोषित किया जाना था। दोनों आदमियों को कपड़ा और सिलाई का सामान दिया गया और हर एक को एक कमीज़ बनाने को कहा गया।"},{"en":"“The one who makes the more beautiful {{garment|पोशाक}} will be accepted as the true prince,” declared the queen. Soon the contest began.","hi":"“जो ज़्यादा सुंदर पोशाक बनाएगा, उसे असली राजकुमार माना जाएगा,” रानी ने घोषणा की। जल्द ही मुक़ाबला शुरू हो गया।"}],[{"en":"The prince made a mess of his shirt but the tailor began a garment of great beauty. “Aha!","hi":"राजकुमार ने अपनी कमीज़ का कबाड़ा कर दिया, पर दर्ज़ी ने बेहद सुंदर पोशाक बनानी शुरू की। “अहा!"},{"en":"I’ve won!” he shouted pointing to the prince’s {{handiwork|हाथ की बनी चीज़}}. But to his surprise he was arrested and {{clapped|पहना दी गई}} in irons.","hi":"मैं जीत गया!” उसने राजकुमार की हाथ की बनी चीज़ की ओर इशारा करके चिल्लाया। पर उसे हैरानी हुई कि उसे गिरफ़्तार करके बेड़ियाँ पहना दी गईं।"},{"en":"“You are an impostor and a tailor at that,” said the Queen, “for only a tailor could have made such an {{exquisite|उम्दा}} garment.” The tailor hung his head and made no reply as the guards led him away to prison.","hi":"“तुम धोखेबाज़ हो, और वह भी दर्ज़ी,” रानी ने कहा, “क्योंकि सिर्फ़ दर्ज़ी ही ऐसी उम्दा पोशाक बना सकता था।” दर्ज़ी ने सिर झुका लिया और कोई जवाब नहीं दिया, और पहरेदार उसे जेल ले गए।"}]],"vocab":[["newcomer","noun","नया आदमी","stranger, arrival","veteran","a person who has just arrived"],["seal","noun","मुहर","stamp, emblem","—","an official mark pressed on a document or ring"],["grin","verb","दाँत दिखाकर मुस्कराना","smile, beam","frown","to smile broadly"],["slyly","adv","चालाकी से","craftily, cunningly","openly","in a secretive, tricky way"],["hatch","verb","(योजना) गढ़ना","devise, plot","abandon","to secretly plan something"],["con","verb","ठगना","swindle, cheat","—","to trick someone into believing something false"],["grove","noun","झुरमुट","orchard, thicket","—","a small group of trees"],["lace","verb","मिलाना (ख़ासकर नशा)","spike, mix","purify","to add a substance to food or drink"],["stupor","noun","बेहोशी, सुन्नता","daze, trance","alertness","a state of near unconsciousness"],["filch","verb","चुराना","steal, pilfer","return","to steal something small"],["mount","verb","सवार होना","climb, ride","dismount","to get up on a horse"],["commotion","noun","शोर-शराबा","uproar, disturbance","calm","a noisy and confused disturbance"],["impostor","noun","धोखेबाज़ (नक़लची)","fraud, pretender","genuine person","a person pretending to be someone else"],["assume","verb","अपना लेना; मान लेना","adopt, take on","reject","to take on a role or identity"],["identity","noun","पहचान","self, individuality","anonymity","who a person is"],["deny","verb","इनकार करना","refute, reject","admit","to say that something is not true"],["garment","noun","पोशाक","clothing, attire","—","an item of clothing"],["handiwork","noun","हाथ की बनी चीज़","creation, work","—","something made by hand or by a person’s effort"],["clap","verb","जल्दी से डाल देना","slap, shut","release","to put someone quickly into a place"],["exquisite","adj","उम्दा, नफ़ीस","delicate, superb","crude","extremely beautiful and delicately made"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["strike up (a conversation)","बातचीत शुरू करना","He struck up a conversation with a stranger.","to begin a talk or friendship"],["hang one’s head","शर्म से सिर झुकाना","The thief hung his head in shame.","to look ashamed"],["make a mess of","कबाड़ा कर देना","He made a mess of his work.","to do something very badly"]],"fq":[]},{"id":"ev-ed349","title":"The Witness","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"A thakur borrowed a large sum of money from a bania and despite repeated reminders failed to {{repay|चुकाना}} it. One day, the bania went to the thakur’s house when he was entertaining guests and demanded the money.","hi":"एक ठाकुर ने एक बनिये से बड़ी रक़म उधार ली और बार-बार याद दिलाने पर भी चुका नहीं पाया। एक दिन बनिया ठाकुर के घर गया, जब वह मेहमानों की ख़ातिरदारी कर रहा था, और पैसे माँगे।"},{"en":"The {{embarrassed|शर्मिंदा}} thakur promised to come to his place the next day with the money. But he had no {{intention|इरादा}} of repaying the loan.","hi":"शर्मिंदा ठाकुर ने वादा किया कि अगले दिन पैसे लेकर उसके घर आएगा। पर कर्ज़ चुकाने का उसका कोई इरादा नहीं था।"},{"en":"Instead, he wanted to take {{revenge|बदला}} against the bania for {{humiliating|अपमानित करना}} him in front of his guests. So one evening, he {{waylaid|रास्ता रोका}} the man on a {{deserted|सुनसान}} stretch of road.","hi":"इसके बजाय वह मेहमानों के सामने अपमानित करने के लिए बनिये से बदला लेना चाहता था। इसलिए एक शाम उसने सुनसान सड़क के एक हिस्से पर उसका रास्ता रोक लिया।"}],[{"en":"“No one can insult me and get away with it!” he said, drawing out his sword. The bania thought fast.","hi":"“कोई मेरा अपमान करके बच नहीं सकता!” उसने तलवार खींचते हुए कहा। बनिये ने तेज़ी से सोचा।"},{"en":"“I was expecting you would do something like this,” he said. “I've left a letter with my wife.","hi":"“मुझे उम्मीद थी कि आप ऐसा कुछ करेंगे,” उसने कहा। “मैंने अपनी पत्नी के पास एक चिट्ठी छोड़ी है।"},{"en":"If I do not return home by {{nightfall|रात ढलना}}, she will take the letter to the king. The letter details the business {{transaction|लेन-देन}} between us and the steps I took to recover the money.","hi":"अगर मैं रात ढलने तक घर न लौटा तो वह चिट्ठी राजा के पास ले जाएगी। चिट्ठी में हमारे बीच के लेन-देन और पैसे वसूलने के लिए मेरे उठाए क़दमों का ब्योरा है।"}],[{"en":"It also expresses the fear that you might do me some harm.” The thakur lowered his sword.","hi":"उसमें यह डर भी लिखा है कि आप मुझे नुक़सान पहुँचा सकते हैं।” ठाकुर ने तलवार नीची कर ली।"},{"en":"He knew that the bania could be {{bluffing|झाँसा देना}} but he did not want to take a chance. The king was known to be {{harsh|सख़्त}} on {{defaulters|कर्ज़ न चुकाने वाले}} and murderers.","hi":"वह जानता था कि बनिया शायद झाँसा दे रहा हो, पर वह जोखिम नहीं लेना चाहता था। राजा कर्ज़ न चुकाने वालों और हत्यारों के प्रति सख़्त माना जाता था।"},{"en":"“I’ll spare your {{worthless|बेकार}} life,” he said finally, “but I’ll chop off your nose. That’ll teach you a lesson you’ll never forget.”","hi":"“मैं तेरी बेकार जान बख़्श देता हूँ,” उसने आख़िर में कहा, “पर तेरी नाक काट दूँगा। यह तुझे ऐसा सबक़ देगी जो तू कभी नहीं भूलेगा।”"}],[{"en":"“If I write off your loan, will you forgive me?” asked the bania. “I might,” said the thakur {{guardedly|सतर्कता से}}, “but you must give me a {{receipt|रसीद}} to say I’ve paid you in full.","hi":"“अगर मैं आपका कर्ज़ माफ़ कर दूँ, तो क्या आप मुझे माफ़ कर देंगे?” बनिये ने पूछा। “शायद,” ठाकुर ने सतर्कता से कहा, “पर तुझे मुझे रसीद देनी होगी कि मैंने तुझे पूरा चुका दिया है।"},{"en":"I don’t trust you.” “I’ll make out a receipt right away,” said the bania, hastily opening his bundle of books.","hi":"मुझे तुझ पर भरोसा नहीं।” “मैं अभी रसीद बना देता हूँ,” बनिये ने जल्दी से अपनी बही-खातों की गठरी खोलते हुए कहा।"},{"en":"“But we’ll require a {{witness|गवाह}}.” “No witness!” cried the thakur.","hi":"“लेकिन हमें एक गवाह चाहिए होगा।” “कोई गवाह नहीं!” ठाकुर चिल्लाया।"}],[{"en":"“Just give me a receipt to say that I’ve paid you in full.” “The receipt has no value unless there is a witness,” said the bania.","hi":"“बस मुझे रसीद दे दो कि मैंने पूरा पैसा चुका दिया।” “गवाह के बिना रसीद की कोई क़ीमत नहीं,” बनिये ने कहा।"},{"en":"“Why don’t we make that old banyan tree a witness?” The thakur reasoned that there could be no harm in making a banyan tree a witness.","hi":"“क्यों न हम उस पुराने बरगद के पेड़ को गवाह बना लें?” ठाकुर ने सोचा कि बरगद के पेड़ को गवाह बनाने में कोई हर्ज़ नहीं है।"},{"en":"It could not reveal the circumstances in which the receipt was made. So he agreed.","hi":"वह उस हालात के बारे में कुछ नहीं बता सकता था जिनमें रसीद बनी। इसलिए वह मान गया।"}],[{"en":"They stood under the banyan tree and the bania wrote out the receipt and gave it to the thakur, who pocketed it and went away, feeling very pleased with himself. But the very next day, he received a {{summons|बुलावा}} from the king.","hi":"वे बरगद के नीचे खड़े हुए, बनिये ने रसीद लिखकर ठाकुर को दे दी, जो उसे जेब में रखकर बहुत ख़ुश होता हुआ चला गया। पर अगले ही दिन उसे राजा का बुलावा मिला।"},{"en":"When he went to the king's palace, he found the bania there. “Did you borrow money from this man?” asked the king.","hi":"जब वह राजा के महल गया तो वहाँ बनिये को पाया। “क्या तुमने इस आदमी से पैसे उधार लिए थे?” राजा ने पूछा।"},{"en":"“I did,” said the thakur. “Why haven’t you repaid it?”","hi":"“हाँ,” ठाकुर ने कहा। “तुमने उसे चुकाया क्यों नहीं?”"}],[{"en":"“But I have,” said the thakur and {{triumphantly|जीत की मुस्कान से}} taking out the receipt from his pocket, handed it over to the king. “So your witness was a banyan tree,” said the king, looking at the receipt.","hi":"“पर मैंने तो चुका दिया है,” ठाकुर ने कहा और जीत की मुस्कान के साथ जेब से रसीद निकालकर राजा को थमा दी। “तो तुम्हारा गवाह बरगद का पेड़ था,” राजा ने रसीद देखकर कहा।"},{"en":"“Yes,” said the thakur, “there was nobody else there.” “So you admit accosting him in a deserted spot?”","hi":"“हाँ,” ठाकुर ने कहा, “वहाँ और कोई नहीं था।” “तो तुम मानते हो कि तुमने उसे सुनसान जगह पर रोका था?”"},{"en":"“No, no,” said the thakur, panicking. “I...","hi":"“नहीं, नहीं,” ठाकुर ने घबराकर कहा। “मैं…"}],[{"en":"I... just happened to meet him there.” “Anyway this receipt is useless,” said the king.","hi":"मैं… बस वहाँ यूँ ही उससे मिल गया था।” “वैसे यह रसीद बेकार है,” राजा ने कहा।"},{"en":"“It does not carry this man’s {{signature|दस्तख़त}}, only the witness’s.” “What!” gasped the thakur, taking the paper from the king’s hand.","hi":"“इस पर इस आदमी के नहीं, सिर्फ़ गवाह के दस्तख़त हैं।” “क्या!” ठाकुर हाँफ गया और राजा के हाथ से काग़ज़ ले लिया।"},{"en":"He stared at it and turned pale. Instead of putting his signature at the bottom, the bania had {{scribbled|घसीटा}}: “Banyan Tree”.","hi":"वह उसे घूरता रहा और उसका चेहरा पीला पड़ गया। नीचे अपने दस्तख़त करने के बजाय बनिये ने घसीटा था: “बरगद का पेड़”।"}]],"vocab":[["repay","verb","चुकाना","pay back, refund","borrow","to pay back money owed"],["embarrassed","adj","शर्मिंदा","ashamed, awkward","comfortable","feeling shy or ashamed in front of others"],["intention","noun","इरादा","aim, purpose","accident","a plan or aim in the mind"],["revenge","noun","बदला","vengeance, retaliation","forgiveness","harm done to repay an earlier harm"],["humiliate","verb","अपमानित करना","shame, disgrace","honour","to make someone feel ashamed in public"],["waylay","verb","रास्ता रोकना","ambush, intercept","let pass","to stop someone on the way, often to attack"],["deserted","adj","सुनसान","empty, lonely","crowded","with no people around"],["nightfall","noun","रात ढलना, साँझ","dusk, sunset","dawn","the time when night begins"],["transaction","noun","लेन-देन","deal, dealing","—","an act of buying, selling or exchanging"],["bluff","verb","झाँसा देना","fake, deceive","tell the truth","to pretend to have strength or knowledge one lacks"],["harsh","adj","सख़्त, कठोर","severe, strict","gentle","cruel or very strict"],["defaulter","noun","कर्ज़ न चुकाने वाला","non-payer, debtor","payer","a person who fails to pay a debt"],["worthless","adj","बेकार, निकम्मा","useless, valueless","valuable","having no value or use"],["guardedly","adv","सतर्कता से","cautiously, warily","openly","in a careful way that reveals little"],["receipt","noun","रसीद","voucher, proof of payment","—","a written note showing money has been paid"],["witness","noun","गवाह","observer, onlooker","—","a person who sees an event and can testify"],["summons","noun","बुलावा, समन","call, order to appear","dismissal","an order to appear before a court or ruler"],["triumphantly","adv","जीत की ख़ुशी से","victoriously, jubilantly","dejectedly","with the joy of success"],["signature","noun","दस्तख़त","autograph, mark","—","a person’s name written in their own hand"],["scribble","verb","घसीटना, जल्दी में लिखना","scrawl, jot","print neatly","to write quickly and carelessly"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["get away with","बच निकलना","Nobody can cheat and get away with it.","to escape punishment"],["write off","(कर्ज़) माफ़ करना","The bank wrote off the loan.","to cancel a debt"],["take a chance","जोखिम उठाना","He did not want to take a chance.","to risk something"]],"fq":[]},{"id":"ev-ed357","title":"Uninvited Guest","src":"Evergreen library · Topic: Health & Environment","c":"Health & Environment","todo":"","ed":[[{"en":"One rainy day, a holy man knocked at the door of the {{stingiest|सबसे कंजूस}} couple in the village. The couple had just sat down to a {{frugal|सादा, किफ़ायती}} meal of cucumbers and they were not at all pleased to be disturbed.","hi":"एक बरसात के दिन एक साधु ने गाँव के सबसे कंजूस दंपति का दरवाज़ा खटखटाया। दंपति अभी-अभी खीरे का सादा-सा भोजन करने बैठा था और उन्हें परेशान किए जाने पर बिल्कुल अच्छा नहीं लगा।"},{"en":"However, you cannot ignore a knock on your door so the husband went and opened it. The holy man came in.","hi":"फिर भी दरवाज़े की दस्तक को अनसुना नहीं किया जा सकता, इसलिए पति ने जाकर दरवाज़ा खोला। साधु अंदर आ गया।"},{"en":"“So kind of you to invite me in,” he said. “I’m {{drenched|पूरा भीगा}}.”","hi":"“मुझे अंदर बुलाने की आपकी कितनी कृपा है,” उसने कहा। “मैं पूरा भीग गया हूँ।”"}],[{"en":"As the couple watched open-mouthed, he took off his kurta, {{wrung|निचोड़ा}} the water out of it and hung it on a nail in the wall. “We were just about to eat,” said the husband.","hi":"दंपति मुँह खोले देखते रहे और उसने अपना कुर्ता उतारा, उसका पानी निचोड़ा और उसे दीवार की कील पर टाँग दिया। “हम खाना खाने ही वाले थे,” पति ने कहा।"},{"en":"“You can join us if you wish but as you can see we really don’t have enough for three.” “You go ahead with your meal,” said the holy man.","hi":"“चाहें तो आप भी साथ आ सकते हैं, पर आप देख रहे हैं कि तीन के लिए सचमुच काफ़ी नहीं है।” “आप अपना भोजन कीजिए,” साधु ने कहा।"},{"en":"“Don’t mind me. I’ll just take a cucumber.”","hi":"“मेरी चिंता मत कीजिए। मैं बस एक खीरा ले लेता हूँ।”"}],[{"en":"Before the couple could say anything he picked up a cucumber from the table and began to eat. There were only three cucumbers left.","hi":"दंपति कुछ कह पाता, इससे पहले उसने मेज़ से एक खीरा उठाया और खाने लगा। अब सिर्फ़ तीन खीरे बचे थे।"},{"en":"The {{host|मेज़बान}} quickly picked up two for himself and his wife picked up the remaining one. “Very good, very good,” said the holy man, {{munching|चबाते हुए}} noisily.","hi":"मेज़बान ने झट से दो अपने लिए उठा लिए और पत्नी ने बचा हुआ एक उठा लिया। “बहुत बढ़िया, बहुत बढ़िया,” साधु ने ज़ोर-ज़ोर से चबाते हुए कहा।"},{"en":"“Needs a little salt, though.” “We’re out of salt,” said the woman, {{tersely|रूखेपन से}}.","hi":"“थोड़ा नमक चाहिए था।” “नमक ख़त्म है,” औरत ने रूखेपन से कहा।"}],[{"en":"“I’ve finished, anyway,” said the holy man. “Best meal I’ve had in a long time.","hi":"“वैसे मेरा तो हो गया,” साधु ने कहा। “बहुत समय बाद इतना बढ़िया खाना खाया।"},{"en":"Well, the rain seems to have stopped and I must be on my way.” The couple {{heaved|भरी (साँस)}} a sigh of relief.","hi":"अच्छा, बारिश थम गई लगती है और अब मुझे चलना चाहिए।” दंपति ने राहत की साँस ली।"},{"en":"“As you have been so good to me,” said the guest, pulling on his kurta, “I will {{grant|वरदान देना}} you three wishes.” “Three wishes!” {{gasped|हाँफ गया}} the man.","hi":"“आपने मेरे साथ इतनी भलाई की है,” मेहमान ने कुर्ता पहनते हुए कहा, “इसलिए मैं आपको तीन वरदान दूँगा।” “तीन वरदान!” आदमी हाँफ गया।"}],[{"en":"He {{prostrated|दंडवत हुआ}} and caught hold of the man’s feet. “Give me the golden touch,” he {{pleaded|गिड़गिड़ाया}}.","hi":"वह दंडवत हुआ और साधु के पैर पकड़ लिए। “मुझे सोने का स्पर्श दीजिए,” उसने गिड़गिड़ाकर माँगा।"},{"en":"“Anything I touch, should turn to gold.” “Please let go of my feet, first,” said the holy man, backing away.","hi":"“मैं जिस चीज़ को छुऊँ, वह सोने की हो जाए।” “पहले मेरे पैर छोड़ दीजिए,” साधु ने पीछे हटते हुए कहा।"},{"en":"“I grant you your wish.” The man touched a pot and it turned to gold.","hi":"“मैं आपकी इच्छा पूरी करता हूँ।” आदमी ने एक बर्तन छुआ और वह सोने का हो गया।"}],[{"en":"He touched a chair and it turned to gold. He began to rush around the house, touching everything.","hi":"उसने एक कुर्सी छुई और वह सोने की हो गई। वह घर में हर चीज़ को छूता हुआ भागने लगा।"},{"en":"“For my wish,” said the wife, prostrating and touching the holy man’s feet, “I want that everything I touch should become long. You saw how small the cucumbers were.","hi":"“मेरी इच्छा यह है,” पत्नी ने दंडवत होकर साधु के पैर छूते हुए कहा, “कि मैं जिस चीज़ को छुऊँ, वह लंबी हो जाए। आपने देखा खीरे कितने छोटे थे।"},{"en":"If I could make them long, my husband and I would never have to go half-hungry again.” “Let go of my feet, first,” said the holy man.","hi":"अगर मैं उन्हें लंबा कर सकूँ तो मुझे और मेरे पति को कभी आधा पेट नहीं रहना पड़ेगा।” “पहले मेरे पैर छोड़िए,” साधु ने कहा।"}],[{"en":"“As for your wish, well, you can have it.” The woman got up and touched a tiny green chilli lying on the table.","hi":"“तुम्हारी इच्छा की बात है, वह भी पूरी होगी।” औरत उठी और मेज़ पर पड़ी एक नन्ही हरी मिर्च को छुआ।"},{"en":"Instantly it became a metre long. Her {{squeal|ख़ुशी की चीख़}} of delight woke up their {{infant|शिशु}} son who was sleeping in a {{cradle|पालना}}.","hi":"वह तुरंत एक मीटर लंबी हो गई। उसकी ख़ुशी भरी चीख़ से पालने में सो रहा उसका शिशु बेटा जाग गया।"},{"en":"“{{Hush|चुप}}, my little raja,” said the woman, and {{unthinkingly|बिना सोचे}}, touched his nose. Immediately it began to grow.","hi":"“चुप, मेरे नन्हे राजा,” औरत ने कहा और बिना सोचे उसकी नाक छू दी। वह तुरंत बढ़ने लगी।"}],[{"en":"Her scream brought her husband running to the spot. He picked up the baby and found that he was holding a golden statue.","hi":"उसकी चीख़ सुनकर पति दौड़ा आया। उसने बच्चे को उठाया तो पाया कि वह सोने की मूर्ति थामे है।"},{"en":"“I want my baby, please give me back my baby,” said the woman to the holy man. “I can bring him back to life,” said the holy man.","hi":"“मुझे मेरा बच्चा चाहिए, कृपया मेरा बच्चा लौटा दीजिए,” औरत ने साधु से कहा। “मैं उसे दोबारा जीवित कर सकता हूँ,” साधु ने कहा।"},{"en":"“But if I do, both of you will lose your powers.” “That doesn’t matter,” said the woman.","hi":"“लेकिन ऐसा किया तो तुम दोनों की शक्तियाँ चली जाएँगी।” “कोई बात नहीं,” औरत ने कहा।"}],[{"en":"Hardly had the words left her mouth than everything that had been turned to gold, including the baby, {{reverted|लौट आई}} to its original state. The chilli and the baby’s nose too became small again.","hi":"उसके मुँह से शब्द निकले ही थे कि सोने में बदली हर चीज़, बच्चे समेत, अपनी असली हालत में लौट आई। मिर्च और बच्चे की नाक भी फिर छोटी हो गई।"},{"en":"The woman hugged her baby with joy. “Could I have a small part of my power back?” asked her husband, turning around to address the holy man.","hi":"औरत ने ख़ुशी से बच्चे को गले लगा लिया। “क्या मुझे मेरी शक्ति का थोड़ा-सा हिस्सा वापस मिल सकता है?” पति ने साधु की ओर मुड़कर पूछा।"},{"en":"But he was no longer there. He had {{vanished|ग़ायब हो गया}}.","hi":"पर साधु अब वहाँ नहीं था। वह ग़ायब हो चुका था।"}],[{"en":"“It was God himself,” said his wife, “and we treated him so {{shabbily|बुरे ढंग से}}.” But her husband wasn’t listening.","hi":"“वे तो साक्षात् भगवान थे,” उसकी पत्नी ने कहा, “और हमने उनके साथ कितना बुरा बर्ताव किया।” पर उसका पति सुन नहीं रहा था।"},{"en":"He was touching and re-touching everything to see if anything turned to gold.","hi":"वह हर चीज़ को बार-बार छूकर देख रहा था कि कहीं कुछ सोने का तो नहीं हो गया।"}]],"vocab":[["stingy","adj","कंजूस","miserly, tight-fisted","generous","unwilling to spend or give"],["frugal","adj","किफ़ायती, सादा","thrifty, economical","extravagant","spending little; simple and cheap"],["drenched","adj","पूरा भीगा","soaked, sodden","dry","completely wet"],["wring","verb","निचोड़ना","squeeze, twist","—","to squeeze water out by twisting"],["host","noun","मेज़बान","entertainer, landlord","guest","a person who receives guests"],["munch","verb","चबाना","chew, crunch","—","to chew noisily and steadily"],["tersely","adv","रूखेपन से, संक्षेप में","curtly, briefly","at length","in a short and slightly rude way"],["heave","verb","भारी साँस लेना; खींचना","sigh, lift","drop","to give a deep sigh, or lift with effort"],["grant","verb","प्रदान करना","bestow, give","refuse","to give or allow something wished for"],["gasp","verb","हाँफना, चौंककर साँस लेना","pant, catch breath","—","to take a short breath in shock"],["prostrate","verb","दंडवत होना","bow down, kneel","stand","to lie face down in respect"],["plead","verb","गिड़गिड़ाना","beg, implore","demand","to ask in an emotional, urgent way"],["squeal","noun","तीखी चीख़","shriek, screech","whisper","a loud high-pitched cry"],["infant","noun","शिशु","baby, newborn","adult","a very young child"],["cradle","noun","पालना","crib, cot","—","a small bed for a baby that rocks"],["hush","interj","चुप! शांत!","quiet, silence","noise","a call to be quiet"],["unthinkingly","adv","बिना सोचे","carelessly, heedlessly","carefully","without thinking about the result"],["revert","verb","पुरानी हालत में लौटना","return, go back","change","to go back to a former state"],["vanish","verb","ग़ायब होना","disappear, fade","appear","to disappear suddenly"],["shabbily","adv","बुरे ढंग से","poorly, meanly","well","in an unfair or unkind way"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["go ahead","आगे बढ़ना, शुरू करना","You go ahead with your meal.","to proceed"],["turn to gold","सोने में बदल जाना","Everything he touched turned to gold.","to become gold or very successful"],["back away","पीछे हटना","The holy man backed away.","to move away from something"]],"fq":[]},{"id":"ev-ed360","title":"Whatever Happens, Happens For The Best","src":"Evergreen library · Topic: Science & Tech","c":"Science & Tech","todo":"","ed":[[{"en":"The Jewish {{rabbi|यहूदी धर्मगुरु}}, Akiba was travelling to a distant land, beyond a desert. One evening, he arrived at a small village, and decided to spend the night there.","hi":"यहूदी धर्मगुरु अकीबा एक रेगिस्तान के पार किसी दूर देश की यात्रा कर रहे थे। एक शाम वे एक छोटे गाँव पहुँचे और रात वहीं बिताने का फ़ैसला किया।"},{"en":"But to his {{astonishment|हैरानी}} and {{dismay|निराशा}}, he found that the villagers were extremely {{suspicious|शक करने वाले}} of travellers. No one would give him {{shelter|आश्रय}}.","hi":"लेकिन उन्हें हैरानी और निराशा हुई कि गाँव वाले यात्रियों पर बेहद शक करते थे। किसी ने उन्हें आश्रय नहीं दिया।"},{"en":"\"It is hard to believe that any people can be so {{inhospitable|मेहमान-विरोधी}}, thought the rabbi . \"But after all, God is just, and whatever happens, happens for the best.","hi":"“यक़ीन करना कठिन है कि लोग इतने मेहमान-विरोधी हो सकते हैं,” धर्मगुरु ने सोचा। “पर आख़िर ईश्वर न्यायी है, और जो होता है, अच्छे के लिए ही होता है।”"}],[{"en":"He had only four {{possessions|संपत्ति, चीज़ें}} besides the clothes on his back: a book, a lamp, a cock that used to wake him at dawn with its {{crowing|बाँग देना}}, and an ass on which he rode. On being refused shelter by the villagers, he went some distance ahead, and settled himself under a tree.","hi":"तन के कपड़ों के सिवा उनके पास सिर्फ़ चार चीज़ें थीं: एक किताब, एक दीया, एक मुर्गा जो भोर में बाँग देकर उन्हें जगाता था, और एक गधा जिस पर वे सवारी करते थे। गाँव वालों से आश्रय न मिलने पर वे थोड़ी दूर आगे गए और एक पेड़ के नीचे बैठ गए।"},{"en":"He lit his lamp and opened his book so that he might read a few pages before going to sleep. He had read only a page when a {{gust|हवा का झोंका}} of wind blew out the light.","hi":"उन्होंने दीया जलाया और किताब खोली ताकि सोने से पहले कुछ पन्ने पढ़ लें। अभी एक ही पन्ना पढ़ा था कि हवा के झोंके ने रोशनी बुझा दी।"},{"en":"\"What!\" exclaimed the rabbi. “Am i not {{permitted|इजाज़त मिली}} even to read?","hi":"“अरे!” धर्मगुरु चिल्लाए। “क्या मुझे पढ़ने तक की इजाज़त नहीं?"}],[{"en":"But God is just, and whatever happens, happens for the best”. He stretched himself on the cold, bare earth to try to get a few hours’ sleep.","hi":"पर ईश्वर न्यायी है, और जो होता है, अच्छे के लिए ही होता है।” वे ठंडी, खुली ज़मीन पर लेट गए ताकि कुछ घंटे सो सकें।"},{"en":"Just as he was {{dozing|ऊँघना}} off, there was a cry of alarm from his cock followed by a loud {{flapping|फड़फड़ाना}} of wings. A wolf had caught the bird.","hi":"वे ऊँघने ही लगे थे कि उनके मुर्गे की घबराई चीख़ सुनाई दी, फिर पंख फड़फड़ाने की तेज़ आवाज़ आई। एक भेड़िये ने पक्षी को पकड़ लिया था।"},{"en":"My {{faithful|वफ़ादार}} companion gone! thought the rabbi, and in such a {{ghastly|भयानक}} manner. But God is just and whatever happens, happens for the best.","hi":"मेरा वफ़ादार साथी चला गया! धर्मगुरु ने सोचा, और वह भी इतने भयानक ढंग से। पर ईश्वर न्यायी है और जो होता है, अच्छे के लिए ही होता है।"}],[{"en":"Still later that night, a lion {{pounced|झपटा}} on the ass and carried it away. Once again the rabbi told himself that whatever had happened, had happened for the best.","hi":"उस रात और देर से एक शेर गधे पर झपटा और उसे उठा ले गया। धर्मगुरु ने एक बार फिर ख़ुद से कहा कि जो हुआ, अच्छे के लिए ही हुआ।"},{"en":"After a sleepless night, he went back to the village to see if he could obtain a horse to carry him the rest of the way, but to his horror he found that all the houses had been {{plundered|लूटे गए}} and their inhabitants {{slaughtered|मार डाले गए}} by robbers, during the night. \"Had these people not turned me away, I would have {{perished|मर जाता}} with them,\" thought the rabbi, and had the wind not blown out my light, the robbers would have {{detected|भाँप लेते}} my presence, and had wild beasts not carried away my animals, the noises they made would have betrayed my presence to those {{marauders|डाकू}}, and I too would have lost my life.","hi":"नींद-रहित रात के बाद वे बाक़ी रास्ते के लिए घोड़ा पाने गाँव लौटे, पर उन्होंने भय के साथ देखा कि रात में लुटेरों ने सारे घर लूट लिए थे और उनके निवासियों को मार डाला था। “अगर इन लोगों ने मुझे लौटाया न होता, तो मैं भी इनके साथ मर जाता,” धर्मगुरु ने सोचा, “और अगर हवा ने मेरा दीया न बुझाया होता, तो लुटेरे मेरी मौजूदगी भाँप लेते, और अगर जंगली जानवर मेरे जानवर न ले गए होते, तो उनके शोर से उन डाकुओं को मेरी उपस्थिति का पता चल जाता, और मैं भी अपनी जान गँवा बैठता।”"},{"en":"God is just, and whatever happens, happens for the best.\"","hi":"ईश्वर न्यायी है, और जो होता है, अच्छे के लिए ही होता है।”"}]],"vocab":[["rabbi","noun","यहूदी धर्मगुरु","Jewish teacher, scholar","—","a Jewish religious teacher or leader"],["astonishment","noun","हैरानी","amazement, surprise","indifference","great surprise"],["dismay","noun","निराशा, घबराहट","distress, alarm","delight","a feeling of worry and disappointment"],["suspicious","adj","शक करने वाला","wary, distrustful","trusting","not trusting someone or something"],["shelter","noun","आश्रय","refuge, cover","exposure","protection from weather or danger"],["inhospitable","adj","मेहमान-विरोधी","unwelcoming, hostile","hospitable","not welcoming to visitors"],["possession","noun","संपत्ति, सामान","belonging, property","—","something that a person owns"],["crow","verb","बाँग देना","call, cry","—","to make the loud sound of a rooster"],["gust","noun","हवा का झोंका","blast, puff","calm","a sudden strong rush of wind"],["permit","verb","इजाज़त देना","allow, let","forbid","to give permission"],["doze","verb","ऊँघना","nap, nod off","wake","to sleep lightly for a short time"],["flap","verb","फड़फड़ाना","flutter, beat","—","to move wings up and down quickly"],["faithful","adj","वफ़ादार","loyal, devoted","unfaithful","staying true to someone"],["ghastly","adj","भयानक","horrible, dreadful","pleasant","causing great fear or shock"],["pounce","verb","झपटना","spring, swoop","retreat","to jump suddenly to catch something"],["plunder","verb","लूटना","loot, pillage","protect","to steal goods by force"],["slaughter","verb","बेरहमी से मारना","massacre, butcher","spare","to kill in a cruel way"],["perish","verb","मर जाना, नष्ट होना","die, expire","survive","to die or be destroyed"],["detect","verb","भाँपना, पता लगाना","notice, discover","miss","to discover or notice something"],["marauder","noun","लुटेरा, डाकू","raider, bandit","protector","a person who raids in search of plunder"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["after all","आख़िरकार, आख़िर","After all, God is just.","in spite of what was said before"],["turn away","लौटा देना, भगा देना","They turned the traveller away.","to refuse entry or help"],["carry away","उठा ले जाना","A lion carried away the ass.","to take something with force"]],"fq":[]},{"id":"ev-ed364","title":"Why science alone cannot make us happy","src":"Evergreen library · Topic: Sports","c":"Sports","todo":"","ed":[[{"en":"We all dream of a better world where there is peace, happiness, and {{harmony|सामंजस्य}}. However, when we look at the present world scenario, we come to the conclusion that certain things have gone wrong, and we feel that something is definitely {{amiss|गड़बड़}}.","hi":"हम सब एक बेहतर दुनिया का सपना देखते हैं जहाँ शांति, खुशी और सामंजस्य हो। लेकिन आज के हालात देखकर लगता है कि कुछ तो ज़रूर गड़बड़ हो गई है।"},{"en":"We infer that {{lapses|चूकें}} on our part have led to our present state of increasing mess. It is either our {{ignorance|अज्ञानता}} of the principles of happy living that holds us away from our cherished goals, or {{wilful|जानबूझकर}} violation of certain basic laws of life and living in a society has led us into this sorry state of affairs.","hi":"हमें लगता है कि हमारी ही चूकों ने आज की बिगड़ती स्थिति पैदा की है। या तो खुशहाल जीवन के सिद्धांतों के प्रति हमारी अज्ञानता हमें मंज़िल से दूर रखे है, या समाज में जीने के बुनियादी नियमों को जानबूझकर तोड़ने से हम इस बुरी हालत में पहुँचे हैं।"},{"en":"Otherwise, how would we explain why we are sinking ever deeper into the marshland of poverty and pollution, or into the {{morass|दलदल}} of corruption and crime? In spite of achieving the highest- ever level of scientific and technological development, a significant percentage of our people are still living in a state of trauma, tension, {{turmoil|उथल-पुथल}}, poverty, {{squalor|गंदगी}}, and disease.","hi":"वरना हम गरीबी और प्रदूषण के, या भ्रष्टाचार और अपराध के दलदल में और गहरे क्यों धँसते जा रहे हैं? विज्ञान और तकनीक के सर्वोच्च विकास के बावजूद हमारे बहुत से लोग आज भी सदमे, तनाव, उथल-पुथल, गरीबी, गंदगी और बीमारी में जी रहे हैं।"}],[{"en":"Our managerial skills have become so {{sophisticated|परिष्कृत}} that we can run mega-industries and multinational corporations, yet we are unable to manage ourselves; as a result, our families and society continuously struggle for existence. We have achieved a great fund of knowledge and learnt methods of human resource development, yet there is a steep downfall in civil life and {{deterioration|गिरावट}} in human relations, leaving only make — believe love and showy co-operation with expectations of return.","hi":"हमारे प्रबंधन-कौशल इतने परिष्कृत हो गए हैं कि हम विशाल उद्योग और बहुराष्ट्रीय कंपनियाँ चला लेते हैं, फिर भी खुद को नहीं संभाल पाते; नतीजतन हमारे परिवार और समाज लगातार जूझ रहे हैं। हमने ज्ञान का बड़ा भंडार पाया और मानव-संसाधन विकास की विधियाँ सीखीं, फिर भी सामाजिक जीवन में भारी गिरावट है और रिश्ते बिगड़ रहे हैं; बस दिखावटी प्रेम और बदले की उम्मीद वाला दिखावटी सहयोग बचा है।"},{"en":"In short, there is increasing environmental deterioration, economic {{stagnation|ठहराव}} in advanced countries, unemployment, inflation, and misery in less-developed countries, hunger and {{malnutrition|कुपोषण}} in many parts of the world, and urban deterioration and crime rise everywhere. Do these not point to either our ignorance of basic laws of happy living or actions that contradict essential principles of life?","hi":"संक्षेप में, पर्यावरण बिगड़ रहा है, विकसित देशों में आर्थिक ठहराव है, कम विकसित देशों में बेरोज़गारी, महँगाई और दुख है, दुनिया के कई हिस्सों में भूख और कुपोषण है, और हर जगह शहरी बदहाली व अपराध बढ़ रहे हैं। क्या ये इशारा नहीं करते कि या तो हम सुखी जीवन के मूल नियम नहीं जानते, या जीवन के आवश्यक सिद्धांतों के उलट काम करते हैं?"},{"en":"It should not be difficult to understand that certain laws govern our {{mutual|आपसी}} relationships and human behaviour. These are known as moral laws or {{ethical|नैतिक}} principles.","hi":"यह समझना कठिन नहीं होना चाहिए कि हमारे आपसी रिश्तों और मानव-व्यवहार को कुछ नियम चलाते हैं। इन्हें नैतिक नियम या सिद्धांत कहा जाता है।"}],[{"en":"Based on these are {{norms|मानदंड}}, codes of conduct, or rules and regulations to be followed in an organised society. If we follow these laws, the quality and quantity of happiness in our life is {{enhanced|बढ़ाया गया}}; if we violate them, we face many problems and disturbances.","hi":"इन्हीं पर आधारित मानदंड, आचार-संहिताएँ या नियम-कानून संगठित समाज में माने जाते हैं। इन नियमों का पालन करें तो हमारे जीवन में सुख की गुणवत्ता और मात्रा बढ़ती है; तोड़ें तो अनेक समस्याएँ और बाधाएँ आती हैं।"},{"en":"Observance of moral norms is of great value if we wish to be happy and build a society free from {{friction|टकराव}} in human relations and tensions in day-to-day life. These are therefore called values.","hi":"यदि हम सुखी रहना और ऐसा समाज बनाना चाहते हैं जिसमें रिश्तों में टकराव और रोज़ के जीवन में तनाव न हो, तो नैतिक मानदंडों का पालन बहुत मूल्यवान है। इसीलिए इन्हें मूल्य कहा जाता है।"},{"en":"Our present sorry state is the result of {{neglect|उपेक्षा}} or violation of those values. We have gradually lost the human aspect of our life and become more or less like machines; as a result, there is no spirit of friendship, fellow-feeling, and love in our life.","hi":"हमारी आज की बुरी हालत उन्हीं मूल्यों की उपेक्षा या उल्लंघन का परिणाम है। हमने धीरे-धीरे अपने जीवन का मानवीय पक्ष खो दिया और लगभग मशीनों जैसे बन गए; इसलिए हमारे जीवन में मित्रता, सहानुभूति और प्रेम की भावना नहीं रही।"}],[{"en":"In other words, there has been rapid {{erosion|क्षरण}} of social, moral, and family values. It is not that science, technology, or management skills have caused our present sufferings; on the contrary, it is the fall in moral standards that prevents even science, technology, and management or administrative ability from giving their full fruits.","hi":"दूसरे शब्दों में, सामाजिक, नैतिक और पारिवारिक मूल्यों का तेज़ी से क्षरण हुआ है। हमारे वर्तमान कष्टों का कारण विज्ञान, तकनीक या प्रबंधन-कौशल नहीं हैं; बल्कि नैतिक स्तर की गिरावट ही विज्ञान, तकनीक और प्रशासनिक क्षमता को पूरा फल देने से रोकती है।"},{"en":"Moreover, it is not that people do not know moral values are necessary to build a happy and peaceful society. People wish to have moral qualities but lack spiritual knowledge that enables them to follow these values successfully, nor do they know the kind of meditation that helps retain these values and gives deep experience of peace and happiness.","hi":"इसके अलावा, ऐसा नहीं है कि लोग नहीं जानते कि सुखी और शांत समाज के लिए नैतिक मूल्य ज़रूरी हैं। लोग नैतिक गुण चाहते हैं, पर उनके पास वह आध्यात्मिक ज्ञान नहीं है जो उन मूल्यों को सफलतापूर्वक निभाने में मदद करे, न ही वे उस ध्यान को जानते हैं जो इन मूल्यों को बनाए रखता है और शांति व सुख का गहरा अनुभव देता है।"},{"en":"Thus, the need of the hour is to create mass awareness of values like {{tolerance|सहनशीलता}} and mutual respect in order to realise our dream of a world with peace and harmony.","hi":"इसलिए, शांति और सामंजस्य वाली दुनिया का सपना साकार करने के लिए सहनशीलता और आपसी सम्मान जैसे मूल्यों के प्रति जन-जागरूकता पैदा करना आज की ज़रूरत है।"}]],"vocab":[["harmony","noun","सामंजस्य","accord, unity, peace","discord","a state of peaceful agreement and living together"],["amiss","adjective","गड़बड़","wrong, faulty, awry","right","not right; wrong or out of order"],["lapse","noun","चूक","slip, error, failure","success","a small mistake or failure in duty or conduct"],["ignorance","noun","अज्ञानता","unawareness, innocence","knowledge","lack of knowledge or information"],["wilful","adjective","जानबूझकर किया गया","deliberate, intentional","accidental","done on purpose despite knowing it is wrong"],["morass","noun","दलदल","swamp, mess, bog","order","a difficult or confused situation; a swamp"],["squalor","noun","गंदगी / दरिद्रता","filth, dirt, misery","cleanliness","dirty and unpleasant condition from neglect or poverty"],["turmoil","noun","उथल-पुथल","chaos, unrest, upheaval","calm","a state of great confusion or disturbance"],["sophisticated","adjective","परिष्कृत / उन्नत","advanced, refined","simple","highly developed and complex"],["deterioration","noun","गिरावट","decline, decay, worsening","improvement","the process of becoming worse"],["stagnation","noun","ठहराव","standstill, inactivity","growth","a state of no growth or development"],["malnutrition","noun","कुपोषण","undernourishment","nourishment","poor health from lack of proper food"],["norm","noun","मानदंड","standard, rule, custom","anomaly","an accepted standard of behaviour in a society"],["friction","noun","टकराव","conflict, discord","harmony","disagreement or conflict between people"],["erosion","noun","क्षरण","wearing away, decline","growth","gradual destruction or weakening"],["ethical","adjective","नैतिक","moral, righteous","unethical","relating to right and wrong conduct"],["enhance","verb","बढ़ाना","improve, boost","reduce","to make something greater or better"],["neglect","noun","उपेक्षा","disregard, negligence","care","failure to give proper care or attention"],["tolerance","noun","सहनशीलता","patience, acceptance","intolerance","willingness to accept different views or behaviour"],["mutual","adjective","आपसी","shared, reciprocal","one-sided","felt or done by each towards the other"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["gone wrong","गड़बड़ हो जाना","Something has gone wrong with my laptop.","to fail or develop a fault"],["on the contrary","इसके विपरीत","He is not lazy; on the contrary, he works hard.","used to say the opposite is true"],["the need of the hour","समय की ज़रूरत","Water saving is the need of the hour.","something urgently required at present"]],"fq":[]},{"id":"ev-ed371","title":"Meditation does not need time","src":"Evergreen library · Topic: Speaking Tree","c":"Speaking Tree","todo":"","ed":[[{"en":"Modern man in this age of speed, {{hurry|जल्दबाज़ी}}, activity, and {{tensions|तनाव}}, feels completely {{exhausted|थका हुआ}} after a day’s work. In this situation, it becomes difficult for him to have inner silence and {{stillness|स्थिरता}}.","hi":"आज की तेज़ रफ़्तार, भागदौड़, गतिविधि और तनाव की इस उम्र में आधुनिक मनुष्य दिन भर के काम के बाद पूरी तरह थका हुआ महसूस करता है। ऐसे में उसके लिए भीतर की शांति और स्थिरता पाना कठिन हो जाता है।"},{"en":"The situation appears to be so. It is not.","hi":"स्थिति ऐसी ही दिखती है। पर ऐसा नहीं है।"},{"en":"Rather, the situation is quite {{vice versa|उलटा}}. You are not exhausted because of {{industrialised|औद्योगिक}} age and work and tensions; you are exhausted because you have lost contact with your inner stillness.","hi":"बल्कि स्थिति इसके बिलकुल उलट है। आप औद्योगिक युग, काम और तनाव की वजह से नहीं थके हैं; आप इसलिए थके हैं क्योंकि आपने अपनी भीतरी शांति से संपर्क खो दिया है।"}],[{"en":"Work is not the problem; you are the problem. Neither is age the problem.","hi":"काम समस्या नहीं है; आप ही समस्या हैं। न ही युग समस्या है।"},{"en":"Don’t go on thinking that modern man is more {{burdened|बोझ से दबा}} with work. He is less burdened.","hi":"यह मत सोचते रहिए कि आधुनिक मनुष्य पर काम का बोझ ज़्यादा है। उस पर बोझ कम है।"},{"en":"A {{primitive|आदिम}} man is more burdened. Mechanisation will help save time.","hi":"आदिम मनुष्य पर बोझ ज़्यादा था। मशीनीकरण समय बचाने में मदद करेगा।"}],[{"en":"But because you have time but no stillness, because you now have time and no use for it, that creates problems. A primitive man is less in problems, not because he is silent and still but because he has no time – no time to create troubles for himself.","hi":"लेकिन आपके पास समय है पर शांति नहीं, आपके पास समय है पर उसका उपयोग नहीं, यही समस्याएँ पैदा करता है। आदिम मनुष्य कम परेशानियों में था, इसलिए नहीं कि वह शांत और स्थिर था, बल्कि इसलिए कि उसके पास समय ही नहीं था – अपने लिए मुसीबतें पैदा करने का समय नहीं।"},{"en":"You have more time and you don’t know what to do. This time can be used for an inner journey.","hi":"आपके पास ज़्यादा समय है और आपको पता नहीं कि क्या करें। इस समय को भीतरी यात्रा के लिए इस्तेमाल किया जा सकता है।"},{"en":"And if man cannot use it for that {{inwardness|अंतर्मुखता}}, he is done for. Then there is no hope because now more and more time will be saved.","hi":"और अगर मनुष्य इसे अंतर्मुखता के लिए इस्तेमाल न कर पाए, तो वह बर्बाद है। तब कोई उम्मीद नहीं, क्योंकि अब और ज़्यादा समय बचता जाएगा।"}],[{"en":"Soon the whole world will be under automatic {{mechanisation|मशीनीकरण}}. You will have time, and you will not know what to do, and for the first time in history man will have achieved the {{utopia|आदर्श-लोक}} always {{longed|कामना की}} for.","hi":"जल्द ही पूरी दुनिया स्वचालित मशीनीकरण के अधीन होगी। आपके पास समय होगा और आपको पता नहीं होगा क्या करें, और इतिहास में पहली बार मनुष्य उस आदर्श-लोक को पा लेगा जिसकी वह हमेशा कामना करता था।"},{"en":"Then he will be {{at a loss|उलझन में}} as to what to do with it. You have even lost sleep.","hi":"तब वह उलझन में होगा कि इसका क्या करे। आप तो नींद भी खो चुके हैं।"},{"en":"That was the natural method to go in, then you are fresh in the morning, {{recharged|फिर से ऊर्जावान}}, {{revitalised|तरोताज़ा}}. But now we have even lost sleep, and we have lost sleep because of mechanical revolution.","hi":"नींद भीतर जाने की प्राकृतिक विधि थी, जिससे आप सुबह ताज़ा, फिर से ऊर्जावान और तरोताज़ा होते हैं। पर अब हमने नींद भी खो दी है, और यांत्रिक क्रांति की वजह से खोई है।"}],[{"en":"Now your bodies are not forced to work; because of less work you are less exhausted, and because of less {{exertion|मेहनत}} you cannot sleep. A villager still sleeps deeply because his body is so exhausted.","hi":"अब आपके शरीर को काम करने के लिए मजबूर नहीं किया जाता; कम काम से आप कम थकते हैं, और कम मेहनत के कारण आपको नींद नहीं आती। एक ग्रामीण अब भी गहरी नींद सोता है क्योंकि उसका शरीर बहुत थका होता है।"},{"en":"In the morning you are more exhausted than in the evening, and then the whole day begins again. You feel again exhausted.","hi":"सुबह आप शाम से ज़्यादा थके होते हैं, और फिर पूरा दिन दोबारा शुरू होता है। आप फिर थका हुआ महसूस करते हैं।"},{"en":"We are living an exhausted life. It is not that we are exhausted just in the evening; in the morning we are also exhausted.","hi":"हम थकान भरा जीवन जी रहे हैं। ऐसा नहीं कि हम केवल शाम को थके हैं; सुबह भी थके होते हैं।"}],[{"en":"What has happened? Man needs continuous contact with the inner source.","hi":"क्या हो गया है? मनुष्य को भीतरी स्रोत से निरंतर संपर्क चाहिए।"},{"en":"Don’t ask me how an exhausted man can meditate. It is like asking me how a {{diseased|रोगी}} man, an ill man, can take medicine.","hi":"मुझसे यह मत पूछिए कि थका हुआ आदमी ध्यान कैसे कर सकता है। यह ऐसे ही है जैसे पूछना कि बीमार आदमी दवा कैसे ले सकता है।"},{"en":"He needs it, and only he needs it. You are exhausted; meditation will be a medicine to you… So every day is not a fixed thing.","hi":"उसे इसकी ज़रूरत है, और केवल उसी को ज़रूरत है। आप थके हैं; ध्यान आपके लिए दवा होगा… इसलिए हर दिन कोई तय चीज़ नहीं है।"}],[{"en":"A buddha can use it in such a way that it becomes a life. It is not how much it is; {{ultimately|अंततः}} it depends how much you put into it.","hi":"एक बुद्ध इसे इस तरह इस्तेमाल कर सकता है कि वह पूरा जीवन बन जाए। मायने यह नहीं कि कितना है; अंततः यह इस पर निर्भर है कि आप उसमें कितना डालते हैं।"},{"en":"You are a creator. We create our time, we create our space, we create our {{milieu|परिवेश}}, through living.","hi":"आप सर्जक हैं। हम अपना समय बनाते हैं, अपना स्थान बनाते हैं, अपना परिवेश बनाते हैं, जीने के द्वारा।"},{"en":"So, whatever your position in life and whatever your work and whatever your {{worldly|सांसारिक}} situation, don’t make it an excuse. You can meditate all the same.","hi":"इसलिए जीवन में आपकी जो भी स्थिति हो, आपका जो भी काम हो और जो भी सांसारिक परिस्थिति हो, उसे बहाना मत बनाइए। आप फिर भी ध्यान कर सकते हैं।"}],[{"en":"And meditation doesn’t need time; it needs a deep understanding.","hi":"और ध्यान को समय नहीं चाहिए; उसे गहरी समझ चाहिए।"}]],"vocab":[["hurry","noun","जल्दबाज़ी","haste, rush","delay","great speed in doing something"],["exhausted","adjective","थका हुआ","tired, drained","energetic","very tired; having no energy left"],["stillness","noun","स्थिरता / शांति","calm, quiet","agitation","a state of being quiet and without movement"],["vice versa","adverb","उलटा / इसके विपरीत","conversely","—","the other way round"],["industrialised","adjective","औद्योगिक","developed, mechanised","agrarian","having many factories and industries"],["burdened","adjective","बोझ से दबा","loaded, weighed down","relieved","carrying a heavy load or responsibility"],["primitive","adjective","आदिम","ancient, early, crude","modern","belonging to an early stage of development"],["mechanisation","noun","मशीनीकरण","automation","manual work","the use of machines to do work"],["utopia","noun","आदर्श-लोक","paradise, ideal world","dystopia","an imagined perfect place or society"],["long","verb","कामना करना","yearn, crave","dislike","to want something very much"],["at a loss","phrase","उलझन में","puzzled, confused","certain","not knowing what to do or say"],["recharged","adjective","फिर से ऊर्जावान","refreshed, restored","drained","having regained energy"],["revitalised","adjective","तरोताज़ा","renewed, refreshed","exhausted","given new life and energy"],["exertion","noun","मेहनत / परिश्रम","effort, labour","rest","physical or mental effort"],["diseased","adjective","रोगी","sick, ill","healthy","affected by illness"],["milieu","noun","परिवेश","environment, setting","—","the surroundings in which a person lives"],["worldly","adjective","सांसारिक","earthly, material","spiritual","connected with ordinary life, not spiritual"],["inwardness","noun","अंतर्मुखता","introspection","outwardness","focus on one’s inner thoughts and feelings"],["ultimately","adverb","अंततः","finally, in the end","initially","in the end; after everything else"],["tension","noun","तनाव","stress, strain","calm","mental or emotional strain"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["at a loss","उलझन में होना","I was at a loss for words.","not knowing what to do or say"],["be done for","बर्बाद होना","If we miss this chance, we are done for.","to be in serious trouble or doomed"],["all the same","फिर भी","It was raining; we went out all the same.","in spite of that"]],"fq":[]},{"id":"ev-ed395","title":"Skills intelligence and workforce optimisation","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"The ‘skills-first’ model of talent {{acquisition|अधिग्रहण}} and management is the key to {{thrive|फलना-फूलना}} in the evolving landscape for tech-driven enterprises When times change, innovation and {{revamping|नए सिरे से बदलना}} operational procedures comes across as the best way to ensure {{resilience|मज़बूती, सहनशीलता}} and maintain performance levels in an organisation. Of late, the dynamic changes in employment and head-hunting, and the rising emphasis on employee engagement, and {{retention|रोके रखना}} has significantly changed workforce management.","hi":"प्रतिभा-अधिग्रहण और प्रबंधन का ‘स्किल्स-फ़र्स्ट’ मॉडल तकनीक-संचालित कंपनियों के लिए बदलते परिवेश में फलने-फूलने की कुंजी है। जब समय बदलता है, तो नवाचार और कामकाजी प्रक्रियाओं में बदलाव ही संगठन में मज़बूती और प्रदर्शन बनाए रखने का सबसे अच्छा तरीक़ा लगता है। हाल में रोज़गार और प्रतिभा-खोज में आए तेज़ बदलावों, तथा कर्मचारी जुड़ाव और उन्हें रोके रखने पर बढ़ते ज़ोर ने कार्यबल प्रबंधन को काफ़ी बदल दिया है।"},{"en":"Today, the key to {{optimisation|सर्वोत्तम उपयोग}} of the human resources available lies in understanding skills and skill {{adjacencies|पास के कौशल}}. Companies are paying more attention to internal relocation of resources and creating precise learning and skill development strategies to get better outcomes.","hi":"आज उपलब्ध मानव संसाधन के सर्वोत्तम उपयोग की कुंजी कौशल और उनसे जुड़े पास के कौशलों को समझना है। कंपनियाँ संसाधनों के आंतरिक स्थानांतरण और बेहतर नतीजों के लिए सटीक सीखने व कौशल-विकास रणनीतियाँ बनाने पर ज़्यादा ध्यान दे रही हैं।"},{"en":"In this scenario, it is very clear that skills-based hiring processes are far more effective compared to the {{conventional|पारंपरिक}} job titles-driven recruitment. There is a {{paradigm|बुनियादी सोच}} shift that is based on identifying an individual’s ability to perform, adapt to the demands of the role, and capacity for growth.","hi":"इस स्थिति में साफ़ है कि पारंपरिक पद-नाम आधारित भर्ती की तुलना में कौशल-आधारित भर्ती प्रक्रियाएँ कहीं ज़्यादा असरदार हैं। एक बुनियादी सोच-बदलाव हुआ है, जो व्यक्ति की काम कर दिखाने की क्षमता, भूमिका की माँगों के अनुसार ढलने और आगे बढ़ने की क्षमता पहचानने पर टिका है।"}],[{"en":"There is much greater emphasis now on soft skills such as learning {{agility|फुर्ती}} and adaptability. Technologies are changing rapidly, and change-resistance can be the biggest {{detriment|नुक़सान}} to an individual’s growth and capability of contributing to the organisation’s growth as well.","hi":"अब सीखने की फुर्ती और अनुकूलनशीलता जैसे नरम कौशलों पर कहीं ज़्यादा ज़ोर है। तकनीकें तेज़ी से बदल रही हैं, और बदलाव का विरोध किसी व्यक्ति की तरक़्क़ी और संगठन की तरक़्क़ी में उसके योगदान की क्षमता के लिए सबसे बड़ा नुक़सान हो सकता है।"},{"en":"Therefore, it is important to {{foster|बढ़ावा देना}} a workforce that is ready to take up new roles and acquire skills that prepare them for those roles. This kind of approach can be successful only when it is adequately backed by {{transparent|पारदर्शी}} internal mobility and recruitment focus.","hi":"इसलिए ऐसा कार्यबल तैयार करना ज़रूरी है जो नई भूमिकाएँ लेने और उनके लिए तैयार करने वाले कौशल हासिल करने को तैयार हो। यह तरीक़ा तभी सफल हो सकता है जब उसे पारदर्शी आंतरिक गतिशीलता और भर्ती पर ध्यान का पूरा सहारा मिले।"},{"en":"Companies that put in place tools and systems that {{empower|अधिकार देना}} employees to express their expectations, future growth {{aspirations|आकांक्षाएँ}} and share opportunities with them that can take them closer to their goals, are also the ones that will perform better in the years ahead. The shift to a Skills-First approach is directly reflective of the way the operational landscape has changed.","hi":"जो कंपनियाँ ऐसे औज़ार और व्यवस्थाएँ लगाती हैं जो कर्मचारियों को अपनी अपेक्षाएँ, भविष्य की आकांक्षाएँ बताने और उन अवसरों को साझा करने का अधिकार देती हैं जो उन्हें लक्ष्यों के क़रीब ले जाएँ, वही आने वाले सालों में बेहतर प्रदर्शन करेंगी। स्किल्स-फ़र्स्ट की ओर बदलाव कामकाजी परिदृश्य के बदलने का सीधा प्रतिबिंब है।"}],[{"en":"One can no longer acquire skills that guarantee a lifetime of employment especially in the field of technology. Skills have become {{fluid|तरल, बदलने वाला}} and it is not uncommon to see them become outdated in a time frame shorter than what it takes to obtain a graduate degree or a PG diploma nowadays.","hi":"अब कोई ऐसे कौशल हासिल नहीं कर सकता जो जीवन भर रोज़गार की गारंटी दें, ख़ासकर तकनीक के क्षेत्र में। कौशल तरल हो गए हैं और आजकल उनका स्नातक डिग्री या पीजी डिप्लोमा लेने से भी कम समय में पुराना पड़ जाना असामान्य नहीं।"},{"en":"Even though the job titles remain the same, the roles and the execution strategies are constantly changing. For instance, we still have computer programmers, but what a programmer does today is vastly different from what he did 15 years ago.","hi":"पद-नाम वही रहें तब भी भूमिकाएँ और काम के तरीक़े लगातार बदलते रहते हैं। मसलन, आज भी कंप्यूटर प्रोग्रामर हैं, पर आज प्रोग्रामर जो करता है वह 15 साल पहले के काम से बहुत अलग है।"},{"en":"There are also new roles that are emerging with the change in tech landscape, and they need to be {{catered|पूर्ति की जाए}} to. For instance, nobody worked as a ‘Full Stack Developer’ at the start of the millennium, but today it is a key role in almost every tech organisation.","hi":"तकनीकी परिदृश्य के बदलने से नई भूमिकाएँ भी उभर रही हैं, और उनकी पूर्ति करनी होगी। मसलन, सहस्राब्दी की शुरुआत में कोई ‘फ़ुल स्टैक डेवलपर’ नहीं था, पर आज लगभग हर तकनीकी संगठन में यह अहम भूमिका है।"}],[{"en":"Thus, it is important to understand that new skills are emerging and they are {{necessitating|ज़रूरी बनाना}} creation of new roles as well as redefining existing or conventional job titles. This skills-driven strategy has led to most prominent employers starting their skill assessment journey for new hires, even before the start of the formal recruitment process.","hi":"इसलिए यह समझना ज़रूरी है कि नए कौशल उभर रहे हैं और वे नई भूमिकाएँ बनाने तथा मौजूदा या पारंपरिक पद-नामों को नए सिरे से परिभाषित करने को ज़रूरी बना रहे हैं। इस कौशल-आधारित रणनीति के चलते अधिकतर प्रमुख नियोक्ता औपचारिक भर्ती प्रक्रिया शुरू होने से पहले ही नए लोगों की कौशल-जाँच शुरू कर देते हैं।"},{"en":"There are world-class, AI- powered skills intelligence tools to ensure there is no {{inherent|अंतर्निहित}} bias in the process, no error or inconsistency of judgment and a focus on the skills that candidates possess instead of the job titles they hold. Organisations are using smart skills cloud and skills-driven hiring processes to continuously gain insights into their internal talent pool’s skill assessment, and use this skills intelligence to determine learning programmes as well as the hiring strategies.","hi":"विश्वस्तरीय, AI-संचालित कौशल-बुद्धिमत्ता औज़ार मौजूद हैं जो सुनिश्चित करते हैं कि प्रक्रिया में कोई अंतर्निहित पक्षपात न हो, निर्णय में कोई त्रुटि या असंगति न हो और उम्मीदवारों के पद-नामों के बजाय उनके कौशल पर ध्यान रहे। संगठन स्मार्ट स्किल्स क्लाउड और कौशल-आधारित भर्ती प्रक्रियाओं से अपनी आंतरिक प्रतिभा-पूल के कौशल-आकलन की लगातार जानकारी पाते हैं और इसी कौशल-बुद्धिमत्ता से सीखने के कार्यक्रम और भर्ती की रणनीतियाँ तय करते हैं।"},{"en":"All this is being done automatically without manual inputs from the employees. Companies that {{proactively|आगे बढ़कर}} embrace the new approach and adopt the right AI-powered skills intelligence tool will edge out those that continue to rely on traditional and time-consuming methodologies, and achieve superior growth as well as talent retention outcomes!  Red/blue coloring of words in the sentence indicates subject verb relationship; where ‘red’ denotes ‘subject’ and ‘blue’ denotes ‘verb’","hi":"यह सब कर्मचारियों से हाथ से जानकारी लिए बिना अपने-आप हो रहा है। जो कंपनियाँ नए तरीक़े को आगे बढ़कर अपनाती हैं और सही AI-संचालित कौशल-बुद्धिमत्ता औज़ार अपनाती हैं, वे पारंपरिक और समय-खाऊ तरीक़ों पर टिकी रहने वालों को पीछे छोड़ेंगी, और बेहतर वृद्धि तथा प्रतिभा-धारण के नतीजे पाएँगी! वाक्य में शब्दों की लाल/नीली रंगाई कर्ता-क्रिया संबंध दिखाती है; ‘लाल’ कर्ता और ‘नीला’ क्रिया को दर्शाता है।"}]],"vocab":[["acquisition","noun","अधिग्रहण, प्राप्ति","gain, procurement","loss","the act of getting something"],["thrive","verb","फलना-फूलना","flourish, prosper","decline","to grow and do well"],["revamp","verb","नए सिरे से सुधारना","overhaul, renovate","neglect","to improve by changing the form or structure"],["resilience","noun","मज़बूती, उबरने की क्षमता","toughness, flexibility","fragility","the ability to recover quickly from difficulty"],["retention","noun","रोके रखना","keeping, holding","loss","the act of continuing to keep something"],["optimisation","noun","सर्वोत्तम उपयोग","maximising, improvement","waste","making the best use of something"],["adjacency","noun","निकटता, पास का होना","closeness, proximity","distance","the state of being next to something"],["conventional","adj","पारंपरिक","traditional, usual","unconventional","following long-established methods"],["paradigm","noun","आदर्श ढाँचा, सोच का नमूना","model, pattern","—","a typical model or way of thinking"],["agility","noun","फुर्ती","nimbleness, quickness","clumsiness","the ability to move or think quickly"],["detriment","noun","नुक़सान","harm, damage","benefit","harm or damage"],["foster","verb","बढ़ावा देना, पालना","nurture, promote","neglect","to encourage the growth of something"],["transparent","adj","पारदर्शी","clear, open","opaque","open and easy to understand or see through"],["empower","verb","अधिकार देना, सशक्त करना","enable, authorise","disable","to give power or authority to"],["aspiration","noun","आकांक्षा","ambition, goal","apathy","a strong hope of achieving something"],["fluid","adj","तरल, बदलने वाला","flexible, changeable","fixed","not fixed; easily changing"],["cater","verb","पूर्ति करना","serve, provide","neglect","to provide what is needed"],["necessitate","verb","ज़रूरी बना देना","require, demand","avoid","to make something necessary"],["inherent","adj","अंतर्निहित","built-in, intrinsic","external","existing as a permanent part of something"],["proactively","adv","आगे बढ़कर","in advance, anticipatorily","reactively","by taking action before a problem arises"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["of late","हाल में","Of late, hiring practices have changed.","recently"],["edge out","थोड़े अंतर से पीछे छोड़ना","Smart firms will edge out the rest.","to beat narrowly"],["rely on","पर निर्भर करना","Many firms rely on old methods.","to depend on"]],"fq":[]},{"id":"ev-ed418","title":"A Winter Tale","src":"Evergreen library · Topic: Health & Environment","c":"Health & Environment","todo":"","ed":[[{"en":"The North Wind was pleased. He {{frolicked|उछलती-कूदती रही}} among the trees in the forest and watched with {{glee|उल्लास}} as the leaves {{shrivelled|मुरझाकर}} up and dropped from the branches.","hi":"उत्तरी हवा ख़ुश थी। वह जंगल के पेड़ों के बीच उछलती-कूदती रही और उल्लास से देखती रही कि पत्ते मुरझाकर टहनियों से झड़ रहे हैं।"},{"en":"The sight of bare branches covered with snow excited him. While the North Wind was at play, he did not notice a little swallow on the ground, {{shivering|काँपती}} with cold.","hi":"बर्फ़ से ढकी नंगी टहनियों का नज़ारा उसे उत्साहित कर गया। जब उत्तरी हवा खेल रही थी, उसने ज़मीन पर एक नन्ही अबाबील को ठंड से काँपते नहीं देखा।"},{"en":"The bird's wing was broken and he could not fly, All his friends had flown south to warmer {{climes|इलाक़े, मौसमी क्षेत्र}}, leaving him alone to {{fend|अपना ख़याल रखना}} for himself until spring came. The swallow did not know what to do.","hi":"पक्षी का पंख टूटा था और वह उड़ नहीं सकता था। उसके सारे दोस्त गर्म दक्षिणी इलाक़ों की ओर उड़ गए थे और उसे वसंत आने तक अपना ख़याल ख़ुद रखने को अकेला छोड़ गए थे। अबाबील को समझ नहीं आया कि क्या करे।"}],[{"en":"Perhaps the trees will keep me warm through the winter, he thought. He hopped to the nearest tree.","hi":"शायद पेड़ मुझे सर्दी भर गर्म रखेंगे, उसने सोचा। वह फुदककर सबसे पास के पेड़ तक गई।"},{"en":"It was a silver birch, {{slender|पतला}} and tall. \"Fair birch tree, will you let me live in your branches until the spring?\" the swallow asked.","hi":"वह चाँदी जैसी सफ़ेद भोजपत्र का पेड़ था, पतला और लंबा। “सुंदर भोजपत्र, क्या तुम मुझे वसंत तक अपनी शाखाओं में रहने दोगे?” अबाबील ने पूछा।"},{"en":"The proud birch tree {{frowned|त्योरियाँ चढ़ाईं}} and said, \"I have to look after my own leaves during the winter. I don't have place for anyone else.","hi":"घमंडी भोजपत्र ने त्योरियाँ चढ़ाईं और कहा, “मुझे सर्दियों में अपने पत्तों का ध्यान रखना है। मेरे पास किसी और के लिए जगह नहीं।"}],[{"en":"{{Begone|दफ़ा हो जा}}!\" Disappointed, the swallow hopped ahead and came to an oak tree.","hi":"दफ़ा हो जा!” निराश अबाबील आगे फुदकी और एक बलूत के पेड़ के पास आई।"},{"en":"Tall and {{majestic|शानदार}}, it had the {{sturdiest|सबसे मज़बूत}} trunk and thickest branches of all the trees in the forest. The swallow chirped and said, \"O mighty oak, will you give me shelter in your strong {{boughs|बड़ी डालियाँ}} and keep me warm for the winter?","hi":"ऊँचा और शानदार, उसके तने सबसे मज़बूत और टहनियाँ सबसे घनी थीं, जंगल के सब पेड़ों में। अबाबील ने चहककर कहा, “हे ताक़तवर बलूत, क्या तुम मुझे अपनी मज़बूत डालियों में पनाह दोगे और सर्दियों में गर्म रखोगे?"},{"en":"The oak {{grunted|घुरघुराकर बोला}} and said, \"No, no, no! If I let you stay, you will eat up all my acorns.","hi":"बलूत ने घुरघुराकर कहा, “नहीं, नहीं, नहीं! अगर मैंने तुझे रहने दिया तो तू मेरे सारे बलूत-फल खा जाएगी।"}],[{"en":"Go away before I shake you off!\" The {{disheartened|हताश}} swallow {{fluttered|पंख फड़फड़ाए}} and hopped ahead and met the shady willow tree.","hi":"मुझसे झटकाए जाने से पहले चली जा!” हताश अबाबील ने पंख फड़फड़ाए और फुदककर आगे गई और छायादार वीपिंग-विलो के पेड़ से मिली।"},{"en":"Elegant one, will you let me live in your warm branches until springtime comes?\" asked the swallow. The willow tree {{swayed|लहराईं}} his fine branches and brushed the swallow aside.","hi":"“सुंदर वृक्ष, क्या तुम मुझे वसंत आने तक अपनी गर्म शाखाओं
