<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#08070a"><title>Daily Editorial</title>
<style>
:root{--bg:#08070a;--panel:#111013;--panel2:#1a181d;--border:#333038;--text:#c6c3cb;--muted:#aaa5ad;--white:#eeecf0;--line:rgba(255,255,255,.08);--soft:rgba(255,255,255,.04);--pop:#2b2f38;
--tp:100%;--tx:color-mix(in srgb,var(--text) var(--tp),var(--bg));--ok:#4ade80;--no:#f87171;--c1:#38bdf8;--c2:#a78bfa;--c3:#f472b6;--hi:#5eead4;--amber:#fbbf24;
--t1:#7dd3fc;--t2:#c4b5fd;--t3:#f9a8d4;--hwc:#34d399;--onacc:#062033;
--fs:18px;--fam:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--fw:500;--lh:1.7;--ls:0em;--mw:720px;--hs:.9;--bl:0;color-scheme:dark}
html[data-theme=dark]{--bg:#0c1322;--panel:#101a2e;--panel2:#141d31;--border:#26324d;--pop:#1d2a46}
html[data-theme=night]{--bg:#000;--panel:#050506;--panel2:#0b0b0d;--border:#1d2230;--text:#b9bcc4;--muted:#7a8296;--pop:#15171c}
html[data-theme=sepia]{--bg:#efe3c8;--panel:#f6ecd5;--panel2:#f6ecd5;--border:#d6c6a3;--text:#43382a;--muted:#7a6a52;--white:#2b2217;--line:rgba(80,55,20,.16);--soft:rgba(80,55,20,.05);--pop:#f6ecd5;--ok:#15803d;--no:#b91c1c;--hi:#0b6b5c;--amber:#8a4b00;--t1:#0369a1;--t2:#6d28d9;--t3:#be185d;--hwc:#8a4b00;--onacc:#fff;color-scheme:light}
html[data-theme=light]{--bg:#f3f4f7;--panel:#fff;--panel2:#fff;--border:#dcdfe6;--text:#181a1f;--muted:#5b606b;--white:#101216;--line:rgba(0,0,0,.09);--soft:rgba(0,0,0,.03);--pop:#fff;--ok:#15803d;--no:#b91c1c;--hi:#0f766e;--amber:#a55b00;--t1:#0369a1;--t2:#6d28d9;--t3:#be185d;--hwc:#047857;--onacc:#fff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--tx);font-family:var(--fam);letter-spacing:var(--ls);font-weight:var(--fw);
background:radial-gradient(900px 500px at 8% -8%,rgba(56,189,248,.16),transparent 60%),radial-gradient(800px 480px at 100% 0%,rgba(244,114,182,.14),transparent 55%),radial-gradient(700px 600px at 0% 100%,rgba(167,139,250,.13),transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh;
padding-top:env(safe-area-inset-top,0px)}
body.rd{overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
.bl{position:fixed;inset:0;z-index:999;pointer-events:none;background:rgb(255,140,30);opacity:var(--bl);mix-blend-mode:multiply}
.page{display:none}.page.on{display:block}
.wrap{max-width:var(--mw);margin:0 auto;padding:16px 14px calc(34px + env(safe-area-inset-bottom,0px))}
/* ---- app header / back ---- */
.calcSubHead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.calcBackBtn,.gearBtn{width:38px;height:38px;min-width:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:21px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center}
.calcBackBtn:active,.gearBtn:active{transform:scale(.9)}
.gearBtn{font-size:17px;margin-left:auto}
.calcSubTitle{font-size:19px;font-weight:700;color:var(--white);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-label{font-size:12px;letter-spacing:2px;color:var(--text);text-transform:uppercase;margin:20px 0 10px;font-weight:600;border-top:1px dashed var(--border);padding-top:16px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:13.5px;font-weight:800;color:var(--text)}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#0b0f14;border-color:transparent;box-shadow:0 4px 14px rgba(56,189,248,.28)}
/* ---- category / date cards ---- */
.edCatGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:2px 2px 20px}
@media(max-width:340px){.edCatGrid{grid-template-columns:1fr 1fr}}
.edCatCard{cursor:pointer;border-radius:16px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(160deg,rgba(56,189,248,.14),rgba(167,139,250,.08));border:1px solid var(--line);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.edCatCard:active{transform:scale(.96)}
.edCatIcon{font-size:28px;line-height:1}
.edCatName{font-size:12.5px;font-weight:700;text-align:center;line-height:1.25;color:var(--white)}
.edCatCount{font-size:10.5px;opacity:.7;font-weight:600}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:16px;padding:14px;border-radius:16px;background:linear-gradient(160deg,rgba(56,189,248,.16),rgba(244,114,182,.10));border:1.5px solid rgba(94,234,212,.35)}
.resume .ri{flex:0 0 auto;width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#22d3ee,#6366f1);color:#fff;font-size:16px}
.resume b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--hi)}
.resume span{display:block;font-size:14px;font-weight:700;color:var(--white);line-height:1.3;margin-top:2px}
/* ---- article list ---- */
.gkCatGrid{display:flex;flex-direction:column;gap:10px}
.edArticleCard{width:100%;text-align:left;cursor:pointer;border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);color:var(--text)}
.edArticleCard:active{transform:scale(.985)}
.edArticleCard.cur{border-color:#38bdf8;background:linear-gradient(135deg,rgba(56,189,248,.14),rgba(167,139,250,.08))}
.edArticleIdx{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#0b0f14;font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center}
.edArticleTx{flex:1;min-width:0}
.edArticleTitle{display:block;font-size:13.5px;font-weight:700;line-height:1.35;color:var(--white)}
.edArticleSub{display:block;font-size:10.5px;opacity:.65;font-weight:600;margin-top:3px;line-height:1.4}
.edArticleMeta{flex:0 0 auto;font-size:10.5px;opacity:.65;white-space:nowrap}

/* ---- reader ---- */
#reader{display:none;position:fixed;inset:0;z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);
background:radial-gradient(900px 500px at 8% -8%,rgba(56,189,248,.16),transparent 60%),radial-gradient(800px 480px at 100% 0%,rgba(244,114,182,.14),transparent 55%),radial-gradient(700px 600px at 0% 100%,rgba(167,139,250,.13),transparent 55%),var(--bg)}
#reader.on{display:block}
.gkReadProgressBar{position:sticky;top:0;left:0;right:0;height:3px;z-index:206;background:var(--line);opacity:0;pointer-events:none;transition:opacity .2s ease}
.gkReadProgressBar.on{opacity:1}
.gkReadProgressFill{height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6)}
.chipbar{position:sticky;top:3px;z-index:205;display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,transparent) 70%,transparent)}
.chipbar::-webkit-scrollbar{display:none}
.chipbar>*{flex:0 0 auto}
.pill{padding:8px 13px;border-radius:18px;background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(167,139,250,.18));border:1.5px solid #38bdf8;color:var(--t1);font-size:11.5px;font-weight:800;white-space:nowrap}
.pill[aria-pressed=false]{background:transparent;border-color:var(--border);color:var(--muted);text-decoration:line-through}
.chip{padding:8px 13px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:12px;font-weight:700;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,#38bdf8,#5eead4);color:#062033;border-color:transparent}
.sep{width:1px;background:var(--line);margin:4px 2px}
body.focus .chipbar{display:none}
.gkReaderContent{max-width:var(--mw);margin:0 auto;padding:12px 14px 190px;font-size:var(--fs);line-height:var(--lh);animation:gkFadeIn .35s ease}
@keyframes gkFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gkChapTitle{font-size:1.32em;font-weight:900;margin:6px 0 10px;line-height:1.35;background:linear-gradient(120deg,var(--t1),var(--t2),var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent}
.rmeta{font-size:.68em;line-height:1.55;color:var(--muted);font-weight:600;margin:0 0 4px}
.rule{height:2px;margin:12px 0 4px;border:0;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);opacity:.8;border-radius:2px}
.todo{margin:10px 0;padding:8px 12px;border:1px dashed var(--hwc);border-radius:10px;color:var(--muted);font-size:.8em}
.gkH2{font-size:1.06em;font-weight:800;color:var(--white);margin:30px 0 12px;padding:10px 14px;border-radius:12px;background:linear-gradient(90deg,rgba(56,189,248,.16),rgba(167,139,250,.10) 60%,transparent);border-left:4px solid #38bdf8;display:flex;align-items:center;gap:8px;scroll-margin-top:60px}
.gkH2::before{content:"✦";flex:0 0 auto;font-size:.85em;color:#38bdf8}
.hint{font-size:.72em;color:var(--muted);font-weight:600;margin:0 0 10px}
.gkP{margin:0 0 8px;padding:10px 13px 10px 28px;background:linear-gradient(135deg,rgba(167,139,250,.09),var(--soft));border:1px solid rgba(167,139,250,.18);border-radius:12px;position:relative;line-height:calc(var(--lh) + .1);overflow-wrap:anywhere}
.gkP::before{content:"";position:absolute;left:13px;top:19px;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#f472b6)}
body.just .gkP{text-align:justify}
.hiL{position:relative;margin:0 0 12px;padding:9px 13px 9px 28px;background:linear-gradient(135deg,rgba(56,189,248,.09),var(--soft));border:1px solid rgba(56,189,248,.18);border-radius:12px;color:var(--hi);font-size:calc(var(--hs)*1em);line-height:1.7;font-family:'Noto Sans Devanagari','Nirmala UI',var(--fam)}
.hiL::before{content:"";position:absolute;left:13px;top:17px;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#5eead4)}
.nohi .hiL{display:none}
.pgap{height:.5em}
.hw{color:var(--hwc);font-weight:800;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,var(--hwc) 60%,transparent);padding:0 1px}
.hw:active{opacity:.7}
body.nou .hw{border-bottom:none}
.hh{font-weight:500;font-family:'Noto Sans Devanagari','Nirmala UI',var(--fam);font-size:calc(var(--hs)*1em)}
.nohw .hh{display:none}
/* vocab / idiom cards */
.card{margin:0 0 10px;padding:12px 14px 12px 28px;position:relative;border-radius:12px;background:linear-gradient(135deg,rgba(56,189,248,.09),var(--soft));border:1px solid rgba(56,189,248,.18);font-size:.86em;line-height:1.6}
.card::before{content:"";position:absolute;left:13px;top:19px;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#5eead4)}
.card .w{font-size:1.12em;font-weight:800;color:var(--hwc)}
.card i{color:var(--muted);font-weight:600}
.card .h{color:var(--amber);font-weight:700;font-family:'Noto Sans Devanagari','Nirmala UI',var(--fam);margin:2px 0 4px}
.card .ln{color:var(--tx)}.card .ln span{color:var(--muted);font-weight:700}
.card .q2{margin-top:4px;color:var(--muted)}
/* questions */
.q{margin:0 0 14px;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.q .qt{margin:0 0 8px;font-size:.92em;font-weight:700;color:var(--white);line-height:1.55}
.sj{font-size:.84em;line-height:1.65;color:var(--tx);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;margin:7px 0 0;padding:10px 12px;min-height:46px;border:1.5px solid var(--border);border-radius:12px;background:var(--panel);color:var(--tx);font-size:.82em;line-height:1.5;font-weight:600}
.opt .ob{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#0b0f14;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .ot{flex:1;min-width:0;overflow-wrap:anywhere}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel))}
.opt.ok .ob{background:var(--ok)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,var(--panel))}
.opt.no .ob{background:var(--no)}
.ex{display:none;margin:10px 0 0;padding:9px 12px;border-radius:10px;border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 9%,transparent);color:var(--amber);font-size:.8em;line-height:1.65;font-weight:600;font-family:'Noto Sans Devanagari','Nirmala UI',var(--fam)}
.q.done .ex{display:block}
details{margin:0 0 10px;padding:4px 14px 10px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--white);font-size:.9em}
/* footer: single compact line */
.gkReaderFooter{position:fixed;left:0;right:0;bottom:0;z-index:210;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1.5px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.35)}
.fin2{max-width:var(--mw);margin:0 auto}
.fr{display:flex;align-items:center;gap:4px}
.gap{flex:1}
.fb{flex:0 0 auto;min-width:32px;height:34px;padding:0 6px;border-radius:50%;border:1.5px solid var(--border);background:var(--panel2);color:var(--white);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fb:active{transform:scale(.92)}
.fb.back{font-size:19px}
.fb.dec{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#062033;border:none}
.fb.inc{background:linear-gradient(135deg,#fbbf24,#f97316);color:#1a1404;border:none}
.fb.nv{background:linear-gradient(135deg,#10b981,#0ea5a4);color:#04241d;border:none;font-size:11px}
.fb.nx{background:linear-gradient(135deg,#fb7185,#f43f5e);color:#2c0410}
.fb.tool{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:none;font-size:15px}
.fb.play{background:linear-gradient(135deg,#22d3ee,#6366f1);color:#fff;border:none;font-size:12px}
.fb.play.run{background:linear-gradient(135deg,#f59e0b,#f43f5e)}
.fb.spd{border-radius:17px;font-size:11px;padding:0 8px}
.fb:disabled{opacity:.35}
.focRestore{display:none;position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:215;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:color-mix(in srgb,var(--bg) 80%,transparent);font-size:16px;opacity:.55;align-items:center;justify-content:center}
body.focus.rd .focRestore{display:flex}
body.focus .gkReaderFooter{display:none}
.gkReaderContent{padding-bottom:90px}
/* sheets / popups */
.ov{position:fixed;inset:0;z-index:260;background:rgba(6,7,10,.7);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{width:100%;max-width:640px;max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:linear-gradient(180deg,var(--panel2),var(--bg));border-radius:20px 20px 0 0;border-top:1.5px solid rgba(167,139,250,.35);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 32px rgba(0,0,0,.55)}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sheetHead span{font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--t1),var(--t2),var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent}
.xBtn{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center}
#popOv{z-index:400;align-items:center;padding:24px;background:rgba(6,7,10,.55)}
.pbox{position:relative;width:100%;max-width:380px;max-height:80vh;overflow:auto;background:var(--pop);border-radius:18px;padding:24px 22px 22px;box-shadow:0 16px 40px rgba(0,0,0,.45);border:1px solid var(--line)}
.pbox .xBtn{position:absolute;top:10px;right:10px;width:30px;height:30px;font-size:14px}
.pw{font-size:19px;font-weight:800;color:var(--white);margin:0 24px 8px 0}.pw i{font-size:.7em;color:var(--muted);font-weight:600;margin-left:4px}
.ph{font-size:16px;line-height:1.55;color:var(--amber);font-weight:700;font-family:'Noto Sans Devanagari','Nirmala UI',var(--fam);margin-bottom:8px}
.pm{font-size:14.5px;line-height:1.6;color:var(--tx);font-weight:600;border-top:1px solid var(--line);padding-top:8px}
.pm div{margin-top:3px}.pm span{color:var(--muted)}
.setgrid h3{margin:16px 0 6px;font-size:12px;color:var(--t1);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:5px 0;font-size:13.5px;font-weight:600}
.row label{flex:1 1 140px;color:var(--muted)}
.row input[type=range]{flex:2 1 150px;min-height:34px;accent-color:#38bdf8}
.row output{min-width:46px;text-align:right;color:var(--muted)}
.row button{min-height:38px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);font-size:13px;font-weight:700}
.row button[aria-pressed=true]{background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#0b0f14;border-color:transparent}
.row .sw{width:38px;height:38px;padding:0;border-radius:50%}
.row .sw[aria-pressed=true]{outline:3px solid var(--white);outline-offset:2px}
button:focus-visible,.hw:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
</style></head><body>
<div class="bl" aria-hidden="true"></div>

<!-- ===== HOME ===== -->
<div class="page on" id="pHome"><main class="wrap">
<div class="calcSubHead"><div class="calcSubTitle">📰 Daily Editorial</div><button class="gearBtn" data-act="set" aria-label="Settings">⚙</button></div>
<div id="resume"></div>
<div class="seg" id="seg"><button data-m="d">📅 Date-wise</button><button data-m="c">🗂 Categories</button></div>
<div class="grid-label" id="homeLbl">Choose a Date</div>
<div class="edCatGrid" id="homeGrid"></div>

</main></div>

<!-- ===== LIST ===== -->
<div class="page" id="pList"><main class="wrap">
<div class="calcSubHead"><button class="calcBackBtn" id="listBack" aria-label="Back">&#8249;</button><div class="calcSubTitle" id="listTitle">Articles</div><button class="gearBtn" data-act="set" aria-label="Settings">⚙</button></div>
<div class="grid-label" id="listCount">Articles</div>
<div class="gkCatGrid" id="listGrid"></div>
</main></div>

<!-- ===== READER ===== -->
<div id="reader">
<div class="gkReadProgressBar" id="prog"><div class="gkReadProgressFill" id="progFill"></div></div>
<div class="chipbar" id="chips"></div>
<div class="gkReaderContent" id="content"></div>
</div>
<div class="gkReaderFooter" id="foot" hidden><div class="fin2"><div class="fr">
<button class="fb back" id="rBack" aria-label="Back">&#8249;</button><span id="rTitle" hidden></span>
<span class="gap"></span>
<button class="fb dec" id="fdn" aria-label="Decrease text size">A&minus;</button><button class="fb inc" id="fup" aria-label="Increase text size">A+</button>
<button class="fb nv" id="prev" aria-label="Previous">&#9664;</button><button class="fb tool" id="lst" title="Article list">&#9776;</button><button class="fb nv nx" id="next" aria-label="Next">&#9654;</button>
<button class="fb play" id="play" aria-label="Play auto scroll">&#9654;</button><button class="fb spd" id="spd" aria-label="Auto-scroll speed">1x</button>
<button class="fb" data-act="set" aria-label="Settings">⚙</button><button class="fb foc" id="focBtn" aria-label="Focus mode">👁</button>
</div></div></div>

<script>/* नई तारीख़ जोड़ने के लिए: DAYS के सबसे ऊपर नया {date:"…",articles:[…]} जोड़ो (नई तारीख़ सबसे ऊपर) */
const DAYS=[{"date":"1 Nov 2026","articles":[{"id":"hepb","title":"Gene therapy aims for a cure by silencing hepatitis B DNA","src":"The Hindu, Delhi edition, 1 Nov 2026, p. 13 (Science) · Arun Panchapakesan · Topic: Health / Medicine","todo":"","ed":[[{"en":"An {{experimental|प्रयोगात्मक}} therapy called CRMA-1001 is a {{remarkable|उल्लेखनीय}} development because, instead of targeting the virus directly, it silences the viral DNA; this is promising because treatments rarely {{eliminate|समाप्त करना}} the DNA, which allows the virus to {{rebound|दोबारा उभरना}}.","hi":"CRMA-1001 नाम की एक प्रयोगात्मक थेरेपी उल्लेखनीय प्रगति है, क्योंकि यह वायरस पर सीधा हमला करने के बजाय उसके DNA को शांत कर देती है; यह आशाजनक इसलिए है कि इलाज आमतौर पर DNA को ख़त्म नहीं कर पाते, और इसी वजह से वायरस दोबारा उभर आता है।"},{"en":"According to new work reported in Nature Biomedical Engineering, scientists have used {{epigenetic|जीन-नियंत्रण से जुड़ा}} control to treat a hepatitis B infection. The development is remarkable because, instead of targeting the virus directly, the work silenced the viral DNA.","hi":"नेचर बायोमेडिकल इंजीनियरिंग में छपे नए काम के अनुसार वैज्ञानिकों ने हेपेटाइटिस B संक्रमण के इलाज के लिए जीन-नियंत्रण (एपिजेनेटिक) तरीक़े का इस्तेमाल किया है। यह उपलब्धि इसलिए ख़ास है कि वायरस को सीधे निशाना बनाने के बजाय इस काम ने वायरस के DNA को शांत किया।"},{"en":"This is promising because current treatments rarely eliminate the DNA, which allows the virus to rebound. By silencing this {{residue|अवशेष}}, the treatment could offer a path to a {{lasting|स्थायी}} {{functional|कार्यात्मक}} cure for hepatitis B.","hi":"यह आशाजनक इसलिए है कि मौजूदा इलाज DNA को शायद ही कभी ख़त्म करते हैं, जिससे वायरस लौट आता है। इस बचे हुए अवशेष को शांत करके यह इलाज हेपेटाइटिस B के स्थायी कार्यात्मक उपचार की राह दिखा सकता है।"}],[{"en":"The hepatitis B virus mainly infects liver cells. After entering a cell, the virus’s DNA serves as the {{template|साँचा}} to make new viral particles.","hi":"हेपेटाइटिस B वायरस मुख्य रूप से लिवर की कोशिकाओं को संक्रमित करता है। कोशिका में घुसने के बाद वायरस का DNA नए वायरस-कण बनाने के साँचे का काम करता है।"},{"en":"In many people, the immune system clears the infection, but if it does not, the viral DNA can {{persist|बना रहना}} for years or even decades in the {{host|मेज़बान}}’s liver.","hi":"कई लोगों में रोग-प्रतिरोधक तंत्र संक्रमण को साफ़ कर देता है, लेकिन अगर ऐसा न हो तो वायरस का DNA मेज़बान के लिवर में सालों या दशकों तक बना रह सकता है।"},{"en":"In this time, the virus can remain silent, meaning the viral DNA is still present in the cell but its genes are not active to produce new viruses. This allows the virus to ‘hide’ from the immune system.","hi":"इस दौरान वायरस शांत रह सकता है, यानी उसका DNA कोशिका में मौजूद रहता है लेकिन उसके जीन नए वायरस बनाने के लिए सक्रिय नहीं होते। इससे वायरस प्रतिरोधक तंत्र से ‘छिपा’ रहता है।"},{"en":"Then, at a later point, the virus can activate again and produce new virus particles. Studies have shown that one of the {{mechanisms|तंत्र}} by which the virus stays silent is by methylating cytosines.","hi":"फिर बाद में वायरस दोबारा सक्रिय होकर नए वायरस-कण बना सकता है। अध्ययनों से पता चला है कि वायरस के शांत रहने का एक तंत्र साइटोसीन्स पर मिथाइल टैग लगाना (मिथाइलेशन) है।"}],[{"en":"DNA is segmented into genes, and each gene contains the information necessary to make a particular protein. These proteins {{essay|(PDF में जैसा छपा; शायद ‘play’)}} their roles in the cells.","hi":"DNA जीनों में बँटा होता है और हर जीन में किसी ख़ास प्रोटीन को बनाने की जानकारी होती है। ये प्रोटीन कोशिकाओं में अपनी भूमिका निभाते हैं।"},{"en":"Since every cell in the body has two copies — one from each parent — of all human DNA, all cells technically have the {{blueprint|खाका}} to make a whole organism. However, cells also have {{specialised|विशिष्ट}} functions: a brain cell does not need the genes for the proteins used to digest food.","hi":"चूँकि शरीर की हर कोशिका में पूरे मानव DNA की दो प्रतियाँ होती हैं, एक-एक माता और पिता से, इसलिए तकनीकी रूप से हर कोशिका के पास पूरा जीव बनाने का खाका होता है। फिर भी कोशिकाओं के काम अलग-अलग होते हैं: दिमाग़ की कोशिका को खाना पचाने वाले प्रोटीनों के जीन नहीं चाहिए।"},{"en":"One of DNA’s four building blocks is cytosine. Cells can attach a chemical tag, like the methyl group (–CH3), to cytosine to silence the corresponding gene.","hi":"DNA के चार निर्माण-खंडों में से एक साइटोसीन है। कोशिकाएँ साइटोसीन पर मिथाइल समूह (–CH3) जैसा रासायनिक टैग लगाकर उसके संबंधित जीन को शांत कर सकती हैं।"},{"en":"This prevents the cell’s protein factory from reading the gene and the cell from making that protein. Problems in this epigenetic system can lead to diseases like cancers.","hi":"इससे कोशिका की प्रोटीन-फ़ैक्टरी उस जीन को पढ़ नहीं पाती और कोशिका वह प्रोटीन नहीं बना पाती। इस एपिजेनेटिक तंत्र में गड़बड़ी से कैंसर जैसे रोग हो सकते हैं।"}],[{"en":"The new study has reported a new experimental therapy called CRMA-1001 that can {{reportedly|बताया गया है कि}} silence the DNA of the hepatitis B virus by selectively methylating the virus’s genome. The study’s authors combined two molecular components to achieve this, called a ‘locator’ and an ‘effector’.","hi":"नए अध्ययन में CRMA-1001 नाम की प्रयोगात्मक थेरेपी बताई गई है, जो हेपेटाइटिस B वायरस के जीनोम पर चुनकर मिथाइल टैग लगाकर उसका DNA शांत कर सकती है। लेखकों ने इसके लिए दो अणु-घटक जोड़े, जिन्हें ‘लोकेटर’ और ‘इफ़ेक्टर’ कहा गया।"},{"en":"The locator used the CRISPR-Cas9 gene-editing tool to find and bind to a specific DNA sequence: in this case, a sequence within the viral DNA. This allowed the CRISPR system to take the ‘effector’, the methylation machinery, to the correct location.","hi":"लोकेटर ने CRISPR-Cas9 जीन-संपादन औज़ार से एक ख़ास DNA क्रम ढूँढकर उससे जुड़ने का काम किया, यहाँ वायरस के DNA के भीतर का एक क्रम। इससे CRISPR प्रणाली मिथाइलेशन की मशीनरी यानी ‘इफ़ेक्टर’ को सही जगह तक ले जा सकी।"},{"en":"The effector had proteins that could add methyl groups to nearby cytosines in the viral DNA and proteins that help switch off genes. Finally, the researchers packed the entire system and delivered it on an mRNA platform.","hi":"इफ़ेक्टर में ऐसे प्रोटीन थे जो वायरस के DNA में पास के साइटोसीन्स पर मिथाइल समूह जोड़ सकते थे, और ऐसे प्रोटीन भी जो जीन बंद करने में मदद करते हैं। अंत में शोधकर्ताओं ने पूरी प्रणाली को पैक करके mRNA प्लेटफ़ॉर्म पर पहुँचाया।"},{"en":"Once a cell had read the instructions to make the required proteins, it {{degraded|नष्ट करना}} them, stopping the production of those proteins too.","hi":"जब कोशिका ज़रूरी प्रोटीन बनाने के निर्देश पढ़ चुकती है, तो वह उन्हें नष्ट कर देती है और इन प्रोटीनों का बनना भी रुक जाता है।"}],[{"en":"The researchers gave mice infected with hepatitis B virus either a single dose of CRMA-1001 or three doses, one month apart, and regularly tested them for six months for the signs of infection.","hi":"शोधकर्ताओं ने हेपेटाइटिस B से संक्रमित चूहों को CRMA-1001 की या तो एक ख़ुराक दी या एक-एक महीने के अंतर पर तीन ख़ुराकें, और छह महीने तक नियमित रूप से संक्रमण के लक्षणों की जाँच की।"},{"en":"They reported that after one dose, the levels of several hepatitis B virus markers, including the viral DNA and two viral proteins called HBsAg and HBeAg, dropped {{significantly|काफ़ी हद तक}}. When they tested the viral DNA, they found new methyl groups, suggesting the treatment was working as intended.","hi":"उन्होंने बताया कि एक ख़ुराक के बाद वायरस के कई मार्करों का स्तर, जिनमें वायरस का DNA और HBsAg व HBeAg नाम के दो वायरल प्रोटीन शामिल हैं, काफ़ी गिर गया। वायरस के DNA की जाँच में नए मिथाइल समूह मिले, जिससे संकेत मिला कि इलाज इरादे के मुताबिक़ काम कर रहा था।"},{"en":"The effect was even stronger after three doses: six months after the first dose, as many as 90% of the animals had less viral DNA than could be detected.","hi":"तीन ख़ुराकों के बाद असर और भी मज़बूत था: पहली ख़ुराक के छह महीने बाद 90% तक जानवरों में वायरल DNA इतना कम था कि उसे पकड़ा नहीं जा सका।"}],[{"en":"CRMA-1001 is not a cure in the traditional sense of the word. The hepatitis B virus DNA is still present in the liver cells. Instead, the study demonstrated a functional cure: when the virus is not necessarily eliminated but is kept so thoroughly {{suppressed|दबाया हुआ}} that, for all intents and purposes, the patient has no active signs of disease.","hi":"CRMA-1001 शब्द के पारंपरिक अर्थ में इलाज नहीं है। हेपेटाइटिस B वायरस का DNA अब भी लिवर की कोशिकाओं में मौजूद है। इसके बजाय अध्ययन ने ‘कार्यात्मक इलाज’ दिखाया: जब वायरस ज़रूरी नहीं कि ख़त्म हो, पर इतनी अच्छी तरह दबा रहे कि व्यावहारिक रूप से मरीज़ में रोग के सक्रिय लक्षण न हों।"},{"en":"In this study, the team followed up with the mice for six months after treatment, and the researchers found {{sustained|लगातार बना रहने वाला}} suppression of the virus in that period. However, the study did not establish whether the virus could eventually become active again after those six months, since the viral DNA was still present.","hi":"इस अध्ययन में टीम ने इलाज के बाद छह महीने तक चूहों पर नज़र रखी और उस दौरान वायरस का लगातार दबा रहना पाया। लेकिन अध्ययन यह तय नहीं कर पाया कि उन छह महीनों के बाद वायरस कभी दोबारा सक्रिय हो सकता है या नहीं, क्योंकि वायरल DNA अब भी मौजूद था।"}],[{"en":"Further studies are needed to examine the long-term effects of CRMA-1001, including whether the silencing effect can persist over many years and whether the virus can ever become active again after treatment.","hi":"CRMA-1001 के लंबे समय के असर की जाँच के लिए आगे और अध्ययन चाहिए, जिनमें यह भी शामिल है कि शांत करने का असर कई सालों तक टिक सकता है या नहीं, और इलाज के बाद वायरस कभी फिर सक्रिय हो सकता है या नहीं।"},{"en":"An ongoing phase I/II clinical trial includes these among other questions. Nonetheless, CRMA-1001 represents a {{novel|नया}} way to tackle a viral infection: instead of fighting the threat, the cell simply ignores it.","hi":"चल रहे चरण I/II के क्लिनिकल ट्रायल में ये सवाल दूसरे सवालों के साथ शामिल हैं। फिर भी CRMA-1001 वायरल संक्रमण से निपटने का नया तरीक़ा है: ख़तरे से लड़ने के बजाय कोशिका उसे बस अनदेखा कर देती है।"}]],"vocab":[["experimental","adj","प्रयोगात्मक","trial, pilot","proven","based on new methods still being tested"],["remarkable","adj","उल्लेखनीय","striking, notable","ordinary","worthy of notice; extraordinary"],["eliminate","verb","समाप्त करना","remove, eradicate","retain","to remove or get rid of completely"],["rebound","verb","दोबारा उभरना","recover, bounce back","decline","to bounce back or recover after a fall"],["epigenetic","adj","जीन-नियंत्रण से जुड़ा (जीन की गतिविधि बदलने वाला)","—","—","relating to changes in gene activity without change in DNA"],["residue","noun","अवशेष","remainder, remnant","whole","what remains after a part is removed"],["lasting","adj","स्थायी","enduring, permanent","temporary","continuing for a long time"],["functional","adj","कार्यात्मक","operational, working","useless","working properly; able to do its job"],["template","noun","साँचा","pattern, model","—","a pattern or model used to make copies"],["persist","verb","बना रहना","continue, linger","cease","to continue firmly despite difficulty"],["host","noun","मेज़बान (जीव)","—","guest","a living body that carries another organism"],["mechanism","noun","तंत्र, प्रक्रिया","process, method","—","a system of parts working together; the way something works"],["blueprint","noun","खाका, योजना","plan, design","—","a detailed plan or design"],["specialised","adj","विशिष्ट (ख़ास काम वाला)","specific, expert","general","trained or designed for a particular purpose"],["reportedly","adv","बताया गया है कि","allegedly, supposedly","—","according to reports, not confirmed"],["degrade","verb","नष्ट/क्षीण करना","break down, decompose","build, preserve","to break down or reduce in quality"],["significantly","adv","काफ़ी हद तक","considerably, markedly","slightly","to a large or important extent"],["suppressed","adj","दबाया हुआ","restrained, curbed","released","held back or kept under control"],["sustained","adj","लगातार बना रहने वाला","continuous, prolonged","brief","continued for a long period without weakening"],["novel","adj","नया, अनोखा","new, original","familiar","new and unusual"],["essay","verb/noun","(यहाँ PDF में जैसा छपा; शायद ‘play’ है)। सामान्य अर्थ: कोशिश करना / निबंध","attempt, try","—","to attempt or try"],["segmented","adj","खंडों में बँटा","divided, partitioned","united","divided into parts"],["corresponding","adj","संबंधित, अनुरूप","matching, related","unrelated","matching or similar to something else"],["thoroughly","adv","पूरी तरह","completely, fully","partially","completely and carefully"],["selectively","adv","चुनकर, चयनित ढंग से","carefully, discriminately","randomly","choosing only some, not all"]],"rc":[{"q":"What is the main idea of the passage?","o":["An experimental therapy silences hepatitis B DNA and offers a promising route to a functional cure, though long-term effects are unknown","Hepatitis B can now be completely eliminated from the human body","CRISPR-Cas9 is more useful for cancer than for viral infections","Mice are the best model for all human viral diseases"],"a":0,"e":"लेख CRMA-1001 को वायरस के DNA को शांत करने वाली आशाजनक थेरेपी बताता है, पर लंबे समय का असर अभी अज्ञात है।"},{"q":"How was the therapy system delivered, according to the passage?","o":["Through a daily oral tablet","Through a surgical implant in the liver","Through an mRNA platform","Through a blood transfusion"],"a":2,"e":"पैराग्राफ़ के अनुसार पूरी प्रणाली को mRNA प्लेटफ़ॉर्म पर पहुँचाया गया।"},{"q":"Why does the passage say CRMA-1001 is not a cure ‘in the traditional sense’?","o":["It failed to work in any of the mice","The viral DNA is still present in the liver cells","It removed the immune system","It was tested only for one week"],"a":1,"e":"वायरस का DNA अब भी लिवर की कोशिकाओं में है, इसलिए यह कार्यात्मक इलाज है, पूरा सफ़ाया नहीं।"},{"q":"What is the tone of the author towards CRMA-1001?","o":["Alarmist","Dismissive","Cautiously optimistic","Indifferent"],"a":2,"e":"लेखक इसे नया और आशाजनक मानता है, पर साथ में आगे के अध्ययनों की ज़रूरत भी बताता है।"},{"q":"The word ‘rebound’ in the passage is closest in meaning to:","o":["Isolate","Vanish","Weaken","Recur"],"a":3,"e":"‘Rebound’ का अर्थ दोबारा उभरना है, यानी recur।"}],"pj":[{"q":["P. The hepatitis B virus mainly infects liver cells.","Q. After entering a cell, the virus’s DNA serves as the template to make new viral particles.","R. In many people, the immune system clears the infection, but if it does not, the viral DNA can persist for years.","S. In this time, the virus can remain silent."],"o":["PQRS","QPRS","PRQS","SPQR"],"a":0,"e":"पहले वायरस कहाँ संक्रमित करता है (P), फिर DNA का काम (Q), फिर प्रतिरोधक तंत्र (R), और ‘In this time’ वाली S अंत में आती है।"},{"q":["P. One of DNA’s four building blocks is cytosine.","Q. Cells can attach a chemical tag to cytosine to silence the corresponding gene.","R. This prevents the cell’s protein factory from reading the gene.","S. Problems in this epigenetic system can lead to diseases like cancers."],"o":["QPRS","PQSR","PRQS","PQRS"],"a":3,"e":"cytosine का परिचय (P), टैग लगाना (Q), उसका असर (R), फिर गड़बड़ी का नतीजा (S)।"},{"q":["P. The locator used the CRISPR-Cas9 tool to bind to a specific DNA sequence.","Q. This allowed the CRISPR system to take the effector to the correct location.","R. The effector had proteins that could add methyl groups to nearby cytosines.","S. Finally, the researchers packed the entire system and delivered it on an mRNA platform."],"o":["PRQS","PQRS","QPRS","SPQR"],"a":1,"e":"लोकेटर (P), ‘This allowed’ (Q), इफ़ेक्टर (R), और ‘Finally’ वाली S अंत में।"},{"q":["P. The researchers gave infected mice either a single dose or three doses.","Q. After one dose, the levels of several virus markers dropped significantly.","R. The effect was even stronger after three doses.","S. As many as 90% of the animals had less viral DNA than could be detected."],"o":["QPRS","PRQS","PQRS","SRPQ"],"a":2,"e":"ख़ुराक देना (P), एक ख़ुराक का असर (Q), तीन ख़ुराकों में ज़्यादा असर (R), उसका आँकड़ा (S)।"}],"es":[{"q":"The number of patients are (A) / rising every year (B) in many countries. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Subject–verb agreement। ‘The number of’ एकवचन है, इसलिए ‘is rising’ (‘A number of’ बहुवचन लेता है)।"},{"q":"Doctors tested (A) / an gene therapy (B) on a small group. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Articles (a/an)। Gene का उच्चारण व्यंजन ध्वनि से शुरू होता है, इसलिए ‘a gene therapy’।"},{"q":"Doctors are hopeful (A) / that the therapy (B) will cure from the infection. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Unnecessary preposition। Cure सकर्मक क्रिया है, इसके बाद ‘from’ नहीं आता: ‘cure the infection’।"},{"q":"The virus has remained (A) / in the body (B) since ten years. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Since / for। अवधि के लिए ‘for ten years’ आता है; ‘since’ के साथ बिंदु-समय (since 2016) आता है।"},{"q":"Each of the volunteers (A) / were given (B) a single dose. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Each + singular verb। ‘Each of’ के बाद क्रिया एकवचन: ‘was given’।"},{"q":"More better (A) results are (B) expected next year. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Double comparative। Better ख़ुद comparative है, उससे पहले ‘more’ नहीं लगता: ‘Better results’।"},{"q":"Researchers got many informations (A) / from the trial (B) about side effects. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Uncountable nouns। Information अगणनीय है, इसका बहुवचन नहीं होता: ‘much information’।"},{"q":"If the therapy (A) / will succeed, (B) millions may benefit. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Conditional (if-clause)। If-clause में future (will) नहीं आता, present आता है: ‘succeeds’।"},{"q":"Neither the doctors (A) / nor the patient (B) was aware of the risk. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Neither … nor। Neither…nor में क्रिया पास वाले subject (patient) से मिलती है, इसलिए ‘was’ सही है। वाक्य सही है।"},{"q":"The aim is to reduce (A) / the viral load and (B) preventing liver damage. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Parallel structure। बराबर के हिस्से एक ही रूप में हों: ‘to reduce … and (to) prevent’।"}],"qz":[{"q":"Synonym of REMARKABLE:","o":["Minor","Ordinary","Hidden","Striking"],"a":3,"e":"Remarkable = Striking, यानी उल्लेखनीय।"},{"q":"Antonym of LASTING:","o":["Temporary","Enduring","Permanent","Steady"],"a":0,"e":"Lasting (स्थायी) का उलटा Temporary।"},{"q":"Synonym of PERSIST:","o":["Cease","Retreat","Continue","Vanish"],"a":2,"e":"Persist = Continue, यानी बना रहना।"},{"q":"Antonym of ELIMINATE:","o":["Remove","Retain","Erase","Destroy"],"a":1,"e":"Eliminate (समाप्त करना) का उलटा Retain।"},{"q":"Choose the correctly spelt word:","o":["Resedue","Residu","Reseidue","Residue"],"a":3,"e":"सही spelling Residue है।"},{"q":"One word: a pattern or model used to make copies","o":["Residue","Template","Host","Mechanism"],"a":1,"e":"Template यानी साँचा।"},{"q":"One word: a living organism that carries a parasite or virus","o":["Host","Guest","Carrier cell","Donor"],"a":0,"e":"Host यानी मेज़बान।"},{"q":"Fill in the blank: Doctors hope the new drug will ___ the disease completely.","o":["persist","rebound","degrade","eliminate"],"a":3,"e":"‘बीमारी को पूरी तरह ख़त्म करना’ के लिए eliminate सही है।"},{"q":"Fill in the blank: After a sharp fall, the company’s profits ___ last year.","o":["eliminated","rebounded","segmented","persisted"],"a":1,"e":"गिरावट के बाद मुनाफ़े का दोबारा उभरना rebound है।"},{"q":"Idiom: ‘turn a blind eye’ means:","o":["To see clearly","To feel sleepy","To deliberately ignore","To look away in fear"],"a":2,"e":"Turn a blind eye = जानबूझकर अनदेखा करना।"},{"q":"Idiom: ‘back to square one’ means:","o":["Take a risk","Win the game","Finish early","Return to the starting point"],"a":3,"e":"Back to square one = फिर शुरुआत पर लौट आना।"},{"q":"Phrasal verb: ‘switch off’ means:","o":["Begin","Repair","Stop working / turn off","Increase"],"a":2,"e":"Switch off = बंद करना।"},{"q":"Synonym of NOVEL:","o":["New","Outdated","Familiar","Common"],"a":0,"e":"Novel = New, यानी नया।"},{"q":"According to the passage, after how many doses did as many as 90% of the animals show undetectable viral DNA?","o":["One","Three","Two","Six"],"a":1,"e":"पैराग्राफ़ के अनुसार तीन ख़ुराकों के बाद 90% तक जानवरों में वायरल DNA पकड़ में नहीं आया।"},{"q":"According to the passage, which tool did the ‘locator’ use?","o":["CRISPR-Cas9","mRNA vaccine","X-ray imaging","Antibiotics"],"a":0,"e":"लोकेटर ने CRISPR-Cas9 जीन-संपादन औज़ार का इस्तेमाल किया।"}],"idioms":[["turn a blind eye","जानबूझकर अनदेखा करना","The authorities turned a blind eye to the violations.","to deliberately ignore something wrong"],["back to square one","फिर शुरुआत पर लौट आना","When the test failed, the team was back to square one.","back at the very beginning"],["switch off (phrasal verb)","बंद करना; (जीन के संदर्भ में) निष्क्रिय करना","Methyl tags can switch off a gene.","to stop paying attention or to turn off a device"]],"fq":[]},{"id":"nvs03","title":"Why is the NVS-03 satellite launch significant?","src":"The Hindu, Delhi edition, 1 Nov 2026, p. 14 (FAQ) · Jacob Koshy · Topic: Space / Science","todo":"","ed":[[{"en":"The Indian Space Research Organisation (ISRO) successfully launched the NVS-03 satellite from the Satish Dhawan Space Centre in Sriharikota on board the Geosynchronous Satellite Launch Vehicle (GSLV) on October 30. The launch will {{restore|बहाल करना}} base-level {{functionality|कार्यक्षमता}} to India’s {{indigenous|स्वदेशी}} ‘GPS’ system, called NavIC.","hi":"इसरो ने 30 अक्टूबर को श्रीहरिकोटा के सतीश धवन अंतरिक्ष केंद्र से GSLV रॉकेट पर NVS-03 उपग्रह सफलतापूर्वक छोड़ा। इस प्रक्षेपण से भारत की स्वदेशी ‘GPS’ प्रणाली NavIC की बुनियादी कार्यक्षमता बहाल होगी।"},{"en":"India launched the first-generation Indian Regional Navigation Satellite System (IRNSS) satellites between 2013 and 2018. They were designed to provide positioning, navigation and timing (PNT) services over India, to an area extending approximately 1,500 km beyond its boundaries.","hi":"भारत ने 2013 से 2018 के बीच पहली पीढ़ी के IRNSS उपग्रह छोड़े। इन्हें भारत और उसकी सीमाओं से लगभग 1,500 किमी आगे तक स्थिति, नौवहन और समय (PNT) सेवाएँ देने के लिए बनाया गया था।"},{"en":"IRNSS was subsequently renamed NavIC, for ‘Navigation with Indian Constellation’. Unlike the U.S. GPS, which has global coverage, NavIC was {{conceived|परिकल्पित किया गया}} as a regional system.","hi":"IRNSS का नाम बाद में NavIC रखा गया, यानी ‘Navigation with Indian Constellation’। अमेरिकी GPS के उलट, जिसका कवरेज पूरी दुनिया में है, NavIC को क्षेत्रीय प्रणाली के रूप में सोचा गया था।"}],[{"en":"Satellite navigation systems generally provide two categories of signals: an open signal for {{civilian|नागरिक}} applications like navigation, transportation, disaster management, and telecommunications, and a {{restricted|प्रतिबंधित}} signal for authorised users, including the armed forces.","hi":"उपग्रह नौवहन प्रणालियाँ आमतौर पर दो तरह के संकेत देती हैं: नौवहन, परिवहन, आपदा प्रबंधन और दूरसंचार जैसे नागरिक उपयोगों के लिए खुला संकेत, और सशस्त्र बलों सहित अधिकृत उपयोगकर्ताओं के लिए प्रतिबंधित संकेत।"},{"en":"The latter offers greater accuracy. For the armed forces, NavIC would offer a degree of operational independence. However even with NVS-03, it will be a while before these {{loftier|ऊँचे}} goals are realised.","hi":"बाद वाला संकेत ज़्यादा सटीक होता है। सशस्त्र बलों के लिए NavIC कुछ हद तक परिचालन-स्वतंत्रता देगा। लेकिन NVS-03 के बावजूद इन ऊँचे लक्ष्यों को पाने में अभी समय लगेगा।"}],[{"en":"Of the satellites launched under the original IRNSS programme, several have either been {{decommissioned|सेवा से हटाए गए}}, failed to reach their intended orbits, or have suffered failures of their onboard clocks. In July 2025, ISRO disclosed that five satellites were completely {{defunct|निष्क्रिय}}, with all three clocks aboard each no longer functioning.","hi":"मूल IRNSS कार्यक्रम के तहत छोड़े गए उपग्रहों में से कई या तो सेवा से हटा दिए गए, अपनी तय कक्षा तक नहीं पहुँचे, या उनकी ऑनबोर्ड घड़ियाँ ख़राब हो गईं। जुलाई 2025 में इसरो ने बताया कि पाँच उपग्रह पूरी तरह निष्क्रिय थे, क्योंकि हर एक की तीनों घड़ियाँ काम नहीं कर रही थीं।"},{"en":"The situation {{deteriorated|बिगड़ गई}} further in March, when the last functioning atomic clock aboard IRNSS-1F stopped working. The satellite, launched in 2016, had completed its designed mission life of 10 years three days prior.","hi":"मार्च में स्थिति और बिगड़ गई, जब IRNSS-1F की आख़िरी चालू परमाणु घड़ी ने काम करना बंद कर दिया। 2016 में छोड़ा गया यह उपग्रह तीन दिन पहले ही अपना 10 साल का डिज़ाइन किया गया मिशन-जीवन पूरा कर चुका था।"},{"en":"This left only three satellites able to provide PNT services. At least four are required for NavIC to function as intended.","hi":"इससे केवल तीन उपग्रह PNT सेवाएँ देने लायक बचे। NavIC के ठीक से काम करने के लिए कम से कम चार ज़रूरी हैं।"},{"en":"There was also a {{setback|झटका}} in January 2025, when ISRO successfully placed the NVS-02 satellite in a geosynchronous transfer orbit, but the satellite’s thrusters failed to move it into its intended final orbit.","hi":"जनवरी 2025 में भी एक झटका लगा, जब इसरो ने NVS-02 उपग्रह को जियोसिंक्रोनस ट्रांसफ़र कक्षा में सफलतापूर्वक रखा, लेकिन उपग्रह के थ्रस्टर उसे तय अंतिम कक्षा में नहीं पहुँचा सके।"}],[{"en":"NVS-03 is part of the second generation of satellites ISRO is developing to {{modernise|आधुनिक बनाना}} NavIC. Each NVS satellite carries at least one indigenous rubidium atomic clock.","hi":"NVS-03 उस दूसरी पीढ़ी के उपग्रहों का हिस्सा है जिन्हें इसरो NavIC को आधुनिक बनाने के लिए तैयार कर रहा है। हर NVS उपग्रह में कम से कम एक स्वदेशी रुबिडियम परमाणु घड़ी होती है।"},{"en":"Developed by the ISRO Space Applications Centre, these clocks are intended to replace the imported clocks made by Swiss company SpectraTime, used in the first generation IRNSS satellites.","hi":"इसरो के स्पेस एप्लीकेशंस सेंटर द्वारा विकसित ये घड़ियाँ स्विस कंपनी स्पेक्ट्राटाइम की बनाई आयातित घड़ियों की जगह लेने के लिए हैं, जो पहली पीढ़ी के IRNSS उपग्रहों में लगी थीं।"},{"en":"The {{payload|उपग्रह पर भेजा गया उपकरण}} in Friday’s launch consisted of imported and indigenous clocks, but ISRO has not shared more details.","hi":"शुक्रवार के प्रक्षेपण के पेलोड में आयातित और स्वदेशी दोनों घड़ियाँ थीं, लेकिन इसरो ने इससे ज़्यादा जानकारी साझा नहीं की है।"},{"en":"Atomic clocks provide {{precise|सटीक}} timing signals that allow receivers on the ground to calculate their position by measuring the time taken by signals to travel from satellites. Even a small timing error can translate into a significant positioning error.","hi":"परमाणु घड़ियाँ सटीक समय-संकेत देती हैं, जिनसे ज़मीन के रिसीवर उपग्रहों से संकेत आने में लगे समय को नापकर अपनी स्थिति निकालते हैं। समय की छोटी-सी चूक भी स्थिति की बड़ी चूक बन सकती है।"}],[{"en":"NVS-01, launched in May 2023, was successfully placed in orbit and carries an indigenous rubidium atomic clock. NVS-02 was the second satellite in this series, but this mission’s failure delayed subsequent launches.","hi":"मई 2023 में छोड़ा गया NVS-01 सफलतापूर्वक कक्षा में पहुँचा और उसमें स्वदेशी रुबिडियम परमाणु घड़ी है। NVS-02 इस श्रृंखला का दूसरा उपग्रह था, लेकिन उस मिशन की विफलता से आगे के प्रक्षेपण टल गए।"},{"en":"NVS-03, followed by NVS-04 and NVS-05 — {{purportedly|कथित रूप से}} to be launched by December — are expected to help restore NavIC.","hi":"NVS-03, उसके बाद NVS-04 और NVS-05, जिन्हें कथित रूप से दिसंबर तक छोड़ा जाना है, से NavIC को बहाल करने में मदद की उम्मीद है।"},{"en":"ISRO’s move towards indigenous clocks is also a corrective measure. It has also proposed increasing the number of clocks onboard each satellite to five, providing additional {{redundancy|अतिरिक्त बैकअप}}.","hi":"इसरो का स्वदेशी घड़ियों की ओर जाना भी एक सुधारात्मक कदम है। उसने हर उपग्रह पर घड़ियों की संख्या बढ़ाकर पाँच करने का भी प्रस्ताव दिया है, जिससे अतिरिक्त बैकअप मिलेगा।"},{"en":"However, the indigenous clocks face {{procurement|ख़रीद/आपूर्ति}} challenges. A March editorial in The Hindu argued that the transition to domestic manufacturing has not ensured a {{dependable|भरोसेमंद}} supply of flight-ready equipment.","hi":"हालाँकि स्वदेशी घड़ियों को ख़रीद-आपूर्ति की चुनौतियाँ हैं। द हिंदू के मार्च के एक संपादकीय ने कहा था कि घरेलू निर्माण की ओर जाने से उड़ान-योग्य उपकरणों की भरोसेमंद आपूर्ति सुनिश्चित नहीं हुई है।"},{"en":"ISRO also continues to function as both designer and operator of NavIC and, unlike the U.S. GPS Directorate or the European Union Agency for the Space Programme, lacks a dedicated {{counterpart|समकक्ष}} to manage its navigation constellation.","hi":"इसरो NavIC का डिज़ाइनर और संचालक दोनों बना हुआ है, और अमेरिकी GPS डायरेक्टोरेट या यूरोपीय संघ की अंतरिक्ष कार्यक्रम एजेंसी के उलट, अपने नौवहन उपग्रह-समूह को चलाने के लिए उसका कोई समर्पित समकक्ष नहीं है।"}],[{"en":"The NVS-03 launch comes against the {{backdrop|पृष्ठभूमि}} of an unusually difficult period for ISRO. Two successive failures of the Polar Satellite Launch Vehicle (PSLV) forced the space agency to pause launches while a failure analysis committee investigated the causes.","hi":"NVS-03 का प्रक्षेपण इसरो के लिए असामान्य रूप से कठिन दौर की पृष्ठभूमि में हुआ है। पोलर सैटेलाइट लॉन्च व्हीकल (PSLV) की लगातार दो विफलताओं ने एजेंसी को प्रक्षेपण रोकने पर मजबूर किया, जबकि एक विफलता-विश्लेषण समिति कारणों की जाँच करती रही।"},{"en":"The PSLV and GSLV are different rocket families but share aspects of their first-stage solid motor lineage, avionics, guidance systems, and manufacturing infrastructure.","hi":"PSLV और GSLV अलग रॉकेट परिवार हैं, लेकिन पहले चरण के ठोस मोटर की वंश-परंपरा, एवियोनिक्स, मार्गदर्शन प्रणालियों और निर्माण ढाँचे के कुछ पहलू साझा करते हैं।"},{"en":"The government has said it has identified and resolved the causes of the failures but has declined to publish the committee’s findings. ISRO has had only two successful launches this year, the other being the GSLV-F17 mission that launched the EOS-05 satellite.","hi":"सरकार ने कहा है कि उसने विफलताओं के कारण पहचानकर सुलझा लिए हैं, पर समिति के निष्कर्ष प्रकाशित करने से इनकार किया है। इसरो के इस साल केवल दो प्रक्षेपण सफल रहे हैं, दूसरा GSLV-F17 मिशन था जिसने EOS-05 उपग्रह छोड़ा।"},{"en":"The NVS-03 launch also departed from the usual spacecraft configuration, with ISRO having cleared a plan to fly it with its pyrotechnic valves already open, in a bid to avoid a {{recurrence|दोबारा होना}} of a problem that prevented NVS-02 from {{manoeuvring|कक्षा में चाल बदलना}} into its intended orbit.","hi":"NVS-03 का प्रक्षेपण उपग्रह की सामान्य बनावट से भी अलग रहा: इसरो ने उसे उसके पायरोटेक्निक वाल्व पहले से खुले रखकर उड़ाने की योजना मंज़ूर की, ताकि उस समस्या का दोहराव न हो जिसकी वजह से NVS-02 अपनी तय कक्षा में नहीं जा सका था।"}]],"vocab":[["restore","verb","बहाल करना","reinstate, revive","destroy","to bring back to an earlier condition"],["functionality","noun","कार्यक्षमता","capability, utility","—","the range of things a system can do"],["indigenous","adj","स्वदेशी, देशज","native, domestic","foreign","originating naturally in a place; homegrown"],["conceive","verb","परिकल्पना करना","imagine, devise","—","to form an idea or plan in the mind"],["civilian","adj/noun","नागरिक (गैर-सैन्य)","non-military","military","a person not in the military or police"],["restricted","adj","प्रतिबंधित, सीमित","limited, confined","open","limited in size, amount or access"],["loftier","adj","ऊँचा, महत्वाकांक्षी","higher, grander","modest","higher or more noble"],["decommission","verb","सेवा से हटाना","retire, withdraw","commission","to take out of service"],["defunct","adj","निष्क्रिय, बंद","inoperative, dead","active","no longer existing or working"],["deteriorate","verb","बिगड़ना","worsen, decline","improve","to become worse over time"],["constellation","noun","तारा-समूह; उपग्रहों का समूह","cluster, group","—","a group of stars or related things"],["setback","noun","झटका, रुकावट","reversal, hitch","advance","a problem that delays or reverses progress"],["modernise","verb","आधुनिक बनाना","update, upgrade","outdate","to make up to date"],["payload","noun","पेलोड (उपग्रह/रॉकेट पर भेजा गया उपकरण)","cargo, load","—","the load carried by a vehicle, such as a rocket"],["precise","adj","सटीक","exact, accurate","vague","exact and accurate"],["purportedly","adv","कथित रूप से","allegedly, reportedly","—","as claimed, though not proved"],["redundancy","noun","अतिरिक्त बैकअप (इंजीनियरिंग में); फ़ालतूपन","backup, surplus","scarcity","extra backup that is not strictly needed"],["procurement","noun","ख़रीद, आपूर्ति","acquisition, purchase","sale","the act of obtaining goods or services"],["dependable","adj","भरोसेमंद","reliable, trustworthy","unreliable","trustworthy and reliable"],["counterpart","noun","समकक्ष","equivalent, peer","opposite","a person or thing with the same role elsewhere"],["backdrop","noun","पृष्ठभूमि","background, setting","—","the background or setting of events"],["recurrence","noun","दोबारा होना","repetition, return","—","the act of happening again"],["manoeuvre","verb","चाल/दिशा बदलना","steer, navigate","—","to move or steer skilfully"]],"rc":[{"q":"What is the main idea of the passage?","o":["All PSLV and GSLV launches this year were successful","NavIC has now overtaken the U.S. GPS in global coverage","ISRO has stopped developing its own atomic clocks","ISRO has launched NVS-03 to help restore NavIC, whose early satellites have largely failed, amid a difficult period for the agency"],"a":3,"e":"लेख बताता है कि NavIC के शुरुआती उपग्रह ज़्यादातर ख़राब हो चुके हैं और NVS-03 उसे बहाल करने की कोशिश है, जबकि इसरो मुश्किल दौर में है।"},{"q":"After IRNSS-1F’s last atomic clock stopped working, how many satellites could provide PNT services?","o":["Three","Four","Five","Two"],"a":0,"e":"पैराग्राफ़ के अनुसार केवल तीन उपग्रह बचे, जबकि कम से कम चार चाहिए।"},{"q":"Why has ISRO proposed five clocks on each satellite?","o":["To copy the U.S. GPS design exactly","To make the satellites heavier","To reduce launch costs","To provide additional redundancy if some clocks fail"],"a":3,"e":"लेख इसे अतिरिक्त बैकअप (redundancy) देने वाला बताता है, ताकि कुछ घड़ियाँ ख़राब होने पर भी उपग्रह काम करे।"},{"q":"The author’s tone in the passage is best described as:","o":["Hostile","Celebratory","Analytical and cautious","Humorous"],"a":2,"e":"लेख तथ्य रखता है और साथ में चुनौतियाँ भी गिनाता है, इसलिए लहजा विश्लेषणात्मक और सतर्क है।"},{"q":"The word ‘defunct’ in the passage means:","o":["No longer functioning","Newly launched","Fully repaired","Highly accurate"],"a":0,"e":"Defunct = जो अब काम न कर रहा हो।"}],"pj":[{"q":["P. IRNSS was subsequently renamed NavIC.","Q. India launched the first-generation IRNSS satellites between 2013 and 2018.","R. Unlike the U.S. GPS, NavIC was conceived as a regional system.","S. They were designed to provide PNT services over India."],"o":["SQPR","PQSR","QPSR","QSPR"],"a":3,"e":"पहले उपग्रह छोड़े गए (Q), उनका मक़सद (S), फिर नाम बदला (P), फिर GPS से तुलना (R)।"},{"q":["P. Satellite navigation systems generally provide two categories of signals.","Q. An open signal is meant for civilian applications like navigation and disaster management.","R. A restricted signal is meant for authorised users, including the armed forces.","S. The latter offers greater accuracy."],"o":["PQRS","PRQS","QPRS","SPQR"],"a":0,"e":"दो तरह के संकेत (P), खुला (Q), प्रतिबंधित (R), और ‘The latter’ यानी बाद वाला (S) अंत में।"},{"q":["P. The situation deteriorated further in March.","Q. The last functioning atomic clock aboard IRNSS-1F stopped working.","R. This left only three satellites able to provide PNT services.","S. At least four are required for NavIC to function as intended."],"o":["QPRS","PRQS","PQRS","SRQP"],"a":2,"e":"स्थिति बिगड़ी (P), कारण (Q), नतीजा (R), ज़रूरत (S)।"},{"q":["P. Two successive PSLV failures forced the agency to pause launches.","Q. The NVS-03 launch comes against the backdrop of a difficult period for ISRO.","R. A failure analysis committee investigated the causes.","S. The government has said it has resolved the causes but declined to publish the findings."],"o":["PQRS","QPRS","SQPR","QRPS"],"a":1,"e":"पृष्ठभूमि (Q), विफलताएँ (P), जाँच (R), सरकार का बयान (S)।"}],"es":[{"q":"The satellite, along with (A) / its payloads, (B) are ready for launch. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Subject–verb agreement। Subject ‘satellite’ एकवचन है; ‘along with’ वाला हिस्सा उसे बहुवचन नहीं बनाता, इसलिए ‘is ready’।"},{"q":"The satellite was launched (A) / from Sriharikota by (B) a ISRO rocket. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Articles (a/an)। ISRO का उच्चारण स्वर (‘आई’) से शुरू होता है, इसलिए ‘an ISRO rocket’।"},{"q":"The mission was (A) / successful in (B) restoring navigation capability. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Prepositions। ‘successful in + -ing’ सही है; वाक्य शुद्ध है।"},{"q":"The agency is capable (A) / of to launch (B) heavy satellites. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund after prepositions। Preposition के बाद gerund आता है: ‘of launching’।"},{"q":"The satellite has (A) / already been (B) launch from Sriharikota. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Past participle (V3)। Present perfect passive में V3 आता है: ‘been launched’।"},{"q":"The engineers worked (A) / very hardly (B) to fix the fault. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Adjective vs adverb। ‘Hard’ क्रिया-विशेषण भी है; ‘hardly’ का अर्थ ‘मुश्किल से’ है। सही: ‘very hard’।"},{"q":"ISRO and its (A) / partners has (B) shared their data. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Pronoun agreement। Subject ‘ISRO and partners’ बहुवचन है, इसलिए ‘have shared’।"},{"q":"The satellite (A) / was built (B) by Indian engineers and tested by they. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Passive voice। ‘by’ के बाद object-case आता है: ‘by them’।"},{"q":"The new satellite is (A) / more advanced (B) from the older one. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Comparative with than। Comparative के साथ ‘than’ आता है: ‘more advanced than’।"},{"q":"The official said (A) / that the launch (B) will be held next week. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Reported speech। Reporting verb past हो तो आगे की क्रिया भी past रूप में: ‘would be held’।"}],"qz":[{"q":"Synonym of RESTORE:","o":["Destroy","Hide","Ignore","Revive"],"a":3,"e":"Restore = Revive, यानी बहाल करना।"},{"q":"Antonym of INDIGENOUS:","o":["Native","Foreign","Local","Domestic"],"a":1,"e":"Indigenous (स्वदेशी) का उलटा Foreign।"},{"q":"Synonym of DETERIORATE:","o":["Repair","Improve","Worsen","Grow"],"a":2,"e":"Deteriorate = Worsen, यानी बिगड़ना।"},{"q":"Antonym of DEFUNCT:","o":["Dead","Inoperative","Obsolete","Active"],"a":3,"e":"Defunct (निष्क्रिय) का उलटा Active।"},{"q":"Choose the correctly spelt word:","o":["Procurement","Procurment","Prucurement","Procuremant"],"a":0,"e":"सही spelling Procurement है।"},{"q":"One word: a group of satellites working together as one system","o":["Payload","Constellation","Backdrop","Redundancy"],"a":1,"e":"Constellation यानी उपग्रहों का समूह।"},{"q":"One word: a person or thing with the same function in another organisation","o":["Counterpart","Rival","Host","Founder"],"a":0,"e":"Counterpart यानी समकक्ष।"},{"q":"Fill in the blank: The bridge’s condition ___ rapidly after the floods.","o":["restored","modernised","deteriorated","procured"],"a":2,"e":"बाढ़ के बाद हालत ‘बिगड़ी’, इसलिए deteriorated।"},{"q":"Fill in the blank: The government is trying to ___ public trust after the scandal.","o":["restore","defunct","conceive","degrade"],"a":0,"e":"भरोसा बहाल करना, यानी restore।"},{"q":"Idiom: ‘take a toll’ means:","o":["To collect tax","To cause damage or harm gradually","To make a phone call","To win easily"],"a":1,"e":"Take a toll = धीरे-धीरे नुकसान पहुँचाना।"},{"q":"Idiom: ‘a step in the right direction’ means:","o":["A wrong decision","A dance move","A long journey","A useful move towards a goal"],"a":3,"e":"A step in the right direction = लक्ष्य की ओर उपयोगी कदम।"},{"q":"Phrasal verb: ‘carry out’ means:","o":["Cancel","Delay","Perform","Remove"],"a":2,"e":"Carry out = पूरा करना, अंजाम देना।"},{"q":"Synonym of PRECISE:","o":["Vague","Exact","Rough","Careless"],"a":1,"e":"Precise = Exact, यानी सटीक।"},{"q":"According to the passage, on which date was NVS-03 launched?","o":["October 8","October 10","October 30","October 25"],"a":2,"e":"पैराग्राफ़ के अनुसार प्रक्षेपण 30 अक्टूबर को हुआ।"},{"q":"According to the passage, which Swiss company made the imported clocks?","o":["Rubidium Labs","SpectraTime","GPS Directorate","Space Applications Centre"],"a":1,"e":"आयातित घड़ियाँ स्विस कंपनी स्पेक्ट्राटाइम की बनी थीं।"}],"idioms":[["take a toll","धीरे-धीरे नुकसान पहुँचाना","The long delays took a toll on the mission schedule.","to cause damage or loss over time"],["a step in the right direction","सही दिशा में एक उपयोगी कदम","Using indigenous clocks is a step in the right direction.","progress towards a good goal"],["set the stage (for)","किसी बात के लिए ज़मीन तैयार करना","The new launch sets the stage for restoring NavIC.","to prepare conditions for something"]],"fq":[]},{"id":"green","title":"Greener cities and bluer spaces for a healthier India","src":"The Hindu, Delhi edition, 1 Nov 2026, p. 13 (Science · Speaking of Science) · D. Balasubramanian · Topic: Environment / Health","ed":[[{"en":"Green trees and plants are vital for human health. In villages and farmlands, the uppermost parts of the tree provide a {{canopy|वृक्षों की छतरी}}, with roof-like branches, offering people a cooler and healthier environment. And the rivers, canals, ponds and pools offer people there a bluer environment.","hi":"हरे पेड़-पौधे इंसान की सेहत के लिए बेहद ज़रूरी हैं। गाँवों और खेतों में पेड़ों का ऊपरी हिस्सा छत जैसी शाखाओं वाली छतरी बनाकर लोगों को ठंडा और स्वस्थ माहौल देता है। और वहाँ की नदियाँ, नहरें, तालाब और पोखर लोगों को ‘नीला’ माहौल देते हैं।"},{"en":"Such rural areas thus offer their residents healthier {{environs|परिवेश}}. But when private {{enterprises|उद्यम}} and commercial agencies take away many acres of land in towns, {{suburban|उपनगरीय}}, and rural areas to build large multi-storied buildings and housing complexes, it results in further canopy loss.","hi":"इस तरह ऐसे ग्रामीण इलाक़े अपने निवासियों को ज़्यादा स्वस्थ परिवेश देते हैं। लेकिन जब निजी उद्यम और व्यावसायिक एजेंसियाँ कस्बों, उपनगरों और ग्रामीण इलाक़ों में कई एकड़ ज़मीन लेकर बड़ी बहुमंज़िला इमारतें और आवासीय परिसर बनाती हैं, तो पेड़ों की छतरी और घटती है।"}],[{"en":"The State of Telangana has about 48% of the people living in urban areas, with more trees sacrificed, while farmlands and villages are left with fewer trees and less water for agriculture. This is also true of several other southern States.","hi":"तेलंगाना में लगभग 48% लोग शहरी इलाक़ों में रहते हैं, जहाँ और पेड़ कुर्बान किए जाते हैं, जबकि खेतों और गाँवों में पेड़ कम और खेती के लिए पानी कम बचता है। यह कई और दक्षिणी राज्यों के लिए भी सच है।"},{"en":"The urban population across India is now 36%. UNICEF has pointed out that children’s health is affected when green and blue spaces are {{disturbed|छेड़े गए}}.","hi":"भारत में अब शहरी आबादी 36% है। यूनिसेफ़ ने बताया है कि जब हरी और नीली जगहों से छेड़छाड़ होती है तो बच्चों की सेहत पर असर पड़ता है।"},{"en":"According to the National Family Health Survey, the infant {{mortality|मृत्यु-दर}} rate can be {{correlated|परस्पर जुड़ा}} to the greenness of the area; the lower the greenness, the higher the rate.","hi":"राष्ट्रीय परिवार स्वास्थ्य सर्वेक्षण के अनुसार शिशु मृत्यु-दर का इलाक़े की हरियाली से संबंध जोड़ा जा सकता है; हरियाली जितनी कम, दर उतनी ज़्यादा।"},{"en":"In the green States of Kerala, Goa and Puducherry, the infant mortality rate is quite low, around eight per 1,000 births, while Uttar Pradesh and Rajasthan have higher rates, closer to thirty per 1,000 births.","hi":"केरल, गोवा और पुदुचेरी जैसे हरे राज्यों में शिशु मृत्यु-दर काफ़ी कम, लगभग आठ प्रति 1,000 जन्म है, जबकि उत्तर प्रदेश और राजस्थान में यह ज़्यादा, लगभग तीस प्रति 1,000 जन्म के क़रीब है।"}],[{"en":"In 2023, an international team of researchers pointed out in the journal The Lancet (vol. 8, issue 9, September 2023) that since a significant {{fraction|अंश}} of the human population now lives in urban areas, these people should also enjoy greater access to urban green and blue spaces, which could lead to improvements in public health.","hi":"2023 में शोधकर्ताओं की एक अंतरराष्ट्रीय टीम ने द लैंसेट पत्रिका में बताया कि चूँकि मानव आबादी का एक बड़ा हिस्सा अब शहरों में रहता है, इन लोगों को भी शहरी हरी और नीली जगहों तक ज़्यादा पहुँच मिलनी चाहिए, जिससे सार्वजनिक स्वास्थ्य सुधर सकता है।"},{"en":"It will also promote environmental {{biodiversity|जैव विविधता}} and {{civic|नागरिक}} sense through parks, sports fields, higher physical activity, and {{camaraderie|भाईचारा}} among the residents.","hi":"इससे पार्कों, खेल के मैदानों, ज़्यादा शारीरिक गतिविधि और निवासियों के आपसी भाईचारे के ज़रिए पर्यावरणीय जैव विविधता और नागरिक भावना को भी बढ़ावा मिलेगा।"},{"en":"A more recent paper by three Indian researchers in the Indian Journal of Science and Research (Pande et al; Ind. J. Sci. Res., 5 (2), 2025) expanded on this theme and suggested a {{framework|ढाँचा}} to achieve green infrastructure and urban {{sustainability|सतत विकास}}.","hi":"इंडियन जर्नल ऑफ़ साइंस एंड रिसर्च में तीन भारतीय शोधकर्ताओं के एक ज़्यादा हालिया शोधपत्र (पांडे व अन्य, 2025) ने इसी विषय को आगे बढ़ाया और हरित ढाँचागत सुविधाओं तथा शहरी सतत विकास पाने का एक ढाँचा सुझाया।"},{"en":"This involves greener urban areas, including more trees, parks, walkways, sports arenas, and swimming pools. These have now become part of the Indian government’s Atal Mission for {{Rejuvenation|पुनर्जीवन}} and Urban Transformation (AMRUT).","hi":"इसमें ज़्यादा हरे शहरी इलाक़े शामिल हैं, यानी ज़्यादा पेड़, पार्क, पैदल पथ, खेल-स्थल और तरण-ताल। ये अब भारत सरकार के अटल नवीनीकरण और शहरी परिवर्तन मिशन (AMRUT) का हिस्सा बन गए हैं।"}],[{"en":"In this connection, recently, an international group of {{epidemiologists|महामारी-विज्ञानी}} analysed data from 57 countries.","hi":"इसी संदर्भ में हाल ही में महामारी-विज्ञानियों के एक अंतरराष्ट्रीय समूह ने 57 देशों के आँकड़ों का विश्लेषण किया।"},{"en":"Their findings, published in Proceedings of the National Academy of Sciences, under the title ‘Urban tree canopy {{fragmentation|टुकड़ों में बँटना}} and child mortality in low- and middle-income countries’ (PNAS, 123 (34) e2606669123, August 21, 2026), show how the loss of green and blue spaces through the loss of canopy can affect children’s health by increasing climate stress, air pollution, anxiety, loss of playground space and infection by pests and microbes.","hi":"प्रोसीडिंग्स ऑफ़ द नेशनल एकेडमी ऑफ़ साइंसेज़ में ‘निम्न और मध्यम आय वाले देशों में शहरी पेड़-छतरी का बिखराव और बाल मृत्यु-दर’ शीर्षक से छपे उनके निष्कर्ष बताते हैं कि छतरी घटने से हरी और नीली जगहों का नुक़सान जलवायु-तनाव, वायु प्रदूषण, चिंता, खेल की जगह की कमी और कीटों व सूक्ष्मजीवों से संक्रमण बढ़ाकर बच्चों की सेहत पर असर डाल सकता है।"},{"en":"These factors can also lead to low birthweight, psychological stress, {{congenital|जन्मजात}} {{anomalies|असामान्यताएँ}}, and child mortality, {{notably|विशेष रूप से}} under the age of five.","hi":"ये कारक कम जन्म-वज़न, मानसिक तनाव, जन्मजात असामान्यताओं और बाल मृत्यु, ख़ासकर पाँच साल से कम उम्र में, का कारण भी बन सकते हैं।"},{"en":"The researchers collected data from 42 lakh children hailing from 57 low- and middle-income countries or regions where green and blue spaces are more {{prevalent|व्यापक}}, such as in West Sudan, the Punjab region in Pakistan, and the Ganga-Brahmaputra Delta in Bangladesh, and found that these regions have lower levels of under-five mortality than in the other countries studied.","hi":"शोधकर्ताओं ने 57 निम्न और मध्यम आय वाले देशों या इलाक़ों के 42 लाख बच्चों का आँकड़ा जुटाया, जहाँ हरी और नीली जगहें ज़्यादा व्यापक हैं, जैसे पश्चिमी सूडान, पाकिस्तान का पंजाब क्षेत्र और बांग्लादेश का गंगा-ब्रह्मपुत्र डेल्टा, और पाया कि इन इलाक़ों में पाँच साल से कम उम्र की मृत्यु-दर बाक़ी अध्ययन किए देशों से कम है।"},{"en":"According to the World Bank, India ranks as the fifth wealthiest nation in the world. Even as we aim to make India rank higher, let us ensure the country becomes greener and bluer.","hi":"विश्व बैंक के अनुसार भारत दुनिया का पाँचवाँ सबसे धनी देश है। भारत को और ऊपर ले जाने की कोशिश के साथ-साथ आइए यह भी सुनिश्चित करें कि देश और हरा और नीला बने।"}]],"vocab":[["canopy","noun","वृक्षों की छतरी","cover, awning","—","a covering, such as the upper layer of a forest"],["environs","noun","परिवेश, आसपास का इलाक़ा","surroundings","—","the surrounding area"],["enterprise","noun","उद्यम, कारोबार","firm, venture","—","a business or a bold project"],["suburban","adj","उपनगरीय","residential, outlying","urban core","relating to an area on the edge of a city"],["disturb","verb","छेड़ना, बाधा डालना","disrupt, upset","calm","to interrupt or upset the normal state"],["mortality","noun","मृत्यु-दर","death rate","immortality, survival","the death rate; the state of being mortal"],["correlate","verb","आपस में जुड़ा होना","relate, connect","differ","to have a mutual relationship or connection"],["fraction","noun","अंश, छोटा हिस्सा","portion, part","whole","a small part of a whole"],["biodiversity","noun","जैव विविधता","variety of life","—","the variety of living things in an area"],["civic","adj","नागरिक","municipal, public","private","relating to a city or its citizens"],["camaraderie","noun","भाईचारा, मित्रता","fellowship, comradeship","hostility","friendship and trust among a group"],["framework","noun","ढाँचा","structure, outline","—","a basic structure or system of rules"],["sustainability","noun","सतत विकास, टिकाऊपन","viability, endurance","—","ability to continue without harming resources"],["rejuvenation","noun","पुनर्जीवन, नवीनीकरण","renewal, revival","decay","making something look or feel young again"],["epidemiologist","noun","महामारी-विज्ञानी","—","—","an expert who studies how diseases spread"],["fragmentation","noun","टुकड़ों में बँटना","breakup, splitting","unity, integration","breaking into small separate pieces"],["congenital","adj","जन्मजात","inborn, innate","acquired","present from birth"],["anomaly","noun","असामान्यता, विसंगति","irregularity, oddity","norm","something that differs from the normal"],["notably","adv","विशेष रूप से","especially, particularly","insignificantly","especially; in an important way"],["prevalent","adj","व्यापक, प्रचलित","widespread, common","rare","widespread at a particular time or place"],["microbe","noun","सूक्ष्मजीव","germ, organism","—","a tiny living organism seen only under a microscope"],["sacrifice","verb","कुर्बान करना","give up, forfeit","gain","to give up something valued for a greater cause"]],"rc":[{"q":"What is the main idea of the passage?","o":["Rural areas should be converted to cities as quickly as possible","Green and blue spaces in cities are vital for health, especially children’s, and losing tree canopy raises health risks","India’s infant mortality is the same in all States","Parks and swimming pools are too costly for Indian cities"],"a":1,"e":"लेख का सार है कि हरी-नीली जगहें सेहत, ख़ासकर बच्चों की, के लिए ज़रूरी हैं और पेड़ों की छतरी घटने से जोखिम बढ़ता है।"},{"q":"According to the passage, what is the infant mortality rate in Kerala, Goa and Puducherry?","o":["About thirty per 1,000 births","About forty-eight per 1,000 births","About eight per 1,000 births","About thirty-six per 1,000 births"],"a":2,"e":"पैराग्राफ़ के अनुसार इन हरे राज्यों में दर लगभग आठ प्रति 1,000 जन्म है।"},{"q":"What can be inferred from the 57-country study?","o":["Urban areas never have trees","Wealthier countries have no child mortality","Playgrounds cause infections","Protecting canopy and green-blue spaces may help lower child mortality"],"a":3,"e":"हरी-नीली जगहों वाले इलाक़ों में पाँच साल से कम उम्र की मृत्यु-दर कम मिली, इसलिए इनकी रक्षा से मदद मिल सकती है।"},{"q":"The tone of the author is best described as:","o":["Neutral and detached","Mocking","Concerned and advocating","Despairing"],"a":2,"e":"लेखक चिंता जताता है और अंत में देश को हरा-नीला बनाने की अपील करता है, इसलिए लहजा चिंतित और पक्षधर है।"},{"q":"The word ‘prevalent’ in the passage means:","o":["Missing","Widespread","Expensive","Temporary"],"a":1,"e":"Prevalent = व्यापक, यानी widespread।"}],"pj":[{"q":["P. Green trees and plants are vital for human health.","Q. In villages and farmlands, the uppermost parts of the tree provide a canopy.","R. Such rural areas thus offer their residents healthier environs.","S. And the rivers, canals, ponds and pools offer people there a bluer environment."],"o":["PQSR","QPSR","PQRS","SPQR"],"a":0,"e":"पहले मुख्य बात (P), पेड़ों की छतरी (Q), नीला माहौल (S), फिर ‘Such rural areas thus’ वाला निष्कर्ष (R)।"},{"q":["P. The urban population across India is now 36%.","Q. UNICEF has pointed out that children’s health is affected when green and blue spaces are disturbed.","R. According to the National Family Health Survey, the infant mortality rate can be correlated to the greenness of the area.","S. In the green States of Kerala, Goa and Puducherry, the infant mortality rate is quite low."],"o":["PRQS","SRQP","QPRS","PQRS"],"a":3,"e":"शहरी आबादी (P), यूनिसेफ़ (Q), सर्वेक्षण का संबंध (R), उदाहरण (S)।"},{"q":["P. A more recent paper by three Indian researchers expanded on this theme.","Q. It suggested a framework to achieve green infrastructure and urban sustainability.","R. This involves greener urban areas, including more trees, parks and walkways.","S. These have now become part of the Atal Mission for Rejuvenation and Urban Transformation."],"o":["QPRS","PQRS","PRQS","SPQR"],"a":1,"e":"शोधपत्र (P), उसका ढाँचा (Q), उसमें क्या शामिल (R), और ‘These’ वाली S अंत में।"},{"q":["P. In 2023, researchers pointed out in The Lancet that urban residents should enjoy greater access to green and blue spaces.","Q. It will also promote biodiversity and civic sense through parks, sports fields and camaraderie.","R. According to the World Bank, India ranks as the fifth wealthiest nation in the world.","S. Even as we aim to make India rank higher, let us ensure the country becomes greener and bluer."],"o":["SRQP","QPRS","RPQS","PQRS"],"a":3,"e":"लैंसेट का सुझाव (P), उसके फ़ायदे (Q), भारत की रैंक (R), अंतिम अपील (S)।"}],"es":[{"q":"Neither the parks (A) / nor the lake (B) were open to visitors. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Subject–verb agreement। Neither…nor में क्रिया पास वाले subject (lake) से मिलती है: ‘was open’।"},{"q":"There are (A) / less trees (B) in most urban areas. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Less / fewer। गिनने योग्य चीज़ों के लिए ‘fewer trees’, ‘less’ अगणनीय के लिए।"},{"q":"A urban forest (A) / can cool (B) the surrounding air. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Articles। ‘urban’ का उच्चारण स्वर से शुरू होता है, इसलिए ‘An urban forest’।"},{"q":"People should be (A) / encouraged to go (B) to work with cycle. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Prepositions of means। साधन के लिए ‘by cycle’।"},{"q":"The city have (A) / planted (B) thousands of trees this year. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Present perfect। City एकवचन है, इसलिए ‘has planted’।"},{"q":"Delhi is one of (A) / the most polluted (B) city in the country. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Superlative। ‘one of the’ के बाद बहुवचन संज्ञा: ‘cities’।"},{"q":"Residents enjoy (A) / to walk (B) near the river. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund / infinitive। Enjoy के बाद gerund आता है: ‘walking’।"},{"q":"Although the park is small, (A) / but it (B) is very popular. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Conjunctions। Although के साथ ‘but’ नहीं आता; दोनों में से एक ही रखें।"},{"q":"The committee has (A) / submitted (B) its report on green spaces. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Collective nouns। Committee एक इकाई मानी जाए तो ‘has’ और ‘its’ दोनों सही हैं। वाक्य शुद्ध है।"},{"q":"They planted (A) / many beautiful (B) old trees. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Word order / adjective order। Opinion (beautiful) के बाद age (old) आती है, क्रम सही है। वाक्य शुद्ध है।"}],"qz":[{"q":"Synonym of PREVALENT:","o":["Widespread","Rare","Hidden","Weak"],"a":0,"e":"Prevalent = Widespread।"},{"q":"Antonym of FRAGMENTATION:","o":["Breakup","Splitting","Division","Integration"],"a":3,"e":"Fragmentation (बिखराव) का उलटा Integration।"},{"q":"Synonym of CAMARADERIE:","o":["Rivalry","Fellowship","Distance","Anger"],"a":1,"e":"Camaraderie = Fellowship, यानी भाईचारा।"},{"q":"Antonym of CONGENITAL:","o":["Acquired","Natural","Innate","Inborn"],"a":0,"e":"Congenital (जन्मजात) का उलटा Acquired।"},{"q":"Choose the correctly spelt word:","o":["Camaredarie","Camarederie","Camaradarie","Camaraderie"],"a":3,"e":"सही spelling Camaraderie है।"},{"q":"One word: a scientist who studies how diseases spread in populations","o":["Botanist","Geologist","Epidemiologist","Economist"],"a":2,"e":"Epidemiologist यानी महामारी-विज्ञानी।"},{"q":"One word: the variety of plant and animal life in an area","o":["Canopy","Anomaly","Mortality","Biodiversity"],"a":3,"e":"Biodiversity यानी जैव विविधता।"},{"q":"Fill in the blank: Higher literacy is ___ with lower infant mortality.","o":["fragmented","sacrificed","correlated","disturbed"],"a":2,"e":"‘साथ जुड़ा होना’ के लिए correlated।"},{"q":"Fill in the blank: Reducing carbon emissions is essential for urban ___.","o":["sustainability","anomaly","mortality","camaraderie"],"a":0,"e":"शहरी सतत विकास के लिए sustainability।"},{"q":"Idiom: ‘a breath of fresh air’ means:","o":["A medical test","Something refreshing and new","A strong wind","A bad smell"],"a":1,"e":"A breath of fresh air = कुछ ताज़गी भरा और नया।"},{"q":"Idiom: ‘pay dividends’ means:","o":["To pay a bank","To waste money","To produce good results over time","To borrow"],"a":2,"e":"Pay dividends = आगे चलकर अच्छा फल देना।"},{"q":"Phrasal verb: ‘take away’ means:","o":["Remove","Add","Repair","Admire"],"a":0,"e":"Take away = हटाना, ले लेना।"},{"q":"Synonym of NOTABLY:","o":["Rarely","Slightly","Especially","Secretly"],"a":2,"e":"Notably = Especially, यानी विशेष रूप से।"},{"q":"According to the passage, what share of India’s population is urban?","o":["36%","48%","20%","57%"],"a":0,"e":"पैराग्राफ़ के अनुसार भारत की शहरी आबादी 36% है।"},{"q":"According to the passage, how many countries’ data did the epidemiologists analyse?","o":["27","57","42","37"],"a":1,"e":"समूह ने 57 देशों के आँकड़ों का विश्लेषण किया।"}],"idioms":[["a breath of fresh air","ताज़गी भरी, नई चीज़","The new park was a breath of fresh air for residents.","something new and refreshing"],["pay dividends","आगे चलकर अच्छा फल देना","Planting trees today will pay dividends for children.","to bring good results later"],["take away (phrasal verb)","हटाना, छीन लेना","Builders took away acres of green land.","to remove, or the main point to remember"]],"fq":[],"todo":""},{"id":"mawal","title":"Velvety crimson is Kashmir’s treasure","src":"The Hindu, Delhi edition, 1 Nov 2026, News in Frames · Imran Nissar · Topic: Culture / Indian heritage","todo":"","ed":[[{"en":"Deeply rooted in Kashmir’s {{culinary|पाक-कला संबंधी}} heritage, the cockscomb flower lends a rich red {{hue|रंगत}} to traditional cuisine; the petals, which are sun-dried and preserved for year-round use, serve as an {{indispensable|अनिवार्य}} ingredient in wazwan.","hi":"कश्मीर की पाक-परंपरा में गहरी जड़ें रखने वाला कॉक्सकॉम्ब फूल पारंपरिक व्यंजनों को गाढ़ी लाल रंगत देता है; धूप में सुखाकर साल भर के लिए सहेजी गई इसकी पंखुड़ियाँ वाज़वान की अनिवार्य सामग्री हैं।"},{"en":"The cockscomb flower (Celosia cristata) is recognisable by its {{distinctive|विशिष्ट}}, velvety, fan-shaped crest that resembles a rooster’s comb. Rich crimson {{pigment|रंजक}} is concentrated in the {{dense|घने}} and highly textured folds of the blossom and these petals are harvested and dried to give traditional Kashmiri dishes their signature ruby-red colour.","hi":"कॉक्सकॉम्ब फूल (सेलोसिया क्रिस्टाटा) अपनी विशिष्ट, मखमली, पंखे जैसी कलगी से पहचाना जाता है जो मुर्
