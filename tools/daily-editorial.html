ntrance (A) / examinations (B) have increased sharply. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Subject–verb agreement। ‘The number of’ एकवचन: ‘has increased’।"},{"q":"Students face (A) / a unnecessary (B) burden. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Articles। ‘unnecessary’ स्वर से शुरू होता है: ‘an unnecessary burden’।"},{"q":"Despite of (A) / the pressure, (B) many students succeed. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Prepositions। Despite के बाद ‘of’ नहीं आता।"},{"q":"Students have prepared (A) / for months (B) since the exam was announced. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Since / for। ‘for months’ और ‘since …’ दोनों सही हैं। वाक्य शुद्ध है।"},{"q":"Each of the exams cost (A) / a (B) / lot. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Each / every। ‘Each of’ के बाद एकवचन: ‘costs’।"},{"q":"This test is more tougher (A) / than (B) / the last. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Double comparative। ‘tougher than’।"},{"q":"Coaching centres give (A) / many informations (B) to candidates. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Uncountable। ‘much information’।"},{"q":"If exams (A) / were fair, (B) students will trust them. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Conditional। Second conditional: ‘would trust’।"},{"q":"Students avoid (A) / to take (B) risks. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund। Avoid के बाद gerund: ‘taking’।"},{"q":"The system wastes (A) / money, delays (B) results and to harm students. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Parallel structure। समान रूप: ‘and harms students’।"}],"qz":[{"q":"Synonym of RELENTLESS:","o":["Unceasing","Gentle","Brief","Weak"],"a":0,"e":"Relentless = Unceasing, यानी लगातार चलने वाला।"},{"q":"Synonym of EXORBITANT:","o":["Cheap","Excessive","Modest","Fair"],"a":1,"e":"Exorbitant = Excessive, यानी हद से ज़्यादा (दाम)।"},{"q":"Synonym of MARRED:","o":["Improved","Cleaned","Praised","Spoiled"],"a":3,"e":"Marred = Spoiled, यानी बिगाड़ा हुआ।"},{"q":"Antonym of RAMPANT:","o":["Widespread","Common","Rare","Unchecked"],"a":2,"e":"Rampant (बेलगाम, फैला हुआ) का उलटा Rare (दुर्लभ)।"},{"q":"Antonym of INEVITABLE:","o":["Certain","Sure","Fixed","Avoidable"],"a":3,"e":"Inevitable (अपरिहार्य) का उलटा Avoidable (टालने योग्य)।"},{"q":"Choose the correctly spelt word:","o":["Labrynthian","Labyrinthian","Labyrinthain","Labirynthian"],"a":1,"e":"सही वर्तनी Labyrinthian है।"},{"q":"Choose the correctly spelt word:","o":["Dilingence","Dilligence","Diligance","Diligence"],"a":3,"e":"सही वर्तनी Diligence है (एक l, तीन i नहीं)।"},{"q":"One word for: ‘a person who judges or settles a matter’","o":["Auditor","Mentor","Arbiter","Critic"],"a":2,"e":"Arbiter = वह व्यक्ति जो किसी मामले का फ़ैसला करे।"},{"q":"One word for: ‘to take apart or break down a system’","o":["Dismantle","Assemble","Moderate","Embed"],"a":0,"e":"Dismantle = किसी ढाँचे को तोड़ना या खोल देना।"},{"q":"Fill in the blank: The new rules were so ____ that small shopkeepers could not follow them.","o":["light","simple","trivial","onerous"],"a":3,"e":"‘so … that could not follow’ से बोझिल अर्थ चाहिए, इसलिए onerous।"},{"q":"Fill in the blank: Corruption in recruitment ____ public trust in the system.","o":["mends","builds","erodes","raises"],"a":2,"e":"भ्रष्टाचार भरोसे को घटाता है, इसलिए erodes।"},{"q":"Idiom: ‘the cure is worse than the disease’ means:","o":["The disease is easily curable","The remedy causes more harm than the original problem","The patient has recovered","Medicine is costly"],"a":1,"e":"इस मुहावरे का अर्थ है कि इलाज बीमारी से भी ज़्यादा नुक़सानदेह है।"},{"q":"According to the passage, which test is mentioned for law aspirants?","o":["NATA","CUET","CLAT","JEE"],"a":2,"e":"दूसरे हिस्से में लिखा है कि आर्किटेक्चर के लिए NATA और क़ानून के लिए CLAT है।"},{"q":"Who headed the 2024 review committee on the National Testing Agency?","o":["A former space scientist","A retired Vice Chancellor","A former judge","A serving minister"],"a":0,"e":"लेख के अनुसार 2024 की समीक्षा समिति की अध्यक्षता एक पूर्व अंतरिक्ष वैज्ञानिक ने की थी।"},{"q":"What does the author suggest a single national test could do?","o":["Replace all school examinations","Moderate board or university examination results","Decide every recruitment","Be conducted every year in every subject"],"a":1,"e":"लेखक के अनुसार हर निकास-स्तर पर एक राष्ट्रीय परीक्षा के अंक बोर्ड/विश्वविद्यालय नतीजों को संतुलित करने में काम आएँ।"}],"idioms":[["take to the streets","सड़कों पर उतरना, विरोध प्रदर्शन करना","Angry students took to the streets after the paper leak.","to go out in public to protest"],["can ill afford","वहन करने में मुश्किल होना","Many families can ill afford expensive coaching.","can hardly bear the cost or risk"],["on top of (something)","के ऊपर, इसके अलावा","Why build a new system on top of the existing one?","in addition to; above"]],"fq":[]},{"id":"arctic","title":"A security deal, but not the end of the Arctic contest","src":"The Hindu, Delhi edition, 30 Oct 2026, p. 8 (Editorial page article) · Sakti Prasad Srichandan · The Greenland agreement strengthens American security while raising sovereignty concerns · Topic: Politics / International Relations","todo":"","ed":[[{"en":"The agreement signed between the United States, Denmark and Greenland on September 22, 2026, marks an important moment in the changing geopolitics of the Arctic. Greenland is an {{autonomous|स्वायत्त}} part of the Kingdom of Denmark.","hi":"22 सितंबर 2026 को अमेरिका, डेनमार्क और ग्रीनलैंड के बीच हुआ समझौता आर्कटिक की बदलती भू-राजनीति में एक अहम क्षण है। ग्रीनलैंड डेनमार्क साम्राज्य का एक स्वायत्त हिस्सा है।"},{"en":"Under the 2009 Self-Government Act, it has extensive control over its domestic affairs, while foreign, defence and security policy remain with Denmark.","hi":"2009 के स्वशासन अधिनियम के तहत उसे अपने घरेलू मामलों पर व्यापक नियंत्रण है, जबकि विदेश, रक्षा और सुरक्षा नीति डेनमार्क के पास रहती है।"},{"en":"Greenland came into the news this year because of the Trump administration’s repeated interest in gaining control over the island. What began as a territorial {{controversy|विवाद}} gradually became a wider debate about {{sovereignty|संप्रभुता}}, security and the future of the Arctic.","hi":"ग्रीनलैंड इस साल ट्रंप प्रशासन की द्वीप पर नियंत्रण पाने की बार-बार दिखाई रुचि के कारण ख़बरों में आया। जो एक क्षेत्रीय विवाद के रूप में शुरू हुआ, वह धीरे-धीरे संप्रभुता, सुरक्षा और आर्कटिक के भविष्य पर व्यापक बहस बन गया।"}],[{"en":"The agreement, signed at the United Nations, expands the American military presence in Greenland while reaffirming Danish sovereignty and Greenland’s right to {{self-determination|आत्मनिर्णय}}.","hi":"संयुक्त राष्ट्र में हस्ताक्षरित यह समझौता ग्रीनलैंड में अमेरिकी सैन्य मौजूदगी बढ़ाता है, साथ ही डेनमार्क की संप्रभुता और ग्रीनलैंड के आत्मनिर्णय के अधिकार की पुनः पुष्टि करता है।"},{"en":"It brings, at least for now, an end to the unusual tensions between Washington and Copenhagen over the future of the strategically important island. The agreement’s entry into force is {{subject to|के अधीन}} the completion of the necessary parliamentary procedures in Denmark and Greenland.","hi":"यह, कम से कम अभी के लिए, इस रणनीतिक रूप से अहम द्वीप के भविष्य को लेकर वॉशिंगटन और कोपेनहेगन के बीच के असामान्य तनाव को ख़त्म करता है। समझौते का लागू होना डेनमार्क और ग्रीनलैंड में ज़रूरी संसदीय प्रक्रियाएँ पूरी होने पर निर्भर है।"}],[{"en":"The agreement is essentially a security deal, not a territorial deal. The U.S. has, for the moment, moved away from its earlier demand to acquire Greenland. Instead, Washington has secured greater military access to the island.","hi":"यह समझौता मूलतः सुरक्षा सौदा है, क्षेत्रीय सौदा नहीं। अमेरिका फ़िलहाल ग्रीनलैंड को हासिल करने की अपनी पहले की माँग से पीछे हट गया है। इसके बजाय वॉशिंगटन ने द्वीप पर ज़्यादा सैन्य पहुँच पा ली है।"},{"en":"The agreement allows the expansion of the existing Pituffik Space Base and provides for additional American defence facilities at Narsarsuaq in southern Greenland and Mestersvig in the east, subject to mutually agreed arrangements.","hi":"समझौता मौजूदा पिटुफिक स्पेस बेस के विस्तार की अनुमति देता है और दक्षिणी ग्रीनलैंड के नार्सार्सुआक तथा पूर्व के मेस्टर्सविग में पारस्परिक रूप से तय व्यवस्थाओं के तहत अतिरिक्त अमेरिकी रक्षा सुविधाओं का प्रावधान करता है।"},{"en":"American aircraft and ships will have wider access to Greenlandic territory and waters for defence purposes. The important point is simple. Greenland has not changed hands.","hi":"अमेरिकी विमानों और जहाज़ों को रक्षा उद्देश्यों के लिए ग्रीनलैंड के क्षेत्र और जल तक ज़्यादा पहुँच मिलेगी। अहम बात सीधी है: ग्रीनलैंड हाथ नहीं बदला है।"},{"en":"But the American military presence there is likely to become much larger. The agreement shows how quickly the Arctic is becoming a {{strategic|रणनीतिक}} region.","hi":"लेकिन वहाँ अमेरिकी सैन्य मौजूदगी काफ़ी बड़ी होने की संभावना है। यह समझौता दिखाता है कि आर्कटिक कितनी तेज़ी से एक रणनीतिक क्षेत्र बनता जा रहा है।"}],[{"en":"Greenland sits in a {{crucial|निर्णायक, अहम}} location between North America and Europe, a geography that matters for missile warning, space {{surveillance|निगरानी}} and the security of the North Atlantic. It is becoming more important as Arctic sea routes open up and competition over resources grows.","hi":"ग्रीनलैंड उत्तर अमेरिका और यूरोप के बीच एक अहम स्थान पर है, ऐसा भूगोल जो मिसाइल चेतावनी, अंतरिक्ष निगरानी और उत्तरी अटलांटिक की सुरक्षा के लिए मायने रखता है। जैसे-जैसे आर्कटिक के समुद्री मार्ग खुल रहे हैं और संसाधनों की होड़ बढ़ रही है, इसका महत्व और बढ़ रहा है।"},{"en":"The agreement includes cooperation related to the proposed Golden Dome defence system. It also places restrictions on investments from countries outside the North Atlantic Treaty Organization (NATO), NATO partner countries and the European Union (EU) in certain sensitive sectors.","hi":"समझौते में प्रस्तावित गोल्डन डोम रक्षा प्रणाली से जुड़ा सहयोग शामिल है। यह कुछ संवेदनशील क्षेत्रों में उत्तरी अटलांटिक संधि संगठन (NATO), NATO के साझेदार देशों और यूरोपीय संघ (EU) से बाहर के देशों के निवेश पर पाबंदियाँ भी लगाता है।"},{"en":"Economic activity in the Arctic is therefore increasingly being viewed through the {{lens|नज़रिया}} of national security.","hi":"इसलिए आर्कटिक में आर्थिक गतिविधि को अब राष्ट्रीय सुरक्षा के नज़रिये से ज़्यादा देखा जा रहा है।"}],[{"en":"For Denmark, the challenge was particularly difficult. Copenhagen had to protect its sovereignty over Greenland while avoiding a {{prolonged|लंबा खिंचा}} {{confrontation|टकराव}} with Washington.","hi":"डेनमार्क के लिए चुनौती ख़ास तौर पर कठिन थी। कोपेनहेगन को ग्रीनलैंड पर अपनी संप्रभुता की रक्षा करनी थी और साथ ही वॉशिंगटन के साथ लंबे टकराव से बचना था।"},{"en":"The agreement gives Denmark a way to do both. American military involvement will increase, but within an arrangement that formally recognises Danish sovereignty and Greenlandic self-determination.","hi":"समझौता डेनमार्क को दोनों करने का रास्ता देता है। अमेरिकी सैन्य भागीदारी बढ़ेगी, पर ऐसी व्यवस्था के भीतर जो डेनमार्क की संप्रभुता और ग्रीनलैंड के आत्मनिर्णय को औपचारिक रूप से मानती है।"},{"en":"Greenland’s Prime Minister Jens-Frederik Nielsen has also stressed the importance of NATO in Arctic security. The deal brings greater American involvement into Greenland without formally changing its political status.","hi":"ग्रीनलैंड के प्रधानमंत्री जेन्स-फ़्रेडरिक नील्सन ने भी आर्कटिक सुरक्षा में NATO के महत्व पर ज़ोर दिया है। यह सौदा ग्रीनलैंड की राजनीतिक स्थिति को औपचारिक रूप से बदले बिना वहाँ अमेरिका की ज़्यादा भागीदारी लाता है।"}],[{"en":"Yet, the question of sovereignty remains {{complicated|उलझा हुआ}}. The agreement recognises Greenland’s right to self-determination. It refers to respect for Greenlandic society and its traditional way of life.","hi":"फिर भी संप्रभुता का सवाल उलझा हुआ है। समझौता ग्रीनलैंड के आत्मनिर्णय के अधिकार को मानता है। यह ग्रीनलैंडिक समाज और उसकी पारंपरिक जीवन-शैली के सम्मान का ज़िक्र करता है।"},{"en":"At the same time, it gives the U.S. extensive military access and introduces restrictions on foreign investment in sensitive areas. The agreement has no {{expiry date|समाप्ति की तारीख़}}. Some of its {{provisions|प्रावधान}} would also remain in place even if Greenland becomes independent in the future, creating an unusual situation.","hi":"साथ ही यह अमेरिका को व्यापक सैन्य पहुँच देता है और संवेदनशील क्षेत्रों में विदेशी निवेश पर पाबंदियाँ लगाता है। समझौते की कोई समाप्ति-तिथि नहीं है। इसके कुछ प्रावधान तब भी लागू रहेंगे जब ग्रीनलैंड भविष्य में स्वतंत्र हो जाए, जिससे एक असामान्य स्थिति बनती है।"}],[{"en":"The Greenland episode tells us something about the future of the Arctic. The region is no longer only about climate change, scientific research and polar exploration. It is now closely linked to missile defence, critical minerals, infrastructure, shipping routes and space security.","hi":"ग्रीनलैंड प्रकरण आर्कटिक के भविष्य के बारे में कुछ बताता है। यह क्षेत्र अब सिर्फ़ जलवायु परिवर्तन, वैज्ञानिक शोध और ध्रुवीय अन्वेषण का नहीं रहा। अब यह मिसाइल रक्षा, महत्वपूर्ण खनिजों, बुनियादी ढाँचे, समुद्री मार्गों और अंतरिक्ष सुरक्षा से गहराई से जुड़ा है।"},{"en":"Russia’s military presence and China’s growing economic and scientific interests have already changed the strategic environment. But Arctic competition can also create tensions among {{allies|सहयोगी देश}} themselves.","hi":"रूस की सैन्य मौजूदगी और चीन के बढ़ते आर्थिक व वैज्ञानिक हितों ने रणनीतिक माहौल पहले ही बदल दिया है। लेकिन आर्कटिक की होड़ सहयोगी देशों के बीच भी तनाव पैदा कर सकती है।"},{"en":"For Denmark and Greenland, the agreement provides a way out of a difficult diplomatic situation. For the U.S., it provides greater strategic access without formal {{annexation|क़ब्ज़ा, विलय}}. For NATO, it {{underlines|रेखांकित करना}} the growing importance of the High North.","hi":"डेनमार्क और ग्रीनलैंड के लिए समझौता एक कठिन कूटनीतिक स्थिति से निकलने का रास्ता देता है। अमेरिका के लिए यह औपचारिक विलय के बिना ज़्यादा रणनीतिक पहुँच देता है। NATO के लिए यह हाई नॉर्थ के बढ़ते महत्व को रेखांकित करता है।"}],[{"en":"But the real test will come later. The question is whether greater American military involvement can strengthen Greenland’s security without reducing Greenlanders’ control over their future.","hi":"लेकिन असली परीक्षा बाद में आएगी। सवाल यह है कि क्या अमेरिका की ज़्यादा सैन्य भागीदारी ग्रीनलैंड की सुरक्षा मज़बूत कर सकती है और ग्रीनलैंडवासियों का अपने भविष्य पर नियंत्रण भी कम नहीं होने देगी।"},{"en":"As Greenland is likely to remain important, its people will have to balance the opportunities that greater international attention brings with the risks of becoming the centre of great-power competition.","hi":"चूँकि ग्रीनलैंड के अहम बने रहने की संभावना है, उसके लोगों को ज़्यादा अंतरराष्ट्रीय ध्यान से मिलने वाले अवसरों और महाशक्तियों की होड़ का केंद्र बनने के जोखिमों के बीच संतुलन बनाना होगा।"},{"en":"The way Denmark, the U.S. and Greenland manage this balance will shape the island’s future. The answer to that question will ultimately determine the real importance of this agreement.","hi":"डेनमार्क, अमेरिका और ग्रीनलैंड इस संतुलन को कैसे सँभालते हैं, यही द्वीप का भविष्य गढ़ेगा। उस सवाल का जवाब आख़िरकार इस समझौते का असली महत्व तय करेगा।"}]],"vocab":[["autonomous","adj","स्वायत्त","self-governing, independent","dependent","self-governing; independent"],["controversy","noun","विवाद","dispute, debate","agreement","a public dispute or disagreement"],["sovereignty","noun","संप्रभुता","supremacy, independence","subjection","supreme power or authority of a state"],["self-determination","noun","आत्मनिर्णय","independence, autonomy","subjugation","a people’s right to decide their own future"],["strategic","adj","रणनीतिक","tactical, calculated","unplanned","planned to achieve a long-term aim"],["crucial","adj","निर्णायक, बेहद अहम","vital, critical","trivial","extremely important"],["surveillance","noun","निगरानी","monitoring, watch","neglect","close watch on people or places"],["lens","noun","नज़रिया (आलंकारिक), लेंस","perspective, viewpoint","—","a way of looking at something"],["prolonged","adj","लंबा खिंचा","extended, protracted","brief","continuing for a long time"],["confrontation","noun","टकराव","clash, conflict","cooperation","a hostile face-to-face clash"],["complicated","adj","उलझा हुआ, जटिल","complex, intricate","simple","hard to understand; having many parts"],["provisions","noun","प्रावधान, शर्तें","clauses, stipulations","—","conditions or clauses in an agreement"],["allies","noun","सहयोगी देश, मित्र","partners, associates","enemies","countries or people joined for a common purpose"],["annexation","noun","क़ब्ज़ा करके मिला लेना","seizure, takeover","release","taking over a territory and adding it to one’s own"],["underlines","verb","रेखांकित करना, ज़ोर देना","highlights, stresses","downplays","emphasises or stresses"],["extensive","adj","व्यापक, विस्तृत","wide, broad","limited","covering a large area or range"],["geopolitics","noun","भू-राजनीति","global politics","—","politics influenced by geography"],["reaffirming","verb","फिर से पुष्टि करना","reasserting, restating","denying","stating again that something is true"],["expansion","noun","विस्तार","growth, enlargement","reduction","an increase in size or extent"],["restrictions","noun","पाबंदियाँ","limits, curbs","freedom","rules that limit what can be done"],["involvement","noun","भागीदारी, संलिप्तता","participation, engagement","detachment","taking part in something"],["subject to","phrase","के अधीन, पर निर्भर","dependent on, conditional on","independent of","depending on or controlled by"],["expiry date","noun","समाप्ति की तारीख़","end date, deadline","start date","the date after which something ends"],["unusual","adj","असामान्य","uncommon, rare","usual","not common or ordinary"],["persistence","noun","निरंतरता, डटे रहना","continuity, tenacity","giving up","firm continuation despite difficulty"]],"rc":[{"q":"What is the central point of the article?","o":["The agreement expands American military access in Greenland without changing its sovereignty, but the contest over the Arctic continues","Greenland has declared independence","The U.S. has been banned from the Arctic","The U.S. has bought Greenland from Denmark"],"a":0,"e":"लेख का सार है कि समझौता अमेरिकी सैन्य पहुँच बढ़ाता है पर संप्रभुता नहीं बदलता, और आर्कटिक की होड़ आगे भी जारी रहेगी।"},{"q":"According to the passage, who controls Greenland’s foreign, defence and security policy?","o":["Greenland","NATO","The United States","Denmark"],"a":3,"e":"दूसरे वाक्यांश के अनुसार स्वशासन अधिनियम के बावजूद विदेश, रक्षा और सुरक्षा नीति डेनमार्क के पास है।"},{"q":"What can be inferred from the line ‘Greenland has not changed hands’?","o":["The U.S. now owns Greenland","Control of Greenland remains with Denmark and Greenland formally, though the U.S. military presence grows","Denmark has left NATO","Greenland will join the U.S."],"a":1,"e":"लेखक कहता है कि द्वीप का स्वामित्व नहीं बदला, पर अमेरिकी सैन्य मौजूदगी बड़ी होगी।"},{"q":"The tone of the author is best described as:","o":["Dismissive","Sarcastic","Celebratory","Analytical and balanced"],"a":3,"e":"लेखक फ़ायदे और जोखिम दोनों गिनाकर विश्लेषण करता है, इसलिए tone analytical and balanced है।"},{"q":"The word ‘annexation’ in the passage is closest in meaning to:","o":["Sale","Lease","Seizure of a territory","Protection"],"a":2,"e":"Annexation = किसी क्षेत्र को अपने में मिला लेना, यानी क़ब्ज़ा।"}],"pj":[{"q":["P. It brings, at least for now, an end to the unusual tensions between Washington and Copenhagen.","Q. The agreement, signed at the United Nations, expands the American military presence in Greenland.","R. The agreement’s entry into force is subject to the completion of parliamentary procedures.","S. It also reaffirms Danish sovereignty and Greenland’s right to self-determination."],"o":["QPSR","QSPR","SQPR","PQRS"],"a":1,"e":"पहले समझौते का परिचय Q, फिर उसी का दूसरा पहलू S, फिर नतीजा P और अंत में लागू होने की शर्त R।"},{"q":["P. Instead, Washington has secured greater military access to the island.","Q. The U.S. has, for the moment, moved away from its earlier demand to acquire Greenland.","R. The agreement is essentially a security deal, not a territorial deal.","S. The important point is simple."],"o":["RQPS","QRPS","RPQS","SRQP"],"a":0,"e":"पहले मुख्य कथन R, फिर अमेरिका का पीछे हटना Q, फिर ‘Instead’ वाली P, और सार S।"},{"q":["P. For Denmark, the challenge was particularly difficult.","Q. The agreement gives Denmark a way to do both.","R. Copenhagen had to protect its sovereignty while avoiding a prolonged confrontation with Washington.","S. American military involvement will increase, but within an arrangement that recognises Danish sovereignty."],"o":["PQRS","PRQS","RPQS","PSRQ"],"a":1,"e":"पहले चुनौती P, फिर उसका विवरण R, ‘both’ वाली Q उसके बाद, और अंत में S।"},{"q":["P. For the U.S., it provides greater strategic access without formal annexation.","Q. For NATO, it underlines the growing importance of the High North.","R. For Denmark and Greenland, the agreement provides a way out of a difficult diplomatic situation.","S. But Arctic competition can also create tensions among allies themselves."],"o":["RQPS","RPQS","SPRQ","SRPQ"],"a":3,"e":"पहले सामान्य टिप्पणी S, फिर डेनमार्क-ग्रीनलैंड R, फिर अमेरिका P और अंत में NATO Q।"}],"es":[{"q":"The agreement, (A) / along with new bases, (B) are controversial. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Subject–verb agreement। Subject ‘agreement’ एकवचन: ‘is controversial’।"},{"q":"Greenland is (A) / a autonomous (B) territory. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Articles। ‘autonomous’ स्वर से शुरू होता है: ‘an autonomous territory’।"},{"q":"The deal was signed (A) / by the US and Denmark (B) at United Nations. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Articles / prepositions। संस्था का नाम ‘the United Nations’ के साथ आता है।"},{"q":"The island has been (A) / in the news (B) since several months. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Since / for। ‘for several months’।"},{"q":"Neither Denmark nor (A) / Greenland (B) were willing to cede control. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Neither … nor। पास वाला subject ‘Greenland’ एकवचन है: ‘was willing’।"},{"q":"The Arctic is (A) / becoming more important (B) than ever. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Comparative / superlative। वाक्य शुद्ध है।"},{"q":"The pact gave (A) / the US many accesses (B) to bases. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Countable / uncountable। Access अगणनीय है: ‘much access’ या ‘wider access’।"},{"q":"If Greenland (A) / becomes independent, (B) the deal would remain. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Conditional। Real condition में ‘will remain’।"},{"q":"Denmark avoided (A) / to confront (B) Washington. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund। ‘confronting’।"},{"q":"The minister said (A) / that NATO (B) is vital for the region. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Reported speech। ‘was vital’।"}],"qz":[{"q":"Synonym of CRUCIAL:","o":["Vital","Minor","Optional","Rare"],"a":0,"e":"Crucial = Vital, यानी बेहद ज़रूरी।"},{"q":"Synonym of PROLONGED:","o":["Short","Sudden","Extended","Brief"],"a":2,"e":"Prolonged = Extended, यानी लंबा खिंचा।"},{"q":"Synonym of CONFRONTATION:","o":["Agreement","Clash","Friendship","Silence"],"a":1,"e":"Confrontation = Clash, यानी टकराव।"},{"q":"Antonym of AUTONOMOUS:","o":["Independent","Self-ruled","Free","Dependent"],"a":3,"e":"Autonomous (स्वायत्त) का उलटा Dependent (आश्रित)।"},{"q":"Antonym of EXPANSION:","o":["Growth","Reduction","Increase","Spread"],"a":1,"e":"Expansion (विस्तार) का उलटा Reduction (कमी)।"},{"q":"Choose the correctly spelt word:","o":["Sovreignty","Sovereinty","Sovereignty","Soverignty"],"a":2,"e":"सही वर्तनी Sovereignty है।"},{"q":"Choose the correctly spelt word:","o":["Surveillance","Surveilance","Serveillance","Survellance"],"a":0,"e":"सही वर्तनी Surveillance है (double l, ei नहीं)।"},{"q":"One word for: ‘taking over a territory and adding it to one’s own’","o":["Evacuation","Abdication","Annexation","Migration"],"a":2,"e":"Annexation = किसी क्षेत्र को अपने में मिला लेना।"},{"q":"One word for: ‘a country that is a friend or partner in war or politics’","o":["Foe","Rival","Neighbour","Ally"],"a":3,"e":"Ally = सहयोगी, मित्र देश।"},{"q":"Fill in the blank: The two nations signed a ____ to strengthen defence cooperation.","o":["rumour","quarrel","pact","game"],"a":2,"e":"देशों के बीच सहयोग के लिए pact (समझौता) हस्ताक्षरित होता है।"},{"q":"Fill in the blank: The island’s ____ location makes it important for missile warning.","o":["funny","strategic","random","weak"],"a":1,"e":"रक्षा महत्व के संदर्भ में strategic (रणनीतिक) सही है।"},{"q":"Idiom: ‘change hands’ means:","o":["To shake hands","To clap","To pass to a new owner","To wave"],"a":2,"e":"Change hands = मालिकाना हक़ दूसरे के पास चला जाना।"},{"q":"When was the agreement signed between the U.S., Denmark and Greenland?","o":["September 22, 2026","October 22, 2026","September 12, 2025","July 2, 2026"],"a":0,"e":"लेख की पहली पंक्ति के अनुसार 22 सितंबर 2026।"},{"q":"Where was the agreement signed, according to the passage?","o":["Washington","Copenhagen","Nuuk","The United Nations"],"a":3,"e":"दूसरे पैराग्राफ़ के अनुसार समझौता संयुक्त राष्ट्र में हस्ताक्षरित हुआ।"},{"q":"Which defence system is mentioned in the agreement’s cooperation?","o":["Golden Dome","Iron Dome","Sky Shield","Silver Wall"],"a":0,"e":"लेख में प्रस्तावित गोल्डन डोम रक्षा प्रणाली का ज़िक्र है।"}],"idioms":[["change hands","मालिकाना हक़ बदल जाना","The property changed hands last year.","to pass to a new owner"],["way out of (a situation)","किसी स्थिति से निकलने का रास्ता","The deal gave both sides a way out of the crisis.","a means of escaping a situation"],["open up (phrasal verb)","खुल जाना, उपलब्ध हो जाना","New sea routes are opening up in the Arctic.","to become available or accessible"]],"fq":[]},{"id":"dorothy","title":"Animals as symbols of caste, masculinity and human relations in Dorothy","src":"The Hindu, Delhi edition, 30 Oct 2026, p. 11 (Text & Context) · Vasudevan Mukunth · The animals in Karthik Subbaraj’s period drama appear in moments of vulnerability and violence · Topic: Literature / Arts (Cinema)","todo":"","ed":[[{"en":"Dorothy, the Tamil film written and directed by Karthik Subbaraj, was released in theatres on September 25 and has taken viewers by storm. It is set in rural Madurai in the 1990s.","hi":"डोरोथी, कार्तिक सुब्बाराज द्वारा लिखी और निर्देशित तमिल फ़िल्म, 25 सितंबर को सिनेमाघरों में आई और दर्शकों पर छा गई है। यह 1990 के दशक के ग्रामीण मदुरै में सेट है।"},{"en":"It follows two young men, Subbu and Karthi, and the {{rigid|कठोर, अड़ियल}} ideas of masculinity and caste that test their friendship. When Dorothy arrives in their village, her presence challenges all their assumptions.","hi":"यह दो युवकों, सुब्बू और कार्थी, और मर्दानगी तथा जाति के उन कठोर विचारों की कहानी है जो उनकी दोस्ती की परीक्षा लेते हैं। जब डोरोथी उनके गाँव आती है, तो उसकी मौजूदगी उनकी सारी धारणाओं को चुनौती देती है।"},{"en":"Sananth, Rishikanth, and Keerthy Suresh play the principal roles, alongside Muthukumar as a powerful moneylender.","hi":"सनंत, ऋषिकांत और कीर्ति सुरेश प्रमुख भूमिकाओं में हैं, और मुत्तुकुमार एक ताक़तवर साहूकार की भूमिका में हैं।"}],[{"en":"But as the humans of Dorothy impose their systems of {{domination|वर्चस्व}} and control on one another, try as they might, the natural world itself remains {{indifferent|उदासीन}} to the social {{hierarchies|ऊँच-नीच की श्रेणियाँ}} they consider so crucial.","hi":"लेकिन जब डोरोथी के इंसान एक-दूसरे पर वर्चस्व और नियंत्रण की अपनी व्यवस्थाएँ थोपते हैं, तो वे चाहे जितनी कोशिश कर लें, प्राकृतिक दुनिया उन सामाजिक ऊँच-नीच की श्रेणियों के प्रति उदासीन ही रहती है जिन्हें वे इतना अहम मानते हैं।"}],[{"en":"In a recent interview, Mr. Subbaraj said he based the {{motif|आवर्ती प्रतीक, विषय-चिह्न}} of the rooster in the film — which Subbu names and nurtures — on his research into Bahuchara Mata, a Hindu goddess associated with transgender communities and whose mount is a rooster.","hi":"एक हालिया इंटरव्यू में श्री सुब्बाराज ने कहा कि फ़िल्म में मुर्गे का प्रतीक, जिसे सुब्बू नाम देता और पालता है, उन्होंने बहुचरा माता पर अपने शोध से लिया, जो ट्रांसजेंडर समुदायों से जुड़ी हिंदू देवी हैं और जिनका वाहन मुर्गा है।"},{"en":"A festival centred on this deity is a guiding light in the film. Mr. Subbaraj also said the motif inspired the cockfighting scenes, and that he included it both to represent a piece of the Madurai landscape and to {{connote|संकेत देना, अर्थ जोड़ना}} a higher meaning.","hi":"इस देवी पर केंद्रित एक उत्सव फ़िल्म में मार्गदर्शक रोशनी है। श्री सुब्बाराज ने यह भी कहा कि इस प्रतीक से मुर्गों की लड़ाई वाले दृश्य प्रेरित हुए, और उन्होंने इसे मदुरै के परिदृश्य का एक हिस्सा दिखाने और साथ ही एक ऊँचे अर्थ का संकेत देने, दोनों के लिए रखा।"}],[{"en":"Many of the other animals of Dorothy are similarly a part of the material world of rural Tamil Nadu, even as they represent the human relationships unfolding within it. Some of the animals people capture and slaughter, force to fight, or turn into weapons against other people.","hi":"डोरोथी के कई और जानवर भी इसी तरह ग्रामीण तमिलनाडु की भौतिक दुनिया का हिस्सा हैं, जबकि वे उसके भीतर चल रहे मानवीय रिश्तों का प्रतिनिधित्व भी करते हैं। कुछ जानवरों को लोग पकड़ते और काटते हैं, लड़ने को मजबूर करते हैं या दूसरों के ख़िलाफ़ हथियार बना लेते हैं।"},{"en":"On the other hand, the scorpion and the dung beetle act independently of human concerns, and in one {{serendipitous|संयोग से मिला भाग्यशाली}} moment, set Karthi’s and Subbu’s shared journey on a very different path.","hi":"दूसरी ओर बिच्छू और गोबरैला इंसानी चिंताओं से स्वतंत्र होकर काम करते हैं, और एक संयोगवश भाग्यशाली क्षण में कार्थी और सुब्बू की साझा यात्रा को बिलकुल अलग राह पर मोड़ देते हैं।"}],[{"en":"The skinned hare {{suspended|लटका हुआ}} from the ceiling in the house of Veeraiya, the local moneylender and Subbu’s father, paints an obvious picture of {{vulnerability|असुरक्षा, कमज़ोरी}} stripped of protection, not coincidentally displayed in the home of a man who controls other people through economic dependence and caste power.","hi":"स्थानीय साहूकार और सुब्बू के पिता वीरैया के घर की छत से लटका खाल उतरा ख़रगोश सुरक्षा से वंचित कमज़ोरी की साफ़ तस्वीर खींचता है, जो संयोग से नहीं, ऐसे आदमी के घर में दिखाई गई है जो आर्थिक निर्भरता और जातिगत ताक़त से दूसरों को नियंत्रित करता है।"},{"en":"There is also a disturbing parallel between the hare and Dorothy herself. The house is not just a place where people destroy vulnerable bodies but also {{normalise|सामान्य बना देना}} the cruelty of such actions.","hi":"ख़रगोश और ख़ुद डोरोथी के बीच एक परेशान करने वाली समानता भी है। वह घर सिर्फ़ ऐसी जगह नहीं जहाँ लोग कमज़ोर शरीरों को नष्ट करते हैं, बल्कि ऐसे कृत्यों की क्रूरता को सामान्य भी बना देते हैं।"}],[{"en":"Members of Veeraiya’s community also breed, train, and pit roosters and rams against one another for their entertainment. The visual meaning is obvious: it is the men that are really aggressive and {{territorial|अपने इलाक़े पर अड़ने वाले}}, seeking dominance over others.","hi":"वीरैया के समुदाय के लोग अपने मनोरंजन के लिए मुर्गे और मेढ़े पालते, सिखाते और आपस में भिड़ाते भी हैं। दृश्य का अर्थ साफ़ है: असल में आक्रामक और अपने इलाक़े पर अड़ने वाले आदमी हैं, जो दूसरों पर वर्चस्व चाहते हैं।"},{"en":"Their masculinity is animalistic. Yet all the cruelty we see on screen, especially all that matters to Dorothy, is entirely human, arising as it does from caste, property, honour, and gender expectations, rather than anything imposed by nature.","hi":"उनकी मर्दानगी पशुवत है। फिर भी पर्दे पर दिखने वाली सारी क्रूरता, ख़ासकर वह सब जो डोरोथी के लिए मायने रखता है, पूरी तरह इंसानी है, जो जाति, संपत्ति, इज़्ज़त और लैंगिक अपेक्षाओं से उपजती है, न कि प्रकृति की थोपी किसी चीज़ से।"}],[{"en":"When the ram headbutts that poor man to death, an animal is becoming an instrument of human judgment. The violence is organised and conferred a social purpose, turning the scene into a {{commentary|टिप्पणी}} on the men, who have also conditioned themselves to fight and prove their masculinity.","hi":"जब मेढ़ा उस बेचारे आदमी को सींग मारकर मार देता है, तो एक जानवर इंसानी फ़ैसले का औज़ार बन रहा होता है। हिंसा संगठित है और उसे सामाजिक उद्देश्य दे दिया गया है, जिससे दृश्य उन आदमियों पर टिप्पणी बन जाता है, जिन्होंने ख़ुद भी लड़ने और अपनी मर्दानगी साबित करने के लिए ख़ुद को ढाल लिया है।"},{"en":"But then there are also the dung beetle and the scorpion, and the expansive {{verdant|हरा-भरा}} backdrop.","hi":"लेकिन फिर गोबरैला और बिच्छू भी हैं, और फैली हुई हरी-भरी पृष्ठभूमि भी।"}],[{"en":"The animals in the film were computer-generated, and what the audience is asked to take away from their presence and actions in certain scenes is what the filmmakers have intended. That said, they themselves are not out of sorts with what we expect.","hi":"फ़िल्म के जानवर कंप्यूटर से बनाए गए थे, और कुछ दृश्यों में उनकी मौजूदगी और हरकतों से दर्शकों से जो समझने की अपेक्षा है, वही फ़िल्मकारों का इरादा है। फिर भी वे ख़ुद हमारी अपेक्षाओं से बेमेल नहीं हैं।"}],[{"en":"The landscape itself, from hilltop grasses to weeds in the {{dilapidated|जर्जर}} pond, from overgrown shrubs to forests in the distance, are real in both senses and just as important.","hi":"परिदृश्य ख़ुद, पहाड़ी की घास से लेकर जर्जर तालाब के खरपतवार तक और बेतरतीब झाड़ियों से लेकर दूर के जंगलों तक, दोनों अर्थों में असली और उतना ही अहम है।"},{"en":"As cinematographer Tirru said in an interview, the filmmakers deliberately placed people against these views to reveal the smallness of the men’s egos and the irrelevance of their {{prejudices|पूर्वाग्रह}} within the larger world.","hi":"जैसा सिनेमैटोग्राफ़र तिरु ने एक इंटरव्यू में कहा, फ़िल्मकारों ने लोगों को जानबूझकर इन दृश्यों के सामने रखा ताकि बड़ी दुनिया में आदमियों के अहं की छोटाई और उनके पूर्वाग्रहों की निरर्थकता दिखे।"}],[{"en":"The scorpion is mindless of human authority and, by being itself, accidentally {{frustrates|विफल कर देना}} Karthi’s plan for a murder. When Karthi is treated for the sting, Subbu asks the doctor whether the poison has left his body — a question as much about the literal poison as the foul ideas filling his head and heart.","hi":"बिच्छू इंसानी सत्ता से बेपरवाह है और बस अपने स्वभाव में रहकर अनजाने में कार्थी की हत्या की योजना विफल कर देता है। जब कार्थी का डंक का इलाज होता है, तो सुब्बू डॉक्टर से पूछता है कि क्या ज़हर उसके शरीर से निकल गया, एक सवाल जो शाब्दिक ज़हर के बारे में भी है और उसके सिर और दिल में भरे गंदे विचारों के बारे में भी।"},{"en":"The scorpion has thus become an agent of {{redemption|मुक्ति, उद्धार}}.","hi":"इस तरह बिच्छू मुक्ति का माध्यम बन गया है।"}],[{"en":"The dung beetle, finally, made a curious, even amusing, appearance. It has nothing to do with the plot yet it cuts perhaps the most memorable figure. It appears rolling a dungball as three men brawl in the background.","hi":"आख़िर में गोबरैला एक अनोखी, यहाँ तक कि मज़ेदार, उपस्थिति दर्ज करता है। इसका कथानक से कोई लेना-देना नहीं, फिर भी यह शायद सबसे यादगार छवि बनाता है। यह गोबर की गेंद लुढ़काता दिखता है जबकि पृष्ठभूमि में तीन आदमी झगड़ रहे हैं।"},{"en":"The choice reverses our usual hierarchy of attention, which is to put ourselves and our needs first. But as the men risk their lives over their {{pernicious|घातक, हानिकारक}} social expectations, rolling around in the figurative excrement they themselves have laid, the beetle simply gets on with its own, thoroughly unbothered.","hi":"यह चुनाव हमारे ध्यान की सामान्य श्रेणी को उलट देता है, जिसमें हम ख़ुद को और अपनी ज़रूरतों को पहले रखते हैं। लेकिन जब आदमी अपनी घातक सामाजिक अपेक्षाओं पर जान जोखिम में डालते हैं, उस आलंकारिक मल में लोटते हुए जो उन्होंने ख़ुद बिछाया है, तब गोबरैला अपना काम करता रहता है, पूरी तरह बेफ़िक्र।"}],[{"en":"Dung beetles also find their way using the moon and stars, being guided by the cosmos itself, whereas the people nearby have evidently lost their moral {{bearings|दिशा-बोध}}.","hi":"गोबरैले चाँद और तारों की मदद से रास्ता ढूँढते हैं, यानी ब्रह्मांड ख़ुद उनका मार्गदर्शन करता है, जबकि पास के लोग साफ़ तौर पर अपना नैतिक दिशा-बोध खो चुके हैं।"},{"en":"Overall, the animals of Dorothy do not create a unified {{allegory|रूपक-कथा}}. The cattle, for instance, are just there to reinforce the film’s rural locale.","hi":"कुल मिलाकर डोरोथी के जानवर कोई एकीकृत रूपक-कथा नहीं रचते। मिसाल के तौर पर मवेशी बस फ़िल्म के ग्रामीण परिवेश को पुख़्ता करने के लिए हैं।"},{"en":"But even though they were simulated on a computer, many of the animals that do make an appearance, especially in moments of violence and vulnerability, deserve our attention.","hi":"लेकिन भले ही वे कंप्यूटर पर बनाए गए थे, कई जानवर जो दिखाई देते हैं, ख़ासकर हिंसा और कमज़ोरी के क्षणों में, हमारे ध्यान के हक़दार हैं।"}]],"vocab":[["rigid","adj","कठोर, अड़ियल","inflexible, strict","flexible","stiff; not willing to change"],["domination","noun","वर्चस्व, दबदबा","control, supremacy","submission","control or power over others"],["indifferent","adj","उदासीन","unconcerned, detached","concerned","having no interest or concern"],["hierarchies","noun","ऊँच-नीच की श्रेणियाँ","rankings, orders","equality","systems ranking people from high to low"],["motif","noun","आवर्ती प्रतीक, विषय-चिह्न","theme, symbol","—","a repeated theme or symbol"],["connote","verb","संकेत देना, अर्थ जोड़ना","imply, suggest","state","to suggest an additional meaning"],["serendipitous","adj","संयोग से मिला भाग्यशाली","fortunate, chance","planned","happening by lucky chance"],["suspended","adj","लटका हुआ","hanging, dangling","grounded","hanging from above"],["vulnerability","noun","असुरक्षा, कमज़ोरी","weakness, exposure","strength","being open to harm or attack"],["normalise","verb","सामान्य बना देना","make routine, standardise","shock","to make something seem ordinary or acceptable"],["territorial","adj","अपने इलाक़े पर अड़ने वाला","possessive, protective","—","protective of one’s own area"],["commentary","noun","टिप्पणी, व्याख्या","remark, analysis","—","an explanation or opinion about events"],["verdant","adj","हरा-भरा","green, lush","barren","green with plants and grass"],["dilapidated","adj","जर्जर, टूटा-फूटा","ruined, shabby","well-kept","old and falling to pieces"],["prejudices","noun","पूर्वाग्रह","bias, bigotry","fairness","unfair opinions formed without knowledge"],["frustrates","verb","विफल कर देना","thwarts, foils","helps","prevents someone’s plan from succeeding"],["redemption","noun","मुक्ति, उद्धार","salvation, rescue","damnation","being saved from sin or error"],["pernicious","adj","घातक, हानिकारक","harmful, destructive","beneficial","causing harm in a gradual, hidden way"],["bearings","noun","दिशा-बोध, सही स्थिति का ज्ञान","orientation, direction","—","sense of direction or position"],["allegory","noun","रूपक-कथा","parable, fable","—","a story with a hidden moral meaning"],["principal","adj","प्रमुख, मुख्य","chief, main","minor","main or most important"],["assumptions","noun","धारणाएँ, मान्यताएँ","beliefs, presumptions","facts","things accepted as true without proof"],["brawl","verb","झगड़ना, मारपीट करना","fight, scuffle","make peace","to fight noisily and roughly"]],"rc":[{"q":"What is the main idea of the article?","o":["The film Dorothy was shot entirely with real animals","Dorothy is a documentary about Madurai","Dorothy uses animals as symbols to reflect human cruelty, caste and masculinity while nature stays indifferent","The film is mainly about cockfighting rules"],"a":2,"e":"लेख का सार है कि फ़िल्म में जानवर जाति, मर्दानगी और इंसानी रिश्तों के प्रतीक हैं जबकि प्रकृति उदासीन रहती है।"},{"q":"According to the passage, on which deity’s research did Mr. Subbaraj base the rooster motif?","o":["Meenakshi","Bahuchara Mata","Kali","Murugan"],"a":1,"e":"तीसरे हिस्से के अनुसार मुर्गे का प्रतीक बहुचरा माता पर शोध से लिया गया, जिनका वाहन मुर्गा है।"},{"q":"What can be inferred about the scorpion’s role in the film?","o":["It accidentally changes the course of events and acts as an agent of redemption","It symbolises caste power","It is a pet of Veeraiya","It has no role at all"],"a":0,"e":"बिच्छू अनजाने में कार्थी की हत्या की योजना विफल करता है, इसलिए वह मुक्ति का माध्यम बनता है।"},{"q":"The tone of the author is best described as:","o":["Neutral and bored","Angry and mocking","Analytical and appreciative","Humorous and casual"],"a":2,"e":"लेखक फ़िल्म की प्रतीकात्मकता का गहराई से विश्लेषण करता है और उसकी सराहना भी करता है।"},{"q":"The word ‘pernicious’ in the passage is closest in meaning to:","o":["Harmful","Useful","Ancient","Harmless"],"a":0,"e":"Pernicious = Harmful, यानी घातक। यहाँ सामाजिक अपेक्षाएँ जान जोखिम में डालती हैं।"}],"pj":[{"q":["P. It follows two young men, Subbu and Karthi.","Q. Dorothy, the Tamil film, has taken viewers by storm.","R. It is set in rural Madurai in the 1990s.","S. When Dorothy arrives in their village, her presence challenges all their assumptions."],"o":["QPRS","QRPS","PQRS","RQPS"],"a":1,"e":"पहले फ़िल्म का परिचय Q, फिर परिवेश R, फिर कहानी का मुख्य सूत्र P और अंत में डोरोथी का आना S।"},{"q":["P. There is also a disturbing parallel between the hare and Dorothy herself.","Q. The skinned hare suspended from the ceiling paints an obvious picture of vulnerability.","R. The house is not just a place where people destroy vulnerable bodies.","S. It is also a place that normalises the cruelty of such actions."],"o":["SQPR","PQRS","QRPS","QPRS"],"a":3,"e":"पहले ख़रगोश का चित्र Q, फिर उसकी डोरोथी से समानता P, फिर घर के बारे में R और उसका अगला हिस्सा S।"},{"q":["P. The scorpion has thus become an agent of redemption.","Q. The scorpion accidentally frustrates Karthi’s plan for a murder.","R. When Karthi is treated for the sting, Subbu asks the doctor whether the poison has left his body.","S. That question is as much about the literal poison as the foul ideas filling his head."],"o":["QRSP","PQRS","RQSP","QSPR"],"a":0,"e":"पहले घटना Q, फिर इलाज के समय का सवाल R, उसका अर्थ S और निष्कर्ष P।"},{"q":["P. It appears rolling a dungball as three men brawl in the background.","Q. The dung beetle, finally, made a curious, even amusing, appearance.","R. It has nothing to do with the plot.","S. Yet it cuts perhaps the most memorable figure."],"o":["PQRS","QPRS","QRSP","RQPS"],"a":2,"e":"पहले परिचय Q, फिर कथानक से संबंध R, उसके विपरीत S और अंत में दृश्य P।"}],"es":[{"q":"The cast (A) / of the film (B) are praised by critics. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Subject–verb agreement। Subject ‘cast’ एकवचन इकाई है: ‘is praised’।"},{"q":"The film is set (A) / in rural Madurai (B) in a 1990s. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Articles with decades। दशक के साथ ‘the 1990s’ आता है।"},{"q":"The film deals (A) / on caste (B) and gender. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Prepositions। ‘deals with’।"},{"q":"The film has played (A) / in theatres (B) since three weeks. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Since / for। ‘for three weeks’।"},{"q":"Each of the animals (A) / have (B) a meaning. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Each / every। ‘Each of’ के बाद एकवचन: ‘has’।"},{"q":"The ending is (A) / more darker (B) than the start. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Comparative। ‘darker than’।"},{"q":"The critic made (A) / several remarks (B) and gave an advice. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Uncountable। Advice अगणनीय: ‘some advice’।"},{"q":"The beetle (A) / rolls the dungball (B) while the men fight. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Adjective order। वाक्य में काल का तालमेल सही है (present-present)। वाक्य शुद्ध है।"},{"q":"The director enjoys (A) / to use (B) symbols. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund। Enjoy के बाद gerund: ‘using’।"},{"q":"The role was (A) / shared between (B) Keerthy and I. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Pronoun case। Preposition के बाद object case: ‘me’ (यहाँ सही रूप: ‘Keerthy and me’)।"}],"qz":[{"q":"Synonym of RIGID:","o":["Soft","Strict","Loose","Easy"],"a":1,"e":"Rigid = Strict, यानी कठोर।"},{"q":"Synonym of VERDANT:","o":["Barren","Dry","Dull","Lush"],"a":3,"e":"Verdant = Lush, यानी हरा-भरा।"},{"q":"Synonym of PERNICIOUS:","o":["Harmful","Helpful","Gentle","Polite"],"a":0,"e":"Pernicious = Harmful, यानी घातक।"},{"q":"Antonym of INDIFFERENT:","o":["Unconcerned","Detached","Cold","Concerned"],"a":3,"e":"Indifferent (उदासीन) का उलटा Concerned (चिंतित, परवाह करने वाला)।"},{"q":"Antonym of VULNERABILITY:","o":["Weakness","Strength","Exposure","Risk"],"a":1,"e":"Vulnerability (कमज़ोरी) का उलटा Strength (मज़बूती)।"},{"q":"Choose the correctly spelt word:","o":["Serendipitous","Serendipitus","Serrendipitous","Serendipitious"],"a":0,"e":"सही वर्तनी Serendipitous है।"},{"q":"Choose the correctly spelt word:","o":["Delapidated","Dilapitated","Dilapidated","Dilapedated"],"a":2,"e":"सही वर्तनी Dilapidated है।"},{"q":"One word for: ‘a story with a hidden moral or political meaning’","o":["Allegory","Biography","Anthology","Elegy"],"a":0,"e":"Allegory = रूपक-कथा जिसमें छिपा हुआ नैतिक या राजनीतिक अर्थ हो।"},{"q":"One word for: ‘a recurring theme or symbol in a work of art’","o":["Sequel","Plot","Epilogue","Motif"],"a":3,"e":"Motif = कला या फ़िल्म में बार-बार आने वाला प्रतीक या विषय।"},{"q":"Fill in the blank: The old house stood ____ near the river.","o":["decorated","delighted","dilapidated","detached"],"a":2,"e":"पुराने घर के लिए जर्जर अर्थ वाला dilapidated सही है।"},{"q":"Fill in the blank: The villagers’ ____ against outsiders made life hard for her.","o":["gratitude","admiration","affection","prejudice"],"a":3,"e":"‘against outsiders’ से पूर्वाग्रह (prejudice) का अर्थ बनता है।"},{"q":"Idiom: ‘take by storm’ means:","o":["To be afraid of rain","To become very popular quickly","To leave suddenly","To destroy a building"],"a":1,"e":"Take by storm = अचानक बहुत लोकप्रिय हो जाना, छा जाना।"},{"q":"In which decade is the film set?","o":["1970s","1980s","1990s","2000s"],"a":2,"e":"पहले पैराग्राफ़ के अनुसार फ़िल्म 1990 के दशक के ग्रामीण मदुरै में सेट है।"},{"q":"Who is Veeraiya in the film?","o":["A doctor","A priest","A cinematographer","The local moneylender and Subbu’s father"],"a":3,"e":"लेख के अनुसार वीरैया स्थानीय साहूकार और सुब्बू का पिता है।"},{"q":"What does the dung beetle use to find its way, according to the passage?","o":["Human footprints","The moon and stars","Sunlight only","Wind sound"],"a":1,"e":"अंतिम हिस्से के अनुसार गोबरैले चाँद और तारों से रास्ता ढूँढते हैं।"}],"idioms":[["take (someone) by storm","अचानक बहुत लोकप्रिय हो जाना","The film took viewers by storm.","to become hugely popular very quickly"],["lose one’s bearings","दिशा-बोध खो देना","The men have lost their moral bearings.","to lose one’s sense of direction"],["get on with (phrasal verb)","अपना काम जारी रखना","The beetle simply gets on with its work.","to continue doing something"]],"fq":[]}]},{"date":"Evergreen Library","articles":[{"id":"ev-ed139","title":"Captain Melvin’s Catch","src":"Evergreen library · Topic: Health & Environment","c":"Health & Environment","todo":"","ed":[[{"en":"Captain Melvin checked the {{anchor|लंगर}} to his boat, scratched his white beard and looked out at the sea. He had been fishing for hours and had nearly given up in {{disgust|खीझ, घिन}}.","hi":"कैप्टन मेल्विन ने अपनी नाव का लंगर जाँचा, अपनी सफ़ेद दाढ़ी खुजाई और समुद्र की ओर देखा। वह घंटों से मछली पकड़ रहा था और खीझकर लगभग हार मान चुका था।"},{"en":"A seagull flew overhead {{squawking|कर्कश चीख़ना}} its laughter. “No bite, no bite,” it seemed to say.","hi":"एक समुद्री पक्षी सिर के ऊपर चीख़ता हुआ उड़ा, मानो हँस रहा हो। ऐसा लगा जैसे वह कह रहा हो, “कुछ नहीं फँसा, कुछ नहीं फँसा।”"},{"en":"“Push off. You’ve not caught anything either,” shouted the Captain, shaking a fist.","hi":"“दफ़ा हो जाओ। तुमने भी तो कुछ नहीं पकड़ा,” कैप्टन ने मुट्ठी हिलाते हुए चिल्लाकर कहा।"}],[{"en":"The sea gently rose and fell in big long waves. The weather was hot and still.","hi":"समुद्र धीरे-धीरे बड़ी लंबी लहरों में उठ-गिर रहा था। मौसम गर्म और शांत था।"},{"en":"Captain Melvin started to feel sleepy. Then something made him look up, shading his eyes against sunlight flashing off the water.","hi":"कैप्टन मेल्विन को नींद आने लगी। तभी किसी चीज़ ने उसे ऊपर देखने पर मजबूर किया; उसने पानी से लौटती धूप की चमक से आँखों को हाथ से ढक लिया।"},{"en":"“What’s that?” he {{muttered|बुदबुदाया}}. A small straight stick {{poked|बाहर निकली}} up out of the sea.","hi":"“वह क्या है?” वह बुदबुदाया। समुद्र से एक छोटी-सी सीधी छड़ी बाहर निकली हुई थी।"}],[{"en":"It seemed to be moving towards him. “Well I’ll be…” his words {{trailed off|धीमे पड़कर रुक गए}} as he jumped to his feet and {{peered|झाँका}} over the side of the boat.","hi":"वह उसकी ओर बढ़ती-सी लगी। “अरे वाह…” उसके शब्द धीमे पड़कर रुक गए और वह उछलकर खड़ा हुआ तथा नाव के किनारे से नीचे झाँका।"},{"en":"The small straight stick peered back, blinking big brown eyes. Its body was as long as his arm, its back blue as the sky in summer.","hi":"उस छोटी सीधी छड़ी ने भी बड़ी भूरी आँखें झपकाते हुए उसे वापस देखा। उसका शरीर उसकी बाँह जितना लंबा था और पीठ गर्मियों के आसमान जैसी नीली थी।"},{"en":"Captain Melvin had to catch it. Beside him lay a landing net and a bucket tied by a long rope to the {{mast|मस्तूल}}.","hi":"कैप्टन मेल्विन को उसे पकड़ना ही था। उसके पास एक पकड़ने वाला जाल और एक बाल्टी पड़ी थी, जो लंबी रस्सी से मस्तूल से बँधी थी।"}],[{"en":"He quietly picked up the net. The creature was still there near the boat watching him.","hi":"उसने चुपचाप जाल उठाया। वह जीव अब भी नाव के पास वहीं था और उसे देख रहा था।"},{"en":"Gently, gently the Captain moved the net towards the creature, then he {{pounced|झपट पड़ा}}. “Gotcha.”","hi":"धीरे-धीरे, बहुत धीरे से कैप्टन ने जाल को उस जीव की ओर बढ़ाया, फिर झपट पड़ा। “पकड़ लिया!”"},{"en":"Putting the net on {{deck|जहाज़ का फ़र्श}}, he threw the bucket over the side and pulled it up full of water. He shook the creature out of the net and into the bucket.","hi":"जाल को डेक पर रखकर उसने बाल्टी किनारे से नीचे फेंकी और पानी से भरी खींच ली। उसने जीव को जाल से झटककर बाल्टी में डाल दिया।"}],[{"en":"The creature was like an {{eel|ईल मछली}}, long and thin but with two pairs of tiny {{paddles|चप्पू-जैसे पंख}}, its long neck sticking out of the water looking about. “Flip me, it’s a sea serpent!","hi":"वह जीव ईल मछली जैसा था, लंबा और पतला, पर उसके छोटे-छोटे चप्पू जैसे दो जोड़ी पंख थे और उसकी लंबी गर्दन पानी से बाहर निकलकर इधर-उधर देख रही थी। “हे भगवान, यह तो समुद्री साँप है!"},{"en":"I’ve caught me a sea serpent.” Captain Melvin put the bucket in the shade on the deck and went for his dinner.","hi":"मैंने एक समुद्री साँप पकड़ लिया है।” कैप्टन मेल्विन ने बाल्टी को डेक पर छाँव में रखा और खाना खाने चला गया।"},{"en":"He sat in the deckhouse reading his paper and drinking a cup of tea. The sun was getting low in the sky, just time for another look at his {{prize|क़ीमती शिकार}}.","hi":"वह डेकहाउस में बैठकर अख़बार पढ़ने और चाय पीने लगा। सूरज आसमान में नीचे ढल रहा था, अपने क़ीमती शिकार को एक बार फिर देखने का ठीक समय था।"}],[{"en":"The sea serpent looked back. It was swimming more slowly than before, round and round, {{squashed|ठुँसा हुआ}} into the bucket.","hi":"समुद्री साँप ने उसे वापस देखा। वह पहले से धीमे, गोल-गोल तैर रहा था, बाल्टी में ठुँसा हुआ।"},{"en":"That night the Captain couldn’t sleep for excitement. In the morning he’d take the sea serpent to the local museum, maybe the British Museum.","hi":"उस रात कैप्टन उत्तेजना के मारे सो नहीं सका। सुबह वह समुद्री साँप को स्थानीय संग्रहालय ले जाएगा, शायद ब्रिटिश म्यूज़ियम ही।"},{"en":"They might even call it after him: ‘Melvin’s Sea Serpent (Melvin serpentiansis)’. He could see it now, stuffed in a glass case for all to admire.","hi":"हो सकता है वे उसका नाम भी उसी के नाम पर रखें: ‘मेल्विन का समुद्री साँप (मेल्विन सर्पेंटियानिस)’। वह अभी से देख सकता था कि सबके देखने के लिए उसे काँच के डिब्बे में भूसा भरकर रखा गया है।"}],[{"en":"Stuffed in a glass case? He was getting {{drowsy|ऊँघता, उनींदा}}, but he kept seeing those big brown eyes looking out of the bucket.","hi":"काँच के डिब्बे में भरकर रखा गया? उसे ऊँघ आ रही थी, पर बाल्टी से बाहर झाँकती वे बड़ी भूरी आँखें उसे बार-बार दिखती रहीं।"},{"en":"Stuffed in a glass case. Was that right?","hi":"काँच के डिब्बे में भरकर रखा गया। क्या यह ठीक था?"},{"en":"Stuffed in a glass case... The boat {{lurched|झटके से हिली}}; there was a great splash nearby.","hi":"काँच के डिब्बे में भरकर रखा गया… नाव झटके से हिली; पास ही ज़ोर की छपाक हुई।"}],[{"en":"“Whassat?” Captain Melvin jumped out of his {{bunk|जहाज़ का बिस्तर}}, grabbed a torch and went on deck.","hi":"“वह क्या था?” कैप्टन मेल्विन अपने बिस्तर से कूदा, टॉर्च उठाई और डेक पर गया।"},{"en":"He shone the light out over the water — nothing but a seagull bouncing on big waves. “Squawk,” said the seagull.","hi":"उसने रोशनी पानी पर डाली; वहाँ बस बड़ी लहरों पर उछलता एक समुद्री पक्षी था। “चीं-चीं,” पक्षी ने कहा।"},{"en":"“Push off,” said Captain Melvin and went back to his bunk. But he couldn’t sleep.","hi":"“दफ़ा हो जाओ,” कैप्टन मेल्विन ने कहा और अपने बिस्तर पर लौट गया। पर उसे नींद नहीं आई।"}],[{"en":"Stuffed in a case... and those eyes — brown and sad and tearful. At last it got light and, {{bleary|नींद से धुँधली}}-eyed and with a headache, Captain Melvin poked his head out of the deckhouse and looked around.","hi":"काँच में भरा हुआ… और वे आँखें, भूरी, उदास और आँसू भरी। आख़िरकार उजाला हुआ और नींद से धुँधली आँखों तथा सिरदर्द के साथ कैप्टन मेल्विन ने डेकहाउस से सिर बाहर निकालकर चारों ओर देखा।"},{"en":"The sun shone through red morning clouds. “Red sky in morning, sailor’s warning,” said Captain Melvin.","hi":"सुबह के लाल बादलों में से सूरज चमक रहा था। “सुबह आसमान लाल हो तो मल्लाह के लिए चेतावनी,” कैप्टन मेल्विन ने कहा।"},{"en":"He climbed onto deck and went to look at his catch. The little sea serpent lay on its side, its neck {{drooped|झुक गई}} over the rim of the bucket.","hi":"वह डेक पर चढ़ा और अपने पकड़े हुए जीव को देखने गया। नन्हा समुद्री साँप एक करवट पड़ा था, उसकी गर्दन बाल्टी के किनारे पर झुक गई थी।"}],[{"en":"“Oh no, I’ve killed it. It’s all my fault.”","hi":"“अरे नहीं, मैंने इसे मार डाला। यह सब मेरी ग़लती है।”"},{"en":"He poked it with a finger. The sea serpent raised its neck and looked at him sadly, then it drooped again.","hi":"उसने उसे उँगली से छुआ। समुद्री साँप ने गर्दन उठाकर उसे उदासी से देखा, फिर वह दोबारा झुक गई।"},{"en":"The Captain felt tears pricking his eyes. The little sea serpent would never be stuffed in a glass case.","hi":"कैप्टन को लगा कि उसकी आँखों में आँसू चुभ रहे हैं। नन्हे समुद्री साँप को कभी काँच के डिब्बे में भूसा भरकर नहीं रखा जाएगा।"}],[{"en":"Never. “Come on little ’un, off you go.”","hi":"कभी नहीं। “चल, नन्हे, जा अब।”"},{"en":"He lowered the bucket gently into the sea. The little sea serpent floated out of the bucket and began to sink.","hi":"उसने बाल्टी को धीरे से समुद्र में उतारा। नन्हा समुद्री साँप बाल्टी से बाहर तैर गया और डूबने लगा।"},{"en":"Then, feeling the cool salt water, it raised its head and began swimming strongly away from the boat. All at once, not far away, there was a {{mighty|ज़बरदस्त}} splash — a huge neck, thick as a telegraph pole, rose out of the sea and two big brown eyes looked down on Captain Melvin.","hi":"फिर ठंडे खारे पानी का एहसास होते ही उसने सिर उठाया और ज़ोर से तैरते हुए नाव से दूर चला गया। तभी अचानक, कुछ दूरी पर एक ज़बरदस्त छपाक हुई: टेलीग्राफ़ के खंभे जितनी मोटी एक विशाल गर्दन समुद्र से ऊपर उठी और दो बड़ी भूरी आँखें कैप्टन मेल्विन को नीचे से देखने लगीं।"}],[{"en":"Then together, the big sea serpent and the littlest sea serpent of all swam off towards the red morning sun.","hi":"फिर साथ-साथ, बड़ा समुद्री साँप और सबसे नन्हा समुद्री साँप, दोनों लाल सुबह के सूरज की ओर तैरते चले गए।"}]],"vocab":[["anchor","noun","लंगर","mooring, hook","—","a heavy object that keeps a boat fixed in one place"],["disgust","noun","खीझ, घिन","revulsion, annoyance","delight","strong dislike or annoyance"],["squawk","verb","कर्कश चीख़ना","screech, shriek","whisper","to make a loud harsh cry like a bird"],["mutter","verb","बुदबुदाना","murmur, mumble","shout","to speak in a low voice that is hard to hear"],["poke","verb","उँगली या नोक से कोंचना; बाहर निकलना","prod, jab","withdraw","to push something out or into with a pointed thing"],["trail off","phrasal verb","बोलते-बोलते धीमे पड़ जाना","fade, dwindle","continue","to gradually become quieter and stop"],["peer","verb","ग़ौर से झाँकना","gaze, squint","glance","to look closely or with difficulty"],["mast","noun","मस्तूल","pole, spar","—","a tall pole on a ship that holds the sails"],["pounce","verb","झपट पड़ना","swoop, spring","retreat","to jump on something suddenly to catch it"],["deck","noun","जहाज़ का फ़र्श, डेक","floor, platform","—","the flat floor of a ship"],["eel","noun","ईल (साँप-जैसी लंबी मछली)","—","—","a long thin snake-like fish"],["paddle","noun","चप्पू; चप्पू-जैसा पंख","oar, flipper","—","a flat tool or limb used to push through water"],["prize","noun","क़ीमती चीज़, इनाम","reward, trophy","penalty","something valuable that is won or caught"],["squash","verb","ठूँसना, दबाना","crush, cram","expand","to press something flat or into a small space"],["drowsy","adj","उनींदा","sleepy, dozy","alert","feeling sleepy and almost asleep"],["lurch","verb","झटके से हिलना","stagger, jolt","glide","to move suddenly and unsteadily"],["bunk","noun","जहाज़ या रेल का बिस्तर","berth, cot","—","a narrow bed fixed to a wall, as on a ship"],["bleary","adj","नींद से धुँधली (आँखें)","blurred, hazy","clear","dim or unclear, especially from tiredness"],["droop","verb","झुक जाना","sag, wilt","rise","to bend or hang down weakly"],["mighty","adj","ज़बरदस्त, विशाल","powerful, huge","weak","very strong or very large"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["give up","हार मान लेना","He gave up after ten failed attempts.","to stop trying"],["push off","दफ़ा हो जाना (बोलचाल)","“Push off!” he shouted at the noisy crowd.","to go away (informal)"],["all at once","अचानक, एकदम से","All at once, the lights went out.","suddenly"]],"fq":[]},{"id":"ev-ed149","title":"Fina's Story","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"My name is Fina. I was born by the sea.","hi":"मेरा नाम फ़ीना है। मैं समुद्र के पास पैदा हुई थी।"},{"en":"I love the sea. I live with my parents and a few relatives.","hi":"मुझे समुद्र बहुत पसंद है। मैं अपने माता-पिता और कुछ रिश्तेदारों के साथ रहती हूँ।"},{"en":"One day, I noticed a large house by the {{seashore|समुद्र तट}}. “What is that, Ma?”","hi":"एक दिन मैंने समुद्र तट के पास एक बड़ा घर देखा। “माँ, वह क्या है?”"}],[{"en":"I asked in wonder. “It’s called a {{resort|रिज़ॉर्ट (सैरगाह)}}, Fina.","hi":"मैंने हैरानी से पूछा। “उसे रिज़ॉर्ट कहते हैं, फ़ीना।"},{"en":"It’s a place where the people who come to visit the beach can stay.” Many people came to stay at the resort.","hi":"यह ऐसी जगह है जहाँ समुद्र तट देखने आने वाले लोग ठहर सकते हैं।” रिज़ॉर्ट में बहुत से लोग ठहरने आए।"},{"en":"Their children played with a variety of toys. I was often {{tempted|ललचाई}} to play with them but my mother never let me play with strangers.","hi":"उनके बच्चे तरह-तरह के खिलौनों से खेलते थे। मेरा अक्सर उनके साथ खेलने का मन ललचाता था, पर माँ मुझे अजनबियों के साथ कभी खेलने नहीं देती थीं।"}],[{"en":"So I used to watch them from my hiding place. They would leave all kinds of things — plastic packets, umbrellas, bottles, and sometimes even toys on the beach.","hi":"इसलिए मैं अपनी छिपने की जगह से उन्हें देखा करती थी। वे समुद्र तट पर हर तरह की चीज़ें छोड़ जाते थे: प्लास्टिक के पैकेट, छतरियाँ, बोतलें और कभी-कभी खिलौने भी।"},{"en":"The elders would get very angry and sigh with {{annoyance|झुँझलाहट}}, “What a {{nuisance|परेशानी की चीज़}}!” Once, when there was no one on the beach, I found a bright, shiny toy and picked it up.","hi":"बड़े लोग बहुत नाराज़ हो जाते और झुँझलाहट में आह भरकर कहते, “कितनी परेशानी है!” एक बार जब समुद्र तट पर कोई नहीं था, मुझे एक चमकदार, चमचमाता खिलौना मिला और मैंने उसे उठा लिया।"},{"en":"“Fina! Why are you touching those things?” my mother asked, {{scolding|डाँटते हुए}} me {{anxiously|चिंता से}}.","hi":"“फ़ीना! तुम उन चीज़ों को क्यों छू रही हो?” माँ ने चिंता से मुझे डाँटते हुए पूछा।"}],[{"en":"“What if it carries some disease or poison?” I was very {{ashamed|शर्मिंदा}} of myself.","hi":"“अगर उसमें कोई बीमारी या ज़हर हुआ तो?” मुझे अपने आप पर बहुत शर्म आई।"},{"en":"I had not thought about falling ill because of the toy. To my surprise, after scolding me, my mother let me keep the toy.","hi":"मैंने खिलौने की वजह से बीमार पड़ने के बारे में सोचा ही नहीं था। मेरी हैरानी की बात यह रही कि डाँटने के बाद माँ ने मुझे खिलौना रखने दिया।"},{"en":"I really enjoyed playing with it. A few days later, I noticed that mother looked unwell.","hi":"मुझे उससे खेलने में सचमुच बहुत मज़ा आया। कुछ दिन बाद मैंने देखा कि माँ बीमार-सी लग रही हैं।"}],[{"en":"“Ma, what’s wrong?” I asked her.","hi":"“माँ, क्या हुआ?” मैंने उनसे पूछा।"},{"en":"Mother answered with a lot of difficulty, “I don’t feel very well, Fina.” My father and the other relatives were away.","hi":"माँ ने बड़ी मुश्किल से जवाब दिया, “फ़ीना, मेरी तबीयत ठीक नहीं है।” मेरे पिता और बाक़ी रिश्तेदार बाहर गए हुए थे।"},{"en":"My mother soon began to {{writhe|तड़पना}} in pain. I felt {{helpless|लाचार}}.","hi":"माँ जल्दी ही दर्द से तड़पने लगीं। मुझे लाचारी महसूस हुई।"}],[{"en":"There were a boy and a girl playing on the beach. I decided to {{approach|पास जाना}} them.","hi":"समुद्र तट पर एक लड़का और एक लड़की खेल रहे थे। मैंने उनके पास जाने का फ़ैसला किया।"},{"en":"“Don’t be afraid, Ma. I’m going to get help for you!”","hi":"“डरो मत, माँ। मैं तुम्हारे लिए मदद लेकर आती हूँ!”"},{"en":"I said and made my way to the beach. I heard my mother call out in her pain,“Fina, don’t!”","hi":"यह कहकर मैं समुद्र तट की ओर चल पड़ी। मैंने माँ को दर्द में पुकारते सुना, “फ़ीना, मत जा!”"}],[{"en":"As I approached the couple of kids, I realized that my mother had followed me. The girl saw me first.","hi":"जब मैं उन दोनों बच्चों के पास पहुँची, तो मैंने देखा कि माँ मेरे पीछे-पीछे आ गई थीं। लड़की ने मुझे सबसे पहले देखा।"},{"en":"She {{tugged|खींचा}} at the boy’s hand and said,“ Hey Prince, look!” The smiles on their faces {{reassured|तसल्ली दी}} me a little.","hi":"उसने लड़के का हाथ खींचकर कहा, “अरे प्रिंस, देखो!” उनके चेहरों की मुस्कान ने मुझे थोड़ी तसल्ली दी।"},{"en":"I {{summoned up|जुटाई}} some courage and said, “Will you help me? There’s no one at home and my mother is very sick.”","hi":"मैंने थोड़ी हिम्मत जुटाई और कहा, “क्या आप मेरी मदद करेंगे? घर पर कोई नहीं है और मेरी माँ बहुत बीमार हैं।”"}],[{"en":"One look at my mother and they understood that she was unwell. “My name is Pinki,” said the girl to me, “and this is my brother Prince.","hi":"माँ को एक नज़र देखते ही वे समझ गए कि वे बीमार हैं। “मेरा नाम पिंकी है,” लड़की ने मुझसे कहा, “और यह मेरा भाई प्रिंस है।"},{"en":"Why don’t you wait here with your mother while we get help?” They ran as fast as they could and soon returned with a couple of people.","hi":"तुम अपनी माँ के साथ यहीं रुको, हम मदद लेकर आते हैं।” वे जितनी तेज़ दौड़ सकते थे दौड़े और जल्दी ही कुछ लोगों के साथ लौट आए।"},{"en":"The men put my mother on a {{stretcher|स्ट्रेचर}} and took her away. My eyes filled with tears as I stood there watching.","hi":"आदमियों ने माँ को स्ट्रेचर पर लिटाया और ले गए। मैं वहाँ खड़ी देखती रही और मेरी आँखें आँसुओं से भर गईं।"}],[{"en":"Pinki and Prince came to me and said, “Don’t worry, our father is a doctor. Your mother will be fine soon!”","hi":"पिंकी और प्रिंस मेरे पास आए और बोले, “चिंता मत करो, हमारे पिताजी डॉक्टर हैं। तुम्हारी माँ जल्दी ठीक हो जाएँगी!”"},{"en":"Their {{innocent|मासूम}} faces and {{soothing|सुकून देने वाली}} smiles reduced my fears {{considerably|काफ़ी हद तक}}. I looked at them and returned their smile.","hi":"उनके मासूम चेहरों और सुकून देने वाली मुस्कानों ने मेरा डर काफ़ी हद तक कम कर दिया। मैंने उन्हें देखा और उनकी मुस्कान लौटाई।"},{"en":"Reassured by the fact that my mother would recover, I joined them in their play. It was a lot of fun.","hi":"यह भरोसा पाकर कि माँ ठीक हो जाएँगी, मैं उनके साथ उनके खेल में शामिल हो गई। बहुत मज़ा आया।"}],[{"en":"My father and other relatives were not at all happy when they returned. They were angry with me.","hi":"जब मेरे पिता और बाक़ी रिश्तेदार लौटे तो वे बिलकुल ख़ुश नहीं थे। वे मुझसे नाराज़ थे।"},{"en":"But my old and wise grandpa shook his head and said, “You cannot {{blame|दोष देना}} her! She is only a child and she did what she thought was best!","hi":"पर मेरे बूढ़े और समझदार दादाजी ने सिर हिलाकर कहा, “तुम इसे दोष नहीं दे सकते! यह सिर्फ़ एक बच्ची है और उसने वही किया जो उसे सबसे अच्छा लगा!"},{"en":"Let us wait and see how things go.” It took almost an entire month for my mother to get better.","hi":"आओ, इंतज़ार करें और देखें क्या होता है।” माँ को ठीक होने में लगभग पूरा एक महीना लगा।"}],[{"en":"Pinki and Prince kept me informed of her condition regularly. Even their parents would come to talk to me and reassure me.","hi":"पिंकी और प्रिंस मुझे उनकी हालत की ख़बर नियमित रूप से देते रहे। उनके माता-पिता भी मुझसे बात करने और मुझे तसल्ली देने आते थे।"},{"en":"Children were not allowed in the hospital so I couldn't visit my mother, and the others didn't trust the resort people so they refused to go. The day my mother returned was a happy day for me!","hi":"अस्पताल में बच्चों को जाने की इजाज़त नहीं थी, इसलिए मैं माँ से मिलने नहीं जा सकी, और बाक़ी लोग रिज़ॉर्ट वालों पर भरोसा नहीं करते थे, इसलिए उन्होंने जाने से मना कर दिया। जिस दिन माँ लौटीं, वह मेरे लिए ख़ुशी का दिन था!"},{"en":"She hugged me and said, “Thank you, Fina, for being so brave when I was sick. Otherwise, I don't think I would have {{survived|बच पाती}}.","hi":"उन्होंने मुझे गले लगाकर कहा, “शुक्रिया फ़ीना, मेरे बीमार होने पर इतनी बहादुरी दिखाने के लिए। वरना मुझे नहीं लगता कि मैं बच पाती।"}],[{"en":"Our methods of treatment are by no means as advanced as theirs! But then, they were the reason why I fell ill in the first place!”","hi":"हमारे इलाज के तरीक़े उनके तरीक़ों जितने उन्नत बिलकुल नहीं हैं! पर फिर भी, मेरे बीमार पड़ने की शुरुआती वजह वही तो थे!”"},{"en":"Actually, my mother had fallen ill because she had eaten a plastic bottle thinking it was a fish! Plastic bottles often look like fish to us.","hi":"असल में माँ इसलिए बीमार पड़ी थीं क्योंकि उन्होंने प्लास्टिक की बोतल को मछली समझकर खा लिया था! प्लास्टिक की बोतलें हमें अक्सर मछली जैसी दिखती हैं।"},{"en":"We eat fish all the time. We eat them raw.","hi":"हम हर समय मछली खाते हैं। हम उन्हें कच्चा खाते हैं।"}],[{"en":"Uh oh! I forgot to mention that we are not people like you.","hi":"ओह! मैं बताना भूल गई कि हम तुम्हारी तरह इंसान नहीं हैं।"},{"en":"We are creatures of the sea. In your world, we are known as dolphins.","hi":"हम समुद्र के जीव हैं। तुम्हारी दुनिया में हमें डॉल्फ़िन कहा जाता है।"}]],"vocab":[["seashore","noun","समुद्र तट","coast, beach","inland","the land along the edge of the sea"],["resort","noun","रिज़ॉर्ट, सैरगाह","retreat, holiday spot","—","a place where people go for a holiday"],["tempt","verb","ललचाना","entice, lure","repel","to make someone want to do something"],["nuisance","noun","परेशानी की चीज़","pest, bother","blessing","a person or thing that causes trouble"],["annoyance","noun","झुँझलाहट","irritation, anger","pleasure","the feeling of being slightly angry"],["scold","verb","डाँटना","rebuke, reprimand","praise","to speak angrily to someone for doing wrong"],["anxiously","adv","चिंता के साथ","nervously, worriedly","calmly","in a worried or nervous way"],["ashamed","adj","शर्मिंदा","embarrassed, guilty","proud","feeling guilty or embarrassed about something"],["writhe","verb","दर्द से तड़पना","squirm, twist","relax","to twist the body because of pain"],["helpless","adj","लाचार","powerless, weak","capable","unable to help oneself or others"],["approach","verb","पास जाना","come near, near","retreat","to come closer to someone or something"],["tug","verb","झटके से खींचना","pull, yank","push","to pull something quickly or hard"],["reassure","verb","तसल्ली देना","comfort, console","alarm","to remove someone’s doubts or fears"],["summon","verb","जुटाना, बुलाना","gather, call up","dismiss","to gather strength or courage"],["stretcher","noun","स्ट्रेचर","—","—","a light bed for carrying a sick or injured person"],["innocent","adj","मासूम","harmless, pure","guilty","free from guilt or bad intention"],["soothing","adj","सुकून देने वाला","calming, comforting","irritating","making someone feel calm and relaxed"],["considerably","adv","काफ़ी हद तक","greatly, significantly","slightly","to a large degree"],["blame","verb","दोष देना","accuse, fault","praise","to say that someone is responsible for something bad"],["survive","verb","बच जाना, जीवित रहना","live on, endure","perish","to continue to live after danger or illness"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["by no means","बिलकुल नहीं","This task is by no means easy.","not at all"],["in the first place","सबसे पहले, शुरुआत में","Why did you go there in the first place?","at the beginning; originally"],["to my surprise","मेरी हैरानी की बात यह रही कि","To my surprise, the stranger spoke my language.","used when something unexpected happens"]],"fq":[]},{"id":"ev-ed167","title":"Guess What?","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"During lunch break in Class V at Silver Valley Girls School, the fifteen girls of the smallest class were laughing and enjoying a new game called Guess What?, invented by the bright and popular Sandhya. The game involved guessing {{quirky|अजीब-सी, सनकी}} facts about classmates, and everyone {{eagerly|उत्साह से}} participated.","hi":"सिल्वर वैली गर्ल्स स्कूल की कक्षा 5 में लंच ब्रेक के दौरान सबसे छोटी कक्षा की पंद्रह लड़कियाँ हँस रही थीं और ‘गेस व्हाट?’ नाम के नए खेल का मज़ा ले रही थीं, जिसे होशियार और लोकप्रिय संध्या ने बनाया था। खेल में सहपाठियों के बारे में अजीब-अजीब बातों का अंदाज़ा लगाना होता था, और सब बड़े उत्साह से हिस्सा ले रही थीं।"},{"en":"When Rita asked, “Guess what Sandhya’s favourite remark is?”, the class {{chorused|एक सुर में बोली}}, “I’m feeling bored!”, revealing a truth everyone knew— Sandhya got bored easily. Despite being intelligent and topping her class, Sandhya was {{restless|बेचैन}}.","hi":"जब रीता ने पूछा, “अंदाज़ा लगाओ, संध्या का पसंदीदा जुमला क्या है?”, तो पूरी कक्षा एक सुर में बोली, “मैं बोर हो रही हूँ!”, और वह सच सामने आ गया जो सब जानती थीं: संध्या जल्दी ऊब जाती थी। बुद्धिमान होने और कक्षा में अव्वल आने के बावजूद संध्या बेचैन रहती थी।"},{"en":"She was a {{tech-savvy|तकनीक की जानकार}} girl who loved {{gadgets|छोटे यंत्र}} and computer games but lost interest as soon as she {{mastered|महारत हासिल की}} them. Her parents, particularly her mother, were worried.","hi":"वह तकनीक की जानकार लड़की थी जिसे गैजेट और कंप्यूटर गेम पसंद थे, पर जैसे ही उनमें महारत हासिल कर लेती, उनमें उसकी दिलचस्पी ख़त्म हो जाती। उसके माता-पिता, ख़ासकर माँ, चिंतित थे।"}],[{"en":"At a parent-teacher meeting, her mother {{lamented|अफ़सोस जताया}} that Sandhya never read books. The teacher agreed and noted that since Sandhya didn’t read, her classmates followed her example.","hi":"अभिभावक-शिक्षक बैठक में उसकी माँ ने अफ़सोस जताया कि संध्या कभी किताबें नहीं पढ़ती। शिक्षिका ने सहमति जताई और कहा कि चूँकि संध्या नहीं पढ़ती, उसकी सहपाठियाँ भी उसकी मिसाल पर चलती हैं।"},{"en":"Her mother tried to use this as a {{motivator|प्रेरक}}, telling Sandhya she was setting a bad example. But Sandhya just {{stormed off|ग़ुस्से में चली गई}} saying, “I’m feeling bored.”","hi":"माँ ने इसे प्रेरणा के तौर पर इस्तेमाल करने की कोशिश की और संध्या से कहा कि वह बुरी मिसाल बन रही है। पर संध्या “मैं बोर हो रही हूँ” कहकर ग़ुस्से में चली गई।"},{"en":"Then one day, Sandhya fell seriously ill with a high fever. After nearly a week of being {{bedridden|बिस्तर पर पड़ी}}, when she finally started {{recovering|ठीक हो रही}}, she again complained of boredom.","hi":"फिर एक दिन संध्या तेज़ बुख़ार से गंभीर रूप से बीमार पड़ गई। लगभग एक हफ़्ते बिस्तर पर पड़े रहने के बाद, जब वह आख़िरकार ठीक होने लगी, तो उसने फिर ऊब की शिकायत की।"}],[{"en":"To keep her {{occupied|व्यस्त}} without tiring her, her mother began reading to her. Initially uninterested, Sandhya gradually got {{engrossed|तल्लीन}} in the story.","hi":"उसे व्यस्त रखने के लिए, पर थकाए बिना, माँ उसे पढ़कर सुनाने लगी। शुरू में रुचि न लेने वाली संध्या धीरे-धीरे कहानी में डूब गई।"},{"en":"When her mother had to step out the next day, she played an audiobook version of Peter Pan for Sandhya. To her surprise, when she returned home, she found the power had gone out and Sandhya was {{frantically|बदहवासी में}} searching through a cupboard full of books for the printed version of Peter Pan.","hi":"अगले दिन जब माँ को बाहर जाना पड़ा, तो उसने संध्या के लिए ‘पीटर पैन’ का ऑडियोबुक वर्शन चला दिया। लौटने पर माँ को हैरानी हुई कि बिजली चली गई थी और संध्या बदहवासी में किताबों से भरी अलमारी में ‘पीटर पैन’ की छपी हुई किताब ढूँढ रही थी।"},{"en":"“I want to know what happens next!” she cried. Her mother handed her the book, and Sandhya began reading—truly reading—for the first time.","hi":"“मुझे जानना है आगे क्या हुआ!” वह चिल्लाई। माँ ने उसे किताब थमा दी, और संध्या ने पहली बार सचमुच पढ़ना शुरू किया।"}],[{"en":"A week later, Sandhya returned to school as a {{transformed|बदली हुई}} person—a book lover. She even influenced her classmates to start reading.","hi":"एक हफ़्ते बाद संध्या स्कूल लौटी तो बदली हुई इंसान थी, किताबों की दीवानी। उसने अपनी सहपाठियों को भी पढ़ने के लिए प्रेरित किया।"},{"en":"One day, when Rita suggested {{reviving|फिर शुरू करना}} the Guess What? game, she asked, “Guess what Sandhya’s favourite hobby is?” The class shouted in {{unison|एक साथ, एक सुर में}}, “Reading!”","hi":"एक दिन रीता ने ‘गेस व्हाट?’ खेल को फिर शुरू करने का सुझाव दिया और पूछा, “अंदाज़ा लगाओ, संध्या का पसंदीदा शौक़ क्या है?” पूरी कक्षा एक साथ चिल्लाई, “पढ़ना!”"},{"en":"Next came, “Guess what Sandhya’s favourite magazine is?” Again, the answer came {{promptly|तुरंत}}: “Dimdima!”","hi":"फिर सवाल आया, “अंदाज़ा लगाओ, संध्या की पसंदीदा पत्रिका कौन-सी है?” इस बार भी जवाब फ़ौरन आया: “दिमदिमा!”"}],[{"en":"Sandhya proudly pulled out the tenth anniversary issue of Dimdima to show her friends, but before she could even finish her sentence, the magazine was {{snatched|छीन ली गई}} from her hands. When the bell rang, all fourteen of her classmates were crowded around, reading it together.","hi":"संध्या गर्व से ‘दिमदिमा’ का दसवीं वर्षगाँठ वाला अंक अपने दोस्तों को दिखाने के लिए निकाल लाई, पर वह अपना वाक्य पूरा कर पाती, उससे पहले ही उसके हाथों से पत्रिका छीन ली गई। घंटी बजने तक उसकी चौदहों सहपाठियाँ उसके आसपास जमा होकर साथ-साथ उसे पढ़ रही थीं।"}]],"vocab":[["quirky","adj","अजीब-सा, सनकी","odd, eccentric","ordinary","unusual in an interesting or funny way"],["eagerly","adv","उत्साह से","keenly, enthusiastically","reluctantly","with great interest and excitement"],["chorus","verb","एक सुर में बोलना","chant, chime","—","to say or sing something together"],["restless","adj","बेचैन","uneasy, fidgety","calm","unable to stay still or relax"],["tech-savvy","adj","तकनीक का जानकार","tech-literate, skilled","—","good at using modern technology"],["gadget","noun","छोटा यंत्र, गैजेट","device, appliance","—","a small useful electronic tool"],["master","verb","महारत हासिल करना","learn, excel at","fail","to learn something so well that it is easy"],["lament","verb","अफ़सोस जताना, विलाप करना","mourn, bemoan","rejoice","to express sorrow or regret about something"],["motivator","noun","प्रेरक, हौसला बढ़ाने वाला","inspiration, incentive","deterrent","something that makes a person want to act"],["storm off","phrasal verb","ग़ुस्से में चले जाना","stomp out, flounce","stay","to leave angrily"],["bedridden","adj","बिस्तर पर पड़ा हुआ","confined, laid up","active","having to stay in bed because of illness"],["recover","verb","ठीक होना","heal, get better","worsen","to become healthy again after illness"],["occupied","adj","व्यस्त","busy, engaged","idle","busy doing something"],["engrossed","adj","तल्लीन","absorbed, immersed","bored","giving all one’s attention to something"],["frantically","adv","बदहवासी में","wildly, desperately","calmly","in a hurried and anxious way"],["transform","verb","पूरी तरह बदल देना","change, convert","preserve","to change completely in form or nature"],["revive","verb","फिर से शुरू करना, जिलाना","restore, renew","abandon","to bring something back into use or life"],["unison","noun","एक सुर, एक साथ","harmony, agreement","discord","doing or saying something together at the same time"],["promptly","adv","तुरंत","quickly, immediately","slowly","without delay"],["snatch","verb","झपटकर छीन लेना","grab, seize","give","to take something suddenly and roughly"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["set an example","मिसाल क़ायम करना","Teachers must set a good example for students.","to behave in a way others can copy"],["step out","थोड़ी देर के लिए बाहर जाना","She stepped out to buy some milk.","to leave a place for a short time"],["top the class","कक्षा में अव्वल आना","He worked hard and topped the class.","to get the highest marks in the class"]],"fq":[]},{"id":"ev-ed181","title":"Little One Inch","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"Once long ago in Japan, there lived a couple who had no children. They prayed to the gods for a child, even one as small as a finger, and finally their prayers were answered.","hi":"बहुत पहले जापान में एक दंपती रहता था जिसकी कोई संतान नहीं थी। उन्होंने देवताओं से एक बच्चे की प्रार्थना की, चाहे वह उँगली जितना ही छोटा क्यों न हो, और आख़िरकार उनकी प्रार्थना सुन ली गई।"},{"en":"The child born to them was so small that they named him Issun Boshi, meaning “Little One Inch.” When Issun Boshi reached the age of 15, he said goodbye to his parents and set out for Kyoto, the capital city, to {{seek|ढूँढना, आज़माना}} his fortune.","hi":"उनके यहाँ जो बच्चा पैदा हुआ वह इतना छोटा था कि उन्होंने उसका नाम इसुन बोशी रखा, जिसका मतलब है “नन्हा एक इंच”। जब इसुन बोशी 15 साल का हुआ, तो उसने माता-पिता को अलविदा कहा और अपना भाग्य आज़माने राजधानी क्योटो की ओर चल पड़ा।"},{"en":"In Kyoto, he found {{employment|काम, रोज़गार}} in a {{wealthy|धनी}} household. He could not do much work because of his size, but his {{diligence|लगन}} and {{sincerity|सच्चाई, निष्ठा}} pleased his master and mistress.","hi":"क्योटो में उसे एक धनी घराने में काम मिल गया। अपने छोटे आकार के कारण वह ज़्यादा काम नहीं कर पाता था, पर उसकी लगन और सच्चाई से उसके मालिक और मालकिन ख़ुश थे।"}],[{"en":"Their daughter found him {{delightful|प्यारा, मनमोहक}}. One day, Issun Boshi {{accompanied|साथ गया}} the girl to the temple.","hi":"उनकी बेटी को वह बहुत प्यारा लगता था। एक दिन इसुन बोशी लड़की के साथ मंदिर गया।"},{"en":"On the way, two giants {{leaped|उछलकर निकले}} out in front of them from behind some bushes. Issun Boshi {{deliberately|जानबूझकर}} drew their attention to him so the girl could escape.","hi":"रास्ते में दो दैत्य झाड़ियों के पीछे से उछलकर उनके सामने आ गए। इसुन बोशी ने जानबूझकर उनका ध्यान अपनी ओर खींचा ताकि लड़की बचकर भाग सके।"},{"en":"The giants became {{furious|क्रोधित}}, and one of them picked him up and {{swallowed|निगल लिया}} him. Issun Boshi had a needle his mother had given him, which he wore around his waist.","hi":"दैत्य क्रोधित हो गए, और उनमें से एक ने उसे उठाकर निगल लिया। इसुन बोशी के पास एक सुई थी जो उसकी माँ ने दी थी और जिसे वह कमर में बाँधे रहता था।"}],[{"en":"Inside the giant's stomach, he took out the needle and began {{stabbing|चुभोना}} the stomach with it. Then, climbing up the {{gullet|गला (अन्न-नली)}}, he entered the giant’s mouth and caused {{chaos|अफ़रा-तफ़री}} with his needle.","hi":"दैत्य के पेट के अंदर उसने सुई निकाली और उससे पेट में चुभोने लगा। फिर गले से ऊपर चढ़कर वह दैत्य के मुँह में पहुँचा और अपनी सुई से अफ़रा-तफ़री मचा दी।"},{"en":"Frightened, the giant spat him out. When the other giant bent down to look at him, Issun Boshi stabbed him in the eye.","hi":"डरे हुए दैत्य ने उसे बाहर थूक दिया। जब दूसरा दैत्य उसे देखने के लिए झुका, तो इसुन बोशी ने उसकी आँख में सुई चुभो दी।"},{"en":"The giants had had enough. They ran away, one holding a hand to his mouth and the other to his eye.","hi":"दैत्यों के लिए बहुत हो गया था। वे भाग खड़े हुए, एक ने हाथ मुँह पर रखा था और दूसरे ने आँख पर।"}],[{"en":"In their {{haste|जल्दबाज़ी}}, they left behind a {{mallet|हथौड़ा}} w
