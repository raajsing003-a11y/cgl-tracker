of future success"],["aroma","noun","सुगंध, ख़ुशबू","fragrance, smell","stench","a pleasant smell"],["nostril","noun","नथुना","—","—","one of the two openings in the nose"],["distract","verb","ध्यान भटकाना","divert, sidetrack","focus","to take attention away from something"],["alight","verb","उतरना, आकर बैठना","land, settle","take off","to come down and rest on something"],["twig","noun","टहनी","small branch, stick","trunk","a small thin branch of a tree"],["feast","verb","दावत उड़ाना","banquet, dine","fast","to eat a large and enjoyable meal"],["swoon","verb","बेहोश हो जाना","faint, pass out","revive","to faint because of strong emotion"],["dung","noun","गोबर","manure, droppings","—","waste matter from large animals"],["deftly","adv","चतुराई से, कुशलता से","skilfully, nimbly","clumsily","in a quick and skilful way"],["eagerly","adv","उत्सुकता से","keenly, enthusiastically","reluctantly","with strong interest and excitement"],["reel","verb","लड़खड़ाकर पीछे हटना","stagger, stumble","steady","to move back unsteadily after a shock"],["flung","verb","ज़ोर से फेंका (fling का भूतकाल)","hurled, tossed","caught","past form of fling: to throw with force"],["scorching","adj","झुलसाने वाला","burning, blazing","freezing","extremely hot"],["gaze","noun","टकटकी, नज़र","stare, look","glance","a long steady look"],["sapphire","noun","नीलम","blue gem","—","a bright blue precious stone"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["fall in love","प्यार हो जाना","They fell in love at first sight.","to start loving someone"],["slip away","चुपके से निकल जाना","She slipped away from the party early.","to leave quietly without being noticed"],["ever since","तब से लेकर अब तक","I have felt happier ever since.","from that time until now"]],"fq":[]},{"id":"ev-ed231","title":"A Single Drop","src":"Evergreen library · Topic: Health & Environment","c":"Health & Environment","todo":"","ed":[[{"en":"A young boy was sent by his family to study the way of the Zen in a {{monastery|मठ}}. It was run by a {{renowned|प्रसिद्ध}} Zen master, Gisan.","hi":"एक युवा लड़के को उसके परिवार ने एक मठ में ज़ेन की राह सीखने भेजा। उसे एक प्रसिद्ध ज़ेन गुरु, गिसान, चलाते थे।"},{"en":"Much of the boy's days were spent in prayers and learning the {{sutras|सूत्र}}. Other times, he was on the rice fields or doing {{chores|छोटे-मोटे काम}} around the temple.","hi":"लड़के के ज़्यादातर दिन प्रार्थनाओं और सूत्र सीखने में बीतते थे। बाकी समय वह धान के खेतों में या मंदिर के आसपास छोटे-मोटे काम करता था।"},{"en":"One day, Gisan asked the boy to {{heat|गर्म करना}} water for his bath. The boy did not realize it, but the water began {{boiling|उबलना}} and It became too hot to be handled.","hi":"एक दिन गिसान ने लड़के से अपने स्नान के लिए पानी गर्म करने को कहा। लड़के को पता ही नहीं चला और पानी उबलने लगा तथा इतना गर्म हो गया कि छुआ नहीं जा सकता था।"}],[{"en":"Gisan {{instructed|निर्देश दिया}} him to {{fetch|लाना}} cold water from the well behind the monastery to cool the water. The boy {{lugged|ढोकर लाया}} two buckets of water and began pouring it into the bath.","hi":"गिसान ने उसे निर्देश दिया कि पानी ठंडा करने के लिए मठ के पीछे के कुएँ से ठंडा पानी लाए। लड़का दो बाल्टियाँ ढोकर लाया और उन्हें स्नान के पानी में डालने लगा।"},{"en":"One bucketful was not enough. As he poured the second one, Gisan {{dipped|डुबोई}} his finger in the bath to check its temperature.","hi":"एक बाल्टी काफ़ी नहीं थी। जब वह दूसरी डाल रहा था, गिसान ने तापमान जाँचने के लिए अपनी उँगली पानी में डुबोई।"},{"en":"When he felt it was just right, Gisan asked the boy to stop. There was still some water left in the bucket.","hi":"जब उन्हें लगा कि पानी ठीक है, तो उन्होंने लड़के को रुकने को कहा। बाल्टी में अब भी कुछ पानी बचा था।"}],[{"en":"Without a second thought, the boy threw out the {{remaining|बचा हुआ}} water on the ground. \"What have you done, you fool? {{snapped|डाँटा}} Gisan.","hi":"बिना सोचे-समझे लड़के ने बचा हुआ पानी ज़मीन पर फेंक दिया। \"यह तुमने क्या किया, मूर्ख?\" गिसान ने डाँटा।"},{"en":"\"Could you not have poured the water on that tree or on the flower bed? You should not have {{wasted|बर्बाद किया}} that water.\"","hi":"\"क्या तुम यह पानी उस पेड़ पर या फूलों की क्यारी में नहीं डाल सकते थे? तुम्हें यह पानी बर्बाद नहीं करना चाहिए था।\""},{"en":"The boy's eyes {{brimmed|भर आईं}} with tears as the {{venerable|आदरणीय}} teacher continued, \"Child, there is no rain at this time of the year and water is not easy to come by. Even a single drop of water is {{precious|कीमती}}.\"","hi":"लड़के की आँखें आँसुओं से भर आईं जब आदरणीय गुरु ने आगे कहा, \"बच्चे, साल के इस समय बारिश नहीं होती और पानी आसानी से नहीं मिलता। पानी की एक बूँद भी कीमती है।\""}],[{"en":"At that moment, the boy gained a new understanding of Zen. He {{adopted|अपनाया}} the name Tekisui, which means 'a single drop of water' and grew up to become a famous Zen teacher himself.","hi":"उसी क्षण लड़के को ज़ेन की नई समझ मिली। उसने तेकिसुई नाम अपनाया, जिसका अर्थ है 'पानी की एक बूँद', और आगे चलकर वह स्वयं एक प्रसिद्ध ज़ेन गुरु बना।"}]],"vocab":[["renowned","adjective","प्रसिद्ध","famous, celebrated","unknown","known and admired by many people"],["monastery","noun","मठ","abbey, convent","—","a place where monks live and pray"],["sutra","noun","सूत्र","scripture, aphorism","—","a religious teaching text in Buddhism or Hinduism"],["chore","noun","छोटा घरेलू काम","task, duty","leisure","a routine task, especially a household one"],["boil","verb","उबलना","bubble, seethe","freeze","to heat until bubbles rise and steam forms"],["instruct","verb","निर्देश देना","direct, order","obey","to tell someone what to do"],["fetch","verb","लाना","bring, get","take away","to go and bring back something"],["lug","verb","भारी बोझ ढोना","haul, carry","—","to carry something heavy with effort"],["dip","verb","डुबोना","immerse, plunge","lift","to put something briefly into a liquid"],["snap","verb","डाँटना","bark, scold","praise","to speak sharply and angrily"],["venerable","adjective","आदरणीय","respected, revered","disreputable","deserving respect because of age or wisdom"],["brim","verb","लबालब भर जाना","overflow, fill up","empty","to be full to the edge"],["precious","adjective","कीमती","valuable, priceless","worthless","of great value and not to be wasted"],["adopt","verb","अपनाना","take up, embrace","reject","to start to use or take on"],["remaining","adjective","बचा हुआ","leftover, residual","used","still left after the rest has gone"],["waste","verb","बर्बाद करना","squander, misuse","save","to use carelessly or without benefit"],["realise","verb","एहसास होना","understand, notice","overlook","to become aware of something"],["temperature","noun","तापमान","warmth, heat level","—","how hot or cold something is"],["gain","verb","प्राप्त करना","acquire, earn","lose","to obtain or win something"],["scarce","adjective","दुर्लभ","rare, limited","plentiful","not enough in quantity"],["heat","verb","गर्म करना","warm, boil","cool","to make something hot"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["without a second thought","बिना सोचे-समझे","He jumped in without a second thought.","immediately, without hesitation"],["come by","प्राप्त करना","Good jobs are hard to come by.","to obtain or get something"],["at this time of the year","साल के इस समय","It is very cold at this time of the year.","during this season"]],"fq":[]},{"id":"ev-ed232","title":"A Tale of Two Rivers","src":"Evergreen library · Topic: Health & Environment","c":"Health & Environment","todo":"","ed":[[{"en":"LONG long ago, Teesta was a river {{goddess|देवी}} and Rangeet, a river god. They were good friends and {{dwelled|रहते थे}} in the {{lap|गोद}} of the {{mighty|विशाल}} Himalayas.","hi":"बहुत-बहुत पहले की बात है, तीस्ता एक नदी देवी थी और रंगीत एक नदी देवता। वे अच्छे मित्र थे और विशाल हिमालय की गोद में रहते थे।"},{"en":"One day, the two rivers decided to race each other down the mountain to see who would reach the {{plains|मैदान}} first. Teesta asked the snake king to guide her.","hi":"एक दिन दोनों नदियों ने तय किया कि वे पहाड़ से नीचे दौड़ लगाएँगी, यह देखने के लिए कि मैदानों में पहले कौन पहुँचता है। तीस्ता ने साँपों के राजा से अपना मार्गदर्शक बनने को कहा।"},{"en":"Rangeet chose the bird king to be his guide. The race began and the rivers flowed down through {{breathtaking|मनमोहक}} forests and {{valleys|घाटियाँ}}.","hi":"रंगीत ने पक्षियों के राजा को अपना मार्गदर्शक चुना। दौड़ शुरू हुई और नदियाँ मनमोहक जंगलों और घाटियों से होकर नीचे बहीं।"}],[{"en":"The snake king {{glided|फिसलता चला}} easily on the ground and followed a straight path. As a result, Teesta's {{course|धारा}} was straight.","hi":"साँपों का राजा ज़मीन पर आसानी से फिसलता चलता था और सीधे रास्ते पर चला। इसलिए तीस्ता की धारा सीधी रही।"},{"en":"The bird king, however, would stop every now and then to snack on a tasty worm or insect. Rangeet would also have to stop and {{urge|आग्रह करना}} the bird king to move ahead and not waste time.","hi":"लेकिन पक्षियों का राजा बार-बार रुककर कोई स्वादिष्ट कीड़ा या कीट खा लेता था। रंगीत को भी रुकना पड़ता और पक्षी राजा से आगे बढ़ने और समय बर्बाद न करने का आग्रह करना पड़ता।"},{"en":"As a result, Rangeet's course was not as straight as Tista’s. Teesta reached the plains first.","hi":"इसलिए रंगीत की धारा तीस्ता जितनी सीधी नहीं थी। तीस्ता मैदानों में पहले पहुँच गई।"}],[{"en":"When Rangeet saw this, he was very angry. He was unhappy about losing the race, and in a fit of {{rage|आवेश}}, he started flowing all over the place, {{destroying|तबाह करते हुए}} anything that came in his path.","hi":"जब रंगीत ने यह देखा तो वह बहुत क्रोधित हुआ। दौड़ हारने से वह नाख़ुश था और ग़ुस्से के आवेश में वह इधर-उधर बहने लगा, अपने रास्ते में आने वाली हर चीज़ को तबाह करते हुए।"},{"en":"Teesta watched him, {{frightened|डरी हुई}}. She called out to her dear friend to {{calm|शांत}} down and stop the {{destruction|विनाश}}.","hi":"तीस्ता उसे डरी हुई नज़रों से देखती रही। उसने अपने प्रिय मित्र को पुकारकर शांत होने और विनाश रोकने को कहा।"},{"en":"Rangeet heard her sweet voice {{pleading|विनती करती}} with him, and after calming down, he went to meet her. The Lepchas of Sikkim {{consider|मानना}} the place where the two gods met as {{holy|पवित्र}}.","hi":"रंगीत ने उसकी विनती करती मीठी आवाज़ सुनी और शांत होकर उससे मिलने गया। सिक्किम के लेप्चा लोग उस जगह को पवित्र मानते हैं जहाँ दोनों देवता मिले थे।"}],[{"en":"Every year, they gather at the {{confluence|संगम}} of the Teesta and Rangeet rivers to celebrate the {{feast|उत्सव}} of the river god and goddess.","hi":"हर साल वे तीस्ता और रंगीत नदियों के संगम पर इकट्ठा होकर नदी देवता और देवी का उत्सव मनाते हैं।"}]],"vocab":[["goddess","noun","देवी","deity","god","a female god"],["dwell","verb","रहना, निवास करना","live, reside","leave","to live in a place"],["lap","noun","गोद","—","—","the area from waist to knees when sitting; here, a sheltered place"],["mighty","adj","विशाल, शक्तिशाली","powerful, great","weak","very strong or large"],["plain","noun","मैदान","flatland, prairie","mountain","a large area of flat land"],["breathtaking","adj","मनमोहक, लाजवाब","stunning, awe-inspiring","ordinary","very beautiful or surprising"],["valley","noun","घाटी","vale, dale","peak","low land between hills or mountains"],["glide","verb","फिसलते हुए चलना","slide, slip","stumble","to move smoothly and easily"],["course","noun","धारा, मार्ग","path, route","—","the path along which something moves"],["urge","verb","आग्रह करना","press, encourage","discourage","to strongly advise someone to do something"],["rage","noun","क्रोध, आवेश","fury, anger","calm","very strong anger"],["destroy","verb","तबाह करना","ruin, wreck","build","to damage something so badly that it no longer exists"],["frightened","adj","डरा हुआ","scared, afraid","brave","feeling fear"],["plead","verb","विनती करना","beg, implore","refuse","to ask for something in an emotional way"],["calm","adj","शांत","peaceful, quiet","agitated","free from anger or excitement"],["consider","verb","मानना, समझना","regard, think","ignore","to think of someone or something in a particular way"],["holy","adj","पवित्र","sacred, divine","unholy","connected with God or religion"],["confluence","noun","संगम","junction, meeting point","separation","the place where two rivers join"],["feast","noun","उत्सव, दावत","banquet, celebration","fast","a special meal or festival"],["destruction","noun","विनाश, तबाही","ruin, devastation","creation","the act of destroying something"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["every now and then","कभी-कभार","We visit the village every now and then.","occasionally, not regularly"],["in a fit of rage","क्रोध के आवेश में","In a fit of rage, he tore up the letter.","because of sudden, strong anger"],["as a result","परिणामस्वरूप","He missed the bus; as a result, he was late.","because of something that happened before"]],"fq":[]},{"id":"ev-ed260","title":"Cheating does not pay","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"A Hungry {{stag|हिरन}} saw a {{ram|मेढ़ा}} {{guarding|रखवाली}} a basket of {{wheat|गेहूँ}}. He wanted to eat some wheat and so he went to the ram and said, “I see you have wheat inside that basket.","hi":"एक भूखे हिरन ने एक मेढ़े को गेहूँ की टोकरी की रखवाली करते देखा। वह थोड़ा गेहूँ खाना चाहता था, इसलिए मेढ़े के पास जाकर बोला, “मैं देख रहा हूँ कि तुम्हारी टोकरी में गेहूँ है।"},{"en":"I’m {{terribly|बेहद}} hungry. Will you give it to me?”","hi":"मुझे बहुत भूख लगी है। क्या तुम मुझे थोड़ा दोगे?”"},{"en":"“Sorry, I cannot,” replied the ram. “The wheat {{belongs|का है}} to my master.”","hi":"“माफ़ करना, मैं नहीं दे सकता,” मेढ़े ने जवाब दिया। “गेहूँ मेरे मालिक का है।”"}],[{"en":"“Look, friend,” said the stag. “I’m only asking you to {{lend|उधार देना}} it to me.","hi":"“देखो दोस्त,” हिरन ने कहा। “मैं तो बस उधार माँग रहा हूँ।"},{"en":"I’ll return it to you as soon as I can.” The ram felt sorry for the stag.","hi":"मैं जल्द से जल्द लौटा दूँगा।” मेढ़े को हिरन पर तरस आ गया।"},{"en":"“All right,” he said to the stag. “But how do I know you will return it to me?”","hi":"“ठीक है,” उसने हिरन से कहा। “पर मुझे कैसे पता चलेगा कि तुम इसे मुझे लौटाओगे?”"}],[{"en":"“You can {{trust|भरोसा}} me!” said the stag. “I shall give you the wheat {{provided|बशर्ते}} you bring someone to stand {{surety|ज़मानत}} for you,” said the ram finally.","hi":"“तुम मुझ पर भरोसा कर सकते हो!” हिरन ने कहा। “मैं तुम्हें गेहूँ दूँगा, बशर्ते तुम अपनी ज़मानत देने वाला कोई ले आओ,” मेढ़े ने आख़िर में कहा।"},{"en":"The stag {{agreed|सहमत हुआ}}. He hadn’t gone far before he met a {{wolf|भेड़िया}}.","hi":"हिरन मान गया। वह ज़्यादा दूर नहीं गया था कि उसे एक भेड़िया मिला।"},{"en":"“I’m hungry and the ram has some wheat. He will lend me the wheat only if I find someone to stand as surety, until I return it to him,” said the stag.","hi":"“मैं भूखा हूँ और मेढ़े के पास गेहूँ है। वह मुझे गेहूँ तभी उधार देगा जब मैं लौटाने तक कोई ज़मानती ढूँढ लूँ,” हिरन ने कहा।"}],[{"en":"“Will you, friend wolf?” “Me, as surety?","hi":"“क्या तुम बनोगे, दोस्त भेड़िये?” “मैं, ज़मानती?"},{"en":"No way!” said the wolf. “But I have an idea.","hi":"बिल्कुल नहीं!” भेड़िये ने कहा। “पर मेरे पास एक तरकीब है।"},{"en":"I’ll come with you and as soon as the ram gives you the wheat, you and I will run away with it!” The hungry stag agreed.","hi":"मैं तुम्हारे साथ चलूँगा और जैसे ही मेढ़ा तुम्हें गेहूँ दे, हम दोनों उसे लेकर भाग जाएँगे!” भूखा हिरन मान गया।"}],[{"en":"“But what will you give me in return for helping you?” asked the wolf. “I’ll give you half the wheat,” said the stag.","hi":"“पर तुम्हारी मदद करने के बदले में तुम मुझे क्या दोगे?” भेड़िये ने पूछा। “मैं तुम्हें आधा गेहूँ दूँगा,” हिरन ने कहा।"},{"en":"And, together they went to the ram. “Here’s my surety!” said the stag.","hi":"और फिर वे दोनों साथ मेढ़े के पास गए। “यह रहा मेरा ज़मानती!” हिरन ने कहा।"},{"en":"“Now will you give me the wheat?” The ram took one look at the wolf and knew at once that the two animals were up to some {{trick|चाल}}.","hi":"“अब तो तुम मुझे गेहूँ दोगे?” मेढ़े ने भेड़िये पर एक नज़र डाली और तुरंत समझ गया कि दोनों जानवर कोई चाल चल रहे हैं।"}],[{"en":"“Sorry, I’ve changed my mind. I don’t {{intend|इरादा रखना}} to give the wheat to you or to any other {{ungrateful|एहसानफ़रामोश}} {{scoundrel|बदमाश}} for that matter!” said the ram angrily, and before they could move, he {{charged|धावा बोला}} at the wolf.","hi":"“माफ़ करना, मैंने इरादा बदल दिया है। मैं यह गेहूँ न तुम्हें दूँगा, न किसी और एहसानफ़रामोश बदमाश को!” मेढ़े ने ग़ुस्से से कहा, और उनके हिलने से पहले ही उसने भेड़िये पर धावा बोल दिया।"},{"en":"The stag and the wolf were so {{startled|चौंक गए}} by the {{unexpected|अप्रत्याशित}} turn of events that they {{fled|भाग निकले}} the place as fast as they could.","hi":"हिरन और भेड़िया इस अप्रत्याशित मोड़ से इतने घबरा गए कि जितनी तेज़ दौड़ सकते थे, वहाँ से भाग निकले।"}]],"vocab":[["stag","noun","हिरन (नर)","male deer, buck","doe","a fully grown male deer"],["ram","noun","मेढ़ा","male sheep, tup","ewe","a male sheep"],["guard","verb","रखवाली करना","protect, watch","neglect","to watch over something to keep it safe"],["wheat","noun","गेहूँ","grain, cereal","—","a cereal grain used to make flour"],["terribly","adv","बेहद, बहुत ज़्यादा","extremely, awfully","slightly","very much"],["belong","verb","का होना, स्वामित्व में होना","be owned by","—","to be the property of someone"],["lend","verb","उधार देना","loan, advance","borrow","to give something for a short time to be returned"],["provided","conj","बशर्ते कि","if, on condition that","—","only if"],["surety","noun","ज़मानत, ज़मानती","guarantor, security","—","a person who takes responsibility if another fails to keep a promise"],["wolf","noun","भेड़िया","—","—","a wild animal like a large dog that hunts in packs"],["trick","noun","चाल, धोखा","ruse, deception","honesty","a clever act to deceive someone"],["intend","verb","इरादा रखना","plan, mean","—","to have something in your mind as a plan"],["ungrateful","adj","एहसानफ़रामोश","thankless, unappreciative","grateful","not showing thanks for kindness"],["scoundrel","noun","बदमाश, दुष्ट","rascal, rogue","gentleman","a dishonest or wicked person"],["charge","verb","धावा बोलना","attack, rush","retreat","to rush forward to attack"],["startle","verb","चौंका देना","surprise, shock","calm","to surprise suddenly and slightly frighten"],["unexpected","adj","अप्रत्याशित","sudden, surprising","expected","not expected or planned"],["flee","verb","भाग निकलना","escape, run away","stay","to run away from danger"],["trust","verb","भरोसा करना","rely on, believe","doubt","to believe that someone is honest"],["agree","verb","सहमत होना","consent, accept","refuse","to say yes to something"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["stand surety","ज़मानत देना","He stood surety for his friend's loan.","to take responsibility for another person's promise"],["be up to something","कोई चाल चल रहे होना","The kids are very quiet; they must be up to something.","to be secretly doing something wrong"],["change one's mind","इरादा बदल लेना","She changed her mind about going to the party.","to decide differently from before"]],"fq":[]},{"id":"ev-ed283","title":"Greed","src":"Evergreen library · Topic: Science & Tech","c":"Science & Tech","todo":"","ed":[[{"en":"A TURTLE who lived in a lake and a peacock who lived on a tree on the banks of the lake became good friends. One day as the two of them were chatting, a hunter {{crept|चुपके से आया}} up and {{ensnared|फँसा लिया}} the peacock in a net.","hi":"एक झील में रहने वाला कछुआ और झील के किनारे एक पेड़ पर रहने वाला मोर अच्छे दोस्त बन गए। एक दिन जब दोनों बातें कर रहे थे, तभी एक शिकारी चुपके से आया और मोर को जाल में फँसा लिया।"},{"en":"The turtle {{begged|विनती की}} the hunter to {{release|छोड़ना}} his friend. “Why should I release this {{handsome|सुंदर}} bird?” {{retorted|पलटकर कहा}} the hunter.","hi":"कछुए ने शिकारी से अपने दोस्त को छोड़ देने की विनती की। “मैं इस सुंदर पक्षी को क्यों छोड़ूँ?” शिकारी ने पलटकर कहा।"},{"en":"“He’ll {{fetch|दाम दिलाना}} me a good price in the market!” “I’ll give you a {{pearl|मोती}} for his {{freedom|आज़ादी}},” said the turtle.","hi":"“बाज़ार में यह मुझे अच्छे दाम दिलाएगा!” “मैं इसकी आज़ादी के बदले तुम्हें एक मोती दूँगा,” कछुए ने कहा।"}],[{"en":"“Wait here.” He {{dived|गोता लगाया}} into the lake and after some time came back with a pearl that made the hunter’s eyes pop out in {{astonishment|हैरत}}.","hi":"“यहीं रुको।” वह झील में गोता लगा गया और कुछ देर बाद एक मोती लेकर लौटा जिसे देखकर शिकारी की आँखें हैरत से फटी रह गईं।"},{"en":"It was of the {{finest|बेहतरीन}} quality. The hunter at once released the peacock, and went away happily with the pearl.","hi":"वह बेहतरीन क़िस्म का था। शिकारी ने तुरंत मोर को छोड़ दिया और मोती लेकर ख़ुशी-ख़ुशी चला गया।"},{"en":"Two days later he was back. The turtle had just come out of the lake and when he saw the man {{approaching|आता हुआ}}, {{braced|तैयार हो गया}} himself for trouble.","hi":"दो दिन बाद वह फिर आ गया। कछुआ अभी-अभी झील से बाहर आया था और आदमी को आता देख मुसीबत के लिए तैयार हो गया।"}],[{"en":"“The pearl you gave me is no doubt {{valuable|क़ीमती}},” said the hunter, “but its value would become still greater if I had a {{matching|जोड़ का}} one to set in a pair of earrings. Get me another pearl, otherwise…!”","hi":"“तुमने जो मोती दिया, वह बेशक क़ीमती है,” शिकारी ने कहा, “पर अगर मेरे पास इसके जोड़ का एक और होता, जिसे मैं झुमकों की जोड़ी में जड़वाता, तो इसकी क़ीमत और बढ़ जाती। मुझे एक और मोती ला दो, वरना…!”"},{"en":"His voice took on a {{menacing|धमकी भरा}} tone. “All right, all right,” said the turtle.","hi":"उसकी आवाज़ में धमकी भरा लहजा आ गया। “ठीक है, ठीक है,” कछुए ने कहा।"},{"en":"“Give me the pearl I gave you and I’ll try to find another that matches it.” The hunter gave him the pearl, and the turtle got back into the water.","hi":"“जो मोती मैंने तुम्हें दिया था वह मुझे दे दो, मैं उससे मेल खाता दूसरा ढूँढने की कोशिश करूँगा।” शिकारी ने उसे मोती दे दिया और कछुआ पानी में लौट गया।"}],[{"en":"“How long will you take?” asked the hunter. “Perhaps forever,” said the turtle.","hi":"“कितनी देर लगाओगे?” शिकारी ने पूछा। “शायद हमेशा,” कछुए ने कहा।"},{"en":"“You see, my friend and I knew you would return and I {{persuaded|मना लिया}} him to move to another tree deep in the forest. I don’t have to worry about him any more!”","hi":"“देखो, मेरे दोस्त और मुझे पता था कि तुम लौटोगे, और मैंने उसे जंगल में गहरे किसी दूसरे पेड़ पर चले जाने के लिए मना लिया था। अब मुझे उसकी कोई चिंता नहीं!”"},{"en":"And with that, the turtle {{disappeared|ग़ायब हो गया}} into the water, leaving the hunter shocked and {{dismayed|निराश}}.","hi":"और यह कहकर कछुआ पानी में ग़ायब हो गया, शिकारी को स्तब्ध और निराश छोड़कर।"}]],"vocab":[["crept","verb","चुपके से आया (creep का भूतकाल)","sneaked, tiptoed","strode","past form of creep: to move quietly and slowly"],["ensnare","verb","जाल में फँसाना","trap, entrap","free","to catch in a trap or net"],["beg","verb","विनती करना, गिड़गिड़ाना","plead, implore","refuse","to ask earnestly for something"],["release","verb","छोड़ना, रिहा करना","free, let go","capture","to set someone free"],["handsome","adj","सुंदर, रूपवान","good-looking, attractive","ugly","pleasing to look at"],["retort","verb","पलटकर जवाब देना","reply, snap","—","to answer quickly and angrily"],["fetch","verb","(दाम) मिलना; लाना","bring, earn","—","to be sold for a particular price"],["pearl","noun","मोती","gem","—","a round white gem formed inside an oyster"],["freedom","noun","आज़ादी","liberty","captivity","the state of being free"],["dive","verb","गोता लगाना","plunge, jump","surface","to jump head first into water"],["astonishment","noun","हैरत, आश्चर्य","amazement, surprise","indifference","great surprise"],["finest","adj","बेहतरीन","best, highest quality","worst","of the very best quality"],["approach","verb","पास आना","come near, near","retreat","to come closer to someone or something"],["brace","verb","तैयार होना, कमर कसना","prepare, steel","relax","to get ready for something unpleasant"],["valuable","adj","क़ीमती","precious, costly","worthless","worth a lot of money"],["match","verb","जोड़ का होना, मेल खाना","suit, equal","differ","to be the same as or go well with something"],["menacing","adj","धमकी भरा, डरावना","threatening, sinister","friendly","showing a possible danger"],["persuade","verb","मना लेना","convince, coax","dissuade","to make someone agree by giving reasons"],["disappear","verb","ग़ायब हो जाना","vanish, fade","appear","to go out of sight"],["dismayed","adj","निराश, घबराया हुआ","upset, disheartened","pleased","worried and disappointed"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["eyes pop out","आँखें फटी रह जाना","His eyes popped out when he saw the gift.","to look very surprised"],["no doubt","बेशक, निश्चित रूप से","He is no doubt the best player in the team.","certainly"],["at once","तुरंत","Come here at once!","immediately"]],"fq":[]},{"id":"ev-ed285","title":"How Winter Began","src":"Evergreen library · Topic: Global Issues","c":"Global Issues","todo":"","ed":[[{"en":"The world had just begun; it was dark and always summer. Animals lived comfortably – all except Coyote, who being a poor hunter, never had enough food.","hi":"दुनिया अभी-अभी शुरू हुई थी; अँधेरा था और हमेशा गर्मी रहती थी। जानवर आराम से रहते थे, सिवाय कोयोट के, जो ख़राब शिकारी होने के कारण कभी पेट भर खाना नहीं पाता था।"},{"en":"One day, he {{spotted|देखा}} Eagle hunting rabbits {{skillfully|कुशलता से}} and teamed up with him, hoping to catch some {{prey|शिकार}}. However, by day’s end, Eagle had caught several rabbits and Coyote, a few {{measly|तुच्छ}} bugs.","hi":"एक दिन उसने ईगल को ख़रगोशों का कुशलता से शिकार करते देखा और कुछ शिकार पाने की उम्मीद में उसके साथ हो लिया। लेकिन दिन ख़त्म होते-होते ईगल ने कई ख़रगोश पकड़ लिए थे और कोयोट ने बस कुछ तुच्छ कीड़े।"},{"en":"{{Embarrassed|शर्मिंदा}}, Coyote said, “No wonder I can’t catch anything — it’s so dark! Do you know where we can get some light?”","hi":"शर्मिंदा होकर कोयोट बोला, “तभी तो मैं कुछ नहीं पकड़ पाता — इतना अँधेरा जो है! क्या तुम्हें पता है कि हमें रोशनी कहाँ मिल सकती है?”"}],[{"en":"“Come with me,” said Eagle and they made their way to a {{clearing|खुली जगह}} where the Kachinas, a powerful people, were performing a {{ceremonial|रस्मी}} dance. Eagle pointed to them and said, “They have light hidden in two boxes.","hi":"“मेरे साथ आओ,” ईगल ने कहा और वे एक खुली जगह पर पहुँचे जहाँ काचीना, एक शक्तिशाली क़बीला, रस्मी नृत्य कर रहा था। ईगल ने उनकी ओर इशारा करके कहा, “उनके पास दो डिब्बों में रोशनी छिपी है।"},{"en":"The bigger box {{contains|समाया है}} a huge ball of fire called Sun, which they use when they need more light. The smaller box contains a {{pale|पीला}} ball called Moon which gives less light.”","hi":"बड़े डिब्बे में आग का एक विशाल गोला है जिसे सूरज कहते हैं, जिसे वे ज़्यादा रोशनी की ज़रूरत पर इस्तेमाल करते हैं। छोटे डिब्बे में एक पीला गोला है जिसे चाँद कहते हैं, जो कम रोशनी देता है।”"},{"en":"The {{duo|जोड़ी}} waited in the bushes and when the Kachinas had slept, Eagle picked up the larger box and flew off, Coyote following closely on foot. Sometime later, Coyote yelled out, “You will get tired {{ferrying|ढोते-ढोते}} that big box for so long.","hi":"दोनों झाड़ियों में इंतज़ार करते रहे और जब काचीना सो गए, तो ईगल ने बड़ा डिब्बा उठाया और उड़ चला, कोयोट पैदल उसके पीछे-पीछे। कुछ देर बाद कोयोट चिल्लाया, “इतने लंबे समय तक इस बड़े डिब्बे को ढोते-ढोते तुम थक जाओगे।"}],[{"en":"Let me carry it for a while.” Eagle handed him the box saying, “Take good care of it.","hi":"मुझे थोड़ी देर इसे उठाने दो।” ईगल ने उसे डिब्बा थमाते हुए कहा, “इसका अच्छे से ध्यान रखना।"},{"en":"And don’t try anything funny.” The load slowed Coyote down and once out of Eagle’s sight, he decided to take a small {{peek|झाँकना}} into the box.","hi":"और कोई शरारत मत करना।” बोझ से कोयोट की चाल धीमी हो गई और जब ईगल की नज़र से ओझल हुआ, तो उसने डिब्बे में थोड़ा झाँकने का फ़ैसला किया।"},{"en":"So, he opened it, {{unaware|अनजान}} that to make carrying easy, Eagle had put Sun and Moon in the same box. As soon as the {{lid|ढक्कन}} fell open, Sun and Moon escaped into the sky.","hi":"उसने उसे खोल दिया, इस बात से अनजान कि ढोने में आसानी के लिए ईगल ने सूरज और चाँद को एक ही डिब्बे में रख दिया था। ढक्कन खुलते ही सूरज और चाँद आसमान में भाग निकले।"}],[{"en":"Eagle saw what Coyote had done and tried to catch the {{runaway|भागे हुए}} {{orbs|गोले}} but it was too late. Sun moved far away from the Earth while Moon settled itself much closer, changing the warm summer into winter.","hi":"ईगल ने देखा कि कोयोट ने क्या कर दिया है और भागे हुए गोलों को पकड़ने की कोशिश की, पर बहुत देर हो चुकी थी। सूरज पृथ्वी से बहुत दूर चला गया जबकि चाँद उसके बहुत पास आ बसा, और गर्म गर्मी सर्दी में बदल गई।"},{"en":"Plants {{shrivelled|मुरझा गए}} up with cold and it began to snow, causing all animals to take {{shelter|आश्रय}}. “Look what you’ve done, fool!” {{exclaimed|चिल्लाया}} Eagle to the {{shivering|काँपते}} Coyote.","hi":"पौधे ठंड से मुरझा गए और बर्फ़ पड़ने लगी, जिससे सारे जानवरों को आश्रय लेना पड़ा। “देखो तुमने क्या किया, मूर्ख!” ईगल काँपते कोयोट पर चिल्लाया।"},{"en":"“You’ve let Sun and Moon escape and now it has brought the cold upon us.” And since then, winter comes every year.","hi":"“तुमने सूरज और चाँद को भाग जाने दिया और अब यह ठंड हम पर आ पड़ी है।” और तभी से हर साल सर्दी आती है।"}]],"vocab":[["spot","verb","देखना, भाँप लेना","notice, sight","overlook","to see or notice something"],["skillfully","adv","कुशलता से","expertly, adeptly","clumsily","in a way that shows great skill"],["prey","noun","शिकार (जानवर)","quarry, victim","predator","an animal hunted by another for food"],["measly","adj","तुच्छ, बहुत कम","meagre, paltry","plentiful","very small in amount"],["embarrassed","adj","शर्मिंदा","ashamed, awkward","proud","feeling shy or uncomfortable"],["clearing","noun","खुली जगह (जंगल में)","glade, open space","—","an open area in a forest"],["ceremonial","adj","रस्मी, औपचारिक","ritual, formal","casual","connected with a ceremony"],["contain","verb","समाया होना, रखना","hold, include","exclude","to have something inside"],["pale","adj","पीला, फीका","pallid, dim","bright","light in colour or brightness"],["duo","noun","जोड़ी","pair, couple","—","two people or animals together"],["ferry","verb","ढोना, ले जाना","carry, transport","—","to carry people or goods from one place to another"],["peek","noun","झलक, झाँकी","peep, glance","—","a quick look at something, often secretly"],["unaware","adj","अनजान","ignorant, unconscious","aware","not knowing about something"],["lid","noun","ढक्कन","cover, cap","—","a cover for a box or container"],["runaway","adj","भागा हुआ","escaped, fleeing","captured","having escaped from control"],["orb","noun","गोला","sphere, globe","—","a round object, like a ball"],["shrivel","verb","मुरझाना, सिकुड़ना","wither, shrink","swell","to become dry and wrinkled"],["shelter","noun","आश्रय","refuge, cover","exposure","protection from bad weather or danger"],["exclaim","verb","चिल्ला उठना","cry out, shout","whisper","to say something suddenly and loudly"],["shiver","verb","काँपना","shake, tremble","steady","to shake slightly from cold or fear"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["no wonder","कोई आश्चर्य नहीं","No wonder he is tired; he worked all night.","it is not surprising"],["team up","साथ मिलकर काम करना","She teamed up with her friend for the project.","to join someone to work together"],["make one's way","अपना रास्ता तय करना, पहुँचना","They made their way to the station.","to move or travel towards a place"]],"fq":[]},{"id":"ev-ed301","title":"Lessons in Thrift","src":"Evergreen library · Topic: Science & Tech","c":"Science & Tech","todo":"","ed":[[{"en":"A man who {{prided|नाज़ करता था}} himself on his {{thriftiness|किफ़ायत}} was {{dismayed|निराश}} to learn that there was another {{tightwad|कंजूस}} who lived more {{frugally|किफ़ायत से}} than him. “I must take lessons in thrift from this {{genius|महान प्रतिभाशाली}},” he said to his son, “otherwise I’ll continue to {{overspend|ज़्यादा ख़र्च करना}}.","hi":"एक आदमी, जिसे अपनी कंजूसी पर नाज़ था, यह जानकर निराश हुआ कि कोई और कंजूस भी है जो उससे ज़्यादा किफ़ायत से रहता है। “मुझे इस महान व्यक्ति से किफ़ायत के सबक लेने चाहिए,” उसने अपने बेटे से कहा, “वरना मैं ज़्यादा ख़र्च करता रहूँगा।"},{"en":"Go to his house and ask him if he will accept me as his student!” It was {{customary|रिवाज़}} to gift a goose to the guru at the time he was approached.","hi":"उसके घर जाओ और पूछो कि क्या वह मुझे अपना शिष्य बनाएगा!” गुरु के पास जाते समय उसे एक हंस भेंट करना रिवाज़ था।"},{"en":"The would-be {{chela|शिष्य}} drew a fine goose on a piece of paper and gave it to his son. “Give this to him with my regards,” he {{beamed|मुस्कुराकर बोला}}.","hi":"शिष्य बनने के इच्छुक उस आदमी ने काग़ज़ पर एक सुंदर हंस बनाया और बेटे को दे दिया। “यह मेरी शुभकामनाओं के साथ उसे दे देना,” वह मुस्कुराकर बोला।"}],[{"en":"The boy set off, thrilled by his father’s {{ingenuity|चतुराई}}. A true son of his father, the thought of giving away one of their geese had filled him with {{horror|घबराहट}}.","hi":"लड़का अपने पिता की चतुराई से रोमांचित होकर निकल पड़ा। अपने पिता का सच्चा बेटा होने के नाते, अपना एक हंस भी देने के विचार से ही उसे घबराहट हो गई थी।"},{"en":"It took him half a day to arrive at his {{destination|मंज़िल}}. The man he had come to meet was not at home, but his wife was there and she {{assured|भरोसा दिलाया}} him that her husband would accept his father as his student.","hi":"उसे अपनी मंज़िल तक पहुँचने में आधा दिन लग गया। जिस आदमी से मिलना था वह घर पर नहीं था, पर उसकी पत्नी थी और उसने भरोसा दिलाया कि उसका पति उसके पिता को अपना शिष्य बना लेगा।"},{"en":"The boy {{dutifully|आज्ञाकारिता से}} handed over the drawing of the goose to her. She took it and carefully placed it in a drawer.","hi":"लड़के ने आज्ञाकारिता से हंस का चित्र उसे सौंप दिया। उसने उसे लिया और सावधानी से दराज़ में रख दिया।"}],[{"en":"It was customary for the teacher to {{acknowledge|उत्तर देना}} the gift with a lesser gift of his own. “Please take these oranges for your father,” she said, and went through the motions of handing over four oranges to him, picking them up, one by one from the table beside her.","hi":"गुरु के लिए रिवाज़ था कि वह उपहार का जवाब अपने किसी छोटे उपहार से दे। “कृपया ये संतरे अपने पिता के लिए ले जाओ,” उसने कहा, और पास की मेज़ से चार संतरे एक-एक करके उठाकर उसे देने का नाटक किया।"},{"en":"Only there were no oranges there at all. Her husband returned shortly after the boy had left.","hi":"बस वहाँ कोई संतरे थे ही नहीं। लड़के के जाने के थोड़ी देर बाद उसका पति लौट आया।"},{"en":"She told him about the boy’s visit, and the exchange of gifts. “Good, good,” said her husband.","hi":"उसने उसे लड़के की मुलाक़ात और उपहारों के आदान-प्रदान के बारे में बताया। “अच्छा, अच्छा,” उसके पति ने कहा।"}],[{"en":"“We must not forget the social graces. But show me how you held the oranges.”","hi":"“हमें सामाजिक शिष्टाचार नहीं भूलना चाहिए। पर मुझे दिखाओ कि तुमने संतरे कैसे पकड़े थे।”"},{"en":"When she showed him how she had held the {{imaginary|काल्पनिक}} oranges, her husband’s {{brow|त्योरी}} darkened in anger. “Oh, you {{wasteful|फ़िज़ूलख़र्च}} woman!” he {{shrieked|चीख़ा}}.","hi":"जब उसने दिखाया कि उसने काल्पनिक संतरे कैसे पकड़े थे, तो ग़ुस्से से उसके पति की त्योरियाँ चढ़ गईं। “अरे फ़िज़ूलख़र्च औरत!” वह चीख़ा।"},{"en":"“Did you have to hold your fingers so far apart?! Do you think we are millionaires that we can give away such BIG oranges!”","hi":"“क्या तुम्हें उँगलियाँ इतनी दूर-दूर रखकर पकड़नी ज़रूरी थीं?! क्या हम करोड़पति हैं कि इतने बड़े-बड़े संतरे दे डालें!”"}]],"vocab":[["pride","verb","नाज़ करना","take pride, boast","—","to feel pleased about one's own quality or achievement"],["thriftiness","noun","किफ़ायत, मितव्ययिता","frugality, economy","extravagance","careful use of money"],["dismayed","adj","निराश, घबराया हुआ","upset, disheartened","pleased","worried and disappointed"],["tightwad","noun","कंजूस","miser, skinflint","spendthrift","(informal) a person who hates spending money"],["frugally","adv","किफ़ायत से","thriftily, sparingly","lavishly","in a way that avoids wasting money"],["genius","noun","प्रतिभाशाली व्यक्ति","brilliant person, mastermind","fool","a person with extraordinary intelligence or skill"],["overspend","verb","ज़रूरत से ज़्यादा ख़र्च करना","splurge, squander","save","to spend more money than one can afford"],["customary","adj","रिवाज़ के अनुसार, प्रचलित","traditional, usual","unusual","according to custom"],["chela","noun","शिष्य, चेला","disciple, pupil","guru","a student of a spiritual teacher"],["beam","verb","मुस्कुराना","smile, grin","frown","to smile very happily"],["ingenuity","noun","चतुराई, कल्पनाशीलता","cleverness, inventiveness","stupidity","skill in coming up with clever ideas"],["horror","noun","घबराहट, भय","terror, dread","delight","a strong feeling of shock and fear"],["destination","noun","मंज़िल, गंतव्य","goal, target","origin","the place to which someone is going"],["assure","verb","भरोसा दिलाना","promise, convince","deny","to tell someone confidently that something is true"],["dutifully","adv","आज्ञाकारिता से, कर्तव्यपूर्वक","obediently, faithfully","disobediently","in a way that shows obedience and responsibility"],["acknowledge","verb","स्वीकार करना, उत्तर देना","admit, recognise","ignore","to accept or reply to something"],["imaginary","adj","काल्पनिक","unreal, fictional","real","existing only in the mind"],["brow","noun","भौंह, माथा","forehead, eyebrow","—","the forehead or the line of hair above the eye"],["shriek","verb","चीख़ना","scream, screech","whisper","to give a loud high cry"],["wasteful","adj","फ़िज़ूलख़र्च","extravagant, spendthrift","thrifty","using more than is needed"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["go through the motions","दिखावे के लिए करना","He went through the motions of reading the report.","to do something without real effort or sincerity"],["set off","रवाना होना","They set off at dawn.","to begin a journey"],["give away","मुफ़्त में दे देना","She gave away her old clothes.","to give something free of charge"]],"fq":[]},{"id":"ev-ed304","title":"Man on the Tree","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"A man saw a {{ripe|पका}} mango at the top of a tree, and climbed up to get it. He had almost reached the fruit when he lost his {{footing|पैर}}, and fell.","hi":"एक आदमी ने पेड़ की चोटी पर एक पका आम देखा और उसे तोड़ने के लिए ऊपर चढ़ गया। वह फल के लगभग पास पहुँच ही गया था कि उसका पैर फिसल गया और वह गिर पड़ा।"},{"en":"He saved himself by grabbing a branch. But he was still not out of danger.","hi":"उसने एक डाली पकड़कर ख़ुद को बचा लिया। पर वह अब भी ख़तरे से बाहर नहीं था।"},{"en":"The branch was too high above the ground for a safe fall. If he let go, if the branch broke (it was not too thick) the fall could {{cripple|अपाहिज करना}} him for life.","hi":"डाली ज़मीन से इतनी ऊँची थी कि सुरक्षित कूदना संभव नहीं था। अगर वह छोड़ देता, या डाली टूट जाती (वह बहुत मोटी नहीं थी), तो गिरने से वह उम्र भर के लिए अपाहिज हो सकता था।"}],[{"en":"{{Terrified|घबराकर}} by his {{predicament|दुविधा}}, he hung on {{grimly|डटकर}} and shouted for help. {{Presently|थोड़ी देर में}}, a white-haired {{sage|साधु}} came that way.","hi":"अपनी दुविधा से घबराकर वह डटकर लटका रहा और मदद के लिए चिल्लाया। थोड़ी देर में एक सफ़ेद बालों वाला साधु उधर से आया।"},{"en":"Seeing the man {{dangling|लटकता}} on the tree he picked up a {{clod|ढेला}} of mud and threw it at him. “W-Why did you do that?” yelled the man, {{startled|चौंककर}}.","hi":"आदमी को पेड़ पर लटकते देखकर उसने मिट्टी का एक ढेला उठाया और उस पर फेंक दिया। “त-तुमने ऐसा क्यों किया?” आदमी चौंककर चिल्लाया।"},{"en":"The sage did not answer. Instead, he began {{pelting|बरसाने}} the man with clods of mud, laughing {{uproariously|ज़ोर-ज़ोर से}} every time he scored a direct hit.","hi":"साधु ने जवाब नहीं दिया। उलटे, वह आदमी पर मिट्टी के ढेले बरसाने लगा, और हर बार निशाना सही लगने पर ज़ोर-ज़ोर से हँसता।"}],[{"en":"The man on the tree became very angry. “You think you can take advantage of my {{helplessness|लाचारी}}!” he screamed.","hi":"पेड़ पर बैठा आदमी बहुत क्रोधित हो गया। “तुम सोचते हो कि मेरी लाचारी का फ़ायदा उठा सकते हो!” वह चीख़ा।"},{"en":"“I’ll show you!” Straining every {{sinew|ज़ोर}}, he shifted his grip on the branch to move closer to the trunk.","hi":"“मैं तुम्हें दिखाता हूँ!” एड़ी-चोटी का ज़ोर लगाकर उसने तने के और पास जाने के लिए डाली पर अपनी पकड़ खिसकाई।"},{"en":"Slowly, but with a {{determination|दृढ़ संकल्प}} born out of his rage he {{inched|सरकता गया}} towards the trunk till he was close enough to {{embrace|गले लगाना}} it. Once he had gained the trunk, climbing down was an easy matter.","hi":"धीरे-धीरे, पर ग़ुस्से से पैदा हुए दृढ़ संकल्प के साथ वह तने की ओर सरकता गया, जब तक कि इतना पास न आ गया कि उसे गले लगा सके। तने तक पहुँचते ही नीचे उतरना आसान काम था।"}],[{"en":"“Now you rascal,” roared the man, advancing {{menacingly|धमकी भरे ढंग से}} towards the sage, “tell me why you were throwing mud at me!” “To help you get down of course,” smiled the sage.","hi":"“अब बदमाश,” आदमी दहाड़ा, धमकी भरे ढंग से साधु की ओर बढ़ते हुए, “बताओ तुम मुझ पर मिट्टी क्यों फेंक रहे थे!” “अरे, तुम्हें नीचे उतारने में मदद के लिए,” साधु ने मुस्कुराकर कहा।"},{"en":"“If I had not made you angry, you would still be hanging on to that tree, {{paralyzed|जड़}} by fear.”","hi":"“अगर मैं तुम्हें ग़ुस्सा न दिलाता, तो तुम अब भी उस पेड़ से लटके रहते, डर से जड़ बने हुए।”"}]],"vocab":[["ripe","adj","पका हुआ","mature, mellow","unripe","fully grown and ready to eat"],["footing","noun","पैर टिकने की जगह, संतुलन","balance, foothold","—","a firm position of the feet"],["cripple","verb","अपाहिज कर देना","disable, maim","heal","to damage the body so that one cannot move normally"],["terrified","adj","घबराया हुआ, बेहद डरा","petrified, scared","fearless","extremely frightened"],["predicament","noun","दुविधा, मुश्किल हालत","plight, dilemma","—","a difficult situation that is hard to get out of"],["grimly","adv","डटकर, कठोरता से","sternly, resolutely","cheerfully","in a serious and determined way"],["presently","adv","थोड़ी देर में","soon, shortly","—","after a short time"],["sage","noun","साधु, ज्ञानी","wise man, guru","fool","a wise person"],["dangle","verb","लटकना","hang, swing","—","to hang or swing loosely"],["clod","noun","ढेला","lump, chunk","—","a lump of earth or clay"],["startled","adj","चौंका हुआ","surprised, shocked","calm","suddenly surprised and a little frightened"],["pelt","verb","बरसाना (ढेले आदि)","bombard, shower","—","to attack by throwing things repeatedly"],["uproariously","adv","ज़ोर-ज़ोर से, ठहाके लगाकर","noisily, boisterously","quietly","in a very noisy and cheerful way"],["helplessness","noun","लाचारी","powerlessness, weakness","strength","the state of being unable to help oneself"],["sinew","noun","पट्ठा, शारीरिक ताक़त","tendon, muscle","—","strong tissue joining muscle to bone"],["determination","noun","दृढ़ संकल्प","resolve, willpower","indecision","firmness in doing what you have decided"],["inch","verb","धीरे-धीरे सरकना","creep, edge","rush","to move very slowly"],["embrace","verb","गले लगाना","hug, hold","release","to hold someone closely in the arms"],["menacingly","adv","धमकी भरे ढंग से","threateningly, ominously","gently","in a way that suggests danger"],["paralyze","verb","जड़ कर देना, लकवाग्रस्त करना","freeze, immobilise","free","to make unable to move"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["take advantage of","फ़ायदा उठाना","Don't take advantage of a weak person.","to use a situation or person unfairly for your own benefit"],["hang on","डटे रहना, पकड़े रहना","Hang on to the rope tightly.","to hold tightly; to wait"],["let go","छोड़ देना","Don't let go of my hand.","to stop holding something"]],"fq":[]},{"id":"ev-ed311","title":"Owl’s Night Out","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"A long time ago, Everything-Maker was busy {{creating|बनाना}} plants, animals and the other things that you now find on Earth. He gave Owl a body, a loud voice, strong wings and two eyes and then turned to {{attend|ध्यान देना}} to Rabbit.","hi":"बहुत पहले की बात है, सब कुछ बनाने वाला (एवरीथिंग-मेकर) पौधे, जानवर और वे दूसरी चीज़ें बनाने में व्यस्त था जो आज तुम पृथ्वी पर देखते हो। उसने उल्लू को शरीर, तेज़ आवाज़, मज़बूत पंख और दो आँखें दीं और फिर ख़रगोश की ओर मुड़ गया।"},{"en":"“Give me a long neck like the {{swan|हंस}}’s,” {{hooted|हू-हू किया}} Owl, “and a {{beak|चोंच}} like the {{hawk|बाज़}}’s!” “Okay, I’ll give you everything as soon as I finish with Rabbit,” replied Everything-Maker.","hi":"“मुझे हंस जैसी लंबी गर्दन दो,” उल्लू ने हू-हू करते हुए कहा, “और बाज़ जैसी चोंच!” “ठीक है, ख़रगोश का काम ख़त्म करते ही मैं तुम्हें सब कुछ दे दूँगा,” एवरीथिंग-मेकर ने जवाब दिया।"},{"en":"“And now, I want you to turn around and close your eyes. You know that I don’t like anyone watch me work!”","hi":"“और अब, मैं चाहता हूँ कि तुम पीछे मुड़ जाओ और आँखें बंद कर लो। तुम जानते हो कि मुझे काम करते समय कोई देखे, यह पसंद नहीं!”"}],[{"en":"Everything-Maker noticed that Rabbit was {{trembling|काँप रहा}} and so he asked him {{gently|प्यार से}}, “Do you want something, little one?” “Yes,” said Rabbit {{timidly|डरते-डरते}}.","hi":"एवरीथिंग-मेकर ने देखा कि ख़रगोश काँप रहा है, इसलिए उसने उससे प्यार से पूछा, “क्या तुम्हें कुछ चाहिए, नन्हे?” “हाँ,” ख़रगोश ने डरते-डरते कहा।"},{"en":"“Long legs and ears… a {{fang|नुकीला दाँत}}… and a few {{claws|पंजे}}, please!” “Why do you want a fang?” asked Everything-Maker in surprise.","hi":"“लंबे पैर और कान… एक नुकीला दाँत… और कुछ पंजे, कृपया!” “तुम्हें नुकीला दाँत क्यों चाहिए?” एवरीथिंग-मेकर ने हैरानी से पूछा।"},{"en":"“Silly Rabbit!” said Owl. “Ask for something useful, like {{wisdom|बुद्धि}}!”","hi":"“बेवक़ूफ़ ख़रगोश!” उल्लू बोला। “कुछ काम की चीज़ माँगो, जैसे बुद्धि!”"}],[{"en":"“Be quiet, Owl!” said Everything-Maker {{sternly|सख़्ती से}}. “You have to give us what we ask for,” shouted Owl turning around to look at Everything-Maker.","hi":"“चुप रहो, उल्लू!” एवरीथिंग-मेकर ने सख़्ती से कहा। “हम जो माँगें वह हमें देना ही होगा,” उल्लू ने एवरीथिंग-मेकर की ओर मुड़कर चिल्लाया।"},{"en":"“And I {{demand|माँग}} wisdom.” “I’ve had enough of you!” said Everything-Maker angrily.","hi":"“और मैं बुद्धि की माँग करता हूँ।” “बस, बहुत हुआ तुमसे!” एवरीथिंग-मेकर ने ग़ुस्से से कहा।"},{"en":"And he went to Owl and {{pressed|दबाया}} his head down into his body until the neck {{disappeared|ग़ायब हो गई}}. He gave the bird such a shake that his eyes became wide in {{fright|डर}} and then he pulled his ears until they stuck out from his head.","hi":"और वह उल्लू के पास गया और उसका सिर शरीर में तब तक दबाया जब तक गर्दन ग़ायब न हो गई। उसने चिड़िया को ऐसा झकझोरा कि उसकी आँखें डर से फटी रह गईं, और फिर उसने उसके कान तब तक खींचे जब तक वे सिर से बाहर न निकल आए।"}],[{"en":"Then {{snapping|चटकाते हुए}} his fingers, Everything-Maker told Owl, “I have made your ears big, the better to listen. I have made your eyes big, the better to see.","hi":"फिर उँगलियाँ चटकाते हुए एवरीथिंग-मेकर ने उल्लू से कहा, “मैंने तुम्हारे कान बड़े कर दिए, ताकि बेहतर सुन सको। मैंने तुम्हारी आँखें बड़ी कर दीं, ताकि बेहतर देख सको।"},{"en":"I have made your neck short, the better to hold up your head. And, I have packed your head the wisdom, as you have asked.","hi":"मैंने तुम्हारी गर्दन छोटी कर दी, ताकि सिर सँभाल सको। और मैंने तुम्हारे सिर में बुद्धि भर दी, जैसा तुमने माँगा था।"},{"en":"Now you will only come out at night before you see me!” Everything-Maker then turned to Rabbit and gave him his fangs and claws but the little {{creature|जीव}} was not to be seen anywhere.","hi":"अब तुम सिर्फ़ रात में निकलोगे, इससे पहले कि तुम मुझे देखो!” फिर एवरीथिंग-मेकर ख़रगोश की ओर मुड़ा और उसे नुकीले दाँत और पंजे देने चला, पर वह नन्हा जीव कहीं दिखाई नहीं दिया।"}],[{"en":"{{Meanwhile|इस बीच}}, owl flew away fast, knowing well that if he made Everything- maker angry again, he would lose all that he had been given. And since then, Owl has been coming out only at night, after Everything-Maker has gone to sleep.","hi":"इस बीच उल्लू तेज़ी से उड़ गया, यह अच्छी तरह जानते हुए कि अगर उसने एवरीथिंग-मेकर को फिर नाराज़ किया, तो उसे जो कुछ दिया गया है वह सब खो देगा। और तभी से उल्लू केवल रात को निकलता है, जब एवरीथिंग-मेकर सो जाता है।"}]],"vocab":[["create","verb","बनाना, रचना","make, produce","destroy","to bring something into existence"],["attend","verb","ध्यान देना, संभालना","look after, deal with","ignore","to give care or attention to something"],["hoot","verb","हू-हू करना","call, screech","—","to make the cry of an owl"],["swan","noun","हंस","waterbird","—","a large white water bird with a long neck"],["beak","noun","चोंच","bill","—","the hard curved mouth part of a bird"],["hawk","noun","बाज़","falcon, kite","—","a bird of prey with a sharp curved beak"],["trembling","adj","काँपता हुआ","shaking, quivering","steady","shaking slightly from fear or cold"],["gently","adv","प्यार से, धीरे से","softly, kindly","roughly","in a soft and kind way"],["timidly","adv","डरते-डरते","shyly, nervously","boldly","in a shy and fearful way"],["fang","noun","नुकीला दाँत","tooth, tusk","—","a long sharp tooth of an animal"],["claw","noun","पंजा, नाखून","talon, nail","—","a sharp curved nail on an animal's foot"],["wisdom","noun","बुद्धि, समझदारी","knowledge, good sense","foolishness","the ability to make good decisions"],["sternly","adv","सख़्ती से","strictly, harshly","leniently","in a very strict and serious way"],["demand","verb","माँग करना","insist on, require","offer","to ask for something firmly"],["press","verb","दबाना","push, squeeze","release","to push something firmly"],["disappear","verb","ग़ायब हो जाना","vanish, fade","appear","to go out of sight"],["fright","noun","डर, भय","fear, terror","courage","a sudden feeling of fear"],["snap","verb","चुटकी बजाना, चटकाना","click, crack","—","to make a sharp sound by moving fingers or breaking"],["creature","noun","जीव, प्राणी","animal, being","—","a living being, especially an animal"],["meanwhile","adv","इस बीच","in the meantime, at the same time","—","during the time something else is happening"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["turn around","पीछे मुड़ना","Turn around and look at me.","to face the opposite way"],["stick out","बाहर निकला होना","His ears stick out from under his cap.","to extend beyond a surface"],["have had enough of","तंग आ जाना","I've had enough of your excuses.","to be unable to tolerate something any longer"]],"fq":[]},{"id":"ev-ed331","title":"Stomach Problems","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"IN BURMA, in days gone by, a wealthy landlord decided to build a rest house for wandering monks. He invited, or rather, {{commanded|हुक्म दिया}} the men of the village over which he held {{sway|दबदबा}}, to work on the project.","hi":"बर्मा में, बीते दिनों में, एक धनी ज़मींदार ने भटकते भिक्षुओं के लिए एक विश्रामगृह बनवाने का निश्चय किया। उसने उस गाँव के आदमियों को, जिन पर उसका दबदबा था, इस काम के लिए बुलाया, या यूँ कहें कि हुक्म दिया।"},{"en":"\"You will earn {{merit|पुण्य}} by this work, The announced, \"so I will not pay you. Nobody wanted to {{displease|नाराज़ करना}} him so all the {{able-bodied|हट्टे-कट्टे}} men of the village came to help.","hi":"“इस काम से तुम्हें पुण्य मिलेगा,” उसने घोषणा की, “इसलिए मैं तुम्हें मज़दूरी नहीं दूँगा।” कोई उसे नाराज़ नहीं करना चाहता था, इसलिए गाँव के सारे हट्टे-कट्टे आदमी मदद करने आ गए।"},{"en":"All except the village {{simpleton|भोला-भाला आदमी}}. He sat on a log and watched the others work, {{marvelling|हैरान होता}} at their {{industry|मेहनत}}.","hi":"सिवाय गाँव के भोले-भाले आदमी के। वह एक लट्ठे पर बैठा दूसरों को काम करते देखता रहा और उनकी मेहनत पर हैरान होता रहा।"}],[{"en":"The landlord's blood boiled when he spotted the {{idler|आलसी}}. “Why aren't you working!” he {{hollered|दहाड़ा}}.","hi":"जब ज़मींदार ने उस आलसी को देखा तो उसका ख़ून खौल उठा। “तुम काम क्यों नहीं कर रहे!” वह दहाड़ा।"},{"en":"“I would have liked to work on this {{noble|नेक}} {{undertaking|काम}},\" said the simpleton, rising to his feet, \"but my stomach is empty who can work on an empty stomach?\" Seeing that the man was of {{robust|हट्टा-कट्टा}} build and capable of {{contributing|योगदान देने में}} {{massively|बहुत ज़्यादा}} to the task on hand, the landlord ordered his servants to feed him.","hi":"“मैं इस नेक काम में हाथ बँटाना चाहता था,” भोले आदमी ने उठकर कहा, “पर मेरा पेट ख़ाली है, ख़ाली पेट कौन काम कर सकता है?” यह देखकर कि आदमी हट्टा-कट्टा है और हाथ के काम में बहुत योगदान दे सकता है, ज़मींदार ने अपने नौकरों को उसे खिलाने का आदेश दिया।"},{"en":"This took a long time as the man kept on asking for second and third {{helpings|परोसी हुई खुराक}} of the food that was being served to him. But finally he pushed his plate aside, {{belched|डकार ली}} loudly and went to wash.","hi":"इसमें बहुत समय लगा क्योंकि वह आदमी परोसे जा रहे खाने की दूसरी और तीसरी बार माँग करता रहा। पर आख़िर में उसने थाली एक तरफ़ सरकाई, ज़ोर से डकार ली और हाथ धोने चला गया।"}],[{"en":"Then he returned to the site. Some time later the landlord went to {{inspect|निरीक्षण करना}} the work and was {{furious|आग-बबूला}} when he saw the simpleton again sitting {{idly|बेकार}} on the log.","hi":"फिर वह काम की जगह लौट आया। कुछ देर बाद ज़मींदार काम का निरीक्षण करने गया और भोले आदमी को फिर लट्ठे पर बेकार बैठा देखकर आग-बबूला हो गया।"},{"en":"\"Why aren't you working?\" he roared. \"I would have liked to work, said the simpleton, rising to his feet.","hi":"“तुम काम क्यों नहीं कर रहे?” वह दहाड़ा। “मैं काम करना चाहता था,” भोले आदमी ने उठकर कहा।"},{"en":"\"Indeed I want to work on this noble undertaking. But my stomach is full.","hi":"“सचमुच मैं इस नेक काम में लगना चाहता हूँ। पर मेरा पेट भरा है।"}],[{"en":"Who can work on a full stomach?\"","hi":"भरे पेट कौन काम कर सकता है?”"}]],"vocab":[["command","verb","हुक्म देना","order, direct","obey","to give an order with authority"],["sway","noun","दबदबा, प्रभाव","control, influence","weakness","power or influence over people"],["merit","noun","पुण्य, गुण","virtue, credit","fault","good quality; spiritual credit"],["displease","verb","नाराज़ करना","annoy, upset","please","to make someone annoyed or unhappy"],["able-bodied","adj","हट्टा-कट्टा, सक्षम","fit, healthy","disabled","strong and physically fit"],["simpleton","noun","भोला-भाला आदमी","fool, naive person","genius","a person who is easily fooled or lacks common sense"],["marvel","verb","हैरान होना","wonder, be amazed","—","to be filled with wonder"],["industry","noun","मेहनत, परिश्रम","hard work, diligence","laziness","hard and steady work"],["idler","noun","आलसी आदमी","loafer, slacker","worker","a lazy person who avoids work"],["holler","verb","ज़ोर से चिल्लाना","shout, yell","whisper","(informal) to shout loudly"],["noble","adj","नेक, उदार","honourable, worthy","ignoble","having high moral qualities"],["undertaking","noun","कार्य, उद्यम","task, project","—","a piece of work that one has agreed to do"],["robust","adj","हट्टा-कट्टा, मज़बूत","sturdy, strong","weak","strong and healthy"],["contribute","verb","योगदान देना","give, add","withhold","to give help or money towards something"],["massively","adv","बहुत ज़्यादा","hugely, enormously","slightly","to a very great degree"],["helping","noun","खुराक, परोसी हुई मात्रा","serving, portion","—","an amount of food served to one person"],["belch","verb","डकार लेना","burp","—","to let out gas from the stomach through the mouth noisily"],["inspect","verb","निरीक्षण करना","examine, check","ignore","to look at something carefully to check it"],["furious","adj","आग-बबूला, क्रोधित","enraged, livid","calm","extremely angry"],["idly","adv","बेकार, निठल्ले","lazily, aimlessly","busily","without doing any useful work"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["one's blood boils","ख़ून खौल उठना","His blood boiled when he saw the mess.","to feel extremely angry"],["in days gone by","बीते ज़माने में","In days gone by, people travelled on foot.","in the past"],["keep on (doing)","लगातार करते रहना","He kept on asking for more.","to continue doing something"]],"fq":[]},{"id":"ev-ed337","title":"The Cowardly Horse","src":"Evergreen library · Topic: Sports","c":"Sports","todo":"","ed":[[{"en":"Once upon a time, a fine looking horse lived in a forest. Although he was tall and strong, the horse was a big {{coward|डरपोक}}.","hi":"एक समय की बात है, एक जंगल में एक सुंदर दिखने वाला घोड़ा रहता था। लंबा और मज़बूत होने के बावजूद वह घोड़ा बहुत बड़ा डरपोक था।"},{"en":"He was {{terrified|घबरा गया}} when he heard the roar of a hungry tiger – even the sudden {{chirping|चहचहाहट}} of crickets made him {{squirm|बेचैन होना}} with fear. One day he met a farmer who listened to his tale of {{woe|दुख}} with a great deal of {{sympathy|सहानुभूति}}.","hi":"भूखे बाघ की दहाड़ सुनते ही वह घबरा जाता था – झींगुरों की अचानक चहचहाहट भी उसे डर से बेचैन कर देती थी। एक दिन उसे एक किसान मिला जिसने उसकी दुख भरी कहानी बड़ी सहानुभूति से सुनी।"},{"en":"“Why don’t you come home with me?” asked the farmer. “I have a big {{barn|खलिहान}} with a strong door.","hi":"“तुम मेरे साथ घर क्यों नहीं चलते?” किसान ने पूछा। “मेरे पास एक बड़ा खलिहान है जिसका दरवाज़ा मज़बूत है।"}],[{"en":"You’ll be safe inside.” The horse decided that he had nothing to lose and followed his new-found friend to his farm.","hi":"तुम अंदर सुरक्षित रहोगे।” घोड़े ने सोचा कि उसके पास खोने को कुछ नहीं है और वह अपने नए दोस्त के पीछे-पीछे उसके खेत तक चला गया।"},{"en":"Soon they were standing in front of a large wooden barn. The farmer opened the door and {{ushered|अंदर ले गया}} the horse in with a great deal of ceremony.","hi":"जल्द ही वे एक बड़े लकड़ी के खलिहान के सामने खड़े थे। किसान ने दरवाज़ा खोला और बड़े आदर-सत्कार के साथ घोड़े को अंदर ले गया।"},{"en":"He {{tethered|बाँध दिया}} the horse to a wooden post and gave him grain and hay to eat. He then locked the door of the barn and went off to his own {{modest|साधारण}} {{dwelling|झोपड़ी}}.","hi":"उसने घोड़े को लकड़ी के खूँटे से बाँध दिया और खाने को अनाज और घास दी। फिर उसने खलिहान का दरवाज़ा बंद किया और अपनी साधारण-सी झोपड़ी में चला गया।"}],[{"en":"The horse felt safe and secure and ate {{contentedly|संतोष से}} {{munching|चबाते हुए}} on the hay. “I wouldn’t mind at all if I had to spend the rest of my life here,” he muttered to himself, not realizing how {{prophetic|भविष्यसूचक}} those words were to be.","hi":"घोड़ा सुरक्षित महसूस कर रहा था और संतोष से घास चबाते हुए खा रहा था। “अगर मुझे अपनी बाक़ी ज़िंदगी यहीं बितानी पड़े तो मुझे बिल्कुल बुरा नहीं लगेगा,” उसने बुदबुदाकर कहा, यह जाने बिना कि ये शब्द कितने भविष्यसूचक साबित होने वाले थे।"},{"en":"At the crack of dawn the barn door opened and the farmer marched in. He roughly {{roused|जगाया}} the sleeping horse and slipped a {{bridle|लगाम}} on his head.","hi":"भोर होते ही खलिहान का दरवाज़ा खुला और किसान अंदर आया। उसने सोते हुए घोड़े को कठोरता से जगाया और उसके सिर पर लगाम डाल दी।"},{"en":"He then led his unwilling guest outside. “Where are you taking me?” demanded the horse.","hi":"फिर वह अपने अनिच्छुक मेहमान को बाहर ले गया। “तुम मुझे कहाँ ले जा रहे हो?” घोड़े ने पूछा।"}],[{"en":"“I can’t feed idle mouths,” was the {{laconic|संक्षिप्त}} reply. The farmer took the horse to his field and {{hitched|जोत दिया}} him to his plough.","hi":"“मैं बेकार के मुँहों को नहीं खिला सकता,” संक्षिप्त जवाब आया। किसान घोड़े को अपने खेत में ले गया और उसे अपने हल में जोत दिया।"},{"en":"Then snatching a whip he made the horse draw long {{furrows|कुंड़ें}} in the field. The farmer forced the horse to plough his fields every day and each time he thought of the safe barn he felt a silent {{resentment|नाराज़गी}}.","hi":"फिर चाबुक झपटकर उसने घोड़े से खेत में लंबी कुंड़ें खिंचवाईं। किसान घोड़े से रोज़ खेत जुतवाता और हर बार जब वह सुरक्षित खलिहान को याद करता, तो उसके मन में चुपचाप नाराज़गी उठती।"},{"en":"“I should have jumped from the frying pan into the fire! How I wish I’d remained in the forest and taken my chances with the tigers!”","hi":"“मुझे तो कड़ाही से निकलकर आग में कूदना ही था! काश मैं जंगल में ही रहता और बाघों के साथ अपनी क़िस्मत आज़मा लेता!”"}],[{"en":"But words of regret were useless, for he was well and truly trapped in a web of his own making.","hi":"पर पछतावे के शब्द बेकार थे, क्योंकि वह अपने ही बनाए जाल में अच्छी तरह फँस चुका था।"}]],"vocab":[["coward","noun","डरपोक","chicken, weakling","hero","a person who lacks courage"],["terrified","adj","बेहद डरा हुआ","petrified, scared","fearless","extremely frightened"],["chirp","verb","चहचहाना","tweet, twitter","—","to make short high sounds like a small bird or insect"],["squirm","verb","बेचैन होना, छटपटाना","wriggle, twist","—","to twist the body because of nervousness or discomfort"],["woe","noun","दुख, विपत्ति","sorrow, misery","joy","great sadness or trouble"],["sympathy","noun","सहानुभूति","compassion, pity","indifference","the feeling of sharing someone's sorrow"],["barn","noun","खलिहान, अस्तबल","shed, stable","—","a farm building for storing grain or keeping animals"],["usher","verb","अंदर ले जाना","escort, guide","—","to lead someone to a place politely"],["tether","verb","बाँधना","tie, fasten","untie","to tie an animal with a rope"],["modest","adj","साधारण, विनम्र","humble, simple","grand","not large or expensive"],["dwelling","noun","निवास, झोपड़ी","home, residence","—","a house or place where someone lives"],["contentedly","adv","संतोष से","happily, peacefully","restlessly","in a satisfied and happy way"],["munch","verb","चबाना","chew, crunch","—","to chew food noisily and steadily"],["prophetic","adj","भविष्यसूचक","predictive, ominous","—","correctly telling what will happen in the future"],["rouse","verb","जगाना","wake, awaken","lull","to wake someone up"],["bridle","noun","लगाम","reins, harness","—","straps put on a horse's head to control it"],["laconic","adj","संक्षिप्त, कम शब्दों वाला","brief, terse","wordy","using very few words"],["hitch","verb","जोतना, बाँधना","yoke, tie","unhitch","to fasten an animal to a plough or cart"],["furrow","noun","कुंड़, हल की रेखा","trench, groove","—","a long narrow line cut in the soil by a plough"],["resentment","noun","नाराज़गी, कड़वाहट","bitterness, grudge","goodwill","an angry feeling about unfair treatment"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["nothing to lose","खोने को कुछ नहीं","Try it; you have nothing to lose.","no risk in trying"],["at the crack of dawn","भोर होते ही","We left at the crack of dawn.","very early in the morning"],["out of the frying pan into the fire","कड़ाही से निकलकर आग में","Leaving that job for a worse one was out of the frying pan into the fire.","from a bad situation to a worse one"]],"fq":[]},{"id":"ev-ed338","title":"The Extortionist","src":"Evergreen library · Topic: Economy","c":"Economy","todo":"","ed":[[{"en":"One day a brahmin presented himself at the court of the king of Gujarat and made {{obeisance|झुककर प्रणाम}} to him. “What brings you here, good man?” asked the {{monarch|राजा}}.","hi":"एक दिन एक ब्राह्मण गुजरात के राजा के दरबार में हाज़िर हुआ और उन्हें झुककर प्रणाम किया। “भले आदमी, तुम यहाँ क्यों आए हो?” राजा ने पूछा।"},{"en":"“Poverty,” replied the man. “I cannot feed my family.”","hi":"“ग़रीबी के कारण,” उस आदमी ने जवाब दिया। “मैं अपने परिवार का पेट नहीं भर सकता।”"},{"en":"The king gave him a note and asked him to present it to his {{treasurer|खज़ांची}}. On reading the note, the treasurer gave him a rupee.","hi":"राजा ने उसे एक पर्ची दी और कहा कि इसे अपने खज़ांची को दिखाओ। पर्ची पढ़कर खज़ांची ने उसे एक रुपया दे दिया।"}],[{"en":"It was enough to feed a family for a day. So every morning he would present himself at the palace and the king would give him a note to his treasurer.","hi":"यह एक दिन के लिए परिवार को खिलाने भर को काफ़ी था। इसलिए हर सुबह वह महल में हाज़िर होता और राजा उसे खज़ांची के नाम एक पर्ची दे देते।"},{"en":"One day the brahmin was {{accosted|रोककर बात की}} by the king’s masseur. “You must’ve seen me pressing His Majesty’s legs,” said the masseur.","hi":"एक दिन राजा के मालिशिये ने ब्राह्मण को रोक लिया। “आपने मुझे महाराज के पैर दबाते ज़रूर देखा होगा,” मालिशिये ने कहा।"},{"en":"“I have,” said the brahmin. “It is because I keep him in a good mood that he is so {{generous|उदार}} to you,” said the masseur.","hi":"“हाँ, देखा है,” ब्राह्मण ने कहा। “मैं उन्हें अच्छे मूड में रखता हूँ, इसीलिए वे तुम पर इतने मेहरबान हैं,” मालिशिये ने कहा।"}],[{"en":"“I have great {{influence|प्रभाव}} here. One word from me and you could lose your pension!","hi":"“यहाँ मेरा बहुत दबदबा है। मेरे एक शब्द से तुम्हारी पेंशन जा सकती है!"},{"en":"If you don’t want that to happen you must give me four annas as {{commission|कमीशन}} every day.” “I cannot give you anything,” said the brahmin and walked away.","hi":"अगर तुम ऐसा नहीं चाहते तो रोज़ चार आने कमीशन के रूप में मुझे देने होंगे।” “मैं तुम्हें कुछ नहीं दे सकता,” ब्राह्मण ने कहा और चला गया।"},{"en":"The masseur {{waylaid|रास्ता रोका}} him a number of times after that and each time his manner became more and more {{threatening|धमकी भरा}}. But the brahmin refused to give him anything.","hi":"इसके बाद मालिशिये ने कई बार उसका रास्ता रोका और हर बार उसका ढंग ज़्यादा धमकी भरा होता गया। पर ब्राह्मण ने उसे कुछ भी देने से मना कर दिया।"}],[{"en":"One day he accosted the brahmin outside the palace gates. “I have bad news,” he said.","hi":"एक दिन उसने महल के फाटक के बाहर ब्राह्मण को रोका। “मेरे पास बुरी ख़बर है,” उसने कहा।"},{"en":"“The king is upset with you.” “Upset with me?” said the brahmin, {{alarmed|घबराया हुआ}}.","hi":"“राजा आपसे नाराज़ हैं।” “मुझसे नाराज़?” ब्राह्मण ने घबराकर कहा।"},{"en":"“Why?” “He says your breath smells {{foul|बदबूदार}}.","hi":"“क्यों?” “वे कहते हैं कि आपकी साँस से बदबू आती है।"}],[{"en":"Better cover your mouth and nose with a scarf when you go in to see him.” The brahmin thanked him for his warning and went in search of a scarf.","hi":"अंदर उनसे मिलने जाएँ तो बेहतर होगा कि मुँह और नाक को दुपट्टे से ढक लें।” ब्राह्मण ने चेतावनी के लिए उसका धन्यवाद किया और दुपट्टा ढूँढने चला गया।"},{"en":"The masseur on his part, hurried to the king’s {{chamber|कक्ष}} before the brahmin and began to massage his legs. “Some people are so {{ungrateful|एहसान-फ़रामोश}},” he muttered, as if under his breath.","hi":"उधर मालिशिया ब्राह्मण से पहले जल्दी से राजा के कक्ष में पहुँचा और उनके पैर दबाने लगा। “कुछ लोग कितने एहसान-फ़रामोश होते हैं,” वह मानो दबी आवाज़ में बुदबुदाया।"},{"en":"“Whom are you talking about?” asked the king. “The brahmin to whom you give a rupee each day.","hi":"“तुम किसके बारे में बात कर रहे हो?” राजा ने पूछा। “उस ब्राह्मण के बारे में जिसे आप रोज़ एक रुपया देते हैं।"}],[{"en":"I met him just now and he was arranging a scarf to cover his mouth and nose.” “Why?” asked the king.","hi":"अभी-अभी वह मुझे मिला और अपने मुँह और नाक को ढकने के लिए दुपट्टा ठीक कर रहा था।” “क्यों?” राजा ने पूछा।"},{"en":"“He says… he says… no, I cannot tell you, Your Majesty…” “Tell me!” commanded the king.","hi":"“वह कहता है… वह कहता है… नहीं, महाराज, मैं आपको नहीं बता सकता…” “बताओ!” राजा ने आदेश दिया।"},{"en":"“He says you have bad breath.” The king showed no emotion when the brahmin came in some time later with a scarf covering his nose and mouth.","hi":"“वह कहता है कि आपके मुँह से बदबू आती है।” थोड़ी देर बाद जब ब्राह्मण नाक और मुँह पर दुपट्टा बाँधे अंदर आया, तो राजा के चेहरे पर कोई भाव नहीं आया।"}],[{"en":"As usual, he gave him a note to his treasurer. The masseur was surprised.","hi":"हमेशा की तरह उन्होंने उसे खज़ांची के नाम पर्ची दी। मालिशिया हैरान रह गया।"},{"en":"He had expected the king to drive the man away and then he could try to take the pension again. But things had taken an {{ominous|अशुभ}} turn.","hi":"उसे उम्मीद थी कि राजा ब्राह्मण को भगा देंगे और फिर वह उसकी पेंशन हड़पने की कोशिश कर सकेगा। लेकिन मामला अशुभ मोड़ ले चुका था।"},{"en":"One day the king happened to ask the brahmin why he was covering his face and then the cat would be out of the bag! The masseur excused himself and hurried after the brahmin to warn him never to {{disclose|उजागर करना}} why he was covering his mouth.","hi":"उसे डर लगा कि किसी दिन राजा ब्राह्मण से पूछ बैठें कि वह चेहरा क्यों ढकता है, और तब भेद खुल जाएगा! मालिशिये ने बहाना बनाकर विदा ली और ब्राह्मण के पीछे दौड़ा ताकि उसे चेताए कि वह मुँह ढकने की वजह कभी किसी को न बताए।"}],[{"en":"The brahmin was {{touched|भावुक}} that he should take so much interest in his welfare. “Now I regret I did not give you your commission,” he said.","hi":"ब्राह्मण उसकी इस फ़िक्र से भावुक हो गया कि वह उसकी भलाई में इतनी रुचि लेता है। “अब मुझे पछतावा है कि मैंने तुम्हें तुम्हारा कमीशन नहीं दिया,” उसने कहा।"},{"en":"“Here, take the whole rupee,” and he handed him the note to the treasurer. The masseur, overjoyed, rushed to the treasurer with the note.","hi":"“लो, पूरा रुपया ही ले लो,” और उसने खज़ांची के नाम की वह पर्ची उसे थमा दी। मालिशिया बेहद ख़ुश होकर पर्ची लिए खज़ांची के पास दौड़ा।"},{"en":"But instead of being handed a coin he was {{manacled|हथकड़ी पहनाई}} by the guards. “What’s this!” cried the {{bewildered|घबराया-भौचक्का}} man.","hi":"लेकिन सिक्का मिलने की जगह पहरेदारों ने उसे हथकड़ियाँ पहना दीं। “यह क्या!” उस घबराए हुए आदमी ने चिल्लाकर कहा।"}],[{"en":"“Why am I being {{manhandled|मारपीट की गई}} in this fashion?!” “King’s orders,” explained the treasurer.","hi":"“मेरे साथ इस तरह मारपीट क्यों की जा रही है?!” “राजा का हुक्म है,” खज़ांची ने समझाया।"},{"en":"“The coded message says I have to sew up the mouth of the bearer of the note.” The masseur had to reveal everything to save himself — which he managed to do but he was {{banished|निर्वासित}} from the city.","hi":"“गुप्त संदेश में लिखा है कि पर्ची लाने वाले का मुँह सी दिया जाए।” मालिशिये को अपनी जान बचाने के लिए सब कुछ बताना पड़ा, जो उसने किया भी, पर उसे शहर से निकाल दिया गया।"},{"en":"As for the brahmin he continued to receive a rupee each day for the rest of his life.","hi":"और ब्राह्मण को जीवन भर हर दिन एक रुपया मिलता रहा।"}]],"vocab":[["obeisance","noun","झुककर प्रणाम; आदर","homage, bow","disrespect","a deep respectful bow or gesture of respect"],["monarch","noun","राजा, शासक","king, sovereign","subject","a king or queen who rules a country"],["treasurer","noun","खज़ांची","bursar, cashier","—","a person in charge of money and accounts"],["generous","adj","उदार","giving, kind","stingy","willing to give freely"],["influence","noun","प्रभाव, दबदबा","sway, power","weakness","the power to affect people or decisions"],["accost","verb","रोककर बात करना","confront, approach","avoid","to stop and speak to someone boldly"],["commission","noun","कमीशन, दलाली","fee, cut","—","a payment made for helping to get a job done or a sale"],["waylay","verb","रास्ता रोकना","ambush, intercept","let pass","to stop someone on the way to speak or attack"],["threatening","adj","धमकी भरा","menacing, hostile","friendly","expressing a danger or harm"],["alarmed","adj","घबराया हुआ","frightened, startled","calm","feeling sudden fear or worry"],["foul","adj","बदबूदार, गंदा","rotten, filthy","fragrant","very unpleasant to smell or taste"],["chamber","noun","कक्ष, कमरा","room, hall","—","a room, especially a private one"],["ungrateful","adj","एहसान-फ़रामोश","thankless, unappreciative","thankful","not showing thanks for kindness"],["ominous","adj","अशुभ, अपशकुन-सा","threatening, sinister","promising","giving a sign that something bad will happen"],["disclose","verb","उजागर करना","reveal, divulge","conceal","to make secret information known"],["touched","adj","भावुक, द्रवित","moved, affected","unmoved","feeling emotion or gratitude"],["manacle","verb","हथकड़ी लगाना","handcuff, shackle","free","to fasten with chains or handcuffs"],["bewildered","adj","घबराया-भौचक्का","confused, puzzled","clear-headed","very confused and unable to understand"],["manhandle","verb","बेरहमी से पकड़ना","rough up, maul","handle gently","to handle or push someone roughly"],["banish","verb","निर्वासित करना","exile, expel","welcome","to send away from a place as punishment"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["the cat is out of the bag","भेद खुल जाना","When he slipped, the cat was out of the bag.","a secret has been revealed"],["on one’s part","की ओर से","The masseur, on his part, hurried to the king.","as far as someone is concerned"],["walk away","चले जाना, पीछे हट जाना","He refused the demand and walked away.","to leave without getting involved"]],"fq":[]},{"id":"ev-ed340","title":"The First Test","src":"Evergreen library · Topic: Economy","c":"Economy","todo":"","ed":[[{"en":"Sixty-year-old Ken finally decided to call it quits. He had been a cat burglar for the better part of his life and now he was no longer as {{spry|फुर्तीला}} as he once was.","hi":"साठ साल के केन ने आख़िरकार काम छोड़ने का फ़ैसला कर लिया। वह अपनी ज़िंदगी का बड़ा हिस्सा बिल्ली-चोर (छत-दीवार लाँघने वाला चोर) रहा था और अब पहले जितना फुर्तीला नहीं रह गया था।"},{"en":"He had broken into {{innumerable|अनगिनत}} homes, but had not been caught even once. He came to be called ‘Untouchable Ken’.","hi":"उसने अनगिनत घरों में सेंध मारी थी, पर एक बार भी पकड़ा नहीं गया। उसे ‘अनटचेबल केन’ कहा जाने लगा।"},{"en":"His teenage son wanted to become a thief and thought he could learn valuable tips from his {{expert|माहिर}} father. The master burglar agreed to teach him the tricks of the trade.","hi":"उसका किशोर बेटा चोर बनना चाहता था और सोचता था कि वह अपने माहिर पिता से काम की बातें सीख सकता है। उस्ताद चोर बेटे को इस धंधे के गुर सिखाने को राज़ी हो गया।"}],[{"en":"Few weeks later, Ken said, “Tonight will be a test. Be prepared.”","hi":"कुछ हफ़्ते बाद केन ने कहा, “आज रात परीक्षा होगी। तैयार रहना।”"},{"en":"Little before midnight, Ken {{slung|लटकाया}} his bag containing his burglar’s tools over his shoulder and {{instructed|निर्देश दिया}} his son to follow him quietly. Ken zeroed in on a {{mansion|आलीशान हवेली}} whose guard was fast asleep.","hi":"आधी रात से थोड़ा पहले केन ने अपने औज़ारों वाला थैला कंधे पर लटकाया और बेटे को चुपचाप पीछे आने का निर्देश दिया। केन ने एक आलीशान हवेली चुनी जिसका पहरेदार गहरी नींद में था।"},{"en":"Ken {{clambered|चढ़कर पार किया}} over the wall with his son in tow. Through a window was open and the {{duo|जोड़ी}} {{crept|रेंगते हुए गए}} inside.","hi":"केन बेटे को साथ लिए दीवार पर चढ़कर पार हो गया। एक खिड़की खुली थी और दोनों रेंगते हुए अंदर घुस गए।"}],[{"en":"Ken {{scanned|नज़र दौड़ाई}} the room and saw a wooden {{wardrobe|अलमारी}}. He {{deftly|कुशलता से}} opened it and {{motioned|इशारा किया}} his son to his side.","hi":"केन ने कमरे पर नज़र दौड़ाई और लकड़ी की एक अलमारी देखी। उसने कुशलता से उसे खोला और बेटे को इशारे से पास बुलाया।"},{"en":"He whispered, “Enter the cupboard and pick out the expensive clothes while I check out the other rooms. Don’t make a sound!”","hi":"उसने फुसफुसाकर कहा, “अलमारी में घुसो और महँगे कपड़े चुन लो, मैं तब तक दूसरे कमरे देखता हूँ। आवाज़ मत करना!”"},{"en":"As soon as the teen stepped inside, he {{slammed|धड़ाम से बंद किया}} the door of the wardrobe shut. He gathered his tools and slipped out of the house.","hi":"जैसे ही किशोर अंदर गया, केन ने अलमारी का दरवाज़ा धड़ाम से बंद कर दिया। उसने अपने औज़ार समेटे और घर से बाहर खिसक गया।"}],[{"en":"He banged on the front door and yelled, “Thief! Thief!”","hi":"उसने सामने के दरवाज़े पर ज़ोर से थपथपाया और चिल्लाया, “चोर! चोर!”"},{"en":"The guard woke up with a start and began blowing his whistle. The lights came on in the house, but before anyone could see him, Ken {{disappeared|ग़ायब हो गया}} into the night.","hi":"पहरेदार चौंककर जाग गया और सीटी बजाने लगा। घर की बत्तियाँ जल उठीं, पर किसी के उसे देखने से पहले ही केन रात में ग़ायब हो गया।"},{"en":"Hours later, Ken’s son came home, {{exhausted|थका हुआ}} and angry. “Father!” he {{snapped|झल्लाया}}.","hi":"कई घंटे बाद केन का बेटा थका और ग़ुस्से में घर लौटा। “पिताजी!” वह झल्लाया।"}],[{"en":"“Why did you lock me in? I was so {{fearful|डरा हुआ}} of being caught that I had to use all my {{ingenuity|चतुराई}} to escape.”","hi":"“आपने मुझे बंद क्यों किया? मुझे पकड़े जाने का इतना डर था कि भाग निकलने के लिए मुझे अपनी सारी चतुराई लगानी पड़ी।”"},{"en":"The master burglar smiled and said, “{{Congratulations|बधाई}}, son! You have passed your first test.”","hi":"उस्ताद चोर मुस्कराया और बोला, “बधाई हो बेटा! तुमने अपनी पहली परीक्षा पास कर ली।”"}]],"vocab":[["spry","adj","फुर्तीला","agile, nimble","sluggish","active and quick in movement, especially despite age"],["innumerable","adj","अनगिनत","countless, numberless","few","too many to count"],["expert","noun","माहिर, विशेषज्ञ","specialist, master","amateur","a person with great skill or knowledge"],["instruct","verb","निर्देश देना","direct, order","obey","to tell someone what to do"],["sling","verb","लटकाना, फेंकना","hang, hurl","—","to hang or carry loosely, or to throw"],["mansion","noun","आलीशान हवेली","palace, manor","hut","a very large, grand house"],["clamber","verb","हाथ-पैर से चढ़ना","scramble, climb","descend","to climb with effort using hands and feet"],["duo","noun","जोड़ी, दो लोग","pair, couple","—","two people or things together"],["creep","verb","रेंगना, दबे पाँव चलना","sneak, tiptoe","stride","to move slowly and quietly"],["scan","verb","बारीकी से नज़र डालना","survey, examine","ignore","to look over something carefully"],["wardrobe","noun","अलमारी (कपड़ों की)","closet, cupboard","—","a tall cupboard for hanging clothes"],["deftly","adv","कुशलता से","skilfully, adroitly","clumsily","in a quick and skilful way"],["motion","verb","इशारा करना","gesture, signal","—","to direct someone by a hand movement"],["slam","verb","धड़ाम से बंद करना","bang, shut hard","open gently","to shut with great force and noise"],["disappear","verb","ग़ायब होना","vanish, fade","appear","to go out of sight"],["exhausted","adj","थका हुआ","tired out, drained","energetic","extremely tired"],["snap","verb","झल्लाकर बोलना","bark, retort","—","to speak sharply and angrily"],["fearful","adj","डरा हुआ","afraid, scared","fearless","feeling afraid or anxious"],["ingenuity","noun","चतुराई, सूझ-बूझ","cleverness, inventiveness","stupidity","skill at inventing clever solutions"],["congratulations","noun","बधाई","felicitations, praise","condolences","words of praise on someone’s success"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["call it quits","काम या सिलसिला बंद कर देना","After forty years he decided to call it quits.","to stop doing something"],["tricks of the trade","किसी धंधे के गुर","The old master taught him the tricks of the trade.","special skills of a profession"],["in tow","साथ लिए हुए","She came in with her little brother in tow.","accompanying or following someone"]],"fq":[]},{"id":"ev-ed341","title":"The Honey Pot","src":"Evergreen library · Topic: Health & Environment","c":"Health & Environment","todo":"","ed":[[{"en":"Rambharosey’s old mother gave him a pot of honey before leaving for Varanasi and asked him to keep it carefully. “Guard it well,” she said, “this is good honey, it will keep me healthy after I get back.”","hi":"रामभरोसे की बूढ़ी माँ ने वाराणसी जाने से पहले उसे शहद का एक मटका दिया और सँभालकर रखने को कहा। “इसकी अच्छी निगरानी करना,” उसने कहा, “यह बढ़िया शहद है, लौटकर इसी से मेरी सेहत ठीक रहेगी।”"},{"en":"Rambharosey kept it in the corner of the {{barn|खलिहान}}. Next morning, when he went in to get some {{hay|सूखा चारा}}, he saw that the pot had {{cracked|चटक गया}} and some ants had found their way into the honey.","hi":"रामभरोसे ने उसे खलिहान के कोने में रख दिया। अगली सुबह जब वह चारा लेने गया तो देखा कि मटका चटक गया है और कुछ चींटियाँ शहद तक पहुँच गई हैं।"},{"en":"“Oh dear,” he said, “now what should I do?” He stood in the barn and thought hard.","hi":"“हाय राम,” उसने कहा, “अब क्या करूँ?” वह खलिहान में खड़ा होकर देर तक सोचता रहा।"}],[{"en":"Then he got a big, {{shallow|उथली}} pan from the kitchen, filled it with water, and put a flat stone in the middle. Then he stood the pot on it.","hi":"फिर वह रसोई से एक बड़ी, उथली परात लाया, उसमें पानी भरा और बीच में एक चपटा पत्थर रख दिया। फिर मटका उसी पर टिका दिया।"},{"en":"“There,” he said, pleased, “I have created a {{moat|खाई}} around the pot. Now the ants cannot get at it.”","hi":"“लो,” उसने ख़ुश होकर कहा, “मैंने मटके के चारों ओर खाई बना दी है। अब चींटियाँ इस तक नहीं पहुँच सकतीं।”"},{"en":"So much thinking put such a {{strain|ज़ोर, तनाव}} on Rambharosey that he forgot to cover the pot. The next morning, he came into the barn and saw some dead flies around the mouth of the pot.","hi":"इतनी सोच-विचार से रामभरोसे पर इतना ज़ोर पड़ा कि वह मटका ढकना भूल गया। अगली सुबह वह खलिहान में आया तो मटके के मुँह के आसपास कुछ मरी मक्खियाँ दिखीं।"}],[{"en":"“Oh dear,” he said, “now what should I do?” And he stood in the barn and thought hard.","hi":"“हाय राम,” उसने कहा, “अब क्या करूँ?” और वह फिर खलिहान में खड़ा होकर देर तक सोचता रहा।"},{"en":"Then he brought his {{finest|सबसे बढ़िया}
