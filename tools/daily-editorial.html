में रहने दोगे?” अबाबील ने पूछा। विलो ने अपनी बारीक शाखाएँ लहराईं और अबाबील को एक तरफ़ झटक दिया।"},{"en":"\"Hmph! I don't speak to strangers.","hi":"“हूँ! मैं अजनबियों से बात नहीं करता।"}],[{"en":"Go away\" Close to tears and hurting, the little swallow hopped around, feeling lost and lonely.","hi":"जाओ यहाँ से।” आँखों में आँसू और दर्द के साथ नन्ही अबाबील इधर-उधर फुदकती रही, खोई और अकेली महसूस करते हुए।"},{"en":"A kindly spruce tree saw what had happened and took pity. He called out to the swallow and said, \"Little bird, you may live in my branches, Here is a warm spot.\"","hi":"एक दयालु स्प्रूस के पेड़ ने जो हुआ देखा और उसे तरस आया। उसने अबाबील को पुकारकर कहा, “नन्हीं चिड़िया, तुम मेरी शाखाओं में रह सकती हो, यहाँ एक गर्म जगह है।”"},{"en":"\"Will you let me live with you all winter?\" asked the swallow, {{timidly|झिझकते हुए}}. \"Yes, I would like the company\" said the spruce.","hi":"“क्या तुम मुझे पूरी सर्दी अपने साथ रहने दोगे?” अबाबील ने झिझकते हुए पूछा। “हाँ, मुझे साथ अच्छा लगेगा,” स्प्रूस ने कहा।"}],[{"en":"The sinewy pine tree behind the spruce shook off the soft snow, revealing his spindly leaves. He said, \"I can't offer you a warm place to stay, but I am big and strong.","hi":"स्प्रूस के पीछे खड़े पुट्ठेदार चीड़ के पेड़ ने नरम बर्फ़ झटक दी, जिससे उसकी पतली पत्तियाँ दिखीं। उसने कहा, “मैं तुम्हें गर्म जगह नहीं दे सकता, पर मैं बड़ा और मज़बूत हूँ।"},{"en":"I can keep off the freezing wind.\" A nearby juniper tree lush with purple fruit, also chipped in.","hi":"मैं ठंडी हवा को रोक सकता हूँ।” पास का जूनिपर का पेड़, जो बैंगनी फलों से लदा था, उसने भी हाथ बँटाया।"},{"en":"\"Don't worry little bird. You can feast on my berries all you want.","hi":"“चिंता मत करो, नन्हीं चिड़िया। तुम जितना चाहो मेरे बेर खा सकती हो।"}],[{"en":"So you will not go hungry this winter\" And so, filled with relief and happiness, the swallow flew up to the spruce tree and settled down.","hi":"इसलिए इस सर्दी तुम भूखी नहीं रहोगी।” और इस तरह राहत और ख़ुशी से भरी अबाबील उड़कर स्प्रूस के पेड़ पर जा बैठी।"},{"en":"At long last, he was comforted by the thought of surviving the winter with the help of his new friends. The silver birch, oak and willow watched the happy swallow and pouted.","hi":"आख़िरकार नए दोस्तों की मदद से सर्दी झेल जाने के ख़याल से उसे तसल्ली मिली। भोजपत्र, बलूत और विलो ने ख़ुश अबाबील को देखा और मुँह फुला लिया।"},{"en":"The birch remarked {{haughtily|अकड़कर}}, \"I would not take care of another creature when I have to look after myself!\" \"I would not put my acorns at risk by inviting birds to live with me,\" said the mighty oak.","hi":"भोजपत्र ने अकड़कर कहा, “जब मुझे अपना ही ध्यान रखना है तो मैं किसी और जीव की देखभाल नहीं करूँगा!” “मैं बलूत-फल जोखिम में डालकर पक्षियों को अपने यहाँ नहीं रखूँगा,” ताक़तवर बलूत ने कहा।"}],[{"en":"\"I would not speak to a stranger,\" said the pretty willow. The three trees stood tall and proud, set in their {{selfish|स्वार्थी}} ways.","hi":"“मैं किसी अजनबी से बात नहीं करूँगा,” सुंदर विलो ने कहा। तीनों पेड़ ऊँचे और घमंडी खड़े रहे, अपने स्वार्थी स्वभाव में अड़े हुए।"},{"en":"That night, the North Wind blew his way through the forest. He huffed and he puffed, his icy breath felling the leaves in scores.","hi":"उस रात उत्तरी हवा जंगल में से बहती गई। वह हाँफी-फूँकी, और उसकी बर्फ़ीली साँस ने ढेरों पत्ते गिरा दिए।"},{"en":"He wanted to touch every leaf, so he asked his father, the Frost King, if he could. \"No,\" said the Frost King.","hi":"वह हर पत्ते को छूना चाहती थी, इसलिए उसने अपने पिता, पाला-राजा, से पूछा कि क्या वह ऐसा कर सकती है। “नहीं,” पाला-राजा ने कहा।"}],[{"en":"\"Spare the trees which were kind to the little swallow with the broken wing. They may keep their leaves.\"","hi":"“उन पेड़ों को बख़्श दो जो टूटे पंख वाली नन्हीं अबाबील के प्रति दयालु थे। वे अपने पत्ते रख सकते हैं।”"},{"en":"Thus by the order of the Frost King, the spruce, pine and juniper got to keep their leaves all through the winter, while the other trees lost their {{foliage|पत्तियाँ}}. This is why evergreen trees keep their leaves all through the year, winter or summer!","hi":"इस तरह पाला-राजा के आदेश से स्प्रूस, चीड़ और जूनिपर अपने पत्ते पूरी सर्दी रख पाए, जबकि दूसरे पेड़ों ने अपने पत्ते खो दिए। इसीलिए सदाबहार पेड़ पूरे साल, सर्दी हो या गर्मी, अपने पत्ते रखते हैं!"}]],"vocab":[["frolic","verb","उछल-कूद करना","play, romp","sulk","to play and move about happily"],["glee","noun","उल्लास","joy, delight","sorrow","great delight, often from someone’s misfortune"],["shrivel","verb","मुरझाना, सिकुड़ना","wither, wilt","swell","to become dry and wrinkled"],["shiver","verb","ठंड से काँपना","tremble, shake","—","to shake slightly from cold or fear"],["clime","noun","इलाक़ा, जलवायु वाला क्षेत्र","region, climate","—","a region with a particular climate"],["fend","verb","अपना ख़याल रखना","provide, manage","depend","to take care of oneself without help"],["slender","adj","पतला, छरहरा","slim, lean","stout","gracefully thin"],["frown","verb","त्योरियाँ चढ़ाना","scowl, glower","smile","to wrinkle the forehead in displeasure"],["begone","interj","दफ़ा हो जा","go away, scram","come","a command to leave at once"],["majestic","adj","शानदार, भव्य","grand, stately","humble","having impressive beauty or dignity"],["sturdy","adj","मज़बूत, पुख़्ता","strong, robust","frail","strongly built"],["bough","noun","बड़ी डाली","branch, limb","trunk","a large branch of a tree"],["grunt","verb","घुरघुराना","growl, snort","—","to make a low rough sound"],["disheartened","adj","हताश","discouraged, dejected","encouraged","having lost hope or confidence"],["flutter","verb","पंख फड़फड़ाना","flap, flit","—","to flap wings lightly and quickly"],["sway","verb","लहराना, झूमना","swing, rock","stand still","to move slowly from side to side"],["timidly","adv","झिझकते हुए","shyly, nervously","boldly","in a shy and fearful way"],["haughtily","adv","अकड़कर","arrogantly, proudly","humbly","in a proud and scornful manner"],["selfish","adj","स्वार्थी","self-centred, greedy","generous","caring only about oneself"],["foliage","noun","पत्तियाँ, पर्णसमूह","leaves, greenery","—","the leaves of a plant or tree"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["take pity on","पर तरस खाना","The spruce took pity on the swallow.","to feel sorry for and help"],["chip in","हाथ बँटाना, योगदान देना","The juniper chipped in with berries.","to contribute help or money"],["at long last","आख़िरकार","At long last, he felt safe.","finally, after a long delay"]],"fq":[]},{"id":"ev-ed426","title":"“Androcles and the Lion”","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"Androcles was a Roman slave. When he was very young, his master took him to northern Africa.","hi":"एंड्रोक्लीज़ एक रोमन ग़ुलाम था। जब वह बहुत छोटा था, उसका मालिक उसे उत्तरी अफ़्रीका ले गया।"},{"en":"His master was a cruel man, who {{flogged|कोड़े मारता था}} him {{mercilessly|बेरहमी से}} and almost always without reason. Androcles hated his master and often thought of running away.","hi":"उसका मालिक क्रूर आदमी था, जो उसे बेरहमी से कोड़े मारता था और लगभग हमेशा बिना कारण। एंड्रोक्लीज़ अपने मालिक से नफ़रत करता था और अक्सर भाग जाने की सोचता था।"},{"en":"One dark, moonless night, Androcles left his master's house. Hiding his face in a blanket, he crept {{stealthily|चुपके-चुपके}} out of town.","hi":"एक अँधेरी, चाँदनी-रहित रात एंड्रोक्लीज़ ने मालिक का घर छोड़ दिया। कंबल में चेहरा छिपाकर वह चुपके-चुपके शहर से बाहर निकल गया।"}],[{"en":"When day broke, Androcles found himself in a desert. After walking for hours in the sun, he came upon a cave.","hi":"दिन निकलने पर एंड्रोक्लीज़ ने ख़ुद को एक रेगिस्तान में पाया। घंटों धूप में चलने के बाद उसे एक गुफा मिली।"},{"en":"It was empty. He was {{thrilled|बहुत ख़ुश}} to find a place where he could rest for a while.","hi":"वह ख़ाली थी। उसे बहुत ख़ुशी हुई कि थोड़ी देर आराम करने की जगह मिल गई।"},{"en":"So {{weary|थका हुआ}} was he that he fell asleep the moment his head touched the floor. A little later, Androcles woke up hearing a loud, {{piercing|कान फाड़ने वाली}} roar.","hi":"वह इतना थका था कि सिर ज़मीन से लगते ही सो गया। थोड़ी देर बाद एंड्रोक्लीज़ की नींद एक तेज़, कान फाड़ने वाली दहाड़ से खुली।"}],[{"en":"He jumped up with fright when he saw a huge, {{tawny|भूरा-पीला}} lion with a thick {{mane|अयाल}} standing at the entrance of the cave. Terror ran down his spine and he {{shuddered|काँप उठा}} as he realized that the place he had chosen to rest was a lion’s {{den|माँद}}.","hi":"गुफा के मुँह पर घने अयाल वाले एक विशाल, भूरे-पीले शेर को खड़ा देखकर वह डर से उछल पड़ा। उसकी रीढ़ में सिहरन दौड़ गई और वह काँप उठा जब उसे एहसास हुआ कि आराम के लिए उसने जो जगह चुनी थी, वह शेर की माँद थी।"},{"en":"There was no chance of escape as the animal stood blocking the cave’s opening. Androcles waited hopelessly for the lion to spring upon him and was surprised when the beast sat down, moaning and licking its front paw.","hi":"बच निकलने की कोई गुंजाइश नहीं थी क्योंकि जानवर गुफा का मुँह रोककर खड़ा था। एंड्रोक्लीज़ निराशा में इंतज़ार करता रहा कि शेर उस पर कूद पड़ेगा, और हैरान हुआ जब जानवर बैठ गया, कराहता और अपना आगे का पंजा चाटता हुआ।"},{"en":"He noticed then that the lion’s paw was bleeding {{profusely|बहुत ज़्यादा}}. Forgetting his fear, Androcles went up to the lion.","hi":"तब उसने देखा कि शेर के पंजे से बहुत ख़ून बह रहा था। अपना डर भूलकर एंड्रोक्लीज़ शेर के पास गया।"}],[{"en":"He saw that a huge thorn had {{wedged|धँस गया था}} its way into the lion's paw, cutting it and making it swell. The lion held up its wounded paw as if it were begging Androcles to relieve it of its misery.","hi":"उसने देखा कि एक बड़ा काँटा शेर के पंजे में धँस गया था, जिससे वह कट गया और सूज गया। शेर ने अपना घायल पंजा ऐसे उठाया मानो एंड्रोक्लीज़ से अपने दुख को दूर करने की भीख माँग रहा हो।"},{"en":"With a quick, {{deft|कुशल}} movement, Androcles drew out the thorn. “Ah, there!","hi":"एक तेज़, कुशल हरकत से एंड्रोक्लीज़ ने काँटा खींच निकाला। “लो, हो गया!"},{"en":"It’s out! Now you shan’t have any pain,” he said softly.","hi":"निकल गया! अब तुम्हें दर्द नहीं होगा,” उसने नरमी से कहा।"}],[{"en":"The lion limped out of the cave but returned a few minutes later with a dead rabbit, which it put down in front of Androcles. “Thank you, my friend.","hi":"शेर लँगड़ाता हुआ गुफा से बाहर गया पर कुछ मिनट बाद एक मरा हुआ ख़रगोश लेकर लौटा, जिसे उसने एंड्रोक्लीज़ के सामने रख दिया। “धन्यवाद, मेरे दोस्त।"},{"en":"How did you know I was starving?” he said and gratefully set about cooking the rabbit. When he had finished eating, the lion led him to a place where fresh water {{gushed|फूट रहा था}} out from a spring.","hi":"तुम्हें कैसे पता कि मैं भूखा मर रहा था?” उसने कहा और कृतज्ञता से ख़रगोश पकाने लगा। जब वह खा चुका, तो शेर उसे ऐसी जगह ले गया जहाँ एक सोते से ताज़ा पानी फूट रहा था।"},{"en":"Overcome by the lion's kindness, Androcles decided to break journey and stay for a while with the beast. The two became good friends.","hi":"शेर की दया से अभिभूत होकर एंड्रोक्लीज़ ने यात्रा रोककर कुछ समय शेर के साथ रहने का फ़ैसला किया। दोनों अच्छे दोस्त बन गए।"}],[{"en":"They would hunt together and eat together. At the end of the day, the lion would lie down at Androcles' feet, wagging its tail from side to side.","hi":"वे साथ शिकार करते और साथ खाते। दिन के अंत में शेर एंड्रोक्लीज़ के पैरों के पास लेट जाता, अपनी पूँछ इधर-उधर हिलाता।"},{"en":"Years passed and then Androcles began to get {{restless|बेचैन}}. He longed to get back to Rome, and one day, he bade a fond farewell to the lion and left.","hi":"साल बीते और फिर एंड्रोक्लीज़ बेचैन होने लगा। उसे रोम लौटने की तड़प थी, और एक दिन उसने शेर को प्यार से विदा कहा और चल पड़ा।"},{"en":"On the way, he was captured by Roman soldiers, and taken to Rome as a {{fugitive|भगोड़ा}}. The ancient Romans were cruel to runaway slaves and Androcles was {{sentenced|सज़ा सुनाई गई}} to death.","hi":"रास्ते में रोमन सैनिकों ने उसे पकड़ लिया और भगोड़े के रूप में रोम ले गए। प्राचीन रोमन भागे हुए ग़ुलामों के प्रति निर्दयी थे और एंड्रोक्लीज़ को मौत की सज़ा सुनाई गई।"}],[{"en":"Androcles was taken to an arena, where hundreds of people had gathered to watch him get killed by wild beasts. The Emperor of Rome sat on a {{dais|ऊँचा चबूतरा}}, surrounded by his senators.","hi":"एंड्रोक्लीज़ को अखाड़े में ले जाया गया, जहाँ सैकड़ों लोग उसे जंगली जानवरों के हाथों मरते देखने इकट्ठा हुए थे। रोम का सम्राट अपने सीनेटरों से घिरा एक ऊँचे चबूतरे पर बैठा था।"},{"en":"Everyone watched as the guards pushed Androcles into the arena. “Here, take this to defend yourself!” a soldier barked into Androcles’s ear, whilst thrusting a lance into his hand.","hi":"सब देख रहे थे जब पहरेदारों ने एंड्रोक्लीज़ को अखाड़े में धकेला। “ले, अपनी रक्षा के लिए यह ले!” एक सैनिक ने एंड्रोक्लीज़ के हाथ में बरछी थमाते हुए उसके कान में चिल्लाकर कहा।"},{"en":"Androcles trembled with fear when he saw a lion being let out of a cage. The lion had been purposely kept without food for several days.","hi":"जब एंड्रोक्लीज़ ने एक शेर को पिंजरे से छोड़ा जाता देखा तो वह डर से काँप उठा। शेर को जानबूझकर कई दिनों से भूखा रखा गया था।"}],[{"en":"With a {{savage|क्रूर}} roar, it bounded towards Androcles, ready to {{devour|निगल जाना}} him. There was a stunned silence when the lion instead of pouncing on Androcles, began to wag its tail and lick his hands.","hi":"क्रूर दहाड़ के साथ वह एंड्रोक्लीज़ की ओर लपका, उसे निगल जाने को तैयार। जब शेर ने एंड्रोक्लीज़ पर झपटने के बजाय पूँछ हिलाना और उसके हाथ चाटना शुरू किया, तो स्तब्ध सन्नाटा छा गया।"},{"en":"Androcles realized to his joy that the lion was his friend, from whose paw he had removed the nasty thorn. The Emperor told a slave to bring Androcles to the dais.","hi":"एंड्रोक्लीज़ को ख़ुशी से एहसास हुआ कि शेर उसका दोस्त है, जिसके पंजे से उसने वह कष्टदायक काँटा निकाला था। सम्राट ने एक ग़ुलाम से कहा कि एंड्रोक्लीज़ को चबूतरे तक लाया जाए।"},{"en":"“What did you do to the lion?” he asked. “How’s that it did not kill you?”","hi":"“तुमने शेर के साथ क्या किया?” उसने पूछा। “उसने तुम्हें मारा क्यों नहीं?”"}],[{"en":"Androcles told the emperor of how he had met and lived with the lion for three years. The emperor was touched.","hi":"एंड्रोक्लीज़ ने सम्राट को बताया कि वह शेर से कैसे मिला और तीन साल उसके साथ रहा। सम्राट भावुक हो गया।"},{"en":"He set Androcles free and also gave him a sack full of gold coins. Androcles lived the rest of his life in Rome with the faithful lion as his companion.","hi":"उसने एंड्रोक्लीज़ को आज़ाद कर दिया और उसे सोने के सिक्कों से भरी एक थैली भी दी। एंड्रोक्लीज़ ने अपनी बाक़ी ज़िंदगी रोम में वफ़ादार शेर को साथी बनाकर बिताई।"}]],"vocab":[["flog","verb","कोड़े मारना","whip, lash","—","to beat with a whip or stick"],["mercilessly","adv","बेरहमी से","cruelly, ruthlessly","kindly","without any pity"],["stealthily","adv","चुपके-चुपके","secretly, furtively","openly","quietly and secretly so as not to be noticed"],["thrilled","adj","बहुत ख़ुश, रोमांचित","delighted, excited","bored","very excited and pleased"],["weary","adj","थका हुआ","tired, exhausted","energetic","very tired"],["piercing","adj","कान फाड़ने वाला","shrill, sharp","soft","loud and high in a painful way"],["tawny","adj","भूरा-पीला","tan, yellowish-brown","—","brownish-yellow in colour"],["mane","noun","अयाल","long hair, ruff","—","the long hair on a lion’s or horse’s neck"],["shudder","verb","काँप उठना","tremble, shiver","steady","to shake suddenly from fear or disgust"],["den","noun","माँद","lair, burrow","—","the home of a wild animal such as a lion"],["profusely","adv","बहुतायत से","abundantly, heavily","sparingly","in large amounts"],["wedge","verb","धँसना, अटकना","jam, lodge","free","to be firmly stuck in a narrow space"],["deft","adj","कुशल, फुर्तीला","skilful, adroit","clumsy","quick and skilful in movement"],["gush","verb","फूट पड़ना, बह निकलना","spurt, stream","trickle","to flow out suddenly in large amounts"],["restless","adj","बेचैन","uneasy, fidgety","calm","unable to rest or stay still"],["fugitive","noun","भगोड़ा","runaway, escapee","captive","a person who is running away from capture"],["sentence","verb","सज़ा सुनाना","condemn, punish","acquit","to declare a punishment in court"],["dais","noun","ऊँचा चबूतरा","platform, stage","—","a raised platform in a hall"],["savage","adj","क्रूर, हिंसक","fierce, brutal","gentle","wild, cruel and violent"],["devour","verb","निगल जाना, चट कर जाना","gobble, consume","nibble","to eat something hungrily and completely"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["run away","भाग जाना","He often thought of running away.","to escape from a place"],["come upon","अचानक मिल जाना","He came upon a cave.","to find by chance"],["set free","आज़ाद करना","The emperor set him free.","to release someone"]],"fq":[]},{"id":"ev-ed429","title":"Blackcat Blues","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"I talk to cats. I can tell what they are thinking, by a {{twitch|फड़कन}} of the ear, a {{flick|झटक}} of the tail, half shut eyes.","hi":"मैं बिल्लियों से बात करता हूँ। कान की फड़कन, पूँछ की झटक, आधी बंद आँखों से मैं बता सकता हूँ कि वे क्या सोच रही हैं।"},{"en":"I do it back and they get dead worried. Cats like their secrets.","hi":"मैं भी वैसा करके दिखाता हूँ तो वे बहुत घबरा जाती हैं। बिल्लियों को अपने राज़ पसंद हैं।"},{"en":"Some secrets are big ones. I had read stuff about black panthers in the wild.","hi":"कुछ राज़ बड़े होते हैं। मैंने जंगल में काले तेंदुओं के बारे में पढ़ा था।"}],[{"en":"I didn't think much of it. So when I crossed a field on Dad's farm and saw a big black cat, I {{reckoned|समझा}} it was a {{moggie|आम घरेलू बिल्ली}}, fifty metres away.","hi":"मैंने इसे ज़्यादा गंभीरता से नहीं लिया। इसलिए जब मैं पापा के खेत में एक मैदान पार कर रहा था और मुझे एक बड़ी काली बिल्ली दिखी, तो मैंने समझा कि वह पचास मीटर दूर कोई आम घरेलू बिल्ली है।"},{"en":"Then I realized it was two hundred metres away and it wasn't a moggie. Cool, we had a leopard in the neighbourhood.","hi":"फिर मुझे पता चला कि वह दो सौ मीटर दूर थी और आम बिल्ली नहीं थी। वाह, हमारे पड़ोस में तेंदुआ था।"},{"en":"I nearly ran home to tell everybody when I had a thought. Dad keeps sheep and goats.","hi":"मैं सबको बताने घर भागने ही वाला था कि एक ख़याल आया। पापा भेड़ें और बकरियाँ पालते हैं।"}],[{"en":"Bad news. Next day I went to the field for another look, nothing there.","hi":"बुरी ख़बर। अगले दिन मैं दोबारा देखने मैदान गया, वहाँ कुछ नहीं था।"},{"en":"I {{trudged|थके क़दमों से चला}} along the {{hedge|बाड़ (झाड़ी की)}}. Nothing.","hi":"मैं बाड़ के साथ-साथ थके क़दमों से चलता रहा। कुछ नहीं।"},{"en":"Then I saw something dirty white in a bush. A {{heap|ढेर}} of wool.","hi":"फिर मुझे एक झाड़ी में कुछ गंदा सफ़ेद दिखा। ऊन का ढेर।"}],[{"en":"The rest of the sheep was lying underneath. I looked around.","hi":"बाक़ी भेड़ उसके नीचे पड़ी थी। मैंने चारों ओर देखा।"},{"en":"\"Come on, I said quietly \"I know you're there. It's all right.\"","hi":"“आ जाओ,” मैंने धीरे से कहा, “मुझे पता है तुम वहाँ हो। कोई बात नहीं।”"},{"en":"Suddenly he was in front of me. Black and shiny with {{fierce|तेज़, उग्र}} yellow eyes.","hi":"अचानक वह मेरे सामने था। काला और चमकदार, तेज़ पीली आँखों वाला।"}],[{"en":"\"Hi puss,\" I said, lowering my head and half closing my eyes.","hi":"“हाय पूसी,” मैंने कहा, सिर झुकाते हुए और आँखें आधी बंद करते हुए।"},{"en":"He made a {{rumbling|गुर्राने जैसी}} noise. \"Look,\"","hi":"उसने गुर्राने जैसी आवाज़ निकाली। “देखो,”"},{"en":"I said, \"I guess you've got to eat, but this is real bad.\" He {{sniffed|सूँघा}} the dead sheep.","hi":"मैंने कहा, “मुझे पता है तुम्हें खाना है, पर यह बहुत बुरी बात है।” उसने मरी भेड़ को सूँघा।"}],[{"en":"I heard the sound of Dad's Land Rover bumping across the field. He jumped out \"You'd better be careful with the cat,\" he said.","hi":"मुझे पापा की लैंड रोवर के मैदान में हिचकोले खाते आने की आवाज़ सुनाई दी। वे बाहर कूदे, “बिल्ली से सावधान रहना,” उन्होंने कहा।"},{"en":"\"Don't know how safe he is I couldn't believe it. \"You knew?\"","hi":"“पता नहीं वह कितनी सुरक्षित है,” मुझे यक़ीन नहीं हुआ। “आपको पता था?”"},{"en":"\"Yeah, I don't miss much on this farm. We've got a deal, him and me.","hi":"“हाँ, इस खेत में मेरी नज़र से कुछ नहीं बचता। हमारे बीच एक समझौता है, उसका और मेरा।"}],[{"en":"If a sheep dies, I {{chuck|फेंकना}} it under the hedge and he eats it. Otherwise he eats rabbits or he's in trouble I was {{stunned|स्तब्ध}}.","hi":"अगर कोई भेड़ मर जाए, तो मैं उसे बाड़ के नीचे फेंक देता हूँ और वह खा लेता है। वरना वह ख़रगोश खाता है या मुसीबत में पड़ता है।” मैं स्तब्ध रह गया।"},{"en":"\"You didn't say \"Nobody must know or he'll get shot. He's scared already, frightened of being hurt, {{miserable|दुखी}} because he's alone.","hi":"“आपने बताया नहीं।” “किसी को पता नहीं चलना चाहिए वरना उसे गोली मार दी जाएगी। वह पहले से डरा हुआ है, चोट लगने से घबराता है, अकेला होने से दुखी है।"},{"en":"You keep quiet and keep away from the field. Now get in and let's leave him alone.\"","hi":"तुम चुप रहना और मैदान से दूर रहना। अब अंदर बैठो और चलो उसे अकेला छोड़ दें।”"}],[{"en":"\"But how would you know all this?\" Dad flicked a lever into the four wheel drive and we {{slithered|फिसलते हुए चले}} through the mud.","hi":"“पर आपको यह सब कैसे पता?” पापा ने चार-पहिया ड्राइव का लीवर घुमाया और हम कीचड़ में फिसलते निकले।"},{"en":"\"You're not the only one who can talk to cats,\" he said. I kept away a week then went for another look.","hi":"“तुम अकेले नहीं हो जो बिल्लियों से बात कर सकते हो,” उन्होंने कहा। मैं एक हफ़्ता दूर रहा, फिर दोबारा देखने गया।"},{"en":"Dad had put a dead lamb under the hedge and I leant against a tree watching. I saw the cat coming this time, low in an {{overgrown|झाड़ियों से भरी}} {{ditch|खाई}}.","hi":"पापा ने बाड़ के नीचे एक मरा हुआ मेमना रखा था और मैं एक पेड़ से टिककर देखता रहा। इस बार मैंने बिल्ली को आते देखा, झाड़ियों से भरी खाई में झुकी हुई।"}],[{"en":"It stopped, ears back, {{snarling|गुर्राती हुई}} and showing its teeth. \"Easy boy\"","hi":"वह रुक गई, कान पीछे, दाँत दिखाकर गुर्राती हुई। “आराम से, लड़के,”"},{"en":"I said. \"You know me.","hi":"मैंने कहा। “तुम मुझे जानते हो।"},{"en":"I did the head down {{submission|समर्पण}} bit. The cat started {{inching|धीरे-धीरे सरकना}} towards me, swinging its tail, the {{pupils|आँखों की पुतलियाँ}} of its eyes large back legs shuffling for grip.","hi":"मैंने सिर झुकाकर समर्पण का इशारा किया। बिल्ली धीरे-धीरे मेरी ओर बढ़ने लगी, पूँछ हिलाती हुई, आँखों की पुतलियाँ बड़ी, पिछले पैर पकड़ पाने को घिसटते हुए।"}],[{"en":"A voice in my head told me to run; another voice kept saying don't move. \"It's all right, you know me,\" whispered.","hi":"मेरे सिर में एक आवाज़ ने भागने को कहा; दूसरी बार-बार कहती रही हिलना मत। “सब ठीक है, तुम मुझे जानते हो,” मैंने फुसफुसाया।"},{"en":"Then I realized. This one was small, a different leopard.","hi":"तभी मुझे समझ आया। यह छोटा था, एक अलग तेंदुआ।"},{"en":"That was my only thought as it charged. I just sort of stood and watched.","hi":"जब वह झपटा, तब यही मेरा अकेला विचार था। मैं बस जैसे खड़ा रहा और देखता रहा।"}],[{"en":"It was so quick. But not as quick as the other cat which hit it in mid-air as it leapt.","hi":"वह बहुत तेज़ था। पर उस दूसरी बिल्ली जितना नहीं जो हवा में कूदते ही उससे टकराई।"},{"en":"The force rolled them away into the bushes, crashing down, spitting, snarling, growling. Then it all went quiet.","hi":"ज़ोर से वे दोनों लुढ़कते हुए झाड़ियों में जा गिरे, धमाके से, थूकते, गुर्राते, दहाड़ते। फिर सब शांत हो गया।"},{"en":"The big one got up and stood over the little one which was calming down. Then very gently he began to lick its face.","hi":"बड़ा वाला उठा और छोटे के ऊपर खड़ा हो गया जो अब शांत हो रहा था। फिर बहुत प्यार से वह उसका चेहरा चाटने लगा।"}],[{"en":"He looked up at me and half closed his eyes. I did the same.","hi":"उसने मेरी ओर देखा और आँखें आधी बंद कीं। मैंने भी वैसा ही किया।"},{"en":"\"Thanks\" I said.","hi":"“शुक्रिया,” मैंने कहा।"},{"en":"\"That was brilliant. You'll tell her about the deal with Dad, won't you?.","hi":"“वह शानदार था। आप उसे पापा के साथ हमारे समझौते के बारे में बता देंगे, है ना?”"}]],"vocab":[["twitch","noun","फड़कन","jerk, tic","—","a small sudden movement of a muscle"],["flick","noun","झटक","flip, snap","—","a quick light movement"],["reckon","verb","समझना, अनुमान लगाना","think, suppose","doubt","to think or believe something"],["moggie","noun","आम घरेलू बिल्ली (बोलचाल)","domestic cat","—","an ordinary cat (British informal)"],["trudge","verb","थके क़दमों से चलना","plod, tramp","stride","to walk slowly with heavy steps"],["hedge","noun","बाड़ (झाड़ियों की)","fence, row of bushes","—","a line of bushes planted as a boundary"],["heap","noun","ढेर","pile, mound","scatter","an untidy pile of things"],["fierce","adj","तेज़, उग्र","savage, ferocious","gentle","wild, aggressive or very intense"],["rumble","verb","गुर्राना, गड़गड़ाना","growl, boom","—","to make a deep continuous sound"],["sniff","verb","सूँघना","smell, inhale","—","to breathe in through the nose to smell"],["chuck","verb","फेंक देना (बोलचाल)","toss, throw","keep","to throw something carelessly"],["stunned","adj","स्तब्ध","shocked, amazed","unmoved","so surprised that one cannot react"],["miserable","adj","दुखी","unhappy, wretched","cheerful","very unhappy or uncomfortable"],["slither","verb","फिसलना, सरकना","slide, glide","—","to slide along a surface"],["overgrown","adj","झाड़ियों से भरा","weedy, tangled","trimmed","covered with plants that have grown wild"],["ditch","noun","खाई, गड्ढा","trench, drain","—","a long narrow channel dug in the ground"],["snarl","verb","दाँत दिखाकर गुर्राना","growl, bare teeth","purr","to growl while showing the teeth"],["submission","noun","समर्पण","surrender, obedience","defiance","the act of yielding to another"],["inch","verb","धीरे-धीरे सरकना","creep, edge","rush","to move very slowly and carefully"],["pupil","noun","आँख की पुतली","eye opening","—","the black round opening in the centre of the eye"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["come on","चलो, आ जाओ","“Come on,” I said quietly.","used to encourage someone"],["keep quiet","चुप रहना","You keep quiet about this.","to say nothing"],["keep away","दूर रहना","Keep away from the field.","to avoid going near"]],"fq":[]},{"id":"ev-ed438","title":"Don’t get in the way of a charging bull","src":"Evergreen library · Topic: Health & Environment","c":"Health & Environment","todo":"","ed":[[{"en":"It is our nature to compare, compete, and feel {{dejected|निराश}}, especially when we see others having more money, property, better relationships, or good health. We then try to find {{flaws|कमियाँ}} in their lives, look for something wrong with them, and {{assert|जताना}} or deny what we want and who we are.","hi":"तुलना करना, होड़ लगाना और निराश होना हमारा स्वभाव है, ख़ासकर जब हम दूसरों को ज़्यादा पैसा, संपत्ति, बेहतर रिश्ते या अच्छी सेहत के साथ देखते हैं। तब हम उनकी ज़िंदगी में कमियाँ ढूँढते हैं, उनमें कुछ ग़लत तलाशते हैं, और जो हम चाहते हैं और जो हम हैं, उसे जताते या नकारते हैं।"},{"en":"This creates inner conflict, leading to pain. Nothing is {{discordant|बेसुरा}} in nature.","hi":"इससे भीतर का टकराव पैदा होता है, जिससे दर्द होता है। प्रकृति में कुछ भी बेसुरा नहीं है।"},{"en":"But most of us would say that life is not always fair. We hold {{grudges|गाँठ बाँधना}} against people, events, occurrences, and circumstances.","hi":"लेकिन हम में से ज़्यादातर कहेंगे कि ज़िंदगी हमेशा न्यायपूर्ण नहीं होती। हम लोगों, घटनाओं और हालात के प्रति गाँठ बाँधे रखते हैं।"}],[{"en":"Life or existence is neither fair nor unfair. Swami Vivekanand says that not even an atom in this universe can be different from what it is now, for that would destroy the balance of the universe, and the entire system would collapse.","hi":"जीवन या अस्तित्व न तो न्यायपूर्ण है, न अन्यायपूर्ण। स्वामी विवेकानंद कहते हैं कि इस ब्रह्मांड में एक परमाणु तक अपने मौजूदा रूप से अलग नहीं हो सकता, क्योंकि इससे ब्रह्मांड का संतुलन बिगड़ जाएगा और पूरी व्यवस्था ढह जाएगी।"},{"en":"We worry about drowning in a sea of challenges, problems and roadblocks. The Buddha refused to get drawn into conflict with a man on the street who had {{abused|गाली दी}} him.","hi":"हम चुनौतियों, समस्याओं और रुकावटों के समंदर में डूबने की चिंता करते हैं। बुद्ध ने सड़क पर एक ऐसे आदमी से टकराव में उलझने से इनकार कर दिया जिसने उन्हें गाली दी थी।"},{"en":"When his {{disciples|शिष्य}} asked him why he did not react, he said, “He is free to say what he wants, but it is my choice to receive what he says or return it. I chose not to take it, so I was free”.","hi":"जब उनके शिष्यों ने पूछा कि उन्होंने प्रतिक्रिया क्यों नहीं दी, तो उन्होंने कहा, “वह जो चाहे कहने को आज़ाद है, पर उसकी बात लेना या लौटा देना मेरी पसंद है। मैंने न लेना चुना, इसलिए मैं आज़ाद रहा।”"}],[{"en":"In the Bhagwad Gita, Krishn says, ‘Yaha sarvatra anabhis snehaha, (2.57)’ – don’t get {{attached|जुड़े हुए}} to success or failure. When you are not connected to success or failure, you are at peace with whatever is to be – shubh ashubham , good or bad.","hi":"भगवद्गीता में कृष्ण कहते हैं, ‘यः सर्वत्रानभिस्नेहः’ (2.57), यानी सफलता या असफलता से जुड़ाव मत रखो। जब तुम सफलता या असफलता से जुड़े नहीं होते, तब जो भी हो, शुभ या अशुभ, अच्छा या बुरा, तुम शांत रहते हो।"},{"en":"Krishn says that we must increase our awareness, inner silence, and calmness. Once we learn to do this, we will be able to {{navigate|राह निकालना}} through life’s {{myriad|असंख्य}} challenges with ease and {{composure|संतुलन, धैर्य}}.","hi":"कृष्ण कहते हैं कि हमें अपनी जागरूकता, भीतर की शांति और स्थिरता बढ़ानी चाहिए। एक बार यह सीख लें तो हम जीवन की असंख्य चुनौतियों में सहजता और संतुलन के साथ राह निकाल पाएँगे।"},{"en":"When we begin to skilfully navigate the pathways that life creates for us smoothly, we will find that, just like practising driving through a {{rugged|ऊबड़-खाबड़}} {{terrain|इलाक़ा}}, a certain skill will be enhanced. Within us, there are infinite energies to help resolve all kinds of conflicts – big or small.","hi":"जब हम जीवन के बनाए रास्तों में कुशलता से आसानी से राह निकालना शुरू करते हैं, तो पाएँगे कि जैसे ऊबड़-खाबड़ इलाक़े में गाड़ी चलाने का अभ्यास करने से कोई कौशल निखरता है, वैसे ही हमारा कौशल भी बढ़ेगा। हमारे भीतर हर तरह के टकराव, बड़े या छोटे, सुलझाने की अनंत ऊर्जाएँ हैं।"}],[{"en":"Life is like a river; it is constantly moving. Move with grace.","hi":"जीवन नदी जैसा है; वह लगातार बहता रहता है। सहजता से आगे बढ़ो।"},{"en":"Be flexible like a river. A river goes ahead despite obstacles.","hi":"नदी की तरह लचीले बनो। नदी रुकावटों के बावजूद आगे बढ़ती है।"},{"en":"At some point, we all enjoyed the music a river makes as it flows. The river makes music even as it lives with rocks and obstacles that {{hinder|रोकना}} its path.","hi":"कभी न कभी हम सबने नदी के बहने से बनने वाले संगीत का आनंद लिया है। नदी चट्टानों और बाधाओं के साथ रहकर भी, जो उसका रास्ता रोकती हैं, संगीत रचती है।"}],[{"en":"The river passes them, {{caresses|सहलाती है}} them continuously, and, in the process, smoothens their rough edges. It also makes music as it {{gurgles|कलकल करती है}} towards its destination.","hi":"नदी उन्हें पार करती है, लगातार सहलाती है और इस प्रक्रिया में उनके खुरदरे किनारों को चिकना कर देती है। वह मंज़िल की ओर कलकल करती बहते हुए संगीत भी रचती है।"},{"en":"Once, a king walking along a narrow street had to give way to a charging bull. He could not tell the bull, “Get out of the way, I am the king of this area.”","hi":"एक बार एक राजा तंग गली से जा रहा था और उसे सामने से आते बैल के लिए रास्ता देना पड़ा। वह बैल से नहीं कह सका, “रास्ते से हट जा, मैं इस इलाक़े का राजा हूँ।”"},{"en":"{{Metaphorically|रूपक में}} speaking, all people who wish to clash with us are like that bull. Therefore, to avoid a clash, we must wisely get out of the way.","hi":"रूपक में कहें तो हमसे टकराने की इच्छा रखने वाले सब लोग उसी बैल जैसे हैं। इसलिए टकराव से बचने के लिए हमें समझदारी से रास्ते से हट जाना चाहिए।"}],[{"en":"Living in {{harmony|तालमेल, सद्भाव}} with our surroundings and circumstances brings inward peace and {{poise|संतुलन}}. When we maintain poise, problems and challenges {{vanish|ग़ायब हो जाना}} like mist before the rising sun.","hi":"अपने परिवेश और हालात के साथ तालमेल में रहने से भीतर की शांति और संतुलन आता है। जब हम संतुलन बनाए रखते हैं, तो उगते सूरज के सामने कोहरे की तरह समस्याएँ और चुनौतियाँ ग़ायब हो जाती हैं।"},{"en":"In a symbolic sense, we must remember to get out of the way of a charging bull so that we can continue to lead a life of harmony and peace.","hi":"प्रतीकात्मक अर्थ में हमें याद रखना चाहिए कि दौड़ते बैल के रास्ते से हट जाएँ, ताकि हम सद्भाव और शांति भरा जीवन जी सकें।"}]],"vocab":[["dejected","adj","निराश, उदास","downcast, glum","cheerful","sad and without hope"],["flaw","noun","कमी, दोष","defect, fault","perfection","a fault that spoils something"],["assert","verb","दृढ़ता से कहना, जताना","declare, claim","deny","to state something firmly"],["discordant","adj","बेसुरा, बेमेल","clashing, jarring","harmonious","not in agreement or harmony"],["grudge","noun","गाँठ, बैर","resentment, spite","goodwill","a feeling of resentment kept for a long time"],["disciple","noun","शिष्य","follower, student","teacher","a person who follows a teacher’s beliefs"],["abuse","verb","गाली देना, बुरा बर्ताव करना","insult, mistreat","praise","to speak to or treat someone cruelly"],["attached","adj","जुड़ा हुआ","bonded, fond","detached","emotionally connected to something"],["myriad","adj","असंख्य","countless, innumerable","few","very many"],["composure","noun","धैर्य, संतुलन","calmness, poise","agitation","a calm and controlled state of mind"],["navigate","verb","राह निकालना","steer, guide","drift","to find a way through something difficult"],["rugged","adj","ऊबड़-खाबड़","rough, uneven","smooth","having a rough, uneven surface"],["terrain","noun","भूभाग, इलाक़ा","ground, land","—","a stretch of land with its natural features"],["hinder","verb","रोकना, बाधा डालना","obstruct, hamper","help","to make progress difficult"],["caress","verb","सहलाना","stroke, fondle","strike","to touch gently and lovingly"],["gurgle","verb","कलकल करना","babble, ripple","—","to make a low bubbling sound like water"],["metaphorically","adv","रूपक के तौर पर","figuratively, symbolically","literally","in a way that uses an image to explain an idea"],["poise","noun","संतुलन, गरिमा","balance, composure","clumsiness","a calm, steady and graceful manner"],["harmony","noun","तालमेल, सद्भाव","accord, unity","conflict","a state of peaceful agreement"],["vanish","verb","ग़ायब होना","disappear, fade","appear","to disappear suddenly"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["give way","रास्ता देना, झुक जाना","The king had to give way to the bull.","to allow someone to pass or to yield"],["get out of the way","रास्ते से हट जाना","Get out of the way of the charging bull.","to move aside"],["in the process","इसी दौरान","The river smoothens rocks in the process.","while doing something"]],"fq":[]}]}];
const $=i=>document.getElementById(i);
const mk=s=>s.replace(/\{\{(.+?)\|(.+?)\}\}/g,'<span class="hw" tabindex="0" data-w="$1">$1<span class="hh"> ($2)</span></span>');
const ALL=[].concat(...DAYS.map(d=>[].concat(...d.articles.map(a=>a.vocab))));
const lk=w=>{w=w.toLowerCase();return ALL.find(v=>v[0]==w)||ALL.find(v=>v[0].slice(0,5)==w.slice(0,5))||ALL.find(v=>w.startsWith(v[0].slice(0,Math.max(3,v[0].length-1))))};
const qb=L=>L.map((r,i)=>'<div class="q" data-a="'+r.a+'"><p class="qt">Q'+(i+1)+'. '+(r.q.map?'</p><div class="sj">'+r.q.join('<br>')+'</div><p class="qt">Arrange in a logical sequence.':r.q)+'</p>'+r.o.map((o,k)=>'<button class="opt" data-k="'+k+'"><span class="ob">'+'ABCD'[k]+'</span><span class="ot">'+o+'</span></button>').join('')+(r.e?'<div class="ex">'+r.e+'</div>':'')+'</div>').join('');
const card=v=>'<div class="card"><div><b class="w">'+v[0]+'</b> <i>'+v[1]+'</i></div><div class="h">'+v[2]+'</div>'+(v[5]?'<div class="ln"><span>English:</span> '+v[5]+'</div>':'')+'<div class="ln"><span>Synonyms:</span> '+v[3]+'</div><div class="ln"><span>Antonym:</span> '+v[4]+'</div></div>';
const SEC=[['ed','Editorial'],['vc','Vocabulary'],['rc','RC'],['pj','Para jumbles'],['es','Error spotting'],['qz','Quiz'],['id','Idioms'],['fq','FAQ']];
const CATS=['Technology','Health & Environment','Global Issues','Science & Tech','Speaking Tree','Law & Ethics','General Topics','Sports','General Studies','Health','Science','Environment','Economy','Politics / IR','Education','Literature / Arts','Society','History / Heritage','Philosophy','Psychology'];
const ICON={'Technology':'💻','Health & Environment':'🌿','Global Issues':'🌍','Science & Tech':'🔬','Speaking Tree':'🌳','Law & Ethics':'⚖️','General Topics':'🗞️','Sports':'🏅','General Studies':'📘','Health':'🩺','Science':'🧪','Environment':'🌱','Economy':'💹','Politics / IR':'🏛️','Education':'🎓','Literature / Arts':'🎭','Society':'👥','History / Heritage':'🏺','Philosophy':'💭','Psychology':'🧠','Other':'📰'};
const CRX=[['Technology',/\bai\b|digital|cyber|tech|social media/],['Health',/health|medicine|nutrition/],['Science',/science|space|invention/],['Environment',/environment|climate|energy|disaster/],['Economy',/econom|financ|business|jobs/],['Politics / IR',/politic|governance|international|\bir\b/],['Education',/education|youth|nep/],['Literature / Arts',/literature|arts|cinema|author/],['Society',/society|gender|communication/],['History / Heritage',/history|sports|heritage/],['Philosophy',/philosoph/],['Psychology',/psycholog|habit|leadership/]];
function cats(a){if(a.c)return[a.c];const t=((a.src.split('Topic:')[1])||'').toLowerCase(),r=CRX.filter(x=>x[1].test(t)).map(x=>x[0]);return r.length?r:['Other']}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let mode=ls.get('de_mode','d'),cat=ls.get('de_cat','');
const dayList=di=>DAYS[di].articles.map((a,ai)=>({di,ai,date:DAYS[di].date,a}));
const catList=c=>{const L=[];DAYS.forEach((dd,di)=>dd.articles.forEach((a,ai)=>{if(cats(a).includes(c))L.push({di,ai,date:dd.date,a})}));return L};
const pl=n=>n+(n==1?' article':' articles');
const wc=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;

/* ---------- navigation ---------- */
let cur={v:'home',d:0},ctx={list:[],i:0};
function listFor(st){return st.k=='c'?catList(st.key):dayList(+st.key)}
function go(st,push){st.d=push?(cur.d||0)+1:(st.d||0);if(push){try{history.pushState(st,'')}catch(e){}}draw(st)}
function draw(st){cur=st;stopAuto();closeAll();
if(st.v=='reader'){ctx.list=listFor(st);ctx.i=Math.max(0,Math.min(st.i,ctx.list.length-1));renderReader();show('reader')}
else if(st.v=='list'){renderList(st);show('pList')}
else{renderHome();show('pHome')}}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==id));const rd=id=='reader';$('reader').classList.toggle('on',rd);$('foot').hidden=!rd;document.body.classList.toggle('rd',rd);if(!rd)window.scrollTo(0,0)}
function back(){if((cur.d||0)>0){try{history.back();return}catch(e){}}
if(cur.v=='reader')draw({v:'list',k:cur.k,key:cur.key,d:0});else draw({v:'home',d:0})}
window.addEventListener('popstate',e=>draw(e.state||{v:'home',d:0}));
try{history.replaceState({v:'home',d:0},'')}catch(e){}

/* ---------- home ---------- */
function renderHome(){
const usedC=CATS.concat(['Other']).filter(c=>catList(c).length);
document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==mode));
$('homeLbl').textContent=mode=='c'?'Choose a Category':'Choose a Date';
$('homeGrid').innerHTML=mode=='c'?usedC.map(c=>'<button class="edCatCard" data-c="'+c+'"><span class="edCatIcon">'+(ICON[c]||'📰')+'</span><span class="edCatName">'+c+'</span><span class="edCatCount">'+pl(catList(c).length)+'</span></button>').join(''):DAYS.map((d,i)=>'<button class="edCatCard" data-di="'+i+'"><span class="edCatIcon">'+(/evergreen/i.test(d.date)?'📚':'📅')+'</span><span class="edCatName">'+d.date+'</span><span class="edCatCount">'+pl(d.articles.length)+'</span></button>').join('');
let r='';try{const l=JSON.parse(ls.get('de_last','null'));if(l){for(let di=0;di<DAYS.length;di++){if(DAYS[di].date!=l.date)continue;const ai=DAYS[di].articles.findIndex(a=>a.id==l.id&&a.title==l.title);if(ai>=0){r='<button class="resume" data-rdi="'+di+'" data-rai="'+ai+'"><span class="ri">▶</span><span><b>Continue reading</b><span>'+DAYS[di].articles[ai].title+'</span></span></button>';break}}}}catch(e){}
$('resume').innerHTML=r;
}

/* ---------- list ---------- */
function artCard(it,i,attr,isCat,curI){return '<button class="edArticleCard'+(i===curI?' cur':'')+'" '+attr+'><span class="edArticleIdx">'+(i+1)+'</span><span class="edArticleTx"><span class="edArticleTitle">'+it.a.title+'</span><span class="edArticleSub">'+(isCat?it.date+' · ':'')+it.a.src+'</span></span><span class="edArticleMeta">'+it.a.vocab.length+' words</span></button>'}
function renderList(st){const L=listFor(st),isC=st.k=='c';
$('listTitle').textContent=isC?(ICON[st.key]||'📰')+' '+st.key:(/evergreen/i.test(DAYS[+st.key].date)?'📚 ':'📅 ')+DAYS[+st.key].date;
$('listCount').textContent=L.length+(L.length==1?' Article':' Articles');
$('listGrid').innerHTML=L.map((it,i)=>artCard(it,i,'data-i="'+i+'"',isC)).join('')}

/* ---------- reader ---------- */
function renderReader(){
const it=ctx.list[ctx.i],a=it.a,isC=cur.k=='c';
cur.i=ctx.i;try{history.replaceState(cur,'')}catch(e){}
ls.set('de_last',JSON.stringify({date:it.date,id:a.id,title:a.title}));
$('rTitle').textContent=a.title;
const names={ed:'The editorial explained',vc:'Vocabulary ('+a.vocab.length+' words)',rc:'Reading comprehension: 5 questions',pj:'Para jumbles: 4 questions',es:'Error spotting: '+a.es.length+' questions (rule-wise)',qz:'Quiz: 15 questions',id:'Idioms &amp; phrasal verbs',fq:'FAQ'};
const secs=[['ed',a.ed.length?'<div class="hint">किसी भी हाइलाइट शब्द पर टैप करो: हिंदी अर्थ, synonyms, antonym।</div>'+a.ed.map(g=>g.map(c=>'<div class="ru" data-ms="'+Math.max(1800,Math.min(22000,wc(c.en)*400))+'"><p class="en gkP">'+mk(c.en)+'</p>'+(c.hi?'<div class="hiL">'+c.hi+'</div>':'')+'</div>').join('')+'<div class="pgap"></div>').join(''):''],['vc',a.vocab.map(card).join('')],['rc',a.rc.length?qb(a.rc):''],['pj',a.pj.length?qb(a.pj):''],['es',a.es.length?qb(a.es):''],['qz',a.qz.length?qb(a.qz):''],['id',a.idioms.map(v=>'<div class="card"><div><b class="w">'+v[0]+'</b></div><div class="h">'+v[1]+'</div>'+(v[3]?'<div class="ln"><span>English:</span> '+v[3]+'</div>':'')+'<div class="q2"><i>“'+v[2]+'”</i></div></div>').join('')],['fq',a.fq.map(f=>'<details><summary>'+f[0]+'</summary><div class="hiL">'+f[1]+'</div></details>').join('')]].filter(s=>s[1]);
document.title='Daily Editorial · '+it.date;
$('content').innerHTML='<div class="rmeta">'+it.date+'</div><div class="gkChapTitle">'+a.title+'</div><div class="rmeta">'+a.src+'</div><div class="rmeta">🗂 '+cats(a).join(' · ')+'</div>'+(a.todo?'<div class="todo">'+a.todo+'</div>':'')+'<hr class="rule">'+secs.map(s=>'<h2 class="gkH2" id="s-'+s[0]+'">'+names[s[0]]+'</h2>'+s[1]).join('');
$('chips').innerHTML='<button class="pill" id="thi" aria-pressed="'+!document.body.classList.contains('nohi')+'">हिंदी पंक्तियाँ</button><button class="pill" id="thw" aria-pressed="'+!document.body.classList.contains('nohw')+'">शब्द (हिंदी)</button><span class="sep"></span>'+secs.map(s=>'<button class="chip" data-s="'+s[0]+'">'+SEC.find(x=>x[0]==s[0])[1]+'</button>').join('');
$('reader').scrollTop=0;
$('prev').disabled=ctx.i<=0;$('next').disabled=ctx.i>=ctx.list.length-1;
spy()}
function spy(){const R=$('reader'),hs=[...document.querySelectorAll('.gkH2')];let id='';hs.forEach(h=>{if(h.getBoundingClientRect().top<=110)id=h.id.slice(2)});document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.s==id))}
function step(n){const i=ctx.i+n;if(i<0||i>=ctx.list.length)return;stopAuto();ctx.i=i;renderReader()}

/* ---------- word popup ---------- */
function showWord(w){const v=lk(w);$('popBody').innerHTML='<div class="pw">'+w+(v?' <i>'+v[1]+'</i>':'')+'</div>'+(v?'<div class="ph">'+v[2]+'</div><div class="pm">'+(v[5]?'<div><span>English:</span> '+v[5]+'</div>':'')+'<div><span>Synonyms:</span> '+v[3]+'</div><div><span>Antonym:</span> '+v[4]+'</div></div>':'');$('popOv').classList.add('open')}
function closeAll(){document.querySelectorAll('.ov.open').forEach(o=>o.classList.remove('open'))}

/* ---------- auto-scroll (paragraph by paragraph) ---------- */
const SPD=[.5,1,1.5,2];let auto=false,si=1,units=[],ai=-1,tmr=null,dl=0,rem=0,wl=null;
function autoUI(){$('play').innerHTML=auto?'&#10074;&#10074;':'&#9654;';$('play').classList.toggle('run',auto);$('spd').textContent=SPD[si]+'x';$('prog').classList.toggle('on',auto)}
function fill(ms){const f=$('progFill');f.style.transition='none';f.style.width='0%';void f.offsetWidth;f.style.transition='width '+ms+'ms linear';f.style.width='100%'}
function freeze(){const f=$('progFill');const w=getComputedStyle(f).width;f.style.transition='none';f.style.width=w}
function zero(){const f=$('progFill');f.style.transition='none';f.style.width='0%'}
function arm(ms){clearTimeout(tmr);dl=Date.now()+ms;rem=ms;fill(ms);tmr=setTimeout(nextUnit,ms)}
function unitMs(u){const b=parseInt(u.dataset.ms,10)||3000;return b*(document.body.classList.contains('nohi')?1:1.6)/SPD[si]}
function nextUnit(){clearTimeout(tmr);if(ai>=units.length-1){stopAuto(true);return}ai++;const R=$('reader'),el=units[ai];R.scrollTo({top:Math.max(0,R.scrollTop+el.getBoundingClientRect().top-R.getBoundingClientRect().top-70),behavior:'smooth'});arm(unitMs(el))}
async function wake(){try{if('wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function unwake(){if(wl){wl.release().catch(()=>{});wl=null}}
function startAuto(){units=[...document.querySelectorAll('#content .ru')];if(!units.length)return;auto=true;autoUI();wake();const R=$('reader'),top=R.getBoundingClientRect().top+70;let b=-1;for(let i=0;i<units.length;i++){if(units[i].getBoundingClientRect().top<=top)b=i;else break}ai=Math.max(-1,b-1);nextUnit()}
function pauseAuto(){if(!auto)return;rem=Math.max(300,dl-Date.now());auto=false;clearTimeout(tmr);freeze();unwake();autoUI()}
function resumeAuto(){auto=true;autoUI();wake();if(ai<0){nextUnit();return}arm(rem||3000)}
function stopAuto(end){auto=false;clearTimeout(tmr);unwake();if(end||true){zero()}ai=-1;rem=0;units=[];autoUI()}
$('play').onclick=e=>{e.stopPropagation();if(auto)pauseAuto();else if(ai>=0&&ai<units.length-1&&rem)resumeAuto();else startAuto()};
$('spd').onclick=e=>{e.stopPropagation();si=(si+1)%SPD.length;autoUI();if(auto){const left=Math.max(300,dl-Date.now());arm(left/SPD[si]*SPD[(si+SPD.length-1)%SPD.length])}};
['touchstart','mousedown','wheel'].forEach(ev=>$('reader').addEventListener(ev,()=>{if(auto)pauseAuto()},{passive:true}));
$('reader').addEventListener('scroll',spy,{passive:true});

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{const t=e.target;
const x=t.closest('[data-close]');if(x){$(x.dataset.close).classList.remove('open');return}
if(t.classList&&t.classList.contains('ov')){t.classList.remove('open');return}
if(t.closest('[data-act=set]')){$('set').classList.add('open');return}
const sg=t.closest('#seg button');if(sg){mode=sg.dataset.m;ls.set('de_mode',mode);renderHome();return}
const ch=t.closest('#homeGrid [data-c]');if(ch){cat=ch.dataset.c;ls.set('de_cat',cat);go({v:'list',k:'c',key:cat},true);return}
const dh=t.closest('#homeGrid [data-di]');if(dh){go({v:'list',k:'d',key:dh.dataset.di},true);return}
const rs=t.closest('.resume');if(rs){go({v:'reader',k:'d',key:rs.dataset.rdi,i:+rs.dataset.rai},true);return}
const lc=t.closest('#listGrid .edArticleCard');if(lc){go({v:'reader',k:cur.k,key:cur.key,i:+lc.dataset.i},true);return}
const ls2=t.closest('#lstGrid .edArticleCard');if(ls2){$('lstOv').classList.remove('open');stopAuto();ctx.i=+ls2.dataset.i;renderReader();return}
const sc=t.closest('.chip');if(sc){const h=$('s-'+sc.dataset.s),R=$('reader');if(h){pauseAuto();R.scrollTo({top:R.scrollTop+h.getBoundingClientRect().top-R.getBoundingClientRect().top-60,behavior:'smooth'})}return}
const hw=t.closest('.hw');if(hw){showWord(hw.dataset.w);return}
const ob=t.closest('.opt');if(ob){const q=ob.closest('.q');if(!q.classList.contains('done')){q.classList.add('done');const a=+q.dataset.a;q.querySelectorAll('.opt')[a].classList.add('ok');if(+ob.dataset.k!==a)ob.classList.add('no')}return}
const th=t.closest('#thi,#thw');if(th){const on=th.getAttribute('aria-pressed')==='true';th.setAttribute('aria-pressed',!on);document.body.classList.toggle(th.id=='thi'?'nohi':'nohw',on);syncQuick();return}
});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeAll();if(e.key=='Enter'&&e.target.classList&&e.target.classList.contains('hw'))showWord(e.target.dataset.w)});
$('listBack').onclick=back;$('rBack').onclick=back;
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('lst').onclick=()=>{const L=ctx.list,isC=cur.k=='c';$('lstHead').textContent='Articles ('+L.length+')';$('lstGrid').innerHTML=L.map((it,i)=>artCard(it,i,'data-i="'+i+'"',isC,ctx.i)).join('');$('lstOv').classList.add('open');const c=$('lstGrid').querySelector('.cur');if(c)c.scrollIntoView({block:'center'})};
function syncQuick(){const a=!document.body.classList.contains('nohi'),b=!document.body.classList.contains('nohw');$('b-hi').setAttribute('aria-pressed',a);$('b-hw').setAttribute('aria-pressed',b);const i=$('thi'),w=$('thw');if(i)i.setAttribute('aria-pressed',a);if(w)w.setAttribute('aria-pressed',b)}
$('b-hi').onclick=()=>{document.body.classList.toggle('nohi');syncQuick()};
$('b-hw').onclick=()=>{document.body.classList.toggle('nohw');syncQuick()};
$('focBtn').onclick=$('focBack').onclick=()=>$('b-focus').click();
$('b-top').onclick=()=>{$('set').classList.remove('open');$('reader').scrollTo({top:0,behavior:'smooth'});window.scrollTo(0,0)};

/* ---------- settings ---------- */
(function(){
const DEF={theme:'dim',tp:100,bl:0,fam:'sys',fw:500,fs:18,hs:90,lh:17,ls:0,mw:720,just:0,nou:0,focus:0,hwc:'#34d399'};
let C=Object.assign({},DEF);try{Object.assign(C,JSON.parse(ls.get('de_cfg','{}')))}catch(e){}
const R=document.documentElement,B=document.body,q=s=>document.querySelector(s);
const FAM={sys:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif",serif:"Georgia,'Times New Roman',serif",round:"ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,sans-serif"};
const save=()=>ls.set('de_cfg',JSON.stringify(C));
function apply(){
R.dataset.theme=C.theme;
R.style.setProperty('--tp',C.tp+'%');R.style.setProperty('--bl',C.bl/100);
R.style.setProperty('--fam',FAM[C.fam]||FAM.sys);R.style.setProperty('--fw',C.fw);
R.style.setProperty('--fs',C.fs+'px');R.style.setProperty('--hs',C.hs/100);R.style.setProperty('--lh',C.lh/10);R.style.setProperty('--ls',(C.ls/100)+'em');R.style.setProperty('--mw',C.mw+'px');
if(C.theme=='sepia'||C.theme=='light')R.style.removeProperty('--hwc');else R.style.setProperty('--hwc',C.hwc);
B.classList.toggle('just',!!C.just);B.classList.toggle('nou',!!C.nou);B.classList.toggle('focus',!!C.focus);
const f=(id,v,fmt)=>{const e=q('#'+id);e.value=v;e.nextElementSibling.textContent=fmt(v)};
f('r-tp',C.tp,v=>v+'%');f('r-bl',C.bl,v=>v+'%');f('r-fw',C.fw,v=>v);f('r-fs',C.fs,v=>v+'px');f('r-hs',C.hs,v=>v+'%');f('r-lh',C.lh,v=>(v/10).toFixed(1));f('r-ls',C.ls,v=>(v/100).toFixed(2));
[['g-theme','theme'],['g-fam','fam'],['g-mw','mw'],['g-hwc','hwc']].forEach(([g,k])=>q('#'+g).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v)==String(C[k]))));
q('#b-just').setAttribute('aria-pressed',!!C.just);q('#b-nou').setAttribute('aria-pressed',!!C.nou);q('#b-focus').setAttribute('aria-pressed',!!C.focus);
const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(R).getPropertyValue('--bg').trim()||'#08070a'}
const setFs=v=>{C.fs=Math.max(14,Math.min(32,v));apply();save()};
$('fdn').onclick=()=>setFs(C.fs-1);$('fup').onclick=()=>setFs(C.fs+1);
[['r-tp','tp'],['r-bl','bl'],['r-fw','fw'],['r-fs','fs'],['r-hs','hs'],['r-lh','lh'],['r-ls','ls']].forEach(([id,k])=>q('#'+id).oninput=e=>{C[k]=+e.target.value;apply();save()});
[['g-theme','theme'],['g-fam','fam'],['g-mw','mw'],['g-hwc','hwc']].forEach(([g,k])=>q('#'+g).onclick=e=>{const b=e.target.closest('button');if(b){C[k]=k=='mw'?+b.dataset.v:b.dataset.v;apply();save()}});
[['b-just','just'],['b-nou','nou'],['b-focus','focus']].forEach(([id,k])=>q('#'+id).onclick=()=>{C[k]=C[k]?0:1;apply();save()});
let w2=null;q('#b-wake').onclick=async()=>{const b=q('#b-wake');try{if(w2){await w2.release();w2=null;b.setAttribute('aria-pressed',false)}else if(navigator.wakeLock){w2=await navigator.wakeLock.request('screen');b.setAttribute('aria-pressed',true);w2.addEventListener('release',()=>{w2=null;b.setAttribute('aria-pressed',false)})}else b.textContent='Not supported'}catch(e){b.textContent='Not allowed'}};
q('#rs').onclick=()=>{C=Object.assign({},DEF);apply();save()};
apply();
})();
autoUI();renderHome();
</script></body></html>
