hich Issun Boshi and the girl — she had come back to help him — {{recognised|पहचान लिया}} as a magical object. \"You have to hit it on the ground and make a wish,\" said the girl.","hi":"जल्दबाज़ी में वे एक हथौड़ा छोड़ गए, जिसे इसुन बोशी और लड़की ने, जो उसकी मदद के लिए लौट आई थी, जादुई चीज़ के रूप में पहचान लिया। “इसे ज़मीन पर मारकर इच्छा माँगनी होती है,” लड़की ने कहा।"},{"en":"So they hit the mallet on the ground and made a wish. The next moment, Issun Boshi had grown to normal size and stood {{clad|पहने हुए}} in the {{armour|कवच}} of a samurai!","hi":"तो उन्होंने हथौड़ा ज़मीन पर मारा और इच्छा माँगी। अगले ही पल इसुन बोशी सामान्य कद का हो गया और समुराई का कवच पहने खड़ा था!"},{"en":"The girl’s father gladly gave her in marriage to Issun Boshi, who proved a {{devoted|समर्पित}} husband. He brought his parents to live with him too, and though they were happy to see their son so big, they still lovingly called him Issun Boshi.","hi":"लड़की के पिता ने ख़ुशी से अपनी बेटी का विवाह इसुन बोशी से कर दिया, जो एक समर्पित पति साबित हुआ। वह अपने माता-पिता को भी अपने साथ रहने ले आया, और वे अपने बेटे को इतना बड़ा देखकर ख़ुश तो थे, फिर भी प्यार से उसे इसुन बोशी ही बुलाते रहे।"}]],"vocab":[["seek","verb","ढूँढना, आज़माना","look for, pursue","avoid","to try to find or get something"],["employment","noun","काम, रोज़गार","job, work","unemployment","a paid job or the state of having one"],["wealthy","adj","धनी","rich, affluent","poor","having a lot of money"],["diligence","noun","लगन, मेहनत","hard work, effort","laziness","careful and steady effort"],["sincerity","noun","सच्चाई, निष्ठा","honesty, genuineness","deceit","honest and true feeling"],["delightful","adj","प्यारा, मनमोहक","charming, lovely","unpleasant","causing great pleasure"],["accompany","verb","साथ जाना","escort, go with","abandon","to go somewhere with someone"],["leap","verb","छलाँग लगाना","jump, spring","crawl","to jump high or suddenly"],["deliberately","adv","जानबूझकर","intentionally, purposely","accidentally","on purpose"],["furious","adj","क्रोधित","enraged, angry","calm","extremely angry"],["swallow","verb","निगलना","gulp, devour","spit out","to make food go down the throat"],["stab","verb","चुभोना, घोंपना","pierce, jab","heal","to push a pointed thing into something"],["gullet","noun","गला, अन्न-नली","throat, oesophagus","—","the tube from the mouth to the stomach"],["chaos","noun","अफ़रा-तफ़री","disorder, confusion","order","complete disorder and confusion"],["haste","noun","जल्दबाज़ी","hurry, speed","delay","great speed in doing something"],["mallet","noun","हथौड़ा (लकड़ी का)","hammer, club","—","a hammer with a large head, often wooden"],["recognise","verb","पहचानना","identify, know","overlook","to know someone or something from before"],["clad","adj","पहने हुए","dressed, clothed","naked","dressed in a particular way"],["armour","noun","कवच","mail, protective suit","—","a protective metal covering worn in battle"],["devoted","adj","समर्पित","loyal, dedicated","indifferent","very loving and loyal"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["set out","यात्रा पर निकलना","They set out for the hills at dawn.","to begin a journey"],["seek one’s fortune","भाग्य आज़माना","He left his village to seek his fortune in the city.","to go away to find success or wealth"],["have had enough","तंग आ जाना, बहुत हो गया","The villagers had had enough of the thieves.","to be unwilling to bear something any longer"]],"fq":[]},{"id":"ev-ed182","title":"\"Love a Duck\"","src":"Evergreen library · Topic: Economy","c":"Economy","todo":"","ed":[[{"en":"Raju lived in a very fine city. People came to {{admire|सराहना}} the beautiful buildings, to shop at the {{bustling|चहल-पहल भरा}} market, to enjoy the river and, most of all, to feed the ducks.","hi":"राजू एक बहुत सुंदर शहर में रहता था। लोग सुंदर इमारतों को सराहने, चहल-पहल भरे बाज़ार में ख़रीदारी करने, नदी का आनंद लेने और सबसे बढ़कर बत्तख़ों को खिलाने आते थे।"},{"en":"Raju loved the ducks. He lived with his little brown-eyed sister, Rashmi, on a houseboat {{moored|लंगर डाली हुई}} near the great cathedral, and the ducks were his friends.","hi":"राजू को बत्तख़ें बहुत प्यारी थीं। वह अपनी भूरी आँखों वाली नन्ही बहन रश्मि के साथ बड़े गिरजाघर के पास लंगर डाली एक हाउसबोट में रहता था, और बत्तख़ें उसकी दोस्त थीं।"},{"en":"They were special Muscovy ducks, black and white with red faces and enormous yellow feet. They didn't much care for swimming and seldom flew anywhere, so they {{waddled|लड़खड़ाकर चलीं}} about accepting {{scraps|बचे-खुचे टुकड़े}} of food from {{passersby|राहगीर}}.","hi":"वे ख़ास मस्कोवी बत्तख़ें थीं, काली-सफ़ेद, लाल चेहरों और बड़े-बड़े पीले पैरों वाली। उन्हें तैरना ज़्यादा पसंद नहीं था और वे शायद ही कहीं उड़ती थीं, इसलिए वे लड़खड़ाती चाल से घूमतीं और राहगीरों से खाने के बचे-खुचे टुकड़े लेती रहतीं।"}],[{"en":"Everybody loved them as much as Raju. Nearly everybody, that is.","hi":"सब उन्हें राजू जितना ही प्यार करते थे। लगभग सब, यानी।"},{"en":"Narayana Murthy was {{chairman|अध्यक्ष}} of the {{council|परिषद}}; he ran the town. He also had the biggest and shiniest boat on the river.","hi":"नारायण मूर्ति नगर परिषद के अध्यक्ष थे; वही शहर चलाते थे। उनके पास नदी की सबसे बड़ी और सबसे चमकदार नाव भी थी।"},{"en":"In the evenings he would sit on deck with his friend George, eating and drinking, wearing a Panama hat, and looking important. He didn’t like other people’s boats nearby and he hated the ducks.","hi":"शामों को वे अपने दोस्त जॉर्ज के साथ डेक पर बैठकर खाते-पीते, पनामा हैट पहने और रौब जमाते। उन्हें आसपास दूसरों की नावें पसंद नहीं थीं और बत्तख़ों से तो वे नफ़रत करते थे।"}],[{"en":"One day, when he was fishing, Raju heard Narayana Murthy talking to his friend. “We’ll have to do something about it!","hi":"एक दिन, जब राजू मछली पकड़ रहा था, उसने नारायण मूर्ति को अपने दोस्त से बात करते सुना। “हमें इसका कुछ तो करना ही पड़ेगा!"},{"en":"Those nasty, dirty, horrible ducks have been {{perching|बैठना}} on my boat again. Look at the paintwork!","hi":"वे घिनौनी, गंदी, भयानक बत्तख़ें फिर से मेरी नाव पर आकर बैठ रही हैं। रंग-रोगन तो देखो!"},{"en":"They’re making the town a mess. I won’t have it.”","hi":"वे शहर को गंदा कर रही हैं। मैं यह नहीं होने दूँगा।”"}],[{"en":"The very next day {{notices|सूचना-पत्र}} appeared all over town that read: “DO NOT FEED THE DUCKS – by order of the Council.” People couldn’t believe it; they’d fed the ducks for years and now they must stop.","hi":"अगले ही दिन पूरे शहर में नोटिस लग गए जिन पर लिखा था: “बत्तख़ों को खाना न खिलाएँ, परिषद के आदेश से।” लोगों को यक़ीन नहीं हुआ; वे बरसों से बत्तख़ों को खिलाते आए थे और अब उन्हें रुकना था।"},{"en":"The ducks couldn’t believe it either. {{Starving|भूखों मरती}}, they became pub ducks, superstore ducks, and garage forecourt ducks, living on what few scraps they could find.","hi":"बत्तख़ों को भी यक़ीन नहीं हुआ। भूखों मरती वे पब की बत्तख़ें, सुपरस्टोर की बत्तख़ें और पेट्रोल पंप के अहाते की बत्तख़ें बन गईं, जो मिलने वाले थोड़े-बहुत टुकड़ों पर जीती थीं।"},{"en":"They became thin and their feathers got dirty. They lost all their spirit and their love of life.","hi":"वे दुबली हो गईं और उनके पंख गंदे हो गए। उनका हौसला और जीने का उत्साह ख़त्म हो गया।"}],[{"en":"But Narayana Murthy hadn’t finished. Spring was coming: the {{buds|कलियाँ}} began to burst and the first flowers appeared in the famous Jubilee Gardens by the river.","hi":"लेकिन नारायण मूर्ति का काम अभी पूरा नहीं हुआ था। वसंत आ रहा था: कलियाँ फूटने लगीं और नदी किनारे के मशहूर जुबली गार्डन में पहले फूल खिले।"},{"en":"One day Raju was fishing again, wearing his favourite David Beckham shirt and red baseball cap. He heard Narayana Murthy and George talking as they walked to Murthy’s boat.","hi":"एक दिन राजू फिर मछली पकड़ रहा था, अपनी पसंदीदा डेविड बेकहम की शर्ट और लाल बेसबॉल टोपी पहने। उसने नारायण मूर्ति और जॉर्ज को मूर्ति की नाव की ओर जाते हुए बात करते सुना।"},{"en":"“It’s spring, George, my boy,” said Narayana Murthy. “You know what that means?","hi":"“वसंत आ गया है, जॉर्ज, मेरे बच्चे,” नारायण मूर्ति ने कहा। “जानते हो इसका क्या मतलब है?"}],[{"en":"I’ll tell you what it means: it means more ducks. It’s the {{breeding|प्रजनन}} season.","hi":"मैं बताता हूँ इसका मतलब: और ज़्यादा बत्तख़ें। यह उनके प्रजनन का मौसम है।"},{"en":"We can’t have that.” “We must look for nests and take the eggs and that will be the end of it.”","hi":"हम यह नहीं होने दे सकते।” “हमें घोंसले ढूँढकर अंडे ले लेने चाहिए, फिर मामला ख़त्म।”"},{"en":"Raju was {{devastated|बुरी तरह टूटा}}; he ran to tell his little sister. “Rashmi, what can we do?","hi":"राजू बुरी तरह टूट गया; वह दौड़कर अपनी छोटी बहन को बताने गया। “रश्मि, हम क्या कर सकते हैं?"}],[{"en":"This is terrible! The ducks will die out.”","hi":"यह भयानक है! बत्तख़ें ख़त्म हो जाएँगी।”"},{"en":"“I’ll tell the ducks,” she said, “they’ll know what to do.” “It won’t work — they won’t understand!”","hi":"“मैं बत्तख़ों को बता दूँगी,” उसने कहा, “वे जान जाएँगी कि क्या करना है।” “इससे कुछ नहीं होगा, वे समझेंगी नहीं!”"},{"en":"Raju was fighting back tears. “Maybe they will,” she said.","hi":"राजू आँसू रोकने की कोशिश कर रहा था। “शायद समझ जाएँ,” उसने कहा।"}],[{"en":"But the ducks got fewer and fewer. They sat about in twos and threes looking lost and sad and lonely.","hi":"लेकिन बत्तख़ें कम से कम होती गईं। वे दो-दो, तीन-तीन के समूह में खोई-खोई, उदास और अकेली बैठी रहतीं।"},{"en":"Meanwhile, Narayana Murthy had become famous. His anti-duck {{campaign|अभियान}} was headline news and one day a television company came to interview him.","hi":"इसी बीच नारायण मूर्ति मशहूर हो गए थे। उनका बत्तख़-विरोधी अभियान सुर्ख़ियों की ख़बर बन गया और एक दिन एक टेलीविज़न कंपनी उनका इंटरव्यू लेने आई।"},{"en":"He stood by the duck-free river as it was being filmed and spoke to a young reporter. “We did it without harming a single duck.”","hi":"वे बत्तख़ों से ख़ाली नदी के पास खड़े थे, फ़िल्मिंग चल रही थी, और उन्होंने एक युवा रिपोर्टर से कहा, “हमने एक भी बत्तख़ को नुक़सान पहुँचाए बिना यह कर दिखाया।”"}],[{"en":"Narayana Murthy smiled for the camera. “The city is now rid of these {{vermin|हानिकारक जीव}}.","hi":"नारायण मूर्ति कैमरे के सामने मुस्कुराए। “शहर अब इन हानिकारक जीवों से मुक्त हो गया है।"},{"en":"We have won the battle.” As he spoke there was clapping and cheering in the distance and, from gardens, sports fields, footpaths, and alleys came mother ducks with lines of yellow ducklings behind them.","hi":"हमने लड़ाई जीत ली है।” जब वे बोल रहे थे, दूर से तालियों और जयकारों की आवाज़ आई और बग़ीचों, खेल के मैदानों, पगडंडियों और गलियों से पीले बत्तख़ के बच्चों की क़तारें लिए माँ बत्तख़ें चली आईं।"},{"en":"The father ducks quacked loudly with joy as they joined them. Proudly they waddled down to the river and launched their babies into the water where they {{bobbed|ऊपर-नीचे हिलते रहे}} and paddled in circles and chased flies, safe at last.","hi":"पिता बत्तख़ें ख़ुशी से ज़ोर-ज़ोर से बोलीं और उनसे आ मिलीं। वे गर्व से लड़खड़ाती चाल से नदी तक गईं और अपने बच्चों को पानी में उतार दिया, जहाँ वे ऊपर-नीचे हिलते, गोल-गोल पैर चलाते और मक्खियों के पीछे दौड़ते रहे, आख़िरकार सुरक्षित।"}],[{"en":"Rashmi was jumping up and down, her big brown eyes sparkling with tears of happiness. “See?","hi":"रश्मि उछल-कूद रही थी, उसकी बड़ी भूरी आँखें ख़ुशी के आँसुओं से चमक रही थीं। “देखा?"},{"en":"It worked! It worked!","hi":"काम कर गया! काम कर गया!"},{"en":"I told the ducks to hide and they did. I told you they’d listen.”","hi":"मैंने बत्तख़ों से छिप जाने को कहा था और वे छिप गईं। मैंने कहा था न कि वे सुनेंगी।”"}],[{"en":"Raju gave her a big hug. “You were right.","hi":"राजू ने उसे ज़ोर से गले लगाया। “तुम सही थीं।"},{"en":"Clever you, clever ducks.” The {{townsfolk|नगरवासी}}, delighted to see the return of their ducks, fed them, took photos and celebrated.","hi":"तुम भी समझदार, बत्तख़ें भी समझदार।” बत्तख़ों की वापसी देखकर ख़ुश नगरवासियों ने उन्हें खिलाया, फ़ोटो खींचीं और जश्न मनाया।"},{"en":"The reporter looked about as the cameraman shot pictures of happy ducks and cheering people for the prime time news. “It seems to me, Mr Councillor, that the ducks have won the battle after all,” he said.","hi":"रिपोर्टर ने चारों ओर देखा जबकि कैमरामैन ख़ुश बत्तख़ों और जयकार करते लोगों की तस्वीरें रात की मुख्य ख़बरों के लिए खींच रहा था। “मुझे लगता है, श्रीमान पार्षद, कि आख़िरकार बत्तख़ें ही लड़ाई जीत गईं,” उसने कहा।"}],[{"en":"The next day the signs were gone. Narayana Murthy {{resigned|इस्तीफ़ा दिया}} from the council and moved his boat to another river.","hi":"अगले दिन तख़्तियाँ ग़ायब थीं। नारायण मूर्ति ने परिषद से इस्तीफ़ा दे दिया और अपनी नाव किसी दूसरी नदी में ले गए।"},{"en":"George went for a long holiday by the seaside. They were never seen in the city again.","hi":"जॉर्ज समुद्र किनारे लंबी छुट्टी पर चला गया। वे दोनों फिर कभी शहर में नहीं दिखे।"},{"en":"Now people come from miles around to see the fine buildings, the {{towering|ऊँचा, गगनचुंबी}} cathedral, the famous mosques, and the bustling market—but most of all they come to feed the very special ducks that live there.","hi":"अब लोग मीलों दूर से सुंदर इमारतें, ऊँचा गिरजाघर, मशहूर मस्जिदें और चहल-पहल भरा बाज़ार देखने आते हैं, पर सबसे बढ़कर वे वहाँ रहने वाली उन ख़ास बत्तख़ों को खिलाने आते हैं।"}]],"vocab":[["admire","verb","सराहना, प्रशंसा से देखना","praise, appreciate","despise","to look at something with pleasure and respect"],["bustling","adj","चहल-पहल भरा","busy, lively","quiet","full of noisy activity"],["moor","verb","नाव को लंगर या रस्सी से बाँधना","tie up, anchor","release","to fasten a boat to land or the shore"],["waddle","verb","लड़खड़ाती चाल से चलना","toddle, shuffle","stride","to walk with short steps swaying side to side"],["scrap","noun","बचा-खुचा टुकड़ा","bit, leftover","whole","a small piece or leftover food"],["passerby","noun","राहगीर","pedestrian, onlooker","—","a person who happens to walk past"],["chairman","noun","अध्यक्ष","president, head","member","the person who leads a meeting or group"],["council","noun","परिषद","board, assembly","—","a group elected to run a town or city"],["perch","verb","बैठना (ऊँची जगह पर)","roost, sit","fly off","to sit on a high place like a branch"],["notice","noun","सूचना-पत्र","sign, announcement","—","a written announcement put up in public"],["starve","verb","भूखों मरना","go hungry, famish","feed","to suffer or die from lack of food"],["bud","noun","कली","sprout, shoot","bloom","a small swelling that grows into a flower"],["breed","verb","प्रजनन करना","reproduce, multiply","—","to produce young animals"],["devastated","adj","बुरी तरह टूटा हुआ","shattered, crushed","delighted","extremely upset and shocked"],["campaign","noun","अभियान","drive, crusade","—","a planned series of actions for a goal"],["vermin","noun","हानिकारक जीव","pests, parasites","—","small harmful animals that spoil food or spread disease"],["bob","verb","ऊपर-नीचे हिलना","float, jiggle","sink","to move up and down lightly in water"],["townsfolk","noun","नगरवासी","citizens, residents","outsiders","the people who live in a town"],["resign","verb","इस्तीफ़ा देना","quit, step down","join","to give up a job or position officially"],["towering","adj","ऊँचा, गगनचुंबी","lofty, soaring","low","very tall and impressive"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["die out","पूरी तरह समाप्त हो जाना","Many wild species may die out soon.","to disappear completely"],["do something about","इस बारे में कुछ करना","We must do something about the litter.","to take action to solve a problem"],["after all","आख़िरकार; जो भी हो","He was right after all.","in spite of what was expected or said"]],"fq":[]},{"id":"ev-ed203","title":"Sakkubai Outwits Dacoits","src":"Evergreen library · Topic: Science & Tech","c":"Science & Tech","todo":"","ed":[[{"en":"\"The {{dacoits|डाकू}} are coming!\" shouted a villager as he ran to the village chief's house. The chief was talking to a few villagers.","hi":"“डाकू आ रहे हैं!” एक गाँववाला चिल्लाता हुआ गाँव के मुखिया के घर की ओर दौड़ा। मुखिया कुछ गाँववालों से बात कर रहा था।"},{"en":"“Calm down,” he told the man. “Tell us who told you about the dacoits.”","hi":"“शांत हो जाओ,” उसने उस आदमी से कहा। “बताओ, डाकुओं के बारे में तुम्हें किसने बताया।”"},{"en":"The villager told them how he had {{overheard|अचानक सुन लिया}} it when he was passing through the neighbouring village. “We have only a {{handful|मुट्ठी भर}} of {{able-bodied|सक्षम, हट्टे-कट्टे}} men in our village,” said the chief, {{worriedly|चिंता से}}.","hi":"गाँववाले ने बताया कि पड़ोस के गाँव से गुज़रते समय उसने यह बात अचानक सुन ली थी। “हमारे गाँव में बस मुट्ठी भर ही सक्षम आदमी हैं,” मुखिया ने चिंता से कहा।"}],[{"en":"“The dacoits will {{outnumber|संख्या में ज़्यादा होना}} us. How do we fight them?”","hi":"“डाकू संख्या में हमसे ज़्यादा होंगे। हम उनसे कैसे लड़ेंगे?”"},{"en":"“We have to match them with {{wit|बुद्धि-चातुर्य}},” said his wife, Sakkubai. “Weapons will not help us.”","hi":"“हमें उनका मुक़ाबला बुद्धि-चातुर्य से करना होगा,” उसकी पत्नी सक्कूबाई ने कहा। “हथियार हमारे काम नहीं आएँगे।”"},{"en":"However, the men decided to catch the dacoits {{unawares|अनजाने में}}. As night fell, they lay in wait for the robbers.","hi":"फिर भी आदमियों ने तय किया कि डाकुओं को अनजाने में दबोच लिया जाए। रात होते ही वे लुटेरों की घात में लेट गए।"}],[{"en":"Sakkubai, however, had other plans. As soon as she heard about the dacoits, she cleaned her house, cooked a delicious meal, {{polished|चमकाया}} her brass lamps and lit them.","hi":"पर सक्कूबाई की योजना कुछ और थी। डाकुओं की ख़बर मिलते ही उसने घर साफ़ किया, स्वादिष्ट खाना पकाया, पीतल के दीये चमकाए और उन्हें जला दिया।"},{"en":"Then she placed all her {{jewels|गहने}} on a tray and waited for the dacoits to come. Before long there was a loud {{thud|धम की आवाज़}} at the door.","hi":"फिर उसने अपने सारे गहने थाली में रखे और डाकुओं के आने का इंतज़ार किया। थोड़ी ही देर में दरवाज़े पर ज़ोर की धम की आवाज़ हुई।"},{"en":"Sakkubai opened the door and {{greeted|अभिवादन किया}} the dacoits with a {{welcoming|स्वागत भरी}} smile. “I'm so happy you have come to my house,” she said {{respectfully|आदरपूर्वक}} to the leader of the dacoits.","hi":"सक्कूबाई ने दरवाज़ा खोला और स्वागत भरी मुस्कान के साथ डाकुओं का अभिवादन किया। “मुझे बहुत ख़ुशी है कि आप मेरे घर आए,” उसने डाकुओं के सरदार से आदरपूर्वक कहा।"}],[{"en":"“Please allow me to serve dinner to you and your men.” After dinner, Sakkubai {{presented|भेंट किया}} the tray full of her jewels to the leader.","hi":"“कृपया मुझे आपको और आपके आदमियों को खाना परोसने दीजिए।” खाने के बाद सक्कूबाई ने गहनों से भरी थाली सरदार को भेंट की।"},{"en":"“You can have all my jewellery, dear brother. Only, allow me to keep my mangalsutra as it's my wedding chain.”","hi":"“भैया, मेरे सारे गहने आप ले जाइए। बस मुझे अपना मंगलसूत्र रखने दीजिए, क्योंकि वह मेरे विवाह की निशानी है।”"},{"en":"The leader of the dacoits felt {{ashamed|शर्मिंदा}}. No one had treated him so well before.","hi":"डाकुओं का सरदार शर्मिंदा हो गया। पहले किसी ने उसके साथ इतना अच्छा व्यवहार नहीं किया था।"}],[{"en":"“You addressed me as your brother and showed me such kindness,” he said {{gruffly|रूखी आवाज़ में}}, his voice {{choking|रुँधा हुआ}} with emotion. “How can I take any of your jewels?","hi":"“तुमने मुझे भाई कहा और मुझ पर इतनी दया दिखाई,” उसने रूखी आवाज़ में कहा, भावुकता से उसका गला रुँधा हुआ था। “मैं तुम्हारे गहने कैसे ले सकता हूँ?"},{"en":"No, we shan't take anything from you, and in future, we shall never {{rob|लूटना}} your village.” Later that night, the chief told his wife how the dacoits had tied them to trees and then a few hours later they had returned and set them free.","hi":"नहीं, हम तुमसे कुछ नहीं लेंगे, और आगे से हम तुम्हारे गाँव को कभी नहीं लूटेंगे।” उस रात बाद में मुखिया ने पत्नी को बताया कि डाकुओं ने उन्हें पेड़ों से बाँध दिया था और कुछ घंटे बाद लौटकर उन्हें आज़ाद कर दिया था।"},{"en":"“Very strange!” said the chief, over and over again. “Not strange at all,” replied Sakkubai, and she told him what had happened.","hi":"“बड़ी अजीब बात है!” मुखिया ने बार-बार कहा। “बिलकुल अजीब नहीं है,” सक्कूबाई ने जवाब दिया, और उसने उसे बताया कि क्या हुआ था।"}],[{"en":"The chief could not believe that his wife had used her wits to {{outwit|चालाकी से मात देना}} the dacoits.","hi":"मुखिया को यक़ीन नहीं हुआ कि उसकी पत्नी ने अपनी बुद्धि से डाकुओं को मात दे दी थी।"}]],"vocab":[["dacoit","noun","डाकू","robber, bandit","—","a member of an armed gang of robbers"],["overhear","verb","अचानक या छिपकर सुन लेना","eavesdrop, catch","miss","to hear what others say without them knowing"],["able-bodied","adj","सक्षम, हट्टा-कट्टा","fit, strong","disabled","strong and healthy enough to work or fight"],["handful","noun","मुट्ठी भर, थोड़े-से","few, small number","multitude","a small number of people or things"],["worriedly","adv","चिंता से","anxiously, nervously","calmly","in a way that shows anxiety"],["outnumber","verb","संख्या में ज़्यादा होना","exceed, surpass","—","to be greater in number than another group"],["wit","noun","बुद्धि-चातुर्य","cleverness, intelligence","stupidity","quick and clever thinking"],["unawares","adv","अनजाने में, अचानक","by surprise, unexpectedly","knowingly","without warning or expectation"],["polish","verb","चमकाना","shine, buff","dull","to rub something to make it shiny"],["thud","noun","धम की आवाज़","thump, bang","—","a dull heavy sound of something falling or hitting"],["jewel","noun","गहना, रत्न","gem, ornament","—","a precious stone or an ornament made with it"],["greet","verb","अभिवादन करना","welcome, salute","ignore","to say hello or welcome someone"],["respectfully","adv","आदरपूर्वक","politely, courteously","rudely","in a polite way showing respect"],["welcoming","adj","स्वागत भरा","friendly, warm","hostile","friendly and pleasant to a guest"],["present","verb","भेंट करना, पेश करना","give, offer","withhold","to give something formally"],["ashamed","adj","शर्मिंदा","embarrassed, guilty","proud","feeling guilty or embarrassed"],["gruffly","adv","रूखी, भारी आवाज़ में","harshly, roughly","gently","in a rough or low voice"],["choke","verb","गला रुँधना","gag, suffocate","breathe","to be unable to speak or breathe easily"],["rob","verb","लूटना","steal from, plunder","give","to take things illegally from a person or place"],["outwit","verb","चालाकी से मात देना","outsmart, trick","fall for","to defeat someone by being cleverer"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["calm down","शांत हो जाना","Calm down and tell me what happened.","to become less angry or excited"],["over and over again","बार-बार","He read the letter over and over again.","many times; repeatedly"],["set free","आज़ाद करना","The boy set the bird free.","to release someone or something"]],"fq":[]},{"id":"ev-ed212","title":"The Merchant and the Ant","src":"Evergreen library · Topic: Science & Tech","c":"Science & Tech","todo":"","ed":[[{"en":"Wang Sun was a {{fabulously|बेहद}} wealthy merchant. But he wasn't born with a silver spoon in his mouth.","hi":"वांग सुन बेहद धनी व्यापारी था। पर वह मुँह में चाँदी का चम्मच लेकर पैदा नहीं हुआ था।"},{"en":"For years he {{struggled|संघर्ष किया}}, battling poverty and {{creditors|लेनदार}}, dealing with clients and suppliers and bankers and {{skeptics|शक करने वाले}}. He became rich, slowly and steadily.","hi":"बरसों उसने संघर्ष किया, गरीबी और लेनदारों से जूझा, और ग्राहकों, आपूर्तिकर्ताओं, बैंकरों तथा शक करने वालों से निपटता रहा। वह धीरे-धीरे और लगातार अमीर बनता गया।"},{"en":"He now had a {{magnificent|शानदार}} home, carriages, and wore {{garments|वस्त्र}} and {{jewellery|गहने}} fit for a king. One day, he heard that all his ships were lost at sea.","hi":"अब उसके पास आलीशान घर और बग्घियाँ थीं, और वह राजा के योग्य वस्त्र व गहने पहनता था। एक दिन उसने सुना कि उसके सारे जहाज़ समुद्र में खो गए हैं।"}],[{"en":"Wang Sun had raised a lot of money from {{moneylenders|साहूकार}} and banks to {{outfit|तैयार करना}} his ships for trade, and {{overnight|रातों-रात}}, he lost everything to his creditors. His home, his carriages, his magnificent garments and jewellery, his servants and assistants, all disappeared as {{mist|कोहरा}} before the sunlight Wang Sun was now a broken man.","hi":"वांग सुन ने व्यापार के लिए अपने जहाज़ तैयार करने हेतु साहूकारों और बैंकों से बहुत धन उधार लिया था, और रातों-रात उसने लेनदारों के हाथों सब कुछ खो दिया। उसका घर, बग्घियाँ, शानदार वस्त्र और गहने, नौकर-चाकर, सब धूप में कोहरे की तरह गायब हो गए। वांग सुन अब टूट चुका आदमी था।"},{"en":"\"What shall I do, he {{wailed|विलाप किया}}, \"I have lost everything. I cannot go on anymore.","hi":"\"मैं क्या करूँ?\" वह विलाप करने लगा, \"मैंने सब कुछ खो दिया। मैं अब आगे नहीं जी सकता।"},{"en":"Let me kill myself. His wife, who was a very {{determined|दृढ़निश्चयी}} woman, said, \"You shall do nothing of the sort.","hi":"मुझे आत्महत्या कर लेने दो।\" उसकी पत्नी, जो बहुत दृढ़निश्चयी महिला थी, बोली, \"तुम ऐसा कुछ नहीं करोगे।"}],[{"en":"We will visit the wise old {{sage|ऋषि, ज्ञानी}} who lives amongst the hills. People say he understands the ways of nature and the ways of man very well.","hi":"हम पहाड़ियों में रहने वाले बुद्धिमान बूढ़े संत के पास चलेंगे। लोग कहते हैं कि वे प्रकृति और मनुष्य, दोनों के तौर-तरीक़े बहुत अच्छी तरह समझते हैं।"},{"en":"Let us ask him for advice and see what he says\" \"Is he a money lender?","hi":"आओ, उनसे सलाह माँगें और देखें कि वे क्या कहते हैं।\" \"क्या वे साहूकार हैं?"},{"en":"Is he a merchant?\" said Wang Sun as he followed his wife up the hill. \"How can he help me?\"","hi":"क्या वे व्यापारी हैं?\" वांग सुन ने पत्नी के पीछे पहाड़ी चढ़ते हुए कहा। \"वे मेरी मदद कैसे कर सकते हैं?\""}],[{"en":"When the Wise Man of the Hills heard Wang Sun's story, he laughed loud and long. Then he said, \"Watch.\"","hi":"जब पहाड़ियों के बुद्धिमान पुरुष ने वांग सुन की कहानी सुनी, तो वे ज़ोर से और देर तक हँसे। फिर बोले, \"देखो।\""},{"en":"He took a {{handful|मुट्ठी भर}} of sand and threw it over an ant {{crawling|रेंगती}} at his feet. The ant, after a brief struggle, came up out of the sand and again started about his business.","hi":"उन्होंने मुट्ठी भर रेत ली और अपने पैरों के पास रेंगती एक चींटी पर डाल दी। थोड़े संघर्ष के बाद चींटी रेत से बाहर निकल आई और फिर अपने काम में लग गई।"},{"en":"The Wise Man again threw a {{heap|ढेर}} of sand on the ant. The ant again struggled for a long time, then finally {{poked|बाहर निकाला}} its head out of the heap of sand.","hi":"बुद्धिमान पुरुष ने फिर चींटी पर रेत का ढेर डाला। चींटी ने फिर बहुत देर तक संघर्ष किया, और आख़िरकार रेत के ढेर से अपना सिर बाहर निकाला।"}],[{"en":"\"No matter how many times I throw sand over this little fellow, he will struggle out of the heap and go about his business of collecting food. That is his nature.","hi":"\"मैं इस नन्हे जीव पर चाहे जितनी बार रेत डालूँ, यह ढेर से बाहर निकलकर खाना जुटाने के अपने काम में लग जाएगा। यही इसका स्वभाव है।"},{"en":"What is your nature, Wang Sun, my boy? You have struggled to reach a position of great wealth and power, but you let only one heap of sand defeat you?","hi":"वांग सुन, बेटा, तुम्हारा स्वभाव क्या है? तुमने संघर्ष करके बड़ी दौलत और ताक़त पाई, और तुम बस एक ढेर रेत से हार गए?"},{"en":"The ant does not understand {{adversity|विपत्ति}} and defeat, no matter how many times it comes to him. He does what nature meant him to do.","hi":"चींटी विपत्ति और हार को नहीं समझती, चाहे वह उसके सामने कितनी ही बार आए। प्रकृति ने उसे जो करने के लिए बनाया है, वह वही करती है।"}],[{"en":"Are you a merchant by nature, Wang Sun? Then go, follow your nature and don't come crying to me with little things.\"","hi":"क्या तुम स्वभाव से व्यापारी हो, वांग सुन? तो जाओ, अपने स्वभाव का अनुसरण करो और छोटी-छोटी बातों के लिए रोते हुए मेरे पास मत आना।\""},{"en":"Wang Sun went back to the city with {{renewed|नई}} hope. In time, he became rich again for he had discovered his nature.","hi":"वांग सुन नई आशा के साथ शहर लौट गया। समय आने पर वह फिर अमीर बन गया, क्योंकि उसने अपने स्वभाव को पहचान लिया था।"},{"en":"He never forgot the Wise Old Man of the Hills, whose name was Confucius.","hi":"वह पहाड़ियों के उस बुद्धिमान बूढ़े को कभी नहीं भूला, जिसका नाम कन्फ़्यूशियस था।"}]],"vocab":[["fabulously","adv","बेहद, अत्यंत","extremely, immensely","slightly","to an extremely great degree"],["struggle","verb","संघर्ष करना","strive, battle","surrender","to try very hard against difficulty"],["creditor","noun","लेनदार, ऋणदाता","lender, loan giver","debtor","a person or bank to whom money is owed"],["skeptic","noun","शक करने वाला, संशयवादी","doubter, cynic","believer","a person who doubts that something is true"],["magnificent","adj","शानदार, भव्य","grand, splendid","ordinary","very impressive and beautiful"],["garment","noun","वस्त्र, पोशाक","clothing, attire","—","a piece of clothing"],["jewellery","noun","गहने, आभूषण","jewels, ornaments","—","ornaments like rings and necklaces worn on the body"],["moneylender","noun","साहूकार","lender, usurer","borrower","a person who lends money and charges interest"],["outfit","verb","तैयार करना, सुसज्जित करना","equip, fit out","strip","to supply with the things needed for a purpose"],["overnight","adv","रातों-रात","suddenly, quickly","gradually","very suddenly; during the night"],["mist","noun","कोहरा, धुंध","fog, haze","clarity","a cloud of tiny water drops near the ground"],["wail","verb","विलाप करना, रोना","cry, lament","rejoice","to cry loudly in sorrow or pain"],["determined","adj","दृढ़निश्चयी","resolute, firm","hesitant","having made a firm decision not to give up"],["sage","noun","ऋषि, ज्ञानी","wise man, guru","fool","a very wise person"],["handful","noun","मुट्ठी भर","fistful, few","lot","as much as a hand can hold; a small number"],["crawl","verb","रेंगना","creep, inch","run","to move slowly with the body close to the ground"],["heap","noun","ढेर","pile, mound","—","a large untidy pile of things"],["poke","verb","बाहर निकलना; कोंचना","stick out, prod","withdraw","to push out or stick something forward"],["adversity","noun","विपत्ति, कठिन समय","hardship, misfortune","prosperity","a difficult or unlucky situation"],["renewed","adj","नया, फिर से जागा हुआ","fresh, revived","faded","made fresh or strong again"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["born with a silver spoon in his mouth","अमीर घर में जन्म लेना","She was born with a silver spoon in her mouth and never worried about money.","born into a rich family"],["come crying to (someone)","छोटी बात पर शिकायत लेकर आना","Don't come crying to me if you ignore my advice.","to ask someone for help or sympathy about a small problem"],["go about one's business","अपने काम में लग जाना","After the storm passed, the villagers went about their business.","to continue doing one's usual work"]],"fq":[]},{"id":"ev-ed213","title":"The Rainmaker","src":"Evergreen library · Topic: Science & Tech","c":"Science & Tech","todo":"","ed":[[{"en":"\"Amma, is it wrong to do something that will make us happy?\" Vijay asked his mother, sitting on the edge of the bed and chewing a mango bar slowly.","hi":"\"अम्मा, क्या ऐसा कुछ करना ग़लत है जो हमें ख़ुश करे?\" विजय ने अपनी माँ से पूछा। वह बिस्तर के किनारे बैठा धीरे-धीरे आम पापड़ चबा रहा था।"},{"en":"Amma, who was folding his clothes and putting them into a suitcase, looked up at him. He was looking at her with that {{expression|भाव}} which meant that he was trying to figure out something.","hi":"अम्मा, जो उसके कपड़े तह करके सूटकेस में रख रही थीं, ने ऊपर उसकी ओर देखा। वह उन्हें उस भाव से देख रहा था जिसका मतलब था कि वह कुछ समझने की कोशिश कर रहा है।"},{"en":"She put his T- shirt aside and sat next to him. \"It's not wrong for us to want to be happy, my child,\" she said, running her hand through his hair.","hi":"उन्होंने उसकी टी-शर्ट एक तरफ़ रखी और उसके पास बैठ गईं। \"हमारा ख़ुश होना चाहना ग़लत नहीं है, मेरे बच्चे,\" उन्होंने उसके बालों में हाथ फेरते हुए कहा।"}],[{"en":"\"But it is wrong to be happy by making someone else sad.\" Vijay {{paused|रुक गया}} in the middle of his chewing as he tried to work out in his mind what his mother had said.","hi":"\"लेकिन किसी और को दुखी करके ख़ुश होना ग़लत है।\" विजय चबाते-चबाते रुक गया और मन में समझने लगा कि माँ ने क्या कहा।"},{"en":"Then as if he had reached some {{conclusion|निष्कर्ष}} of his own, he shook his head, finished the last bit of the bar in one {{gulp|निवाला}} and stood up. \"Ok, Amma, I'll go say goodbye to my cousins,\" he said and ran away.","hi":"फिर मानो वह अपने ही किसी निष्कर्ष पर पहुँच गया हो, उसने सिर हिलाया, एक ही निवाले में बचा हुआ टुकड़ा निगल लिया और खड़ा हो गया। \"ठीक है अम्मा, मैं अपने चचेरे भाई-बहनों को अलविदा कह आता हूँ,\" उसने कहा और दौड़ गया।"},{"en":"Vijay and his parents had come to his grandmother's village two weeks back as his grandmother was very ill. He had spent every minute he could with his grandmother though her {{trembling|काँपते}} hands and {{pale|पीला}} face {{frightened|डराते थे}} him.","hi":"विजय और उसके माता-पिता दो सप्ताह पहले उसकी दादी के गाँव आए थे, क्योंकि दादी बहुत बीमार थीं। उसने जितना हो सका, हर पल दादी के साथ बिताया, हालाँकि उनके काँपते हाथ और पीला चेहरा उसे डराते थे।"}],[{"en":"Then one evening when they were alone, she pulled him close and {{whispered|फुसफुसाया}} in his ear, \"My time is up, Vijay and I want you to be the rainmaker from now on. Our village needs rain.","hi":"फिर एक शाम जब वे अकेले थे, उन्होंने उसे पास खींचा और उसके कान में फुसफुसाया, \"मेरा समय पूरा हो गया है, विजय, और मैं चाहती हूँ कि अब से तुम बारिश बुलाने वाले बनो। हमारे गाँव को बारिश चाहिए।"},{"en":"Go to the banyan tree at the edge of the village and say these words aloud: Rain in vain we wait. Come now, come flow.","hi":"गाँव के किनारे वाले बरगद के पेड़ के पास जाओ और ये शब्द ज़ोर से कहो: बारिश, हम व्यर्थ राह देखते हैं। अब आओ, बरसो।"},{"en":"Turn our land into green gold.\" Vijay was {{thrilled|रोमांचित}}.","hi":"हमारी ज़मीन को हरे सोने में बदल दो।\" विजय रोमांचित हो गया।"}],[{"en":"He couldn't believe that his grandmother had {{appointed|नियुक्त किया}} him as THE rainmaker! For centuries, someone or the other from his family had been the rainmaker.","hi":"उसे यक़ीन नहीं हुआ कि दादी ने उसे बारिश बुलाने वाला नियुक्त कर दिया! सदियों से उसके परिवार में कोई न कोई बारिश बुलाने वाला रहा था।"},{"en":"His parents had often wondered who would become the rainmaker after grandmother passed away. Vijay couldn't wait to return to the city.","hi":"उसके माता-पिता अक्सर सोचते थे कि दादी के जाने के बाद कौन बारिश बुलाने वाला बनेगा। विजय शहर लौटने का इंतज़ार नहीं कर पा रहा था।"},{"en":"It hadn't rained there since the summer holidays and Vijay badly wanted the city to get some rain. He loved playing in the rain with his friends, jumping in {{puddles|गड्ढे}} and {{splashing|छींटे उड़ाना}} water with his bicycle.","hi":"वहाँ गर्मी की छुट्टियों से बारिश नहीं हुई थी और विजय बहुत चाहता था कि शहर में बारिश हो। उसे दोस्तों के साथ बारिश में खेलना, गड्ढों में कूदना और साइकिल से पानी उछालना बहुत पसंद था।"}],[{"en":"He remembered his grandmother's warning, \"Use the gift well, Vijay. And remember, you can call the rains only once every year.","hi":"उसे दादी की चेतावनी याद आई, \"इस उपहार का सही उपयोग करना, विजय। और याद रखना, तुम साल में केवल एक बार बारिश बुला सकते हो।"},{"en":"Use it well for your people.\" At the time he had felt as though his grandmother had given him his favorite ice cream and then told him not to eat it.","hi":"इसे अपने लोगों के भले के लिए इस्तेमाल करना।\" उस समय उसे ऐसा लगा था मानो दादी ने उसे उसकी पसंदीदा आइसक्रीम दी हो और फिर कहा हो कि उसे खाना मत।"},{"en":"\"But I want rain in the city,\" he thought in {{dismay|निराशा}}. \"I want to play in the rain!\"","hi":"\"लेकिन मुझे शहर में बारिश चाहिए,\" उसने निराशा से सोचा। \"मुझे बारिश में खेलना है!\""}],[{"en":"Vijay and his parents got into the car and his dad drove slowly through the village. They had left all the houses behind and there were open fields on either side.","hi":"विजय और उसके माता-पिता कार में बैठ गए और पापा ने गाँव के बीच से धीरे-धीरे गाड़ी चलाई। वे सारे घर पीछे छोड़ चुके थे और दोनों ओर खुले खेत थे।"},{"en":"Vijay saw an old man leading two cows; he was headed out of the village like they were. \"Amma,\" said Vijay, \"where do you think he is taking the cows?\"","hi":"विजय ने एक बूढ़े आदमी को दो गायों को ले जाते देखा; वह भी उन्हीं की तरह गाँव से बाहर जा रहा था। \"अम्मा,\" विजय ने कहा, \"आपके हिसाब से वह गायों को कहाँ ले जा रहा है?\""},{"en":"\"Probably to the butchers,\" she said, barely giving the cows and the man a second look. \"Because of this {{drought|सूखा}}, he can't feed them and has to sell them to get whatever money he can.\"","hi":"\"शायद कसाई के पास,\" उन्होंने गायों और उस आदमी पर दूसरी नज़र डाले बिना कहा। \"इस सूखे की वजह से वह उन्हें खिला नहीं सकता और जो भी पैसा मिले, उसके लिए उन्हें बेचना पड़ता है।\""}],[{"en":"Vijay's throat went dry. He hadn't known that people sold their cattle during a drought.","hi":"विजय का गला सूख गया। उसे पता नहीं था कि सूखे के दौरान लोग अपने पशु बेच देते हैं।"},{"en":"A few minutes later, Vijay saw a woman with two very young girls carrying buckets on their heads. The girls looked tired and {{miserable|बदहाल}}.","hi":"कुछ मिनट बाद विजय ने एक औरत को दो बहुत छोटी लड़कियों के साथ देखा, जो सिर पर बाल्टियाँ ढो रही थीं। लड़कियाँ थकी और बदहाल लग रही थीं।"},{"en":"\"Amma,\" Vijay said again, \"where do you think they are coming from?\"","hi":"\"अम्मा,\" विजय ने फिर कहा, \"आपके हिसाब से वे कहाँ से आ रही हैं?\""}],[{"en":"\"From the neighbouring village perhaps. The poor women have to walk for miles and miles to get water to drink.","hi":"\"शायद पड़ोस के गाँव से। बेचारी औरतों को पीने का पानी लाने के लिए मीलों-मील पैदल चलना पड़ता है।"},{"en":"At least, we don't have that problem in the city.\" As the last of the fields gave way, Vijay saw a puja being performed in the middle of a field that was dry and {{cracked|दरारों वाला}}.","hi":"कम से कम हमें शहर में यह समस्या नहीं है।\" जैसे ही आख़िरी खेत पीछे छूटे, विजय ने एक सूखे और दरारों वाले खेत के बीच पूजा होते देखी।"},{"en":"\"Appa, look!\" he pointed, \"They are having a celebration.\" \"No, Vijay,\" his father said.","hi":"\"पापा, देखिए!\" उसने इशारा किया, \"वे उत्सव मना रहे हैं।\" \"नहीं विजय,\" उसके पिता ने कहा।"}],[{"en":"\"When there have been no rains in a long time, the villagers here perform a wedding {{ceremony|रस्म}} for frogs. They believe that it will bring rains.\"","hi":"\"जब बहुत समय तक बारिश नहीं होती, तो यहाँ के गाँववाले मेंढकों की शादी की रस्म करते हैं। उनका विश्वास है कि इससे बारिश आएगी।\""},{"en":"Vijay knew from the tone of his father's voice that he didn't believe in what the people were doing. \"Appa,\" said Vijay as they reached the banyan tree that marked the village {{boundary|सीमा}}.","hi":"विजय ने पिता की आवाज़ के लहजे से जान लिया कि वे लोगों के इस काम में विश्वास नहीं रखते। \"पापा,\" विजय ने कहा, जब वे उस बरगद के पास पहुँचे जो गाँव की सीमा का निशान था।"},{"en":"\"Can you please stop by the banyan tree?\" His father looked at him {{curiously|उत्सुकता से}}, but stopped near the tree.","hi":"\"क्या आप कृपया बरगद के पास गाड़ी रोक सकते हैं?\" उसके पिता ने उसे उत्सुकता से देखा, पर पेड़ के पास गाड़ी रोक दी।"}],[{"en":"Vijay got down from the car, took off his shoes and leaving them in the car, he walked across the dry earth and stood in the shade of the tree. He could see that the banyan tree itself was beginning to die from the drought.","hi":"विजय कार से उतरा, जूते कार में ही छोड़े और सूखी ज़मीन पर चलकर पेड़ की छाया में खड़ा हो गया। वह देख सकता था कि बरगद का पेड़ ख़ुद भी सूखे से मरने लगा था।"},{"en":"He closed his eyes, thought of his grandmother, and repeated the words she had told him: \"Rain in vain we wait. Come now, come flow.","hi":"उसने आँखें बंद कीं, दादी को याद किया और उनके बताए शब्द दोहराए: \"बारिश, हम व्यर्थ राह देखते हैं। अब आओ, बरसो।"},{"en":"Turn our land into green gold.\" For a few minutes, nothing happened.","hi":"हमारी ज़मीन को हरे सोने में बदल दो।\" कुछ मिनट तक कुछ नहीं हुआ।"}],[{"en":"Vijay thought he had failed. Then just as he was walking back to the car, he felt the first drops of rain fall on his {{eyelashes|पलकें}} and on his head.","hi":"विजय को लगा कि वह असफल हो गया। तभी, जब वह कार की ओर लौट रहा था, उसने अपनी पलकों और सिर पर बारिश की पहली बूँदें गिरती महसूस कीं।"}]],"vocab":[["expression","noun","भाव, चेहरे के हाव-भाव","look, appearance","—","a look on the face that shows feelings"],["pause","verb","रुकना, ठहरना","stop, halt","continue","to stop for a short time"],["conclusion","noun","निष्कर्ष, नतीजा","decision, inference","beginning","a decision reached after thinking"],["gulp","noun","निवाला, घूँट","swallow, mouthful","sip","an act of swallowing quickly"],["tremble","verb","काँपना","shake, shiver","steady","to shake slightly because of fear or weakness"],["pale","adj","पीला, फीका","pallid, colourless","rosy","light in colour; having little colour in the face"],["frighten","verb","डराना","scare, terrify","comfort","to make someone afraid"],["whisper","verb","फुसफुसाना","murmur, mutter","shout","to speak very softly"],["thrilled","adj","रोमांचित, बहुत ख़ुश","excited, delighted","bored","extremely happy and excited"],["appoint","verb","नियुक्त करना","select, assign","dismiss","to choose someone for a job or role"],["puddle","noun","गड्ढे का पानी, चहबच्चा","pool, pond","—","a small pool of water on the ground"],["splash","verb","छींटे उड़ाना","spatter, sprinkle","—","to make water fly about in drops"],["dismay","noun","निराशा, घबराहट","distress, alarm","delight","a feeling of worry and disappointment"],["drought","noun","सूखा","dry spell, aridity","flood","a long period with very little rain"],["miserable","adj","दुखी, बदहाल","wretched, unhappy","cheerful","very unhappy or uncomfortable"],["crack","verb","दरार पड़ना","split, break","mend","to break without separating into pieces"],["ceremony","noun","रस्म, समारोह","ritual, function","—","a formal event held on a special occasion"],["boundary","noun","सीमा","border, limit","interior","a line that marks the limit of an area"],["curious","adj","जिज्ञासु, उत्सुक","inquisitive, interested","indifferent","eager to know or learn something"],["eyelash","noun","पलक का बाल, बरौनी","lash","—","one of the short hairs on the edge of the eyelid"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["figure out","समझ लेना, हल निकालना","I couldn't figure out the answer to the last question.","to understand or solve something"],["pass away","गुज़र जाना (निधन होना)","His grandfather passed away last year.","to die (a polite way to say it)"],["give way","ढह जाना; जगह दे देना","The old bridge gave way under the heavy truck.","to collapse, or to be replaced by something else"]],"fq":[]},{"id":"ev-ed214","title":"The Tiger’s Whisker","src":"Evergreen library · Topic: Global Issues","c":"Global Issues","todo":"","ed":[[{"en":"An old {{hermit|साधु}} lived in the Lun Mountains of Korea. Many people {{sought|माँगते थे}} his advice, for he was a font of wisdom and was knowledgeable in the magical arts.","hi":"कोरिया के लुन पर्वतों में एक बूढ़ा साधु रहता था। बहुत से लोग उससे सलाह लेने आते थे, क्योंकि वह ज्ञान का भंडार था और जादुई विद्याओं का जानकार था।"},{"en":"One day, a woman came and {{pleaded|गिड़गिड़ाई}} with him to help her {{regain|वापस पाना}} her husband's {{affection|स्नेह}}. “He was so loving and caring before he left for the wars,\" she explained.","hi":"एक दिन एक औरत आई और गिड़गिड़ाकर बोली कि वह उसके पति का प्यार वापस पाने में उसकी मदद करे। \"युद्ध पर जाने से पहले वह बहुत प्यार करने वाला और परवाह करने वाला था,\" उसने बताया।"},{"en":"\"He has returned after three years, but now he is cold and {{aloof|उदासीन}}.\" \"War does these things to men,\" said the hermit.","hi":"\"तीन साल बाद वह लौटा है, पर अब वह ठंडा और उदासीन है।\" \"युद्ध आदमियों के साथ ऐसा ही करता है,\" साधु ने कहा।"}],[{"en":"\"They say you can make a {{potion|औषधि}} that can {{kindle|जगाना}} love in the person who consumes it,\" said the woman. \"I could make such a potion, it is true, but I lack one of the {{ingredients|सामग्री}} that go into its making.\"","hi":"\"लोग कहते हैं कि आप ऐसी औषधि बना सकते हैं जो पीने वाले के मन में प्रेम जगा दे,\" औरत ने कहा। \"मैं ऐसी औषधि बना सकता हूँ, यह सच है, पर इसे बनाने की एक सामग्री मेरे पास नहीं है।\""},{"en":"\"What is this ingredient?\" asked the woman. \"It is a tiger’s whisker.\"","hi":"\"वह सामग्री क्या है?\" औरत ने पूछा। \"बाघ की एक मूँछ।\""},{"en":"The woman left, promising to get what he wanted. The very next day, she went in search of a tiger and finally saw one on the banks of a river.","hi":"औरत वादा करके चली गई कि वह वही ले आएगी जो साधु ने माँगा है। अगले ही दिन वह बाघ की खोज में निकल पड़ी और आख़िरकार नदी के किनारे एक बाघ को देखा।"}],[{"en":"The tiger {{snarled|गुर्राया}} when he saw her and she {{retreated|पीछे हट गई}}. She returned to the spot the next day.","hi":"बाघ उसे देखकर गुर्राया और वह पीछे हट गई। अगले दिन वह उसी जगह लौट आई।"},{"en":"Again, the tiger snarled, and again she retreated. But she kept going to the place, and {{gradually|धीरे-धीरे}} the animal got used to her presence and stopped snarling.","hi":"बाघ फिर गुर्राया और वह फिर पीछे हट गई। पर वह उस जगह जाती रही, और धीरे-धीरे जानवर को उसकी मौजूदगी की आदत हो गई और उसने गुर्राना बंद कर दिया।"},{"en":"She began to bring him food. In course of time, the tiger became so friendly that he would come right up to her to take the food.","hi":"वह उसके लिए खाना लाने लगी। समय के साथ बाघ इतना मित्रवत हो गया कि वह सीधे उसके पास आकर खाना ले लेता।"}],[{"en":"One day she {{timidly|डरते-डरते}} reached out and patted his head. A few days later, she ran her hand down the side of his face.","hi":"एक दिन उसने डरते-डरते हाथ बढ़ाकर उसका सिर थपथपाया। कुछ दिन बाद उसने उसके चेहरे के किनारे पर हाथ फेरा।"},{"en":"And then one day, she {{deftly|चतुराई से}} pulled out one of his whiskers. She rushed to the hermit’s house with the whisker.","hi":"और फिर एक दिन उसने चतुराई से उसकी एक मूँछ खींच ली। वह मूँछ लेकर साधु के घर दौड़ी।"},{"en":"\"I've got it!\" she said {{triumphantly|विजयी भाव से}}. \"Good,\" said the hermit.","hi":"\"मुझे मिल गई!\" उसने विजयी भाव से कहा। \"अच्छा,\" साधु ने कहा।"}],[{"en":"He took the whisker to the fireplace and dropped it into the fire. “W-what have you done!\" said the woman, {{aghast|स्तब्ध}}.","hi":"वह मूँछ को अँगीठी के पास ले गया और आग में डाल दी। \"आ-आपने यह क्या किया!\" औरत स्तब्ध होकर बोली।"},{"en":"\"You promised to make me a magic potion!\" \"You don’t need one,\" said the hermit, softly.","hi":"\"आपने मुझे जादुई औषधि बनाने का वादा किया था!\" \"तुम्हें उसकी ज़रूरत नहीं,\" साधु ने धीरे से कहा।"},{"en":"\"Tell me, how did you win the tiger’s affection? Through gentleness and a great deal of {{patience|धैर्य}}.","hi":"\"मुझे बताओ, तुमने बाघ का स्नेह कैसे जीता? कोमलता और बहुत सारे धैर्य से।"}],[{"en":"Would a man be less {{responsive|संवेदनशील}} than a {{savage|जंगली}} and {{bloodthirsty|खूँखार}} beast? Go and win over your husband as you did the tiger.\"","hi":"क्या कोई आदमी एक जंगली और खूँखार जानवर से भी कम संवेदनशील होगा? जाओ और अपने पति का दिल जीतो, जैसे बाघ का जीता था।\""},{"en":"The woman turned over what the hermit had said in her mind as she slowly made her way home. When she saw her husband, her first instinct was to turn away.","hi":"औरत साधु की बात मन में दोहराती हुई धीरे-धीरे घर की ओर चली। पति को देखकर उसकी पहली प्रवृत्ति मुँह फेर लेने की थी।"},{"en":"Then remembering the tiger and the hermit’s words, she checked herself and moved forward, a smile on her face.","hi":"फिर बाघ और साधु की बातें याद करके उसने ख़ुद को रोका और मुस्कान के साथ आगे बढ़ी।"}]],"vocab":[["hermit","noun","साधु, संन्यासी","recluse, ascetic","socialite","a person who lives alone, away from society"],["sought","verb","खोजा, माँगा (seek का भूतकाल)","looked for, asked for","avoided","past form of seek: to look for or ask for"],["plead","verb","गिड़गिड़ाना, विनती करना","beg, implore","refuse","to ask for something in an emotional way"],["regain","verb","फिर से पाना","recover, retrieve","lose","to get something back"],["affection","noun","स्नेह, लगाव","fondness, love","hatred","a gentle feeling of liking and caring"],["aloof","adj","उदासीन, अलग-थलग","distant, cold","friendly","not friendly; keeping away from others"],["potion","noun","औषधि, जादुई घोल","drink, elixir","—","a drink with medicinal or magical powers"],["kindle","verb","जगाना, सुलगाना","ignite, arouse","extinguish","to start a fire or arouse a feeling"],["ingredient","noun","सामग्री, अवयव","component, element","—","one of the things used to make something"],["snarl","verb","गुर्राना","growl, grumble","purr","to growl angrily, showing teeth"],["retreat","verb","पीछे हटना","withdraw, back off","advance","to move back or away"],["gradually","adv","धीरे-धीरे","slowly, bit by bit","suddenly","slowly over a period of time"],["timidly","adv","डरते-डरते, झिझकते हुए","shyly, nervously","boldly","in a shy and fearful way"],["deftly","adv","चतुराई से, कुशलता से","skilfully, nimbly","clumsily","in a quick and skilful way"],["triumphantly","adv","विजयी भाव से","victoriously, proudly","dejectedly","with joy because of a success"],["aghast","adj","स्तब्ध, हक्का-बक्का","shocked, horrified","unmoved","filled with shock or horror"],["patience","noun","धैर्य","tolerance, calmness","impatience","the ability to wait calmly without getting angry"],["responsive","adj","संवेदनशील, प्रतिक्रिया देने वाला","reactive, receptive","unresponsive","reacting quickly and in a positive way"],["bloodthirsty","adj","खूँखार, हिंसक","cruel, savage","gentle","eager to kill or hurt"],["savage","adj","जंगली, क्रूर","wild, fierce","tame","fierce, cruel and uncontrolled"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["font of wisdom","ज्ञान का भंडार","Our grandmother is a font of wisdom.","a person with a lot of knowledge and good advice"],["win over","अपनी ओर कर लेना, मना लेना","She won over the angry crowd with her smile.","to persuade someone to like or support you"],["in course of time","समय के साथ","In course of time, the pain faded.","after some time has passed"]],"fq":[]},{"id":"ev-ed215","title":"The Tiny Tormentor","src":"Evergreen library · Topic: Science & Tech","c":"Science & Tech","todo":"","ed":[[{"en":"KING NICHOLAS of Russia was a {{tyrant|अत्याचारी}}. His {{subjects|प्रजा}} were very unhappy but could do nothing about it.","hi":"रूस का राजा निकोलस एक अत्याचारी था। उसकी प्रजा बहुत दुखी थी, पर इसके बारे में कुछ कर नहीं सकती थी।"},{"en":"Tales of his {{despotism|निरंकुश शासन}} spread far and wide until they reached the ears of a flea who {{resolved|निश्चय किया}} to teach the king a lesson. One night, when the king lay down to sleep, he felt a sharp {{prick|चुभन}}.","hi":"उसके निरंकुश शासन की कहानियाँ दूर-दूर तक फैलीं और एक पिस्सू के कानों तक पहुँचीं, जिसने राजा को सबक सिखाने का निश्चय किया। एक रात जब राजा सोने के लिए लेटा, तो उसे तेज़ चुभन महसूस हुई।"},{"en":"“OWWWWW!\" he screamed. “What’s that?”","hi":"“आआआउ!” वह चीख़ा। “यह क्या है?”"}],[{"en":"“A flea who wants to correct your behaviour,” came the reply. “I will correct your behaviour, you {{miserable|तुच्छ}} insect!” roared the {{furious|क्रोधित}} king.","hi":"“एक पिस्सू, जो तुम्हारा व्यवहार सुधारना चाहता है,” जवाब आया। “मैं तुम्हारा व्यवहार सुधारूँगा, तुम तुच्छ कीड़े!” क्रोधित राजा दहाड़ा।"},{"en":"He got out of bed and shook his bedclothes, but unknown to him, the flea was {{nestled|दुबका}} in his beard. When he went back to bed, he was again bitten.","hi":"वह बिस्तर से उठा और अपनी चादरें झाड़ीं, पर उसे पता नहीं था कि पिस्सू उसकी दाढ़ी में छिपा बैठा है। जब वह बिस्तर पर लौटा, तो उसे फिर काट लिया गया।"},{"en":"“You, who are no bigger than a grain of sand, dare to attack the {{mightiest|सबसे शक्तिशाली}} king?” yelled Nicholas. “I’ll teach you.”","hi":"“तू, जो रेत के कण से बड़ा नहीं है, सबसे शक्तिशाली राजा पर हमला करने की हिम्मत करता है?” निकोलस चिल्लाया। “मैं तुझे सबक सिखाऊँगा।”"}],[{"en":"The flea didn’t bother to reply but continued biting him. Nicholas got up the next morning in a terrible {{temper|मिज़ाज}} as he hadn’t slept a wink.","hi":"पिस्सू ने जवाब देने की ज़हमत नहीं उठाई और काटता रहा। अगली सुबह निकोलस बहुत बुरे मिज़ाज में उठा, क्योंकि वह पलक तक नहीं झपक पाया था।"},{"en":"On his orders, the servants {{scrubbed|रगड़कर साफ़ किया}} the entire palace clean. But they couldn’t find the flea as she was {{tucked|दुबका}} under Nicholas’ coat collar.","hi":"उसके आदेश पर नौकरों ने पूरा महल रगड़-रगड़कर साफ़ किया। पर वे पिस्सू को नहीं ढूँढ पाए, क्योंकि वह निकोलस के कोट के कॉलर में दुबका था।"},{"en":"When the king went to bed at night, he felt the familiar stinging bite. “You’re still here?” he shouted.","hi":"रात को जब राजा बिस्तर पर गया, तो उसे वही जानी-पहचानी चुभन फिर महसूस हुई। “तू अब भी यहीं है?” वह चिल्लाया।"}],[{"en":"“What do you want?” “Make your subjects happy,” {{commanded|आदेश दिया}} the flea.","hi":"“तुम्हें क्या चाहिए?” “अपनी प्रजा को ख़ुश करो,” पिस्सू ने आदेश दिया।"},{"en":"“Servants! Where are you?”","hi":"“नौकरो! कहाँ हो तुम?”"},{"en":"His servants rushed into the room. They pulled the bed to pieces and tore up the carpets.","hi":"उसके नौकर कमरे में दौड़े आए। उन्होंने बिस्तर के टुकड़े-टुकड़े कर दिए और क़ालीन फाड़ डाले।"}],[{"en":"But they couldn’t {{trace|पता लगाना}} the flea as she was hidden in Nicholas’ hair. He tried sleeping in another room but it was of no use.","hi":"पर वे पिस्सू का पता नहीं लगा सके, क्योंकि वह निकोलस के बालों में छिपा था। उसने दूसरे कमरे में सोने की कोशिश की, पर कोई फ़ायदा नहीं हुआ।"},{"en":"The next day, Nicholas ordered his subjects to {{exterminate|जड़ से मिटाना}} all fleas. But he continued to be {{harassed|परेशान}} by the {{irrepressible|अदम्य}} creature for days.","hi":"अगले दिन निकोलस ने अपनी प्रजा को सारे पिस्सू मार डालने का आदेश दिया। पर वह उस अदम्य जीव से कई दिनों तक परेशान होता रहा।"},{"en":"He became weak and pale with sleeplessness. His body was full of {{bruises|चोट के निशान}} because of all the blows he had administered in an effort to crush his enemy.","hi":"नींद न आने से वह कमज़ोर और पीला पड़ गया। अपने दुश्मन को कुचलने की कोशिश में उसने जितने वार किए थे, उनसे उसका शरीर चोटों से भर गया।"}],[{"en":"Finally, he gave in. “Enough!” he cried one night.","hi":"आख़िर उसने हार मान ली। “बस!” एक रात वह चिल्लाया।"},{"en":"“I’ll do whatever you tell me to do.” “Like I said, make your people happy,” said the flea.","hi":"“तुम जो कहोगे, मैं वही करूँगा।” “जैसा मैंने कहा, अपनी प्रजा को ख़ुश करो,” पिस्सू ने कहा।"},{"en":"“How?” “By leaving the kingdom.”","hi":"“कैसे?” “राज्य छोड़कर।”"}],[{"en":"The very next day, Nicholas announced that he was {{abdicating|गद्दी छोड़ना}} the throne. One of his ministers, a wise and respected man, was {{crowned|ताज पहनाया गया}} the king.","hi":"अगले ही दिन निकोलस ने घोषणा की कि वह गद्दी छोड़ रहा है। उसके मंत्रियों में से एक, जो बुद्धिमान और सम्मानित व्यक्ति था, राजा बनाया गया।"},{"en":"Nicholas then went away to a neighbouring kingdom and was never heard of again.","hi":"फिर निकोलस पड़ोसी राज्य चला गया और उसके बारे में फिर कभी कुछ सुनने को नहीं मिला।"}]],"vocab":[["tyrant","noun","अत्याचारी शासक","despot, oppressor","benefactor","a cruel ruler who uses power unfairly"],["subject","noun","प्रजा, अधीन व्यक्ति","citizen, follower","ruler","a person who lives under a ruler's authority"],["despotism","noun","निरंकुश शासन","tyranny, autocracy","democracy","rule by one person with absolute power"],["resolve","verb","निश्चय करना","decide, determine","waver","to decide firmly to do something"],["prick","noun","चुभन","sting, jab","—","a sharp pain from something pointed"],["miserable","adj","तुच्छ; दुखी","wretched, unhappy","cheerful","very unhappy; poor and worthless"],["furious","adj","क्रोधित, आग-बबूला","enraged, livid","calm","extremely angry"],["nestle","verb","दुबकना, सटकर बैठना","snuggle, cuddle","—","to settle comfortably and closely"],["mighty","adj","शक्तिशाली","powerful, strong","weak","having great power or strength"],["temper","noun","मिज़ाज, ग़ुस्सा","mood, rage","calmness","a state of mind, especially anger"],["scrub","verb","रगड़कर साफ़ करना","scour, rub","soil","to clean by rubbing hard"],["tuck","verb","दुबकाना, खोंसना","insert, slip","pull out","to push into a small space"],["command","verb","आदेश देना","order, direct","obey","to give an order with authority"],["trace","verb","पता लगाना","track, find","lose","to find someone or something after searching"],["exterminate","verb","जड़ से मिटाना","destroy, wipe out","preserve","to kill all of a kind"],["harass","verb","परेशान करना","torment, pester","help","to trouble someone again and again"],["irrepressible","adj","अदम्य, जिसे दबाया न जा सके","unstoppable, unquenchable","restrained","impossible to control or hold back"],["bruise","noun","चोट का नीला निशान","contusion, mark","—","a dark mark on the skin after a blow"],["abdicate","verb","गद्दी छोड़ना","resign, step down","reign","to give up the throne or power"],["crown","verb","ताज पहनाना","enthrone, install","dethrone","to make someone king or queen formally"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["far and wide","दूर-दूर तक","The news of his victory spread far and wide.","over a very large area"],["not sleep a wink","पलक भी न झपकना, बिल्कुल न सो पाना","I didn't sleep a wink before the exam.","to not sleep at all"],["give in","हार मान लेना","After hours of arguing, he finally gave in.","to stop resisting and agree"]],"fq":[]},{"id":"ev-ed220","title":"Walking On Water","src":"Evergreen library · Topic: Speaking Tree","c":"Speaking Tree","todo":"","ed":[[{"en":"Once, three young monks sat on the bank of a river in {{meditation|ध्यान}}. The youngest of the monks began to feel {{restless|बेचैन}} as the ground on which they were sitting was hard.","hi":"एक बार तीन युवा भिक्षु नदी किनारे ध्यान में बैठे थे। सबसे छोटा भिक्षु बेचैन होने लगा, क्योंकि जिस ज़मीन पर वे बैठे थे वह सख़्त थी।"},{"en":"\"I'd be able to {{concentrate|ध्यान लगाना}} better if I could sit on my prayer mat,\" he thought. He got up and, excusing himself, walked across the river to {{fetch|लाना}} his prayer mat from the {{hermitage|आश्रम}}.","hi":"“अगर मैं अपनी प्रार्थना की चटाई पर बैठूँ तो ज़्यादा अच्छी तरह ध्यान लगा पाऊँगा,” उसने सोचा। वह उठा और क्षमा माँगकर नदी पार चलकर आश्रम से अपनी प्रार्थना की चटाई लाने गया।"},{"en":"The senior-most monk saw this. \"I can't believe it!\" he said, {{staring|घूरते हुए}} at the young monk in {{disbelief|अविश्वास}}.","hi":"सबसे वरिष्ठ भिक्षु ने यह देखा। “मुझे यक़ीन नहीं हो रहा!” उसने अविश्वास से उस युवा भिक्षु को घूरते हुए कहा।"}],[{"en":"\"When did he learn to walk on water?\" Just then, the other monk got up with a start.","hi":"“इसने पानी पर चलना कब सीखा?” तभी दूसरा भिक्षु चौंककर उठ खड़ा हुआ।"},{"en":"\"Oh, no! I've left my {{laundry|धुलाई के कपड़े}} in the bucket!","hi":"“अरे नहीं! मैं अपने कपड़े बाल्टी में ही छोड़ आया!"},{"en":"If I don't hang them up to dry, I shan't have dry clothes to change into!\" And he too ran across the river to the hermitage.","hi":"अगर मैंने उन्हें सूखने के लिए नहीं टाँगा, तो बदलने के लिए सूखे कपड़े नहीं रहेंगे!” और वह भी नदी पार दौड़कर आश्रम चला गया।"}],[{"en":"\"He can walk on water too!\" said the {{astonished|चकित}} senior-most monk. \"I've been a monk here for so many years but I've never walked on water.","hi":"“यह भी पानी पर चल सकता है!” चकित वरिष्ठ भिक्षु ने कहा। “मैं यहाँ इतने सालों से भिक्षु हूँ, पर मैं कभी पानी पर नहीं चला।"},{"en":"Well, if those two can, surely I should be able to do it too.\" He stepped into the river but his feet went right through the water.","hi":"अगर ये दोनों चल सकते हैं, तो मैं भी ज़रूर चल सकता हूँ।” उसने नदी में क़दम रखा, पर उसके पैर पानी के आर-पार निकल गए।"},{"en":"He would have {{drowned|डूब जाता}} if the other two monks hadn't come to his {{rescue|बचाव}}. Feeling {{humiliated|अपमानित}}, he decided to leave the {{monastery|मठ}} and go back to his old way of life.","hi":"अगर बाक़ी दोनों भिक्षु उसे बचाने न आते तो वह डूब जाता। अपमानित महसूस करके उसने मठ छोड़कर अपने पुराने जीवन में लौटने का फ़ैसला किया।"}],[{"en":"{{Subsequently|बाद में}}, he got married and had children. Then one day, he took his family to see the old monastery.","hi":"बाद में उसने शादी की और उसके बच्चे हुए। फिर एक दिन वह अपने परिवार को पुराना मठ दिखाने ले गया।"},{"en":"\"Father! Father!","hi":"“पिताजी! पिताजी!"},{"en":"Look at that monk walking across the river!\" shouted his son {{excitedly|उत्साह से}}. \"Yes, my son, the monks here are able to walk on water.\"","hi":"उस भिक्षु को देखिए, नदी पार चलकर आ रहा है!” उसका बेटा उत्साह से चिल्लाया। “हाँ बेटा, यहाँ के भिक्षु पानी पर चल सकते हैं।”"}],[{"en":"The little boy was {{intrigued|जिज्ञासु}}. When the monk reached the bank, he ran to him.","hi":"छोटे लड़के की जिज्ञासा जाग गई। जब भिक्षु किनारे पर पहुँचा, तो वह उसकी ओर दौड़ा।"},{"en":"\"Please will you teach me to walk on water?\" he asked. The monk looked {{blankly|हक्का-बक्का होकर}} at the boy for a moment, and then burst out laughing.","hi":"“क्या आप मुझे पानी पर चलना सिखाएँगे?” उसने पूछा। भिक्षु ने एक पल के लिए लड़के को हक्का-बक्का होकर देखा और फिर ज़ोर से हँस पड़ा।"},{"en":"\"All right, but make sure you follow my steps carefully!\" he said. The little boy caught hold of the monk's hand with one hand and {{grabbed|थाम लिया}} his {{robe|चोगा}} from behind with the other.","hi":"“ठीक है, पर मेरे क़दमों का ध्यान से पालन करना!” उसने कहा। छोटे लड़के ने एक हाथ से भिक्षु का हाथ पकड़ा और दूसरे हाथ से पीछे से उसका चोगा थाम लिया।"}],[{"en":"Then very carefully, he put his leg in the river just as he saw the monk do, and stepping on the {{pathway|पगडंडी}} of stones below the surface, he walked across to the other side.","hi":"फिर बहुत सावधानी से उसने अपना पैर नदी में रखा, ठीक वैसे ही जैसे उसने भिक्षु को करते देखा था, और सतह के नीचे पत्थरों के रास्ते पर क़दम रखते हुए वह दूसरी ओर चल पहुँचा।"}]],"vocab":[["meditation","noun","ध्यान","contemplation, reflection","distraction","calming the mind by thinking deeply"],["restless","adj","बेचैन","uneasy, fidgety","calm","unable to stay still or relax"],["concentrate","verb","ध्यान लगाना","focus, attend","wander","to give all your attention to something"],["fetch","verb","लाना, ले आना","bring, get","take away","to go and bring something back"],["hermitage","noun","आश्रम","retreat, sanctuary","—","a place where religious people live in quiet"],["stare","verb","घूरना","gaze, glare","glance","to look at someone for a long time"],["disbelief","noun","अविश्वास","doubt, scepticism","belief","the feeling of not being able to believe something"],["laundry","noun","धुलाई के कपड़े","washing, clothes","—","clothes that need washing or have been washed"],["astonished","adj","चकित, हैरान","amazed, stunned","unimpressed","very surprised"],["drown","verb","डूबना","sink, submerge","float","to die under water because one cannot breathe"],["rescue","noun","बचाव","saving, deliverance","capture","the act of saving someone from danger"],["humiliated","adj","अपमानित","embarrassed, ashamed","honoured","made to feel ashamed or foolish"],["monastery","noun","मठ","abbey, cloister","—","a building where monks live"],["subsequently","adv","बाद में","later, afterwards","previously","at a later time"],["excitedly","adv","उत्साह से","eagerly, enthusiastically","calmly","in a way that shows great interest and joy"],["intrigued","adj","जिज्ञासु, उत्सुक","fascinated, curious","bored","very interested and wanting to know more"],["blankly","adv","हक्का-बक्का होकर, भावहीन","vacantly, emptily","keenly","without showing any understanding or feeling"],["grab","verb","झपटकर पकड़ना","seize, snatch","release","to take hold of something suddenly"],["robe","noun","चोगा, लबादा","gown, cloak","—","a long loose piece of clothing"],["pathway","noun","पगडंडी, रास्ता","path, track","—","a way or track for walking"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["burst out laughing","अचानक ज़ोर से हँस पड़ना","The class burst out laughing at the joke.","to suddenly start laughing loudly"],["come to one's rescue","मदद के लिए आगे आना","A stranger came to her rescue.","to help someone who is in trouble"],["with a start","चौंककर","He woke up with a start.","suddenly, because of surprise or fear"]],"fq":[]},{"id":"ev-ed221","title":"Well Spotted","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"One morning Ben woke up feeling strange. He had a headache and was {{itchy|खुजली वाला}} all over.","hi":"एक सुबह बेन अजीब सा महसूस करते हुए उठा। उसके सिर में दर्द था और पूरे बदन में खुजली हो रही थी।"},{"en":"He was covered in big red spots. “Mum, Mum!","hi":"वह बड़े-बड़े लाल दानों से ढका था। “माँ, माँ!"},{"en":"Come and see,” he called out. His mother {{poked|झाँका}} her head round the door.","hi":"आकर देखो,” उसने आवाज़ लगाई। उसकी माँ ने दरवाज़े से सिर अंदर झाँका।"}],[{"en":"“What’s the matter? Oh dear,” she said.","hi":"“क्या बात है? अरे बाप रे,” उसने कहा।"},{"en":"“It looks like chicken pox. No school for you today.","hi":"“यह चिकनपॉक्स (छोटी माता) लगता है। आज स्कूल नहीं जाना है।"},{"en":"It’s highly {{infectious|संक्रामक}}. Luckily I've had it and so has Dad.","hi":"यह बहुत संक्रामक है। ख़ुशक़िस्मती से मुझे हो चुका है और तुम्हारे पापा को भी।"}],[{"en":"You can't catch it again if you've had it once.” “But what about Mrs McDonald's birthday?”","hi":"एक बार हो जाए तो दोबारा नहीं होता।” “पर मिसेज़ मैकडॉनल्ड के जन्मदिन का क्या होगा?”"},{"en":"Mrs McDonald was an old lady who lived two houses away. She was nearly Ben's best friend, apart from Suki the cat and Jon from school who came and played most weekends.","hi":"मिसेज़ मैकडॉनल्ड एक बुज़ुर्ग महिला थीं जो दो घर छोड़कर रहती थीं। वे लगभग बेन की सबसे अच्छी दोस्त थीं, बिल्ली सूकी और स्कूल के जॉन के अलावा, जो ज़्यादातर सप्ताहांतों में आकर खेलता था।"},{"en":"He had known Mrs McDonald since he was a baby and today was her birthday. Ben had made a card and they were all going to take her a present that evening.","hi":"वह मिसेज़ मैकडॉनल्ड को तब से जानता था जब वह बच्चा था और आज उनका जन्मदिन था। बेन ने एक कार्ड बनाया था और वे सब आज शाम उन्हें तोहफ़ा देने जाने वाले थे।"}],[{"en":"Ben's dad had joined them. “Sorry {{chum|दोस्त}}, can't have you infecting Mrs McDonald.","hi":"बेन के पापा भी उनके पास आ गए थे। “माफ़ करना दोस्त, तुम्हारी वजह से मिसेज़ मैकडॉनल्ड को संक्रमण नहीं होने दे सकते।"},{"en":"She may not have had chicken pox, or it may be so long ago she can't remember. Mum and me will just take the things and give her your love.”","hi":"हो सकता है उन्हें चिकनपॉक्स न हुआ हो, या इतना पुराना हो कि उन्हें याद न हो। मम्मी और मैं सामान ले जाएँगे और उन्हें तुम्हारा प्यार दे देंगे।”"},{"en":"He {{peered|ग़ौर से देखा}} at Ben's spots. “You look terrible!","hi":"उसने बेन के दानों को ग़ौर से देखा। “तुम्हारी हालत बहुत बुरी लग रही है!"}],[{"en":"Still, be positive,” he said {{cheerily|ख़ुशमिज़ाजी से}} and went off to the office. The day wasn't much fun.","hi":"फिर भी, सकारात्मक रहो,” उसने ख़ुशमिज़ाजी से कहा और दफ़्तर चला गया। दिन ज़्यादा मज़ेदार नहीं रहा।"},{"en":"Television was boring and Ben knew all his old computer games backwards. He wrote Mrs McDonald a letter saying how sorry he was not to see her on her birthday.","hi":"टीवी उबाऊ था और बेन अपने सारे पुराने कंप्यूटर गेम उल्टे-सीधे जानता था। उसने मिसेज़ मैकडॉनल्ड को एक पत्र लिखा कि उनके जन्मदिन पर उनसे न मिल पाने का उसे कितना अफ़सोस है।"},{"en":"Dad came home with a new computer game which was mega good and made things a lot better. While he was playing Mum came into his room.","hi":"पापा एक नया कंप्यूटर गेम लेकर घर आए जो बहुत शानदार था और उससे हालत काफ़ी बेहतर हो गई। जब वह खेल रहा था, तब माँ उसके कमरे में आईं।"}],[{"en":"“We are taking our presents to Mrs McDonald. I baked her a cake and I've left a little one downstairs for you.","hi":"“हम मिसेज़ मैकडॉनल्ड को तोहफ़े देने जा रहे हैं। मैंने उनके लिए केक बनाया है और तुम्हारे लिए नीचे एक छोटा केक छोड़ा है।"},{"en":"Phone if there’s any trouble. The number's by the cake.","hi":"कोई दिक़्क़त हो तो फ़ोन करना। नंबर केक के पास रखा है।"},{"en":"See you in twenty minutes.” The door {{slammed|धड़ाम से बंद हुआ}} and Ben went back to his computer game.","hi":"बीस मिनट में मिलते हैं।” दरवाज़ा धड़ाम से बंद हुआ और बेन फिर अपने कंप्यूटर गेम में लग गया।"}],[{"en":"After a little while he heard a {{crash|धमाका}} and breaking glass downstairs. “Oh no, Suki's broken something,” he {{muttered|बुदबुदाया}} getting up.","hi":"थोड़ी देर बाद उसे नीचे से धमाके और काँच टूटने की आवाज़ आई। “अरे नहीं, सूकी ने कुछ तोड़ दिया,” वह बुदबुदाता हुआ उठा।"},{"en":"There was another bang and a {{scrabbling|खुरचने की}} noise. Ben was on the stairs.","hi":"एक और धमाका हुआ और खुरचने जैसी आवाज़ आई। बेन सीढ़ियों पर था।"},{"en":"The living room door was open. Inside a man with a {{shaven|मुँड़ा हुआ}} head and wearing a hoodie jacket and dirty jeans was pushing things into a {{sack|बोरा}}.","hi":"बैठक का दरवाज़ा खुला था। अंदर एक आदमी, जिसका सिर मुँड़ा हुआ था और जिसने हुडी जैकेट और गंदी जीन्स पहन रखी थी, चीज़ें बोरे में भर रहा था।"}],[{"en":"He looked up, holding Dad's county golf champion silver cup in his hand. “Don't come near, kid and you'll be all right,” he {{snarled|गुर्राया}}.","hi":"उसने ऊपर देखा, उसके हाथ में पापा का काउंटी गोल्फ़ चैंपियन वाला चाँदी का कप था। “पास मत आना, बच्चे, तो तुझे कुछ नहीं होगा,” वह गुर्राया।"},{"en":"Ben was {{trembling|काँपता}}, his {{palms|हथेलियाँ}} wet and sticky. Be positive, think of something!","hi":"बेन काँप रहा था, उसकी हथेलियाँ गीली और चिपचिपी थीं। सकारात्मक रहो, कुछ सोचो!"},{"en":"Trying to keep his voice steady, he said, “Will you be all right? I'm really infectious!","hi":"आवाज़ को स्थिर रखने की कोशिश करते हुए उसने कहा, “क्या आप ठीक रहेंगे? मुझे बहुत ज़्यादा छूत की बीमारी है!"}],[{"en":"There are twenty-seven spots on my face and those are only the ones I could see in the mirror.” The {{burglar|चोर}} looked sharply at Ben’s spotty face.","hi":"मेरे चेहरे पर सत्ताईस दाने हैं और ये तो सिर्फ़ वे हैं जो मैं शीशे में देख पाया।” चोर ने बेन के दानों भरे चेहरे को तीखी नज़र से देखा।"},{"en":"“Blimey, what have you got?” he asked. “Chicken pox.","hi":"“अरे बाप रे, तुझे क्या हुआ है?” उसने पूछा। “चिकनपॉक्स।"},{"en":"My mum says it’s really bad for grown- ups. Puts them in bed for weeks.","hi":"मेरी माँ कहती हैं कि बड़ों के लिए यह बहुत ख़राब होता है। हफ़्तों बिस्तर पर डाल देता है।"}],[{"en":"But you won’t get it if you’ve had it already. Have you had it?”","hi":"पर अगर आपको पहले हो चुका हो तो नहीं होगा। क्या आपको हुआ है?”"},{"en":"“No I haven’t. Don’t come near.”","hi":"“नहीं, मुझे नहीं हुआ। पास मत आना।”"},{"en":"Ben advanced, the burglar backed away. “Right, okay.","hi":"बेन आगे बढ़ा, चोर पीछे हटा। “ठीक है, चलो।"}],[{"en":"I’ll be off. See you,” he said picking up his sack.","hi":"मैं चलता हूँ। फिर मिलते हैं,” उसने अपना बोरा उठाते हुए कहा।"},{"en":"“I’d not take those things,” said Ben. “Mum says people catch chicken pox from {{sneezes|छींकें}}.","hi":"“मैं वे चीज़ें न ले जाता,” बेन ने कहा। “माँ कहती हैं कि चिकनपॉक्स छींकों से फैलता है।"},{"en":"I’ve been sneezing all over the place. There must be lots of {{germs|कीटाणु}} on our stuff.","hi":"मैं जगह-जगह छींकता रहा हूँ। हमारे सामान पर बहुत सारे कीटाणु होंगे।"}],[{"en":"You could get really sick.” The burglar threw down his sack.","hi":"आप सचमुच बीमार पड़ सकते हैं।” चोर ने अपना बोरा नीचे फेंक दिया।"},{"en":"“Right, right, okay, you win. Just don’t sneeze until I’m gone.”","hi":"“ठीक है, ठीक है, तू जीता। बस मेरे जाने तक छींकना मत।”"},{"en":"He {{crunched|चरमराया}} through broken glass on the floor and climbed out of the open window. Ben heard his footsteps running away down the side passage between houses.","hi":"वह फ़र्श पर टूटे काँच पर चरमराता हुआ चला और खुली खिड़की से बाहर निकल गया। बेन ने उसके क़दमों की आवाज़ सुनी जो घरों के बीच की गली में दूर भागती जा रही थी।"}],[{"en":"Phew! Ben went into the kitchen to find a {{dustpan|कूड़ा उठाने वाला पैन}} and brush to sweep up the glass.","hi":"उफ़! बेन रसोई में गया ताकि काँच साफ़ करने के लिए डस्टपैन और झाड़ू ढूँढ सके।"},{"en":"A chocolate cake was sitting on the worktop with a knife beside it. He cut himself a slice.","hi":"रसोई के काउंटर पर चॉकलेट केक रखा था, पास में चाकू भी था। उसने अपने लिए एक टुकड़ा काटा।"},{"en":"Then the phone rang. It was Dad.","hi":"तभी फ़ोन बजा। वह पापा थे।"}],[{"en":"“Hi Ben! Mrs M would like a word.”","hi":"“हाय बेन! मिसेज़ एम तुमसे बात करना चाहती हैं।”"},{"en":"There was a scratching and a clicking and instructions from Ben’s dad in the background, and then: “Hello Ben, thank you so much for the lovely card and letter and the presents. Are you all right all by yourself over there?\"","hi":"पीछे से खरखराहट, क्लिक की आवाज़ और बेन के पापा के निर्देश सुनाई दिए, और फिर: “हैलो बेन, सुंदर कार्ड, पत्र और तोहफ़ों के लिए बहुत-बहुत शुक्रिया। क्या तुम वहाँ अकेले ठीक हो?”"},{"en":"“No problems,” said Ben through a mouthful of chocolate cake.","hi":"“कोई दिक़्क़त नहीं,” बेन ने चॉकलेट केक का बड़ा कौर मुँह में भरे हुए कहा।"}]],"vocab":[["itchy","adj","खुजली वाला","prickly, irritated","—","having a feeling that makes you want to scratch"],["poke","verb","घुसाना, झाँकना","stick, push","withdraw","to push something forward or into a space"],["infectious","adj","संक्रामक, छूत से फैलने वाला","contagious, catching","non-contagious","able to spread to other people"],["chum","noun","दोस्त, यार","friend, pal","enemy","(informal) a close friend"],["peer","verb","ग़ौर से देखना","look closely, squint","ignore","to look carefully at something"],["cheerily","adv","ख़ुशमिज़ाजी से","happily, brightly","gloomily","in a bright and happy way"],["slam","verb","धड़ाम से बंद करना","bang, shut hard","ease","to shut with great force and noise"],["crash","noun","धमाका, टूटने की आवाज़","bang, smash","—","a sudden loud noise of something breaking or falling"],["mutter","verb","बुदबुदाना","murmur, mumble","shout","to speak in a low voice, often when annoyed"],["scrabble","verb","खुरचना, घिसटना","scratch, scrape","—","to make a scratching noise by moving fingers or feet quickly"],["shaven","adj","मुँड़ा हुआ","shorn, bald","hairy","having had the hair cut off with a razor"],["sack","noun","बोरा","bag, pouch","—","a large strong bag"],["snarl","verb","गुर्राना","growl, grumble","purr","to growl angrily, showing teeth"],["tremble","verb","काँपना","shake, shiver","steady","to shake slightly because of fear or weakness"],["palm","noun","हथेली","hand surface","—","the inner surface of the hand"],["burglar","noun","चोर, सेंधमार","thief, robber","—","a person who breaks into a house to steal"],["sneeze","noun","छींक","—","—","air suddenly forced out through the nose"],["germ","noun","कीटाणु","microbe, bacterium","—","a tiny living thing that can cause disease"],["crunch","verb","चरमराना, कुरकुराना","crush, grind","—","to make a noise by walking on hard things"],["dustpan","noun","कूड़ा उठाने वाला पैन","—","—","a flat pan into which dust is swept"]],"rc":[],"pj":[],"es":[],"qz":[],"idioms":[["have a word","बात करना","Can I have a word with you after class?","to speak to someone briefly"],["give someone one's love","प्यार/नमस्ते पहुँचाना","Give my love to your parents.","to send affectionate greetings through another person"],["back away","धीरे-धीरे पीछे हटना","The dog growled and the boy backed away.","to move away slowly from something or someone"]],"fq":[]},{"id":"ev-ed224","title":"Why Crows are Black","src":"Evergreen library · Topic: General Topics","c":"General Topics","todo":"","ed":[[{"en":"The Sun, while going on his daily rounds, saw a princess and fell in love with her. Whenever he could slip away from the heavens, he would take human form and go down to the princess to spend some time with her.","hi":"सूर्य अपने रोज़ के चक्कर पर निकला हुआ था कि उसने एक राजकुमारी को देखा और उससे प्रेम करने लगा। जब भी वह आकाश से निकल पाता, मानव रूप धरकर राजकुमारी के पास उतर आता और उसके साथ कुछ समय बिताता।"},{"en":"The princess too became quite fond of him and would wait for him to come. One day the Sun decided to send her a blood-red {{ruby|माणिक}} as a {{token|निशानी}} of his love for her.","hi":"राजकुमारी भी उसे काफ़ी चाहने लगी थी और उसके आने की राह देखती थी। एक दिन सूर्य ने प्रेम की निशानी के तौर पर उसे एक ख़ून-सा लाल माणिक भेजने का निश्चय किया।"},{"en":"He put the {{gem|रत्न}} in a silken bag, and calling a crow that was flying past, asked the bird to deliver the gem to his {{beloved|प्रेमिका}}. Crows had milky white feathers in those days and it was considered {{auspicious|शुभ}} if a crow came anywhere near you.","hi":"उसने रत्न को रेशमी थैली में रखा और पास से उड़ते एक कौए को बुलाकर कहा कि वह रत्न उसकी प्रेमिका तक पहुँचा दे। उन दिनों कौओं के पंख दूध जैसे सफ़ेद होते थे और अगर कौआ आपके आसपास भी आ जाए तो उसे शुभ माना जाता था।"}],[{"en":"So the Sun was pleased that he had found a crow to deliver the gem. As the crow sped through the sky with the silken bag, the {{aroma|ख़ुशबू}} of food reached its {{nostrils|नथुने}}.","hi":"सूर्य ख़ुश था कि उसे रत्न पहुँचाने के लिए कौआ मिल गया। जब कौआ रेशमी थैली लेकर आकाश में तेज़ी से उड़ रहा था, तो खाने की ख़ुशबू उसके नथुनों तक पहुँची।"},{"en":"Looking down, it saw that a wedding feast was in progress, and immediately it was {{distracted|भटक गया}} from its mission. Food was one thing it could never resist!","hi":"नीचे देखने पर उसने पाया कि शादी की दावत चल रही है और वह तुरंत अपने काम से भटक गया। खाना ही तो एक चीज़ थी जिसे वह कभी नहीं ठुकरा पाता था!"},{"en":"{{Alighting|उतरकर}} on a tree nearby, it hung the bag on a {{twig|टहनी}} and went off to find some food. While the crow was {{feasting|दावत उड़ा रहा}}, a merchant passing by saw the bag on the tree, and knocked it down with a pole.","hi":"पास के एक पेड़ पर उतरकर उसने थैली एक टहनी पर टाँग दी और खाने की तलाश में चला गया। जब कौआ दावत उड़ा रहा था, तभी वहाँ से गुज़रते एक व्यापारी ने पेड़ पर थैली देखी और डंडे से उसे नीचे गिरा लिया।"}],[{"en":"When he opened the bag and saw its contents, he almost {{swooned|बेहोश हो गया}} in joy. Quickly pocketing the ruby, he filled the bag with dry cow {{dung|गोबर}} that was lying there, and then {{deftly|चतुराई से}} returned the bag to the branch.","hi":"थैली खोलकर जब उसने भीतर का सामान देखा, तो ख़ुशी के मारे लगभग बेहोश हो गया। माणिक को झट से जेब में डालकर उसने थैली को वहीं पड़े सूखे गोबर से भर दिया और फिर चतुराई से थैली को टहनी पर वापस लटका दिया।"},{"en":"It was all done so quickly that the crow missed all the action. After having its fill, it flew up to the tree, and picking up the bag, took it to the person it was intended for.","hi":"यह सब इतनी जल्दी हुआ कि कौए को कुछ पता ही नहीं चला। भरपेट खाकर वह पेड़ पर उड़कर आया और थैली उठाकर उस व्यक्ति के पास ले गया जिसके लिए वह थी।"},{"en":"The princess was in the garden. When the crow gave her the bag, she took it {{eagerly|उत्सुकता से}}, knowing that it was from the Sun.","hi":"राजकुमारी बगीचे में थी। जब कौए ने उसे थैली दी, तो उसने उसे उत्सुकता से ले लिया, यह जानकर कि यह सूर्य की ओर से है।"}],[{"en":"But when she saw its contents, she {{reeled|लड़खड़ाकर पीछे हटी}} back in shock and anger. Believing that it was the Sun's way of telling her that he did not care for her, she {{flung|फेंक दिया}} the bag away, rushed to her palace, and never came out again.","hi":"पर जब उसने भीतर का सामान देखा, तो वह सदमे और ग़ुस्से से पीछे हट गई। यह मानकर कि यह सूर्य का तरीक़ा है यह जताने का कि उसे उसकी परवाह नहीं, उसने थैली दूर फेंक दी, अपने महल की ओर दौड़ी और फिर कभी बाहर नहीं आई।"},{"en":"When the Sun learnt of what had happened, he was furious. So great was his anger that when he turned his {{scorching|झुलसाती}} {{gaze|नज़र}} on the crow, its feathers were burned black.","hi":"जब सूर्य को पता चला कि क्या हुआ था, तो वह आग-बबूला हो गया। उसका क्रोध इतना प्रचंड था कि जब उसने अपनी झुलसाती नज़र कौए पर डाली, तो उसके पंख जलकर काले हो गए।"},{"en":"Its feathers have been black ever since. The story goes on to tell us that the ruby did not stay with the man who stole it.","hi":"तब से उसके पंख काले ही हैं। कहानी आगे बताती है कि माणिक उस आदमी के पास नहीं रहा जिसने उसे चुराया था।"}],[{"en":"It fell out of his pocket and rolled into a deep pit. Men have been trying to dig it out ever since.","hi":"वह उसकी जेब से गिरकर एक गहरे गड्ढे में लुढ़क गया। तब से लोग उसे खोदकर निकालने की कोशिश कर रहे हैं।"},{"en":"Many precious stones have been found in the process, making Burma (now Myanmar) one of the richest sources of rubies and {{sapphires|नीलम}}, but the ruby that the Sun sent to the princess has yet to be found.","hi":"इस प्रक्रिया में कई क़ीमती पत्थर मिले हैं, जिससे बर्मा (अब म्यांमार) माणिक और नीलम के सबसे समृद्ध स्रोतों में से एक बन गया है, लेकिन सूर्य ने राजकुमारी को जो माणिक भेजा था, वह अभी तक नहीं मिला है।"}]],"vocab":[["token","noun","निशानी, प्रतीक","symbol, sign","—","a thing given as a sign of feeling"],["ruby","noun","माणिक","red gem","—","a deep red precious stone"],["gem","noun","रत्न","jewel, precious stone","—","a precious stone, cut and polished"],["beloved","noun","प्रिय व्यक्ति, प्रेमिका","darling, sweetheart","enemy","a person who is greatly loved"],["auspicious","adj","शुभ","lucky, promising","ominous","showing signs
