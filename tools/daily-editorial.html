₹250 करोड़ तक का जुर्माना लग सकता है, जो छोटे और स्वतंत्र न्यूज़रूमों के अस्तित्व के लिए ख़तरा है।"}],[{"en":"The DNPA petition also challenges Section 44(3), which amended the RTI Act, 2005, removing the earlier public-interest qualification concerning disclosure of personal information. The protection of personal information must not be absolute; an {{overriding|सर्वोपरि}} public interest must remain a {{legitimate|वैध}} ground for disclosure, particularly when the information is held by public authorities.","hi":"DNPA की याचिका धारा 44(3) को भी चुनौती देती है, जिसने सूचना का अधिकार अधिनियम, 2005 में संशोधन करके निजी जानकारी के खुलासे से जुड़ी पहले की जनहित वाली शर्त हटा दी। निजी जानकारी की सुरक्षा पूर्ण नहीं होनी चाहिए; सर्वोपरि जनहित खुलासे का वैध आधार बना रहना चाहिए, ख़ासकर तब जब जानकारी सार्वजनिक प्राधिकरणों के पास हो।"},{"en":"Investigations into corruption often rely on asset disclosures and tender documents containing personal data. Restricting access to these records risks reducing journalism to merely reproducing government releases.","hi":"भ्रष्टाचार की जाँचें अक्सर संपत्ति-घोषणाओं और निविदा दस्तावेज़ों पर निर्भर करती हैं जिनमें निजी डेटा होता है। इन रिकॉर्ड तक पहुँच रोकने से पत्रकारिता सिर्फ़ सरकारी विज्ञप्तियाँ दोहराने तक सिमट जाने का जोखिम है।"}],[{"en":"The Supreme Court, while issuing notice on the petition, rightly {{emphasised|ज़ोर दिया}} the need to balance press freedom with the right to privacy. Although journalists in India enjoy no specific {{statutory|वैधानिक}} protection for their work, freedom of the press is constitutionally protected under Article 19(1)(a). The Court has also {{shielded|बचाया}} newspapers from {{arbitrary|मनमाने}} state restrictions.","hi":"सुप्रीम कोर्ट ने याचिका पर नोटिस जारी करते हुए प्रेस की आज़ादी और निजता के अधिकार में संतुलन की ज़रूरत पर सही ही ज़ोर दिया। भारत में पत्रकारों को उनके काम के लिए कोई ख़ास वैधानिक सुरक्षा नहीं है, पर प्रेस की आज़ादी को अनुच्छेद 19(1)(a) के तहत संवैधानिक सुरक्षा मिली है। कोर्ट ने अख़बारों को राज्य की मनमानी पाबंदियों से भी बचाया है।"},{"en":"However, growing {{mistrust|अविश्वास}} of {{legacy|पारंपरिक}} media and the rise of independent content creators have made it difficult to determine who receives such protection. The Centre has also flagged this concern.","hi":"लेकिन पारंपरिक मीडिया पर बढ़ता अविश्वास और स्वतंत्र कंटेंट क्रिएटरों का उभार यह तय करना कठिन बना देता है कि ऐसी सुरक्षा किसे मिले। केंद्र ने भी यह चिंता उठाई है।"},{"en":"Yet, carving out distinct categories is no easy task — a 2026 Reuters Institute report shows that the proportion of 18- to 24-year-olds identifying social media as their primary source of news rose from 21% in 2015 to 39% in 2025.","hi":"फिर भी अलग-अलग श्रेणियाँ बनाना आसान काम नहीं है: 2026 की रॉयटर्स इंस्टीट्यूट रिपोर्ट के अनुसार 18 से 24 साल के जो लोग सोशल मीडिया को ख़बरों का मुख्य स्रोत मानते हैं, उनका अनुपात 2015 के 21% से बढ़कर 2025 में 39% हो गया।"},{"en":"A purely {{legalistic|क़ानूनी बारीकियों पर टिका}} determination of these competing concerns may perhaps prove too onerous. {{Stakeholders|हितधारक}} must build {{consensus|आम सहमति}} on a mutually acceptable framework where public functionaries and those handling public funds are not {{insulated|बचाए हुए}} from {{scrutiny|कड़ी जाँच}} under the {{guise|आड़}} of privacy.","hi":"इन आपस में टकराती चिंताओं का केवल क़ानूनी बारीकियों पर टिका फ़ैसला शायद बहुत बोझिल साबित हो। हितधारकों को ऐसे आपसी रूप से स्वीकार्य ढाँचे पर आम सहमति बनानी चाहिए जिसमें सार्वजनिक पदाधिकारी और सार्वजनिक धन सँभालने वाले निजता की आड़ में जाँच से बचे न रहें।"},{"en":"Union Minister Ashwini Vaishnaw’s indication that he would meet editors is a welcome step towards consensus.","hi":"केंद्रीय मंत्री अश्विनी वैष्णव का संपादकों से मिलने का संकेत आम सहमति की ओर एक स्वागत योग्य कदम है।"}]],"vocab":[["safeguard","verb","सुरक्षित रखना","protect, defend","endanger","to protect from harm"],["chilling effect","noun","भय का असर (डर से खुलकर काम न कर पाना)","deterrence, intimidation","encouragement","discouraging people from acting freely by fear of punishment"],["exemption","noun","छूट","immunity, exclusion","liability","freedom from a rule or duty"],["fiduciary","noun/adj","न्यासी (भरोसे पर दूसरे का हित सँभालने वाला)","trustee, custodian","—","a person trusted to manage another’s interests"],["onerous","adj","बोझिल, भारी","burdensome, heavy","light, easy","heavy, burdensome and difficult"],["integral","adj","अभिन्न","essential, intrinsic","peripheral","essential as a part of a whole"],["consequential","adj","गंभीर नतीजों वाला","significant, important","trivial","having important results"],["penalties","noun","जुर्माने, दंड","fines, punishments","rewards","punishments, usually fines"],["existential","adj","अस्तित्व से जुड़ा","survival-related, fundamental","—","relating to survival or existence"],["overriding","adj","सर्वोपरि","paramount, supreme","minor","more important than anything else"],["legitimate","adj","वैध","lawful, valid","illegitimate","lawful and justified"],["emphasised","verb","ज़ोर दिया","stressed, highlighted","downplayed","gave special importance to"],["statutory","adj","वैधानिक (क़ानून द्वारा तय)","legal, prescribed","informal","required by law"],["shielded","verb","बचाया, आड़ दी","protected, guarded","exposed","protected from harm or danger"],["arbitrary","adj","मनमाना","random, capricious","reasoned","based on whim, not reason"],["mistrust","noun","अविश्वास","distrust, suspicion","trust","lack of trust or confidence"],["legacy","adj/noun","पारंपरिक; विरासत","traditional, inherited","modern","old and established, or something handed down"],["legalistic","adj","क़ानूनी बारीकियों पर टिका","technical, rigid","flexible","sticking strictly to the letter of the law"],["stakeholders","noun","हितधारक","interested parties","outsiders","people with an interest in a matter"],["consensus","noun","आम सहमति","agreement, unanimity","disagreement","general agreement among a group"],["insulated","adj/verb","बचाया हुआ, अछूता","protected, isolated","exposed","protected from outside effects"],["scrutiny","noun","कड़ी जाँच","examination, inspection","neglect","close and careful examination"],["guise","noun","आड़, बहाना","pretext, disguise","reality","a false appearance or pretence"]],"rc":[{"q":"What is the main idea of the editorial?","o":["The Supreme Court has banned the DNPA petition","The data protection law lacks a journalistic exemption, so press freedom and privacy must be balanced through consensus","Journalists should be fully exempt from every law","Social media has no role in news consumption"],"a":1,"e":"संपादकीय का सार है कि क़ानून में पत्रकारिता की छूट नहीं है और प्रेस की आज़ादी व निजता में आम सहमति से संतुलन बनना चाहिए।"},{"q":"According to the passage, what penalty can non-compliance attract?","o":["Up to ₹25 crore","Up to ₹2,500 crore","Up to ₹250 crore","Up to ₹100 crore"],"a":2,"e":"पहले हिस्से में लिखा है कि नियम न मानने पर ₹250 करोड़ तक का जुर्माना लग सकता है।"},{"q":"What can be inferred about the change to the RTI Act made by Section 44(3)?","o":["It may limit access to records that corruption probes depend on","It increased the powers of journalists","It made all records public","It was approved by the Supreme Court"],"a":0,"e":"जनहित वाली शर्त हटने से भ्रष्टाचार की जाँच में काम आने वाले रिकॉर्ड तक पहुँच सीमित हो सकती है।"},{"q":"The tone of the author is best described as:","o":["Hostile and sarcastic","Concerned yet constructive","Indifferent","Humorous"],"a":1,"e":"लेखक चिंता जताता है और साथ में आम सहमति का रास्ता भी सुझाता है।"},{"q":"The word ‘mistrust’ in the passage is closest in meaning to:","o":["Confidence","Faith","Respect","Distrust"],"a":3,"e":"Mistrust = Distrust, यानी अविश्वास।"}],"pj":[{"q":["P. The DNPA petition also challenges Section 44(3), which amended the RTI Act, 2005.","Q. The protection of personal information must not be absolute.","R. Investigations into corruption often rely on asset disclosures and tender documents containing personal data.","S. Restricting access to these records risks reducing journalism to merely reproducing government releases."],"o":["PQRS","QPRS","PRQS","SRQP"],"a":0,"e":"पहले याचिका (P), फिर उसका तर्क (Q), फिर उदाहरण (R), और ‘these records’ वाली S अंत में।"},{"q":["P. The Court has also shielded newspapers from arbitrary state restrictions.","Q. Although journalists in India enjoy no specific statutory protection, freedom of the press is constitutionally protected.","R. The Supreme Court rightly emphasised the need to balance press freedom with the right to privacy.","S. However, growing mistrust of legacy media has made it difficult to determine who receives such protection."],"o":["PQRS","QPRS","RQPS","SPQR"],"a":2,"e":"पहले मुख्य बात (R), फिर संवैधानिक सुरक्षा (Q), फिर कोर्ट की भूमिका (P), अंत में ‘However’ वाली दिक़्क़त (S)।"},{"q":["P. The Act already provides exemptions for certain forms of data processing, including for research and statistical purposes.","Q. Non-compliance can attract penalties of up to ₹250 crore.","R. The absence of a specific exemption for journalistic activity could subject reporters to the obligations of a ‘data fiduciary’.","S. The omission is particularly consequential because the drafts in 2018, 2019 and 2021 carried a journalistic exemption."],"o":["PQRS","RSPQ","SRPQ","QPSR"],"a":1,"e":"पहले कमी (R), फिर उसका महत्व (S), फिर दूसरी छूटें (P), अंत में जुर्माने का ख़तरा (Q)।"},{"q":["P. Yet, carving out distinct categories is no easy task.","Q. Stakeholders must build consensus on a mutually acceptable framework.","R. A purely legalistic determination of these competing concerns may perhaps prove too onerous.","S. Union Minister Ashwini Vaishnaw’s indication that he would meet editors is a welcome step towards consensus."],"o":["QPRS","RPQS","PQRS","PRQS"],"a":3,"e":"कठिनाई (P), क़ानूनी हल की सीमा (R), आम सहमति की माँग (Q), और अंत में मंत्री का क़दम (S)।"}],"es":[{"q":"The petition have raised (A) / concerns about (B) / press freedom. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Subject–verb agreement। Petition एकवचन है: ‘has raised’।"},{"q":"The Act has a exemption (A) / for (B) / research. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Articles। ‘exemption’ स्वर से शुरू होता है: ‘an exemption’।"},{"q":"Journalists are (A) / protected by article (B) 19(1)(a). (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Prepositions। ‘protected by Article 19(1)(a)’ सही प्रयोग है। वाक्य शुद्ध है।"},{"q":"The Act has been (A) / in force (B) since two years. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Since / for। अवधि के लिए ‘for two years’।"},{"q":"Neither the Centre nor (A) / the petitioners (B) was ready. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Neither … nor। पास वाला subject ‘petitioners’ बहुवचन है, इसलिए ‘were ready’।"},{"q":"The penalty is (A) / more heavier (B) than before. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Comparative। ‘heavier’ ख़ुद comparative है।"},{"q":"The Act requires (A) / consent from (B) every user. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Uncountable nouns। ‘consent’ अगणनीय है और ‘every user’ एकवचन है। वाक्य शुद्ध है।"},{"q":"If a newsroom (A) / will violate (B) the law, it may be fined. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Conditional। If-clause में present: ‘violates’।"},{"q":"The court is (A) / considering to (B) hear the plea. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund। Consider के बाद gerund: ‘hearing’।"},{"q":"The law protects (A) / privacy, (B) but limiting investigation. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Parallel structure। समान रूप: ‘but limits investigation’।"}],"qz":[{"q":"Synonym of ONEROUS:","o":["Burdensome","Light","Easy","Cheap"],"a":0,"e":"Onerous = Burdensome, यानी बोझिल।"},{"q":"Synonym of SHIELDED:","o":["Exposed","Harmed","Ignored","Protected"],"a":3,"e":"Shielded = Protected, यानी बचाया।"},{"q":"Antonym of ARBITRARY:","o":["Random","Whimsical","Reasoned","Casual"],"a":2,"e":"Arbitrary (मनमाना) का उलटा Reasoned (सोच-समझकर तय)।"},{"q":"Antonym of LEGITIMATE:","o":["Lawful","Valid","Genuine","Illegitimate"],"a":3,"e":"Legitimate (वैध) का उलटा Illegitimate।"},{"q":"Choose the correctly spelt word:","o":["Fiducciary","Fiduciery","Fiduciary","Fiduceary"],"a":2,"e":"सही spelling Fiduciary है।"},{"q":"Choose the correctly spelt word:","o":["Exemtion","Exumption","Exempsion","Exemption"],"a":3,"e":"सही spelling Exemption है।"},{"q":"One word: a person or group with an interest in a decision or project","o":["Stakeholder","Employer","Referee","Tenant"],"a":0,"e":"Stakeholder यानी हितधारक।"},{"q":"One word: required or fixed by law","o":["Informal","Arbitrary","Statutory","Casual"],"a":2,"e":"Statutory यानी क़ानून द्वारा तय (वैधानिक)।"},{"q":"Fill in the blank: The new rule may have a ___ effect on free speech.","o":["chilling","sweet","warming","tasty"],"a":0,"e":"Chilling effect = डर की वजह से खुलकर न बोल पाने का असर।"},{"q":"Fill in the blank: Public spending should face closer ___.","o":["guise","scrutiny","legacy","penalty"],"a":1,"e":"‘कड़ी जाँच’ के लिए scrutiny सही है।"},{"q":"Idiom: ‘under the guise of’ means:","o":["Under a false appearance","Openly","With permission","In anger"],"a":0,"e":"Under the guise of = किसी बहाने या झूठे रूप की आड़ में।"},{"q":"Idiom: ‘strike a balance’ means:","o":["To hit something hard","To lose weight","To give fair weight to two competing things","To close an account"],"a":2,"e":"Strike a balance = दो चीज़ों में उचित संतुलन बनाना।"},{"q":"Phrasal verb: ‘rely on’ means:","o":["Ignore","Depend on","Argue with","Run from"],"a":1,"e":"Rely on = पर निर्भर करना।"},{"q":"Synonym of MISTRUST:","o":["Faith","Hope","Respect","Suspicion"],"a":3,"e":"Mistrust = Suspicion, यानी अविश्वास।"},{"q":"According to the passage, what share of 18- to 24-year-olds named social media as their primary news source in 2025?","o":["21%","39%","18%","24%"],"a":1,"e":"पैराग्राफ़ के अनुसार 2025 में यह अनुपात 39% था (2015 में 21%)।"}],"idioms":[["under the guise of","की आड़ में; झूठे रूप या बहाने के नीचे","Some rules are justified under the guise of safety.","pretending to be something else"],["strike a balance","दो चीज़ों में संतुलन बनाना","The Court must strike a balance between privacy and press freedom.","to give fair weight to two competing things"],["rely on (phrasal verb)","पर निर्भर करना","Corruption probes rely on asset disclosures.","to depend on someone or something"]],"fq":[]},{"id":"stroke","title":"How brain imaging offers a crucial window to identify, assess and treat wake-up strokes","src":"The Hindu, Delhi edition, 30 Oct 2026, p. II (Health) · Serena Josephine M. · Topic: Health / Medicine","todo":"","ed":[[{"en":"Time is brain, when it comes to the treatment of strokes. But a stroke occurring during sleep may go {{unnoticed|अनदेखा}} until a person wakes up with symptoms, leaving doctors without a clear timeline of its {{onset|शुरुआत}}.","hi":"स्ट्रोक के इलाज में ‘समय ही दिमाग़ है’। लेकिन नींद के दौरान आया स्ट्रोक तब तक अनदेखा रह सकता है जब तक व्यक्ति लक्षणों के साथ जाग न जाए, जिससे डॉक्टरों के पास उसकी शुरुआत का साफ़ समय नहीं होता।"},{"en":"This is where brain imaging helps doctors identify patients with wake-up strokes and assess the extent of injury to pave the way for {{prompt|तुरंत}} treatment. Neurologists {{underscore|रेखांकित करना}} the need to seek medical care immediately to ensure timely treatment.","hi":"यहीं ब्रेन इमेजिंग काम आती है: वह डॉक्टरों को जागने के बाद पता चलने वाले स्ट्रोक के मरीज़ पहचानने और चोट का दायरा आँकने में मदद करती है, ताकि तुरंत इलाज का रास्ता बने। न्यूरोलॉजिस्ट ज़ोर देते हैं कि समय पर इलाज के लिए तुरंत चिकित्सा सहायता लेनी चाहिए।"}],[{"en":"M. Radha, head of department and professor of neurology, Government Kilpauk Medical College (KMC) Hospital, Chennai, said that the {{prevalence|व्यापकता}} of wake-up strokes is 20% — one in five {{ischaemic|रक्त-प्रवाह रुकने से होने वाला}} strokes is a wake-up stroke.","hi":"चेन्नई के सरकारी किल्पॉक मेडिकल कॉलेज (KMC) अस्पताल में न्यूरोलॉजी विभाग की प्रमुख व प्रोफ़ेसर एम. राधा ने कहा कि जागने पर पता चलने वाले स्ट्रोक की व्यापकता 20% है, यानी हर पाँच इस्केमिक स्ट्रोक में से एक ऐसा स्ट्रोक होता है।"},{"en":"“This means a person wakes up from his/her sleep with symptoms of stroke. The symptoms include facial {{drooping|लटकना}}, difficulty speaking, sudden vision problems and weakness on one side of the body,” she said.","hi":"उन्होंने कहा, “इसका मतलब है कि व्यक्ति नींद से स्ट्रोक के लक्षणों के साथ जागता है। लक्षणों में चेहरे का लटकना, बोलने में कठिनाई, अचानक नज़र की दिक़्क़त और शरीर के एक तरफ़ कमज़ोरी शामिल हैं।”"}],[{"en":"If a patient arrives at a hospital within 4.5 hours of stroke symptoms, then {{thrombolysis|थक्का घोलने का इलाज}} can be done, she said, adding: “However, in wake-up stroke, we cannot calculate the time of the onset of symptoms.","hi":"उन्होंने कहा कि अगर मरीज़ स्ट्रोक के लक्षणों के 4.5 घंटे के भीतर अस्पताल पहुँचे तो थ्रोम्बोलिसिस (थक्का घोलने का इलाज) किया जा सकता है, और जोड़ा: “लेकिन जागने पर पता चलने वाले स्ट्रोक में हम लक्षणों की शुरुआत का समय नहीं निकाल सकते।"},{"en":"We do not know the window. So, acting fast is important. In case of any symptoms, patients should reach the hospital on time.”","hi":"हमें समय-सीमा पता नहीं होती। इसलिए तेज़ी से क़दम उठाना ज़रूरी है। कोई भी लक्षण होने पर मरीज़ों को समय पर अस्पताल पहुँचना चाहिए।”"}],[{"en":"Role of imaging","hi":"इमेजिंग की भूमिका"}],[{"en":"In wake-up strokes, imaging helps give a clear picture for the doctors. “An MRI brain scan should be taken immediately. If it is not available, a CT angiogram should be taken.","hi":"जागने पर पता चलने वाले स्ट्रोक में इमेजिंग डॉक्टरों को साफ़ तस्वीर देती है। “तुरंत MRI ब्रेन स्कैन कराना चाहिए। वह उपलब्ध न हो तो CT एंजियोग्राम कराना चाहिए।"},{"en":"The scans help us assess the extent of brain injury and blood flow to different parts of the brain. They can determine whether there is diffusion-perfusion {{mismatch|बेमेल}}.","hi":"स्कैन से हमें दिमाग़ की चोट का दायरा और दिमाग़ के अलग-अलग हिस्सों में रक्त-प्रवाह आँकने में मदद मिलती है। वे यह तय कर सकते हैं कि डिफ़्यूज़न-परफ़्यूज़न बेमेल है या नहीं।"},{"en":"The difference may represent brain tissue that is still {{salvageable|बचाया जा सकने वाला}} and can be potentially saved. Like in regular strokes, ‘time is brain’ in wake-up strokes too, making prompt diagnosis and treatment {{crucial|निर्णायक रूप से ज़रूरी}},” she explained.","hi":"यह अंतर दिमाग़ के ऐसे ऊतक को दिखा सकता है जिसे अब भी बचाया जा सकता है। सामान्य स्ट्रोक की तरह जागने पर पता चलने वाले स्ट्रोक में भी ‘समय ही दिमाग़ है’, इसलिए तुरंत जाँच और इलाज बेहद ज़रूरी है,” उन्होंने समझाया।"}],[{"en":"Shubha Subramanian, senior consultant - neurology, Kauvery Hospitals, Chennai, said that in ischemic strokes, thrombolysis is used to {{dissolve|घोलना}} the blood clot if a patient presents within 4.5 hours of symptom onset.","hi":"चेन्नई के कावेरी हॉस्पिटल्स में न्यूरोलॉजी की सीनियर कंसल्टेंट शुभा सुब्रमण्यन ने कहा कि इस्केमिक स्ट्रोक में अगर मरीज़ लक्षण शुरू होने के 4.5 घंटे के भीतर आए तो थक्के को घोलने के लिए थ्रोम्बोलिसिस इस्तेमाल होता है।"},{"en":"“In cases involving a large vessel {{occlusion|रुकावट}}, mechanical {{thrombectomy|थक्का निकालने की प्रक्रिया}} is performed within 24 hours of symptom onset, depending on the patient’s {{eligibility|पात्रता}}.","hi":"“बड़ी रक्तवाहिनी में रुकावट के मामलों में, मरीज़ की पात्रता के आधार पर, लक्षण शुरू होने के 24 घंटे के भीतर यांत्रिक थ्रोम्बेक्टॉमी की जाती है।"},{"en":"In wake-up strokes, we do not know when the stroke started; it could be at night or early in the morning. What we do next is crucial. This is why we rely on imaging techniques,” she added.","hi":"जागने पर पता चलने वाले स्ट्रोक में हमें नहीं पता होता कि स्ट्रोक कब शुरू हुआ; वह रात में या सुबह जल्दी हो सकता है। इसके बाद हम जो करते हैं वह निर्णायक होता है। इसीलिए हम इमेजिंग तकनीकों पर निर्भर करते हैं,” उन्होंने जोड़ा।"}],[{"en":"“MRI has a lot of sequences. If you compare the diffusion-weighted imaging and FLAIR (Fluid-Attenuated Inversion Recovery) imaging, a mismatch in that shows that the brain tissue is still salvageable.","hi":"“MRI में बहुत से सीक्वेंस होते हैं। अगर आप डिफ़्यूज़न-वेटेड इमेजिंग और FLAIR इमेजिंग की तुलना करें, तो उसमें बेमेल दिखना बताता है कि दिमाग़ का ऊतक अब भी बचाया जा सकता है।"},{"en":"So even if we do not know the time of onset of stroke, we can still go ahead and thrombolyse the patient. In the same way, MRI perfusion or CT perfusion studies will also give us a {{clue|सुराग़}} regarding salvageable brain tissue.","hi":"इसलिए स्ट्रोक की शुरुआत का समय न पता हो, तब भी हम आगे बढ़कर मरीज़ का थ्रोम्बोलिसिस कर सकते हैं। इसी तरह MRI परफ़्यूज़न या CT परफ़्यूज़न जाँचें भी बचाए जा सकने वाले ऊतक के बारे में सुराग़ देती हैं।"},{"en":"This will help us in taking crucial decisions regarding thrombolysis or mechanical thrombectomy or whether to go for {{conservative|सावधानी वाला, रूढ़िवादी}} management,” she {{elaborated|विस्तार से बताया}}.","hi":"इससे हमें थ्रोम्बोलिसिस, यांत्रिक थ्रोम्बेक्टॉमी या सावधानी वाले (रूढ़िवादी) प्रबंधन के बारे में अहम फ़ैसले लेने में मदद मिलेगी,” उन्होंने विस्तार से बताया।"}],[{"en":"Under the Tamil Nadu Accident and Emergency Care Initiative and Stroke Care and Rapid Intervention with Plasminogen activator and Thrombectomy (SCRIPT) programme implemented by the State government and with facilities available at the new JICA building at KMC, patients with with wake-up strokes are regularly treated, Dr. Radha noted.","hi":"राज्य सरकार द्वारा लागू तमिलनाडु एक्सीडेंट एंड इमरजेंसी केयर इनिशिएटिव और SCRIPT कार्यक्रम के तहत, और KMC की नई JICA इमारत में उपलब्ध सुविधाओं के साथ, जागने पर पता चलने वाले स्ट्रोक के मरीज़ों का नियमित इलाज होता है, डॉ. राधा ने बताया।"},{"en":"“There is effective {{coordination|तालमेल}} between the administration, the emergency department, radiology and neurology departments. We have a green channel in place.","hi":"“प्रशासन, इमरजेंसी विभाग, रेडियोलॉजी और न्यूरोलॉजी विभागों के बीच प्रभावी तालमेल है। हमारे यहाँ ग्रीन चैनल की व्यवस्था है।"},{"en":"As a result, once the patients with symptoms of stroke enter the Emergency Department, the neurologist is {{intimated|सूचित किया जाता है}}. Our doctor goes to the radiology department which has significantly reduced the door to needle time,” she said.","hi":"नतीजतन, स्ट्रोक के लक्षण वाले मरीज़ के इमरजेंसी विभाग में आते ही न्यूरोलॉजिस्ट को सूचित कर दिया जाता है। हमारे डॉक्टर रेडियोलॉजी विभाग जाते हैं, जिससे ‘डोर टू नीडल’ समय काफ़ी घट गया है,” उन्होंने कहा।"}],[{"en":"BE FAST is the {{acronym|संक्षिप्त नाम}} to spot the warning signs of stroke, {{denoting|दर्शाना}} Balance, Eyes, Face, Arm, Speech and Time.","hi":"BE FAST स्ट्रोक के चेतावनी-संकेत पहचानने का संक्षिप्त नाम है, जो संतुलन (Balance), आँखें (Eyes), चेहरा (Face), बाँह (Arm), बोली (Speech) और समय (Time) को दर्शाता है।"},{"en":"“We do see that the awareness of stroke symptoms is increasing and the referral system has also improved,” Dr. Radha said.","hi":"“हम देखते हैं कि स्ट्रोक के लक्षणों की जागरूकता बढ़ रही है और रेफ़रल प्रणाली भी बेहतर हुई है,” डॉ. राधा ने कहा।"}]],"vocab":[["unnoticed","adj","अनदेखा","overlooked, undetected","noticed","not seen or observed"],["onset","noun","शुरुआत (ख़ासकर रोग की)","beginning, start","end","the beginning of something, often unpleasant"],["prompt","adj","तुरंत, फ़ौरन","immediate, swift","slow, delayed","done quickly and without delay"],["underscore","verb","रेखांकित करना, ज़ोर देना","stress, emphasise","downplay","to emphasise or highlight"],["prevalence","noun","व्यापकता (कितना आम है)","commonness, frequency","rarity","how widespread something is"],["ischaemic","adj","रक्त-प्रवाह रुकने से होने वाला","—","—","caused by reduced blood supply"],["drooping","noun/adj","लटकना, झुक जाना","sagging, sinking","rising","sagging or hanging down"],["thrombolysis","noun","थक्का घोलने का इलाज","clot-dissolving therapy","—","dissolving a blood clot using medicines"],["mismatch","noun","बेमेल, असंगति","disparity, discrepancy","match","a lack of fit between two things"],["salvageable","adj","बचाया जा सकने वाला","recoverable, savable","irretrievable","able to be saved or recovered"],["crucial","adj","निर्णायक रूप से ज़रूरी","vital, critical","trivial","extremely important"],["dissolve","verb","घोलना, गलाना","melt, break down","solidify","to mix into a liquid and disappear, or break up"],["occlusion","noun","रुकावट (नली की)","blockage, obstruction","opening","a blockage of a blood vessel or passage"],["thrombectomy","noun","थक्का निकालने की प्रक्रिया","—","—","surgical removal of a blood clot"],["eligibility","noun","पात्रता","suitability, qualification","ineligibility","being qualified or allowed to do something"],["clue","noun","सुराग़, संकेत","hint, indication","—","a sign that helps solve a problem"],["conservative","adj","सावधानी वाला; रूढ़िवादी","cautious, traditional","radical","cautious; not extreme"],["elaborated","verb","विस्तार से बताया","explained, detailed","summarised","explained in more detail"],["coordination","noun","तालमेल","cooperation, harmony","discord","working together in an organised way"],["intimated","verb","सूचित किया गया","informed, notified","concealed","hinted or made known indirectly"],["acronym","noun","संक्षिप्त नाम (पहले अक्षरों से बना)","abbreviation","—","a word formed from first letters of other words"],["denoting","verb","दर्शाना, का संकेत देना","indicating, signifying","—","being a sign or name for"]],"rc":[{"q":"What is the main idea of the passage?","o":["Thrombolysis can be done at any time after a stroke","Strokes occur only during sleep","Brain imaging helps identify and treat wake-up strokes even when the onset time is unknown","BE FAST replaces the need for scans"],"a":2,"e":"लेख का सार है कि शुरुआत का समय पता न होने पर भी ब्रेन इमेजिंग वेक-अप स्ट्रोक की पहचान और इलाज में मदद करती है।"},{"q":"According to the passage, what share of ischaemic strokes are wake-up strokes?","o":["10%","4.5%","50%","20%"],"a":3,"e":"डॉ. राधा के अनुसार हर पाँच इस्केमिक स्ट्रोक में एक, यानी 20%, वेक-अप स्ट्रोक है।"},{"q":"What can be inferred about the ‘diffusion-perfusion mismatch’?","o":["It may indicate brain tissue that can still be saved","It means the scan has failed","It shows the patient has fully recovered","It shows the stroke happened a week ago"],"a":0,"e":"लेख के अनुसार यह अंतर ऐसे ऊतक को दिखा सकता है जिसे अब भी बचाया जा सकता है।"},{"q":"The tone of the passage is best described as:","o":["Hostile","Informative and cautionary","Indifferent","Humorous"],"a":1,"e":"लेख जानकारी देता है और साथ में जल्दी अस्पताल पहुँचने की सावधानी भी देता है।"},{"q":"The word ‘salvageable’ in the passage is closest in meaning to:","o":["Recoverable","Fragile","Hidden","Painful"],"a":0,"e":"Salvageable = जिसे बचाया जा सके, यानी Recoverable।"}],"pj":[{"q":["P. If a patient arrives at a hospital within 4.5 hours of stroke symptoms, then thrombolysis can be done.","Q. However, in wake-up stroke, we cannot calculate the time of the onset of symptoms.","R. We do not know the window.","S. So, acting fast is important."],"o":["QPRS","PQRS","SRQP","PRQS"],"a":1,"e":"पहले सामान्य नियम (P), फिर ‘However’ वाली दिक़्क़त (Q), उसका कारण (R) और नतीजा (S)।"},{"q":["P. An MRI brain scan should be taken immediately.","Q. If it is not available, a CT angiogram should be taken.","R. The scans help us assess the extent of brain injury and blood flow to different parts of the brain.","S. They can determine whether there is diffusion-perfusion mismatch."],"o":["PQRS","QPRS","PRQS","RSPQ"],"a":0,"e":"पहले पहली पसंद (P), फिर विकल्प (Q), फिर स्कैन का काम (R), और ‘They’ वाली S अंत में।"},{"q":["P. In wake-up strokes, we do not know when the stroke started; it could be at night or early in the morning.","Q. What we do next is crucial.","R. This is why we rely on imaging techniques.","S. In cases involving a large vessel occlusion, mechanical thrombectomy is performed within 24 hours of symptom onset."],"o":["PQRS","QRSP","SPQR","RSPQ"],"a":2,"e":"पहले थ्रोम्बेक्टॉमी का नियम (S), फिर अनिश्चित शुरुआत (P), उसके बाद क्या करें (Q) और ‘This is why’ वाली R अंत में।"},{"q":["P. We have a green channel in place.","Q. There is effective coordination between the administration, the emergency department, radiology and neurology departments.","R. As a result, once the patients with symptoms of stroke enter the Emergency Department, the neurologist is intimated.","S. Our doctor goes to the radiology department which has significantly reduced the door to needle time."],"o":["PQRS","QRPS","SPQR","QPRS"],"a":3,"e":"तालमेल (Q), ग्रीन चैनल (P), ‘As a result’ से नतीजा (R) और फिर डॉक्टर की कार्रवाई (S)।"}],"es":[{"q":"The number of (A) / stroke cases (B) are rising. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Subject–verb agreement। ‘The number of’ एकवचन: ‘is rising’।"},{"q":"Doctors performed (A) / a MRI scan (B) on the patient. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Articles (a/an)। MRI का उच्चारण स्वर (‘एम’ → ‘एम-आर-आई’, ‘em’) से शुरू होता है, इसलिए ‘an MRI scan’।"},{"q":"Patients wake up (A) / with symptoms and (B) arrive on the hospital. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Prepositions। ‘arrive at/in the hospital’ सही है।"},{"q":"Doctors have (A) / treated the patient (B) yesterday. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Present perfect / past। ‘yesterday’ के साथ simple past: ‘treated’।"},{"q":"Every patient (A) / and every nurse (B) need quick action. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Each / every। Every के साथ एकवचन क्रिया: ‘needs’।"},{"q":"Early treatment is (A) / far more effective (B) than a delayed one. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Comparative। ‘far more effective than’ सही है। वाक्य शुद्ध है।"},{"q":"The doctors gave (A) / him a good advice (B) before discharge. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Countable / uncountable। Advice अगणनीय है: ‘some good advice’।"},{"q":"If the clot (A) / dissolves, (B) the patient will recovered. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Conditional। Will के बाद V1: ‘will recover’।"},{"q":"Doctors suggest (A) / to take (B) a scan quickly. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund। Suggest के बाद gerund: ‘taking’।"},{"q":"The scan was done (A) / by the doctor and (B) I. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Pronoun case। Preposition के बाद object case: ‘me’।"}],"qz":[{"q":"Synonym of PROMPT:","o":["Delayed","Immediate","Slow","Late"],"a":1,"e":"Prompt = Immediate, यानी तुरंत।"},{"q":"Synonym of CRUCIAL:","o":["Optional","Minor","Vital","Trivial"],"a":2,"e":"Crucial = Vital, यानी बेहद ज़रूरी।"},{"q":"Antonym of UNNOTICED:","o":["Overlooked","Noticed","Hidden","Missed"],"a":1,"e":"Unnoticed (अनदेखा) का उलटा Noticed।"},{"q":"Antonym of CONSERVATIVE:","o":["Cautious","Traditional","Moderate","Radical"],"a":3,"e":"Conservative का उलटा Radical (क्रांतिकारी, बड़ा बदलाव चाहने वाला)।"},{"q":"Choose the correctly spelt word:","o":["Prevelence","Prevalence","Prevalance","Prevelance"],"a":1,"e":"सही spelling Prevalence है।"},{"q":"Choose the correctly spelt word:","o":["Eligibility","Eligibilty","Elegibility","Eligibilaty"],"a":0,"e":"सही spelling Eligibility है।"},{"q":"One word: a short name formed from the first letters of a phrase","o":["Antonym","Acronym","Synonym","Anagram"],"a":1,"e":"Acronym यानी पहले अक्षरों से बना संक्षिप्त नाम (जैसे BE FAST)।"},{"q":"One word: a doctor who specialises in the nervous system","o":["Neurologist","Dermatologist","Radiologist","Cardiologist"],"a":0,"e":"Neurologist यानी तंत्रिका-तंत्र का विशेषज्ञ।"},{"q":"Fill in the blank: The doctor ___ the importance of early treatment.","o":["drooped","dissolved","underscored","denoted"],"a":2,"e":"‘ज़ोर दिया’ के लिए underscored सही है।"},{"q":"Fill in the blank: Vaccination has reduced the ___ of the disease.","o":["clue","acronym","mismatch","prevalence"],"a":3,"e":"बीमारी की ‘व्यापकता’ के लिए prevalence।"},{"q":"Phrasal verb: ‘go ahead’ means:","o":["Stop","Retreat","Proceed","Argue"],"a":2,"e":"Go ahead = आगे बढ़ना, शुरू करना।"},{"q":"Idiom: ‘pave the way for’ means:","o":["To block","To delay","To build a road only","To make it easier for something to happen"],"a":3,"e":"Pave the way for = किसी चीज़ के लिए रास्ता तैयार करना।"},{"q":"Idiom: ‘in the nick of time’ means:","o":["Too late","Very early","Just at the last possible moment","Never"],"a":2,"e":"In the nick of time = ऐन वक़्त पर।"},{"q":"Synonym of ELABORATED:","o":["Hid","Cancelled","Shortened","Explained in detail"],"a":3,"e":"Elaborated = विस्तार से समझाया।"},{"q":"According to the passage, what does the ‘F’ in BE FAST denote?","o":["Face","Fever","Fatigue","Focus"],"a":0,"e":"पैराग्राफ़ की सूची में Balance, Eyes, Face, Arm, Speech, Time हैं, इसलिए F = Face।"}],"idioms":[["pave the way for","किसी चीज़ के लिए रास्ता तैयार करना","Brain imaging paves the way for prompt treatment.","to make something easier to happen"],["in the nick of time","ऐन वक़्त पर","The patient reached the hospital in the nick of time.","just before it is too late"],["go ahead (phrasal verb)","आगे बढ़ना, काम शुरू करना","Doctors can go ahead and thrombolyse the patient.","to proceed; to move forward"]],"fq":[]},{"id":"kufri","title":"Can new fortified potato variety help with India’s hidden hunger problem?","src":"The Hindu, Delhi edition, 30 Oct 2026, p. II (Health) · Vasudevan Mukunth · Topic: Health / Nutrition","todo":"","ed":[[{"en":"Scientists at the ICAR-Central Potato Research Institute (CPRI) have developed a new potato variety called ‘kufri jamunia’ that has higher levels of anthocyanins, vitamin C, and certain micronutrients than regular potatoes. The Central government has been promoting it of late as a means to address hidden hunger, i.e. when people consume enough calories but still do not receive the necessary nutrients.","hi":"ICAR-केंद्रीय आलू अनुसंधान संस्थान (CPRI) के वैज्ञानिकों ने ‘कुफ़री जामुनिया’ नाम की आलू की नई किस्म बनाई है, जिसमें सामान्य आलू से ज़्यादा एंथोसायनिन, विटामिन C और कुछ सूक्ष्म पोषक तत्व हैं। केंद्र सरकार हाल में इसे ‘छिपी भूख’ दूर करने के साधन के रूप में बढ़ावा दे रही है, यानी जब लोग पर्याप्त कैलोरी खाते हैं पर ज़रूरी पोषक तत्व नहीं मिलते।"}],[{"en":"Usually, experts who {{fortify|पोषक तत्व मिलाकर मज़बूत बनाना}} foods, focus on items like rice and iodised salt, which a large number of people in India consume, often throughout the year, thus ensuring the added nutrients are delivered to a significant chunk of the population.","hi":"आम तौर पर खाद्य पदार्थों में पोषक तत्व मिलाने वाले विशेषज्ञ चावल और आयोडीन-युक्त नमक जैसी चीज़ों पर ध्यान देते हैं, जिन्हें भारत में बहुत लोग अक्सर साल भर खाते हैं, ताकि जोड़े गए पोषक तत्व आबादी के बड़े हिस्से तक पहुँचें।"},{"en":"Kufri jamunia is however a potato, which people in India generally consume much less consistently than rice or salt, and the micronutrient intake depends on preparation methods and how the body absorbs them.","hi":"पर कुफ़री जामुनिया एक आलू है, जिसे भारत में लोग आम तौर पर चावल या नमक जितनी नियमितता से नहीं खाते, और सूक्ष्म पोषक तत्वों का सेवन बनाने के तरीक़ों और शरीर के उन्हें सोखने पर निर्भर करता है।"}],[{"en":"Kufri jamunia offers nutritional advantages, but they are {{substantial|काफ़ी बड़े}} in some aspects more than others. Questions also {{linger|बने रहना}} about its ability to resist disease and {{retain|बनाए रखना}} nutrients through different Indian cooking methods.","hi":"कुफ़री जामुनिया पोषण के फ़ायदे देता है, पर वे कुछ पहलुओं में दूसरों से ज़्यादा काफ़ी बड़े हैं। इसकी रोग-प्रतिरोधक क्षमता और अलग-अलग भारतीय पकाने के तरीक़ों में पोषक तत्व बनाए रखने की क्षमता पर भी सवाल बने हुए हैं।"}],[{"en":"The variety reportedly has a mealy texture. In one CPRI assessment involving 64 people, 95% rated its overall acceptability ‘good to excellent’ and 56% said its taste was very good.","hi":"बताया गया है कि इस किस्म की बनावट भुरभुरी है। CPRI के एक आकलन में 64 लोगों में से 95% ने इसकी कुल स्वीकार्यता को ‘अच्छी से उत्कृष्ट’ बताया और 56% ने कहा कि इसका स्वाद बहुत अच्छा है।"},{"en":"This study {{cohort|अध्ययन-समूह}}, though, is too small to {{generalise|सब पर लागू करना}} the results. CPRI researchers themselves have proposed that kufri jamunia can be used in curries, parathas, soups, baked goods, and dehydrated flours.","hi":"हालाँकि यह अध्ययन-समूह नतीजों को सब पर लागू करने के लिए बहुत छोटा है। CPRI के शोधकर्ताओं ने ख़ुद सुझाया है कि कुफ़री जामुनिया का इस्तेमाल करी, पराठे, सूप, बेक्ड चीज़ों और सुखाए गए आटे में हो सकता है।"}],[{"en":"Importantly, kufri jamunia potatoes also have purple skin and flesh, which could affect consumer interest. Research on other {{biofortified|जैविक रूप से पोषण-समृद्ध}} foods has already shown that while people are generally willing to pay modest {{premiums|अतिरिक्त क़ीमत}} — the national average cost of ordinary potatoes purchased {{wholesale|थोक में}} is around ₹17/kg — whether they accept a new variety depends on its appearance, their awareness, taste, and of course local preferences.","hi":"अहम बात यह है कि कुफ़री जामुनिया आलू की छिलका और गूदा भी बैंगनी है, जो उपभोक्ताओं की रुचि पर असर डाल सकता है। दूसरे पोषण-समृद्ध खाद्य पदार्थों पर शोध पहले ही दिखा चुका है कि लोग थोड़ी अतिरिक्त क़ीमत देने को आम तौर पर तैयार रहते हैं (थोक में ख़रीदे सामान्य आलू की राष्ट्रीय औसत क़ीमत लगभग ₹17/किग्रा है), पर नई किस्म अपनाना उसके रूप-रंग, जागरूकता, स्वाद और स्थानीय पसंद पर निर्भर करता है।"}],[{"en":"How was it developed","hi":"इसे कैसे विकसित किया गया"}],[{"en":"The CPRI team developed the kufri jamunia variety by crossing two potato lines, MS/8-1148 and CP4242, in 2015. MS/8-1148 is high in vitamin C whereas CP4242 had purple skin and flesh.","hi":"CPRI की टीम ने 2015 में आलू की दो लाइनों, MS/8-1148 और CP4242, का संकरण करके कुफ़री जामुनिया किस्म बनाई। MS/8-1148 में विटामिन C ज़्यादा है, जबकि CP4242 का छिलका और गूदा बैंगनी था।"},{"en":"The result, formally called MSP/16-307, could naturally {{accumulate|जमा करना}} higher concentrations of specific nutrients as it grew. The team then conducted trials, including multi-location testing, in 2021-2023.","hi":"नतीजे में बनी किस्म, जिसे औपचारिक रूप से MSP/16-307 कहा गया, बढ़ते समय कुछ ख़ास पोषक तत्वों की ज़्यादा मात्रा स्वाभाविक रूप से जमा कर सकती थी। फिर टीम ने 2021-2023 में कई जगहों पर परीक्षण समेत ट्रायल किए।"}],[{"en":"Based on the trial data, the Central Sub-Committee on Crop Standards, Notification and Release of Varieties for Horticultural Crops approved the variety in mid-2024 and the government {{notified|अधिसूचित किया}} it in November that year.","hi":"ट्रायल के आँकड़ों के आधार पर बाग़वानी फ़सलों की किस्मों के मानक, अधिसूचना और जारी करने की केंद्रीय उप-समिति ने 2024 के मध्य में इस किस्म को मंज़ूरी दी और सरकार ने उसी साल नवंबर में इसे अधिसूचित किया।"},{"en":"The variety’s plants produce 10-12 medium to large {{tubers|कंद}} each and mature in around 90 days. The purple colour comes from anthocyanins — organic compounds also found in jamun and blueberries.","hi":"इस किस्म का हर पौधा 10-12 मध्यम से बड़े कंद देता है और लगभग 90 दिनों में पक जाता है। बैंगनी रंग एंथोसायनिन से आता है, जो जामुन और ब्लूबेरी में भी पाए जाने वाले कार्बनिक यौगिक हैं।"}],[{"en":"According to the Press Information Bureau, 100 g of kufri jamunia flesh contains around 42.75 mg of vitamin C (versus 23.15 mg in regular potatoes), 42.05 mg of anthocyanins, 2.28 mg of zinc (versus 0.28 mg), 3.22 mg of iron (versus 0.57 mg), and 161 micrograms of carotenoids.","hi":"प्रेस सूचना ब्यूरो के अनुसार 100 ग्राम कुफ़री जामुनिया के गूदे में लगभग 42.75 मिग्रा विटामिन C (सामान्य आलू में 23.15 मिग्रा), 42.05 मिग्रा एंथोसायनिन, 2.28 मिग्रा ज़िंक (सामान्य में 0.28), 3.22 मिग्रा आयरन (सामान्य में 0.57) और 161 माइक्रोग्राम कैरोटीनॉइड होते हैं।"},{"en":"And per the CPRI team’s findings themselves, published in Potato Journal in 2025, 100 g of kufri jamunia was found to have a range of carotenoid levels, from 15.6 micrograms in Kanpur to 298.4 micrograms in Raipur, during the multi-location trials.","hi":"और CPRI टीम के अपने निष्कर्षों के अनुसार, जो 2025 में पोटैटो जर्नल में छपे, कई जगहों के ट्रायल में 100 ग्राम कुफ़री जामुनिया में कैरोटीनॉइड का स्तर कानपुर में 15.6 माइक्रोग्राम से रायपुर में 298.4 माइक्रोग्राम तक मिला।"},{"en":"Kufri jamunia also contains slightly less zinc than kufri neelkanth and slightly less iron than kufri manik; the latter are other coloured potato varieties developed at the Institute.","hi":"कुफ़री जामुनिया में कुफ़री नीलकंठ से थोड़ा कम ज़िंक और कुफ़री मणिक से थोड़ा कम आयरन भी है; ये दोनों संस्थान में विकसित रंगीन आलू की अन्य किस्में हैं।"}],[{"en":"Anthocyanins are known to have {{antioxidant|कोशिका-क्षति रोकने वाला}} properties, although whether the same benefits will {{accrue|मिलना, जुड़ना}} when delivered by kufri jamunia potatoes is not known. And in the absence of similar studies, the same {{caveat|चेतावनी, शर्त}} goes for iron and zinc.","hi":"एंथोसायनिन में एंटीऑक्सीडेंट गुण माने जाते हैं, पर कुफ़री जामुनिया आलू के ज़रिए मिलने पर वही फ़ायदे मिलेंगे या नहीं, यह ज्ञात नहीं है। और ऐसे अध्ययनों के अभाव में यही चेतावनी आयरन और ज़िंक पर भी लागू होती है।"},{"en":"A 2016 study in Food Chemistry examined purple-fleshed potatoes and reported that steaming and microwaving generally preserved more of the nutritional substances than stir-frying did. However, again, research specific to kufri jamunia is not available.","hi":"फ़ूड केमिस्ट्री में 2016 के एक अध्ययन ने बैंगनी गूदे वाले आलुओं की जाँच की और बताया कि भाप में पकाने और माइक्रोवेव करने से आम तौर पर भूनने की तुलना में ज़्यादा पोषक तत्व बचे रहे। लेकिन फिर भी कुफ़री जामुनिया पर विशेष शोध उपलब्ध नहीं है।"}],[{"en":"Cultivation factors","hi":"खेती से जुड़े कारक"}],[{"en":"Nutrient availability and delivery constitutes one half of a biofortification programme; the other half is determined by cultivation.","hi":"पोषक तत्वों की उपलब्धता और उनका पहुँचना जैव-पोषण-वृद्धि कार्यक्रम का आधा हिस्सा है; दूसरा आधा खेती से तय होता है।"},{"en":"At the Modipuram research station, according to the Potato Journal paper, the team recorded an average yield of 49.01 tonnes per hectare after three months, across three seasons, whereas subsequent multi-location trials, including at Modipuram, recorded an overall mean of 31.96 tonnes per hectare across north (36.77 tonnes), central (33.79 tonnes), and eastern (25.91 tonnes) India.","hi":"पोटैटो जर्नल के शोधपत्र के अनुसार मोदीपुरम अनुसंधान केंद्र पर टीम ने तीन मौसमों में तीन महीने बाद औसतन 49.01 टन प्रति हेक्टेयर उपज दर्ज की, जबकि मोदीपुरम समेत बाद के कई जगहों के ट्रायल में उत्तर (36.77 टन), मध्य (33.79 टन) और पूर्वी (25.91 टन) भारत में कुल औसत 31.96 टन प्रति हेक्टेयर रहा।"}],[{"en":"On the other hand, at these locations, kufri manik yielded 31.52 tonnes per hectare and kufri neelkanth 36.61 tonnes per hectare. Further, kufri jamunia could moderately resist late blight, a disease caused by the water mould Phytophthera infestans, in laboratory conditions but has been reported as ‘{{susceptible|आसानी से प्रभावित होने वाला}}’ in the field.","hi":"दूसरी ओर, इन्हीं जगहों पर कुफ़री मणिक की उपज 31.52 टन और कुफ़री नीलकंठ की 36.61 टन प्रति हेक्टेयर रही। इसके अलावा, कुफ़री जामुनिया प्रयोगशाला में पिछेती अंगमारी (लेट ब्लाइट), जो जल-फफूँद फ़ाइटोफ्थोरा इन्फ़ेस्टैन्स से होने वाली बीमारी है, का कुछ हद तक सामना कर सका, पर खेत में उसे ‘आसानी से प्रभावित होने वाला’ बताया गया है।"},{"en":"Late blight is a {{devastator|तबाह करने वाला}} of potato crops and the CPRI team has already recommended that farmers apply fungicide.","hi":"लेट ब्लाइट आलू की फ़सलों को तबाह करने वाली बीमारी है और CPRI टीम पहले ही किसानों को फफूँदनाशक लगाने की सलाह दे चुकी है।"}],[{"en":"Next, the multi-location trials also produced 29.19 tonnes of {{marketable|बाज़ार में बिकने योग्य}} potatoes per hectare, versus 33.48 tonnes for kufri neelkanth. So if the costs of cultivation were equal, kufri jamunia farmers could need a 15% premium on the selling price to attain the same {{gross|कुल}} revenue.","hi":"आगे, कई जगहों के ट्रायल में प्रति हेक्टेयर 29.19 टन बिकने योग्य आलू मिले, जबकि कुफ़री नीलकंठ के 33.48 टन थे। इसलिए अगर खेती की लागत बराबर हो तो कुफ़री जामुनिया के किसानों को उतनी ही कुल आमदनी पाने के लिए बिक्री-क़ीमत पर 15% अतिरिक्त चाहिए हो सकता है।"},{"en":"(A study published by a CPRI in Indian Horticulture in 2020 estimated that, for regular potatoes, the seed material accounted for 40-50% of the production costs vis-a-vis regular potatoes, with a per-hectare seed cost of around ₹60,000-75,000 per hectare.)","hi":"(2020 में इंडियन हॉर्टिकल्चर में छपे एक अध्ययन का अनुमान था कि सामान्य आलू के लिए बीज-सामग्री उत्पादन-लागत का 40-50% होती है, जिसमें प्रति हेक्टेयर बीज की लागत लगभग ₹60,000-75,000 है।)"}],[{"en":"Taken together, there are many unknowns about kufri jamunia at this point to assess its overall cost-benefit ratio, including the cost of seeds and disease management, pricing, its {{uptake|बाज़ार में स्वीकार्यता}} in the market, and how {{efficaciously|कारगर ढंग से}} it will deliver iron and zinc to the population.","hi":"सब मिलाकर, कुफ़री जामुनिया की कुल लागत-लाभ अनुपात आँकने के लिए अभी कई बातें अज्ञात हैं, जिनमें बीज और रोग-प्रबंधन की लागत, क़ीमत, बाज़ार में उसकी स्वीकार्यता, और आबादी तक आयरन व ज़िंक कितने कारगर ढंग से पहुँचाएगा, यह शामिल है।"},{"en":"It would be {{premature|समय से पहले}} as a result to {{deem|मान लेना}} kufri jamunia to be a proven solution to address India’s hidden hunger.","hi":"इसलिए कुफ़री जामुनिया को भारत की छिपी भूख दूर करने का सिद्ध समाधान मान लेना समय से पहले होगा।"}]],"vocab":[["fortify","verb","पोषक तत्व मिलाकर मज़बूत बनाना","enrich, strengthen","weaken","to strengthen, or to add nutrients to food"],["substantial","adj","काफ़ी बड़ा, ठोस","considerable, significant","tiny, slight","large in size, amount or importance"],["linger","verb","बने रहना, टिके रहना","persist, remain","vanish","to stay longer than expected"],["retain","verb","बनाए रखना","keep, preserve","lose","to keep or continue to have"],["cohort","noun","अध्ययन-समूह (एक जैसे लोगों का समूह)","group, batch","—","a group of people studied together"],["generalise","verb","सब पर लागू करना","extend, universalise","particularise","to apply a finding to a wider group"],["biofortified","adj","जैविक रूप से पोषण-समृद्ध","—","—","bred to contain higher natural nutrients"],["premiums","noun","अतिरिक्त क़ीमत","surcharge, extra payment","discount","extra payment above the usual price"],["wholesale","adj/noun","थोक (में)","bulk","retail","selling in large quantities to shops"],["accumulate","verb","जमा करना, इकट्ठा होना","gather, build up","disperse","to gather or build up gradually"],["notified","verb","अधिसूचित किया","announced, declared","concealed","officially announced"],["tubers","noun","कंद (जैसे आलू)","—","—","thick underground stems like potatoes"],["accrue","verb","मिलना, जुड़ना","accumulate, arise","diminish","to build up or be received over time"],["antioxidant","noun/adj","कोशिका-क्षति रोकने वाला पदार्थ","—","—","a substance that protects cells from damage"],["caveat","noun","चेतावनी, शर्त","warning, proviso","—","a warning or condition to remember"],["susceptible","adj","आसानी से प्रभावित होने वाला","vulnerable, prone","resistant, immune","easily affected or harmed"],["devastator","noun","तबाह करने वाला","destroyer, ruiner","protector","something that causes great destruction"],["marketable","adj","बाज़ार में बिकने योग्य","saleable, sellable","unsaleable","able to be sold easily"],["gross","adj","कुल (कटौती से पहले)","total, entire","net","total, before deductions"],["uptake","noun","स्वीकार्यता, अपनाया जाना","adoption, acceptance","rejection","the rate at which something is taken up or adopted"],["efficaciously","adv","कारगर ढंग से","effectively, productively","ineffectively","in a way that produces the desired result"],["premature","adj","समय से पहले","early, hasty","timely","happening too early"],["deem","verb","मान लेना, समझना","consider, regard","reject","to consider or judge"]],"rc":[{"q":"What is the main idea of the passage?","o":["Purple potatoes are less nutritious than regular potatoes","Kufri jamunia has completely eliminated hidden hunger","Kufri jamunia has nutritional advantages, but many unknowns make it premature to call it a proven solution to hidden hunger","Potato farming is no longer profitable in India"],"a":2,"e":"लेख पोषण के फ़ायदे बताता है पर कई अज्ञात बातों के कारण इसे सिद्ध समाधान मानना समय से पहले कहता है।"},{"q":"Which two potato lines were crossed to develop kufri jamunia?","o":["MS/8-1148 and CP4242","Kufri manik and kufri neelkanth","MSP/16-307 and CPRI","Kufri neelkanth and CP4242"],"a":0,"e":"पैराग्राफ़ के अनुसार MS/8-1148 और CP4242 का संकरण किया गया।"},{"q":"Why might kufri jamunia farmers need a 15% price premium?","o":["The seeds are free","Purple potatoes cost less to grow","Its marketable yield per hectare was lower than that of kufri neelkanth","Regular potatoes are not sold wholesale"],"a":2,"e":"बिकने योग्य उपज 29.19 टन थी जबकि कुफ़री नीलकंठ की 33.48 टन, इसलिए उतनी आमदनी के लिए अतिरिक्त क़ीमत चाहिए।"},{"q":"The tone of the author is best described as:","o":["Hostile","Celebratory","Indifferent","Cautious and analytical"],"a":3,"e":"लेखक फ़ायदे और अनिश्चितताएँ दोनों गिनाकर सावधानी से विश्लेषण करता है।"},{"q":"The word ‘premature’ in the passage is closest in meaning to:","o":["Final","Late","Hasty","Careful"],"a":2,"e":"Premature = समय से पहले, यानी Hasty।"}],"pj":[{"q":["P. The CPRI team developed the kufri jamunia variety by crossing two potato lines, MS/8-1148 and CP4242, in 2015.","Q. MS/8-1148 is high in vitamin C whereas CP4242 had purple skin and flesh.","R. The result, formally called MSP/16-307, could naturally accumulate higher concentrations of specific nutrients as it grew.","S. The team then conducted trials, including multi-location testing, in 2021-2023."],"o":["QPRS","PQRS","RSPQ","SPQR"],"a":1,"e":"संकरण (P), दोनों लाइनों की ख़ूबियाँ (Q), नतीजा (R), फिर ट्रायल (S)।"},{"q":["P. Anthocyanins are known to have antioxidant properties, although whether the same benefits will accrue is not known.","Q. And in the absence of similar studies, the same caveat goes for iron and zinc.","R. However, again, research specific to kufri jamunia is not available.","S. A 2016 study in Food Chemistry examined purple-fleshed potatoes and reported that steaming and microwaving generally preserved more nutrients."],"o":["PQSR","PQRS","SPQR","QPSR"],"a":0,"e":"पहले एंथोसायनिन की बात (P), उसी चेतावनी का विस्तार (Q), पुराना अध्ययन (S), और ‘However’ वाली R अंत में।"},{"q":["P. Next, the multi-location trials also produced 29.19 tonnes of marketable potatoes per hectare, versus 33.48 tonnes for kufri neelkanth.","Q. Late blight is a devastator of potato crops.","R. On the other hand, at these locations, kufri manik yielded 31.52 tonnes per hectare and kufri neelkanth 36.61 tonnes per hectare.","S. Further, kufri jamunia could moderately resist late blight in laboratory conditions but has been reported as ‘susceptible’ in the field."],"o":["QPRS","PQRS","SRQP","RSQP"],"a":3,"e":"उपज की तुलना (R), फिर रोग-प्रतिरोध (S), रोग का ख़तरा (Q), और ‘Next’ वाली P अंत में।"},{"q":["P. Taken together, there are many unknowns about kufri jamunia at this point to assess its overall cost-benefit ratio.","Q. It would be premature as a result to deem kufri jamunia to be a proven solution to address India’s hidden hunger.","R. Next, the multi-location trials also produced 29.19 tonnes of marketable potatoes per hectare.","S. So if the costs of cultivation were equal, kufri jamunia farmers could need a 15% premium on the selling price."],"o":["PQRS","QPRS","RSPQ","SRPQ"],"a":2,"e":"उपज का आँकड़ा (R), उसका नतीजा (S), फिर ‘Taken together’ वाली अज्ञात बातें (P), और अंत में निष्कर्ष (Q)।"}],"es":[{"q":"The variety, which (A) / contain (B) more nutrients, is popular. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Subject–verb agreement। ‘which’ का antecedent variety एकवचन है: ‘contains’।"},{"q":"Potato is (A) / a staple food (B) in a India. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Articles। देश के नाम से पहले ‘the’/कुछ नहीं: ‘in India’।"},{"q":"Researchers crossed (A) / two potato lines (B) to cope up with hunger. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Prepositions। ‘cope with’; ‘up’ अनावश्यक है।"},{"q":"The new variety needs (A) / less fertilisers (B) than others. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Fewer / less। गणनीय के लिए ‘fewer fertilisers’।"},{"q":"The variety (A) / was developed (B) by CPRI scientists last year. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Passive voice। Passive का रूप सही है। वाक्य शुद्ध है।"},{"q":"This potato is (A) / richer (B) than any potato. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Comparative। तुलना में बाक़ियों से: ‘than any other potato’।"},{"q":"The tubers contain (A) / many iron (B) and zinc. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Uncountable। Iron अगणनीय है: ‘much iron’।"},{"q":"If farmers (A) / adopt it, (B) hunger will reduced. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Conditional। ‘will be reduced’ (passive)।"},{"q":"Scientists hope (A) / developing (B) more such crops. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund / infinitive। Hope के बाद infinitive: ‘to develop’।"},{"q":"The expert said (A) / that the crop (B) is rich in iron. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Reported speech। Reporting verb past: ‘was rich’।"}],"qz":[{"q":"Synonym of LINGER:","o":["Vanish","Stay on","Hurry","Escape"],"a":1,"e":"Linger = Stay on, यानी बने रहना।"},{"q":"Synonym of SUBSTANTIAL:","o":["Considerable","Tiny","Weak","Brief"],"a":0,"e":"Substantial = Considerable, यानी काफ़ी बड़ा।"},{"q":"Antonym of PREMATURE:","o":["Early","Timely","Untimely","Sudden"],"a":1,"e":"Premature (समय से पहले) का उलटा Timely।"},{"q":"Antonym of RETAIN:","o":["Keep","Hold","Preserve","Lose"],"a":3,"e":"Retain (बनाए रखना) का उलटा Lose।"},{"q":"Choose the correctly spelt word:","o":["Caviat","Caveat","Cavaet","Kaveat"],"a":1,"e":"सही spelling Caveat है।"},{"q":"Choose the correctly spelt word:","o":["Tubers","Tubars","Tuberrs","Tubbers"],"a":0,"e":"सही spelling Tubers है।"},{"q":"One word: a group of people studied together in a research","o":["Premium","Residue","Cohort","Hue"],"a":2,"e":"Cohort यानी अध्ययन में साथ रखा गया समूह।"},{"q":"One word: sale of goods in large quantities, usually to shops","o":["Retail","Auction","Barter","Wholesale"],"a":3,"e":"Wholesale यानी थोक बिक्री।"},{"q":"Fill in the blank: Plants ___ nutrients from the soil as they grow.","o":["accumulate","linger","devastate","deem"],"a":0,"e":"‘जमा करना’ के लिए accumulate।"},{"q":"Fill in the blank: It would be ___ to call the scheme a success so early.","o":["gross","marketable","antioxidant","premature"],"a":3,"e":"‘समय से पहले’ के लिए premature।"},{"q":"Idiom: ‘on the other hand’ is used to:","o":["Show full agreement","Introduce a contrasting point","End a sentence","Count fingers"],"a":1,"e":"On the other hand = दूसरी ओर, विपरीत बात जोड़ने के लिए।"},{"q":"Idiom: ‘in the absence of’ means:","o":["With","Because of","Beyond","Without"],"a":3,"e":"In the absence of = के अभाव में, यानी Without।"},{"q":"Phrasal verb: ‘depend on’ means:","o":["Rely on","Argue with","Escape from","Look after"],"a":0,"e":"Depend on = पर निर्भर करना।"},{"q":"Synonym of DEEM:","o":["Reject","Consider","Forget","Hide"],"a":1,"e":"Deem = Consider, यानी मान लेना।"},{"q":"According to the passage, when did the government notify the variety?","o":["2015","2021","November 2024","2025"],"a":2,"e":"पैराग्राफ़ के अनुसार समिति ने 2024 के मध्य में मंज़ूरी दी और सरकार ने उसी साल नवंबर में अधिसूचित किया।"}],"idioms":[["on the other hand","दूसरी ओर; इसके उलट","On the other hand, kufri manik yielded more per hectare.","used to give a contrasting point"],["in the absence of","के अभाव में","In the absence of similar studies, the claim cannot be confirmed.","when something is missing"],["depend on (phrasal verb)","पर निर्भर करना","Acceptance depends on taste and appearance.","to rely on, or be decided by"]],"fq":[]},{"id":"exams","title":"The examination overload, its enormous cost","src":"The Hindu, Delhi edition, 30 Oct 2026, p. 8 (Editorial page article) · Furqan Qamar · India’s obsession with layers of examinations must end, and the focus must return to the forgotten value of sustained academic performance · Topic: Education","todo":"","ed":[[{"en":"Once upon a time, not very long ago, students could focus on their education, confident that their academic results would determine admission to higher education and career opportunities. Today, millions of young Indians face not one examination but a {{cascade|झड़ी, लगातार सिलसिला}} of them — a seemingly endless series of entrance examinations.","hi":"कुछ समय पहले तक विद्यार्थी अपनी पढ़ाई पर ध्यान दे सकते थे, इस भरोसे के साथ कि उनके अकादमिक नतीजे ही उच्च शिक्षा में दाख़िला और करियर के मौक़े तय करेंगे। आज लाखों युवा भारतीयों के सामने एक नहीं, परीक्षाओं की पूरी झड़ी है, यानी प्रवेश परीक्षाओं का कभी न ख़त्म होने वाला सिलसिला।"},{"en":"Besides board examinations, aspiring engineers and doctors generally face entrance tests such as the Joint Entrance Examination (JEE) and the National Eligibility-cum-Entrance Test (NEET), respectively. Architecture and law aspirants must also navigate examinations such as the National Aptitude Test in Architecture (NATA) and the Common Law Admission Test (CLAT).","hi":"बोर्ड परीक्षाओं के अलावा इंजीनियर और डॉक्टर बनने के इच्छुक विद्यार्थियों को आम तौर पर क्रमशः JEE और NEET जैसी प्रवेश परीक्षाएँ देनी पड़ती हैं। आर्किटेक्चर और क़ानून के अभ्यर्थियों को भी NATA और CLAT जैसी परीक्षाओं से गुज़रना पड़ता है।"},{"en":"Others must take the Common University Entrance Test (CUET) or institution-specific examinations. With affordable, quality higher education in short supply, many candidates make repeated attempts. Even a good bachelor’s degree does not guarantee postgraduate admission.","hi":"बाक़ी विद्यार्थियों को कॉमन यूनिवर्सिटी एंट्रेंस टेस्ट (CUET) या संस्थान-विशेष परीक्षाएँ देनी होती हैं। सस्ती और अच्छी उच्च शिक्षा की कमी के कारण कई उम्मीदवार बार-बार प्रयास करते हैं। अच्छी स्नातक डिग्री भी स्नातकोत्तर में दाख़िले की गारंटी नहीं देती।"}],[{"en":"Postgraduate aspirants face examinations such as the Graduate Aptitude Test in Engineering (GATE), Common Admission Test (CAT), Common University Entrance Test for Postgraduate Programmes (CUET-PG) and various university-level entrance tests. Research aspirants face further qualifying examinations, including the National Eligibility Test (NET).","hi":"स्नातकोत्तर के अभ्यर्थियों को GATE, CAT, CUET-PG और विश्वविद्यालय-स्तर की कई प्रवेश परीक्षाओं का सामना करना पड़ता है। शोध के इच्छुकों के सामने और योग्यता परीक्षाएँ हैं, जिनमें राष्ट्रीय पात्रता परीक्षा (NET) भी शामिल है।"},{"en":"The ordeal continues during recruitment. Academic qualifications merely establish eligibility, while employment often depends on examinations conducted by the Union Public Service Commission (UPSC), State Public Service Commissions, Staff Selection Commission (SSC) and Institute of Banking Personnel Selection (IBPS).","hi":"यह कठिन परीक्षा भर्ती के समय भी जारी रहती है। शैक्षणिक योग्यता सिर्फ़ पात्रता तय करती है, जबकि नौकरी अक्सर UPSC, राज्य लोक सेवा आयोग, SSC और IBPS की परीक्षाओं पर निर्भर करती है।"},{"en":"The {{proliferation|तेज़ फैलाव, बढ़ोतरी}} of entrance and recruitment examinations has turned education and employment into a {{relentless|लगातार, बेरहम}} cycle of competitive testing.","hi":"प्रवेश और भर्ती परीक्षाओं की इस भरमार ने शिक्षा और रोज़गार को प्रतिस्पर्धी परीक्षणों के कभी न रुकने वाले चक्र में बदल दिया है।"}],[{"en":"Each of these layers of examinations demands months of separate preparation, payment of separate coaching fees, and unexplainable suffering and distress. Somewhere in this {{labyrinthian|भूलभुलैया जैसी}} relay race, the very examinations that were supposed to certify students’ learning, abilities and achievements have been rendered irrelevant.","hi":"परीक्षाओं की हर परत के लिए महीनों की अलग तैयारी, अलग कोचिंग फ़ीस और बयान न की जा सकने वाली पीड़ा झेलनी पड़ती है। इस भूलभुलैया जैसी रिले-दौड़ में कहीं वही परीक्षाएँ बेमतलब हो गई हैं, जिन्हें विद्यार्थियों की पढ़ाई, क्षमता और उपलब्धियों का प्रमाण देना था।"},{"en":"It is time to ask a {{blunt|सीधा, दो-टूक}} question: why do we need all these additional gates when the school and university leaving examinations already exist to measure merit?","hi":"अब एक दो-टूक सवाल पूछने का समय है: जब स्कूल और विश्वविद्यालय की अंतिम परीक्षाएँ पहले से योग्यता मापने के लिए मौजूद हैं, तो हमें ये सारे अतिरिक्त दरवाज़े क्यों चाहिए?"}],[{"en":"Separate examinations for admission and jobs were declared {{inevitable|अपरिहार्य}} because school board and university examinations were argued to suffer from a lack of uniform standards and their susceptibility to manipulation and {{rampant|बेलगाम, फैला हुआ}} use of unfair means.","hi":"दाख़िले और नौकरियों के लिए अलग परीक्षाओं को अपरिहार्य बताया गया, क्योंकि तर्क दिया गया कि स्कूल बोर्ड और विश्वविद्यालय परीक्षाओं में समान मानक नहीं हैं, उनमें हेराफेरी की गुंजाइश है और नकल जैसे ग़लत तरीक़े बेलगाम हैं।"},{"en":"The argument assumes that the new layers of examinations would be free from these deficiencies. The on-the-ground experience has only proven that the designed cure is worse than the disease itself.","hi":"यह तर्क मानकर चलता है कि परीक्षाओं की नई परतें इन कमियों से मुक्त होंगी। ज़मीनी अनुभव ने बस यही साबित किया है कि जो इलाज सोचा गया, वह बीमारी से भी बदतर है।"}],[{"en":"Public examinations are {{marred|बिगड़ी हुई, दागदार}} by allegations of paper leaks and other unfair practices, such as dummy candidates, mark manipulation, and merit garbling, leading to repeated cancellations.","hi":"सार्वजनिक परीक्षाएँ पेपर लीक और डमी उम्मीदवार, अंकों में हेराफेरी और योग्यता में गड़बड़ी जैसी अन्य ग़लत प्रथाओं के आरोपों से दागदार हैं, जिनके कारण बार-बार परीक्षाएँ रद्द होती हैं।"},{"en":"Each incident wastes public money, delays admissions and recruitment, and {{erodes|धीरे-धीरे घटाना}} faith in the fairness of the system.","hi":"हर घटना जनता का पैसा बर्बाद करती है, दाख़िले और भर्ती में देरी करती है और व्यवस्था की निष्पक्षता पर भरोसा धीरे-धीरे घटाती है।"}],[{"en":"Centralised counselling for seat allotments complicates the process. They also multiply anxiety, stress and mental trauma. Layering examination upon examination rather than distributing this pressure forces students to spend their entire adolescence running an unbroken loop of a preparatory marathon.","hi":"सीटों के आवंटन के लिए केंद्रीकृत काउंसलिंग प्रक्रिया को और जटिल बना देती है। ये चिंता, तनाव और मानसिक आघात भी कई गुना बढ़ाती हैं। दबाव को बाँटने के बजाय परीक्षा पर परीक्षा लादना विद्यार्थियों को पूरी किशोरावस्था तैयारी की अटूट मैराथन में दौड़ने को मजबूर करता है।"},{"en":"Additionally, such examinations entail {{exorbitant|बेहद ज़्यादा}} costs that ultimately fall {{disproportionately|असमान रूप से}} on families who can ill afford them. Children from the economically weaker and {{marginalised|हाशिये पर धकेले गए}} sections of society struggle to manage and often cannot.","hi":"इसके अलावा ऐसी परीक्षाओं में बेहद ज़्यादा ख़र्च होता है, जिसका बोझ आख़िरकार उन परिवारों पर असमान रूप से पड़ता है जो इसे मुश्किल से उठा पाते हैं। आर्थिक रूप से कमज़ोर और हाशिये के वर्गों के बच्चे इसे सँभालने की कोशिश करते हैं और अक्सर नहीं सँभाल पाते।"},{"en":"Far from being neutral {{arbiters|निर्णायक, फ़ैसला करने वाले}} of merit, these examinations have come to reward the ability to pay for preparation rather than raw ability or {{diligence|लगन, मेहनत}} in school.","hi":"योग्यता के तटस्थ निर्णायक होने से कोसों दूर, ये परीक्षाएँ अब तैयारी के लिए पैसे चुकाने की क्षमता को पुरस्कृत करने लगी हैं, न कि स्कूल में दिखी असली क्षमता या मेहनत को।"}],[{"en":"Youth frustrations may have reached a {{tipping point|वह मोड़ जहाँ से बात बिगड़ जाए}}, compelling them to take to the streets. Several States have seen protests of varying scales.","hi":"हो सकता है युवाओं की निराशा उस मोड़ पर पहुँच गई हो जहाँ से वे सड़कों पर उतरने को मजबूर हैं। कई राज्यों में अलग-अलग पैमाने पर विरोध प्रदर्शन हुए हैं।"},{"en":"It remains to be seen whether the proposed strengthening of the law against unfair practices in public examinations and the recommendations of the high-powered committee constituted in July 2026 will address these {{systemic|व्यवस्था से जुड़ी}} deficiencies.","hi":"यह देखना बाक़ी है कि सार्वजनिक परीक्षाओं में अनुचित साधनों के ख़िलाफ़ क़ानून को मज़बूत करने का प्रस्ताव और जुलाई 2026 में गठित उच्चस्तरीय समिति की सिफ़ारिशें इन व्यवस्थागत कमियों को दूर कर पाएँगी या नहीं।"}],[{"en":"The present system of layered examinations suffers from design defects and systemic deficiencies. The National Testing Agency’s continuing difficulties, despite a comprehensive review by a committee headed by a former space scientist in 2024, have raised questions about the effectiveness of the reforms.","hi":"परतदार परीक्षाओं की मौजूदा व्यवस्था में ढाँचे की ख़ामियाँ और व्यवस्थागत कमियाँ हैं। 2024 में एक पूर्व अंतरिक्ष वैज्ञानिक की अध्यक्षता वाली समिति की व्यापक समीक्षा के बावजूद राष्ट्रीय परीक्षा एजेंसी की लगातार दिक़्क़तों ने सुधारों के असर पर सवाल खड़े किए हैं।"},{"en":"The constitution of another high-powered committee, in 2026, underscores the persistence of these concerns. We are still thinking only of reforming this broken system without stopping for a moment to ask a critical question: how can we trust centralised public examinations conducted by agencies that have repeatedly failed to fulfil their responsibilities when we cannot trust years of assessment by teachers throughout a student’s course of study?","hi":"2026 में एक और उच्चस्तरीय समिति बनना दिखाता है कि ये चिंताएँ बनी हुई हैं। हम अब भी इस टूटी व्यवस्था को सुधारने की ही सोच रहे हैं, यह एक अहम सवाल पूछे बिना कि जब हम पूरी पढ़ाई के दौरान शिक्षकों के सालों के मूल्यांकन पर भरोसा नहीं कर सकते, तो उन एजेंसियों की केंद्रीकृत परीक्षाओं पर कैसे भरोसा करें जो अपनी ज़िम्मेदारी निभाने में बार-बार नाकाम रही हैं?"}],[{"en":"Why bear such a heavy burden when, academically speaking, these layers of examinations cannot possibly substitute for the regular assessment of knowledge acquired over years of study? At most, they can evaluate candidates on a much narrower, often more coachable skill: ticking off the answer choices quickly under pressure in a specific question format, while disregarding years of demonstrated cumulative academic performance.","hi":"इतना भारी बोझ क्यों उठाएँ, जब अकादमिक नज़रिये से परीक्षाओं की ये परतें सालों की पढ़ाई से अर्जित ज्ञान के नियमित मूल्यांकन की जगह ले ही नहीं सकतीं? ज़्यादा से ज़्यादा वे उम्मीदवारों को एक कहीं संकरे, अक्सर कोचिंग से सिखाए जा सकने वाले कौशल पर परख सकती हैं: दबाव में एक ख़ास प्रश्न-प्रारूप में जल्दी से उत्तर के विकल्प टिक करना, जबकि सालों के दिखाए गए संचित अकादमिक प्रदर्शन को नज़रअंदाज़ कर दिया जाता है।"}],[{"en":"The result is a strange {{inversion|उलटफेर}}. Students no longer study to learn; they study to clear filters. Classroom teaching has been {{relegated|नीचे धकेला गया}} in favour of coaching-centre drilling.","hi":"नतीजा एक अजीब उलटफेर है। विद्यार्थी अब सीखने के लिए नहीं पढ़ते; वे छन्नियाँ पार करने के लिए पढ़ते हैं। कक्षा की पढ़ाई को कोचिंग-सेंटर की रटंत के आगे पीछे धकेल दिया गया है।"},{"en":"The board examination becomes a formality, and we have ended up with a system where the credentialing examination that ought to matter most — the one tied to actual classroom learning — now matters the least.","hi":"बोर्ड परीक्षा महज़ औपचारिकता बन जाती है, और हम ऐसी व्यवस्था में पहुँच गए हैं जहाँ जिस प्रमाणन परीक्षा को सबसे ज़्यादा मायने रखना चाहिए, जो असल कक्षा-शिक्षा से जुड़ी है, वही सबसे कम मायने रखती है।"}],[{"en":"It makes sense to fix the school and higher education system, which has long been broken and continues to be hammered, causing further damage. Now is the time to focus on restoring the credibility of school and university examinations.","hi":"स्कूल और उच्च शिक्षा व्यवस्था को ठीक करना समझदारी है, जो लंबे समय से टूटी हुई है और जिस पर चोट पड़ती जा रही है, जिससे और नुक़सान हो रहा है। अब स्कूल और विश्वविद्यालय परीक्षाओं की साख लौटाने पर ध्यान देने का समय है।"},{"en":"Whatever their imperfections, these examinations are not arbitrary, as they assess knowledge acquired over years of study, involve continuous evaluation and are moderated by boards and universities with established standards. With some investment, they can become far better and more reliable measures of merit.","hi":"इनमें चाहे जो कमियाँ हों, ये परीक्षाएँ मनमानी नहीं हैं, क्योंकि ये सालों की पढ़ाई से अर्जित ज्ञान को परखती हैं, इनमें सतत मूल्यांकन होता है और इन्हें स्थापित मानकों वाले बोर्ड और विश्वविद्यालय संतुलित करते हैं। थोड़े निवेश से ये योग्यता के कहीं बेहतर और भरोसेमंद पैमाने बन सकती हैं।"}],[{"en":"A student’s Class XII marks or university Cumulative Grade Point Average (CGPA) already reflect years of consistent performance — a far more {{holistic|समग्र, सर्वांगीण}} and harder-to-game measure of ability and diligence than a single high-stakes examination.","hi":"किसी विद्यार्थी के कक्षा 12 के अंक या विश्वविद्यालय का संचित ग्रेड पॉइंट औसत (CGPA) पहले ही सालों के लगातार प्रदर्शन को दर्शाते हैं, जो किसी एक ऊँचे दाँव वाली परीक्षा से कहीं ज़्यादा समग्र और हेराफेरी से मुश्किल से बदलने वाला क्षमता और मेहनत का पैमाना है।"},{"en":"If board and university examinations are inconsistent across States or institutions, the answer is to standardise and strengthen them through normalisation, common moderation frameworks, external audits and periodic score equating, rather than building an entirely separate examination system on top of them.","hi":"अगर बोर्ड और विश्वविद्यालय परीक्षाएँ राज्यों या संस्थानों में एक जैसी नहीं हैं, तो उनके ऊपर बिलकुल अलग परीक्षा-व्यवस्था खड़ी करने के बजाय समाधान यह है कि उन्हें नॉर्मलाइज़ेशन, साझा मॉडरेशन ढाँचे, बाहरी ऑडिट और समय-समय पर अंकों की बराबरी के ज़रिये मानकीकृत और मज़बूत किया जाए।"},{"en":"If admission committees and employers doubt the {{rigour|कठोरता, सख़्ती}} of certain boards or universities, those doubts should be addressed by reforming the assessment standards of these institutions, rather than requiring every student in the country to run a second, third or fourth race, regardless of where they studied.","hi":"अगर दाख़िला समितियाँ और नियोक्ता कुछ बोर्डों या विश्वविद्यालयों की कठोरता पर शक करते हैं, तो उन संस्थानों के मूल्यांकन-मानक सुधारकर ये शंकाएँ दूर की जानी चाहिए, न कि देश के हर विद्यार्थी से यह माँग करके कि वह कहीं भी पढ़ा हो, दूसरी, तीसरी या चौथी दौड़ दौड़े।"}],[{"en":"Admissions to higher education institutions ought to be based on standardised and moderated school-leaving examination results. Scholarships and fellowships should be awarded on the basis of academic performance and track records.","hi":"उच्च शिक्षा संस्थानों में दाख़िले मानकीकृत और संतुलित (मॉडरेटेड) स्कूल-अंतिम परीक्षा के नतीजों पर आधारित होने चाहिए। छात्रवृत्तियाँ और फ़ेलोशिप अकादमिक प्रदर्शन और पिछले रिकॉर्ड के आधार पर दी जानी चाहिए।"},{"en":"Recruitment to public services could be based on verified academic records and structured interviews. At most, a single national test at each exit level of the educational hierarchy could be conducted to assess students’ scholastic aptitude, with the scores used to moderate board or university examination results.","hi":"सार्वजनिक सेवाओं में भर्ती सत्यापित अकादमिक रिकॉर्ड और संरचित साक्षात्कारों पर आधारित हो सकती है। ज़्यादा से ज़्यादा शिक्षा-क्रम के हर निकास-स्तर पर एक राष्ट्रीय परीक्षा हो सकती है, जो विद्यार्थियों की शैक्षिक अभिरुचि परखे और जिसके अंकों से बोर्ड या विश्वविद्यालय परीक्षा के नतीजे संतुलित किए जाएँ।"}],[{"en":"This is not a radical proposal by international standards. Many countries admit students to university primarily based on their school-leaving results, supplemented by references and essays, with marginal weight assigned to scores in language and scholastic aptitude tests.","hi":"अंतरराष्ट्रीय मानकों से यह कोई क्रांतिकारी प्रस्ताव नहीं है। कई देश विश्वविद्यालय में दाख़िला मुख्यतः स्कूल-अंतिम परीक्षा के नतीजों के आधार पर देते हैं, जिसके साथ सिफ़ारिशें और निबंध होते हैं और भाषा तथा शैक्षिक अभिरुचि परीक्षाओं के अंकों को बहुत कम महत्व मिलता है।"},{"en":"It is India’s exceptional layering of tests, often to assess the same competency, tested repeatedly by different bodies, that is the {{outlier|अपवाद, अलग पड़ा हुआ}}.","hi":"भारत की परीक्षाओं की असाधारण परतें, जिनमें अक्सर एक ही योग्यता को अलग-अलग संस्थाएँ बार-बार परखती हैं, ही अपवाद हैं।"}],[{"en":"The argument for {{dismantling|ध्वस्त करना, तोड़ देना}} India’s entrance and recruitment examination pyramid is not an argument against standards. It is an argument that standards already exist, {{embedded|जड़ा हुआ, समाया हुआ}} in the school and university systems which India has spent enormous public resources building, and that repeatedly re-testing the same students for the same underlying competencies wastes money, invites corruption, and causes real harm to the wellbeing of young people.","hi":"भारत के प्रवेश और भर्ती परीक्षाओं के पिरामिड को तोड़ने का तर्क मानकों के ख़िलाफ़ तर्क नहीं है। यह इस बात का तर्क है कि मानक पहले से मौजूद हैं, उन स्कूल और विश्वविद्यालय व्यवस्थाओं में समाए हुए जिन्हें बनाने में भारत ने भारी सार्वजनिक संसाधन लगाए हैं, और यह कि उन्हीं विद्यार्थियों को उन्हीं बुनियादी योग्यताओं के लिए बार-बार परखना पैसा बर्बाद करता है, भ्रष्टाचार को न्योता देता है और युवाओं की भलाई को असली नुक़सान पहुँचाता है।"},{"en":"Reforming and trusting the examinations India already has would do more to promote genuine merit than adding yet another layer of examinations ever could.","hi":"भारत के पास जो परीक्षाएँ पहले से हैं, उन्हें सुधारना और उन पर भरोसा करना सच्ची योग्यता को बढ़ावा देने में परीक्षाओं की एक और परत जोड़ने से कहीं ज़्यादा काम करेगा।"}]],"vocab":[["cascade","noun","झड़ी, लगातार सिलसिला","series, torrent","trickle","a series of things following one after another"],["proliferation","noun","तेज़ फैलाव, बढ़ोतरी","spread, multiplication","decline","rapid increase in number"],["relentless","adj","लगातार, बेरहम","unceasing, persistent","gentle","never stopping or easing"],["labyrinthian","adj","भूलभुलैया जैसी, उलझी हुई","maze-like, complex","simple","complicated like a maze"],["blunt","adj","सीधा, दो-टूक","frank, direct","tactful","direct and plain-spoken"],["inevitable","adj","अपरिहार्य, जिसे टाला न जा सके","unavoidable, certain","avoidable","certain to happen; unavoidable"],["rampant","adj","बेलगाम, फैला हुआ","widespread, unchecked","rare","spreading wildly or without control"],["marred","verb (adj)","बिगड़ी हुई, दागदार","spoiled, damaged","improved","spoiled or damaged"],["erodes","verb","धीरे-धीरे घटाना, क्षीण करना","wears away, weakens","strengthens","gradually wears away or weakens"],["exorbitant","adj","बेहद ज़्यादा (दाम)","excessive, steep","reasonable","far too high, especially a price"],["disproportionately","adv","असमान रूप से","unequally, unevenly","equally","to an unequal or unfair degree"],["marginalised","adj","हाशिये पर धकेले गए","sidelined, excluded","included","pushed to the edge of society"],["arbiters","noun","निर्णायक, फ़ैसला करने वाले","judges, referees","participants","people who judge or settle matters"],["diligence","noun","लगन, मेहनत","hard work, effort","laziness","careful and steady effort"],["tipping point","noun","निर्णायक मोड़","critical point, threshold","—","the moment when change becomes unstoppable"],["systemic","adj","व्यवस्था से जुड़ा, पूरे तंत्र में फैला","institutional, structural","isolated","affecting the whole system"],["relegated","verb","नीचे धकेला गया","demoted, downgraded","promoted","moved down to a lower position"],["inversion","noun","उलटफेर, उलट जाना","reversal, upset","normality","a reversal of position or order"],["holistic","adj","समग्र, सर्वांगीण","comprehensive, overall","partial","looking at the whole, not only parts"],["rigour","noun","कठोरता, सख़्ती","strictness, thoroughness","laxity","strictness and thoroughness"],["outlier","noun","अपवाद, अलग पड़ा हुआ","exception, anomaly","norm","something that lies far from the usual group"],["dismantling","verb","ध्वस्त करना, तोड़ देना","demolishing, abolishing","building","taking apart or breaking down"],["embedded","adj","जड़ा हुआ, समाया हुआ","ingrained, fixed","loose","fixed firmly inside something"]],"rc":[{"q":"What is the main argument of the author?","o":["India should reduce layers of entrance and recruitment tests and rely more on strengthened school and university examinations","Coaching centres should be shut down by law","The National Testing Agency should conduct more examinations","Board examinations should be abolished"],"a":0,"e":"लेखक का मूल तर्क है कि परीक्षाओं की परतें घटाई जाएँ और मज़बूत किए गए स्कूल व विश्वविद्यालय नतीजों पर ज़्यादा भरोसा किया जाए।"},{"q":"According to the passage, on whom do the exorbitant costs of these examinations fall disproportionately?","o":["Coaching-centre owners","The Union government","Families who can ill afford them","State examination boards"],"a":2,"e":"चौथे-छठे पैराग्राफ़ के अनुसार भारी ख़र्च उन परिवारों पर ज़्यादा पड़ता है जो इसे मुश्किल से वहन कर पाते हैं।"},{"q":"What can be inferred about the author’s view of board and university examinations?","o":["They should be conducted only by one national agency","They are already perfect and need no change","They are less reliable than any entrance test","They can become reliable measures of merit with some investment and reform"],"a":3,"e":"लेखक कहता है कि थोड़े निवेश से ये परीक्षाएँ बेहतर और भरोसेमंद पैमाने बन सकती हैं।"},{"q":"The tone of the passage is best described as:","o":["Humorous and light","Critical yet constructive","Neutral and descriptive","Hopeless and angry"],"a":1,"e":"लेखक मौजूदा व्यवस्था की कड़ी आलोचना करता है, पर साथ में सुधार के ठोस सुझाव भी देता है, इसलिए tone critical yet constructive है।"},{"q":"The word ‘inversion’ in the passage (‘a strange inversion’) is closest in meaning to:","o":["Agreement","Repetition","Expansion","Reversal"],"a":3,"e":"Inversion = उलटफेर। यहाँ बोर्ड परीक्षा सबसे कम मायने रखती है जबकि उसे सबसे ज़्यादा रखना चाहिए, यानी स्थिति उलट गई है।"}],"pj":[{"q":["P. Students no longer study to learn; they study to clear filters.","Q. Classroom teaching has been relegated in favour of coaching-centre drilling.","R. The board examination becomes a formality.","S. The result is a strange inversion."],"o":["SPQR","SQPR","PQRS","RSPQ"],"a":0,"e":"पहले निष्कर्ष वाली S (‘The result is a strange inversion’), फिर उसका स्पष्टीकरण P, फिर Q और अंत में R।"},{"q":["P. Admissions to higher education institutions ought to be based on standardised and moderated school-leaving examination results.","Q. Scholarships and fellowships should be awarded on the basis of academic performance and track records.","R. Recruitment to public services could be based on verified academic records and structured interviews.","S. At most, a single national test at each exit level could be conducted to assess students’ scholastic aptitude."],"o":["QPRS","PRQS","PQRS","SPQR"],"a":2,"e":"पहले दाख़िला (P), फिर छात्रवृत्ति (Q), फिर भर्ती (R) और ‘At most’ वाला सीमित सुझाव S अंत में आता है।"},{"q":["P. The constitution of another high-powered committee, in 2026, underscores the persistence of these concerns.","Q. The present system of layered examinations suffers from design defects and systemic deficiencies.","R. We are still thinking only of reforming this broken system without asking a critical question.","S. The National Testing Agency’s continuing difficulties have raised questions about the effectiveness of the reforms."],"o":["QSPR","QPSR","SQPR","PQSR"],"a":0,"e":"पहले मुख्य दावा Q, फिर उसका उदाहरण S, फिर ‘another committee’ वाली P (पिछली समीक्षा के बाद ही ‘another’ आएगा), अंत में निष्कर्ष R।"},{"q":["P. The argument assumes that the new layers of examinations would be free from these deficiencies.","Q. Separate examinations for admission and jobs were declared inevitable because board examinations were said to lack uniform standards.","R. Public examinations are marred by allegations of paper leaks and other unfair practices.","S. The on-the-ground experience has only proven that the designed cure is worse than the disease itself."],"o":["QPRS","QPSR","PQSR","SQPR"],"a":1,"e":"पहले कारण Q, फिर उस पर टिप्पणी P, फिर अनुभव S, और ‘paper leaks’ का ठोस उदाहरण R अंत में।"}],"es":[{"q":"The number of e
