गे की कलगी जैसी दिखती है। गाढ़ा लाल रंजक फूल की घनी, उभरी हुई परतों में केंद्रित होता है, और इन पंखुड़ियों को तोड़कर सुखाया जाता है ताकि पारंपरिक कश्मीरी व्यंजनों को उनका ख़ास माणिक-जैसा लाल रंग मिले।"}],[{"en":"Cultivated in the {{fertile|उपजाऊ}} valleys of Kashmir, these blossoms are carefully handpicked at peak bloom, sun-dried to preserve their intense natural pigments, and stored for year-round culinary use. The dried flowers are locally known as mawal.","hi":"कश्मीर की उपजाऊ घाटियों में उगाए गए ये फूल पूरे खिलाव पर सावधानी से हाथ से चुने जाते हैं, उनके तीव्र प्राकृतिक रंजक बचाने के लिए धूप में सुखाए जाते हैं और साल भर रसोई में इस्तेमाल के लिए रखे जाते हैं। सूखे फूलों को स्थानीय तौर पर मावल कहते हैं।"},{"en":"Mawal holds a {{sacred|पवित्र}} status in the wazwan — the famous multi-course royal feast prepared by master chefs known as wazas. It {{imparts|प्रदान करता है}} a {{subtle|हल्का, सूक्ष्म}}, earthy undertone that {{seamlessly|बिना किसी रुकावट के}} {{complements|पूरक बनता है}} heavy spices without overpowering them.","hi":"वाज़वान में मावल का दर्जा पवित्र है, जो वाज़ा नाम के माहिर रसोइयों द्वारा तैयार किया जाने वाला मशहूर कई-व्यंजनों वाला शाही भोज है। यह हल्का, मिट्टी जैसा स्वाद देता है जो भारी मसालों को दबाए बिना उनके साथ सहजता से मेल खाता है।"}],[{"en":"Mawal is usually sold in the traditional markets of Srinagar. To release the signature crimson colour, the dried flower petals or mawal powder is {{steeped|भिगोया जाता है}} in hot water. The resulting rich, ruby extract is then {{strained|छाना जाता है}} directly into {{simmering|धीमी आँच पर पकती}} gravies.","hi":"मावल आम तौर पर श्रीनगर के पारंपरिक बाज़ारों में बिकता है। इसका ख़ास गहरा लाल रंग निकालने के लिए सूखी पंखुड़ियाँ या मावल पाउडर गर्म पानी में भिगोया जाता है। इससे बना गाढ़ा, माणिक-जैसा अर्क फिर सीधे धीमी आँच पर पकती ग्रेवी में छाना जाता है।"},{"en":"Mawal is indispensable in classics like rogan josh (meat curry), adding colour and flavour to the famed gravy alongside mild Kashmiri red chillies. It is also added to dishes like rista (spiced meatball curry), mirchi korma (chillies curry), and vegetarian specialities like dum aloo (potato curry).","hi":"रोगन जोश (मांस की करी) जैसे क्लासिक व्यंजनों में मावल अनिवार्य है, जो हल्की कश्मीरी लाल मिर्च के साथ मशहूर ग्रेवी में रंग और स्वाद जोड़ता है। इसे रिस्ता (मसालेदार कोफ़्ते की करी), मिर्च कोरमा और शाकाहारी व्यंजन दम आलू में भी डाला जाता है।"}],[{"en":"Mawal reflects Kashmir’s deep-rooted heritage of using local {{flora|वनस्पति}} for natural, organic cooking. In traditional medicine, it is valued for its {{soothing|आराम देने वाले}} and cooling properties, making rich, meat-heavy wazwan courses easier to digest.","hi":"मावल कश्मीर की स्थानीय वनस्पतियों से प्राकृतिक, जैविक खाना बनाने की गहरी परंपरा को दर्शाता है। पारंपरिक चिकित्सा में इसे आराम देने वाले और ठंडक देने वाले गुणों के लिए माना जाता है, जिससे भारी, मांस-प्रधान वाज़वान के व्यंजन पचाने में आसान हो जाते हैं।"},{"en":"As an {{irreplaceable|अपूरणीय}} element of Kashmir’s {{gastronomic|खान-पान संबंधी}} identity, mawal helps {{elevate|ऊँचा उठाना}} every feast into a visually stunning and authentic experience.","hi":"कश्मीर की खान-पान की पहचान के अपूरणीय तत्व के रूप में मावल हर भोज को देखने में शानदार और असली अनुभव में बदलने में मदद करता है।"}]],"vocab":[["culinary","adj","पाक-कला संबंधी","cooking-related","—","relating to cooking"],["hue","noun","रंगत, रंग","tint, shade","—","a colour or shade"],["indispensable","adj","अनिवार्य","essential, vital","dispensable","absolutely necessary"],["distinctive","adj","विशिष्ट, अलग","characteristic, unique","ordinary","clearly different and easy to recognise"],["pigment","noun","रंजक, रंग-द्रव्य","dye, colouring","—","a natural substance that gives colour"],["dense","adj","घना","thick, compact","sparse","closely packed or thick"],["fertile","adj","उपजाऊ","productive, fruitful","barren","able to produce crops or offspring in abundance"],["sacred","adj","पवित्र","holy, revered","profane","holy; deserving great respect"],["impart","verb","प्रदान करना","give, convey","withhold","to give or pass on a quality or knowledge"],["subtle","adj","हल्का, सूक्ष्म","delicate, faint","obvious","delicate and not obvious"],["seamlessly","adv","बिना जोड़/रुकावट के","smoothly, fluidly","awkwardly","smoothly, without any visible break"],["complement","verb","पूरक होना","complete, enhance","clash","to add to something and improve it"],["steep","verb","भिगोना","soak, immerse","dry","to soak in liquid"],["strain","verb","छानना","filter, sieve","—","to pass through a filter or to stretch hard"],["simmer","verb","धीमी आँच पर पकाना","stew, boil gently","—","to cook gently just below boiling"],["flora","noun","वनस्पति","plant life","fauna","the plants of a particular region"],["soothing","adj","आराम देने वाला","calming, comforting","irritating","calming and comforting"],["irreplaceable","adj","अपूरणीय","unique, essential","replaceable","too special to be replaced"],["gastronomic","adj","खान-पान संबंधी","culinary","—","relating to good food and eating"],["elevate","verb","ऊँचा उठाना","raise, lift","lower","to raise to a higher level"]],"rc":[{"q":"What is the main idea of the passage?","o":["The cockscomb flower, as mawal, gives Kashmiri wazwan its colour and is central to its culinary identity","Cockscomb flowers are grown mainly for medicine","Wazwan is rarely cooked in Kashmir today","Rogan josh cannot be made without red chillies"],"a":0,"e":"लेख बताता है कि मावल कश्मीरी वाज़वान को रंग देता है और उसकी खान-पान पहचान का अहम हिस्सा है।"},{"q":"How is the crimson colour released from mawal, according to the passage?","o":["It is ground with chillies and eaten raw","It is fried in oil","It is boiled with milk","It is steeped in hot water and the extract is strained into gravies"],"a":3,"e":"पंखुड़ियाँ या पाउडर गर्म पानी में भिगोए जाते हैं और अर्क ग्रेवी में छाना जाता है।"},{"q":"What can be inferred about mawal’s flavour?","o":["It replaces all other spices","It is bitter and spicy","It blends with strong spices without dominating them","It has no effect on taste"],"a":2,"e":"लेख के अनुसार यह भारी मसालों को दबाए बिना उनका पूरक बनता है, यानी हल्का स्वाद देता है।"},{"q":"The tone of the author is best described as:","o":["Critical","Appreciative","Sarcastic","Fearful"],"a":1,"e":"लेखक मावल की परंपरा और महत्व की सराहना करता है।"},{"q":"The word ‘indispensable’ in the passage means:","o":["Rare","Optional","Expensive","Essential"],"a":3,"e":"Indispensable = अनिवार्य, यानी essential।"}],"pj":[{"q":["P. Mawal is usually sold in the traditional markets of Srinagar.","Q. To release the signature crimson colour, the dried flower petals or mawal powder is steeped in hot water.","R. The resulting rich, ruby extract is then strained directly into simmering gravies.","S. Mawal is indispensable in classics like rogan josh, adding colour and flavour to the famed gravy."],"o":["QPRS","PQRS","PRQS","SPQR"],"a":1,"e":"बाज़ार (P), रंग निकालना (Q), अर्क (R), फिर रोगन जोश में उपयोग (S)।"},{"q":["P. The cockscomb flower is recognisable by its distinctive, velvety, fan-shaped crest.","Q. Rich crimson pigment is concentrated in the dense and highly textured folds of the blossom.","R. These petals are harvested and dried to give traditional Kashmiri dishes their signature colour.","S. Cultivated in the fertile valleys of Kashmir, these blossoms are carefully handpicked at peak bloom."],"o":["QPRS","PRQS","PQRS","SPQR"],"a":2,"e":"पहचान (P), रंजक (Q), ‘These petals’ (R), फिर खेती और चुनाई (S)।"},{"q":["P. Mawal holds a sacred status in the wazwan.","Q. It imparts a subtle, earthy undertone.","R. It seamlessly complements heavy spices without overpowering them.","S. In traditional medicine, it is valued for its soothing and cooling properties."],"o":["QPRS","PRQS","SPQR","PQRS"],"a":3,"e":"दर्जा (P), स्वाद (Q), मसालों से मेल (R), फिर चिकित्सा में महत्व (S)।"},{"q":["P. The dried flowers are locally known as mawal.","Q. Mawal is usually sold in the traditional markets of Srinagar.","R. Mawal is indispensable in classics like rogan josh.","S. As an irreplaceable element of Kashmir’s gastronomic identity, mawal helps elevate every feast."],"o":["PQRS","QPRS","RPQS","SRQP"],"a":0,"e":"नाम (P), बाज़ार (Q), उपयोग (R), और अंत में निष्कर्ष (S)।"}],"es":[{"q":"Saffron, one of the (A) / costliest spices, (B) are grown in Kashmir. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Subject–verb agreement। Subject ‘Saffron’ एकवचन है, इसलिए ‘is grown’।"},{"q":"Saffron is (A) / harvested by hand (B) in a October. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Prepositions of time। ‘October’ स्वर से शुरू होता है, पर महीने से पहले ‘in October’ आता है (article नहीं)।"},{"q":"The region produces (A) / a lot of (B) saffrons every year. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Uncountable nouns। Saffron अगणनीय है, इसलिए ‘saffron’ (बहुवचन नहीं)।"},{"q":"The spice is rich (A) / with flavour and (B) is used in biryani. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Fixed preposition। ‘rich in’ सही है, ‘rich with’ नहीं।"},{"q":"The farmers picked (A) / the stigma and (B) dry them in the shade. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Tense consistency। पूरे वाक्य में काल एक रहे: ‘dried’।"},{"q":"The dish tastes (A) / deliciously (B) with a pinch of saffron. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Adjective vs adverb। Taste जैसी linking क्रियाओं के बाद विशेषण आता है: ‘delicious’।"},{"q":"The farmer (A) / which grows saffron (B) lives in Pampore. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Relative pronoun। व्यक्ति के लिए ‘who’ आता है: ‘who grows’।"},{"q":"The growers (A) / themselves packed (B) the spice. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Reflexive pronoun। Reflexive ‘themselves’ का प्रयोग ज़ोर देने के लिए सही है। वाक्य शुद्ध है।"},{"q":"Kashmirs (A) / saffron is (B) valued across India. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Possessive apostrophe। स्वामित्व के लिए apostrophe: ‘Kashmir’s saffron’।"},{"q":"Saffron is used (A) / for cooking, colouring (B) and to make medicines. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Parallel structure। समान रूप चाहिए: ‘for cooking, colouring and making medicines’।"}],"qz":[{"q":"Synonym of INDISPENSABLE:","o":["Optional","Essential","Minor","Costly"],"a":1,"e":"Indispensable = Essential।"},{"q":"Antonym of SACRED:","o":["Holy","Revered","Profane","Divine"],"a":2,"e":"Sacred (पवित्र) का उलटा Profane।"},{"q":"Synonym of SOOTHING:","o":["Calming","Irritating","Sharp","Noisy"],"a":0,"e":"Soothing = Calming।"},{"q":"Antonym of DENSE:","o":["Thick","Compact","Packed","Sparse"],"a":3,"e":"Dense (घना) का उलटा Sparse।"},{"q":"Choose the correctly spelt word:","o":["Cullinary","Culinery","Culinary","Culinnary"],"a":2,"e":"सही spelling Culinary है।"},{"q":"One word: relating to cooking and kitchens","o":["Culinary","Gastric","Sacred","Fertile"],"a":0,"e":"Culinary यानी पाक-कला संबंधी।"},{"q":"One word: the plant life of a particular region","o":["Fauna","Pigment","Hue","Flora"],"a":3,"e":"Flora यानी वनस्पति।"},{"q":"Fill in the blank: Saffron will ___ a golden hue to the rice.","o":["impart","strain","elevate","steep"],"a":0,"e":"रंग ‘प्रदान’ करने के लिए impart।"},{"q":"Fill in the blank: The tea leaves were ___ in hot water for five minutes.","o":["strained","steeped","dried","sacred"],"a":1,"e":"पत्तियाँ पानी में ‘भिगोई’ गईं, यानी steeped।"},{"q":"Idiom: ‘a feast for the eyes’ means:","o":["A medical test","A heavy meal","A very beautiful sight","A boring scene"],"a":2,"e":"A feast for the eyes = आँखों को सुकून देने वाला दृश्य।"},{"q":"Idiom: ‘icing on the cake’ means:","o":["A cooking mistake","A small extra good thing on top of something already good","A bitter ending","A birthday gift only"],"a":1,"e":"Icing on the cake = अच्छी चीज़ में एक और अच्छी बात जुड़ जाना।"},{"q":"Phrasal verb: ‘pass down’ means:","o":["Forget","Throw away","Transfer to later generations","Climb"],"a":2,"e":"Pass down = पीढ़ी-दर-पीढ़ी आगे देना।"},{"q":"Synonym of AUTHENTIC:","o":["Genuine","Fake","Weak","Hidden"],"a":0,"e":"Authentic = Genuine, यानी असली।"},{"q":"According to the passage, what is the scientific name of the cockscomb flower?","o":["Rosa indica","Hibiscus rosa","Tagetes erecta","Celosia cristata"],"a":3,"e":"पैराग्राफ़ के अनुसार नाम Celosia cristata है।"},{"q":"According to the passage, what are the master chefs of wazwan called?","o":["Mawals","Wazas","Rogans","Ristas"],"a":1,"e":"माहिर रसोइयों को वाज़ा कहा जाता है।"}],"idioms":[["a feast for the eyes","आँखों को सुकून देने वाला दृश्य","The field of crimson flowers was a feast for the eyes.","something very beautiful to look at"],["icing on the cake","अच्छी चीज़ में एक और अच्छी बात","The aroma was icing on the cake.","an extra good thing added to something good"],["pass down (phrasal verb)","पीढ़ी-दर-पीढ़ी आगे देना","The recipe was passed down for generations.","to hand over to the next generation"]],"fq":[]},{"id":"qcorner","title":"Only change is constant","src":"The Hindu, Delhi edition, 1 Nov 2026, p. 13 (Science · Question Corner) · Topic: Science","todo":"","ed":[[{"en":"Humans are still evolving — through new {{mutations|उत्परिवर्तन}}, natural selection, migration, and {{random|आकस्मिक}} chance.","hi":"इंसान अब भी विकसित हो रहे हैं: नए उत्परिवर्तनों, प्राकृतिक चयन, प्रवास और आकस्मिक संयोग के ज़रिए।"},{"en":"Put one way, evolution can be {{discerned|पहचाना जा सकता है}} from changes in the frequencies of the genetic {{variants|रूपांतर}} passed down through the generations. But this process is too slow to {{detect|पता लगाना}} within a single human lifetime.","hi":"एक तरह से कहें तो विकास को पीढ़ियों से आगे बढ़ने वाले आनुवंशिक रूपांतरों की आवृत्ति में बदलाव से पहचाना जा सकता है। लेकिन यह प्रक्रिया इतनी धीमी है कि एक इंसानी जीवनकाल में पकड़ में नहीं आती।"}],[{"en":"But one good example of something we know has changed is the ability of human adults to digest milk. Most {{mammals|स्तनधारी}} lose their ability to digest lactose after {{weaning|दूध छुड़ाने}}, but in the last several {{millennia|हज़ार साल के कालखंड}}, genetic variants have allowed this ability to last longer in some human populations.","hi":"लेकिन जिस चीज़ के बदलने का हमें पक्का पता है उसका एक अच्छा उदाहरण वयस्कों की दूध पचाने की क्षमता है। ज़्यादातर स्तनधारी दूध छूटने के बाद लैक्टोज़ पचाने की क्षमता खो देते हैं, पर पिछले कई हज़ार सालों में आनुवंशिक रूपांतरों ने कुछ इंसानी आबादियों में यह क्षमता लंबे समय तक बनाए रखी है।"},{"en":"In an another example, humans have evolved through the way they resisted {{infectious|संक्रामक}} diseases. In regions where malaria is {{endemic|स्थानिक}}, people with one copy of the sickle-cell variant have some protection against {{severe|गंभीर}} malaria.","hi":"एक और उदाहरण में, इंसान संक्रामक रोगों का सामना करने के तरीक़े से भी विकसित हुए हैं। जिन इलाक़ों में मलेरिया स्थानिक है, वहाँ सिकल-सेल रूपांतर की एक प्रति वाले लोगों को गंभीर मलेरिया से कुछ सुरक्षा मिलती है।"}],[{"en":"Overall, evolution has no {{predetermined|पहले से तय}} direction, so it is hard to predict how humans will change in the coming millennia.","hi":"कुल मिलाकर, विकास की कोई पहले से तय दिशा नहीं होती, इसलिए आने वाले हज़ारों सालों में इंसान कैसे बदलेंगे, इसका अनुमान लगाना कठिन है।"}]],"vocab":[["mutation","noun","उत्परिवर्तन (जीन में बदलाव)","alteration, change","—","a change in the genetic material"],["random","adj","आकस्मिक, बेतरतीब","haphazard, chance","planned, deliberate","happening without a plan or pattern"],["discern","verb","पहचानना, भेद करना","perceive, detect","overlook","to notice or recognise with effort"],["variant","noun","रूपांतर, भिन्न रूप","version, form","—","a slightly different form of something"],["detect","verb","पता लगाना","notice, spot","miss","to discover or notice the presence of"],["mammal","noun","स्तनधारी","—","—","an animal that feeds its young with milk"],["weaning","noun","दूध छुड़ाना","—","—","gradually stopping milk feeding of a baby or young"],["millennium","noun","हज़ार साल का कालखंड","—","—","a period of one thousand years"],["resist","verb","प्रतिरोध करना, सामना करना","withstand, oppose","yield","to fight against or withstand"],["infectious","adj","संक्रामक","contagious, catching","non-contagious","able to spread from one person to another"],["endemic","adj","स्थानिक (किसी इलाक़े में सामान्य)","local, native","widespread, epidemic","regularly found in a particular region or group"],["severe","adj","गंभीर, तीव्र","serious, acute","mild","very serious or intense"],["predetermined","adj","पहले से तय","fixed, preset","open","decided or fixed in advance"]],"rc":[{"q":"What is the main idea of the passage?","o":["Human evolution stopped thousands of years ago","Humans are still evolving, but slowly and without a fixed direction","Only mammals other than humans are evolving","Malaria is the only force behind evolution"],"a":1,"e":"लेख कहता है कि इंसान अब भी विकसित हो रहे हैं, पर धीरे और बिना तय दिशा के।"},{"q":"Which example of a changed human trait does the passage give first?","o":["Adults’ ability to digest milk","Height","Eye colour","Running speed"],"a":0,"e":"पैराग्राफ़ का पहला उदाहरण वयस्कों में दूध (लैक्टोज़) पचाने की क्षमता है।"},{"q":"What can be inferred about the sickle-cell variant?","o":["It cures malaria completely","In malaria-endemic regions it can offer some protection against severe malaria","It spreads malaria","It is useful only outside malaria regions"],"a":1,"e":"लेख के अनुसार मलेरिया-स्थानिक इलाक़ों में एक प्रति कुछ सुरक्षा देती है।"},{"q":"The tone of the passage is best described as:","o":["Humorous","Angry","Informative","Pessimistic"],"a":2,"e":"लेख एक पाठक के सवाल का तथ्यात्मक, समझाने वाला जवाब है।"},{"q":"The word ‘endemic’ in the passage means:","o":["Regularly found in a particular area","Extremely rare","Completely cured","Newly invented"],"a":0,"e":"Endemic = किसी ख़ास इलाक़े में सामान्य रूप से पाया जाने वाला।"}],"pj":[{"q":["P. Humans are still evolving through new mutations, natural selection, migration, and random chance.","Q. Evolution can be discerned from changes in the frequencies of genetic variants.","R. But this process is too slow to detect within a single human lifetime.","S. Overall, evolution has no predetermined direction."],"o":["PRQS","QPRS","SPQR","PQRS"],"a":3,"e":"मुख्य बात (P), पहचान का तरीक़ा (Q), उसकी सीमा (R), निष्कर्ष (S)।"},{"q":["P. Most mammals lose their ability to digest lactose after weaning.","Q. In the last several millennia, genetic variants have allowed this ability to last longer in some human populations.","R. One good example of change is the ability of human adults to digest milk.","S. Humans are still evolving."],"o":["PQRS","RPQS","SRPQ","SPQR"],"a":2,"e":"मुख्य बात (S), उदाहरण (R), आम स्तनधारी (P), इंसानों में बदलाव (Q)।"},{"q":["P. In another example, humans have evolved through the way they resisted infectious diseases.","Q. In regions where malaria is endemic, people with one copy of the sickle-cell variant have some protection.","R. Overall, evolution has no predetermined direction.","S. Humans are still evolving."],"o":["PQRS","SQPR","RSPQ","SPQR"],"a":3,"e":"मुख्य बात (S), दूसरा उदाहरण (P), उसका ब्योरा (Q), निष्कर्ष (R)।"},{"q":["P. One good example of change is the ability of human adults to digest milk.","Q. Most mammals lose their ability to digest lactose after weaning.","R. But this process is too slow to detect within a single human lifetime.","S. Evolution can be discerned from changes in the frequencies of genetic variants."],"o":["SRPQ","QPRS","RSPQ","PQRS"],"a":0,"e":"पहचान का तरीक़ा (S), उसकी सीमा (R), उदाहरण (P), उसका ब्योरा (Q)।"}],"es":[{"q":"Mutations in genes (A) / is not (B) always harmful. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Subject–verb agreement। Mutations बहुवचन है, इसलिए ‘are not’।"},{"q":"Scientists detected (A) / the new variant (B) in an hospital. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Articles। ‘hospital’ व्यंजन से शुरू होता है, इसलिए ‘a hospital’।"},{"q":"Viruses differ (A) / from each other (B) with their structure. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Prepositions। ‘in their structure’ सही preposition है।"},{"q":"Scientists have (A) / studied (B) the virus last year. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Tense। ‘last year’ के साथ simple past आता है: ‘studied’ (present perfect नहीं)।"},{"q":"This variant spreads (A) / more faster (B) than the earlier one. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Comparative। ‘faster’ ख़ुद comparative है: ‘faster than’।"},{"q":"There is (A) / many evidence (B) of mutation. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Countable/uncountable। Evidence अगणनीय है: ‘much evidence’।"},{"q":"If mutation (A) / would not occur, (B) evolution would stop. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Conditional। If-clause में ‘would’ नहीं आता: ‘did not occur’।"},{"q":"The scientists are (A) / looking forward (B) to see the results. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Gerund after ‘look forward to’। ‘look forward to’ में ‘to’ preposition है, इसलिए gerund: ‘to seeing’।"},{"q":"The study was (A) / done by (B) my friend and I. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Pronoun case। Preposition के बाद object case: ‘me’।"},{"q":"Every virus (A) / and bacterium (B) have changed over time. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Plural noun। ‘Every’ से जुड़े subject के साथ एकवचन क्रिया: ‘has changed’।"}],"qz":[{"q":"Synonym of DISCERN:","o":["Overlook","Perceive","Ignore","Hide"],"a":1,"e":"Discern = Perceive, यानी पहचानना।"},{"q":"Antonym of RANDOM:","o":["Chance","Haphazard","Casual","Deliberate"],"a":3,"e":"Random (आकस्मिक) का उलटा Deliberate।"},{"q":"Synonym of DETECT:","o":["Lose","Notice","Bury","Delay"],"a":1,"e":"Detect = Notice, यानी पता लगाना।"},{"q":"Antonym of SEVERE:","o":["Harsh","Serious","Mild","Acute"],"a":2,"e":"Severe (गंभीर) का उलटा Mild।"},{"q":"Choose the correctly spelt word:","o":["Millenium","Millenum","Milennium","Millennium"],"a":3,"e":"सही spelling Millennium है।"},{"q":"One word: a warm-blooded animal that feeds milk to its young","o":["Reptile","Insect","Mammal","Amphibian"],"a":2,"e":"Mammal यानी स्तनधारी।"},{"q":"One word: a period of one thousand years","o":["Era","Decade","Century","Millennium"],"a":3,"e":"Millennium यानी हज़ार साल का कालखंड।"},{"q":"Fill in the blank: Malaria is ___ in several tropical regions.","o":["random","predetermined","endemic","mild"],"a":2,"e":"किसी इलाक़े में सामान्य रूप से पाई जाने वाली बीमारी के लिए endemic।"},{"q":"Fill in the blank: Scientists cannot easily ___ how species will change in future.","o":["predict","weaning","resist","detect"],"a":0,"e":"भविष्य के बारे में अनुमान लगाने के लिए predict।"},{"q":"Idiom: ‘by and large’ means:","o":["By force","Rarely","Mostly","Very large"],"a":2,"e":"By and large = ज़्यादातर, कुल मिलाकर।"},{"q":"Idiom: ‘break new ground’ means:","o":["To do something innovative","To dig a hole","To destroy land","To fail"],"a":0,"e":"Break new ground = कुछ नया या अग्रणी करना।"},{"q":"Idiom: ‘stand the test of time’ means:","o":["To arrive late","To last and remain valuable over time","To wait in a queue","To take an exam"],"a":1,"e":"Stand the test of time = लंबे समय तक टिके रहना और उपयोगी रहना।"},{"q":"Synonym of RESIST:","o":["Withstand","Yield","Accept","Invite"],"a":0,"e":"Resist = Withstand, यानी सामना करना।"},{"q":"According to the passage, what do most mammals lose after weaning?","o":["Their fur","The ability to digest lactose","Their sense of smell","Their teeth"],"a":1,"e":"ज़्यादातर स्तनधारी दूध छूटने के बाद लैक्टोज़ पचाने की क्षमता खो देते हैं।"},{"q":"According to the passage, how many copies of the sickle-cell variant give some protection against severe malaria?","o":["None","Two","Three","One"],"a":3,"e":"पैराग्राफ़ के अनुसार एक प्रति से कुछ सुरक्षा मिलती है।"}],"idioms":[["by and large","ज़्यादातर, कुल मिलाकर","By and large, evolution works too slowly to notice.","mostly; in general"],["break new ground","कुछ नया या अग्रणी करना","The study broke new ground in genetics.","to do something new for the first time"],["stand the test of time","लंबे समय तक टिके रहना","Darwin’s theory has stood the test of time.","to remain good or useful for a long time"]],"fq":[]}]},{"date":"31 Oct 2026","articles":[{"id":"digiarrest","title":"Beyond gullibility","src":"The Hindu, Delhi edition, 31 Oct 2026, p. 8 (Editorial) · Bank measures can only limit damage from ‘digital arrest’ scams · Topic: AI / Digital / Cyber","todo":"","ed":[[{"en":"Chief Justice of India Surya Kant’s {{exasperation|झुंझलाहट}}, during the Supreme Court’s hearing on October 29 on the “digital arrest” scams, that people still fall for such scams despite {{abundant|भरपूर}} warnings and orders from the Court is understandable.","hi":"29 अक्टूबर को सुप्रीम कोर्ट में “डिजिटल अरेस्ट” ठगी की सुनवाई के दौरान मुख्य न्यायाधीश सूर्य कांत की यह झुंझलाहट समझ में आती है कि कोर्ट की भरपूर चेतावनियों और आदेशों के बावजूद लोग ऐसी ठगी में फँस रहे हैं।"},{"en":"About ₹800 crore has been lost to these scams this year even after recoveries, a {{hefty|भारी-भरकम}} sum from the savings of individual victims. But this is not merely about {{gullibility|भोलापन}}.","hi":"इस साल रिकवरी के बाद भी इन ठगियों में करीब ₹800 करोड़ का नुकसान हुआ है, जो अलग-अलग पीड़ितों की जमा-पूँजी की भारी-भरकम रकम है। लेकिन मामला सिर्फ़ भोलेपन का नहीं है।"},{"en":"{{Scammers|ठग}} posing as CBI or police officers succeed because their victims, older citizens in particular, {{defer|झुक जाना}} to or fear law enforcement. When Indian police are widely seen as {{high-handed|मनमाना}} towards ordinary citizens and as serving only the powerful, the threat of an “arrest” over a video call cannot be that {{implausible|अविश्वसनीय}} for many.","hi":"CBI या पुलिस अधिकारी बनने वाले ठग इसलिए सफल होते हैं कि उनके शिकार, ख़ासकर बुज़ुर्ग, क़ानून-व्यवस्था के आगे झुक जाते हैं या उससे डरते हैं। जब पुलिस को आम नागरिकों के प्रति मनमाना और सिर्फ़ ताक़तवर की सेवा करने वाला माना जाता है, तो वीडियो कॉल पर “गिरफ़्तारी” की धमकी कई लोगों को इतनी अविश्वसनीय नहीं लगती।"},{"en":"That said, the Court’s pressing of the Reserve Bank of India to finalise its KYC Amendment Directions, 2026, which require banks to flag suspected mule accounts and put temporary debit holds on them, is welcome.","hi":"फिर भी, कोर्ट का RBI पर KYC संशोधन निर्देश, 2026 को अंतिम रूप देने का दबाव स्वागत योग्य है। इनके तहत बैंकों को संदिग्ध म्यूल खातों को चिह्नित करना और उन पर अस्थायी डेबिट रोक लगानी होगी।"},{"en":"CBI investigations have shown that mule accounts are central to scammers {{laundering|अवैध पैसे को वैध दिखाना}} their proceeds after {{duping|ठगना}} victims and that bank staff have, in some cases, helped open them. With the availability of complete transaction histories and AI tools, banks can now spot {{anomalous|असामान्य}} transactions faster.","hi":"CBI की जाँच बताती है कि ठग पीड़ितों को ठगने के बाद रकम को वैध दिखाने के लिए म्यूल खातों पर निर्भर रहते हैं, और कुछ मामलों में बैंक कर्मचारियों ने ही ये खाते खुलवाने में मदद की। पूरे लेन-देन के रिकॉर्ड और AI टूल्स की वजह से अब बैंक असामान्य लेन-देन जल्दी पकड़ सकते हैं।"},{"en":"The Attorney-General’s {{assurance|आश्वासन}} that the directions will be in force by December 31 is also welcome. The Court’s insistence that banks compensate victims addresses an issue with the RBI’s zero-liability provisions.","hi":"अटॉर्नी जनरल का यह आश्वासन भी स्वागत योग्य है कि ये निर्देश 31 दिसंबर तक लागू हो जाएँगे। कोर्ट का यह आग्रह कि बैंक पीड़ितों को मुआवज़ा दें, RBI के ‘ज़ीरो-लायबिलिटी’ प्रावधानों की एक कमी को दूर करता है।"},{"en":"Its 2017 circular covers only {{unauthorised|अनधिकृत}} transactions, leaving victims who were {{coerced|मजबूर किए गए}} into making transfers without any {{recourse|सहारा/उपाय}}.","hi":"RBI का 2017 का सर्कुलर सिर्फ़ अनधिकृत लेन-देन को कवर करता है, इसलिए जिन पीड़ितों पर दबाव डालकर ख़ुद पैसे ट्रांसफर करवाए गए, वे बिना किसी उपाय के रह जाते हैं।"}],[{"en":"Yet, full compensation for the victims whenever banks are found wanting in due diligence must be implemented with care as this might force banks to flag far more than the actual mule accounts. Already the RBI directions cast a wide net.","hi":"फिर भी, बैंकों की चूक (due diligence में कमी) पाए जाने पर पीड़ितों को पूरा मुआवज़ा देना सावधानी से लागू होना चाहिए, क्योंकि इससे बैंक असली म्यूल खातों से कहीं ज़्यादा खातों को चिह्नित करने पर मजबूर हो सकते हैं। RBI के निर्देश पहले ही काफ़ी बड़ा जाल डालते हैं।"},{"en":"Any transaction of ₹1,000 or more that is ‘unusual’ for an account holder’s declared profile, or linked to a reported account, can be held for up to 60 days, and longer if directed by the police.","hi":"खाताधारक की घोषित प्रोफ़ाइल के हिसाब से ‘असामान्य’ या किसी रिपोर्ट किए गए खाते से जुड़ा ₹1,000 या उससे ज़्यादा का कोई भी लेन-देन 60 दिन तक रोका जा सकता है, और पुलिस के कहने पर इससे ज़्यादा भी।"},{"en":"In cases where small traders and Jan Dhan account holders have unknowingly received transfers from mule accounts, freezing their accounts for two months or more is a {{disproportionate|अनुपात से ज़्यादा}} penalty. Also, the Court’s suggestion that unusual transactions must be automatically reported to the police and physically verified raises privacy concerns.","hi":"जहाँ छोटे व्यापारियों और जन धन खाताधारकों को अनजाने में म्यूल खातों से पैसे मिल गए, वहाँ उनके खाते दो महीने या उससे ज़्यादा फ्रीज़ करना अनुपात से ज़्यादा सज़ा है। साथ ही, कोर्ट का यह सुझाव कि असामान्य लेन-देन अपने-आप पुलिस को बताए जाएँ और भौतिक रूप से सत्यापित हों, निजता की चिंता खड़ी करता है।"},{"en":"These measures must ensure that genuine account holders are not {{penalised|दंडित}} for bank failures.","hi":"इन उपायों को यह पक्का करना चाहिए कि असली खाताधारकों को बैंकों की विफलता की सज़ा न मिले।"},{"en":"Many of these scams are run from compounds using {{trafficked|तस्करी कर लाए गए}} Indians in conflict-ridden parts of Myanmar and in Cambodia and Laos where they have thrived due to some degree of official {{patronage|संरक्षण}}. India must use its {{clout|दबदबा}} to pressure these regimes.","hi":"इनमें से कई ठगियाँ म्यांमार, कंबोडिया और लाओस के संघर्ष-ग्रस्त इलाक़ों में बने कंपाउंड से चलती हैं, जहाँ तस्करी करके लाए गए भारतीयों का इस्तेमाल होता है, और कुछ हद तक सरकारी संरक्षण की वजह से ये फल-फूल रही हैं। भारत को इन शासनों पर दबाव बनाने के लिए अपने दबदबे का इस्तेमाल करना चाहिए।"}]],"vocab":[["exasperation","noun","झुंझलाहट","irritation, annoyance","calm","strong irritation or annoyance"],["gullibility","noun","भोलापन (आसानी से बहक जाना)","naivety","scepticism","the tendency to believe things too easily"],["abundant","adj","भरपूर","plentiful, ample","scarce","existing in large quantities"],["hefty","adj","भारी-भरकम","substantial, large","small","large and heavy; considerable"],["defer","verb","आदर या डर से झुक जाना","yield, submit","resist","to put off to a later time"],["high-handed","adj","मनमाना, रौब जमाने वाला","overbearing, arrogant","humble","using power in an arrogant, unfair way"],["implausible","adj","अविश्वसनीय","unlikely, improbable","believable","not believable or unlikely"],["laundering","noun","अवैध पैसे को वैध दिखाना","legitimising illicit money","—","hiding illegal money by making it look legal"],["duping","verb","ठगना","deceiving, cheating","—","tricking or cheating someone"],["anomalous","adj","असामान्य","abnormal, irregular","normal","not following the usual pattern"],["assurance","noun","आश्वासन","guarantee, pledge","doubt","a positive promise or guarantee"],["recourse","noun","सहारा, उपाय","remedy, option","—","a source of help or legal remedy"],["coerced","verb","मजबूर किया गया","forced, compelled","persuaded","forced to do something by threat"],["disproportionate","adj","अनुपात से ज़्यादा","excessive, unequal","proportionate","too large or too small in comparison"],["penalised","verb","दंडित किया गया","punished","rewarded","punished or put at a disadvantage"],["trafficked","verb","(लोगों की) तस्करी की गई","smuggled","—","illegally bought, sold or moved"],["clout","noun","दबदबा","influence, power","weakness","influence or power"],["patronage","noun","संरक्षण, समर्थन","support, backing","opposition","support or favour given by a powerful person"],["scammers","noun","ठग","fraudsters, swindlers","—","people who cheat others to get money"],["unauthorised","adj","अनधिकृत","unapproved, unlicensed","authorised","done without official permission"]],"rc":[{"q":"What is the central argument of the editorial?","o":["Digital arrest victims alone are responsible for their losses","The RBI should freeze every account that receives money","Bank measures against such scams help, but must not harm genuine account holders","Older citizens fully trust the police and banks"],"a":2,"e":"लेख कहता है कि बैंक के उपाय नुकसान घटा सकते हैं, पर असली खाताधारकों को सज़ा नहीं मिलनी चाहिए। यही मुख्य विचार है।"},{"q":"According to the editorial, about how much money has been lost to these scams this year even after recoveries?","o":["₹800 crore","₹80 crore","₹8,000 crore","₹1,000 crore"],"a":0,"e":"पहले पैराग्राफ में लिखा है: recoveries के बाद भी करीब ₹800 करोड़ का नुकसान हुआ।"},{"q":"Why, according to the author, does the threat of an “arrest” over a video call work on many people?","o":["They have no bank accounts","They trust every unknown caller","They defer to or fear law enforcement, which is often seen as high-handed","They are unaware of video calls"],"a":2,"e":"लेख के अनुसार पीड़ित क़ानून-व्यवस्था से डरते हैं और पुलिस को मनमाना माना जाता है, इसलिए धमकी विश्वसनीय लगती है।"},{"q":"The tone of the author is best described as:","o":["Balanced and cautionary","Hostile and sarcastic","Indifferent","Joyful"],"a":0,"e":"लेखक कोर्ट के क़दम का स्वागत भी करता है और उनके जोखिम भी बताता है, इसलिए tone संतुलित और सावधान करने वाला है।"},{"q":"‘Disproportionate’ as used in the passage most nearly means:","o":["Temporary","Fair","Tiny","Excessive"],"a":3,"e":"Disproportionate penalty = ज़रूरत से ज़्यादा सज़ा, यानी Excessive।"}],"pj":[{"q":["P. Scammers posing as CBI or police officers succeed because their victims defer to or fear law enforcement.","Q. When Indian police are widely seen as high-handed towards ordinary citizens, the threat of an “arrest” cannot be that implausible.","R. But this is not merely about gullibility.","S. About ₹800 crore has been lost to these scams this year even after recoveries."],"o":["PQRS","SRPQ","RSPQ","SPRQ"],"a":1,"e":"पहले नुकसान का आँकड़ा (S), फिर ‘But…’ वाली R, उसके बाद कारण P और उसका विस्तार Q।"},{"q":["P. CBI investigations have shown that mule accounts are central to scammers laundering their proceeds.","Q. With the availability of complete transaction histories and AI tools, banks can now spot anomalous transactions faster.","R. The Attorney-General’s assurance that the directions will be in force by December 31 is also welcome.","S. The Court’s insistence that banks compensate victims addresses an issue with the RBI’s zero-liability provisions."],"o":["PQRS","QPRS","PRQS","SRQP"],"a":0,"e":"पहले समस्या (P), फिर समाधान की तकनीक (Q), फिर निर्देश लागू होने का आश्वासन (R), अंत में मुआवज़ा (S)।"},{"q":["P. Already the RBI directions cast a wide net.","Q. Any transaction of ₹1,000 or more that is ‘unusual’ for an account holder’s declared profile can be held for up to 60 days.","R. Yet, full compensation for the victims must be implemented with care as this might force banks to flag far more than the actual mule accounts.","S. In cases where small traders have unknowingly received transfers from mule accounts, freezing their accounts for two months or more is a disproportionate penalty."],"o":["PRQS","RPQS","RQPS","SRPQ"],"a":1,"e":"‘Yet…’ वाली R सबसे पहले चिंता रखती है, P ‘already’ से जुड़ती है, Q उदाहरण देती है और S नतीजा बताती है।"},{"q":["P. Many of these scams are run from compounds using trafficked Indians in conflict-ridden parts of Myanmar and in Cambodia and Laos.","Q. India must use its clout to pressure these regimes.","R. These measures must ensure that genuine account holders are not penalised for bank failures.","S. Also, the Court’s suggestion that unusual transactions must be automatically reported to the police raises privacy concerns."],"o":["PQSR","RSPQ","SRPQ","SPRQ"],"a":2,"e":"S निजता की चिंता बताती है, R उसी चिंता का निष्कर्ष है, फिर P नई बात (विदेशी कंपाउंड) और Q भारत की ज़िम्मेदारी।"}],"es":[{"q":"The police has warned (A) / people about (B) / the scam. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Subject–verb agreement। Police हमेशा बहुवचन है: ‘have warned’।"},{"q":"Scammers pretend to be a officer (A) / on (B) / video calls. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Articles। ‘officer’ स्वर से शुरू होता है: ‘an officer’।"},{"q":"The scammers (A) / asked him to (B) transfer the money immediately. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Infinitive after ‘ask’। ‘asked someone to + V1’ सही रूप है। वाक्य शुद्ध है।"},{"q":"He has been (A) / waiting for the money (B) from last week. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Since / for। ‘since last week’ आता है, ‘from’ नहीं।"},{"q":"Banks received less complaints (A) / this (B) / month. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Fewer / less। गणनीय संज्ञा के लिए ‘fewer complaints’।"},{"q":"The caller insisted (A) / to transfer (B) the money. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund। ‘insisted on transferring’ सही है।"},{"q":"The caller spoke (A) / very confident (B) on the phone. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Adjective vs adverb। क्रिया (spoke) को बताने के लिए क्रिया-विशेषण आता है: ‘confidently’।"},{"q":"The officer said (A) / that he is (B) from the CBI. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Reported speech। Reporting verb past होने पर ‘was’।"},{"q":"Not only did (A) / the victim lose money (B) but also his peace. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Conjunction। ‘Not only … but also’ में inversion सही है। वाक्य शुद्ध है।"},{"q":"The scam is (A) / easy to run, (B) hard to detect and difficulty to trace. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Parallel structure। समान रूप: ‘easy to run, hard to detect and hard to trace’।"}],"qz":[{"q":"Synonym of HEFTY:","o":["Tiny","Substantial","Fragile","Hollow"],"a":1,"e":"Hefty = Substantial, यानी भारी-भरकम।"},{"q":"Synonym of ABUNDANT:","o":["Plentiful","Scarce","Rare","Meagre"],"a":0,"e":"Abundant = Plentiful, यानी भरपूर।"},{"q":"Synonym of COERCED:","o":["Invited","Allowed","Forced","Thanked"],"a":2,"e":"Coerced = Forced, यानी मजबूर किया गया।"},{"q":"Synonym of CLOUT:","o":["Influence","Weakness","Doubt","Silence"],"a":0,"e":"Clout = Influence, यानी दबदबा।"},{"q":"Antonym of IMPLAUSIBLE:","o":["Unlikely","Believable","Doubtful","Strange"],"a":1,"e":"Implausible (अविश्वसनीय) का उलटा Believable।"},{"q":"Antonym of ANOMALOUS:","o":["Irregular","Rare","Odd","Normal"],"a":3,"e":"Anomalous (असामान्य) का उलटा Normal।"},{"q":"Antonym of DISPROPORTIONATE:","o":["Excessive","Proportionate","Unfair","Huge"],"a":1,"e":"Disproportionate का उलटा Proportionate।"},{"q":"Antonym of PATRONAGE:","o":["Support","Favour","Backing","Opposition"],"a":3,"e":"Patronage (संरक्षण) का उलटा Opposition।"},{"q":"Choose the correctly spelt word:","o":["Exasparation","Exasperation","Exaspiration","Exesperation"],"a":1,"e":"सही spelling Exasperation है।"},{"q":"Choose the correctly spelt word:","o":["Gullability","Gulibility","Gullibility","Gullibilty"],"a":2,"e":"सही spelling Gullibility है।"},{"q":"One word: to cheat someone out of money by trickery","o":["Deplore","Defer","Deter","Dupe"],"a":3,"e":"Dupe = ठगना, यानी चालाकी से धोखा देना।"},{"q":"One word: a person who is easily deceived","o":["Gullible","Cautious","Sceptical","Wary"],"a":0,"e":"Gullible = आसानी से बहकने वाला।"},{"q":"Fill in the blank: Some officials chose to turn a ____ to the suspicious deposits.","o":["short shrift","deaf ear","cold shoulder","blind eye"],"a":3,"e":"Turn a blind eye = जानबूझकर अनदेखा करना।"},{"q":"The idiom ‘cast a wide net’ means:","o":["To hide something","To go fishing","To include a large range of people or things","To cancel a plan"],"a":2,"e":"Cast a wide net = बहुत बड़े दायरे को शामिल करना।"},{"q":"Which of the following is NOT mentioned in the passage about the RBI directions?","o":["Flagging suspected mule accounts","Temporary debit holds","Holding unusual transactions for up to 60 days","Jail terms for bank staff"],"a":3,"e":"लेख में flagging, debit hold और 60 दिन तक रोक का ज़िक्र है। बैंक स्टाफ को जेल की बात नहीं है।"}],"idioms":[["cast a wide net","बहुत बड़े दायरे में जाँच करना या सबको शामिल करना","The new rules cast a wide net and catch honest customers too.","to include or search a large range"],["turn a blind eye","जानबूझकर अनदेखा करना","The staff turned a blind eye to the suspicious deposits.","to deliberately ignore something wrong"],["fall for (phrasal verb)","(धोखे या झाँसे में) फँस जाना","Many senior citizens fall for fake police calls.","to be tricked by; to fall in love with"]],"fq":[]},{"id":"aimic","title":"How AI is transforming U.S. military industrial complex","src":"The Hindu, Delhi edition, 31 Oct 2026, p. 8 (Editorial page article) · Shashank Ranjan · Topic: AI / Tech / IR","todo":"","ed":[[{"en":"The core of the U.S. Military Industrial Complex (MIC) is shifting from traditional hardware manufacturers to algorithm and AI companies which will lead to an obvious {{fallout|दुष्परिणाम, असर}} across the global defence industrial base.","hi":"अमेरिकी सैन्य-औद्योगिक तंत्र (MIC) का केंद्र पारंपरिक हार्डवेयर निर्माताओं से हटकर एल्गोरिद्म और AI कंपनियों की ओर जा रहा है, जिसका साफ़ असर दुनिया के रक्षा-औद्योगिक आधार पर पड़ेगा।"},{"en":"Three interlocking attributes to this shift are the {{inversion|उलट जाना}} of war economics, the restructuring of {{procurement|ख़रीद}} and capital logic, and the “software-defined” transformation of the military technology stack.","hi":"इस बदलाव की तीन आपस में जुड़ी विशेषताएँ हैं: युद्ध के अर्थशास्त्र का उलट जाना, ख़रीद और पूँजी के तर्क का पुनर्गठन, और सैन्य तकनीक का “सॉफ़्टवेयर-परिभाषित” रूपांतरण।"},{"en":"This shift was formally {{sanctified|औपचारिक मंज़ूरी पाना}} on September 29, 2026, when U.S. President Donald Trump {{convened|बुलाया}} the CEOs of the world’s most powerful AI companies to sign the White House Accord on Super Intelligence — a voluntary framework that symbolically integrated AI firms into the national security architecture.","hi":"इस बदलाव को 29 सितंबर 2026 को औपचारिक मंज़ूरी मिली, जब राष्ट्रपति डोनाल्ड ट्रंप ने दुनिया की सबसे ताक़तवर AI कंपनियों के CEO को बुलाकर ‘व्हाइट हाउस समझौते (सुपर इंटेलिजेंस)’ पर दस्तख़त करवाए। यह एक स्वैच्छिक ढाँचा है जिसने प्रतीकात्मक रूप से AI कंपनियों को राष्ट्रीय सुरक्षा के ढाँचे में शामिल कर दिया।"}],[{"en":"The military implications of this Accord are unmissable. Moreover, {{substantive|ठोस}} developments had already occurred months earlier in the military domain.","hi":"इस समझौते के सैन्य निहितार्थ साफ़ दिखते हैं। इतना ही नहीं, सैन्य क्षेत्र में महीनों पहले ही ठोस घटनाक्रम हो चुका था।"},{"en":"In May 2026, the U.S. Department of War announced agreements with eight AI companies — SpaceX, OpenAI, Google, Nvidia, Reflection, Microsoft, Amazon Web Services, and Oracle — to deploy their capabilities on classified networks at impact levels 6 and 7; the highest classification tiers for sensitive military operations.","hi":"मई 2026 में अमेरिकी युद्ध विभाग ने आठ AI कंपनियों के साथ समझौतों की घोषणा की, ताकि वे अपनी क्षमताएँ गोपनीय नेटवर्कों पर लगा सकें। ये नेटवर्क इम्पैक्ट लेवल 6 और 7 पर हैं, जो संवेदनशील सैन्य अभियानों के लिए सबसे ऊँचे वर्गीकरण स्तर हैं।"}],[{"en":"Drivers of the shift","hi":"बदलाव के कारण"}],[{"en":"The traditional MIC has operated on a ‘few but {{exquisite|उत्कृष्ट}}’ logic’, which is that multi-billion dollar platforms will ensure {{deterrence|निवारण (डराकर रोकना)}} from other parties as they would be technologically overpowered.","hi":"पारंपरिक MIC ‘कम पर उत्कृष्ट’ वाले तर्क पर चलता रहा है, यानी अरबों डॉलर के प्लेटफ़ॉर्म दूसरे पक्षों को रोके रखेंगे क्योंकि वे तकनीकी रूप से कहीं ज़्यादा ताक़तवर होंगे।"},{"en":"This logic has, however, been exposed as economically {{unsustainable|टिकाऊ नहीं}} and {{fragile|नाज़ुक}}. In recent conflicts, the U.S. and allied defences were compelled to expend expensive interceptors against cheap drones.","hi":"लेकिन यह तर्क आर्थिक रूप से टिकाऊ नहीं और नाज़ुक साबित हुआ है। हाल के संघर्षों में अमेरिका और सहयोगी देशों की रक्षा-प्रणालियों को सस्ते ड्रोन के ख़िलाफ़ महँगे इंटरसेप्टर ख़र्च करने पड़े।"}],[{"en":"The Pentagon’s response has been a dramatic funding shift. The Defence Autonomous Warfare Group (DAWG), which absorbed the {{stalled|अटकी हुई}} Biden-era Replicator Initiative (rapidly fielding thousands of low-cost, uncrewed autonomous systems across multiple domains) saw its budget projections jump from $225.9 million in FY26 to $54.6 billion in the upcoming FY27.","hi":"पेंटागन की प्रतिक्रिया फंडिंग में नाटकीय बदलाव रही है। डिफेंस ऑटोनॉमस वारफेयर ग्रुप (DAWG) ने बाइडेन-काल की अटकी हुई ‘रेप्लिकेटर’ पहल (बहुत से क्षेत्रों में कम लागत वाले, बिना चालक के हज़ारों स्वचालित सिस्टम तेज़ी से तैनात करना) को अपने में समा लिया, और उसके बजट अनुमान FY26 के $225.9 मिलियन से बढ़कर आगामी FY27 में $54.6 बिलियन हो गए।"}],[{"en":"If war economics created demand, capital markets provided the supply-side solution. The traditional MIC relied on “cost-plus” contracts, {{incentivising|प्रोत्साहित करना}} risk aversion and prolonged timelines.","hi":"अगर युद्ध के अर्थशास्त्र ने माँग बनाई, तो पूँजी बाज़ार ने आपूर्ति-पक्ष का हल दिया। पारंपरिक MIC “लागत-जमा-मुनाफ़ा” (cost-plus) अनुबंधों पर निर्भर था, जो जोखिम से बचने और लंबी समय-सीमाओं को बढ़ावा देते थे।"},{"en":"The new players or the neo-primes, which are software companies such as Palantir, SpaceX, Anduril etc., employ fixed-price contracts, {{absorbing|सहना}} upfront costs and trading on-time delivery for higher margins.","hi":"नए खिलाड़ी, यानी ‘नियो-प्राइम’ (सॉफ़्टवेयर कंपनियाँ जैसे पैलेंटिर, स्पेसएक्स, एंडुरिल आदि), तय क़ीमत वाले अनुबंध अपनाते हैं। वे शुरुआती लागत ख़ुद सहते हैं और समय पर डिलीवरी के बदले ऊँचा मुनाफ़ा लेते हैं।"},{"en":"The combined enterprise value of the neo-primes exceeds the value of the ‘Big Three’ companies (Lockheed Martin, RTX, and Northrop Grumman) by three times, despite revenues nearly eight times smaller.","hi":"नियो-प्राइम कंपनियों का कुल एंटरप्राइज़ मूल्य ‘बिग थ्री’ (लॉकहीड मार्टिन, RTX और नॉर्थरोप ग्रुम्मन) से तीन गुना ज़्यादा है, जबकि उनका राजस्व लगभग आठ गुना कम है।"}],[{"en":"The explanation lies in procurement reform. In March 2026, the Army awarded Anduril a 10-year, $20 billion enterprise contract that {{consolidated|एक में मिला दिया}} more than 120 separate procurement actions into one acquisition component.","hi":"इसकी वजह ख़रीद-सुधार में है। मार्च 2026 में सेना ने एंडुरिल को 10 साल का $20 बिलियन का एंटरप्राइज़ अनुबंध दिया, जिसने 120 से ज़्यादा अलग ख़रीद-कार्रवाइयों को एक अधिग्रहण घटक में मिला दिया।"},{"en":"The U.S. Army has signed 14 such enterprise contracts in eight months, replacing 118 individual contracts — an 88% reduction in contract volume. Programs that took seven years to award now move in months.","hi":"अमेरिकी सेना ने आठ महीनों में ऐसे 14 एंटरप्राइज़ अनुबंध किए हैं, जिन्होंने 118 अलग अनुबंधों की जगह ली। यानी अनुबंधों की संख्या में 88% की कमी आई। जिन कार्यक्रमों को देने में सात साल लगते थे, वे अब महीनों में आगे बढ़ते हैं।"},{"en":"Palantir’s Maven Smart System was formally designated an ‘official program’ with locked in long-term funding, which was the first time a Silicon Valley company has been directly {{embedded|जड़ा हुआ, शामिल}} into the defence budgetary skeleton.","hi":"पैलेंटिर के ‘मावेन स्मार्ट सिस्टम’ को औपचारिक रूप से ‘आधिकारिक कार्यक्रम’ घोषित किया गया और उसे लंबी अवधि की पक्की फंडिंग मिली। यह पहली बार है कि सिलिकॉन वैली की कोई कंपनी सीधे रक्षा बजट के ढाँचे में शामिल हुई है।"}],[{"en":"The May 2026 agreements by Pentagon with AI companies laid out the functional layers of the algorithmic military stack. The algorithm and the layered-model constitute the brain which include OpenAI (multilingual intelligence analysis), Google (satellite imagery target recognition), and Reflection AI (autonomous combat agents).","hi":"मई 2026 में पेंटागन के AI कंपनियों से हुए समझौतों ने एल्गोरिद्म-आधारित सैन्य स्टैक की कार्यात्मक परतें तय कीं। एल्गोरिद्म और परतदार मॉडल इसका ‘दिमाग़’ हैं, जिसमें OpenAI (बहुभाषी ख़ुफ़िया विश्लेषण), गूगल (उपग्रह तस्वीरों से लक्ष्य पहचान) और रिफ़्लेक्शन AI (स्वायत्त लड़ाकू एजेंट) शामिल हैं।"},{"en":"The compute layer is provided by Nvidia’s military-grade GPU clusters. The cloud services layer is built by Microsoft, Amazon, and Oracle. The communications layer is by SpaceX’s Starlink and Starshield while Palantir and Anduril serve as strategic hubs and frontline execution terminals (edge AI, drone swarms, counter-drone systems).","hi":"कंप्यूट परत एनवीडिया के सैन्य-स्तर के GPU क्लस्टर देते हैं। क्लाउड सेवाओं की परत माइक्रोसॉफ़्ट, अमेज़न और ओरेकल ने बनाई है। संचार परत स्पेसएक्स के स्टारलिंक और स्टारशील्ड की है, जबकि पैलेंटिर और एंडुरिल रणनीतिक केंद्र और अग्रिम मोर्चे के कार्यान्वयन टर्मिनल (एज AI, ड्रोन झुंड, एंटी-ड्रोन सिस्टम) का काम करते हैं।"},{"en":"The core thesis of “software-defined warfare” is that codes and not platforms have become the {{decisive|निर्णायक}} differentiator. A warship’s systems can become smarter overnight through a single download, and drones can switch from reconnaissance to electronic attack by loading a different software.","hi":"“सॉफ़्टवेयर-परिभाषित युद्ध” की मूल बात यह है कि अब प्लेटफ़ॉर्म नहीं, कोड फ़र्क़ तय करने वाला निर्णायक कारक बन गया है। एक ही डाउनलोड से युद्धपोत के सिस्टम रातोंरात स्मार्ट हो सकते हैं, और अलग सॉफ़्टवेयर लोड करके ड्रोन टोही से इलेक्ट्रॉनिक हमले पर आ सकते हैं।"}],[{"en":"Traditional contractors however, have not disappeared. Lockheed, RTX, and Northrop still receive the vast majority of defence budget dollars and spend far more on {{lobbying|पैरवी}}. However, the symbolic indicators have reversed: capital market valuations now reflect investors’ judgment about the future shape of the MIC.","hi":"फिर भी पारंपरिक ठेकेदार ग़ायब नहीं हुए हैं। लॉकहीड, RTX और नॉर्थरोप को अब भी रक्षा बजट के ज़्यादातर डॉलर मिलते हैं और वे पैरवी पर कहीं ज़्यादा ख़र्च करते हैं। लेकिन प्रतीकात्मक संकेत पलट गए हैं: पूँजी बाज़ार का मूल्यांकन अब MIC के भविष्य के बारे में निवेशकों की राय दिखाता है।"}],[{"en":"Concern about {{vulnerabilities|कमज़ोरियाँ}}","hi":"कमज़ोरियों को लेकर चिंता"}],[{"en":"In breaking with traditional contractors, the Pentagon may create new dependencies — Palantir’s battlefield systems and SpaceX’s launch capabilities could become the new single points of failure. More fundamentally, the speed of commercial AI iteration creates a verification gap.","hi":"पारंपरिक ठेकेदारों से हटने में पेंटागन नई निर्भरताएँ बना सकता है; पैलेंटिर के युद्धक्षेत्र सिस्टम और स्पेसएक्स की प्रक्षेपण क्षमता नए ‘एकल विफलता बिंदु’ बन सकते हैं। इससे भी बुनियादी बात यह है कि व्यावसायिक AI के तेज़ बदलाव से जाँच-सत्यापन में अंतर पैदा हो जाता है।"},{"en":"As AI companies deploy at commercial {{velocity|रफ़्तार}}, the Pentagon’s test and evaluation system, designed around static hardware, may not be enough. Certain programmes are still difficult to be validated. The vulnerability can be serious in the {{eventuality|संभावित स्थिति}} of unvalidated software-defined weapons failing due to a cyberattack.","hi":"जब AI कंपनियाँ व्यावसायिक रफ़्तार से तैनाती करती हैं, तो स्थिर हार्डवेयर के हिसाब से बने पेंटागन के परीक्षण और मूल्यांकन तंत्र काफ़ी नहीं हो सकते। कुछ कार्यक्रमों को परखना अब भी कठिन है। अगर बिना जाँचे सॉफ़्टवेयर-परिभाषित हथियार साइबर हमले से नाकाम हो जाएँ, तो यह कमज़ोरी गंभीर हो सकती है।"}],[{"en":"The core of the MIC has shifted from the factory to the server due to the arithmetic of cost-imposition, the venture-velocity logic of capital, and the architectural revolution of software-defined warfare. Victory in future wars may now depend on algorithms, data, and code.","hi":"लागत थोपने के गणित, पूँजी के वेंचर-रफ़्तार वाले तर्क और सॉफ़्टवेयर-परिभाषित युद्ध की ढाँचागत क्रांति की वजह से MIC का केंद्र कारख़ाने से सर्वर पर आ गया है। भविष्य के युद्धों में जीत अब एल्गोरिद्म, डेटा और कोड पर निर्भर कर सकती है।"}]],"vocab":[["fallout","noun","दुष्परिणाम, असर","consequence, repercussion","—","the bad results or side effects of an event"],["inversion","noun","उलट जाना","reversal","—","a reversal of position or order"],["procurement","noun","ख़रीद (सरकारी)","purchasing, acquisition","—","the act of obtaining goods or services"],["sanctified","verb","औपचारिक मंज़ूरी पाना","approved, authorised","condemned","made holy or officially approved"],["convened","verb","बुलाया, इकट्ठा किया","assembled, summoned","dispersed","called together for a meeting"],["substantive","adj","ठोस, वास्तविक","real, significant","trivial","having real importance and meaning"],["exquisite","adj","उत्कृष्ट, नफ़ीस","fine, refined","crude","extremely beautiful and delicate"],["deterrence","noun","निवारण (डराकर रोकना)","prevention, discouragement","encouragement","discouraging action by fear of consequences"],["unsustainable","adj","टिकाऊ नहीं","unviable, untenable","sustainable","not able to be continued at the same level"],["fragile","adj","नाज़ुक","delicate, brittle","sturdy","easily broken or damaged"],["stalled","adj","अटका हुआ","halted, stuck","progressing","stopped making progress"],["incentivising","verb","प्रोत्साहित करना","motivating, encouraging","discouraging","giving a reward to encourage action"],["absorbing","verb","(ख़र्च) सहना, समा लेना","bearing, soaking up","—","taking in; or very interesting"],["consolidated","verb","एक में मिलाया","merged, combined","divided","combined into one stronger whole"],["embedded","verb","जड़ा हुआ, गहराई से शामिल","fixed, integrated","detached","fixed firmly inside something"],["decisive","adj","निर्णायक","conclusive, crucial","indecisive","settling a matter with a clear result"],["lobbying","noun","पैरवी (नीति पर दबाव)","advocacy, pressuring","—","trying to influence decision-makers"],["vulnerabilities","noun","कमज़ोरियाँ","weaknesses, flaws","strengths","weak points open to attack or harm"],["velocity","noun","रफ़्तार","speed, pace","—","speed in a given direction"],["eventuality","noun","संभावित स्थिति","possibility, contingency","—","a possible future event"]],"rc":[{"q":"What is the main idea of the passage?","o":["AI firms refuse to work with the Pentagon","The U.S. is reducing its defence budget","Traditional contractors have disappeared completely","The core of the U.S. military industry is shifting from hardware makers to AI and software firms"],"a":3,"e":"पूरा लेख इसी बदलाव पर है कि MIC का केंद्र हार्डवेयर से एल्गोरिद्म और AI कंपनियों की ओर जा रहा है।"},{"q":"By how many times does the combined value of the neo-primes exceed that of the ‘Big Three’?","o":["Three times","Two times","Eight times","Ten times"],"a":0,"e":"लेख के अनुसार नियो-प्राइम का मूल्य बिग थ्री से तीन गुना ज़्यादा है (राजस्व लगभग आठ गुना कम होने पर भी)।"},{"q":"Why has the ‘few but exquisite’ logic been called fragile?","o":["Platforms became too cheap","Expensive interceptors were used against cheap drones","AI firms refused to join","Armies rejected fixed-price contracts"],"a":1,"e":"हाल के संघर्षों में सस्ते ड्रोन के ख़िलाफ़ महँगे इंटरसेप्टर ख़र्च करने पड़े, इसलिए यह तर्क नाज़ुक और टिकाऊ नहीं माना गया।"},{"q":"The tone of the author is best described as:","o":["Nostalgic","Humorous","Angry and accusatory","Analytical and mildly cautionary"],"a":3,"e":"लेखक बदलाव को विश्लेषण से समझाता है और अंत में कमज़ोरियों पर हल्की चेतावनी भी देता है।"},{"q":"‘Static’ (hardware) as used in the passage most nearly means:","o":["Fast-moving","Unchanging","Expensive","Digital"],"a":1,"e":"Static hardware = जो बदलता नहीं, यानी Unchanging।"}],"pj":[{"q":["P. The traditional MIC has operated on a ‘few but exquisite’ logic.","Q. This logic has, however, been exposed as economically unsustainable and fragile.","R. In recent conflicts, the U.S. and allied defences were compelled to expend expensive interceptors against cheap drones.","S. The Pentagon’s response has been a dramatic funding shift."],"o":["PRQS","QPRS","PQRS","SPQR"],"a":2,"e":"पहले पुराना तर्क (P), फिर उसकी कमी (Q), फिर उदाहरण (R), अंत में पेंटागन की प्रतिक्रिया (S)।"},{"q":["P. The explanation lies in procurement reform.","Q. In March 2026, the Army awarded Anduril a 10-year, $20 billion enterprise contract that consolidated more than 120 separate procurement actions into one acquisition component.","R. The U.S. Army has signed 14 such enterprise contracts in eight months, replacing 118 individual contracts.","S. Programs that took seven years to award now move in months."],"o":["QPRS","PQRS","PRQS","SRQP"],"a":1,"e":"पहले कारण का एलान (P), फिर उदाहरण (Q), उसके जैसे और अनुबंध (R) और अंत में नतीजा (S)।"},{"q":["P. The traditional MIC relied on “cost-plus” contracts, incentivising risk aversion and prolonged timelines.","Q. The new players or the neo-primes employ fixed-price contracts, absorbing upfront costs.","R. If war economics created demand, capital markets provided the supply-side solution.","S. The combined enterprise value of the neo-primes exceeds the value of the ‘Big Three’ companies by three times."],"o":["SRPQ","PRQS","RQPS","RPQS"],"a":3,"e":"R विषय शुरू करती है, P पुराने मॉडल को बताती है, Q नए मॉडल को, और S उसका नतीजा (मूल्य) है।"},{"q":["P. In breaking with traditional contractors, the Pentagon may create new dependencies.","Q. More fundamentally, the speed of commercial AI iteration creates a verification gap.","R. As AI companies deploy at commercial velocity, the Pentagon’s test and evaluation system may not be enough.","S. Victory in future wars may now depend on algorithms, data, and code."],"o":["QPRS","PRQS","PQRS","RSPQ"],"a":2,"e":"पहले नई निर्भरता (P), फिर बुनियादी समस्या (Q), उसका कारण (R), और निष्कर्ष (S)।"}],"es":[{"q":"The Pentagon, together with (A) / several firms, (B) are testing new tools. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Subject–verb agreement। Subject ‘Pentagon’ एकवचन है: ‘is testing’।"},{"q":"AI companies (A) / are now (B) a part of the national security architecture. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Articles। ‘a part of the’ सही प्रयोग है। वाक्य शुद्ध है।"},{"q":"The army depends of commercial software (A) / for (B) / targeting. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Prepositions। ‘depends on’ सही है।"},{"q":"The firm signed (A) / a deal in May (B) and has announced it yesterday. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Tense। ‘yesterday’ के साथ simple past: ‘announced’।"},{"q":"Drones are more cheaper (A) / than (B) / missiles. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Double comparative। ‘cheaper’ ख़ुद comparative है, ‘more’ नहीं लगेगा।"},{"q":"The report gave (A) / several advices (B) to the Pentagon. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Countable/uncountable। Advice अगणनीय है: ‘some advice’ या ‘several pieces of advice’।"},{"q":"If firms (A) / will not adapt, (B) they may lose contracts. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Conditional। If-clause में ‘adapt’ (present)।"},{"q":"The generals avoided (A) / to rely (B) on one vendor. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Gerund। Avoid के बाद gerund: ‘relying’।"},{"q":"The goal is faster (A) deployment, (B) cheaper tools and to improve safety. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Parallel structure। समान रूप: ‘improved safety’।"},{"q":"The firm and (A) the Pentagon signed (B) their agreement in May. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Subject–verb agreement (compound subject)। दो संज्ञाओं से बना subject बहुवचन है, ‘signed … their’ सही है। वाक्य शुद्ध है।"}],"qz":[{"q":"Synonym of FRAGILE:","o":["Sturdy","Delicate","Solid","Rigid"],"a":1,"e":"Fragile = Delicate, यानी नाज़ुक।"},{"q":"Synonym of DECISIVE:","o":["Conclusive","Minor","Hesitant","Weak"],"a":0,"e":"Decisive = Conclusive, यानी निर्णायक।"},{"q":"Synonym of CONVENED:","o":["Dismissed","Ignored","Assembled","Cancelled"],"a":2,"e":"Convened = Assembled, यानी बुलाया या इकट्ठा किया।"},{"q":"Synonym of VELOCITY:","o":["Weight","Height","Silence","Speed"],"a":3,"e":"Velocity = Speed, यानी रफ़्तार।"},{"q":"Antonym of UNSUSTAINABLE:","o":["Temporary","Unstable","Sustainable","Fragile"],"a":2,"e":"Unsustainable का उलटा Sustainable।"},{"q":"Antonym of SUBSTANTIVE:","o":["Trivial","Real","Solid","Major"],"a":0,"e":"Substantive (ठोस) का उलटा Trivial (मामूली)।"},{"q":"Antonym of EXQUISITE:","o":["Fine","Elegant","Delicate","Crude"],"a":3,"e":"Exquisite (उत्कृष्ट) का उलटा Crude (भद्दा)।"},{"q":"Antonym of STALLED:","o":["Halted","Progressing","Frozen","Delayed"],"a":1,"e":"Stalled (अटका) का उलटा Progressing (आगे बढ़ता)।"},{"q":"Choose the correctly spelt word:","o":["Procurement","Procurment","Procuremant","Prokurement"],"a":0,"e":"सही spelling Procurement है।"},{"q":"Choose the correctly spelt word:","o":["Vulnarability","Vulnerabilty","Vulnerability","Volnerability"],"a":2,"e":"सही spelling Vulnerability है।"},{"q":"One word: the act of discouraging an enemy from attacking through fear of the consequences","o":["Defiance","Deterrence","Deference","Deliverance"],"a":1,"e":"Deterrence = डराकर हमले से रोकना।"},{"q":"One word: a possible event or situation that may occur","o":["Equality","Eternity","Elasticity","Eventuality"],"a":3,"e":"Eventuality = संभावित स्थिति।"},{"q":"Fill in the blank: The new accord will ____ the way for closer defence-tech partnerships.","o":["pave","block","pay","pull"],"a":0,"e":"Pave the way for = रास्ता तैयार करना।"},{"q":"The idiom ‘raise the stakes’ means:","o":["To lower the price","To end a contest","To make a situation riskier or more serious","To avoid a decision"],"a":2,"e":"Raise the stakes = दाँव या जोखिम बढ़ाना।"},{"q":"According to the passage, which company is linked with satellite imagery target recognition?","o":["Google","Nvidia","Oracle","Microsoft"],"a":0,"e":"लेख में गूगल को ‘satellite imagery target recognition’ से जोड़ा गया है।"}],"idioms":[["pave the way for (phrasal verb)","रास्ता तैयार करना","The accord paved the way for AI firms to join defence work.","to make something easier to happen"],["raise the stakes","दाँव या जोखिम बढ़ाना","Cheap drones raised the stakes for expensive defence systems.","to increase the risk or importance"],["keep pace with","बराबर रफ़्तार से चलना","Old testing systems cannot keep pace with fast software updates.","to move or progress at the same speed as"]],"fq":[]},{"id":"poverty","title":"India made ‘remarkable progress’ in reducing poverty, says World Bank","src":"The Hindu, Delhi edition, 31 Oct 2026, p. 1 (Front page) · T.C.A. Sharad Raghavan · Topic: Economy","todo":"","ed":[[{"en":"India has over the last decade made “{{remarkable|उल्लेखनीय}}” progress in reducing poverty across both {{monetary|मौद्रिक (आय से जुड़े)}} and non-monetary dimensions, the World Bank said in a new report, adding that the country saw one of the fastest reductions in poverty in the world.","hi":"विश्व बैंक ने एक नई रिपोर्ट में कहा कि पिछले दशक में भारत ने मौद्रिक और ग़ैर-मौद्रिक, दोनों पहलुओं में ग़रीबी घटाने में “उल्लेखनीय” प्रगति की है, और देश में दुनिया की सबसे तेज़ ग़रीबी-कटौतियों में से एक देखी गई।"}],[{"en":"“Between 2011 and 2023, the share of the population living below the Lower Middle-Income Country line ($4.2/day) fell from 57.7% to 16.1%, lifting an {{estimated|अनुमानित}} 496 million people out of poverty, while {{extreme|अत्यधिक}} poverty ($3.00/day) declined from 27.1% to 2.6%,” the World Bank said in its October 2026 Poverty and Equity Brief for India released on Friday.","hi":"विश्व बैंक ने शुक्रवार को जारी भारत के लिए अपने अक्टूबर 2026 के ‘ग़रीबी और समानता संक्षिप्त विवरण’ में कहा: “2011 से 2023 के बीच निम्न-मध्यम आय वाले देशों की रेखा ($4.2 प्रतिदिन) से नीचे रहने वाली आबादी का हिस्सा 57.7% से घटकर 16.1% रह गया, जिससे अनुमानित 49.6 करोड़ लोग ग़रीबी से बाहर आए, जबकि अत्यधिक ग़रीबी ($3.00 प्रतिदिन) 27.1% से घटकर 2.6% रह गई।”"}],[{"en":"Further, it stated that it {{projected|अनुमान लगाया}} poverty to continue declining, “{{albeit|हालाँकि}} more {{gradually|धीरे-धीरे}}”.","hi":"इसके अलावा रिपोर्ट ने अनुमान लगाया कि ग़रीबी घटती रहेगी, “हालाँकि और धीमी गति से”।"},{"en":"“On the non-monetary dimensions, as measured by the Oxford Poverty and Human Development Initiative’s (OPHI) {{Multidimensional|बहुआयामी}} Poverty Index (MPI), poverty fell {{sharply|तेज़ी से}} from 53.8% in 2005-06 to 16.4% in 2019-21, with the World Bank MPI measure at 15.5% in 2022-23,” it stated.","hi":"रिपोर्ट के अनुसार, “ग़ैर-मौद्रिक पहलुओं पर, ऑक्सफ़ोर्ड ग़रीबी और मानव विकास पहल (OPHI) के बहुआयामी ग़रीबी सूचकांक (MPI) से मापने पर, ग़रीबी 2005-06 के 53.8% से तेज़ी से घटकर 2019-21 में 16.4% रह गई, और विश्व बैंक का MPI माप 2022-23 में 15.5% रहा।”"}],[{"en":"“Wage {{disparities|असमानताएँ}}, however, remain {{pronounced|स्पष्ट, गहरी}}, as {{median|मध्यिका (बीच का)}} earnings among the top 10% of workers were about 13 times those of the bottom 10% in 2023,” the report said.","hi":"रिपोर्ट ने कहा, “फिर भी मज़दूरी की असमानताएँ गहरी बनी हुई हैं, क्योंकि 2023 में शीर्ष 10% कामगारों की औसत (मध्यिका) कमाई निचले 10% की लगभग 13 गुना थी।”"},{"en":"“Poverty has also become increasingly {{concentrated|केंद्रित}} geographically,” it added. “While living standards improved across most States, households in a {{contiguous|सटे हुए}} belt stretching from Uttar Pradesh to West Bengal {{account for|हिस्सा होना}} 57% of India’s poor population.”","hi":"रिपोर्ट ने जोड़ा, “ग़रीबी भौगोलिक रूप से भी ज़्यादा केंद्रित होती गई है। ज़्यादातर राज्यों में जीवन-स्तर सुधरा, पर उत्तर प्रदेश से पश्चिम बंगाल तक फैली सटी हुई पट्टी के परिवार भारत की ग़रीब आबादी का 57% हैं।”"}],[{"en":"It also noted that, between 2017 and 2023, employment increased by about 134 million people, nearly twice the growth of the working-age population, with much of the {{gain|बढ़त}} {{driven|प्रेरित}} by rural women entering paid work and raising the number of earners per household.","hi":"रिपोर्ट ने यह भी कहा कि 2017 से 2023 के बीच रोज़गार लगभग 13.4 करोड़ लोगों से बढ़ा, जो कामकाजी आयु की आबादी की वृद्धि का लगभग दोगुना है। इस बढ़त का बड़ा हिस्सा वेतन वाले काम में आई ग्रामीण महिलाओं से आया, जिससे हर परिवार में कमाने वालों की संख्या बढ़ी।"},{"en":"“However, youth unemployment rose from 14.6% to 15.9% between the two quarters [Q1 FY2026 and Q1 FY2027], particularly among rural young women,” the World Bank report {{highlighted|रेखांकित किया}}.","hi":"विश्व बैंक की रिपोर्ट ने रेखांकित किया, “फिर भी दोनों तिमाहियों [Q1 FY2026 और Q1 FY2027] के बीच युवा बेरोज़गारी 14.6% से बढ़कर 15.9% हो गई, ख़ासकर ग्रामीण युवा महिलाओं में।”"}],[{"en":"FM hails findings","hi":"वित्त मंत्री ने निष्कर्षों की सराहना की"},{"en":"“The World Bank identifies strong {{consumption|उपभोग}} growth, rising employment — especially among women — and expanded social transfers, including food {{subsidies|सब्सिडी}}, as major {{drivers|प्रेरक कारक}},” Finance Minister Nirmala Sitharaman said.","hi":"वित्त मंत्री निर्मला सीतारमण ने कहा, “विश्व बैंक मज़बूत उपभोग वृद्धि, बढ़ते रोज़गार (ख़ासकर महिलाओं में) और खाद्य सब्सिडी समेत बढ़े हुए सामाजिक हस्तांतरणों को प्रमुख प्रेरक कारक बताता है।”"}]],"vocab":[["remarkable","adj","उल्लेखनीय","striking, notable","ordinary","worthy of notice; extraordinary"],["monetary","adj","मौद्रिक (धन या आय से जुड़ा)","financial, fiscal","—","relating to money"],["estimated","adj","अनुमानित","approximate, rough","exact","roughly calculated"],["extreme","adj","अत्यधिक, चरम","severe, intense","moderate","very great; the furthest degree"],["projected","verb","अनुमान लगाया","forecast, predicted","—","forecast or planned for the future"],["albeit","conj","हालाँकि","although, though","—","even though; although"],["gradually","adv","धीरे-धीरे","slowly, steadily","suddenly","slowly, step by step"],["multidimensional","adj","बहुआयामी","many-sided, multi-faceted","one-dimensional","having many aspects or measures"],["sharply","adv","तेज़ी से, तीखे ढंग से","steeply, abruptly","gradually","suddenly and by a large amount"],["disparities","noun","असमानताएँ","gaps, inequalities","equality","clear differences, usually unfair ones"],["pronounced","adj","स्पष्ट, गहरी","noticeable, marked","slight","very noticeable"],["median","noun","मध्यिका (बीच का मान)","middle value","—","the middle value in a set of numbers"],["concentrated","adj","केंद्रित","focused, clustered","dispersed","gathered in one place or small group"],["contiguous","adj","सटा हुआ","adjoining, neighbouring","separate","touching or sharing a border"],["account for","phrasal verb","हिस्सा होना; कारण होना","make up, constitute","—","to make up a particular part or to explain"],["gain","noun","बढ़त, लाभ","increase, rise","loss","an increase or improvement"],["driven","verb","प्रेरित, संचालित","propelled, motivated","—","pushed or motivated by something"],["drivers","noun","प्रेरक कारक","causes, factors","—","factors that cause something to happen"],["highlighted","verb","रेखांकित किया","emphasised, underlined","ignored","drew special attention to"],["consumption","noun","उपभोग, खपत","usage, spending","production","the using up of goods, food or energy"],["subsidies","noun","सब्सिडी (सरकारी आर्थिक मदद)","grants, financial aid","—","money given by government to lower prices"]],"rc":[{"q":"What is the main message of the report as presented in the article?","o":["India has completely eliminated poverty","Poverty in India has increased","India has sharply reduced poverty, though inequality, regional concentration and youth unemployment remain concerns","Only urban areas have improved"],"a":2,"e":"लेख प्रगति बताता है, साथ में असमानता, ग़रीबी का क्षेत्रीय केंद्रण और युवा बेरोज़गारी की चिंताएँ भी रखता है।"},{"q":"What happened to extreme poverty ($3.00/day) between 2011 and 2023?","o":["It fell from 27.1% to 2.6%","It rose to 27.1%","It fell from 57.7% to 16.1%","It stayed unchanged"],"a":0,"e":"लेख के अनुसार अत्यधिक ग़रीबी 27.1% से घटकर 2.6% रह गई। 57.7% से 16.1% वाला आँकड़ा निम्न-मध्यम आय रेखा का है।"},{"q":"What can be inferred about employment growth between 2017 and 2023?","o":["It fell below population growth","It outpaced growth of the working-age population","It was driven only by urban men","It did not affect earners per household"],"a":1,"e":"रोज़गार वृद्धि कामकाजी आयु की आबादी की वृद्धि का लगभग दोगुना थी, यानी उससे आगे रही।"},{"q":"The tone of the article is best described as:","o":["Humorous","Sarcastic","Alarmist","Objective and informative"],"a":3,"e":"लेख रिपोर्ट के आँकड़े तटस्थ ढंग से रखता है, इसलिए tone objective और informative है।"},{"q":"‘Pronounced’ as used in the passage most nearly means:","o":["Hidden","Noticeable","Slight","Vague"],"a":1,"e":"Pronounced disparities = साफ़ दिखने वाली, गहरी असमानताएँ, यानी Noticeable।"}],"pj":[{"q":["P. India has over the last decade made “remarkable” progress in reducing poverty across both monetary and non-monetary dimensions, the World Bank said in a new report.","Q. Further, it stated that it projected poverty to continue declining, “albeit more gradually”.","R. It also noted that, between 2017 and 2023, employment increased by about 134 million people, nearly twice the growth of the working-age population.","S. However, youth unemployment rose from 14.6% to 15.9%, particularly among rural young women, the World Bank report highlighted."],"o":["PQRS","QPRS","PRQS","SPQR"],"a":0,"e":"पहले मुख्य निष्कर्ष (P), फिर अनुमान (Q), फिर रोज़गार (R), अंत में ‘However’ वाली चिंता (S)।"},{"q":["P. Poverty has also become increasingly concentrated geographically, it added.","Q. While living standards improved across most States, households in a contiguous belt stretching from Uttar Pradesh to West Bengal account for 57% of India’s poor population.","R. Wage disparities, however, remain pronounced, the report said.","S. Between 2011 and 2023, the share of the population living below the Lower Middle-Income Country line fell from 57.7% to 16.1%."],"o":["PQRS","SRPQ","RSPQ","SPRQ"],"a":1,"e":"पहले प्रगति का आँकड़ा (S), फिर ‘however’ से असमानता (R), फिर भौगोलिक केंद्रण (P) और उसका विवरण (Q)।"},{"q":["P. On the non-monetary dimensions, poverty fell sharply from 53.8% in 2005-06 to 16.4% in 2019-21.","Q. The World Bank MPI measure stood at 15.5% in 2022-23.","R. Further, it stated that it projected poverty to continue declining, albeit more gradually.","S. Wage disparities, however, remain pronounced."],"o":["RPQS","PRQS","RQPS","SRPQ"],"a":0,"e":"R अनुमान से शुरू करती है, P आँकड़ा देती है, Q उसी आँकड़े का विश्व बैंक वाला माप है, और S ‘however’ से चिंता रखती है।"},{"q":["P. The World Bank identifies strong consumption growth, rising employment and expanded social transfers as major drivers, Finance Minister Nirmala Sitharaman said.","Q. It also noted that employment increased by about 134 million people between 2017 and 2023.","R. However, youth unemployment rose from 14.6% to 15.9%, particularly among rural young women.","S. Much of the gain was driven by rural women entering paid work."],"o":["QRSP","PQSR","QSRP","SQRP"],"a":2,"e":"पहले रोज़गार बढ़ा (Q), उसका कारण (S), फिर चिंता (R), अंत में वित्त मंत्री की प्रतिक्रिया (P)।"}],"es":[{"q":"The number of poor people have (A) / fallen (B) / sharply. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Subject–verb agreement। ‘The number of’ एकवचन: ‘has fallen’।"},{"q":"India has made a remarkable (A) / progress in (B) / reducing poverty. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Articles। Progress अगणनीय है, इसलिए ‘a’ नहीं: ‘remarkable progress’।"},{"q":"Poverty has fallen (A) / from a high level (B) to a lower one in a decade. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Prepositions। ‘fallen from … to …’ सही प्रयोग है। वाक्य शुद्ध है।"},{"q":"Fewer (A) people (B) now live in poverty than before. (C)","o":["A","B","C","No error"],"a":3,"e":"नियम: Fewer / less। ‘Fewer people’ गणनीय के लिए सही है। वाक्य शुद्ध है।"},{"q":"Incomes (A) / have risen (B) / for 2015 in most States. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Since / for। बिंदु-समय के साथ ‘since 2015’।"},{"q":"It is the most poorest (A) / State in (B) / the region. (C)","o":["A","B","C","No error"],"a":0,"e":"नियम: Comparative / superlative। Poorest ख़ुद superlative है: ‘the poorest’।"},{"q":"The Bank released (A) / new datas (B) on poverty. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Uncountable। Data अगणनीय/समूहवाची है: ‘new data’।"},{"q":"If growth (A) / continues, (B) poverty would fall faster. (C)","o":["A","B","C","No error"],"a":2,"e":"नियम: Conditional। Real condition में ‘will fall’ आएगा।"},{"q":"The gains (A) / has been (B) recorded in many States. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Passive voice। Gains बहुवचन है: ‘have been recorded’।"},{"q":"The report, (A) who was released (B) on Tuesday, praised India. (C)","o":["A","B","C","No error"],"a":1,"e":"नियम: Relative pronoun। निर्जीव के लिए ‘which’ आता है।"}],"qz":[{"q":"Synonym of PRONOUNCED:","o":["Noticeable","Hidden","Slight","Vague"],"a":0,"e":"Pronounced = Noticeable, यानी साफ़ दिखने वाला।"},{"q":"Synonym of ESTIMATED:","o":["Hidden","Exact","Approximate","Final"],"a":2,"e":"Estimated = Approximate, यानी अनुमानित।"},{"q":"Synonym of CONTIGUOUS:","o":["Distant","Adjoining","Separate","Scattered"],"a":1,"e":"Contiguous = Adjoining, यानी सटा हुआ।"},{"q":"Synonym of HIGHLIGHTED:","o":["Hid","Erased","Ignored","Emphasised"],"a":3,"e":"Highlighted = Emphasised, यानी रेखांकित किया।"},{"q":"Antonym of EXTREME:","o":["Severe","Intense","Moderate","Harsh"],"a":2,"e":"Extreme का उलटा Moderate।"},{"q":"Antonym of CONCENTRATED:","o":["Packed","Dense","Focused","Dispersed"],"a":3,"e":"Concentrated (केंद्रित) का उलटा Dispersed (बिखरा)।"},{"q":"Antonym of GRADUALLY:","o":["Slowly","Suddenly","Steadily","Patiently"],"a":1,"e":"Gradually (धीरे-धीरे) का उलटा Suddenly।"},{"q":"Antonym of DISPARITIES:","o":["Gaps","Differences","Equality","Divisions"],"a":2,"e":"Disparities (असमानताएँ) का उलटा Equality।"},{"q":"Choose the correctly spelt word:","o":["Subsidys","Subsedies","Subcidies","Subsidies"],"a":3,"e":"सही spelling Subsidies है।"},{"q":"Choose the correctly spelt word:","o":["Consumtion","Consumption","Consumpsion","Cunsumption"],"a":1,"e":"सही spelling Consumption है।"},{"q":"One word: money given by the government to keep prices low","o":["Subsidy","Tax","Fine","Levy"],"a":0,"e":"Subsidy = सरकारी आर्थिक मदद।"},{"q":"One word: relating to money or currency","o":["Fiscal","Moral","Mineral","Monetary"],"a":3,"e":"Monetary = मौद्रिक, यानी धन या मुद्रा से जुड़ा।"},{"q":"Fill in the blank: Households in this belt ____ for 57% of India’s poor.","o":["account","count","reckon","stand"],"a":0,"e":"Account for = हिस्सा होना।"},{"q":"The idiom ‘the lion’s share’ means:","o":["No part","A small part","An equal part","The largest part"],"a":3,"e":"The lion’s share = सबसे बड़ा हिस्सा।"},{"q":"According to the article, about how many people were lifted out of poverty between 2011 and 2023?","o":["134 million","57 million","496 million","16 million"],"a":2,"e":"लेख के अनुसार अनुमानित 496 मिलियन (लगभग 49.6 करोड़) लोग ग़रीबी से बाहर आए।"}],"idioms":[["account for (phrasal verb)","हिस्सा होना; कारण होना","Rural women account for much of the new employment.","to make up a part, or to explain"],["the lion’s share","सबसे बड़ा हिस्सा","The belt has the lion’s share of India’s poor households.","the largest part of something"],["by and large","कुल मिलाकर","By and large, living standards improved across States.","mostly; in general"]],"fq":[]}]},{"date":"30 Oct 2026","articles":[{"id":"dpdp","title":"Open to probe","src":"The Hindu, Delhi edition, 30 Oct 2026, p. 8 (Editorial) · Public functionaries must not use privacy to seek exemption from scrutiny · Topic: AI / Digital / Tech","todo":"","ed":[[{"en":"The Digital News Publishers Association’s (DNPA) challenge to the Digital Personal Data Protection Act, 2023, and its Rules, has drawn attention to concerns that a law to {{safeguard|सुरक्षित रखना}} informational privacy risks creating a serious {{chilling effect|भय का असर}} on the media.","hi":"डिजिटल न्यूज़ पब्लिशर्स एसोसिएशन (DNPA) द्वारा डिजिटल व्यक्तिगत डेटा संरक्षण अधिनियम, 2023 और उसके नियमों को दी गई चुनौती ने इस चिंता की ओर ध्यान खींचा है कि सूचना-गोपनीयता की रक्षा करने वाला क़ानून मीडिया पर गंभीर ‘भय का असर’ डालने का जोखिम रखता है।"},{"en":"The absence of a specific {{exemption|छूट}} for journalistic activity could subject reporters investigating official misconduct or corruption to the obligations of a “data {{fiduciary|न्यासी}}”, requiring them to notify and seek consent from the very individuals they are investigating.","hi":"पत्रकारिता की गतिविधि के लिए किसी ख़ास छूट के न होने से सरकारी कदाचार या भ्रष्टाचार की जाँच करने वाले रिपोर्टरों पर “डेटा न्यासी” की ज़िम्मेदारियाँ आ सकती हैं, यानी उन्हें उन्हीं लोगों को सूचित करना और उनकी सहमति लेनी होगी जिनकी वे जाँच कर रहे हैं।"},{"en":"Such {{onerous|बोझिल}} requirements could affect investigations undertaken in the public interest. The implications extend to routine newsgathering too, where personal information is {{integral|अभिन्न}} to reporting.","hi":"ऐसी बोझिल शर्तें जनहित में की जा रही जाँचों को प्रभावित कर सकती हैं। इसके असर रोज़मर्रा की ख़बर जुटाने तक भी जाते हैं, जहाँ निजी जानकारी रिपोर्टिंग का अभिन्न हिस्सा होती है।"},{"en":"The omission is particularly {{consequential|गंभीर नतीजों वाला}} because the drafts in 2018, 2019 and 2021 carried a journalistic exemption. The Act already provides exemptions for certain forms of data processing, including for research and statistical purposes, making the denial of similar protection to journalists difficult to justify.","hi":"यह चूक ख़ास तौर पर गंभीर है क्योंकि 2018, 2019 और 2021 के मसौदों में पत्रकारिता के लिए छूट थी। अधिनियम पहले ही शोध और सांख्यिकीय उद्देश्यों समेत डेटा प्रोसेसिंग के कुछ रूपों को छूट देता है, इसलिए पत्रकारों को वैसी ही सुरक्षा न देना सही ठहराना कठिन है।"},{"en":"Non-compliance can attract {{penalties|जुर्माने}} of up to ₹250 crore, posing an {{existential|अस्तित्व पर संकट वाला}} threat to smaller and independent newsrooms.","hi":"नियम न मानने पर
