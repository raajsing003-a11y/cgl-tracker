<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{--bg:#08070a;--cd:#161b22;--bd:#333038;--tx:#c6c3cb;--mu:#aaa5ad;--ac:#fbbf24;--gr:#4ade80;--rd:#f87171;--bt:#1a181d;--gl:#fbbf2414;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',Helvetica,Arial,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 12px 64px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,var(--gl),transparent)}
.hd b{display:block;font-size:21px;letter-spacing:.4px}.hd small{color:var(--ac);font-weight:700;font-size:11px;letter-spacing:1.6px}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);display:grid;place-items:center;font-size:18px}
.main{max-width:860px;margin:0 auto;padding:18px 16px 130px}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px 8px;text-align:center}
.st b{display:block;font-size:26px;color:var(--ac);line-height:1.2}.st span{color:var(--mu);font-size:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px}
.seg{display:flex;gap:6px;background:var(--bt);padding:5px;border-radius:14px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;color:var(--mu)}
.seg .on{background:var(--ac);color:#111}
textarea,input[type=text],select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;outline:0}
textarea:focus,input:focus,select:focus{border-color:var(--ac)}
textarea{min-height:140px;resize:vertical}
.btn{border:1px solid var(--bd);background:var(--cd);border-radius:14px;padding:11px 16px;font-weight:600}
.y{background:var(--ac);color:#111;border:0;font-weight:800;box-shadow:0 6px 18px #fbbf2430}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.m{font-size:13px;color:var(--mu)}
img.th{height:72px;border-radius:10px;border:1px solid var(--bd)}
img.q{max-width:100%;border-radius:12px;margin:8px 0;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-bottom:4px}
.oc{display:inline-block;background:var(--gl);border:1px solid var(--ac);color:var(--ac);border-radius:22px;padding:2px 11px;font-weight:800;font-size:13px}
.ob{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{flex:none;border:1px solid var(--bd);background:var(--cd);border-radius:22px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--mu)}
.chip.on{border-color:var(--ac);color:var(--ac);background:var(--gl)}
.tp{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;font-weight:700;color:var(--ac)}
.tp em{font-style:normal;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:2px 10px}
.qi{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;overflow-x:auto}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.qn{background:var(--gl);color:var(--ac);border:1px solid #fbbf2455;border-radius:20px;padding:2px 12px;font-weight:800;font-size:13px}
.ans{color:var(--gr);font-size:12px;font-weight:700}
.qt{font-size:17px;font-weight:600;line-height:1.65}
.op{display:flex;gap:12px;align-items:center;padding:11px 14px;margin-top:8px;border:1px solid var(--bd);background:var(--bg);border-radius:14px}
.op .l{width:28px;height:28px;border-radius:50%;border:1px solid var(--mu);display:grid;place-items:center;font-size:13px;flex:none}
.op.c{border-color:var(--gr);background:#34d3991f}.op.c .l{background:var(--gr);color:#07130e;border-color:var(--gr)}
details{margin-top:12px;border-top:1px dashed var(--bd);padding-top:8px}
summary{color:var(--ac);font-weight:700;font-size:14px;cursor:pointer}
.ft{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.ft select{width:auto;max-width:62%;padding:7px 10px;font-size:13px;border-radius:12px}
.x{background:none;border:0;color:var(--rd);font-weight:600;font-size:13px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--bd);padding:10px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{background:none;border:0;font-size:12px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav i{font-style:normal;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:#8884}
.nav .on{color:var(--ac)}.nav .on i{background:linear-gradient(135deg,#fbbf24,#d97706);color:#111;width:54px;height:54px;border-radius:50%;margin-top:-26px;box-shadow:0 8px 22px #fbbf2440}
.main{font-size:calc(16px*var(--sc,1))}
.qt{font-size:1.08em}.op{font-size:.96em}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ctl .btn{padding:8px 13px;font-size:14px}.ctl .on{border-color:var(--ac);color:var(--ac);background:var(--gl)}
.star{background:none;border:0;font-size:20px;margin-left:auto;padding:0 4px}
.op.w{border-color:var(--rd);background:#f871711f}.op.w .l{background:var(--rd);color:#1a0707;border-color:var(--rd)}
.op.t{cursor:pointer}.op.t:active{border-color:var(--ac)}
.ed input,.ed textarea,.ed select{margin-top:8px}.ed textarea{min-height:80px}
.ed button{margin-right:6px}
.qi details>div{font-size:calc(1em*var(--se,1))}
.mo{padding:12px 16px}.mo summary{margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--cd);color:var(--tx);border:1px solid var(--ac);border-radius:14px;padding:10px 16px;display:flex;gap:14px;align-items:center;z-index:50;box-shadow:0 8px 24px #0006;max-width:92vw}
#toast button{background:none;border:0;color:var(--ac);font-weight:800}
#lb{position:fixed;inset:0;background:#000d;z-index:60;display:grid;place-items:center;padding:12px;overflow:auto}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
#up{position:fixed;right:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);z-index:6;font-size:18px}
#toast[hidden],#lb[hidden],#up[hidden]{display:none}
body.cp .qi{padding:10px;margin-bottom:8px}body.cp .op{padding:6px 10px;margin-top:5px}body.cp .qt{line-height:1.45}
.more{display:block;width:100%;margin:6px 0 14px;text-align:center}
#mk{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:calc(16px*var(--sc,1))}
#mk[hidden]{display:none}
.mkw{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.mkt{padding-left:52px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:1.2em}
.mkb{padding-left:52px !important;position:sticky;top:0;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd);margin-bottom:12px}
.mkclk{font-weight:800;font-size:1.1em;color:var(--ac);font-variant-numeric:tabular-nums}.mkclk.low{color:var(--rd)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-bottom:10px}
.pal button{height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--bt);font-weight:700}
.pal .a{background:var(--gr);color:#07130e;border-color:var(--gr)}.pal .v{background:var(--rd);color:#1a0707;border-color:var(--rd)}.pal .mr{box-shadow:inset 0 0 0 3px #a78bfa}.pal .cu{outline:2px solid var(--ac);outline-offset:2px}
.sec{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.op.s{border-color:var(--ac);background:var(--gl)}.op.s .l{background:var(--ac);color:#111;border-color:var(--ac)}
.bar{height:8px;border-radius:6px;background:var(--bt);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--gr)}
.big{font-size:2.4em;font-weight:800;color:var(--ac);line-height:1.1}
.mkw input[type=number]{width:90px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.mkw select{width:auto}
.ctl input[type=range]{width:110px;accent-color:var(--ac)}
.ctl label.m{display:flex;align-items:center;gap:6px}
.ctl [hidden]{display:none}
@media print{.nav,.hd,.card,.chips,.ft,#up,#toast,.ctl{display:none}.qi{break-inside:avoid}}

/* ===== MQX: sync strip, export preview (A4), print ===== */
#pv{position:fixed;inset:0;z-index:70;background:#3a3a40;overflow:auto;-webkit-overflow-scrolling:touch}
#pv[hidden]{display:none}
.pvb{position:sticky;top:0;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--cd);border-bottom:1px solid var(--bd)}
.pvb .btn{padding:8px 12px;font-size:14px}
.pvh{padding:6px 12px;text-align:center}
.pgs{padding:12px 0 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pg{background:#fff;color:#111;width:210mm;height:296.6mm;position:relative;overflow:hidden;flex:none;box-shadow:0 4px 22px #0009;font:700 12pt/1.5 'Noto Sans Devanagari','Nirmala UI',Inter,'Segoe UI',Arial,sans-serif;box-sizing:border-box}
.pg *{font-weight:700;box-sizing:border-box}
.pgb{position:absolute;left:12mm;right:12mm;top:11mm;bottom:15mm;overflow:hidden}
.pgf{position:absolute;left:12mm;right:12mm;bottom:6mm;display:flex;justify-content:space-between;font-size:9pt;color:#666;border-top:1px solid #ccc;padding-top:2mm}
.pgm{position:absolute!important;left:-99999px;top:0;visibility:hidden;height:auto!important;box-shadow:none}
.pgm .pgb{position:static;height:auto;overflow:visible}
.pg .dt{border-bottom:2.5px solid #1f3864;margin-bottom:10px;padding-bottom:6px}
.pg .dtt{font-size:17pt;color:#1f3864;line-height:1.3}.pg .m2{font-size:10pt;color:#666}
.pg .hs{background:#1f3864;color:#fff;padding:5px 12px;border-radius:6px;font-size:14pt;margin:4px 0 8px}
.pg .ht{color:#1f3864;border-bottom:1.5px solid #9db2d8;font-size:13pt;padding:2px 0;margin:6px 0 8px}
.pg .qb{margin:0 0 10px;padding:0 0 8px;border-bottom:1px dashed #bbb;break-inside:avoid}
.pg .qh2{display:flex;gap:10px;align-items:baseline}.pg .qno{color:#b45309;font-size:13pt}.pg .tpc{font-size:9pt;color:#888}
.pg .qtx{margin:2px 0 4px;word-break:break-word}
.pg img.qi2{max-width:100%;max-height:110mm;display:block;margin:4px 0}
.pg .opg{display:grid;grid-template-columns:1fr 1fr;gap:1px 16px;margin:2px 0 0 4px}.pg .opg.one{grid-template-columns:1fr}
.pg .op2{display:flex;gap:6px;align-items:baseline}.pg .ol{color:#1f3864;flex:none}
.pg .an{margin-top:5px;padding:3px 9px;background:#e8f5e9;color:#166534;border-radius:5px}
.pg .ex{margin-top:4px;padding:4px 9px;background:#fff7e6;border-radius:5px}.pg .exl{color:#92400e}
.pg .keyg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px 8px}.pg .keyg span{font-size:11pt}
.pg mjx-container{font-size:100%!important}.pg mjx-container svg{vertical-align:middle}
@media print{
 body.pvopen>*:not(#pv){display:none!important}
 body.pvopen{background:#fff!important;padding:0!important;overflow:visible!important;height:auto!important}
 body.pvopen #pv{position:static!important;background:#fff;overflow:visible;display:block}
 body.pvopen .pvb,body.pvopen .pvh,body.pvopen .pgm{display:none!important}
 body.pvopen .pgs{display:block;padding:0;gap:0;zoom:1!important}
 body.pvopen .pg{box-shadow:none;margin:0;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div class="hd"><div><small>EXAM TRACKER</small><b>📚 Mock Question Bank</b></div><div style="display:flex;gap:8px"><button class="ic" id="mkb" aria-label="Auto Mock">📝</button><button class="ic" id="th" aria-label="Theme" style="display:none">🌓</button></div></div>
<div class="main">
<div class="gd" id="st"></div>
<div class="ctl"><button class="btn" id="fm">A−</button><span class="m" id="fv">100%</span><button class="btn" id="fp">A+</button><button class="btn" id="tg_ex">💡 Explanation</button><button class="btn" id="tg_pr">🎯 Practice</button><button class="btn" id="mkb2">📝 Auto Mock</button><span class="m" id="tm"></span><span class="m" id="ps"></span></div>
<details class="card mo"><summary>⚙ Display &amp; Tools</summary><div class="ctl" style="margin:12px 0 0"><button class="btn" id="fr">↺ Size reset</button><label class="m">Text <input type="range" id="fs" min="70" max="200" step="5"></label><label class="m">Explanation <input type="range" id="es" min="70" max="200" step="5"></label><button class="btn" id="tg_cp">📏 Compact</button><button class="btn" id="tg_sh">🔀 Shuffle</button><button class="btn" id="pr_rs" hidden>🔄 Practice reset</button><button class="btn" id="st_rs">🧹 Stats reset</button></div><div class="m" style="margin-top:10px">Shortcuts: <b>E</b> = explanation on/off · Practice mein <b>1-4</b> ya <b>A-D</b> = option chuno</div></details>

<div class="card">
  <div class="seg"><button class="on" data-p="t">✍ Text paste</button><button data-p="i">🖼 Image</button></div>
  <div id="p_t">
    <textarea id="bk" placeholder="1 ya jitne chaho questions paste karo — options, answer, trick, LaTeX, chapter sab auto..."></textarea>
    <div class="row"><button class="btn y" id="bkgo">⚡ Add</button><label class="btn" for="bkf">📄 .txt</label><input type="file" id="bkf" accept=".txt,.md" hidden></div>
    <div class="m" id="bkm" style="margin-top:8px"></div>
  </div>
  <div id="p_i" hidden>
    <div class="row" style="margin-top:0"><label class="btn" for="qf">📷 Image chuno</label><input type="file" id="qf" accept="image/*" multiple hidden><select id="tp" style="flex:1"></select></div>
    <div class="m" style="margin-top:8px">Paste (Ctrl+V) bhi chalega, ek saath kai images.</div>
    <div class="row" id="ip"></div>
    <div class="row"><button class="btn y" id="imgsave">💾 Save images</button><button class="btn" id="imgclr">Clear</button></div>
    <div class="m" id="msg" style="margin-top:8px"></div>
  </div>
</div>

<button class="btn" id="othb" style="width:100%;margin-bottom:12px">👥 Dusron ke ⭐ Questions (jyada save wale pehle)</button>
<input type="text" id="sr" placeholder="🔍 Search questions..." style="margin-bottom:12px">
<div class="chips" id="chips"></div>
<div id="list"></div>
<div id="oth" hidden></div>

<details class="card" id="fxc"><summary>🧠 Purane questions ka chapter sahi karo (Gemini/Google se)</summary>
  <div class="m" id="fx_i" style="margin:10px 0"></div>
  <div class="row" style="margin-top:0"><select id="fx_sc" style="flex:1"><option value="all">Is subject ke saare questions</option><option value="other">Sirf "Other" wale</option></select><select id="fx_b" style="flex:1"></select></div>
  <div class="row"><button class="btn y" id="fx_cp">📋 Prompt banao + copy</button></div>
  <textarea id="fx_p" readonly placeholder="Prompt yahan aayega — Gemini/Google me paste karo (copy na ho to yahin se select karke copy karo)" style="height:90px;margin-top:8px"></textarea>
  <textarea id="fx_r" placeholder="Gemini ka jawab yahan paste karo (1|Percentage jaisi lines)" style="height:90px;margin-top:8px"></textarea>
  <div class="row"><button class="btn y" id="fx_ap">✅ Chapter lagao</button><button class="btn" id="fx_un">↩ Pichla chapter wapas</button></div>
  <div class="m" id="fx_m" style="margin-top:8px"></div>
</details>
<div class="card" style="margin-top:22px">
  <b>🧰 Backup & tools</b>
  <div class="row">
    <button class="btn" id="exp">⬇ Export JSON</button>
    <label class="btn" for="imp">⬆ Import</label><input type="file" id="imp" accept=".json" hidden>
    <button class="btn" onclick="window.print()">🖨 Print</button>
    <button class="btn" id="exptxt">📝 Export TXT (current list)</button>
    <button class="btn" id="dupf">🧬 Repeat questions hatao</button>
    <button class="btn" id="clr" hidden>x</button><button class="btn" id="trb">♻ Deleted questions (0)</button>
  </div>
  <div class="m" id="sz" style="margin-top:10px"></div><div id="trl" style="margin-top:10px"></div>
</div>
</div>
<div class="nav" id="tabs"></div>
<div id="mk" hidden></div><div id="toast" hidden></div><div id="lb" hidden onclick="this.hidden=true"><img alt=""></div><button id="up" hidden aria-label="Top">↑</button>

<script>
const T={
Math:{
"Number System":"divisible remainder शेषफल अभाज्य prime unit digit इकाई अंक factor गुणनखंड natural पूर्णांक",
"HCF & LCM":"hcf lcm ल.स. म.स. महत्तम लघुत्तम",
"Simplification & BODMAS":"simplify सरल करें bodmas सरलीकरण fraction भिन्न decimal दशमलव",
"Square & Cube Root":"square root cube root वर्गमूल घनमूल perfect square",
"Surds & Indices":"surd indices करणी घातांक power index",
"Percentage":"percent प्रतिशत % increase decrease population जनसंख्या",
"Ratio & Proportion":"ratio अनुपात proportion समानुपात variation",
"Partnership":"partnership साझेदारी invest निवेश",
"Average":"average औसत mean",
"Ages":"age ages आयु उम्र years ago साल पहले",
"Mixture & Alligation":"mixture alligation मिश्रण milk दूध solution",
"Profit & Loss":"profit loss लाभ हानि cost price सोना क्रय विक्रय मूल्य cp sp",
"Discount":"discount छूट बट्टा marked price अंकित मूल्य",
"Simple Interest":"simple interest साधारण ब्याज सरल ब्याज",
"Compound Interest":"compound interest चक्रवृद्धि",
"Time & Work":"work मजदूर काम दिन में पूरा efficiency दक्षता men women",
"Pipes & Cisterns":"pipe cistern पाइप टंकी tank inlet outlet",
"Time, Speed & Distance":"speed गति distance दूरी km/h किमी/घंटा relative speed सापेक्ष",
"Trains":"train ट्रेन platform प्लेटफार्म पुल bridge",
"Boats & Streams":"boat stream नाव धारा upstream downstream",
"Algebra":"equation समीकरण algebra बीजगणित expression identity सर्वसमिका value of x+ x+y",
"Quadratic & Polynomials":"quadratic द्विघात polynomial बहुपद roots मूल zero शून्यक",
"Coordinate Geometry":"coordinate निर्देशांक slope ढाल मूलबिंदु लंबवत समांतर झुकाव रेखा का समीकरण x-axis y-axis",
"Triangle (त्रिभुज)":"triangle त्रिभुज centroid केन्द्रक incentre अंतःकेंद्र circumcentre परिकेंद्र orthocentre लंबकेन्द्र समकोण समबाहु isosceles",
"Circle (वृत्त)":"वृत्त circle tangent स्पर्श chord जीवा चाप arc त्रिज्या radius परिधि",
"Quadrilateral & Polygon":"quadrilateral चतुर्भुज polygon बहुभुज parallelogram समांतर चतुर्भुज rhombus समचतुर्भुज trapezium rectangle",
"Lines & Angles":"parallel lines angle कोण transversal सम्पूरक पूरक complementary supplementary",
"Mensuration 2D":"area क्षेत्रफल perimeter परिमाप circumference path रास्ता",
"Mensuration 3D":"volume आयतन surface area पृष्ठीय cylinder बेलन cone शंकु sphere गोला cube घन cuboid hemisphere",
"Trigonometry":"sin cos tan sec cosec cot trigonometry त्रिकोणमिति identity",

/* ---- Repeat questions dhundo (milte-julte question + options) -> Trash me, wapas laa sakte ho ---- */
function mqNorm(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9\u0900-\u097f]+/g, ' ').trim(); }
function mqSet(s){ var o = {}; mqNorm(s).split(' ').forEach(function(w){ if(w) o[w] = 1; }); return o; }
function mqJacArr(a, b){ var A = {}, B = {}, n = 0, u = 0, k; a.forEach(function(x){ A[x] = 1; }); b.forEach(function(x){ B[x] = 1; });
  for(k in A){ u++; if(B[k]) n++; } for(k in B){ if(!A[k]) u++; } return u ? n / u : 0; }
function mqSame(q, x){
  if(!q || !x) return false;
  var tq = mqNorm(q.t), tx = mqNorm(x.t); if(!tq || !tx) return false;
  var oq = (q.o || []).map(mqNorm).filter(Boolean), ox = (x.o || []).map(mqNorm).filter(Boolean), both = oq.length && ox.length;
  if(tq === tx) return both ? mqJacArr(oq, ox) >= 0.5 : true;
  var A = mqSet(q.t), B = mqSet(x.t), ka = Object.keys(A), kb = Object.keys(B), n = 0;
  if(Math.min(ka.length, kb.length) < 5) return false;
  ka.forEach(function(k){ if(B[k]) n++; });
  var ov = n / Math.min(ka.length, kb.length);
  if(ov < 0.9) return false;
  return both ? mqJacArr(oq, ox) >= 0.5 : ov >= 0.97;
}


(function(){
  const bt=document.getElementById("dupf"); if(!bt) return;
  bt.onclick=()=>{
    const keep=[],drop=[];
    const score=q=>(q.e?q.e.length:0)+(q.a?50:0)+(q.img?20:0)+(q.f?200:0);
    D.forEach(q=>{ if(!q||!q.t){keep.push(q);return}
      let j=-1; for(let i=0;i<keep.length;i++){ const k=keep[i]; if(k&&k.t&&k.s==q.s&&mqSame(q,k)){j=i;break} }
      if(j<0){keep.push(q);return}
      if(score(q)>score(keep[j])){ drop.push(keep[j]); keep[j]=q } else drop.push(q);
    });
    if(!drop.length){toast("Koi repeat question nahi mila");return}
    if(!confirm(drop.length+" repeat question Trash me bhejo? (har question ka sabse detailed version bacha rahega, ♻ se wapas aa sakte hain)"))return;
    const now=Date.now(); drop.forEach(q=>{q.dt=now;TR.push(q)}); D=keep;
    persist(); try{renderTabs();render();trUI()}catch(e){}
    toast(drop.length+" repeat Trash me gaye");
  };
})();

function parentFb(){try{const p=window.parent;if(p&&p!==window&&p.__fbReadyPromise&&p.__fbGet&&p.__fbSet&&p.__fbListenReady&&p.__fbUpdate)return p}catch(e){}return null}
async function ownFb(){
  const B="https://www.gstatic.com/firebasejs/12.15.0/";
  const [A,Au,Db]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-database.js")]);
  const app=A.initializeApp(CFG,"mqx"),auth=Au.getAuth(app),db=Db.getDatabase(app);
  await new Promise((res,rej)=>{Au.onAuthStateChanged(auth,u=>{if(u)res(u)});Au.signInAnonymously(auth).catch(rej)});
  return{get:async p=>{const s=await Db.get(Db.ref(db,p));return s.exists()?s.val():null},
    set:async(p,v)=>{await Db.set(Db.ref(db,p),v);return true},
    upd:async u=>{await Db.update(Db.ref(db),u);return true},
    listen:async(p,cb)=>Db.onValue(Db.ref(db,p),s=>cb(s.exists()?s.val():null),()=>{})}}
async function getFb(){
  for(let i=0;i<40;i++){const p=parentFb();
    if(p){await p.__fbReadyPromise;return{get:p.__fbGet,set:p.__fbSet,upd:p.__fbUpdate,listen:p.__fbListenReady}}
    if(window.parent===window)break;await sleep(250)}
  return await ownFb()}

const nrm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9ऀ-ॿ]+/g," ").trim();
function ck(x){const t=nrm(x.t),im=x.img||"";
  return (x.s||"")+"|"+(t.length>=12?"t"+hs(t):im?"i"+hs(im.length+im.slice(100,1100)+im.slice(-600)):"o"+hs(t+nrm((x.o||[]).join(" "))))}
function ckc(c){return (c.s||"")+"|"+(nrm(c.t).length>=12?"t"+hs(nrm(c.t)):"o"+hs(nrm(c.t)+nrm((c.o||[]).join(" "))))}
function pack(x){return JSON.stringify({id:x.id,s:x.s,tp:x.tp,t:x.t||"",o:x.o||["","","",""],a:x.a||"",e:x.e||"",by:x.by||"",mt:x.mt||0,hi:x.img?1:0})}

async function pushChunks(upd,sizeCap){
  const keys=Object.keys(upd);let cur={},sz=0;
  const flush=async()=>{if(Object.keys(cur).length){await FBR.upd(cur);cur={};sz=0}};
  for(const k of keys){const v=upd[k],l=typeof v==="string"?v.length:20;if(sz+l>sizeCap&&sz){await flush()}cur[k]=v;sz+=l}
  await flush()}

async function reconcile(){
  if(!FBR||!QM||!DM)return;
  if(busy){again=true;return}
  busy=true;
  try{
    let changed=false;const now=Date.now(),upd={};
    const dm=DM;
    /* (a) tombstone vs mere D (live) */
    for(const x of D.slice()){const id=String(x.id);if(dm[id]==null)continue;
      if(TSS.has(id)||(x.mt||0)>dm[id]){ /* maine khud restore kiya */
        upd[BASE+"/del/"+id]=null;TSS.delete(id);x.mt=Math.max(x.mt||0,now);delete dm[id]}
      else{ /* kisi aur ne delete kiya => mere Trash me */
        D.splice(D.indexOf(x),1);x.dt=dm[id];x.rd=1;TR.push(x);changed=true}}
    /* (b) mera Trash: tombstone likho, ya dusre ne restore kiya ho to wapas lao */
    for(const x of TR.slice()){const id=String(x.id);if(!x.dt)x.dt=now;
      if(dm[id]!=null)continue;
      const c=QM[id];
      if(x.rd){if(c){TR.splice(TR.indexOf(x),1);delete x.dt;delete x.rd;applyCloud(x,c);D.unshift(x);changed=true}}
      else if(c&&((TSS.has(id)&&!(TSW[id]>now-15000))||(c.mt||0)>x.dt)){TSS.delete(id);TR.splice(TR.indexOf(x),1);delete x.dt;applyCloud(x,c);D.unshift(x);changed=true}
      else{upd[BASE+"/del/"+id]=x.dt;TSS.add(id);TSW[id]=now;dm[id]=x.dt}}
    /* (c) cloud ke naye questions mere paas laao */
    const have=new Set(D.map(x=>String(x.id)).concat(TR.map(x=>String(x.id))));
    const cks=new Map();D.forEach(x=>{if(!QM[String(x.id)]&&!x.pend)cks.set(ck(x),x)});
    const fresh=[];
    Object.keys(QM).forEach(id=>{if(have.has(id))return;const c=QM[id];
      if(dm[id]!=null){const l=toLocal(c);l.dt=dm[id];l.rd=1;TR.push(l);changed=true;return}
      const l=nrm(c.t).length>=12?cks.get(ckc(c)):null;
      if(l){l.id=c.id;l.mt=c.mt||l.mt;if(!l.by)l.by=c.by;cks.delete(ckc(c));changed=true;return}  /* same question pehle se hai => id jodo */
      fresh.push(toLocal(c))});
    if(fresh.length){fresh.sort((a,b)=>b.id-a.id);D.unshift.apply(D,fresh);changed=true}
    /* (d) update / upload */
    const up=[];
    D.forEach(x=>{if(!x||x.pend)return;const id=String(x.id),c=QM[id];
      if(!c){if(!x.mt)x.mt=now;if(!x.by)x.by=me();up.push(x)}
      else{const lm=x.mt||0,cm=c.mt||0;
        if(cm>lm){applyCloud(x,c);changed=true}
        else if(lm>cm){if(!x.by)x.by=c.by||me();up.push(x)}}});
    up.forEach(x=>{const id=String(x.id);upd[BASE+"/q/"+id]=pack(x);if(x.img&&!(QM[id]&&QM[id].hi))upd[BASE+"/im/"+id]=x.img});
    if(changed){persist();saveTSS();refreshUI()}
    if(Object.keys(upd).length){
      ST.msg="⏳ Cloud me save ho raha hai…";status();
      try{await pushChunks(upd,900000);
        up.forEach(x=>{QM[String(x.id)]=JSON.parse(pack(x))});saveTSS();ST.err="";
        ST.msg="☁ Synced ✓";ST.at=Date.now();ST.ok=true}
      catch(e){ST.err="Cloud save nahi hua ("+((e&&e.message)||e)+") — questions is device me safe hain, baad me auto retry hoga";setTimeout(()=>schedule(0),20000)}
    }else{ST.err="";ST.msg="☁ Synced ✓";ST.at=Date.now();ST.ok=true}
    status();
    fetchImgs();
  }catch(e){ST.err="Sync error: "+((e&&e.message)||e)}
  finally{busy=false;if(again){again=false;schedule(300)}}
}

async function fetchImgs(){
  if(imgBusy||!FBR||!QM)return;imgBusy=true;
  try{
    const need=D.filter(x=>!x.img&&QM[String(x.id)]&&QM[String(x.id)].hi&&!(fetchImgs.fail&&fetchImgs.fail[x.id]>Date.now()));
    let n=0;fetchImgs.fail=fetchImgs.fail||{};
    for(let i=0;i<need.length;i+=3){
      await Promise.all(need.slice(i,i+3).map(async x=>{try{const v=await FBR.get(BASE+"/im/"+x.id);if(typeof v==="string"&&v){x.img=v;n++}else fetchImgs.fail[x.id]=Date.now()+60000}catch(e){fetchImgs.fail[x.id]=Date.now()+60000}}));
      if(n&&(i/3)%5==4){persist();refreshUI()}}
    if(n){persist();refreshUI()}
  }finally{imgBusy=false}}

    FBR=await getFb();

    await FBR.listen(BASE+"/del",v=>{DM={};if(v)Object.keys(v).forEach(k=>{DM[k]=Number(v[k])||1});schedule(400)});
  }catch(e){ST.err="Cloud se connect nahi ho paya — questions device me safe hain";status()}
}

const SYM={alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",varepsilon:"ε",zeta:"ζ",eta:"η",theta:"θ",vartheta:"ϑ",iota:"ι",kappa:"κ",lambda:"λ",mu:"μ",nu:"ν",xi:"ξ",pi:"π",rho:"ρ",sigma:"σ",tau:"τ",upsilon:"υ",phi:"φ",varphi:"φ",chi:"χ",psi:"ψ",omega:"ω",Gamma:"Γ",Delta:"Δ",Theta:"Θ",Lambda:"Λ",Xi:"Ξ",Pi:"Π",Sigma:"Σ",Phi:"Φ",Psi:"Ψ",Omega:"Ω",
  times:"×",div:"÷",cdot:"⋅",pm:"±",mp:"∓",le:"≤",leq:"≤",ge:"≥",geq:"≥",ne:"≠",neq:"≠",approx:"≈",equiv:"≡",sim:"∼",infty:"∞",circ:"°",degree:"°",rightarrow:"→",to:"→",Rightarrow:"⇒",leftarrow:"←",leftrightarrow:"↔",Leftrightarrow:"⇔",therefore:"∴",because:"∵",angle:"∠",triangle:"△",perp:"⊥",parallel:"∥",propto:"∝",ldots:"…",cdots:"⋯",dots:"…",in:"∈",notin:"∉",subset:"⊂",cup:"∪",cap:"∩",emptyset:"∅",forall:"∀",exists:"∃",neg:"¬",land:"∧",lor:"∨",prime:"′",star:"⋆",bullet:"•",ast:"∗",lt:"<",gt:">",lbrace:"{",rbrace:"}",langle:"⟨",rangle:"⟩",

const FNS=["sin","cos","tan","cot","sec","csc","cosec","log","ln","lim","max","min","exp","sinh","cosh","tanh","arcsin","arccos","arctan","gcd","lcm","det","mod"];
const TXT=["text","mathrm","mathbf","textbf","mathit","operatorname","mbox","textit","rm","bf"];
function texToMath(tex){
  const d=docx,s=String(tex||"").trim();let i=0,bad=false;
  const ws=()=>{while(i<s.length&&/\s/.test(s[i]))i++};
  const run=t=>new d.MathRun(t);
  function arg(){ws();if(s[i]=="{"){i++;const r=seq("}");i++;return r}
    if(s[i]=="\\"){const a=atom();return a||[]}
    if(i<s.length){return [run(s[i++])]}return []}
  function rawGroup(){ws();if(s[i]!="{"){return s[i++]||""}let dp=0,o="";i++;while(i<s.length){const c=s[i];if(c=="{")dp++;else if(c=="}"){if(!dp)break;dp--}o+=c;i++}i++;return o}
  function atom(){ws();if(i>=s.length)return null;const c=s[i];
    if(c=="{"){i++;const r=seq("}");i++;return r}
    if(c=="\\"){i++;let nm="";
      if(/[A-Za-z]/.test(s[i])){while(i<s.length&&/[A-Za-z]/.test(s[i]))nm+=s[i++]}else{nm=s[i++]||""}
      if(nm=="frac"||nm=="dfrac"||nm=="tfrac"){const a=arg(),b=arg();return [new d.MathFraction({numerator:a,denominator:b})]}
      if(nm=="sqrt"){ws();let deg=null;if(s[i]=="["){i++;let o="";while(i<s.length&&s[i]!="]")o+=s[i++];i++;deg=[run(o)]}const a=arg();return [new d.MathRadical(deg?{children:a,degree:deg}:{children:a})]}
      if(nm=="left"||nm=="right"){ws();let ch=s[i++]||"";if(ch=="\\"){let n2="";if(/[A-Za-z]/.test(s[i])){while(i<s.length&&/[A-Za-z]/.test(s[i]))n2+=s[i++]}else n2=s[i++]||"";ch=SYM[n2]||(n2=="|"?"‖":n2)}
        return ch=="."?[]:[run(ch)]}
      if(nm=="\\"||nm=="newline"){return [run(" ")]}
      if(TXT.indexOf(nm)>=0){return [run(rawGroup())]}
      if(nm=="pmod"){return [run(" (mod "+rawGroup()+")")]}
      if(nm=="displaystyle"||nm=="textstyle"||nm=="limits"||nm=="nolimits"||nm=="big"||nm=="Big"||nm=="bigg"||nm=="Bigg"){return []}
      if(FNS.indexOf(nm)>=0)return [run(nm=="cosec"?"cosec":nm)];
      if(SYM.hasOwnProperty(nm)){const r=run(SYM[nm]);if(nm=="circ"||nm=="degree")r.__deg=1;return [r]}
      bad=true;return [run("\\"+nm)]}
    if(c=="^"||c=="_"){bad=true;i++;return []}
    if(/[0-9]/.test(c)){let o="";while(i<s.length&&/[0-9.]/.test(s[i]))o+=s[i++];return [run(o)]}
    i++;return [run(c)]}
  function seq(stop){const out=[];
    while(i<s.length){ws();if(i>=s.length||s[i]==stop)break;
      let a=atom();if(a===null)break;
      /* scripts */
      for(;;){ws();const c=s[i];if(c!="^"&&c!="_")break;
        let sup=null,sub=null;
        while(s[i]=="^"||s[i]=="_"){const t=s[i++];const v=arg();if(t=="^")sup=v;else sub=v;ws()}

        else a=[sup&&sub?new d.MathSubSuperScript({children:a,subScript:sub,superScript:sup}):sup?new d.MathSuperScript({children:a,superScript:sup}):new d.MathSubScript({children:a,subScript:sub})]}
      out.push.apply(out,a)}
    return out}
  const ch=seq("");if(bad||!ch.length)return null;
  try{return new d.Math({children:ch})}catch(e){return null}}

async function texImg(tex){

    const c=MathJax.tex2svg(tex,{display:false});const host=document.createElement("div");host.style.cssText="position:absolute;left:-9999px;top:0;font-size:16px";host.appendChild(c);document.body.appendChild(host);
    const sv=c.querySelector("svg"),r=sv.getBoundingClientRect(),w=Math.ceil(r.width),h=Math.ceil(r.height);
    sv.setAttribute("width",w);sv.setAttribute("height",h);sv.style.color="#000";sv.setAttribute("xmlns","http://www.w3.org/2000/svg");

  catch(e){return [new docx.TextRun({text:tex,bold:true,size:24})]}}
const dataU8=du=>{const b=atob(du.split(",")[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};

async function buildDocx(items,mode){

    if((x.tp||"Other")!==pt){kids.push(P([tr(x.tp||"Other",{size:26,sizeComplexScript:26,color:"1F3864"})],{keepNext:true,spacing:{before:160,after:80,line:336},border:{bottom:{style:d.BorderStyle.SINGLE,size:4,color:"9DB2D8",space:2}}}));pt=x.tp||"Other"}
    n++;

    const k=x.a?"ABCD".indexOf(x.a):-1;
    if((mode=="inl"||mode=="ans")&&k>=0)kids.push(P([tr("✔ Answer: ("+x.a+") ",{color:"166534"})].concat(x.o[k]?await rich(x.o[k]):[]),{indent:{left:360},keepNext:mode=="inl"&&!!x.e,shading:{type:d.ShadingType.CLEAR,fill:"E8F5E9",color:"auto"},spacing:{before:40,after:40,line:336}}));
