<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{--bg:#08070a;--cd:#161b22;--bd:#333038;--tx:#c6c3cb;--mu:#aaa5ad;--ac:#fbbf24;--gr:#4ade80;--rd:#f87171;--bt:#1a181d;--gl:#fbbf2414;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',Helvetica,Arial,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 12px 64px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,var(--gl),transparent)}
.hd b{display:block;font-size:21px;letter-spacing:.4px}.hd small{color:var(--ac);font-weight:700;font-size:11px;letter-spacing:1.6px}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);display:grid;place-items:center;font-size:18px}
.main{max-width:860px;margin:0 auto;padding:18px 16px 130px}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px 8px;text-align:center}
.st b{display:block;font-size:26px;color:var(--ac);line-height:1.2}.st span{color:var(--mu);font-size:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px}
.seg{display:flex;gap:6px;background:var(--bt);padding:5px;border-radius:14px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;color:var(--mu)}
.seg .on{background:var(--ac);color:#111}
textarea,input[type=text],select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;outline:0}
textarea:focus,input:focus,select:focus{border-color:var(--ac)}
textarea{min-height:140px;resize:vertical}
.btn{border:1px solid var(--bd);background:var(--cd);border-radius:14px;padding:11px 16px;font-weight:600}
.y{background:var(--ac);color:#111;border:0;font-weight:800;box-shadow:0 6px 18px #fbbf2430}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.m{font-size:13px;color:var(--mu)}
img.th{height:72px;border-radius:10px;border:1px solid var(--bd)}
img.q{max-width:100%;border-radius:12px;margin:8px 0;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-bottom:4px}
.chip{flex:none;border:1px solid var(--bd);background:var(--cd);border-radius:22px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--mu)}
.chip.on{border-color:var(--ac);color:var(--ac);background:var(--gl)}
.tp{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;font-weight:700;color:var(--ac)}
.tp em{font-style:normal;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:2px 10px}
.qi{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;overflow-x:auto}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.qn{background:var(--gl);color:var(--ac);border:1px solid #fbbf2455;border-radius:20px;padding:2px 12px;font-weight:800;font-size:13px}
.ans{color:var(--gr);font-size:12px;font-weight:700}
.qt{font-size:17px;font-weight:600;line-height:1.65}
.op{display:flex;gap:12px;align-items:center;padding:11px 14px;margin-top:8px;border:1px solid var(--bd);background:var(--bg);border-radius:14px}
.op .l{width:28px;height:28px;border-radius:50%;border:1px solid var(--mu);display:grid;place-items:center;font-size:13px;flex:none}
.op.c{border-color:var(--gr);background:#34d3991f}.op.c .l{background:var(--gr);color:#07130e;border-color:var(--gr)}
details{margin-top:12px;border-top:1px dashed var(--bd);padding-top:8px}
summary{color:var(--ac);font-weight:700;font-size:14px;cursor:pointer}
.ft{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.ft select{width:auto;max-width:62%;padding:7px 10px;font-size:13px;border-radius:12px}
.x{background:none;border:0;color:var(--rd);font-weight:600;font-size:13px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--bd);padding:10px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{background:none;border:0;font-size:12px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav i{font-style:normal;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:#8884}
.nav .on{color:var(--ac)}.nav .on i{background:linear-gradient(135deg,#fbbf24,#d97706);color:#111;width:54px;height:54px;border-radius:50%;margin-top:-26px;box-shadow:0 8px 22px #fbbf2440}
.main{font-size:calc(16px*var(--sc,1))}
.qt{font-size:1.08em}.op{font-size:.96em}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ctl .btn{padding:8px 13px;font-size:14px}.ctl .on{border-color:var(--ac);color:var(--ac);background:var(--gl)}
.star{background:none;border:0;font-size:20px;margin-left:auto;padding:0 4px}
.op.w{border-color:var(--rd);background:#f871711f}.op.w .l{background:var(--rd);color:#1a0707;border-color:var(--rd)}
.op.t{cursor:pointer}.op.t:active{border-color:var(--ac)}
.ed input,.ed textarea,.ed select{margin-top:8px}.ed textarea{min-height:80px}
.ed button{margin-right:6px}
.qi details>div{font-size:calc(1em*var(--se,1))}
.mo{padding:12px 16px}.mo summary{margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--cd);color:var(--tx);border:1px solid var(--ac);border-radius:14px;padding:10px 16px;display:flex;gap:14px;align-items:center;z-index:50;box-shadow:0 8px 24px #0006;max-width:92vw}
#toast button{background:none;border:0;color:var(--ac);font-weight:800}
#lb{position:fixed;inset:0;background:#000d;z-index:60;display:grid;place-items:center;padding:12px;overflow:auto}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
#up{position:fixed;right:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);z-index:6;font-size:18px}
#toast[hidden],#lb[hidden],#up[hidden]{display:none}
body.cp .qi{padding:10px;margin-bottom:8px}body.cp .op{padding:6px 10px;margin-top:5px}body.cp .qt{line-height:1.45}
.more{display:block;width:100%;margin:6px 0 14px;text-align:center}
#mk{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:calc(16px*var(--sc,1))}
#mk[hidden]{display:none}
.mkw{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.mkt{padding-left:52px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:1.2em}
.mkb{padding-left:52px !important;position:sticky;top:0;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd);margin-bottom:12px}
.mkclk{font-weight:800;font-size:1.1em;color:var(--ac);font-variant-numeric:tabular-nums}.mkclk.low{color:var(--rd)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-bottom:10px}
.pal button{height:42px;border-radius:10px;border:1px solid var(--bd);background:var(--bt);font-weight:700}
.pal .a{background:var(--gr);color:#07130e;border-color:var(--gr)}.pal .v{background:var(--rd);color:#1a0707;border-color:var(--rd)}.pal .mr{box-shadow:inset 0 0 0 3px #a78bfa}.pal .cu{outline:2px solid var(--ac);outline-offset:2px}
.sec{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.op.s{border-color:var(--ac);background:var(--gl)}.op.s .l{background:var(--ac);color:#111;border-color:var(--ac)}
.bar{height:8px;border-radius:6px;background:var(--bt);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--gr)}
.big{font-size:2.4em;font-weight:800;color:var(--ac);line-height:1.1}
.mkw input[type=number]{width:90px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.mkw select{width:auto}
.ctl input[type=range]{width:110px;accent-color:var(--ac)}
.ctl label.m{display:flex;align-items:center;gap:6px}
.ctl [hidden]{display:none}
@media print{.nav,.hd,.card,.chips,.ft,#up,#toast,.ctl{display:none}.qi{break-inside:avoid}}
</style>
</head>
<body>
<div class="hd"><div><small>EXAM TRACKER</small><b>📚 Mock Question Bank</b></div><div style="display:flex;gap:8px"><button class="ic" id="mkb" aria-label="Auto Mock">📝</button><button class="ic" id="th" aria-label="Theme" style="display:none">🌓</button></div></div>
<div class="main">
<div class="gd" id="st"></div>
<div class="ctl"><button class="btn" id="fm">A−</button><span class="m" id="fv">100%</span><button class="btn" id="fp">A+</button><button class="btn" id="tg_ex">💡 Explanation</button><button class="btn" id="tg_pr">🎯 Practice</button><button class="btn" id="mkb2">📝 Auto Mock</button><span class="m" id="tm"></span><span class="m" id="ps"></span></div>
<details class="card mo"><summary>⚙ Display &amp; Tools</summary><div class="ctl" style="margin:12px 0 0"><button class="btn" id="fr">↺ Size reset</button><label class="m">Text <input type="range" id="fs" min="70" max="200" step="5"></label><label class="m">Explanation <input type="range" id="es" min="70" max="200" step="5"></label><button class="btn" id="tg_cp">📏 Compact</button><button class="btn" id="tg_sh">🔀 Shuffle</button><button class="btn" id="pr_rs" hidden>🔄 Practice reset</button><button class="btn" id="st_rs">🧹 Stats reset</button></div><div class="m" style="margin-top:10px">Shortcuts: <b>E</b> = explanation on/off · Practice mein <b>1-4</b> ya <b>A-D</b> = option chuno</div></details>

<div class="card">
  <div class="seg"><button class="on" data-p="t">✍ Text paste</button><button data-p="i">🖼 Image</button></div>
  <div id="p_t">
    <textarea id="bk" placeholder="1 ya jitne chaho questions paste karo — options, answer, trick, LaTeX, chapter sab auto..."></textarea>
    <div class="row"><button class="btn y" id="bkgo">⚡ Add</button><label class="btn" for="bkf">📄 .txt</label><input type="file" id="bkf" accept=".txt,.md" hidden></div>
    <div class="m" id="bkm" style="margin-top:8px"></div>
  </div>
  <div id="p_i" hidden>
    <div class="row" style="margin-top:0"><label class="btn" for="qf">📷 Image chuno</label><input type="file" id="qf" accept="image/*" multiple hidden><select id="tp" style="flex:1"></select></div>
    <div class="m" style="margin-top:8px">Paste (Ctrl+V) bhi chalega, ek saath kai images.</div>
    <div class="row" id="ip"></div>
    <div class="row"><button class="btn y" id="imgsave">💾 Save images</button><button class="btn" id="imgclr">Clear</button></div>
    <div class="m" id="msg" style="margin-top:8px"></div>
  </div>
</div>

<input type="text" id="sr" placeholder="🔍 Search questions..." style="margin-bottom:12px">
<div class="chips" id="chips"></div>
<div id="list"></div>

<div class="card" style="margin-top:22px">
  <b>🧰 Backup & tools</b>
  <div class="row">
    <button class="btn" id="exp">⬇ Export JSON</button>
    <label class="btn" for="imp">⬆ Import</label><input type="file" id="imp" accept=".json" hidden>
    <button class="btn" onclick="window.print()">🖨 Print</button>
    <button class="btn" id="exptxt">📝 Export TXT (current list)</button>
    <button class="btn" id="clr" hidden>x</button><button class="btn" id="trb">♻ Deleted questions (0)</button>
  </div>
  <div class="m" id="sz" style="margin-top:10px"></div><div id="trl" style="margin-top:10px"></div>
</div>
</div>
<div class="nav" id="tabs"></div>
<div id="mk" hidden></div><div id="toast" hidden></div><div id="lb" hidden onclick="this.hidden=true"><img alt=""></div><button id="up" hidden aria-label="Top">↑</button>

  navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok,fb):fb()};
window.zoom=src=>{$("lb").firstElementChild.src=src;$("lb").hidden=false};

document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey||!$("mk").hidden)return;if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
  if(k=="e"){$("tg_ex").click();return}

/* ===================== AUTO MOCK ===================== */
const MKC="mqb_mock_cur",MKH="mqb_mock_hist",MKF="mqb_mock_cfg";
let MK={v:"setup",pal:false,rf:"all",R:null,dopen:false},TT=null,CF=null;
const mmss=z=>{z=Math.max(0,Math.floor(z));return String(Math.floor(z/60)).padStart(2,"0")+":"+String(z%60).padStart(2,"0")};
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function mkEl(x){return !!(x&&x.a&&"ABCD".indexOf(x.a)>=0&&(x.t||x.img)&&x.o.filter(Boolean).length>=2&&x.o["ABCD".indexOf(x.a)])}
function mkCfg(){if(!CF)CF=Object.assign({cnt:{},src:"all",pos:2,neg:.5,min:15,auto:true,shq:true,sho:false,mix:false,ex:{}},lsGet(MKF,{}));return CF}
function mkPool(s,C){C=C||mkCfg();const ex=C.ex[s]||[];return D.filter(x=>x.s==s&&mkEl(x)&&ex.indexOf(x.tp)<0&&({all:1,new:!x.n,weak:isW(x),star:!!x.f,rev:isW(x)||!x.n})[C.src])}
function mkN(s,C){const p=mkPool(s,C).length,v=C.cnt[s];return Math.min(v===undefined?25:v,p)}
function mkTot(C){return Object.keys(T).reduce((a,s)=>a+mkN(s,C),0)}
function mkSumTxt(C){const n=mkTot(C);return "Total <b>"+n+" Q</b> · <b>"+C.min+" min</b> · Max <b>"+(+(n*C.pos).toFixed(2))+"</b> marks · galat par −"+C.neg+(n?"":'<br><span style="color:var(--rd)">⚠ Koi eligible question nahi mila — source/chapters ya answers check karo.</span>')}
function mkRead(){const C=mkCfg();Object.keys(T).forEach(s=>{const e=$("mc_"+s);if(e)C.cnt[s]=Math.max(0,parseInt(e.value)||0)});
  if($("m_src")){C.src=$("m_src").value;C.pos=Math.max(0,parseFloat($("m_pos").value)||0);C.neg=Math.max(0,parseFloat($("m_neg").value)||0);C.min=Math.max(1,parseInt($("m_min").value)||1);C.shq=$("m_shq").checked;C.sho=$("m_sho").checked;C.mix=$("m_mix").checked;C.auto=$("m_auto").checked}return C}

function mkSetup(){MK.v="setup";const C=mkCfg(),H=lsGet(MKH,[]),subs=Object.keys(T),el=D.filter(mkEl).length,bad=D.length-el;
  if(C.auto)C.min=Math.max(1,Math.ceil(mkTot(C)*.6));
  let h=`<div class="mkw"><div class="mkt"><b>📝 Auto Mock Test</b><button class="btn" data-a="close">✖ Band</button></div>`;
  if(TT){const left=TT.dur-(Date.now()-TT.st)/1000;h+=`<div class="card"><b>⏳ Adhoora test</b><div class="m">${TT.items.length} Q · ${mmss(left)} bacha</div><div class="row"><button class="btn y" data-a="resume">▶ Resume</button><button class="btn" data-a="discard" style="color:var(--rd)">🗑 Discard</button></div></div>`}
  h+=`<div class="card"><b>⚡ Presets</b><div class="row"><button class="btn" data-a="pre" data-v="quick">⚡ Quick (~25Q)</button><button class="btn" data-a="pre" data-v="cgl">📝 CGL Tier-1 100Q · 60m</button><button class="btn" data-a="pre" data-v="cur">🎯 ${S} sectional</button><button class="btn" data-a="pre" data-v="weak">❌ Weak revision</button></div></div>`;
  h+=`<div class="card"><b>📚 Kitne questions</b><div class="m">Sirf wahi questions aate hain jinka sahi answer set hai (${el} ready${bad?", "+bad+" skip":""}).</div>`+subs.map(s=>{const p=mkPool(s,C).length;return `<div class="row" style="justify-content:space-between;margin-top:10px"><span><b>${IC[s]} ${s}</b> <span class="m">pool ${p}</span></span><input type="number" id="mc_${s}" min="0" max="${p}" value="${mkN(s,C)}"></div>`}).join("")+`</div>`;
  h+=`<div class="card"><details ${MK.dopen?"open":""} style="margin:0;border:0;padding:0"><summary onclick="MK.dopen=!this.parentNode.open">📖 Chapters chuno (optional)</summary>`+subs.map(s=>{const cn={};D.filter(x=>x.s==s&&mkEl(x)).forEach(x=>cn[x.tp]=(cn[x.tp]||0)+1);const ks=Object.keys(cn).sort();return ks.length?`<div class="m" style="margin-top:10px">${IC[s]} ${s}</div><div class="row" style="margin-top:6px">`+ks.map(t=>`<button class="chip ${(C.ex[s]||[]).indexOf(t)<0?"on":""}" data-a="chap" data-v="${ha(s+"|"+t)}">${ha(t)} ${cn[t]}</button>`).join("")+`</div>`:""}).join("")+`</details></div>`;
  h+=`<div class="card"><b>⚙ Settings</b><div class="row"><label class="m">Source <select id="m_src">${[["all","Sab questions"],["new","Sirf naye (practice nahi hue)"],["weak","Sirf weak"],["star","Sirf ⭐ starred"],["rev","Naye + weak (revision)"]].map(o=>`<option value="${o[0]}" ${C.src==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label></div>
  <div class="row"><label class="m">Sahi (+) <input type="number" id="m_pos" step="0.25" min="0" value="${C.pos}"></label><label class="m">Galat (−) <input type="number" id="m_neg" step="0.25" min="0" value="${C.neg}"></label><label class="m">Time (min) <input type="number" id="m_min" min="1" value="${C.min}"></label></div>
  <div class="row"><label class="m"><input type="checkbox" id="m_shq" ${C.shq?"checked":""}> Questions shuffle</label><label class="m"><input type="checkbox" id="m_sho" ${C.sho?"checked":""}> Options shuffle</label><label class="m"><input type="checkbox" id="m_mix" ${C.mix?"checked":""}> Subjects mix</label><label class="m"><input type="checkbox" id="m_auto" ${C.auto?"checked":""}> Auto time</label></div>
  <div class="m" style="margin-top:6px">Options shuffle on ho to explanation mein likhe A/B/C/D alag ho sakte hain.</div></div>`;
  h+=`<div class="card"><div id="m_sum">${mkSumTxt(C)}</div><div class="row"><button class="btn y" data-a="start" style="flex:1">🚀 Mock shuru karo</button></div></div>`;
  if(H.length)h+=`<div class="card"><b>📈 Pichhle mocks</b>`+H.slice(0,10).map(r=>`<div class="row"><button class="btn" data-a="hist" data-v="${r.id}" style="flex:1;text-align:left">${new Date(r.date).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})} · <b>${r.score}/${r.max}</b> · ✓${r.c} ✗${r.w} ⬜${r.s}</button></div>`).join("")+`<div class="row"><button class="btn" data-a="hclr" style="color:var(--rd)">🗑 History clear</button></div></div>`;
  h+=`</div>`;$("mk").innerHTML=h;lsSet(MKF,C)}

function mkPre(k){const C=mkRead(),subs=Object.keys(T),pl=s=>mkPool(s,C).length;
  if(k=="cgl"){C.src="all";subs.forEach(s=>C.cnt[s]=25);C.pos=2;C.neg=.5;C.mix=false;C.shq=true;const t=mkTot(C);C.auto=t<100;C.min=t<100?Math.max(1,Math.ceil(t*.6)):60}
  else if(k=="quick"){const a=subs.filter(s=>pl(s)>0),n=a.length?Math.ceil(25/a.length):0;subs.forEach(s=>C.cnt[s]=a.indexOf(s)>=0?n:0);C.auto=true}
  else if(k=="cur"){subs.forEach(s=>C.cnt[s]=s==S?25:0);C.auto=true}
  else if(k=="weak"){C.src="weak";subs.forEach(s=>C.cnt[s]=25);C.auto=true}
  mkSetup()}

function mkBuild(C,ids){let sel=[];const ord=Object.keys(T);
  if(ids){sel=ids.map(id=>D.find(x=>x.id==id)).filter(Boolean);if(C.shq)sel=shuf(sel);if(!C.mix)sel.sort((a,b)=>ord.indexOf(a.s)-ord.indexOf(b.s))}
  else{ord.forEach(s=>{const p=mkPool(s,C),q=C.shq?shuf(p):p.slice();sel=sel.concat(q.slice(0,mkN(s,C)))});if(C.mix)sel=shuf(sel)}
  if(!sel.length)return null;
  return{id:Date.now(),items:sel.map(x=>{const ix=[0,1,2,3].filter(j=>x.o[j]);return{id:x.id,p:C.sho?shuf(ix):ix}}),sel:{},vis:{},mark:{},tm:{},cur:0,st:Date.now(),lt:Date.now(),dur:Math.round(C.min*60),pos:C.pos,neg:C.neg,mix:!!C.mix}}
function mkStart(){const C=mkRead();if(C.auto)C.min=Math.max(1,Math.ceil(mkTot(C)*.6));const t=mkBuild(C);if(!t){toast("Koi eligible question nahi mila");return}
  if(TT&&!confirm("Purana adhoora test discard hoga. Naya shuru karein?"))return;
  lsSet(MKF,C);TT=t;MK.pal=false;mkSave();mkTest(true)}
function mkSave(){if(TT)lsSet(MKC,TT)}
function mkLeave(){const t=TT;if(!t)return;const it=t.items[t.cur];if(it)t.tm[it.id]=(t.tm[it.id]||0)+Math.max(0,(Date.now()-(t.lt||Date.now()))/1000);t.lt=Date.now()}
function mkGo(n){if(!TT)return;if(n<0)return;if(n>=TT.items.length){toast("Last question — Submit karo");return}mkLeave();TT.cur=n;mkSave();mkTest(true)}
function mkTick(){if(!TT)return;const left=TT.dur-(Date.now()-TT.st)/1000;if(left<=0){mkSubmit(true,$("mk").hidden||MK.v!="test");return}const e=$("mkt");if(e&&MK.v=="test"&&!$("mk").hidden){e.textContent="⏱ "+mmss(left);e.classList.toggle("low",left<300)}}

function mkTest(top){const t=TT;if(!t)return;MK.v="test";
  t.items=t.items.filter(i=>D.some(x=>x.id==i.id));
  if(!t.items.length){TT=null;try{localStorage.removeItem(MKC)}catch(e){}mkSetup();return}
  t.cur=Math.min(t.cur,t.items.length-1);const it=t.items[t.cur],q=D.find(x=>x.id==it.id);t.vis[it.id]=1;
  const sc=$("mk").scrollTop,sub=i=>D.find(x=>x.id==i.id).s,subs=[...new Set(t.items.map(sub))],ans=t.items.filter(i=>t.sel[i.id]!==undefined).length;
  let h=`<div class="mkw"><div class="mkb"><span class="mkclk" id="mkt">⏱ --:--</span><span class="m">Q ${t.cur+1}/${t.items.length} · ✓${ans}</span><span style="flex:1"></span><button class="btn" data-a="fm">A−</button><button class="btn" data-a="fp">A+</button><button class="btn" data-a="pal">🗂</button><button class="btn" data-a="close">✖</button><button class="btn y" data-a="submit">Submit</button></div>`;
  if(!t.mix&&subs.length>1)h+=`<div class="sec">`+subs.map(s=>`<button class="chip ${s==q.s?"on":""}" data-a="sec" data-v="${s}">${s}</button>`).join("")+`</div>`;
  if(MK.pal)h+=`<div class="pal">`+t.items.map((i,n)=>`<button class="${t.sel[i.id]!==undefined?"a":t.vis[i.id]?"v":""} ${t.mark[i.id]?"mr":""} ${n==t.cur?"cu":""}" data-a="go" data-v="${n}">${n+1}</button>`).join("")+`</div><div class="m" style="margin-bottom:10px">🟩 answered · 🟥 dekha par answer nahi · ⬜ nahi dekha · 🟪 border = review</div>`;
  h+=`<div class="qi"><div class="qh"><span class="qn">Q${t.cur+1}</span><span class="m">${q.s} · ${ha(q.tp)}</span>${t.mark[it.id]?'<span class="m">🔖 review</span>':""}</div>${q.t?`<div class="qt">${fmt(q.t)}</div>`:""}${q.img?`<img class="q" src="${q.img}" onclick="zoom(this.src)">`:""}`
    +it.p.map((j,pos)=>`<div class="op t${t.sel[it.id]===j?" s":""}" data-a="sel" data-v="${j}"><span class="l">${"ABCD"[pos]}</span><span>${fmt(q.o[j])}</span></div>`).join("")+`</div>`;
  h+=`<div class="row"><button class="btn" data-a="prev">⬅ Prev</button><button class="btn" data-a="mark">${t.mark[it.id]?"🔖 Unmark":"🔖 Mark review"}</button><button class="btn" data-a="clr">✖ Clear</button><button class="btn y" data-a="next" style="margin-left:auto">Save &amp; Next ➡</button></div></div>`;
  $("mk").innerHTML=h;$("mk").scrollTop=top?0:sc;mkTick();typeset($("mk"))}

function mkScore(t){let c=0,w=0,s=0;const subj={},chap={},items=[];
  t.items.forEach(it=>{const q=D.find(x=>x.id==it.id);if(!q)return;const sel=t.sel[it.id],st=sel===undefined?"s":("ABCD"[sel]==q.a?"c":"w");
    if(st=="c")c++;else if(st=="w")w++;else s++;
    const A=subj[q.s]=subj[q.s]||{c:0,w:0,s:0},ck=q.s+"|"+q.tp,B=chap[ck]=chap[ck]||{c:0,w:0,s:0};A[st]++;B[st]++;
    items.push({id:it.id,sel:sel===undefined?null:sel,t:Math.round(t.tm[it.id]||0),p:it.p.join(""),m:t.mark[it.id]?1:0})});
  return{c,w,s,score:+(c*t.pos-w*t.neg).toFixed(2),max:+(items.length*t.pos).toFixed(2),subj,chap,items}}

function mkSubmit(auto,silent){const t=TT;if(!t)return;
  if(!auto){const an=t.items.filter(i=>t.sel[i.id]!==undefined).length;if(!confirm("Submit karna hai?\nAnswered: "+an+"/"+t.items.length+"\nUnattempted: "+(t.items.length-an)+"\nReview marked: "+Object.keys(t.mark).length))return}
  mkLeave();const R=mkScore(t);R.id=t.id;R.date=Date.now();R.used=Math.min(t.dur,Math.round((Date.now()-t.st)/1000));R.dur=t.dur;R.pos=t.pos;R.neg=t.neg;
  const H=lsGet(MKH,[]);H.unshift(R);lsSet(MKH,H.slice(0,15));
  let ch=false;R.items.forEach(r=>{if(r.sel===null)return;const q=D.find(x=>x.id==r.id);if(!q)return;const ok="ABCD"[r.sel]==q.a;q.n=(q.n||0)+1;if(ok)q.k=(q.k||0)+1;else{q.w=(q.w||0)+1;q.k=0}ch=true});if(ch)persist();
  TT=null;try{localStorage.removeItem(MKC)}catch(e){}
  renderTabs();render();
  if(silent){toast("⏰ Mock auto-submit ho gaya — 📝 se result dekho");return}
  MK.R=R;MK.rf="all";$("mk").hidden=false;document.body.style.overflow="hidden";mkRes(true)}

function mkRes(top){MK.v="res";const R=MK.R,n=R.items.length,att=R.c+R.w,acc=att?Math.round(R.c*100/att):0,avg=att?Math.round(R.items.reduce((a,i)=>a+(i.sel===null?0:i.t),0)/att):0,sc=$("mk").scrollTop;
  let h=`<div class="mkw"><div class="mkt"><b>📊 Result</b><span><button class="btn" data-a="again">⚙ Naya mock</button> <button class="btn" data-a="close">✖</button></span></div>
  <div class="card" style="text-align:center"><div class="big">${R.score}<span class="m">/${R.max}</span></div><div class="m">Accuracy ${acc}% · Attempted ${att}/${n} · Time ${mmss(R.used)} / ${mmss(R.dur)} · avg ${avg}s/Q</div></div>
  <div class="gd"><div class="st"><b style="color:var(--gr)">${R.c}</b><span>Sahi</span></div><div class="st"><b style="color:var(--rd)">${R.w}</b><span>Galat</span></div><div class="st"><b>${R.s}</b><span>Skipped</span></div></div>`;
  h+=`<div class="card"><b>📚 Subject-wise</b>`+Object.keys(R.subj).map(s=>{const a=R.subj[s],t=a.c+a.w+a.s;return `<div style="margin-top:12px"><div class="row" style="margin:0;justify-content:space-between"><b>${IC[s]||""} ${s}</b><span class="m">${+(a.c*R.pos-a.w*R.neg).toFixed(2)}/${+(t*R.pos).toFixed(2)} · ✓${a.c} ✗${a.w} ⬜${a.s}</span></div><div class="bar"><i style="width:${Math.round(a.c*100/t)}%"></i></div></div>`}).join("")+`</div>`;
  const cs=Object.keys(R.chap).map(k=>{const a=R.chap[k],t=a.c+a.w+a.s;return{k,a,t,p:a.c/t}}).filter(x=>x.p<1).sort((x,y)=>x.p-y.p||y.t-x.t).slice(0,8);
  if(cs.length)h+=`<div class="card"><b>🎯 Pehle ye chapters revise karo</b>`+cs.map(x=>`<div style="margin-top:10px"><div class="row" style="margin:0;justify-content:space-between"><span>${ha(x.k.split("|")[1])}</span><span class="m">${x.a.c}/${x.t} sahi</span></div><div class="bar"><i style="width:${Math.round(x.p*100)}%;background:var(--rd)"></i></div></div>`).join("")+`</div>`;
  const wr=R.items.filter(i=>{const q=D.find(x=>x.id==i.id);return q&&(i.sel===null||"ABCD"[i.sel]!=q.a)}).length;
  h+=`<div class="row"><button class="btn y" data-a="retake" ${wr?"":"disabled"}>🔁 Galat + skipped ka retake (${wr})</button></div>`;
  h+=`<div class="chips" style="margin-top:14px">`+[["all","Sab"],["w","❌ Galat"],["s","⬜ Skipped"],["c","✅ Sahi"],["m","🔖 Marked"]].map(f=>`<button class="chip ${MK.rf==f[0]?"on":""}" data-a="rf" data-v="${f[0]}">${f[1]}</button>`).join("")+`</div>`;
  R.items.forEach((r,i)=>{const q=D.find(x=>x.id==r.id);if(!q)return;const st=r.sel===null?"s":("ABCD"[r.sel]==q.a?"c":"w");if(MK.rf=="m"?!r.m:(MK.rf!="all"&&MK.rf!=st))return;
    const k="ABCD".indexOf(q.a),pm=r.p?r.p.split("").map(Number):[0,1,2,3].filter(j=>q.o[j]);
    h+=`<div class="qi"><div class="qh"><span class="qn">Q${i+1}</span><span class="ans" style="color:${st=="c"?"var(--gr)":st=="w"?"var(--rd)":"var(--mu)"}">${st=="c"?"✓ Sahi":st=="w"?"✗ Galat":"⬜ Skipped"}</span><span class="m">${q.s} · ${ha(q.tp)} · ${r.t}s</span></div>${q.t?`<div class="qt">${fmt(q.t)}</div>`:""}${q.img?`<img class="q" src="${q.img}" onclick="zoom(this.src)">`:""}`
      +pm.map((j,pos)=>`<div class="op${j==k?" c":(j===r.sel?" w":"")}"><span class="l">${"ABCD"[pos]}</span><span>${fmt(q.o[j])}</span></div>`).join("")
      +(q.e?`<details ${P.ex?"open":""}><summary>💡 Trick / Explanation</summary><div style="margin-top:8px">${fmt(q.e)}</div></details>`:"")+`</div>`});
  h+=`</div>`;$("mk").innerHTML=h;$("mk").scrollTop=top?0:sc;typeset($("mk"))}

function mkRetake(){const R=MK.R,ids=R.items.filter(i=>{const q=D.find(x=>x.id==i.id);return q&&(i.sel===null||"ABCD"[i.sel]!=q.a)}).map(i=>i.id);if(!ids.length)return;
  const C=Object.assign({},mkCfg(),{min:Math.max(1,Math.ceil(ids.length*.6)),pos:R.pos,neg:R.neg}),t=mkBuild(C,ids);if(!t)return;
  TT=t;MK.pal=false;mkSave();mkTest(true)}
function mkOpen(){$("mk").hidden=false;document.body.style.overflow="hidden";MK.v=="res"&&MK.R?mkRes(true):mkSetup()}
function mkClose(){if(MK.v=="test"){if(!confirm("Test beech mein band karoge? Timer chalta rahega — 📝 se Resume kar sakte ho."))return;mkLeave();mkSave()}MK.v="setup";$("mk").hidden=true;document.body.style.overflow=""}

const MKA={
  close(){mkClose()},pre:mkPre,
  chap(v){const C=mkRead(),i=v.indexOf("|"),s=v.slice(0,i),tp=v.slice(i+1),a=C.ex[s]=C.ex[s]||[],k=a.indexOf(tp);k<0?a.push(tp):a.splice(k,1);mkSetup()},
  start(){mkStart()},resume(){if(!TT)return;TT.lt=Date.now();MK.pal=false;mkTest(true)},
  discard(){if(confirm("Adhoora test delete karna hai?")){TT=null;try{localStorage.removeItem(MKC)}catch(e){}mkSetup()}},
  hist(v){const r=lsGet(MKH,[]).find(x=>x.id==v);if(r){MK.R=r;MK.rf="all";mkRes(true)}},
  hclr(){if(confirm("Mock history clear karni hai?")){lsSet(MKH,[]);mkSetup()}},
  fm(){$("fm").click()},fp(){$("fp").click()},pal(){MK.pal=!MK.pal;mkTest()},
  sec(v){const i=TT.items.findIndex(x=>D.find(y=>y.id==x.id).s==v);if(i>=0)mkGo(i)},
  go(v){MK.pal=false;mkGo(+v)},
  sel(v){const it=TT.items[TT.cur];TT.sel[it.id]=+v;mkSave();mkTest()},
  clr(){const it=TT.items[TT.cur];delete TT.sel[it.id];mkSave();mkTest()},
  mark(){const it=TT.items[TT.cur];if(TT.mark[it.id])delete TT.mark[it.id];else TT.mark[it.id]=1;mkSave();mkTest()},
  prev(){mkGo(TT.cur-1)},next(){mkGo(TT.cur+1)},submit(){mkSubmit()},
  rf(v){MK.rf=v;mkRes()},retake(){mkRetake()},again(){mkSetup()}
};

/* ---- auto-save safety net ---- */
(function(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  const t=$("bk");
  try{const d=localStorage.getItem("mqb_draft");if(d&&!t.value)t.value=d}catch(e){}
  t.addEventListener("input",()=>{try{localStorage.setItem("mqb_draft",t.value)}catch(e){}});
  (async()=>{
    let pool=[],ptr=[];
    const cur=await idbGet("cur");
    if(cur){pool=cur.D||[];ptr=cur.TR||[]}
    if(!pool.length&&!D.length){
      const ks=(await idbKeys()).filter(k=>/^snap-/.test(k)).sort().reverse();
      for(const k of ks){const sn=await idbGet(k);if(sn&&sn.D&&sn.D.length){pool=sn.D;ptr=sn.TR||[];break}}
    }
    const have=new Set(D.map(x=>String(x.id))),tr=new Set(TR.map(x=>String(x.id)));
    const miss=pool.filter(x=>x&&x.id!=null&&!have.has(String(x.id))&&!tr.has(String(x.id)));
    const mt=ptr.filter(x=>x&&x.id!=null&&!tr.has(String(x.id))&&!have.has(String(x.id))&&!miss.some(m=>String(m.id)==String(x.id)));
    if(miss.length||mt.length){D=D.concat(miss);TR=TR.concat(mt);persist();renderTabs();render();trUI();
      if(miss.length)toast("♻ "+miss.length+" questions backup se wapas aa gaye")}
    else mirrorNow();
  })();
})();
