<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Comprehension</title>
<style>
:root{--bg:#08070a;--cd:#161b22;--bd:#333038;--tx:#c6c3cb;--mu:#aaa5ad;--ac:#fbbf24;--gr:#4ade80;--rd:#f87171;--bt:#1a181d;--gl:#fbbf2414;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',Helvetica,Arial,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px 12px 64px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,var(--gl),transparent);min-height:64px}
.hd .tt{flex:1;min-width:0}
.hd b{display:block;font-size:20px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small{color:var(--ac);font-weight:700;font-size:11px;letter-spacing:1.4px}
.hbtn{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:6px 12px;font-size:13px}
.main{max-width:760px;margin:0 auto;padding:16px 14px 120px}
.sum{display:flex;gap:8px;margin-bottom:14px}
.sum div{flex:1;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center}
.sum b{display:block;font-size:20px;color:var(--ac)}.sum span{font-size:11px;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row:active{border-color:var(--ac)}
.row .ic{font-size:24px;width:34px;text-align:center}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;line-height:1.3}
.row .tx small{color:var(--mu);font-size:12px}
.row .ar{color:var(--mu);font-size:22px}
.bar{height:5px;border-radius:3px;background:#26232b;margin-top:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}.bar .g{background:var(--gr)}.bar .r{background:var(--rd)}
.chips{display:flex;gap:8px;margin:2px 0 12px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--cd);border-radius:999px;padding:7px 14px;font-size:13px}
.chip.on{border-color:var(--rd);color:var(--rd);background:#f8717114}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.set{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:left}
.set b{display:block;font-size:15px}.set small{font-size:12px;color:var(--mu);display:block}
.set.done{border-color:#4ade8055}
.qh{display:flex;align-items:center;justify-content:space-between;color:var(--mu);font-size:13px;margin-bottom:8px;gap:8px}
.qprog{height:4px;background:#26232b;border-radius:2px;margin-bottom:12px;overflow:hidden}.qprog i{display:block;height:100%;background:var(--ac)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--ac);border:1px solid #fbbf2455;border-radius:999px;padding:2px 10px;margin:0 6px 8px 0}
.src{font-size:11px;color:var(--mu);margin:0 0 8px}
.ps{background:#0d1117;border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:12px;padding:12px;margin-bottom:12px;font-size:15px;line-height:1.7}
.ps p{margin:0 0 8px;white-space:pre-wrap;word-wrap:break-word}.ps p:last-child{margin-bottom:0}
.ps.scroll{max-height:42vh;overflow:auto}
.pt{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ac);font-weight:700;letter-spacing:1px;margin-bottom:6px}
.pt button{border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:2px 10px;font-size:12px;color:var(--mu)}
.q{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;white-space:pre-wrap;word-wrap:break-word;line-height:1.65;font-size:16px}
.q p{margin:0 0 6px}.q p:last-child{margin:0}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--bt);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:9px;line-height:1.5;word-break:break-word}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mu)}
.opt.ok{border-color:var(--gr);background:#4ade8018}.opt.ok .l{background:var(--gr);color:#08070a;border-color:var(--gr)}
.opt.bad{border-color:var(--rd);background:#f8717118}.opt.bad .l{background:var(--rd);color:#08070a;border-color:var(--rd)}
.opt:disabled{opacity:1;cursor:default}
.rawopt{font-size:14px;color:var(--mu);border:1px dashed var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word;max-height:30vh;overflow:auto}
.rawnote{font-size:12px;color:var(--rd);margin:0 0 10px}
.ex{background:#0d1117;border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:10px;padding:12px;margin:12px 0;font-size:14px;white-space:pre-wrap;line-height:1.65}
.ex h4{margin:0 0 6px;font-size:12px;color:var(--ac);letter-spacing:1px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.nav button{flex:1;border:1px solid var(--bd);background:var(--cd);border-radius:12px;padding:13px;font-weight:600}
.nav button.p{background:var(--ac);color:#08070a;border-color:var(--ac)}
.nav button:disabled{opacity:.35}
.res{text-align:center;padding:24px 8px}
.res .big{font-size:48px;font-weight:800;color:var(--ac)}
.res .sub{color:var(--mu);margin-bottom:18px}
.res button{display:block;width:100%;margin-bottom:10px;border:1px solid var(--bd);background:var(--cd);border-radius:12px;padding:13px;font-weight:600}
.res button.p{background:var(--ac);color:#08070a;border-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.warn{color:var(--rd)}
</style>
</head>
<body>
<div class="hd"><div class="tt"><small id="sm">📖 ENGLISH COMPREHENSION</small><b id="ttl">Loading…</b></div><button class="hbtn" id="hb" style="display:none"></button></div>
<div class="main" id="app"><div class="empty">Loading…</div></div>
<script>
(function(){
'use strict';
var BASE='../data/reading/', SZ=10;
var MODE=/[?&]m=new/.test(location.search)?'new':((/[?&]m=sets/.test(location.search))?'sets':'type');
var PFX=MODE==='new'?'NEW ':'PYQ ';
var KEY='reading_v1';
var $=function(i){return document.getElementById(i)}, app=$('app'), ttl=$('ttl'), hb=$('hb');
var IDX=null, U={}, FL={c:[],r:[],p:[]}, ST={}, view={}, cur=null, tick=null, psOpen=true;
var GN={c:'Cloze Test',r:'Reading Comprehension',p:'PQRS · Para Jumbles'};
var GI={c:'✍️',r:'📖',p:'🔀'};
$('sm').textContent=MODE==='sets'?'🏆 PYQ READING · 98 SETS':(MODE==='new'?'🆕 NEW READING · ADVANCED SETS':'📖 PYQ READING PRACTICE');

/* ---------- storage: localStorage + IndexedDB mirror ---------- */
function load(){try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ST={}}if(!ST.q)ST.q={};if(!ST.pos)ST.pos={};}
var tm=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}clearTimeout(tm);tm=setTimeout(mirror,800)}
function idb(cb){try{var r=indexedDB.open('reading_safe',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb(null)}}catch(e){cb(null)}}
function mirror(){idb(function(d){if(!d)return;try{d.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(ST),'st')}catch(e){}})}
function restore(done){if(Object.keys(ST.q).length){done();return}
  idb(function(d){if(!d){done();return}try{var g=d.transaction('kv').objectStore('kv').get('st');g.onsuccess=function(){if(g.result){try{ST=JSON.parse(g.result);if(!ST.q)ST.q={};if(!ST.pos)ST.pos={}}catch(e){}}done()};g.onerror=done}catch(e){done()}})}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function paras(a){return (a||[]).map(function(t){return '<p>'+esc(t)+'</p>'}).join('')}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function fetchJ(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function stat(list){var a=0,c=0,w=0;list.forEach(function(f){var s=ST.q[f.i];if(s){a++;if(s.raw){}else if(s.ok)c++;else w++}});return{a:a,c:c,w:w,n:list.length}}
function barH(s){var n=s.n||1;return '<div class="bar"><i class="g" style="width:'+(s.c/n*100)+'%"></i><i class="r" style="width:'+(s.w/n*100)+'%"></i></div>'}
function head(t,btn){ttl.textContent=t;if(btn){hb.style.display='';hb.textContent=btn.t;hb.onclick=btn.f}else hb.style.display='none'}
function nav(h){var o=document.querySelector('.nav');if(o)o.remove();if(h){document.body.appendChild(el(h))}}
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function mmss(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function sumHtml(s){return '<div class="sum"><div><b>'+s.n+'</b><span>Total</span></div><div><b>'+s.a+'</b><span>Attempted</span></div><div><b style="color:var(--gr)">'+s.c+'</b><span>Sahi</span></div><div><b style="color:var(--rd)">'+s.w+'</b><span>Galat</span></div></div>'}

/* ---------- data ---------- */
function build(){
  ['c','r','p'].forEach(function(g){FL[g]=[];(U[g]||[]).forEach(function(u){u.q.forEach(function(q,qi){if(q.skip)return;FL[g].push({i:u.i+'.'+qi,u:u,q:q,g:g})})})});
  var byU={};['c','r','p'].forEach(function(g){FL[g].forEach(function(f){(byU[f.u.i]=byU[f.u.i]||[]).push(f)})});
  U.by=byU;
}
function unitsQs(ids){var o=[];ids.forEach(function(id){(U.by[id]||[]).forEach(function(f){o.push(f)})});return o}
function setQs(n){var s=IDX.sets[n-1];return unitsQs(s.c).concat(unitsQs(s.r),unitsQs(s.p))}
function tenQs(g,k){return unitsQs(IDX.ten[g][k])}

/* ---------- home ---------- */
function home(){
  stopTick();cur=null;view={s:'home'};nav();window.scrollTo(0,0);
  if(MODE==='sets'||MODE==='new')return homeSets();
  head('PYQ · Cloze · RC · PQRS');
  var all=FL.c.concat(FL.r,FL.p),s=stat(all);
  var h=sumHtml(s);
  ['c','r','p'].forEach(function(g){
    var t=stat(FL[g]);
    h+='<button class="row" data-g="'+g+'"><span class="ic">'+GI[g]+'</span><span class="tx"><b>'+PFX+GN[g]+'</b><small>'+FL[g].length+' Q · '+IDX.ten[g].length+' sets (10-10 Q)'+(t.a?' · '+t.a+' done, '+t.w+' galat':'')+'</small>'+barH(t)+'</span><span class="ar">&#8250;</span></button>';
  });
  app.innerHTML=h;
  app.querySelectorAll('.row').forEach(function(b){b.onclick=function(){openType(b.dataset.g)}});
}
function homeSets(){
  head(MODE==='new'?'New Advanced Sets (1-9)':'PYQ · 98 Mock Sets');
  var all=FL.c.concat(FL.r,FL.p),s=stat(all);
  var h=sumHtml(s);
  h+='<div class="chips"><button class="chip'+(view.wrong?' on':'')+'" id="fw">❌ Sirf galat wale sets ('+s.w+' Q)</button></div>';
  var cells='',shown=0;
  IDX.sets.forEach(function(S){
    var qs=setQs(S.n),st=stat(qs);
    if(view.wrong&&!st.w)return;shown++;
    cells+='<button class="set'+(st.a===qs.length?' done':'')+'" data-n="'+S.n+'"><b>'+PFX+'Set '+S.n+'</b><small>'+qs.length+' Q · C'+S.c.length+' · RC'+S.r.length+' · PQ'+S.p.length+'</small>'+(st.a?'<small>'+st.c+'/'+st.a+' sahi'+(view.wrong?' · '+st.w+' galat':'')+'</small>':'')+barH(st)+'</button>';
  });
  h+=shown?'<div class="grid">'+cells+'</div>':'<div class="empty">Koi galat question nahi 🎉</div>';
  app.innerHTML=h;
  $('fw').onclick=function(){view.wrong=!view.wrong;homeSets()};
  app.querySelectorAll('.set').forEach(function(b){b.onclick=function(){var n=+b.dataset.n;var qs=setQs(n);if(view.wrong)qs=qs.filter(function(f){var s=ST.q[f.i];return s&&!s.raw&&!s.ok});startSet(qs,PFX+'Set '+n,(MODE==='new'?'N':'S')+n+(view.wrong?':w':''))}});
}

/* ---------- type: list of 10-Q sets ---------- */
function openType(g){view={s:'type',g:g,wrong:view.wrong&&view.g===g};renderType()}
function renderType(){
  stopTick();nav();var g=view.g;
  head(GI[g]+' '+PFX+GN[g],{t:'⟵ Home',f:function(){view.wrong=false;home()}});
  var all=FL[g],s=stat(all);
  var h=sumHtml(s);
  h+='<div class="chips"><button class="chip'+(view.wrong?' on':'')+'" id="fw">❌ Sirf galat wale ('+s.w+')</button><button class="chip" id="rs">↺ Reset</button></div>';
  var P=[];
  if(view.wrong){var pool=all.filter(function(f){var x=ST.q[f.i];return x&&!x.raw&&!x.ok});for(var i=0;i<pool.length;i+=SZ)P.push(pool.slice(i,i+SZ))}
  else{for(var k=0;k<IDX.ten[g].length;k++)P.push(tenQs(g,k))}
  if(!P.length)h+='<div class="empty">'+(view.wrong?'Koi galat question nahi 🎉':'Is section mein question nahi')+'</div>';
  else{h+='<div class="grid">';P.forEach(function(part,k){var st=stat(part);
    h+='<button class="set'+(st.a===part.length?' done':'')+'" data-k="'+k+'"><b>'+PFX+'Set '+(k+1)+'</b><small>'+part.length+' Q'+(st.a?' · '+st.c+'/'+st.a+' sahi':'')+'</small>'+barH(st)+'</button>'});
    h+='</div>'}
  app.innerHTML=h;
  $('fw').onclick=function(){view.wrong=!view.wrong;renderType()};
  $('rs').onclick=function(){if(confirm(PFX+GN[g]+' ki saari progress reset karni hai?')){all.forEach(function(f){delete ST.q[f.i]});save();renderType()}};
  app.querySelectorAll('.set').forEach(function(b){b.onclick=function(){var k=+b.dataset.k;startSet(P[k],PFX+'Set '+(k+1)+(view.wrong?' · galat':''),g+(view.wrong?':w':'')+':'+k)}});
  window.scrollTo(0,0);
}

/* ---------- practice ---------- */
function leave(){stopTick();cur=null;nav();if(MODE==='type'&&view.g){view.s='type';renderType()}else{view.s='home';homeSets()}}
function startSet(qs,label,pk){
  if(!qs.length)return;
  var p=ST.pos[pk]||0,first=0;
  for(var i=0;i<qs.length;i++){if(!ST.q[qs[i].i]){first=i;break}first=i}
  cur={qs:qs,label:label,pk:pk,i:(p&&p<qs.length&&!ST.q[qs[p].i])?p:first,t0:Date.now()};
  if(stat(qs).a===qs.length)cur.i=0;
  view.s='play';showQ();
}
function showQ(){
  var f=cur.qs[cur.i],q=f.q,u=f.u,st=ST.q[f.i],n=cur.qs.length;
  head(cur.label,{t:'✕ Band',f:leave});
  ST.pos[cur.pk]=cur.i;
  var sc=stat(cur.qs);
  var h='<div class="qh"><span>Q '+(cur.i+1)+' / '+n+'</span><span id="tm">⏱ '+mmss(Date.now()-cur.t0)+'</span><span>'+sc.c+' sahi · '+sc.w+' galat</span></div><div class="qprog"><i style="width:'+((cur.i+1)/n*100)+'%"></i></div>';
  h+='<span class="tag">'+GN[f.g].toUpperCase()+'</span>';
  if(q.sr)h+='<div class="src">'+esc(q.sr)+'</div>';
  var ps=(f.g==='p')?q.pp:u.p;
  if(ps&&ps.length){
    var cap=(f.g==='p')?'🔀 SENTENCES':(f.g==='c'?'📖 CLOZE PASSAGE':'📖 PASSAGE');
    h+='<div class="pt"><span>'+cap+'</span>'+(f.g!=='p'?'<button id="pt">'+(psOpen?'Chhupao ▲':'Dikhao ▼')+'</button>':'')+'</div>';
    if(f.g==='p'||psOpen)h+='<div class="ps'+(f.g!=='p'?' scroll':'')+'">'+paras(ps)+'</div>';
  }
  if(q.t&&q.t.length)h+='<div class="q">'+paras(q.t)+'</div>';
  if(q.raw){
    h+='<div class="rawnote">⚠️ Source PDF mein ye question garbled hai — options verbatim neeche hain.</div>';
    (q.o||[]).forEach(function(o){h+='<div class="rawopt">'+esc(o)+'</div>'});
    if(st){h+='<div class="ex"><h4>ANSWER</h4>'+esc(q.al||'Source mein answer nahi hai.')+(q.e?'\n\n'+esc(q.e):'')+'</div>'}
  }else{
    q.o.forEach(function(o,j){
      var c='opt';if(st){if(j===q.a)c+=' ok';else if(j===st.a)c+=' bad'}
      h+='<button class="'+c+'" data-j="'+j+'"'+(st?' disabled':'')+'><span class="l">'+'ABCDE'[j]+'</span><span>'+esc(o)+'</span></button>'});
    if(st){h+='<div class="ex"><h4>'+(st.ok?'✅ SAHI':'❌ GALAT — sahi answer: '+'ABCDE'[q.a])+'</h4>'+(q.e?esc(q.e):'Explanation available nahi.')+'</div>'}
  }
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){pick(+b.dataset.j)}});
  var pt=$('pt');if(pt)pt.onclick=function(){psOpen=!psOpen;showQ()};
  var last=cur.i===n-1;
  var mid=q.raw&&!st?'<button id="rv" class="p">Answer dekho</button>':'<button id="nx" class="p">'+(last?'Result ›':(st?'Aage ›':'Skip ›'))+'</button>';
  nav('<div class="nav"><button id="pv"'+(cur.i?'':' disabled')+'>‹ Peeche</button>'+mid+'</div>');
  $('pv').onclick=function(){cur.i--;showQ()};
  if($('rv'))$('rv').onclick=function(){ST.q[f.i]={raw:1,t:Date.now()};showQ()};
  if($('nx'))$('nx').onclick=function(){if(last)result();else{cur.i++;showQ()}};
  stopTick();tick=setInterval(function(){var t=$('tm');if(t)t.textContent='⏱ '+mmss(Date.now()-cur.t0)},1000);
  window.scrollTo(0,0);save();
}
function pick(j){
  var f=cur.qs[cur.i],q=f.q;if(ST.q[f.i])return;
  ST.q[f.i]={a:j,ok:j===q.a?1:0,t:Date.now()};showQ();
}
function result(){
  stopTick();
  var s=stat(cur.qs);nav();head(cur.label+' · result',{t:'✕ Band',f:leave});
  var scored=cur.qs.filter(function(f){return !f.q.raw}).length;
  var pct=scored?Math.round(s.c/scored*100):0,left=s.n-s.a;
  var h='<div class="res"><div class="big">'+s.c+' / '+scored+'</div><div class="sub">'+pct+'% sahi · '+s.w+' galat'+(left?' · '+left+' chhode':'')+' · ⏱ '+mmss(Date.now()-cur.t0)+'</div>';
  if(left)h+='<button class="p" id="b1">Chhode hue questions karo ('+left+')</button>';
  if(s.w)h+='<button id="b2">❌ Galat wale dobara dekho ('+s.w+')</button>';
  h+='<button id="b3">↺ Is set ko dobara karo</button><button id="b4">Sets list</button></div>';
  app.innerHTML=h;
  if(left)$('b1').onclick=function(){for(var i=0;i<cur.qs.length;i++)if(!ST.q[cur.qs[i].i]){cur.i=i;break}view.s='play';showQ()};
  if(s.w)$('b2').onclick=function(){view.wrong=true;leave()};
  $('b3').onclick=function(){cur.qs.forEach(function(f){delete ST.q[f.i]});cur.i=0;cur.t0=Date.now();ST.pos[cur.pk]=0;view.s='play';showQ()};
  $('b4').onclick=leave;window.scrollTo(0,0);save();
}

/* ---------- boot ---------- */
load();
restore(function(){
  if(MODE==='new'){
    fetchJ(BASE+'adv.json').then(function(d){
      IDX={sets:d.sets,ten:{c:[],r:[],p:[]}};U.c=[];U.r=[];U.p=[];
      d.units.forEach(function(u){U[u.g].push(u)});build();home();
    }).catch(function(){app.innerHTML='<div class="empty warn">Data load nahi hua (data/reading/adv.json). App update/online check karo.</div>'});
    return;
  }
  Promise.all(['index','c','r','p'].map(function(k){return fetchJ(BASE+k+'.json')})).then(function(a){
    IDX=a[0];U.c=a[1];U.r=a[2];U.p=a[3];build();home();
  }).catch(function(){app.innerHTML='<div class="empty warn">Data load nahi hua (data/reading/*.json). App update/online check karo.</div>'});
});
window.addEventListener('pagehide',function(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}mirror()});
})();
</script>
</body>
</html>
