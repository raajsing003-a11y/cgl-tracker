<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>Edge PDF Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: two toolbars (reading, markup) on top; page rail on the left; continuous page scroll fills the rest. */
:root {
  --bg: #eef0f4;
  --chrome: #ffffff;
  --panel: #f5f6f9;
  --canvas: #dfe3ea;
  --fg: #1b1f27;
  --muted: #5b6472;
  --line: #d3d8e0;
  --accent: #0f6cbd;
  --accent-fg: #ffffff;
  --danger: #c4314b;
  --hover: #e8ecf3;
  --hit: rgba(255, 213, 0, 0.5);
  --hit-cur: rgba(255, 140, 0, 0.65);
  --shadow: 0 1px 3px rgba(20, 30, 50, 0.25), 0 6px 18px rgba(20, 30, 50, 0.12);
  --font: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "Noto Sans", "Noto Sans Devanagari", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1e25; --chrome: #2a2e37; --panel: #22262d; --canvas: #14161b;
    --fg: #eceff4; --muted: #9aa3b2; --line: #3a404b; --accent: #5aa9f0;
    --accent-fg: #0b1a2b; --danger: #ff7b8f; --hover: #373c47;
    --hit: rgba(255, 213, 0, 0.4); --hit-cur: rgba(255, 140, 0, 0.6);
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.6), 0 6px 18px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1e25; --chrome: #2a2e37; --panel: #22262d; --canvas: #14161b;
  --fg: #eceff4; --muted: #9aa3b2; --line: #3a404b; --accent: #5aa9f0;
  --accent-fg: #0b1a2b; --danger: #ff7b8f; --hover: #373c47;
  --hit: rgba(255, 213, 0, 0.4); --hit-cur: rgba(255, 140, 0, 0.6);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.6), 0 6px 18px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; display: flex; flex-direction: column; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* toolbars */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px;
  background: var(--chrome); border: 1px solid var(--line); border-radius: 10px;
  padding: 5px 8px; margin-top: 6px; flex: none;
}
.bar:first-of-type { margin-top: 8px; }
.grp { display: flex; align-items: center; gap: 2px; min-width: 0; position: relative; }
.grp + .grp::before { content: ""; width: 1px; height: 20px; background: var(--line); margin-right: 6px; margin-left: 4px; }
.sp { flex: 1 1 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 34px; height: 34px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--fg);
}
.btn:hover { background: var(--hover); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:disabled:hover { background: transparent; }
.btn.go { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.go:hover { filter: brightness(1.08); background: var(--accent); }
.btn.go:disabled:hover { background: var(--accent); filter: none; }
.pg { display: flex; align-items: center; gap: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pg input {
  width: 3.4em; height: 30px; text-align: center; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel);
}
.zoom { min-width: 3.6em; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.find { display: flex; align-items: center; gap: 2px; flex: 1 1 180px; max-width: 340px; min-width: 0;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding-left: 8px; }
.find input { flex: 1 1 auto; min-width: 0; height: 32px; border: 0; background: transparent; outline-offset: -2px; }
.find .cnt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 0 4px; }
.find .btn { min-width: 30px; height: 30px; padding: 0 5px; }
.pick { display: flex; align-items: center; gap: 6px; padding: 0 4px; color: var(--muted); font-size: 12px; }
.pick input[type="color"] { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.pick input[type="range"] { width: 76px; accent-color: var(--accent); }
.pick input:disabled { opacity: 0.35; }
.pop {
  position: absolute; top: 40px; left: 0; z-index: 20; min-width: 190px; background: var(--chrome);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; display: flex; flex-direction: column;
}
.pop[hidden] { display: none !important; }
.pop button { text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 8px 10px; }
.pop button:hover { background: var(--hover); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

/* workspace */
.work { flex: 1 1 auto; min-height: 0; display: flex; gap: 8px; margin-block: 8px; position: relative; }
.rail {
  width: 196px; flex: none; overflow-y: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.rail[hidden] { display: none !important; }
.th { border: 2px solid transparent; border-radius: 8px; padding: 5px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; }
.th:hover { background: var(--hover); }
.th.on { border-color: var(--accent); color: var(--fg); }
.th.dragover { border-color: var(--danger); }
.th .box { background: #fff; margin: 0 auto 4px; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.th canvas { display: block; width: 100%; height: 100%; }
.th .row { display: flex; align-items: center; justify-content: center; gap: 1px; }
.th .row .n { flex: 1; text-align: center; }
.th .row button { width: 24px; height: 24px; border: 0; border-radius: 5px; background: transparent; display: grid; place-items: center; padding: 0; color: var(--muted); }
.th .row button:hover { background: var(--hover); color: var(--fg); }
.th .row button.del:hover { color: var(--danger); }
.th .row svg { width: 14px; height: 14px; }
.th .row input { width: 15px; height: 15px; margin: 0 2px; accent-color: var(--accent); }
.viewer { flex: 1 1 auto; min-width: 0; position: relative; overflow: auto; background: var(--canvas); border: 1px solid var(--line); border-radius: 10px; }
.pages { padding: 14px 16px 6px; width: max-content; min-width: 100%; }
.page { position: relative; margin: 0 auto 12px; background: #fff; box-shadow: var(--shadow); }
.page canvas { display: block; }
.invert .page canvas, .invert .th canvas { filter: invert(0.9) hue-rotate(180deg); }
.invert .page, .invert .th .box { background: #1a1a1a; }
.wm { position: absolute; left: 50%; top: 50%; white-space: pre; pointer-events: none; line-height: 1.1; font-weight: 700; }
.ov { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.ov [data-id] { pointer-events: none; }
.textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; z-index: 2; }
.textLayer span { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0 0; }
.textLayer span.hit { background: var(--hit); border-radius: 2px; }
.textLayer span.cur { background: var(--hit-cur); border-radius: 2px; }
.textLayer ::selection { background: rgba(15, 108, 189, 0.35); }
body.draw .ov { z-index: 3; pointer-events: auto; }
body.drag .ov { touch-action: none; }
body[data-tool="pen"] .ov, body[data-tool="rect"] .ov, body[data-tool="area"] .ov { cursor: crosshair; }
body[data-tool="text"] .ov, body[data-tool="note"] .ov, body[data-tool="stamp"] .ov { cursor: copy; }
body[data-tool="erase"] .ov [data-id] { pointer-events: var(--pe, all); cursor: pointer; }
.editor { position: absolute; z-index: 6; min-width: 120px; min-height: 1.6em; resize: both; border: 1px dashed var(--accent); background: rgba(255,255,255,.9); padding: 2px; line-height: 1.3; font-family: var(--font); color: #111; }

/* empty state, busy, toast, modal */
.empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; overflow: auto; }
.empty[hidden] { display: none !important; }
.drop {
  width: min(460px, 100%); border: 2px dashed var(--line); border-radius: 16px; padding: 32px 24px;
  text-align: center; background: var(--chrome); display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.drop.over { border-color: var(--accent); background: var(--hover); }
.drop h1 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
.drop p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 38ch; }
.primary { height: 40px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.primary:hover { filter: brightness(1.08); }
.secondary { height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
.secondary:hover { background: var(--hover); }
.primary:focus-visible, .secondary:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.keys { font-size: 12px; color: var(--muted); line-height: 1.8; }
kbd { font-family: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }
.busy { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--canvas) 80%, transparent); color: var(--fg); font-weight: 600; z-index: 30; text-align: center; padding: 20px; }
.busy[hidden] { display: none !important; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; max-width: min(92vw, 460px); box-shadow: var(--shadow); }
.toast[hidden] { display: none !important; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none !important; }
.card { width: min(420px, 100%); max-height: 100%; overflow: auto; background: var(--chrome); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; }
.card p { margin: 0; color: var(--muted); line-height: 1.5; }
.card label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.card input[type="text"], .card input[type="number"] { height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 14px; color: var(--fg); }
.card input[type="range"] { accent-color: var(--accent); }
.card .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
#sigPad { width: 100%; height: 160px; background: #fff; border: 1px solid var(--line); border-radius: 10px; touch-action: none; cursor: crosshair; }

.rh { position: sticky; top: -10px; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px; background: var(--panel); padding: 2px 0 6px; }
.rh input { flex: 1 1 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--chrome); padding: 0 8px; min-width: 0; }
.rh button { flex: 1; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: transparent; font-size: 12px; }
.rh button:hover { background: var(--hover); }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts label { flex-direction: row; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--fg); font-size: 14px; cursor: pointer; }
.opts label small { display: block; color: var(--muted); font-size: 12px; }
.opts input { accent-color: var(--accent); }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 720px) {
  .rail { position: absolute; z-index: 4; left: 0; top: 0; bottom: 0; box-shadow: var(--shadow); }
  .lbl { display: none; }
  .grp + .grp::before { display: none; }
  .find { flex-basis: 100%; max-width: none; order: 9; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .drop { transition: background 0.12s, border-color 0.12s; }
}

.mobonly { display: none; }
@media (max-width: 720px) {
  .mobonly { display: inline-flex; }
  body { padding-left: 6px; padding-right: 6px; }
  #barMain { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 3px 6px; margin-top: 4px; gap: 2px; }
  #barMain::-webkit-scrollbar { display: none; }
  #barMain .grp, #barMain .sp { flex: none; }
  #barMain .sp { display: none; }
  #barMain .find { flex: 0 0 210px; max-width: none; order: 0; }
  #barMain .btn { min-width: 32px; height: 32px; padding: 0 5px; }
  #barMain .pg input { height: 28px; }
  #barMark { display: none; }
  body.mk #barMark { display: flex; }
}

/* row hide buttons + page drag handle */
.bar .colbtn{flex:none;padding:2px 8px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;opacity:.8}
.bar.col{padding:2px 8px;min-height:0}
.bar.col>*:not(.colbtn){display:none!important}
.dragH{position:absolute;top:8px;right:8px;z-index:25;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:10px;background:rgba(20,22,27,.82);color:#fff;font-size:11px;opacity:0;transition:opacity .15s;cursor:grab;user-select:none}
.page:hover .dragH,.dragH:hover{opacity:1}
.dragH img{width:54px;height:70px;object-fit:contain;background:#fff;border-radius:4px;display:block;-webkit-user-drag:element}
.dragH.busy2 img{opacity:.4}
.dragH .gooChip{display:block;margin-top:3px;padding:6px 8px;border-radius:8px;background:#1a73e8;color:#fff;font-size:12px;font-weight:800;text-align:center;cursor:pointer}
.dragH .gooChip:hover{background:#1558b0}
</style>
<style id="lib-css">
#libPop{position:fixed;right:10px;top:96px;width:min(360px,calc(100vw - 20px));max-height:70vh;overflow:auto;background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;z-index:80;display:none}
#libPop.open{display:block}
#libPop h4{margin:2px 4px 8px;font-size:13px;color:var(--muted)}
#libPop .li{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
#libPop .li:hover{background:var(--hover)}
#libPop .li b{flex:1;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#libPop .li span{font-size:12px;color:var(--muted);white-space:nowrap}
#libPop .li i{font-style:normal;color:var(--danger);padding:6px 10px;border-radius:8px;font-size:16px}
#libPop .add{width:100%;padding:9px;border-radius:10px;border:1px dashed var(--accent);background:transparent;color:var(--accent);font-weight:600;margin-bottom:8px}
#libPop .none{padding:14px;text-align:center;color:var(--muted);font-size:13px}
#cropOv{position:fixed;inset:0;z-index:95;display:none;cursor:crosshair;background:rgba(0,0,0,.28);touch-action:none}
#cropOv.on{display:block}
#cropBox{position:fixed;display:none;border:2px dashed #fff;background:rgba(90,169,240,.22);pointer-events:none}
#cropHint{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000b;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;pointer-events:none;max-width:92vw;text-align:center}
</style>

<div id="libPop"></div>
<div class="bar" id="barMain" role="toolbar" aria-label="PDF controls">
  <div class="grp">
    <button class="btn mobonly" id="btnMark" title="Markup tools (pen, highlight, text)" aria-label="Markup tools" aria-pressed="false"><span>✏️</span></button>
    <button class="btn" id="btnRail" title="Pages panel" aria-label="Pages panel" aria-pressed="false" data-ic="rail"></button>
    <button class="btn" id="btnOpen" title="Open PDF or images (Ctrl+O)" aria-label="Open PDF"><span data-ic="open"></span><span class="lbl">Open</span></button>
    <button class="btn" id="btnAdd" title="Add PDFs or images as pages (merge)" aria-label="Merge PDF" disabled><span data-ic="merge"></span><span class="lbl">Merge</span></button>
    <input type="file" id="file" accept="application/pdf,.pdf,image/*" multiple hidden>
    <input type="file" id="fileAdd" accept="application/pdf,.pdf,image/*" multiple hidden>
  </div>
  <div class="grp pg">
    <input id="pageNum" type="number" min="1" value="1" inputmode="numeric" aria-label="Page number" disabled>
    <span>of <span id="pageTotal">0</span></span>
    <button class="btn" id="btnShot" title="Current page ka screenshot, auto-save (Alt+S)" aria-label="Screenshot page"><span>📷</span><span class="lbl">Page</span></button>
    <button class="btn" id="btnCrop" title="Page ka koi hissa chuno aur screenshot lo (Alt+A)" aria-label="Screenshot area"><span>✂️</span><span class="lbl">Area</span></button>
    <button class="btn" id="btnAsk" title="Area chuno aur AI se samjho (Alt+G)" aria-label="Ask AI about area"><span>🤖</span><span class="lbl">Ask AI</span></button>
    <button class="btn" id="btnAskG" title="Area chuno aur Google par bhejo (Alt+Shift+G)" aria-label="Ask Google about area"><span>🔍</span><span class="lbl">Google</span></button>
  </div>
  <div class="grp">
    <button class="btn" id="zOut" title="Zoom out" aria-label="Zoom out" data-ic="minus" disabled></button>
    <span class="zoom" id="zoomLbl">100%</span>
    <button class="btn" id="zIn" title="Zoom in" aria-label="Zoom in" data-ic="plus" disabled></button>
    <button class="btn" id="btnFit" title="Fit to width" aria-label="Fit to width" aria-pressed="true" data-ic="fit" disabled></button>

  </div>
  <span class="sp"></span>
  <div class="grp">
    <button class="btn" id="btnBm" title="Bookmarks (page yaad rakho)" aria-label="Bookmarks"><span>⭐</span><span class="lbl">Bookmarks</span></button>
    <button class="btn" id="btnRecent" title="Saved PDFs (dobara kholo / delete)" aria-label="Saved PDFs"><span>🕘</span><span class="lbl">Saved</span></button>
    <button class="btn" id="btnDark" title="Dark pages" aria-label="Dark pages" aria-pressed="false"><span data-ic="pagedark"></span><span class="lbl">Dark pages</span></button>
    <button class="btn" id="btnTheme" title="Theme: System" aria-label="Theme"><span data-ic="theme"></span><span class="lbl" id="themeLbl">System</span></button>
  </div>
</div>

<div class="bar" id="barMark" role="toolbar" aria-label="Markup tools">
  <div class="grp" id="tools"></div>
  <div class="grp">
    <div class="pop" id="stampPop" hidden></div>
    <div class="pick"><input type="color" id="color" value="#d1242f" aria-label="Colour"></div>
    <div class="pick"><input type="range" id="size" min="1" max="40" value="3" aria-label="Size"><span id="sizeLbl">3</span></div>
  </div>
  <div class="grp">
    <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo" data-ic="undo" disabled></button>
    <button class="btn" id="btnRedo" title="Redo (Ctrl+Y)" aria-label="Redo" data-ic="redo" disabled></button>
  </div>
  <span class="sp"></span>
  <div class="grp">
    <button class="btn" id="btnWm" title="Watermark" aria-label="Watermark" aria-pressed="false" disabled><span data-ic="wm"></span><span class="lbl">Watermark</span></button>
    <button class="btn" id="btnExtract" title="Save ticked pages as a new PDF" aria-label="Extract ticked pages" disabled><span data-ic="extract"></span><span class="lbl" id="extractLbl">Extract</span></button>
    <button class="btn go" id="btnSave" title="Save PDF" aria-label="Save PDF" disabled><span data-ic="save"></span><span class="lbl">Save PDF</span></button>
  </div>
</div>

<div class="work">
  <aside class="rail" id="rail" aria-label="Pages" hidden></aside>
  <main class="viewer" id="viewer" tabindex="0">
    <div class="pages" id="pages"></div>
    <div class="empty" id="empty">
      <div class="drop" id="drop">
        <span data-ic="bigdoc" style="color:var(--accent)"></span>
        <h1>Open a PDF to start reading</h1>
        <p>Drop a file here or choose one from your device. It opens inside this page and is never uploaded.</p>
        <div class="row2"><button class="primary" id="btnOpen2">Choose PDF or images</button><button class="secondary" id="btnSample">Try a sample</button></div>

      var c = document.createElement('canvas'); c.width = Math.ceil(v.width); c.height = Math.ceil(v.height);
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await pg.render({ canvasContext: ctx, viewport: v }).promise;
      var im = await out.embedJpg(c.toDataURL('image/jpeg', q));
      out.addPage([v1.width, v1.height]).drawImage(im, { x: 0, y: 0, width: v1.width, height: v1.height });
    }
    return await out.save();
  }
  function download(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function mb(n) { return (n / 1048576).toFixed(n > 1048576 * 10 ? 0 : 1) + ' MB'; }
  async function saveFlow(list, base, mode) {
    $('busy').hidden = false; $('busy').textContent = 'Saving…';
    try {
      var bytes, msg;
      if (mode === 'png') {
        list = [pages[curPage - 1]]; bytes = await buildBytes(list);
        var d = await pdfjsLib.getDocument({ data: new Uint8Array(bytes).slice(0) }).promise, pg = await d.getPage(1), v = pg.getViewport({ scale: 2 });
        var c = document.createElement('canvas'); c.width = Math.ceil(v.width); c.height = Math.ceil(v.height);
        var cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
        await pg.render({ canvasContext: cx, viewport: v }).promise;
        var blob = await new Promise(function (r) { c.toBlob(r, 'image/png'); });
        download(blob, base + '-page' + curPage + '.png'); toast('Saved page ' + curPage + ' as PNG'); return true;
      }
      bytes = await buildBytes(list);
      var out = bytes, name = base + '.pdf';
      if (mode !== 'pdf') {
        var lv = { light: [1.6, 0.8], medium: [1.3, 0.6], strong: [1.0, 0.4] }[mode];
        out = await compressBytes(bytes, lv[0], lv[1]); name = base + '-compressed.pdf';
        msg = 'Saved ' + name + ': ' + mb(bytes.length) + ' to ' + mb(out.length);
      } else msg = 'Saved ' + name + ' (' + list.length + ' page' + (list.length > 1 ? 's' : '') + ')';
      download(new Blob([out], { type: 'application/pdf' }), name); toast(msg); return true;
    } catch (err) {
      toast('Could not save. ' + (err && err.message ? err.message : ''));
      return false;
    } finally { $('busy').hidden = true; }
  }
  function openSave(list, base, isFull) {
    modal('<h2>Save as</h2><div class="opts">' +
      '<label><input type="radio" name="sv" value="pdf" checked><span>PDF, full quality<small>Keeps text selectable and searchable.</small></span></label>' +
      '<label><input type="radio" name="sv" value="light"><span>Compressed, light<small>Pages become images, so text is no longer selectable.</small></span></label>' +
      '<label><input type="radio" name="sv" value="medium"><span>Compressed, medium</span></label>' +
      '<label><input type="radio" name="sv" value="strong"><span>Compressed, strong<small>Smallest file, lower sharpness.</small></span></label>' +
      '<label><input type="radio" name="sv" value="png"><span>Current page as PNG<small>Page ' + curPage + ' with your markup.</small></span></label></div>' +
      '<div class="acts"><button class="secondary" id="svCancel">Cancel</button><button class="primary" id="svGo">Save</button></div>');
    $('svCancel').onclick = closeModal;
    $('svGo').onclick = async function () {
      var m = document.querySelector('input[name="sv"]:checked').value; closeModal();
      if (await saveFlow(list, base, m) && isFull && m !== 'png') dirty = false;
    };
  }
  async function makeSample() {
    var doc = await PDFLib.PDFDocument.create(), F = PDFLib.StandardFonts;
    var f = await doc.embedFont(F.Helvetica), fb = await doc.embedFont(F.HelveticaBold), ink = PDFLib.rgb(0.1, 0.12, 0.16), acc = PDFLib.rgb(0.06, 0.42, 0.74);
    function pageOf(title, blocks) {
      var p = doc.addPage([595, 842]), y = 780;
      p.drawText(title, { x: 48, y: y, size: 24, font: fb, color: acc }); y -= 44;
      blocks.forEach(function (b) {
        if (b[0] === 'h') { p.drawText(b[1], { x: 48, y: y, size: 14, font: fb, color: ink }); y -= 24; }
        else b[1].forEach(function (l) { p.drawText(l, { x: 56, y: y, size: 12, font: f, color: ink }); y -= 20; });
        y -= 10;
      });
    }
    pageOf('Percentage: quick revision', [
      ['h', 'Basic formulas'], ['p', ['x% of y = x * y / 100', 'Percentage change = (new - old) / old * 100', 'Successive changes of a% and b% = a + b + ab/100']],
      ['h', 'Income, expenditure, savings'], ['p', ['Income = Expenditure + Savings', 'Take income as 100 parts and split it by the given ratio.']]]);
    pageOf('Worked example', [
      ['h', 'Question'], ['p', ['A man spends 75% of his income. His expenses rise by 20% and his income by 10%.', 'What is the percentage change in his savings?']],
      ['h', 'Solution'], ['p', ['Income 4 : Expenses 3 : Savings 1', 'New income = 4.4, new expenses = 3.6', 'New savings = 4.4 - 3.6 = 0.8', 'Change = (0.8 - 1) / 1 * 100 = -20%', 'Answer: savings decrease by 20%.']]]);
    pageOf('Profit and loss', [
      ['h', 'Key relations'], ['p', ['Profit % = Profit / CP * 100', 'SP = CP * (100 + Profit%) / 100', 'Discount % = Discount / MP * 100', 'Try the highlighter, pen and stamps on this page.']]]);
    var b = await doc.save(); return new File([b], 'Sample-Percentage.pdf', { type: 'application/pdf' });
  }
  $('btnSample').onclick = async function () { openFiles([await makeSample()], 'open'); };
  function baseName() {
    var first = pages.length ? sources[pages[0].src] : null, n = first ? first.name.replace(/\.pdf$/i, '') : 'document';
    return n;
  }
  $('btnSave').onclick = function () { openSave(pages.slice(), baseName() + '-edited', true); };
  $('btnExtract').onclick = function () {
    var list = pages.filter(function (e) { return e.sel; }); if (list.length) openSave(list, baseName() + '-extract', false);
  };

  /* ---------- keyboard ---------- */
  window.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey, tag = (document.activeElement && document.activeElement.tagName) || '';
    var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if (mod && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); $('file').click(); return; }
    if (!pages.length) return;
    if (mod && (e.key === 'f' || e.key === 'F')) { e.preventDefault(); $('q').focus(); $('q').select(); }
    else if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); setScale(scale * 1.2); }
    else if (mod && e.key === '-') { e.preventDefault(); setScale(scale / 1.2); }
    else if (mod && e.key === '0') { e.preventDefault(); $('btnFit').click(); }
    else if (mod && (e.key === 'z' || e.key === 'Z') && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (mod && (e.key === 'y' || e.key === 'Y') && !typing) { e.preventDefault(); redo(); }
    else if (mod && (e.key === 's' || e.key === 'S')) { e.preventDefault(); $('btnSave').click(); }
    else if (!mod && !typing) {
      var k = e.key.toUpperCase();
      for (var i = 0; i < TOOLS.length; i++) {
        if (TOOLS[i][2] === k) { if (k === 'S') toggleStampPop(); else setTool(TOOLS[i][0]); break; }
      }
    }
  });
})();
